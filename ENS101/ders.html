<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENS101 Sıfırdan Ders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f6fb; --paper-2:#ffffff; --paper-3:#eef2fa; --grid:rgba(35,70,168,.055);
  --ink:#111827; --ink-2:#4b5563; --ink-3:#6b7280;
  --blue:#1d4ed8; --blue-soft:#dbeafe; --blue-border:#93c5fd;
  --red:#dc2626; --red-soft:#fee2e2;
  --green:#15803d; --green-soft:#dcfce7;
  --amber:#b45309; --amber-soft:#fef3c7;
  --purple:#6d28d9; --purple-soft:#ede9fe;
  --line:#d5dce8; --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px -12px rgba(29,78,216,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b0f19; --paper-2:#131a2a; --paper-3:#1c2539; --grid:rgba(96,165,250,.05);
  --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
  --blue:#60a5fa; --blue-soft:#1e293b; --blue-border:#2563eb;
  --red:#f87171; --red-soft:#3b181c;
  --green:#4ade80; --green-soft:#143022;
  --amber:#fbbf24; --amber-soft:#362812;
  --purple:#c084fc; --purple-soft:#2b1c44;
  --line:#263147; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0b0f19; --paper-2:#131a2a; --paper-3:#1c2539; --grid:rgba(96,165,250,.05);
  --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
  --blue:#60a5fa; --blue-soft:#1e293b; --blue-border:#2563eb;
  --red:#f87171; --red-soft:#3b181c;
  --green:#4ade80; --green-soft:#143022;
  --amber:#fbbf24; --amber-soft:#362812;
  --purple:#c084fc; --purple-soft:#2b1c44;
  --line:#263147; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.58 "IBM Plex Sans",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
a.off{color:var(--ink-3);cursor:not-allowed;text-decoration:line-through}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
code{font:500 .9em "IBM Plex Mono",monospace;background:var(--paper-3);padding:0 4px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",monospace}

/* Sticky HUD (same studio look as calis.html) */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 18px 10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font:800 1.38rem/1.1 "Outfit",system-ui,sans-serif;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand h1 span.badge-course{background:var(--blue);color:#fff;font-size:.75rem;padding:3px 8px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase}
.brand h1 span.sub{color:var(--red);font-weight:700}
.back{font:600 .8rem "IBM Plex Sans",sans-serif;color:var(--ink-2)}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count{font:500 .82rem "IBM Plex Mono",monospace;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);padding:4px 10px;border-radius:7px}
.count b{color:var(--ink)}
.pill-link{font:600 .8rem "IBM Plex Sans",sans-serif;border:1px solid var(--line);background:var(--paper-2);color:var(--blue);border-radius:7px;padding:4px 10px}
.theme{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);border-radius:7px;padding:4px 10px;font-size:.8rem;font-weight:500}
.bar-wrap{display:flex;align-items:center;gap:12px;margin-top:8px}
.bar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.bar i.g{display:block;height:100%;background:var(--green);width:0;transition:width .35s}
.barlbl{font:500 .76rem "IBM Plex Mono",monospace;color:var(--ink-2);white-space:nowrap}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 90px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.toc{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 10px 12px}
.toc summary{font:700 1rem "Outfit",sans-serif;padding:4px 6px;list-style:none}
.toc summary::-webkit-details-marker{display:none}
.toc details{border:none;padding:0}
.toc h3{font:700 .74rem "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:12px 6px 6px}
.toc a.les{display:grid;grid-template-columns:auto 1fr auto;gap:2px 9px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;border:1.5px solid transparent}
.toc a.les:hover{background:var(--paper-3)}
.toc a.les[aria-current="page"]{background:var(--blue-soft);border-color:var(--blue-border)}
.toc .no{font:600 .74rem "IBM Plex Mono",monospace;background:var(--ink);color:var(--paper-2);border-radius:5px;padding:1px 6px;min-width:28px;text-align:center}
.toc a.les.done .no{background:var(--green)}
.toc .tt{font-size:.88rem;font-weight:600;line-height:1.25;min-width:0}
.toc .pc{font:500 .72rem "IBM Plex Mono",monospace;color:var(--ink-2)}
.toc .mini{grid-column:2/4;height:4px;background:var(--line);border-radius:9px;overflow:hidden}
.toc .mini i{display:block;height:100%;background:var(--green)}
.toc .miss{font-size:.82rem;color:var(--amber);background:var(--amber-soft);padding:7px 9px;border-radius:8px;margin:4px 4px}
.toc a.side{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:8px;font-weight:600;font-size:.88rem;color:var(--ink);border:1.5px solid transparent}
.toc a.side[aria-current="page"]{background:var(--blue-soft);border-color:var(--blue-border)}
.toc a.side:hover{background:var(--paper-3);text-decoration:none}

main{min-width:0}
.sheet{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px 22px 34px;position:relative;margin-bottom:18px}
.sheet::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2.5px;background:var(--blue);opacity:.3}
.sheet.check::before{background:var(--amber);opacity:.7}
.sheet.check.ok::before{background:var(--green)}
.sheet.locked{border-style:dashed;box-shadow:none;background:var(--paper-3);color:var(--ink-2)}
.sheet.locked::before{display:none}
h2{font:700 1.38rem/1.22 "Outfit",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
h3{font:700 1.12rem/1.3 "Outfit",system-ui,sans-serif;margin:18px 0 8px}
h4{font:700 1rem/1.3 "Outfit",system-ui,sans-serif;margin:14px 0 4px}
.teach h3:first-child{margin-top:0}
.teach p{margin:.5em 0}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.note{background:var(--amber-soft);border-left:3.5px solid var(--amber);padding:10px 13px;border-radius:9px;margin:10px 0;font-size:.94rem}
.key{background:var(--blue-soft);border-left:3.5px solid var(--blue);padding:10px 13px;border-radius:9px;margin:10px 0;font-size:.94rem}
.trap{background:var(--red-soft);border-left:3.5px solid var(--red);padding:10px 13px;border-radius:9px;margin:10px 0;font-size:.94rem}
.say{background:var(--green-soft);border-left:3.5px solid var(--green);padding:10px 13px;border-radius:9px;margin:12px 0 4px;font-size:.94rem;color:var(--ink)}
.say p{margin:.35em 0;line-height:1.55}
.say>b:first-child{color:var(--green);font-size:.82rem;letter-spacing:.02em}
ul,ol{padding-left:22px} li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:.77rem;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:600;border:none}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.a{background:var(--amber-soft);color:var(--amber)}
.chip.r{background:var(--red-soft);color:var(--red)}
.lhead .kick{font:600 .78rem "IBM Plex Mono",monospace;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}

/* Question */
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qid{font:600 .8rem "IBM Plex Mono",monospace;background:var(--ink);color:var(--paper-2);padding:2px 8px;border-radius:5px}
.qtitle{font:700 1.02rem "Outfit",sans-serif}
.st{margin-left:auto;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--paper-3);color:var(--ink-2)}
.st.ok{background:var(--green-soft);color:var(--green)}
.st.bad{background:var(--red-soft);color:var(--red)}
.prompt{font-size:1.02rem;padding:2px 0 6px;min-width:0}
.prompt p{margin:.35em 0}
.fld{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}
.fld>label{font:500 .85rem "IBM Plex Mono",monospace;color:var(--ink-2);min-width:24px}
input[type=text],textarea{font:500 .95rem "IBM Plex Mono",monospace;padding:7px 10px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);min-width:0}
input[type=text]{width:220px;max-width:100%}
input.wide{width:340px}
textarea{width:100%;max-width:420px;resize:vertical;line-height:1.45}
input[type=text]:focus,textarea:focus{border-color:var(--blue);outline:2px solid var(--blue);outline-offset:1px}
input.right,textarea.right{border-color:var(--green);background:var(--green-soft)}
input.wrong,textarea.wrong{border-color:var(--red);background:var(--red-soft)}
fieldset.opts{border:none;padding:0;margin:6px 0;display:grid;gap:6px;min-width:0}
fieldset.opts legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.opts label{display:flex;gap:9px;align-items:flex-start;padding:7px 11px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--paper);min-width:0}
.opts label:hover{border-color:var(--blue-border)}
.opts label:focus-within{border-color:var(--blue);outline:2px solid var(--blue);outline-offset:1px}
.opts input{margin-top:5px;accent-color:var(--blue);flex:none}
.opts .ot{min-width:0;overflow-wrap:anywhere}
.opts label.right{border-color:var(--green);background:var(--green-soft)}
.opts label.wrong{border-color:var(--red);background:var(--red-soft)}
.opts code{white-space:pre-wrap}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper-2);padding:7px 14px;border-radius:7px;font-weight:600;font-size:.9rem;transition:filter .15s,transform .15s;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.btn.ok{background:var(--green);border-color:var(--green);color:var(--paper-2)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--paper-2)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);text-decoration:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.fb{margin-top:10px;border-radius:9px}
.fb:empty{display:none}
.fb .res{font-weight:700;font-size:.98rem;padding:10px 13px;border-radius:9px}
.fb .res.ok{background:var(--green-soft);color:var(--green);border-left:3.5px solid var(--green)}
.fb .res.bad{background:var(--red-soft);color:var(--red);border-left:3.5px solid var(--red)}
.fb .ans{margin-top:8px;padding:10px 13px;border-radius:9px;background:var(--paper-3);border:1px solid var(--line);font-size:.94rem}
.fb .ans pre{margin:4px 0;font:500 .9rem/1.45 "IBM Plex Mono",monospace;white-space:pre}
.why{margin-top:8px;padding:10px 13px;border-radius:9px;background:var(--blue-soft);border-left:3.5px solid var(--blue);font-size:.94rem;overflow-x:auto}
.why p{margin:.3em 0}
.hint{margin-top:8px;padding:10px 13px;border-radius:9px;background:var(--amber-soft);border-left:3.5px solid var(--amber);font-size:.94rem}
.en-orig{margin:8px 0 2px;font-size:.88rem;border:none;padding:0}
.en-orig summary{cursor:pointer;color:var(--ink-2);font:600 .85rem "IBM Plex Sans",sans-serif;width:max-content;max-width:100%}
.en-orig>div{margin-top:6px;padding:8px 12px;border-left:3px solid var(--line);background:var(--paper-3);border-radius:6px}
.en-orig ol{margin:.3em 0;padding-left:1.4em}
.lockmsg{display:flex;gap:10px;align-items:center;font-weight:600}

/* MATLAB code */
pre.m{background:var(--paper-3);color:var(--ink);font:400 .88rem/1.55 "IBM Plex Mono",monospace;padding:11px 14px;margin:8px 0;overflow-x:auto;border:1px solid var(--line);border-left:3.5px solid var(--blue);border-radius:8px;white-space:pre;max-width:100%}
pre.out{background:var(--ink);color:var(--paper-2);font:500 .86rem/1.5 "IBM Plex Mono",monospace;padding:9px 14px;margin:6px 0 10px;border-radius:8px;overflow-x:auto;white-space:pre}
pre.out::before{content:"Command Window";display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:2px}
.t-k{color:var(--purple);font-weight:600} .t-b{color:var(--blue)} .t-s{color:var(--green)} .t-c{color:var(--ink-3);font-style:italic} .t-n{color:var(--amber)}

/* Tables */
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
td code,th code{white-space:nowrap}
.tblwrap{overflow-x:auto;margin:8px 0;max-width:100%}
table.trace{width:auto;min-width:min(100%,360px)}
table.trace td,table.trace th{font-family:"IBM Plex Mono",monospace;text-align:center;font-size:.86rem}
table.trace th{text-transform:none}

/* Test / review */
.tq{border-top:1px dashed var(--line);padding:16px 0 10px}
.tq:first-of-type{border-top:none}
.scorebox{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper-3);margin:12px 0}
.scorebox .big{font:800 1.7rem "Outfit",sans-serif}
.rv{border-top:1px dashed var(--line);padding:12px 0}
.rv:first-of-type{border-top:none}
.rvh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rvh .ttl{font-weight:600;flex:1;min-width:180px}
.grid-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.lcard{display:block;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--paper);color:var(--ink)}
.lcard:hover{border-color:var(--blue);text-decoration:none}
.lcard b{font-family:"Outfit",sans-serif}
.lcard .pc{font:500 .76rem "IBM Plex Mono",monospace;color:var(--ink-2)}
.nextnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:10px 18px;border-radius:8px;font-size:.9rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:14px 16px 80px;gap:14px}
  .toc{position:static;max-height:none}
  .toc summary{cursor:pointer}
  .toc summary::after{content:" ▾";color:var(--ink-3)}
}
@media (max-width:680px){
  .top-in{padding:8px 16px 8px}
  .sheet{padding:16px 14px 16px 24px}
  .sheet::before{left:11px}
  .brand{gap:6px 10px}
  .brand h1{font-size:1.1rem}
  .hud-right{margin-left:0;gap:5px}
  .count,.theme,.pill-link{font-size:.72rem;padding:3px 7px}
  input.wide{width:100%}
  input[type=text]{width:100%}
  .fld{flex-wrap:wrap}
  h2{font-size:1.2rem}
  pre.m,pre.out{font-size:.8rem;padding:9px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.btn:hover{transform:none}}
</style>
</head>
<body>
<a class="sr" href="#main">İçeriğe geç</a>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <a class="back" href="../index.html">← Dersler</a>
      <h1><span class="badge-course">IUS</span> ENS101 <span class="sub">Sıfırdan Ders</span></h1>
      <div class="hud-right">
        <span class="count" id="count">Sınav: 21 Kas 12:30</span>
        <a class="pill-link" href="calis.html">← Çalışma sayfası</a>
        <button class="theme" id="langBtn" type="button" aria-live="polite"></button>
        <button class="theme" id="themeBtn" type="button" aria-label="Temayı değiştir">Tema</button>
      </div>
    </div>
    <div class="bar-wrap">
      <div class="bar" role="progressbar" aria-label="Toplam ustalık" aria-valuemin="0" aria-valuemax="100" id="barAll"><i class="g" id="barOk"></i></div>
      <div class="barlbl" id="barLbl"></div>
    </div>
  </div>
</header>
<div class="wrap">
  <aside class="toc" aria-label="Ders listesi">
    <details id="tocDet" open><summary>📚 Ders listesi</summary><nav id="tocNav"></nav></details>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="ders-teori.js"></script>
<script>
/* ================= GENERATORS (seeded; answers computed exactly as MATLAB would) ================= */
function mulberry32(a){a=a>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const RI=(rng,a,b)=>a+Math.floor(rng()*(b-a+1));
const PICK=(rng,arr)=>arr[Math.floor(rng()*arr.length)];
const EH=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const PRE=c=>`<pre class="m">${EH(c)}</pre>`;
const VEC=a=>"["+a.join(" ")+"]";
const MATROWS=A=>"["+A.map(r=>r.join(" ")).join("; ")+"]";
const mmod=(a,b)=>((a%b)+b)%b; /* MATLAB mod: sign of divisor */
function traceTable(head,rows){return`<div class="tblwrap"><table class="trace"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`}
function rand3(rng,lo,hi){const A=[];for(let i=0;i<3;i++){A.push([]);for(let j=0;j<3;j++)A[i].push(RI(rng,lo,hi))}return A}

const GENERATORS={
 countMultiples(rng,args){
  args=args||{};
  const N=RI(rng,12,40);let a,b;
  do{a=RI(rng,2,7);b=RI(rng,2,7)}while(a===b||a%b===0||b%a===0);
  const form=PICK(rng,args.forms||["or","andnot","xor"]);
  const A=`mod(n,${a})==0`,B=`mod(n,${b})==0`,Bn=`mod(n,${b})~=0`;
  const cond=form==="or"?`${A} || ${B}`:form==="andnot"?`${A} && ${Bn}`:`(${A} || ${B}) && ~(${A} && ${B})`;
  const code=`count = 0;\nfor n = 1:${N}\n  if ${cond}\n    count = count + 1;\n  end\nend`;
  const ma=[],mb=[],both=[],hit=[];
  for(let n=1;n<=N;n++){const x=n%a===0,y=n%b===0;if(x)ma.push(n);if(y)mb.push(n);if(x&&y)both.push(n);
    if(form==="or"?(x||y):form==="andnot"?(x&&!y):((x||y)&&!(x&&y)))hit.push(n)}
  const desc={or:`${a}'e ya da ${b}'e bölünenler (ikisine birden bölünen bir kez sayılır)`,andnot:`${a}'e bölünen ama ${b}'e bölünmeyenler`,xor:`${a}'e ya da ${b}'e bölünen ama ikisine birden bölünmeyenler`}[form];
  const descEn={or:`multiples of ${a} or ${b} (a number divisible by both is counted once)`,andnot:`divisible by ${a} but not by ${b}`,xor:`divisible by ${a} or ${b}, but not by both`}[form];
  const whyEn=`<p>Condition: ${descEn}.</p><p>Multiples of ${a}: ${ma.join(", ")||"none"}. Multiples of ${b}: ${mb.join(", ")||"none"}. Multiples of both: ${both.join(", ")||"none"}.</p><p>Counted: ${hit.join(", ")||"none"} → <b>count = ${hit.length}</b></p>`;
  const why=`<p>Koşul: ${desc}.</p><p>${a}'in katları: ${ma.join(", ")||"yok"}. ${b}'in katları: ${mb.join(", ")||"yok"}. İkisinin de katı: ${both.join(", ")||"yok"}.</p><p>Sayılanlar: ${hit.join(", ")||"hiçbiri"} → <b>count = ${hit.length}</b></p>`;
  return{q:`Bu kod çalıştıktan sonra <code>count</code> kaçtır?${PRE(code)}`,en:"What is the value of <code>count</code> after this code runs?",
   fields:[{kind:"num",label:"count",val:hit.length}],why,whyEn,hint:"1'den başlayıp koşulu sağlayan sayıları tek tek yaz, sonra say. mod(n,a)==0 demek n, a'ya kalansız bölünür demek.",
   hintEn:"Starting from 1, write down the numbers that satisfy the condition one by one, then count them. mod(n,a)==0 means n is divisible by a with no remainder.",
   _mat:{code,vars:{count:hit.length}}}},

 condSum(rng,args){
  const N=RI(rng,10,30);let a,b;
  do{a=RI(rng,2,6);b=RI(rng,2,7)}while(a===b||b%a===0||a%b===0);
  const form=PICK(rng,(args&&args.forms)||["andnot","andnot","or"]);
  const cond=form==="andnot"?`mod(k,${a})==0 && mod(k,${b})~=0`:`mod(k,${a})==0 || mod(k,${b})==0`;
  const code=`total = 0;\nfor k = 1:${N}\n  if ${cond}\n    total = total + k;\n  end\nend`;
  const hit=[];let t=0;const rows=[];
  for(let k=1;k<=N;k++){const x=k%a===0,y=k%b===0;const ok=form==="andnot"?(x&&!y):(x||y);if(ok){hit.push(k);t+=k;rows.push([k,t])}}
  const whyEn=`<p>The values of k that satisfy the condition: ${hit.join(", ")||"none"}.</p>${rows.length?traceTable(["k (condition true)","total"],[["start","0"],...rows]):""}<p><b>total = ${t}</b></p>`;
  const why=`<p>Koşulu sağlayan k değerleri: ${hit.join(", ")||"yok"}.</p>${rows.length?traceTable(["k (koşul doğru)","total"],[["başta","0"],...rows]):""}<p><b>total = ${t}</b></p>`;
  return{q:`Bu kod çalıştıktan sonra <code>total</code>'ın değeri nedir?${PRE(code)}`,en:"What is the value of <code>total</code> after this code runs?",
   fields:[{kind:"num",label:"total",val:t}],why,whyEn,hint:"Sadece koşulu sağlayan k'ler total'a eklenir. Önce o k'leri listele, sonra topla.",
   hintEn:"Only the k values that satisfy the condition are added to total. First list those k values, then add them up.",
   _mat:{code,vars:{total:t}}}},

 whileTrace(rng){
  const d=RI(rng,2,4),K=RI(rng,8,20),L=RI(rng,0,Math.max(0,K-2*d-1));const op=PICK(rng,[">",">=",">"]);
  const code=`k = ${K};\ns = 0;\nwhile k ${op} ${L}\n  s = s + k;\n  k = k - ${d};\nend`;
  let k=K,s=0;const rows=[],rowsEn=[];
  while(op===">"?k>L:k>=L){rows.push([k,`${k} ${op} ${L} doğru`,s+k,k-d]);rowsEn.push([k,`${k} ${op} ${L} true`,s+k,k-d]);s+=k;k-=d}
  rows.push([k,`${k} ${op} ${L} yanlış → loop biter`,"",""]);rowsEn.push([k,`${k} ${op} ${L} false → the loop ends`,"",""]);
  const whyEn=`<p>In each iteration the condition is checked first; if it is true, k is added to s, then k decreases by ${d}.</p>${traceTable(["k (at start)","condition","new s","new k"],rowsEn)}<p><b>s = ${s}, k = ${k}</b></p>`;
  const why=`<p>Her turda önce koşula bakılır, doğruysa s'ye k eklenir, sonra k ${d} azalır.</p>${traceTable(["k (başta)","koşul","yeni s","yeni k"],rows)}<p><b>s = ${s}, k = ${k}</b></p>`;
  return{q:`Loop bittikten sonra <code>s</code> ve <code>k</code>'nin değerleri nedir?${PRE(code)}`,en:"What are the values of <code>s</code> and <code>k</code> after the loop?",
   fields:[{kind:"num",label:"s",val:s},{kind:"num",label:"k",val:k}],why,whyEn,hint:"Tablo çiz: sütunlar k, koşul, s. Koşul yanlış olduğu anda dur; o andaki k son değerdir.",
   hintEn:"Draw a table with the columns k, condition, s. Stop as soon as the condition is false; the k at that moment is the final value.",
   _mat:{code,vars:{s,k}}}},

 indexExpr(rng){
  const A=rand3(rng,1,9);const r=RI(rng,1,3),c=RI(rng,1,3),i=RI(rng,1,3),j=RI(rng,1,3),p=RI(rng,1,3),q=RI(rng,1,3);
  const form=RI(rng,1,5);const g=(x,y)=>A[x-1][y-1];const row=x=>A[x-1],col=y=>A.map(rw=>rw[y-1]);const sm=a=>a.reduce((u,v)=>u+v,0);
  let expr,val,why,whyEn;
  if(form===1){expr=`sum(A(${r},:)) + A(${i},${j}) - A(${p},${q})`;val=sm(row(r))+g(i,j)-g(p,q);
    why=`A(${r},:) = ${VEC(row(r))}, toplamı ${sm(row(r))}. A(${i},${j}) = ${g(i,j)}. A(${p},${q}) = ${g(p,q)}. ${sm(row(r))} + ${g(i,j)} − ${g(p,q)} = ${val}.`;
    whyEn=`A(${r},:) = ${VEC(row(r))}, sum ${sm(row(r))}. A(${i},${j}) = ${g(i,j)}. A(${p},${q}) = ${g(p,q)}. ${sm(row(r))} + ${g(i,j)} − ${g(p,q)} = ${val}.`}
  else if(form===2){expr=`sum(A(:,${c})) - A(${i},${j})`;val=sm(col(c))-g(i,j);
    why=`A(:,${c}) column ${c}: ${col(c).join(", ")}, toplamı ${sm(col(c))}. A(${i},${j}) = ${g(i,j)}. ${sm(col(c))} − ${g(i,j)} = ${val}.`;
    whyEn=`A(:,${c}) is column ${c}: ${col(c).join(", ")}, sum ${sm(col(c))}. A(${i},${j}) = ${g(i,j)}. ${sm(col(c))} − ${g(i,j)} = ${val}.`}
  else if(form===3){expr=`A(${i},${j}) * A(${p},${q}) - sum(A(${r},:))`;val=g(i,j)*g(p,q)-sm(row(r));
    why=`A(${i},${j}) = ${g(i,j)}, A(${p},${q}) = ${g(p,q)}, çarpım ${g(i,j)*g(p,q)}. Row ${r} toplamı ${sm(row(r))}. Sonuç ${val}.`;
    whyEn=`A(${i},${j}) = ${g(i,j)}, A(${p},${q}) = ${g(p,q)}, product ${g(i,j)*g(p,q)}. Sum of row ${r} is ${sm(row(r))}. Result ${val}.`}
  else if(form===4){expr=`max(A(${r},:)) + min(A(:,${c}))`;val=Math.max(...row(r))+Math.min(...col(c));
    why=`Row ${r}: ${VEC(row(r))}, max ${Math.max(...row(r))}. Column ${c}: ${col(c).join(", ")}, min ${Math.min(...col(c))}. Toplam ${val}.`;
    whyEn=`Row ${r}: ${VEC(row(r))}, max ${Math.max(...row(r))}. Column ${c}: ${col(c).join(", ")}, min ${Math.min(...col(c))}. Total ${val}.`}
  else{expr=`A(end,${c}) + A(${r},end)`;val=g(3,c)+g(r,3);
    why=`end burada 3 demek (son row ya da son column). A(3,${c}) = ${g(3,c)}, A(${r},3) = ${g(r,3)}. Toplam ${val}.`;
    whyEn=`Here end means 3 (the last row or the last column). A(3,${c}) = ${g(3,c)}, A(${r},3) = ${g(r,3)}. Total ${val}.`}
  const code=`A = ${MATROWS(A)};\ns = ${expr};`;
  return{q:`<code>s</code>'nin değeri nedir?${PRE(code)}`,en:"What is the value of <code>s</code>?",fields:[{kind:"num",label:"s",val}],
   why:`<p>A'yı satır satır yaz:</p>${traceTable(["","col 1","col 2","col 3"],A.map((rw,ix)=>["row "+(ix+1),...rw]))}<p>${why}</p>`,
   whyEn:`<p>Write A row by row:</p>${traceTable(["","col 1","col 2","col 3"],A.map((rw,ix)=>["row "+(ix+1),...rw]))}<p>${whyEn}</p>`,
   hint:"A(r,c): önce row (satır), sonra column (sütun). A(r,:) bütün row r, A(:,c) bütün column c. Saymaya 1'den başla.",
   hintEn:"A(r,c): row first, then column. A(r,:) is the whole of row r, A(:,c) is the whole of column c. Start counting from 1.",
   _mat:{code,vars:{s:val}}}},

 vecOps(rng){
  const B=rand3(rng,1,12);let r=RI(rng,1,3),q=RI(rng,1,3),c=RI(rng,1,3);if(q===r)q=r%3+1;
  const row=x=>B[x-1],col=y=>B.map(rw=>rw[y-1]);const form=RI(rng,1,5);let expr,val,why,whyEn;
  if(form===1){expr=`B(${r},:) + B(${q},:)`;val=row(r).map((x,i)=>x+row(q)[i]);why=`${VEC(row(r))} + ${VEC(row(q))} = ${VEC(val)}`;whyEn=why}
  else if(form===2){expr=`B(:,${c})' .* B(${r},:)`;val=col(c).map((x,i)=>x*row(r)[i]);why=`B(:,${c})' = column ${c}'ün transpose'u = ${VEC(col(c))} (row oldu). .* eleman eleman çarpar: ${VEC(col(c))} .* ${VEC(row(r))} = ${VEC(val)}`;
    whyEn=`B(:,${c})' = the transpose of column ${c} = ${VEC(col(c))} (it became a row). .* multiplies element by element: ${VEC(col(c))} .* ${VEC(row(r))} = ${VEC(val)}`}
  else if(form===3){expr=`B(${r},:) - B(:,${c})'`;val=row(r).map((x,i)=>x-col(c)[i]);why=`B(:,${c})' = ${VEC(col(c))}. ${VEC(row(r))} − ${VEC(col(c))} = ${VEC(val)}`;whyEn=why}
  else if(form===4){expr=`2*B(${r},:) + B(${q},:)`;val=row(r).map((x,i)=>2*x+row(q)[i]);why=`2*${VEC(row(r))} = ${VEC(row(r).map(x=>2*x))}; + ${VEC(row(q))} = ${VEC(val)}`;whyEn=why}
  else{expr=`B(${r},:) .* B(${q},:)`;val=row(r).map((x,i)=>x*row(q)[i]);why=`${VEC(row(r))} .* ${VEC(row(q))} = ${VEC(val)} (eleman eleman)`;whyEn=`${VEC(row(r))} .* ${VEC(row(q))} = ${VEC(val)} (element by element)`}
  const code=`B = ${MATROWS(B)};\nresult = ${expr};`;
  return{q:`<code>result</code> vector'ü nedir? <span class="muted small">Sayıları boşlukla yaz, ör. 3 8 15</span>${PRE(code)}`,en:"What is the vector <code>result</code>?",
   fields:[{kind:"vec",label:"result",val}],why:`<p>${why}</p>`,whyEn:`<p>${whyEn}</p>`,hint:"B(r,:) row r'nin tamamı. B(:,c) column c, yanındaki ' (transpose) onu row'a çevirir. .* aynı sıradaki elemanları çarpar.",
   hintEn:"B(r,:) is the whole of row r. B(:,c) is column c; the ' (transpose) next to it turns it into a row. .* multiplies the elements in the same positions.",
   _mat:{code,vars:{result:val}}}},

 growVec(rng){
  const a=RI(rng,1,3),step=RI(rng,1,3),cnt=RI(rng,3,6);const b=a+step*(cnt-1)+RI(rng,0,step-1);
  const ex=PICK(rng,[["k^2",k=>k*k],["2*k",k=>2*k],["k^2 - 1",k=>k*k-1],["3*k + 1",k=>3*k+1]]);
  const range=step===1?`${a}:${b}`:`${a}:${step}:${b}`;
  const code=`v = [];\nfor k = ${range}\n  v = [v ${ex[0]}];\nend`;
  const ks=[];for(let k=a;k<=b;k+=step)ks.push(k);const v=ks.map(ex[1]);
  const rows=ks.map((k,i)=>[k,ex[1](k),VEC(v.slice(0,i+1))]);
  return{q:`Loop bittikten sonra <code>v</code> vector'ü nedir ve <code>length(v)</code> kaçtır?${PRE(code)}`,en:"What is the vector <code>v</code>, and what is <code>length(v)</code>?",
   fields:[{kind:"vec",label:"v",val:v},{kind:"num",label:"length(v)",val:v.length}],
   why:`<p>k şu değerleri alır: ${ks.join(", ")} (${range}; ${b} aşılmaz).</p>${traceTable(["k",ex[0],"v"],[["","","[]"],...rows])}<p><b>v = ${VEC(v)}, length(v) = ${v.length}</b></p>`,
   whyEn:`<p>k takes these values: ${ks.join(", ")} (${range}; ${b} is not exceeded).</p>${traceTable(["k",ex[0],"v"],[["","","[]"],...rows])}<p><b>v = ${VEC(v)}, length(v) = ${v.length}</b></p>`,
   hint:"v = [v yeni] eski v'nin sonuna yeni elemanı ekler. Önce k'nin aldığı değerleri yaz.",
   hintEn:"v = [v new] adds the new element to the end of the old v. First write down the values k takes.",
   _mat:{code,vars:{v,len:v.length},extra:"len = length(v);"}}},

 nestedPrint(rng){
  const form=RI(rng,1,5);const n=form===5?RI(rng,3,4):RI(rng,3,5);let code,lines=[];
  if(form===1){code=`for k = 1:${n}\n  for j = 1:k\n    fprintf('%d', j);\n  end\n  fprintf('\\n');\nend`;for(let k=1;k<=n;k++){let s="";for(let j=1;j<=k;j++)s+=j;lines.push(s)}}
  else if(form===2){code=`for k = 1:${n}\n  for j = 1:k\n    fprintf('*');\n  end\n  fprintf('\\n');\nend`;for(let k=1;k<=n;k++)lines.push("*".repeat(k))}
  else if(form===3){code=`for k = ${n}:-1:1\n  for j = 1:k\n    fprintf('%d', k);\n  end\n  fprintf('\\n');\nend`;for(let k=n;k>=1;k--)lines.push(String(k).repeat(k))}
  else if(form===4){code=`for k = 1:${n}\n  for j = k:${n}\n    fprintf('%d', j);\n  end\n  fprintf('\\n');\nend`;for(let k=1;k<=n;k++){let s="";for(let j=k;j<=n;j++)s+=j;lines.push(s)}}
  else{code=`for k = 1:${n}\n  for j = 1:k\n    fprintf('%d ', k*j);\n  end\n  fprintf('\\n');\nend`;for(let k=1;k<=n;k++){const a=[];for(let j=1;j<=k;j++)a.push(k*j);lines.push(a.join(" "))}}
  return{q:`Bu kod ne yazdırır (print)? <span class="muted small">Her satırı alt alta yaz.</span>${PRE(code)}`,en:"What does this code print?",
   fields:[{kind:"lines",val:lines}],why:`<p>Dıştaki loop her tur bir satır üretir; içteki loop o satırın karakterlerini yazar; <code>fprintf('\\n')</code> alt satıra geçer.</p>${traceTable(["satır","çıktı"],lines.map((l,i)=>[i+1,EH(l)]))}`,
   whyEn:`<p>The outer loop produces one line per iteration; the inner loop prints the characters of that line; <code>fprintf('\\n')</code> moves to the next line.</p>${traceTable(["line","output"],lines.map((l,i)=>[i+1,EH(l)]))}`,
   hint:"Dıştaki k'nin her değeri için içteki j'nin hangi değerleri aldığını yaz. Satır sonu sadece fprintf('\\n') ile gelir.",
   hintEn:"For each value of the outer k, write down which values the inner j takes. A line ends only with fprintf('\\n').",
   _mat:{code,lines}}},

 polyFunc(rng){
  const name=PICK(rng,["f","g","h","mypoly","calc"]);const form=RI(rng,1,4);const a=RI(rng,2,4),b=RI(rng,1,6),c=RI(rng,1,9);
  let x0=RI(rng,-3,4);if(x0===0)x0=2;let expr,fn;
  if(form===1){expr=`${a}*x^2 - ${b}*x + ${c}`;fn=x=>a*x*x-b*x+c}
  else if(form===2){expr=`x^3 - ${b}*x + ${c}`;fn=x=>x*x*x-b*x+c}
  else if(form===3){expr=`${a}*x^2 + ${b}*x - ${c}`;fn=x=>a*x*x+b*x-c}
  else{expr=`(x + ${a}) * (x - ${b})`;fn=x=>(x+a)*(x-b)}
  const val=fn(x0);const ftext=`function y = ${name}(x)\n  y = ${expr};\nend`;const call=`r = ${name}(${x0});`;
  const code=`${ftext}\n\n${call}`;
  return{q:`<code>r</code>'nin değeri nedir?${PRE(code)}`,en:"What is the value of <code>r</code>?",fields:[{kind:"num",label:"r",val}],
   why:`<p>Call'da x = ${x0}. Expression'da x yerine ${x0} koy: <code>${EH(expr.replace(/x/g,"("+x0+")"))}</code> = <b>${val}</b>. Önce ^ (üs), sonra * , en son + ve −.</p>`,
   whyEn:`<p>In the call, x = ${x0}. Put ${x0} in place of x in the expression: <code>${EH(expr.replace(/x/g,"("+x0+")"))}</code> = <b>${val}</b>. First ^ (power), then *, and last + and −.</p>`,
   hint:"Function'a gönderilen sayı x olur. y'yi hesapla; function'ın döndürdüğü y, r'ye yazılır.",
   hintEn:"The number passed to the function becomes x. Calculate y; the y that the function returns is stored in r.",
   _mat:{code:call,fn:{name,text:ftext},vars:{r:val}}}}
};

  Q(qv("q"),R`p = 2;
q = p;
p = p + 5;`,[N("q",2)],"<p>q = p satırında q'ya 2 kopyalanır. p sonradan 7 olur ama q 2 kalır.</p>","What is the value of <code>q</code>?"),
  {q:"Bir satırın sonuna konan <code>;</code> (semicolon) ne yapar?",en:"What does a semicolon at the end of a statement do?",
   fields:[MC(2,["Satırı comment'e çevirir","Programı o satırda durdurur","Satırın sonucunu Command Window'a yazdırmaz","Satırı bir sonraki satırla birleştirir"],["It turns the line into a comment","It stops the program at that line","It suppresses the output of the line in the Command Window","It joins the line with the next line"])],
   why:"<p><code>;</code> sadece çıktıyı gizler; satır yine çalışır. Comment için <code>%</code> kullanılır.</p>"}]},

 {type:"teach",h:"2. Vector: row ve column",html:`
 <p><b>Vector</b>, sırayla dizilmiş sayılardır. Köşeli parantez <code>[ ]</code> ile yazılır.</p>
 ${P(R`v = [4 7 1 9];      % row vector (1 satır, 4 sütun): boşluk ya da virgül ile ayır
w = [1; 2; 3];       % column vector (3 satır, 1 sütun): ; köşeli parantez içinde YENİ SATIR demek`)}
 <p>Bir elemana <b>index</b> ile ulaşılır: <code>v(2)</code> v'nin 2. elemanı. <b>MATLAB 1'den sayar</b> (C++ gibi 0'dan değil). <code>end</code> "son index" demektir.</p>
 ${P(R`v = [4 7 1 9];
a = v(2);       % 7
b = v(end);     % 9  (end = 4)
v(3) = 0;       % v artık [4 7 0 9]`,{a:7,b:9,v:[4,7,0,9]})}
 <div class="trap"><b>Tuzak:</b> <code>v(0)</code> error verir. İlk eleman <code>v(1)</code>.</div>`},

 {type:"teach",h:"3. Colon operator: a:step:b",html:`
 <p><code>başlangıç:step:bitiş</code> bir row vector üretir. Başlangıçtan başla, step ekle, <b>bitişi geçmeden</b> dur. Step yazılmazsa 1'dir.</p>
 <div class="tblwrap"><table><tr><th>yazılış</th><th>sonuç</th><th>neden</th></tr>
 <tr><td>${C("1:5")}</td><td>${C("[1 2 3 4 5]")}</td><td>step 1</td></tr>
 <tr><td>${C("0:2:10")}</td><td>${C("[0 2 4 6 8 10]")}</td><td>10'a tam denk geldi, dahil</td></tr>
 <tr><td>${C("1:3:12")}</td><td>${C("[1 4 7 10]")}</td><td>sonraki 13 olurdu, 12'yi geçer: durur</td></tr>
 <tr><td>${C("10:-2:3")}</td><td>${C("[10 8 6 4]")}</td><td>negatif step geri sayar; 2 olurdu, 3'ün altına düşer</td></tr>
 <tr><td>${C("5:1")}</td><td>${C("[]")} (boş)</td><td>step 1 ile 5'ten 1'e gidilemez</td></tr></table></div>
 ${P(R`t1 = 0:2:10;
t2 = 1:3:12;
t3 = 10:-2:3;
n = length(t2);    % eleman sayısı: 4`,{t1:[0,2,4,6,8,10],t2:[1,4,7,10],t3:[10,8,6,4],n:4})}
 <div class="key"><b>Yöntem:</b> başlangıcı yaz, step'i ekleyerek devam et; her yeni sayıyı bitişle karşılaştır. Bitişi geçen sayı <b>yazılmaz</b>.</div>`},
 {type:"check",id:"m1-c2",title:"Colon operator",pool:[
  Q("<code>v</code> vector'ü nedir? <span class='muted small'>Sayıları boşlukla yaz.</span>",R`v = 2:3:14;`,[V("v",[2,5,8,11,14])],"<p>2, 5, 8, 11, 14. Sonraki 17 olurdu, 14'ü geçer.</p>","What is the vector <code>v</code>?"),
  Q("<code>v</code> vector'ü nedir?",R`v = 10:-3:1;`,[V("v",[10,7,4,1])],"<p>10, 7, 4, 1. Sonraki −2 olurdu, 1'in altına düşer.</p>","What is the vector <code>v</code>?"),
  Q("<code>v</code> vector'ü nedir?",R`v = 1:4:12;`,[V("v",[1,5,9])],"<p>1, 5, 9. Sonraki 13, 12'yi geçer.</p>","What is the vector <code>v</code>?"),
  Q("<code>length(v)</code> kaçtır?",R`v = 0:5:22;`,[N("length(v)",5)],"<p>v = [0 5 10 15 20], 5 eleman. 25, 22'yi geçer.</p>","What is <code>length(v)</code>?"),
  Q("<code>v</code> vector'ü nedir?",R`v = 20:-4:5;`,[V("v",[20,16,12,8])],"<p>20, 16, 12, 8. Sonraki 4, 5'in altına düşer.</p>","What is the vector <code>v</code>?")]},

 {type:"teach",h:"4. Matrix ve A(row, column)",html:`
 <p><b>Matrix</b>, satır satır yazılmış sayı tablosudur. Köşeli parantez içinde <code>;</code> yeni <b>row</b> (satır) başlatır.</p>
 ${P(R`A = [1 2 3; 4 5 6; 7 8 9];`)}
 ${TT(["","col 1","col 2","col 3"],[["row 1",1,2,3],["row 2",4,5,6],["row 3",7,8,9]])}
 <p><code>A(r, c)</code>: <b>önce row, sonra column</b>. <code>:</code> tek başına "hepsi" demektir.</p>
 ${P(R`A = [1 2 3; 4 5 6; 7 8 9];
x = A(2,3);     % row 2, column 3 -> 6
r = A(2,:);     % row 2'nin tamamı -> [4 5 6]
c = A(:,3);     % column 3'ün tamamı -> [3; 6; 9] (column vector)
y = A(end,1);   % son row, column 1 -> 7`,{x:6,r:[4,5,6],c:[3,6,9],y:7})}
 <p>Sınavda bunlar küçük fonksiyonlarla birlikte gelir: <code>sum(v)</code> elemanları toplar, <code>max(v)</code> en büyüğü, <code>min(v)</code> en küçüğü verir (M2'de ayrıntı).</p>
 <p><b>F25 MATLAB 3:</b></p>
 ${P(R`A = [1 2 3; 4 5 6; 7 8 9];
s = sum(A(:,3)) - A(2,2);`,{s:13})}
 <p>A(:,3) = 3, 6, 9 → toplam 18. A(2,2) = 5. <b>s = 18 − 5 = 13</b>.</p>
 <div class="trap"><b>Tuzak:</b> A(3,2) ile A(2,3) farklı. A(3,2) = 8 (row 3, column 2), A(2,3) = 6.</div>`},
 {type:"check",id:"m1-c3",title:"Matrix indexing",pool:[{gen:"indexExpr"},
  Q(qv("s"),R`A = [1 2 3; 4 5 6; 7 8 9];
s = sum(A(:,3)) - A(2,2);`,[N("s",13)],"<p>Column 3: 3 + 6 + 9 = 18. A(2,2) = 5. 18 − 5 = 13. (F25 MATLAB 3)</p>","What is the value of <code>s</code>?"),
  Q(qv("s"),R`A = [2 4 6; 1 3 5; 8 7 9];
s = sum(A(2,:)) + A(3,1) - A(1,3);`,[N("s",11)],"<p>Row 2: 1 + 3 + 5 = 9. A(3,1) = 8. A(1,3) = 6. 9 + 8 − 6 = 11.</p>","What is the value of <code>s</code>?")]},
 {type:"check",id:"m1-c4",title:"end ve tek eleman",pool:[
  Q(qv("x"),R`A = [5 8 2; 9 4 7];
x = A(end,2);`,[N("x",4)],"<p>end = son row = 2. A(2,2) = 4.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`A = [3 6 1 8; 2 9 5 4];
x = A(2,end) + A(1,3);`,[N("x",5)],"<p>A(2,end) = A(2,4) = 4. A(1,3) = 1. 4 + 1 = 5.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`v = [6 3 9 2 7];
v(2) = v(4) + v(end);
x = v(2);`,[N("x",9)],"<p>v(4) = 2, v(end) = v(5) = 7. v(2) = 9 olur.</p>","What is the value of <code>x</code>?"),
  Q("<code>r</code> nedir?",R`A = [1 2; 3 4; 5 6];
r = A(3,:);`,[V("r",[5,6])],"<p>A(3,:) row 3'ün tamamı: [5 6].</p>","What is <code>r</code>?"),
  {q:`<code>A = [1 2 3; 4 5 6];</code> için <code>A(3,1)</code> ne verir?`,en:"Given <code>A = [1 2 3; 4 5 6];</code>, what does <code>A(3,1)</code> return?",
   fields:[MC(3,["0","7","4","Error"])],why:"<p>A'nın sadece 2 row'u var. Row 3 yok: <b>Index exceeds matrix dimensions</b> error'u.</p>"}]},
 ]};

const M2={id:"m2",no:"M2",part:"kod",title:"Operations and built-in functions",sub:"Element-wise .* ./ .^, transpose, length, size, sum, mean, max/min, mod, zeros.",minutes:35,
 source:"Kitap Ch 16.3, s. 545–548; özet B1; ders kodu burekAdd.m; F25 MATLAB 4",
 blocks:[
 {type:"teach",h:"1. Scalar ile işlem",html:`
 <p>Tek bir sayıya <b>scalar</b> denir. Vector'ü bir scalar ile toplarsan ya da çarparsan işlem <b>her elemana</b> uygulanır. Nokta gerekmez.</p>
 ${P(R`a = [1 2 3];
b = 2*a + 1;     % [3 5 7]
c = a - 10;      % [-9 -8 -7]`,{b:[3,5,7],c:[-9,-8,-7]})}`},
 {type:"teach",h:"2. Element-wise: .* ./ .^",html:`
 <p>İki vector'ün <b>aynı sıradaki elemanlarını</b> çarpmak, bölmek ya da üs almak için operatörün önüne <b>nokta</b> koy. Buna <b>element-wise</b> (eleman eleman) işlem denir.</p>
 ${P(R`a = [1 2 3];
b = [4 5 6];
c = a + b;      % [5 7 9]    (+ ve - zaten eleman eleman)
d = a .* b;     % [4 10 18]  1*4, 2*5, 3*6
e = a .^ 2;     % [1 4 9]
f = b ./ a;     % [4 2.5 2]`,{c:[5,7,9],d:[4,10,18],e:[1,4,9],f:[4,2.5,2]})}
 <div class="trap"><b>Tuzak:</b> Noktasız <code>a * b</code> matrix multiplication'dır. İki 1×3 row vector için <b>error</b> verir (Incorrect dimensions for matrix multiplication). <code>a^2</code> da vector için error verir; <code>a.^2</code> yaz.</div>
 <div class="tblwrap"><table><tr><th>yazılış</th><th>a = [1 2 3], b = [4 5 6]</th></tr>
 <tr><td>${C("a .* b")}</td><td>${C("[4 10 18]")}</td></tr><tr><td>${C("a * b")}</td><td>error</td></tr>
 <tr><td>${C("3 * a")}</td><td>${C("[3 6 9]")} (scalar, nokta gerekmez)</td></tr><tr><td>${C("a .^ 2")}</td><td>${C("[1 4 9]")}</td></tr><tr><td>${C("a ^ 2")}</td><td>error</td></tr></table></div>
 <div class="say" lang="en"><b>Sınavda böyle yaz (EN):</b><p>Element-wise multiplication (.*) multiplies the elements of two vectors one by one, in the same positions. Matrix multiplication (*) follows the rules of linear algebra, and it needs the inner dimensions to agree. For example, for two 1x3 row vectors, a .* b works, but a * b gives an error.</p></div>`},
 {type:"teach",h:"3. Transpose: '",html:`
 <p><code>'</code> (tek tırnak) <b>transpose</b> demektir: row'u column'a, column'u row'a çevirir. Bir column'u bir row ile eleman eleman çarpacaksan önce transpose et, yoksa boyutlar uymaz.</p>
 ${P(R`B = [1 2 3; 4 5 6; 7 8 9];
c = B(:,1)';                 % column 1 = [1; 4; 7], transpose -> [1 4 7]
result = B(:,1)' .* B(3,:);  % [1 4 7] .* [7 8 9] = [7 32 63]`,{c:[1,4,7],result:[7,32,63]})}
 <p><b>F25 MATLAB 4:</b> <code>B = [2 4 6; 1 3 5; 7 9 11]; result = B(2,:) + B(3,:);</code> → [1 3 5] + [7 9 11] = <b>[8 12 16]</b>.</p>`},
 {type:"check",id:"m2-c1",title:"Vector işlemleri",pool:[{gen:"vecOps"},
  Q("<code>result</code> vector'ü nedir?",R`B = [2 4 6; 1 3 5; 7 9 11];
result = B(2,:) + B(3,:);`,[V("result",[8,12,16])],"<p>[1 3 5] + [7 9 11] = [8 12 16]. (F25 MATLAB 4)</p>","What is the vector <code>result</code>?")]},
 {type:"check",id:"m2-c2",title:"Nokta mı, değil mi?",pool:[
  {q:"<code>a = [1 2 3]; b = [4 5 6];</code> İki vector'ü element-wise çarpan satır hangisi?",en:"Which statement multiplies the vectors <code>a</code> and <code>b</code> element by element?",
   fields:[MC(1,CO(["c = a * b;","c = a .* b;","c = a ** b;","c = a ^ b;"]))],why:"<p>Element-wise çarpma <code>.*</code>. Noktasız <code>*</code> matrix multiplication'dır ve iki 1×3 vector için error verir.</p>"},
  {q:"<code>a = [2 4 6]; b = [1 2 3];</code> iken <code>a * b</code> ne verir?",en:"Given <code>a = [2 4 6]; b = [1 2 3];</code>, what is the result of <code>a * b</code>?",
   fields:[MC(2,["[2 8 18]","28","Error","[3 6 9]"])],why:"<p>Nokta yok, bu matrix multiplication. 1×3 ile 1×3 çarpılamaz: <b>error</b>. [2 8 18] için <code>a .* b</code> gerekirdi.</p>"},
  {q:"<code>v = [1 2 3];</code> Her elemanın karesini veren satır hangisi?",en:"Given <code>v = [1 2 3];</code>, which statement squares every element?",
   fields:[MC(3,CO(["w = v^2;","w = v*v;","w = 2.^v;","w = v.^2;"]))],why:"<p><code>v.^2</code> = [1 4 9]. <code>v^2</code> ve <code>v*v</code> error verir. <code>2.^v</code> = [2 4 8], kare değil.</p>"},
  {q:"<code>a = [1 2 3];</code> iken <code>b = 3*a</code> ne verir?",en:"Given <code>a = [1 2 3];</code>, what is <code>b = 3*a</code>?",
   fields:[MC(0,["[3 6 9]","Error","18","[1 2 3 3]"])],why:"<p>Scalar ile çarpmada nokta gerekmez: her eleman 3 ile çarpılır.</p>"},
  Q("<code>y</code> nedir?",R`x = [2 4 8];
y = x ./ 2;`,[V("y",[1,2,4])],"<p>Her eleman 2'ye bölünür: [1 2 4]. (Scalar'a bölmede <code>/</code> de olurdu.)</p>","What is <code>y</code>?")]},
 {type:"teach",h:"4. Built-in functions",html:`
 <p>MATLAB'ın hazır <b>function</b>'ları. Sınavda en çok bunlar çıkıyor:</p>
 <div class="tblwrap"><table><tr><th>function</th><th>ne yapar</th><th>örnek (A = [1 2 3; 4 5 6])</th></tr>
 <tr><td>${C("length(v)")}</td><td>eleman sayısı (matrix'te en büyük boyut)</td><td>${C("length(A)")} → 3</td></tr>
 <tr><td>${C("size(A)")}</td><td>[row sayısı, column sayısı]</td><td>${C("[r, c] = size(A)")} → r = 2, c = 3</td></tr>
 <tr><td>${C("size(A,2)")}</td><td>sadece column sayısı (1 yazarsan row sayısı)</td><td>3</td></tr>
 <tr><td>${C("sum(v)")}</td><td>vector'ün toplamı</td><td>${C("sum([1 2 3])")} → 6</td></tr>
 <tr><td>${C("sum(A)")}</td><td><b>her column'un toplamı</b> (row vector)</td><td>${C("[5 7 9]")}</td></tr>
 <tr><td>${C("mean(v)")}</td><td>ortalama</td><td>${C("mean(A(1,:))")} → 2</td></tr>
 <tr><td>${C("max(v)")}, ${C("min(v)")}</td><td>en büyük / en küçük</td><td>${C("max([4 9 2])")} → 9</td></tr>
 <tr><td>${C("[m, i] = max(v)")}</td><td>değer ve <b>index</b>; eşitlikte ilkini verir</td><td>${C("[m,i] = max([4 9 2 9])")} → 9, 2</td></tr>
 <tr><td>${C("mod(a, b)")}</td><td>a'nın b'ye bölümünden kalan (<b>remainder</b>)</td><td>${C("mod(17,5)")} → 2</td></tr>
 <tr><td>${C("zeros(1, n)")}</td><td>n tane sıfırdan row vector</td><td>${C("zeros(1,4)")} → [0 0 0 0]</td></tr></table></div>
 ${P(R`A = [1 2 3; 4 5 6];
s = sum(A);          % column toplamları: [5 7 9]
[r, c] = size(A);    % r = 2, c = 3
L = length(A);       % 3
v = [4 9 2 9];
[m, i] = max(v);     % m = 9, i = 2 (ilk 9)
k = mod(17, 5);      % 2
z = zeros(1, 4);     % [0 0 0 0]`,{s:[5,7,9],r:2,c:3,L:3,m:9,i:2,k:2,z:[0,0,0,0]})}
 <div class="trap"><b>Tuzak:</b> <code>sum(A)</code> matrix'te tek sayı vermez, <b>column toplamlarını</b> verir. Tek bir row'un toplamı için <code>sum(A(2,:))</code>, hepsinin toplamı için <code>sum(sum(A))</code>.</div>`},
 {type:"check",id:"m2-c3",title:"Built-in functions",pool:[
  Q("<code>s</code> nedir?",R`A = [2 5; 7 1; 3 4];
s = sum(A);`,[V("s",[12,10])],"<p>sum(A) column toplamları: 2 + 7 + 3 = 12, 5 + 1 + 4 = 10.</p>","What is <code>s</code>?",{hint:"Matrix'te sum her column'u ayrı toplar."}),
  Q("<code>m</code> ve <code>i</code> kaçtır?",R`v = [3 8 1 8 5];
[m, i] = max(v);`,[N("m",8),N("i",2)],"<p>En büyük 8. İki tane 8 var; max ilkinin index'ini verir: 2.</p>","What are <code>m</code> and <code>i</code>?"),
  Q(qv("x"),R`x = mod(23, 4) + mod(10, 5);`,[N("x",3)],"<p>23 = 5·4 + 3 → kalan 3. 10, 5'e tam bölünür → 0. Toplam 3.</p>","What is the value of <code>x</code>?"),
  Q("<code>r</code>, <code>c</code> ve <code>n</code> kaçtır?",R`A = [1 2 3 4; 5 6 7 8];
[r, c] = size(A);
n = length(A);`,[N("r",2),N("c",4),N("n",4)],"<p>2 row, 4 column. length en büyük boyut: 4.</p>","What are <code>r</code>, <code>c</code> and <code>n</code>?"),
  Q("<code>m</code>, <code>i</code> ve <code>a</code> kaçtır?",R`v = [6 2 9 3];
[m, i] = min(v);
a = mean(v);`,[N("m",2),N("i",2),N("a",5)],"<p>En küçük 2, index 2. Ortalama (6 + 2 + 9 + 3) / 4 = 20 / 4 = 5.</p>","What are <code>m</code>, <code>i</code> and <code>a</code>?")]},
 {type:"check",id:"m2-c4",title:"Row ve column toplamları",pool:[
  Q(qv("x"),R`A = [1 2; 3 4];
x = sum(A(2,:));`,[N("x",7)],"<p>Row 2 = [3 4], toplam 7.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`A = [1 2; 3 4];
x = sum(sum(A));`,[N("x",10)],"<p>sum(A) = [4 6], sonra sum([4 6]) = 10.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`A = [2 0 1; 5 3 2];
x = sum(A(:,1)) * 2;`,[N("x",14)],"<p>Column 1 = 2, 5 → 7. 7 · 2 = 14.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`A = [4 1; 2 6];
x = mean(A(1,:));`,[N("x",2.5)],"<p>Row 1 = [4 1], ortalama 5 / 2 = 2.5.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`A = [3 1 2; 4 4 1];
x = max(sum(A));`,[N("x",7)],"<p>sum(A) = [7 5 3]. En büyüğü 7.</p>","What is the value of <code>x</code>?")]}
 ]};

const M3={id:"m3",no:"M3",part:"kod",title:"Scripts vs functions",sub:"Function header, dosya adı, bir ya da iki output ile call, function içinden function çağırmak.",minutes:35,
 source:"Kitap Ch 16.2 s. 539 ve 16.4 s. 549; ders kodları cylinderCal.m, addNums.m, burek.m, manager.m; F25 MATLAB 2",
 blocks:[
 {type:"teach",h:"1. Script",html:`
 <p><b>Script</b>, komutların sırayla yazıldığı bir <code>.m</code> dosyasıdır. Çalıştırınca satırlar yukarıdan aşağıya çalışır. Script'in variable'ları <b>workspace</b>'e (ortak alana) yazılır; script workspace'teki variable'ları görür.</p>
 <p>Bir script başka bir script'i <b>adını yazarak</b> çalıştırır. Dersteki <code>manager.m</code>:</p>
 ${P(R`% manager.m
lazyFriends      % lazyFriends.m script'ini çalıştırır
activeFriends    % sonra activeFriends.m'yi çalıştırır`)}
 <div class="say" lang="en"><b>Sınavda böyle yaz (EN):</b><p>A script is a file with a list of commands that run from top to bottom. Its variables are stored in the workspace, so the script can see the workspace variables and I can see them after it runs.</p></div>`},
 {type:"teach",h:"2. Function ve header satırı",html:`
 <p><b>Function</b> bir makine gibidir: <b>input</b> alır, iş yapar, <b>output</b> döndürür. İlk satırına <b>header</b> denir:</p>
 ${P(R`function [V, SA] = cylinderCal(r, h)
  V  = pi * r^2 * h;           % hacim
  SA = 2*pi*r*h + 2*pi*r^2;    % yüzey alanı
end`)}
 ${TT(["parça","anlamı"],[["function","bu dosya bir function"],["[V, SA]","output'lar (birden fazlaysa köşeli parantez)"],["cylinderCal","function'ın adı"],["(r, h)","input'lar"],["end","function'ın sonu"]])}
 <ul><li><b>Dosya adı = function adı:</b> bu function <code>cylinderCal.m</code> dosyasına kaydedilir.</li>
 <li>Function'ın variable'ları <b>local</b>'dir (yereldir): workspace'i görmez, workspace de onları görmez. Dışarıya sadece output'lar çıkar.</li>
 <li><b>Her output'a function içinde değer atanmalı.</b> Atanmazsa call sırasında error: <i>Output argument "SA" not assigned</i>.</li></ul>
 <h4>Call (çağırma)</h4>
 ${P(R`function [V, SA] = cylinderCal(r, h)
  V  = pi * r^2 * h;

 <div class="key">Input'lar <b>sırayla</b> eşleşir: <code>cylinderCal(1, 2)</code> → r = 1, h = 2. Output'lar da sırayla: ilk output v'ye, ikinci s'ye.</div>

const M4={id:"m4",no:"M4",part:"kod",title:"Input and output",sub:"input, disp, fprintf ve format'lar (%d %f %g %s \\n).",minutes:25,
 source:"Kitap Ch 17.1–17.2, s. 564–570; F24 soru 7",
 blocks:[
 {type:"teach",h:"1. input: kullanıcıdan değer almak",html:`
 <p><code>input</code> ekrana bir mesaj (prompt) yazar, kullanıcının yazdığını bekler ve variable'a kaydeder.</p>
 ${P(R`x = input('Enter a number: ');        % sayı alır
name = input('Your name: ', 's');      % 's' ile TEXT alır`)}
 <p>Mesaj tek tırnak içinde yazılır. Text (string) istiyorsan ikinci input olarak <code>'s'</code> ver. F24 soru 7 "kullanıcıdan sayı iste" diye başlıyordu: ilk satır budur.</p>`},
 {type:"teach",h:"2. disp ve fprintf",html:`
 <p><b>disp</b> bir değeri ya da text'i yazar ve <b>otomatik olarak alt satıra geçer</b>. Variable'ın adını yazmaz.</p>
 <p><b>fprintf</b> biçimli (formatted) yazar. Format text'indeki yer tutucuların yerine sırayla değerler konur:</p>
 <div class="tblwrap"><table><tr><th>format</th><th>anlamı</th><th>örnek → çıktı</th></tr>
 <tr><td>${C("%d")}</td><td>tam sayı</td><td>${C("fprintf('%d', 7)")} → 7</td></tr>
 <tr><td>${C("%f")}</td><td>ondalıklı, 6 basamak</td><td>${C("fprintf('%f', pi)")} → 3.141593</td></tr>
 <tr><td>${C("%.2f")}</td><td>2 ondalık basamak</td><td>${C("fprintf('%.2f', pi)")} → 3.14</td></tr>
 <tr><td>${C("%g")}</td><td>kısa biçim, gereksiz sıfır yok</td><td>${C("fprintf('%g', 2.50)")} → 2.5</td></tr>
 <tr><td>${C("%s")}</td><td>text</td><td>${C("fprintf('%s', 'Ada')")} → Ada</td></tr>
 <tr><td>${C("\\n")}</td><td>alt satıra geç</td><td></td></tr></table></div>
 ${P(R`x = 7;
fprintf('x = %d\n', x);
fprintf('%f\n', pi);
fprintf('%.2f\n', pi);
fprintf('%g\n', 2.50);
fprintf('Name: %s\n', 'Ada');
fprintf('%d-%d\n', 3, 4);`,{_out:["x = 7","3.141593","3.14","2.5","Name: Ada","3-4"]})}
 ${OUT(`x = 7\n3.141593\n3.14\n2.5\nName: Ada\n3-4`)}
 <div class="trap"><b>Tuzak:</b> <code>fprintf</code> sonunda <code>\n</code> yoksa alt satıra <b>geçmez</b>; sonraki çıktı aynı satıra yapışır. <code>disp</code> ise her zaman alt satıra geçer.</div>
 ${P(R`disp(5)
fprintf('a');
fprintf('b\n');
disp('c')`,{_out:["5","ab","c"]})}
 ${OUT(`     5\nab\nc`)}
 <p>Bir ipucu daha: <code>fprintf('%d\n', [1 2 3])</code> format'ı her eleman için tekrarlar ve 1, 2, 3'ü alt alta yazar.</p>
 <div class="say" lang="en"><b>Sınavda böyle yaz (EN):</b><p>The disp command displays a value or text and always moves to a new line. The fprintf command prints formatted output. I use %d for an integer, %f for a decimal number, %g for a short format and %s for text. I must write <code>\\n</code> at the end of fprintf to start a new line; disp does this automatically.</p></div>`},

fprintf('n is %d\n', n);`,[LN(["n is 12"])],"<p>%d yerine n'nin değeri (12) gelir.</p>","What does this code print?"),

  Q("Bu kod ne yazdırır (print)? <span class='muted small'>Her satırı alt alta yaz.</span>",R`fprintf('A');
fprintf('B\n');
fprintf('C\n');`,[LN(["AB","C"])],"<p>İlk fprintf'te \\n yok, B aynı satıra yapışır: AB. Sonra C yeni satırda.</p>","What does this code print?"),

fprintf('t = %g s\n', t);`,[LN(["t = 2.5 s"])],"<p>%g kısa biçim: 2.5. Format'taki diğer karakterler (\" s\") aynen yazılır.</p>","What does this code print?")]},

const M5={id:"m5",no:"M5",part:"kod",title:"Conditionals: if, mod, && ||",sub:"Relational ve logical operator'lar, if/elseif/else, = ile == farkı, mod ile bölünebilme, aralık kontrolü.",minutes:40,
 source:"Kitap Ch 18.3–18.4, s. 604–609; ders kodları evenOrOdd.m, elseIF.m; F24 soru 9; F25 MATLAB 1",
 blocks:[
 {type:"teach",h:"1. Relational operators: karşılaştırma",html:`
 <p>Karşılaştırmanın sonucu <b>1 (true)</b> ya da <b>0 (false)</b>'dur.</p>
 <div class="tblwrap"><table><tr><th>operator</th><th>anlamı</th><th>örnek</th></tr>
 <tr><td>${C("==")}</td><td>eşit mi?</td><td>${C("4 == 4")} → 1</td></tr>
 <tr><td>${C("~=")}</td><td>eşit değil mi?</td><td>${C("7 ~= 2")} → 1</td></tr>
 <tr><td>${C("<")} ${C(">")}</td><td>küçük / büyük</td><td>${C("3 > 5")} → 0</td></tr>
 <tr><td>${C("<=")} ${C(">=")}</td><td>küçük eşit / büyük eşit</td><td>${C("6 >= 6")} → 1</td></tr></table></div>
 <div class="trap"><b>En sık hata:</b> <code>=</code> atama, <code>==</code> karşılaştırma. <code>if x = 5</code> <b>error</b> verir; doğrusu <code>if x == 5</code>. Octave'daki <code>!=</code> yerine sınavda <code>~=</code> yaz.</div>
 <div class="say" lang="en"><b>Sınavda böyle yaz (EN):</b><p>A relational operator compares two values, and the result is 1 (true) or 0 (false). The single equal sign = is the assignment operator: it stores a value in a variable. The double equal sign == is the equality operator: it asks if two values are equal. For example, x = 5 stores 5 in x, and x == 5 asks if x is equal to 5.</p></div>`},
 {type:"teach",h:"2. Logical operators: && || ~",html:`
 <div class="tblwrap"><table><tr><th>operator</th><th>anlamı</th><th>ne zaman 1?</th></tr>
 <tr><td>${C("&&")}</td><td>and (ve)</td><td>iki taraf da doğruysa</td></tr>
 <tr><td>${C("||")}</td><td>or (veya)</td><td>en az biri doğruysa</td></tr>
 <tr><td>${C("~")}</td><td>not (değil)</td><td>tersini alır</td></tr></table></div>
 ${P(R`a = (5 > 3);               % 1
b = (4 == 5);              % 0
c = (7 ~= 2);              % 1
d = (3 > 1) && (2 > 4);    % 1 && 0 -> 0
e = (3 > 1) || (2 > 4);    % 1 || 0 -> 1
f = ~(6 >= 6);             % ~1 -> 0`,{a:1,b:0,c:1,d:0,e:1,f:0})}`},
 {type:"check",id:"m5-c1",title:"1 mi 0 mı?",pool:[
  Q(qv("x"),R`x = (8 ~= 3) && (2 >= 5);`,[N("x",0)],"<p>8 ~= 3 → 1. 2 >= 5 → 0. 1 && 0 → 0.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`x = mod(12,4)==0 || mod(12,5)==0;`,[N("x",1)],"<p>12, 4'e tam bölünür → 1. || için biri yeter → 1.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`x = ~(7 > 3);`,[N("x",0)],"<p>7 > 3 → 1, ~1 → 0.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`a = 6;
x = (a > 2) && (mod(a,2) == 0);`,[N("x",1)],"<p>6 > 2 → 1; 6 çift → 1. 1 && 1 → 1.</p>","What is the value of <code>x</code>?"),
  Q(qv("x"),R`x = (10 <= 10) + (3 == 3);`,[N("x",2)],"<p>İkisi de true (1). 1 + 1 = 2: true/false sayı gibi toplanabilir.</p>","What is the value of <code>x</code>?")]},
 {type:"teach",h:"3. if / elseif / else / end",html:`
 ${P(R`if koşul1
  % koşul1 doğruysa
elseif koşul2
  % koşul1 yanlış, koşul2 doğruysa
else
  % hiçbiri doğru değilse
end`)}
 <p>MATLAB koşullara <b>yukarıdan aşağıya</b> bakar. <b>İlk doğru olan branch çalışır, gerisi atlanır.</b> Hiçbiri doğru değilse <code>else</code> çalışır. Her <code>if</code> bir <code>end</code> ile kapanır.</p>
 <p>Dersteki <code>elseIF.m</code>:</p>
 ${P(R`y = 77;
if y > 100
  disp(y)
elseif y > 80
  disp(y*y)
elseif y > 60
  disp('got ya')
else
  disp('we are bored.. we want home')

 {type:"teach",h:"4. mod ile bölünebilme ve aralık kontrolü",html:`
 <p><code>mod(n, a)</code> kalanı verir. <b>Kalan 0 ise n, a'ya bölünür (divisible).</b></p>
 <div class="tblwrap"><table><tr><th>Türkçe</th><th>MATLAB koşulu</th></tr>
 <tr><td>n çift (even)</td><td>${C("mod(n,2) == 0")}</td></tr>
 <tr><td>n tek (odd)</td><td>${C("mod(n,2) == 1")}</td></tr>
 <tr><td>A'ya bölünür ama B'ye bölünmez</td><td>${C("mod(n,A)==0 && mod(n,B)~=0")}</td></tr>
 <tr><td>A'ya ya da B'ye bölünür</td><td>${C("mod(n,A)==0 || mod(n,B)==0")}</td></tr>
 <tr><td>A ya da B, ama ikisi birden değil</td><td>${C("(mod(n,A)==0 || mod(n,B)==0) && ~(mod(n,A)==0 && mod(n,B)==0)")}</td></tr>
 <tr><td>T, 30 ile 80 arasında (dahil)</td><td>${C("T >= 30 && T <= 80")}</td></tr></table></div>
 <div class="trap"><b>Tuzak:</b> <code>30 &lt;= T &lt;= 80</code> MATLAB'da beklediğin şeyi yapmaz: önce <code>30 &lt;= T</code> 0 ya da 1 olur, sonra o sayı 80 ile karşılaştırılır ve hep 1 çıkar. İki koşulu <code>&&</code> ile bağla.</div>
 <p>Dersteki <code>evenOrOdd.m</code> (sınavda yazacağın biçimde):</p>
 ${P(R`function evenOrOdd(x)
  disp(x)
  if mod(x,2) == 0
    disp('This is even')
  else
    disp('This is odd')
  end
end

evenOrOdd(7)`,{_out:["7","This is odd"]})}
 <h4>Kaç sayı? Hızlı sayma</h4>
 <p>1'den N'ye kadar a'nın katı sayısı = N / a'nın tam kısmı. "a ya da b" sayılırken ikisinin de katı olanlar <b>bir kez</b> sayılır: |a katları| + |b katları| − |ikisinin katları|.</p>
 <p><b>F25 MATLAB 1:</b></p>
 ${P(R`count = 0;
for n = 1:20
  if mod(n,4)==0 || mod(n,5)==0
    count = count + 1;
  end
end`,{count:8})}
 <p>4'ün katları: 4, 8, 12, 16, 20 (5 tane). 5'in katları: 5, 10, 15, 20 (4 tane). 20 ikisinde de var. <b>count = 5 + 4 − 1 = 8</b>. (Bu kod bir <b>for loop</b>: n, 1'den 20'ye kadar sırayla değer alır. Ayrıntı M6'da.)</p>`},

 {type:"teach",h:"2. Counter, sum ve product pattern",html:`

 <div class="tblwrap"><table><tr><th>pattern</th><th>loop'tan önce</th><th>loop içinde</th></tr>
 <tr><td><b>counter</b> (saymak)</td><td>${C("count = 0;")}</td><td>${C("count = count + 1;")}</td></tr>

 {type:"teach",h:"3. Loop ile max/min ve index (fued_speed.m)",html:`
 <p>En büyük değeri ve <b>yerini (index)</b> bulmak için: ilk elemanı "şimdilik en büyük" kabul et, sonra her elemanı onunla karşılaştır; daha büyükse hem değeri hem index'i güncelle.</p>
 ${P(R`speed = [20 30 40 50 60 70 80 90 100 110 120 130 140 150 160];
fuel  = [8 7.5 7.3 7 6.6 6.5 6.9 7.4 7.9 8.1 8.2 8.9 9 9.2 10];
maxi = fuel(1);
mini = fuel(1);
index_max = 0;
index_min = 0;
for k = 1:length(fuel)
  if fuel(k) >= maxi
    maxi = fuel(k);
    index_max = k;
  end
  if fuel(k) <= mini
    mini = fuel(k);
    index_min = k;
  end
end
found1 = speed(index_max);   % en yüksek tüketimin hızı: 160
found2 = speed(index_min);   % en düşük tüketimin hızı: 70`,{found1:160,found2:70,maxi:10,mini:6.5})}
 <p>En yüksek tüketim 10 (index 15, hız 160). En düşük 6.5 (index 6, hız 70). Index'i bulunca <b>aynı index ile diğer vector'den</b> hızı okursun: <code>speed(index_min)</code>.</p>

const M7={id:"m7",no:"M7",part:"kod",title:"while loops ve nested loops",sub:"while trace, infinite loop, vector büyütme v = [v k^2], matrix üzerinde nested loop, desen yazdırma.",minutes:40,
 source:"Kitap Ch 19.2, s. 630–632; ders kodları simpleLoop3.m, crazyFor.m, simpleLoop2.m, oddies.m, pirmyds.m",
 blocks:[
 {type:"teach",h:"1. while loop",html:`
 <p><b>while loop</b>, koşul doğru olduğu sürece döner. Koşula <b>her turun başında</b> bakılır. Koşul yanlış olduğu anda loop biter.</p>
 ${P(R`k = 10;
while k > 3
  disp(k)
  k = k - 1;
end`,{_out:["10","9","8","7","6","5","4"],k:3})}
 <p>Dersteki <code>simpleLoop3.m</code>: 10'dan 4'e kadar yazar. k = 3 olunca 3 > 3 yanlış → biter. Loop'tan sonra k = 3.</p>
 <p>Sınav sorusu kalıbı (s ve k):</p>
 ${P(R`k = 10;
s = 0;
while k > 3
  s = s + k;
  k = k - 2;
end`,{s:28,k:2})}
 ${TT(["k (tur başı)","k > 3 ?","yeni s","yeni k"],[[10,"evet",10,8],[8,"evet",18,6],[6,"evet",24,4],[4,"evet",28,2],[2,"hayır → biter","",""]])}
 <p><b>s = 28, k = 2.</b> Dikkat: son k, koşulu bozan değerdir (2), son eklenen değer (4) değil.</p>
 <div class="say" lang="en"><b>Sınavda böyle yaz (EN):</b><p>A while loop repeats a block of code as long as its condition is true. MATLAB checks the condition at the start of each turn. A for loop is used when I know the number of repetitions in advance, because the loop variable takes the values of a vector one by one. A while loop is used when I do not know the number of repetitions, and it stops when the condition becomes false.</p></div>`},
 {type:"check",id:"m7-c1",title:"while trace",pool:[{gen:"whileTrace"},
  Q("Loop'tan sonra <code>s</code> ve <code>k</code> kaçtır?",R`k = 10;
s = 0;
while k > 3
  s = s + k;
  k = k - 2;
end`,[N("s",28),N("k",2)],"<p>k: 10, 8, 6, 4 eklenir (s = 28); k = 2'de koşul yanlış.</p>","What are the values of <code>s</code> and <code>k</code> after the loop?")]},
 {type:"teach",h:"2. Infinite loop",html:`
 <p>Koşul hiç yanlış olmazsa loop sonsuza kadar döner: <b>infinite loop</b>. Program donar (Ctrl+C ile durdurulur). Nedenleri:</p>
 <ul><li>Loop variable'ını değiştirmeyi unutmak (<code>k = k - 1</code> yok).</li>
 <li>Yanlış yöne değiştirmek: <code>while k > 3</code> iken <code>k = k + 1</code>.</li>

 {type:"teach",h:"1. Tarif: function'ı kâğıda yazmak",html:`
 <ol><li><b>Oku:</b> input'lar ne? output'lar ne? Sorudaki örnek call'a bak (ör. <code>MyCheck(n)</code> → input n).</li>
 <li><b>Header'ı yaz:</b> <code>function [output'lar] = ad(input'lar)</code>. Adı sorudaki gibi yaz.</li>
 <li><b>Hemen en alta <code>end</code> yaz.</b> Sonra aradaki boşluğu doldur.</li>
 <li><b>Başlangıç değerleri:</b> <code>count = 0;</code>, <code>total = 0;</code>, <code>maxi = v(1);</code></li>
 <li><b>Loop ve if:</b> M5 ve M6'daki kalıplar.</li>
 <li><b>Her output'a değer ata.</b></li>
 <li><b>Elle test et:</b> sorudaki örnekle kodu izle (trace). Sonuç tutuyor mu?</li></ol>
 <div class="note">Kâğıtta <code>end</code> kullan (<code>endif</code>, <code>endfor</code> değil), <code>~=</code> kullan (<code>!=</code> değil), text için tek tırnak kullan. Bunlar hem MATLAB'da hem Octave'da çalışır.</div>`},
 {type:"teach",h:"2. F24 soru 7: numberInfo (input + üç ayrı if)",html:`
 <p>Kullanıcıdan sayı iste; tek/çift, pozitif/negatif ve karesinden büyük olup olmadığını yazdır.</p>
 ${P(R`function numberInfo()
  x = input('Enter a number: ');

  if mod(x,2) == 0
    disp('even')
  elseif mod(x,2) == 1
    disp('odd')
  else
    disp('not an integer: neither odd nor even')
  end

  if x > 0
    disp('positive')
  elseif x < 0
    disp('negative')
  else
    disp('zero')
  end

  if x > x^2
    disp('larger than its square')
  else
    disp('not larger than its square')
  end
end`)}
 <p><b>Neden üç ayrı if?</b> Üç bağımsız soru var. Hepsini tek if/elseif zincirine koyarsan sadece biri çalışır. Bir sayı karesinden ancak 0 ile 1 arasındaysa büyüktür.</p>`},
 {type:"teach",h:"3. F24 soru 8: bacteria (formül + birim dönüşümü)",html:`
 <p>p = p₀ · 2^(t/20), t dakika.</p>
 ${P(R`function p = bacteria(p0, t)
  p = p0 * 2^(t/20);
end

a = bacteria(100, 60);     % 60 dk = 3 kez ikiye katlanma: 800`,{a:800})}
 <p><b>Değişiklik:</b> kullanıcı saat gönderirse dakikaya çevir (<code>t*60</code>), saniye gönderirse (<code>t/60</code>).</p>
 ${P(R`function p = bacteriaUnit(p0, t, unit)
  if unit == 'h'
    t = t * 60;
  elseif unit == 's'
    t = t / 60;
  end
  p = p0 * 2^(t/20);
end

b = bacteriaUnit(100, 1, 'h');
c = bacteriaUnit(100, 3600, 's');`,{b:800,c:800})}`},
 {type:"teach",h:"4. F24 soru 9: tempCheck (aralık uyarısı)",html:`
 ${P(R`function tempCheck(T)
  if T < 30
    disp('WARNING: too cold')
  elseif T > 80
    disp('WARNING: too hot')
  else
    disp('Temperature is OK')
  end
end

tempCheck(25)
tempCheck(55)
tempCheck(95)`,{_out:["WARNING: too cold","Temperature is OK","WARNING: too hot"]})}
 <p>Sınırlar (30 ve 80) "OK" sayılır çünkü <code>&lt;</code> ve <code>&gt;</code> eşitliği dışarıda bırakır.</p>`},
 {type:"teach",h:"5. F24 soru 10: fuelAnalysis (max/min + plot)",html:`
 ${P(R`function [vMax, vMin] = fuelAnalysis(speed, fuel)
  maxi = fuel(1);  iMax = 1;
  mini = fuel(1);  iMin = 1;
  for k = 2:length(fuel)
    if fuel(k) > maxi
      maxi = fuel(k);
      iMax = k;
    end
    if fuel(k) < mini
      mini = fuel(k);
      iMin = k;
    end
  end
  vMax = speed(iMax);
  vMin = speed(iMin);
  fprintf('Highest consumption %g at speed %g\n', maxi, vMax);
  fprintf('Lowest consumption %g at speed %g\n', mini, vMin);

  plot(speed, fuel, '-o')
  xlabel('Speed (km/h)')
  ylabel('Fuel consumption (g/km)')
  title('Speed vs fuel consumption')
  grid on
end

[a, b] = fuelAnalysis([20 40 60 80], [9 7 6.5 8]);`,{a:20,b:60})}

 <div class="tblwrap"><table><tr><th>komut</th><th>ne yapar</th></tr>

 <tr><td>${C("plot(x, y, '-o')")}</td><td>çizgi + daire işaretli noktalar</td></tr>

 <p>"Her veri için çalışsın" denirse veriyi function'ın içine yazma; input olarak al.</p>`},
 {type:"teach",h:"6. F25 MATLAB 6 ve 7: myMean ve MyCheck",html:`
 ${P(R`function m = myMean(A, r)
  m = mean(A(r,:));
end

function m = myMeanLoop(A, r)
  [rows, cols] = size(A);
  total = 0;
  for j = 1:cols
    total = total + A(r,j);
  end
  m = total / cols;
end

m1 = myMean([1 5; 5 5], 2);
m2 = myMeanLoop([2 4 6; 1 2 3], 1);`,{m1:5,m2:4})}

function hl(src){
  let o="",i=0,prev="";const n=src.length;
  while(i<n){const ch=src[i];
    if(ch==="%"){let j=src.indexOf("\n",i);if(j<0)j=n;o+=`<span class="t-c">${esc(src.slice(i,j))}</span>`;i=j;prev="";continue}
    if(ch==='"'||(ch==="'"&&!/[\w)\]'.]/.test(prev))){let j=i+1;while(j<n&&src[j]!==ch&&src[j]!=="\n")j++;j=Math.min(j+1,n);o+=`<span class="t-s">${esc(src.slice(i,j))}</span>`;i=j;prev=ch;continue}
    if(/[A-Za-z_]/.test(ch)){let j=i;while(j<n&&/\w/.test(src[j]))j++;const w=src.slice(i,j);
      o+=KW.has(w)?`<span class="t-k">${w}</span>`:BI.has(w)?`<span class="t-b">${w}</span>`:w;i=j;prev="a";continue}
    if(/\d/.test(ch)){let j=i;while(j<n&&/[\d.]/.test(src[j])&&!(src[j]==="."&&/[*\/^']/.test(src[j+1]||"")))j++;o+=`<span class="t-n">${src.slice(i,j)}</span>`;i=j;prev="1";continue}
    o+=esc(ch);if(!/\s/.test(ch))prev=ch;i++}
  return o}

  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");else s=s.replace(/,/g,".");

/* question serving: same seed + index => same question after reload */
function randSeed(){return Math.floor(Math.random()*2e9)+1}
function permFor(n,seed){const r=mulberry32(seed),a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(item,seed){if(!item.gen)return item;try{return GENERATORS[item.gen](mulberry32(seed),item.args||{})}catch(e){console.error(e);return null}}
function qAt(check,k,seed){const pool=check.pool.filter(validItem);const perm=permFor(pool.length,seed);
  return build(pool[perm[k%pool.length]],seed*31+k*977+7)||pool.find(x=>!x.gen)}
function qSlot(map,id){if(!map[id])map[id]={seed:randSeed(),k:0,res:null,vals:null};return map[id]}

/* rendering a question */
function fieldsHTML(q,pid,st){
  const done=!!st.res,vals=st.vals||[],per=st.per||[];
  return q.fields.map((f,i)=>{const id=`${pid}-f${i}`,cls=done?(per[i]?" right":" wrong"):"";const dis=done?" disabled":"";
    if(f.kind==="mc")return`<fieldset class="opts"><legend>Seçenekler</legend>${optsOf(f,q).map((o,j)=>{
        const sel=vals[i]===String(j);const c=done?(j===f.ans?" right":sel?" wrong":""):"";
        return`<label class="${c}"><input type="radio" name="${id}" value="${j}"${sel?" checked":""}${dis}><span class="ot">${o}</span></label>`}).join("")}</fieldset>`;
    const lab=f.label?`<label for="${id}">${esc(f.label)}</label>`:"";const aria=f.label?"":` aria-label="Cevap"`;
    const v=vals[i]!=null?esc(vals[i]):"";
    if(f.kind==="lines")return`<div class="fld">${lab}<textarea id="${id}" rows="${Math.max(3,f.val.length+1)}" class="code-area${cls}" spellcheck="false" placeholder="Her satırı alt alta yaz"${aria}${dis}>${v}</textarea></div>`;
    const ph=f.kind==="vec"?"ör. 2 5 9":f.kind==="num"?"sayı":"cevap";
    return`<div class="fld">${lab}<input type="text" id="${id}" class="${f.kind==="vec"?"wide":""}${cls}" value="${v}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ph}"${aria}${dis}></div>`}).join("")}
function enHTML(q){if(EN()||!q.en)return"";const mcf=q.fields.find(f=>f.kind==="mc")||{};const eo=q.enOpts||mcf.enOpts||[];const o=eo.length?`<ol type="A">${eo.map(x=>`<li>${x}</li>`).join("")}</ol>`:"";
  return`<details class="en-orig"><summary>Sınavdaki yazılışı (EN)</summary><div>${q.en}${o}</div></details>`}
function fbHTML(q,st){if(!st.res)return"";const ok=st.res==="ok";const some=(st.per||[]).some(Boolean);
  let h=`<div class="res ${ok?"ok":"bad"}">${ok?"✓ Doğru!":some&&q.fields.length>1?"✗ Kısmen doğru. Bu doğru sayılmaz.":"✗ Yanlış."}</div>`;
  if(!ok)h+=`<div class="ans"><b>Doğru cevap:</b> ${q.fields.map(f=>(f.label?`<span class="mono">${esc(f.label)}</span> = `:"")+fmtAns(f)).join(" &nbsp;·&nbsp; ")}</div>`;
  if(whyOf(q))h+=`<div class="why">${whyOf(q)}</div>`;return h}
function readVals(q,pid){return q.fields.map((f,i)=>{const id=`${pid}-f${i}`;if(f.kind==="mc"){const r=$(`input[name="${id}"]:checked`);return r?r.value:null}const el=document.getElementById(id);return el?el.value:null})}

function questionCard(mode,id,q,st,extra){ /* mode: L (lesson), D (drill) */

function testQ(l,b,i,t){const pool=b.pool.filter(validItem);const r=mulberry32(t.seed+t.n*1013+i*37);const item=pool[Math.floor(r()*pool.length)];return build(item,t.seed*17+t.n*131+i*7+3)||pool.find(x=>!x.gen)}

  const card=e.target.closest(".check, .rv");if(!card)return;const btn=card.querySelector('[data-act="check"]');if(btn){e.preventDefault();btn.click()}});
const langBtn=$("#langBtn");
function paintLang(){langBtn.textContent="Soru dili: "+(EN()?"EN":"TR");langBtn.setAttribute("aria-label",EN()?"Soru dili İngilizce, Türkçeye geçmek için tıkla":"Soru dili Türkçe, İngilizceye geçmek için tıkla")}
langBtn.addEventListener("click",()=>{LANGV=EN()?"tr":"en";store.set("lang",LANGV);paintLang();rerender()});
paintLang();
$("#themeBtn").addEventListener("click",()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.dataset.theme=cur==="dark"?"light":"dark";try{localStorage.setItem("ens101:theme",JSON.stringify(r.dataset.theme))}catch(e){}});
try{const th=JSON.parse(localStorage.getItem("ens101:theme"));if(th==="dark"||th==="light")document.documentElement.dataset.theme=th}catch(e){}
const mq=matchMedia("(max-width:900px)");const setToc=()=>{$("#tocDet").open=!mq.matches};setToc();mq.addEventListener("change",setToc);
$("#tocNav").addEventListener("click",e=>{if(mq.matches&&e.target.closest("a"))$("#tocDet").open=false});
window.addEventListener("hashchange",()=>route(true));
tick();setInterval(tick,30000);route(false);
</script>
</body>
