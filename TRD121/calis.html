<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRD121 · Midterm Stüdyosu</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f6fb; --paper-2:#ffffff; --paper-3:#eef2fa; --grid:rgba(35,70,168,.055);
  --ink:#111827; --ink-2:#4b5563; --ink-3:#6b7280;
  --blue:#1d4ed8; --blue-soft:#dbeafe; --blue-border:#93c5fd;
  --red:#dc2626; --red-soft:#fee2e2;
  --green:#15803d; --green-soft:#dcfce7;
  --amber:#b45309; --amber-soft:#fef3c7;
  --purple:#6d28d9; --purple-soft:#ede9fe;
  --line:#d5dce8; --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px -12px rgba(29,78,216,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b0f19; --paper-2:#131a2a; --paper-3:#1c2539; --grid:rgba(96,165,250,.05);
  --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
  --blue:#60a5fa; --blue-soft:#1e293b; --blue-border:#2563eb;
  --red:#f87171; --red-soft:#3b181c;
  --green:#4ade80; --green-soft:#143022;
  --amber:#fbbf24; --amber-soft:#362812;
  --purple:#c084fc; --purple-soft:#2b1c44;
  --line:#263147; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0b0f19; --paper-2:#131a2a; --paper-3:#1c2539; --grid:rgba(96,165,250,.05);
  --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
  --blue:#60a5fa; --blue-soft:#1e293b; --blue-border:#2563eb;
  --red:#f87171; --red-soft:#3b181c;
  --green:#4ade80; --green-soft:#143022;
  --amber:#fbbf24; --amber-soft:#362812;
  --purple:#c084fc; --purple-soft:#2b1c44;
  --line:#263147; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.58 "IBM Plex Sans",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 18px 0}
.brand{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.brand h1{font:800 1.38rem/1.1 "Outfit",system-ui,sans-serif;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand h1 span.badge-course{background:var(--blue);color:#fff;font-size:.75rem;padding:3px 8px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase}
.brand h1 span.sub{color:var(--red);font-weight:700}
.hud-back{font:600 .78rem "IBM Plex Mono",monospace;color:var(--ink-2);border:1px solid var(--line);background:var(--paper-2);padding:3px 8px;border-radius:7px}
.hud-back:hover{color:var(--blue);text-decoration:none}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count{font:500 .82rem "IBM Plex Mono",monospace;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);padding:4px 10px;border-radius:7px}
.count b{color:var(--ink)}
.pomo-pill{display:flex;align-items:center;gap:6px;background:var(--paper-2);border:1px solid var(--line);padding:3px 9px;border-radius:7px;font:600 .8rem "IBM Plex Mono",monospace}
.pomo-pill button{border:none;background:var(--blue-soft);color:var(--blue);border-radius:4px;padding:2px 6px;font-size:.74rem;font-weight:600}
.search-trigger{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);border-radius:7px;padding:4px 10px;font-size:.8rem;display:flex;align-items:center;gap:6px}
.search-trigger kbd{font:500 .72rem "IBM Plex Mono",monospace;background:var(--paper-3);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.theme{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);border-radius:7px;padding:4px 10px;font-size:.8rem;font-weight:500}

.bar-wrap{display:flex;align-items:center;gap:12px;margin-top:8px}
.bar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.bar i.g{display:block;height:100%;background:var(--green);width:0;transition:width .35s}
.bar i.r{display:block;height:100%;background:var(--red);width:0;transition:width .35s}
.barlbl{font:500 .76rem "IBM Plex Mono",monospace;color:var(--ink-2);white-space:nowrap}

nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:1px solid transparent;border-bottom:none;background:none;color:var(--ink-2);padding:8px 13px;border-radius:9px 9px 0 0;white-space:nowrap;font-weight:600;font-size:.9rem;transition:all .15s}
nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--paper-2) 50%,transparent)}
nav button[aria-selected="true"]{background:var(--paper-2);color:var(--blue);border-color:var(--line);box-shadow:0 1px 0 var(--paper-2)}
nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}

main{max-width:1120px;margin:0 auto;padding:20px 18px 90px}
.sheet{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px 22px 34px;position:relative;margin-bottom:18px;overflow-wrap:anywhere;word-break:normal}
.sheet::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2.5px;background:var(--blue);opacity:.3}
h2{font:700 1.38rem/1.22 "Outfit",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
h3{font:700 1.1rem/1.3 "Outfit",system-ui,sans-serif;margin:18px 0 8px}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:.77rem;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:600;border:none}
.chip.purple{background:var(--purple-soft);color:var(--purple)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}
button.chip:hover{filter:brightness(1.06);text-decoration:underline}

.filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;padding:10px;background:var(--paper-3);border-radius:10px;border:1px solid var(--line)}
.filter-btn{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);padding:5px 11px;border-radius:7px;font-size:.82rem;font-weight:600;transition:all .15s}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.filter-btn.warn:not(.active){color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}

.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qid{font:600 .8rem "IBM Plex Mono",monospace;background:var(--ink);color:var(--paper-2);padding:2px 8px;border-radius:5px}
.qsrc{display:inline-block;font:500 .75rem "IBM Plex Mono",monospace;color:var(--ink-2);background:var(--paper-3);padding:2px 7px;border-radius:5px;border:1px solid var(--line);margin-top:6px}
.st{margin-left:auto;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px}
.st.ok{background:var(--green-soft);color:var(--green)}
.st.bad{background:var(--red-soft);color:var(--red)}
.st.mut{background:var(--paper-3);color:var(--ink-2)}

.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper-2);padding:7px 14px;border-radius:7px;font-weight:600;font-size:.9rem;transition:all .15s}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{background:var(--red);border-color:var(--red);color:#fff}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.sol{margin-top:10px;padding:13px 15px;border-radius:9px;background:var(--blue-soft);border-left:3.5px solid var(--blue)}
.sol p{margin:.2em 0 .4em}

/* Konular */
.oz{border-top:1px dashed var(--line);padding-top:4px;margin-top:10px}
.oz:first-of-type{border-top:none}
.oz ul{margin:4px 0 4px;padding-left:1.2em}
.oz li{margin:3px 0}
details{border-top:1px dashed var(--line);padding:11px 0}
summary{cursor:pointer;font:700 1.04rem "Outfit",system-ui,sans-serif}
details[open] summary{margin-bottom:8px;color:var(--blue)}
.rule{background:var(--paper-3);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.rule-k{font-weight:500;margin-bottom:8px}
.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex{border-radius:8px;padding:8px 11px;font-size:.93rem}
.ex.ok{background:var(--green-soft);border-left:3px solid var(--green)}
.ex.bad{background:var(--red-soft);border-left:3px solid var(--red)}
.ex .exl{display:block;font:700 .74rem "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.ex.ok .exl{color:var(--green)} .ex.bad .exl{color:var(--red)}
/* No strike-through on wrong examples: it hides the very commas and dots the rule is about. */
.ex div{white-space:pre-line}
.rule-not{margin-top:8px;font-size:.88rem;background:var(--amber-soft);color:var(--ink);border-left:3px solid var(--amber);padding:6px 10px;border-radius:7px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:0 0 0 3px transparent}}

/* Alıştırma */
.lockband{background:var(--amber-soft);color:var(--amber);border-left:3.5px solid var(--amber);padding:8px 12px;border-radius:8px;font-weight:600;font-size:.9rem;margin-bottom:10px}
.oncul{white-space:pre-line;background:var(--paper-3);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-bottom:10px}
.stem{font-size:1.05rem;font-weight:500;margin-bottom:8px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper-3);color:var(--ink);padding:9px 12px;border-radius:9px;transition:border-color .12s,background .12s;min-width:0}
.opt:not(:disabled):hover{border-color:var(--blue)}
.opt .let{flex:none;font:700 .85rem "IBM Plex Mono",monospace;width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:6px;background:var(--paper-2);border:1px solid var(--line)}
.opt .otx{min-width:0;overflow-wrap:anywhere}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .let{background:var(--green);color:#fff;border-color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .let{background:var(--red);color:#fff;border-color:var(--red)}
.opt.dim{opacity:.6}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .let{background:var(--blue);color:#fff;border-color:var(--blue)}
.fbk{margin-top:12px;font-weight:700}
.fbk.ok{color:var(--green)} .fbk.bad{color:var(--red)}
.stats{display:flex;flex-wrap:wrap;gap:6px;font:500 .78rem "IBM Plex Mono",monospace;color:var(--ink-2)}
.stats span{background:var(--paper-3);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.stats b.g{color:var(--green)} .stats b.r{color:var(--red)}

/* Kartlar */
.fc-big{background:var(--paper-3);border:1.5px solid var(--line);border-radius:12px;padding:18px 20px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:border-color .15s,background .15s;margin-top:12px}
.fc-big:hover{border-color:var(--blue)}
.fc-big.flipped{background:var(--blue-soft);border-color:var(--blue)}
.fc-top{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.fc-main{margin:16px 0;font-size:1.12rem;font-weight:500;text-align:center}
.fc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-2)}

/* Deneme */
.den-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font:600 1.5rem "IBM Plex Mono",monospace;color:var(--blue)}
.clock.low{color:var(--red)}
.navgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin:12px 0}
.nb{border:1.5px solid var(--line);background:var(--paper-2);color:var(--ink-2);border-radius:6px;padding:5px 0;font:600 .8rem "IBM Plex Mono",monospace}
.nb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.nb.cur{outline:2.5px solid var(--amber);outline-offset:1px}
.nb.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.nb.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.big-score{font:800 2.4rem/1 "Outfit",system-ui,sans-serif}
.rev{border-top:1px dashed var(--line);padding:12px 0}
.rev .ans-line{font-size:.9rem;margin:3px 0}

/* İlerleme */
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.tblwrap{overflow-x:auto}
.prow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);min-width:60px}
.meter .g{background:var(--green)} .meter .r{background:var(--red)} .meter .b{background:var(--blue)}
.pnum{font:500 .8rem "IBM Plex Mono",monospace;color:var(--ink-2);text-align:right}
.err{border-top:1px dashed var(--line);padding:12px 0}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);text-align:center}

/* Arama */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,15,28,.65);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 20px}
.modal-backdrop[hidden]{display:none}
.modal-box{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;width:100%;max-width:620px;box-shadow:var(--shadow);overflow:hidden}
.modal-box input{width:100%;border:none;border-bottom:1px solid var(--line);padding:14px 16px;font:500 1rem "IBM Plex Sans",system-ui,sans-serif;border-radius:0;background:var(--paper-2);color:var(--ink);outline:none}
.modal-results{max-height:60vh;overflow-y:auto;padding:8px}
.modal-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;gap:10px;width:100%;text-align:left;border:none;background:none;color:var(--ink)}
.modal-item:hover,.modal-item:focus-visible,.modal-item.act{background:var(--blue-soft)}
.modal-item .mi-t{min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.modal-item .mi-t small{display:block;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:10px 18px;border-radius:8px;font-size:.9rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}

@media (max-width:640px){
  .rule-grid{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr auto}
  .prow .meter{grid-column:1 / -1;grid-row:2}
}
@media (max-width:520px){
  .top-in{padding:8px 12px 0}
  main{padding:14px 10px 80px}
  .sheet{padding:16px 14px 16px 22px}
  .sheet::before{left:10px}
  .brand h1{font-size:1.15rem}
  .search-trigger kbd,.hide-sm{display:none}
  .hud-right{margin-left:0}
  .navgrid{gap:4px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <a class="hud-back" href="../index.html">← Dersler</a>
      <h1><span class="badge-course">IUS</span> TRD121 <span class="sub">Midterm Stüdyosu</span></h1>
      <div class="hud-right">
        <span class="count" id="count">Sınav: 20 Kas 17:45</span>
        <div class="pomo-pill" title="Pomodoro çalışma sayacı">
          <span aria-hidden="true">🍅</span><span id="pomoClock" aria-label="Pomodoro kalan süre">25:00</span>
          <button type="button" id="pomoToggle">Başlat</button>
          <button type="button" id="pomoReset" aria-label="Pomodoro sıfırla">↺</button>
        </div>
        <button class="search-trigger" id="searchBtn" type="button" aria-haspopup="dialog"><span>⌕ Ara</span><kbd>Ctrl+K</kbd></button>
        <button class="theme" id="themeBtn" type="button" aria-label="Açık ya da koyu temaya geç">Tema</button>
      </div>
    </div>
    <div class="bar-wrap">
      <div class="bar" aria-hidden="true"><i class="g" id="barOk"></i><i class="r" id="barBad"></i></div>
      <div class="barlbl" id="barLbl"></div>
    </div>
    <nav role="tablist" aria-label="Bölümler" id="tabs"></nav>
  </div>
</header>

<main id="main"></main>

<div class="modal-backdrop" id="searchModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-label="Hızlı arama">
    <input type="text" id="searchInput" placeholder="Kural, konu, soru ya da kart ara (ör. bağlaç de, ki, büyük harf)…" autocomplete="off" aria-label="Arama">
    <div class="modal-results" id="searchResults"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*VERI-BASLA*/const VERI = [{"id":"d1","ders":1,"baslik":"Dilin Tanımı ve Özellikleri","kisa":"Dilin tanımı","ozet":[{"baslik":"Dilin tanımı ve insana özgülüğü","maddeler":["Dil, insanların duygu ve düşüncelerini kelimelerle ya da işaretlerle bildirmek için yaptıkları <b>anlaşmadır</b>.","Hayvanlarda da iletişim vardır; ses, koku ve tatlarla sağlanır, <b>kalıtımla</b> nesilden nesile geçer ve hemen hemen hiç değişmez.","Hayvan işaretleri yalnızca <b>yakın geçmiş ve yakın gelecekteki</b> eylemleri anlatır; insan dilindeki uzak geçmişi ve uzak geleceği anlatma özelliği onlarda yoktur.","İnsan dili <b>öğrenilir</b> ve hayvanlarda bulunmayan <b>konuşmaya</b> dayanır.","Dünyada hem konuşabilen hem de alet yapabilen tek varlık insandır; dilleri olmadığı için hayvanlara meslek öğretilememiştir.","Sonuç: dil insana özgüdür ve yalnız onun konuşma yeteneğidir."],"kaynak":"Ders 1, s. 3"},{"baslik":"1. Dil bildirişim aracıdır","maddeler":["Dil, insanın duygu ve düşüncelerini anlatmaya yarayan bir araçtır.","Dilin “araç olma” görevine ilk kez <b>Eflatun</b>, <b>Kratylos</b> adlı eserinde değinmiştir: burgu delme, mekik dokuma aracıdır; ad da nesneleri adlandırma aracıdır.","Dili öteki araçlardan ayıran fark: insan diğer araçları istediği gibi kullanır, ama dili kullanırken onun <b>doğal kurallarına uymak zorundadır</b>.","Örnek: Türkçede yumuşak ünsüzler yumuşaklarla, sert ünsüzler sertlerle yan yana gelir; “kitapcı”, “sevinti” denemez. Söz dizimine aykırı cümle de kurulamaz.","Bu, dilin kullanımının kısıtlı olduğu anlamına gelmez: kurallara uyulduğu sürece insan dili istediği gibi kullanmakta <b>özgürdür</b>.","Dillerin <b>üretkenliği sınırsızdır</b>: yeni nesne ve kavramlara yeni adlar verilir, hiç söylenmemiş cümleler kurulabilir (örnek: computer karşılığı <i>bilgisayar</i>)."],"kaynak":"Ders 1, s. 3-4"},{"baslik":"2. Dil, duygu ve düşünce arasında bağ vardır","maddeler":["İnsanı diğer canlılardan ayıran <b>düşünme yeteneğidir</b>.","En karmaşıkları dâhil tüm duygu ve düşünceler herhangi bir dille ifade edilebilir.","El, kol hareketleri ve mimikler de duygu ve düşünce aktarır, ama yalnızca bir kısmını ve kısıtlı olarak.","Dildeki sınırlı sayıda sözcük ve kuralla <b>sonsuz üretim</b> yapılabilir.","İnsan <b>kelimeler vasıtasıyla düşünür</b>: kelime hazinesi zenginleştikçe düşüncenin ufku genişler, azaldıkça düşünce daralır.","Örnek: renkleri adlandıramayan biri farkları algılasa da kumaşları sınıflandıramaz, örneğe uygun kumaşı seçemez.","Bazı dilbilimciler, duygu ve düşüncelerin resim, müzik, heykel gibi sanat eserleriyle de ifade edildiğinden yola çıkarak dil olmadan da düşüncenin var olabileceğini söylemiştir; ancak soyut kavramların kelimesiz nasıl canlandırılıp ifade edileceği yanıtsız kalır."],"kaynak":"Ders 1, s. 4"},{"baslik":"3. Dil canlıdır","maddeler":["Dilin sürekliliği ve sınırsızlığı canlı oluşundan gelir.","Toplum yaşamındaki değişmeler ve başka kültürlerle dillerden etkilenme sonucu dil zamanla değişir ve gelişir.","Bu değişim, dilin tarih içinde <b>dönemlere ayrılmasını</b> gerektirir (insan hayatının bebeklik, çocukluk, gençlik diye ayrılması gibi). Türkçeden örnekler: Eski Türkçe, Orta Türkçe; Uygur Türkçesi, Osmanlı Türkçesi.","Dilin <b>en küçük ögesi sestir</b>; sesler heceleri, sözcükleri ve cümleleri oluşturur. Değişimler bu ögeler üzerinde olur: sözcük kaybolur, ses ya da anlam değişir, yeni kelime doğar, kural değişebilir.","<i>yabız > yavuz</i>: ses değişikliği + anlam değişikliği (“kötü” anlamından “iyi, güçlü, güzel” anlamına).","<i>zâviyetân-ı mütekâbiletân-ı dâhiletân</i> terimi yerine bugün <i>iç ters açılar</i> denir.","Yönelme eki Eski Türkçede <i>-ga, -ge</i> iken bugün <i>-a, -e</i>'dir: <i>yiringe > yerine</i>.","Değişmeler dilin kendi kuralları içinde olur; dilin yapısına dışarıdan etki edilemez. Yalnızca doğal gelişimi engelleyen bir durum varsa, dilin kuralları çerçevesinde müdahale yapılabilir."],"kaynak":"Ders 1, s. 5"},{"baslik":"4. Dil sosyaldir","maddeler":["İnsan, kendisiyle aynı dili konuşanlarla bildirişim içindedir; toplumun bireyleri aynı nesneler için aynı kelimeleri aynı kurallarla kullanır.","Bireyler bu konuda sanki <b>gizlice anlaşmış</b> gibidir (örnek: <i>toprak</i> sözcüğü).","Nesnenin o adı taşıması için hiçbir zorunluluk yoktur; ad <b>keyfîdir</b>, ama o toplumda yaşayanlar için vazgeçilmezdir.","Başka dili konuşan toplumlarda aynı nesne başka sözcükle karşılanır; orada da kendi gizli anlaşma sistemi vardır.","Bu özelliğiyle dil, <b>toplum yaşamını düzenleyen</b> bir unsurdur."],"kaynak":"Ders 1, s. 5-6"}],"kurallar":[],"sorular":[{"id":"d1-s01","tip":"tanim","oncul":"","soru":"Ders metnine göre hayvanlar arasındaki bildirişim hakkında aşağıdakilerden hangisi söylen<u>emez</u>?","siklar":["Uzak geçmişi ve uzak geleceği anlatabilir.","Ses, koku ve tatlar aracılığıyla sağlanır.","Kalıtım yoluyla nesilden nesile geçer.","Zaman içinde hemen hemen hiç değişmez.","Yakın geçmiş ve yakın gelecekteki eylemleri anlatır."],"dogru":0,"neden":"Hayvan işaretleri yalnızca yakın geçmişi ve yakın geleceği anlatır; uzak geçmişi ve uzak geleceği anlatma insan diline özgüdür.","kaynak":"Ders 1, s. 3"},{"id":"d1-s02","tip":"tanim","oncul":"","soru":"Ders metnine göre insan dilini hayvanlardaki iletişimden ayıran özellik aşağıdakilerden hangisidir?","siklar":["Öğrenilmesi ve konuşmaya dayanması","Kalıtım yoluyla kuşaklara geçmesi","Koku ve tat gibi işaretler kullanması","Yalnızca yakın zamanı anlatabilmesi","Nesilden nesile hiç değişmemesi"],"dogru":0,"neden":"İnsanlar arasındaki dil öğrenilir ve hayvanlarda olmayan konuşmaya dayanır; öteki şıklar hayvan bildirişiminin özellikleridir.","kaynak":"Ders 1, s. 3"},{"id":"d1-s03","tip":"tanim","oncul":"","soru":"Dilin “araç olma” görevine ilk kez değinilen eser ve yazarı aşağıdakilerden hangisinde doğru verilmiştir?","siklar":["Eflatun – Kratylos","Aristo – Poetika","Herodot – Tarih","Corballis – İşaretten Konuşmaya","Humboldt – Dil ve Kültür"],"dogru":0,"neden":"Dilin araç olma görevine ilk kez Eflatun, Kratylos adlı eserinde değinmiştir; burgu, mekik ve ad örneklerini verir.","kaynak":"Ders 1, s. 3"},{"id":"d1-s04","tip":"ozellik","oncul":"","soru":"Dil hakkında aşağıdakilerden hangisi söylen<u>emez</u>?","siklar":["İnsan dili kuralları dışında istediği gibi kullanabilir.","Dillerin üretkenliği sınırsızdır.","Dil, zaman içinde değişip gelişir.","Dil, toplum yaşamını düzenleyen bir unsurdur.","Dil ile duygu ve düşünce arasında bağ vardır."],"dogru":0,"neden":"İnsan diğer araçları istediği gibi kullanabilir ama dili kullanırken onun doğal kurallarına uymak zorundadır; özgürlük ancak kurallar içindedir.","kaynak":"Ders 1, s. 3-4"},{"id":"d1-s05","tip":"ozellik","karistirma":false,"oncul":"I. Dilin en küçük ögesi sestir.\nII. Dilin yapısına ve kurallarına dışarıdan etki edilerek dil değiştirilebilir.\nIII. Dildeki değişmeler dilin tarih içinde dönemlere ayrılmasını gerektirir.\nIV. Dilin sürekliliği ve sınırsızlığı canlı oluşundan gelir.","soru":"“Dil canlıdır” başlığı altında verilen bilgilerle ilgili yukarıdaki numaralı cümlelerin hangisinde bilgi yanlışı vardır?","siklar":["I","II","III","IV","I ve III"],"dogru":1,"neden":"Ders metnine göre dilin yapısına ve kurallarına dışarıdan etki edilemez; yalnızca doğal gelişimi engelleyen bir durum varsa, kuralları çerçevesinde müdahale yapılabilir.","kaynak":"Ders 1, s. 5"},{"id":"d1-s06","tip":"ozellik","oncul":"Bir toplumu oluşturan bireyler aynı nesneler için aynı kelimeleri kullanır ve bunları aynı kurallara göre söyler; bir nesnenin o adı taşıması için hiçbir zorunluluk yoktur, ama o toplumda yaşayanlar için bu ad vazgeçilmezdir.","soru":"Bu parçada dilin aşağıdaki özelliklerinden hangisi anlatılmaktadır?","siklar":["Dilin sosyal oluşu","Dilin canlı oluşu","Dilin bildirişim aracı oluşu","Dil ile düşünce arasındaki bağ","Dilin üretkenliğinin sınırsızlığı"],"dogru":0,"neden":"Bireyler arasındaki gizli anlaşma ve adın keyfîliği “Dil sosyaldir” başlığında anlatılır.","kaynak":"Ders 1, s. 5-6"},{"id":"d1-s07","tip":"ornek","oncul":"","soru":"Türkçedeki <i>yabız > yavuz</i> değişimi ders metninde dilin hangi özelliğine örnek olarak verilmiştir?","siklar":["Dilin canlı olup zamanla değişmesine","Dilin bir anlaşma sistemi olmasına","Dilin bildirişim aracı olmasına","Kelime hazinesinin düşünceyi genişletmesine","Ünsüzlerin uyum kuralına uymasına"],"dogru":0,"neden":"Yabız sözcüğü ses değişikliğiyle yavuz olmuş, “kötü” anlamını yitirip “iyi, güçlü, güzel” anlamını kazanmıştır; bu, “Dil canlıdır” başlığının örneğidir.","kaynak":"Ders 1, s. 5"},{"id":"d1-s08","tip":"ornek","oncul":"","soru":"Ders metninde “kitapçı” yerine “kitapcı” denemeyeceği örneği aşağıdakilerden hangisini göstermek için verilmiştir?","siklar":["Dili kullanırken onun doğal kurallarına uyma zorunluluğunu","Yeni kavramlara yeni adlar verilebileceğini","İnsanın kelimeler vasıtasıyla düşündüğünü","Yönelme ekinin tarih içinde değiştiğini","Adların nesnelerle keyfî bir bağ taşıdığını"],"dogru":0,"neden":"Yumuşak ve sert ünsüzlerin uyumu örneği, dili araç olarak kullanırken onun doğal kurallarına uymak zorunda olduğumuzu gösterir.","kaynak":"Ders 1, s. 3"},{"id":"d1-s09","tip":"ornek","oncul":"","soru":"Renkleri adlandıramayan birinin kumaşları sınıflandıramaması ders metninde hangi görüşü desteklemek için örnek verilmiştir?","siklar":["İnsanın kelimeler vasıtasıyla düşündüğünü","Dilin toplum yaşamını düzenlediğini","Dilin tarih içinde dönemlere ayrıldığını","Hayvanlara meslek öğretilemediğini","Dilin en küçük ögesinin ses olduğunu"],"dogru":0,"neden":"Örnek, kelime eksikliğinin düşünceyi sınırladığını, yani insanın kelimelerle düşündüğünü göstermek için verilmiştir.","kaynak":"Ders 1, s. 4"}],"kartlar":[{"id":"d1-k01","on":"Dilin tanımı","arka":"İnsanların duygu ve düşüncelerini bildirmek için kelimelerle veya işaretlerle yaptıkları anlaşma.","kaynak":"Ders 1, s. 3"},{"id":"d1-k02","on":"Hayvanlarda bildirişim","arka":"Ses, koku ve tatlarla sağlanır; kalıtımla geçer, hemen hemen değişmez; yalnızca yakın geçmiş ve yakın geleceği anlatır.","kaynak":"Ders 1, s. 3"},{"id":"d1-k03","on":"Konuşabilen ve alet yapabilen tek varlık","arka":"İnsan. Dil insana özgüdür ve yalnız onun konuşma yeteneğidir.","kaynak":"Ders 1, s. 3"},{"id":"d1-k04","on":"Eflatun, Kratylos","arka":"Dilin “araç olma” görevine ilk kez değinilen eser: burgu delme, mekik dokuma, ad adlandırma aracıdır.","kaynak":"Ders 1, s. 3"},{"id":"d1-k05","on":"Dili öteki araçlardan ayıran fark","arka":"Dili kullanırken onun doğal kurallarına uymak zorunludur; kurallar içinde ise insan özgürdür.","kaynak":"Ders 1, s. 3-4"},{"id":"d1-k06","on":"Dilin dört özelliği","arka":"Bildirişim aracıdır; dil-duygu-düşünce bağı vardır; canlıdır; sosyaldir.","kaynak":"Ders 1, s. 3-5"},{"id":"d1-k07","on":"Dilin en küçük ögesi","arka":"Ses. Seslerden heceler, sözcükler ve cümleler oluşur.","kaynak":"Ders 1, s. 5"},{"id":"d1-k08","on":"yabız > yavuz","arka":"Ses ve anlam değişikliği: “kötü” anlamını yitirip “iyi, güçlü, güzel” anlamını kazanmış (dil canlıdır).","kaynak":"Ders 1, s. 5"},{"id":"d1-k09","on":"Yönelme eki: Eski Türkçe ve bugün","arka":"Eski Türkçede -ga, -ge; bugün -a, -e. Örnek: yiringe > yerine.","kaynak":"Ders 1, s. 5"},{"id":"d1-k10","on":"“Dil sosyaldir” (toprak örneği)","arka":"Toplumun bireyleri aynı nesneye aynı adı vermekte gizlice anlaşmış gibidir; ad keyfîdir ama vazgeçilmezdir.","kaynak":"Ders 1, s. 5-6"}]},{"id":"d2","ders":2,"baslik":"Dilin Kökeni ve Dil-Kültür Bağı","kisa":"Dilin kökeni ve kültür","ozet":[{"baslik":"Dilin kökenini araştırmanın güçlüğü","maddeler":["Konuşmanın kaydedilebilmesi çok yenidir; ilk dilin nasıl konuşulduğuna dair veri yoktur. Bu yüzden yazılı eserlerden yola çıkılmıştır.","Yazılı eserler de dilin kökenine kanıt olamaz, çünkü yazı konuşmadan çok sonra ortaya çıkmıştır.","En eski yazılı belgeler sayılan <b>Sümerce</b> metinler ancak <b>5500 yıl</b> öncesine gider; Türkçenin en eski yazılı eserleri <b>Orhun Kitabeleri</b> ise <b>MS 7-8. yüzyıla</b> gider. İlk insanlar ise yaklaşık bir milyon yıl önce yaşamıştır.","Geçmişte <b>İbranca</b> ve <b>Latince</b> gibi diller dünya dillerinin kökeni sayılmıştır; ama hiçbir dilin ilk dil olduğu söylenemez.","<b>Herodot</b>'a göre MÖ 7. yüzyılda Mısır hükümdarı <b>Psammetik</b>, iki yeni doğmuş çocuğu hiç söz duymadan büyüttürüp ilk sözcüklerini beklemiştir. Bu tür deneyler sonuçsuzdur, çünkü dil <b>duyarak öğrenilir</b>.","Dilin <b>anlamlı en küçük birimi kelimedir</b>; köken araştırmaları da genellikle kelimelerin nasıl ortaya çıktığı üzerinde durur."],"kaynak":"Ders 2, s. 5-6"},{"baslik":"Yansımalara ve ünlemlere dayanan varsayımlar","maddeler":["<b>Yansıma varsayımı:</b> ilk sözcükler, insanın doğada duyduğu sesleri (rüzgâr, hayvanlar, gök gürültüsü) taklit etmesiyle oluşmuş; bunlar nesnelerin adı olmuş, sonra öteki kelimeler türemiştir.","Yansıma sözcükler her dilde vardır; ünlem, isim ya da fiil olarak kullanılır (mö, hav, şırıl şırıl, çatır, hapşu; melemek, havlamak, hapşırmak).","Diller arasında benzerlik olabilir: fısılda- / Almanca <i>flüstern</i> / İngilizce <i>whisper</i>; miyavla- / Fransızca <i>miauler</i>.","Eleştiri: yansımalar söz varlığının yalnız küçük bir bölümüdür; her zaman benzer değildir (köpek sesi Batı'da “braf”, Türkçede “hav”).","Kelime ile nesne arasındaki bağ yalnız yansımalarda vardır; öteki sözcüklerde seçim nedensizdir (a-ğ-a-ç ile ağaç arasında bağ yoktur).","Eflatun'un <b>Kratylos ya da Adların Doğruluğu Üzerine</b> eseri ad verme üzerine en eski eserlerdendir. Sokrates'i konuşturan Eflatun'a göre ilk adları veren <b>“ad koyucu”</b> insandan üstün bir varlıktır; bu yüzden adların doğru olmaması mümkün değildir.","<b>Ünlem varsayımı:</b> insanın duygularını ünlemlerle ifade etmesi, ünlemlerin sözcüklere dönüşmesi (ah, of, ıh, püf püf, hom hom). Eleştiri: ünlemler dilde çok azdır, tüm sözcükleri açıklamaz.","Alman bilgin <b>Wilhelm Wundt</b>: dil seslerinin ilk aşaması fiziki ya da ruhi anlam taşıyan hayvani ses belirtileridir; önce içgüdüsel, sonra bilinçli kullanılmış; bağırma sesleri perdeli sese dönüşmüştür. Örnek: dil öğrenen çocuktaki bağırmalar."],"kaynak":"Ders 2, s. 6-7"},{"baslik":"Jest-mimik varsayımı ve iş kuramı","maddeler":["<b>Michael C. Corballis</b> (<i>İşaretten Konuşmaya Dilin Kökeni ve Gelişimi</i>): insan dünyayı işitmekten çok <b>görme ve dokunma</b> duyusuyla algılar; keyfî sesler ile nesneler arasındaki bağ <b>jestlerle</b> kurulmuştur.","İşaret dilleri, dilin jestlere dayalı bir sistemden doğduğuna güçlü bir kanıttır. Dil sözsel-işitsel değil, <b>görsel-elsel</b> bir uyum sonucu doğmuştur; “ağızdan çıkan sözle değil, el verme hareketiyle” gelen bir mirastır.","Sözel unsur evrimin ileri bir aşamasında ortaya çıkmış; sözlü iletişimin tercih edilmesi çevresel baskılardandır. Elden dile geçiş bir gecede olmamıştır; el kol hareketleri bugün de dilde çok yer tutar.","<b>İş kuramı:</b> ilk kelimeler, insanların birlikte çalışırken çıkardıkları ritmik seslerden oluşmuştur (ağır yük iterken “hay, hop”). Eleştiri: öteki varsayımlardaki aynı nedenlerle dilin kökenine kanıt olamaz.","Not: Ders metninde varsayımlar 1, 2, 3, 5, 6, 7 diye numaralanmıştır; 4 numara yoktur."],"kaynak":"Ders 2, s. 8"},{"baslik":"Filozofların varsayımları","maddeler":["Dile ait en eski çalışmalar <b>Eski Hint</b> ve <b>Eski Yunan</b>'a aittir. Filozofların görüşleri <b>doğuştancı</b> ve <b>deneyimci</b> olarak ikiye ayrılır.","<b>Doğuştancılar:</b> insan dil konuşma yeteneğiyle doğar; Tanrı insana ses ve söz yeteneği vermiştir. <b>Eflatun</b> (ad koyucu), <b>Sokrates</b> ve <b>Aristo</b> bu görüştedir; dilin kullanımı ise insana aittir.","Doğuştancılara göre kelime ile nesne arasındaki bağ doğal değildir; doğal olsaydı bütün insanlar bir nesneyi aynı sözcükle karşılardı.","<b>Deneyimciler:</b> dilin ortaya çıkışını yansıma, ünlem gibi varsayımlara dayandırır; dil insanın yaşanmışlıklarıyla doğmuştur. Yunanlı <b>Epikür</b>, <b>Demokrites</b> ve Romalı <b>Horatius</b> bu görüştedir.","<b>Wilhelm von Humboldt:</b> dil insana hazır verilmiş olamaz; insanın söz söyleme ihtiyacından doğmuştur."],"kaynak":"Ders 2, s. 9"},{"baslik":"Kutsal kitaplar ve genel sonuç","maddeler":["<b>Tevrat</b> (Tekvin 2/19-20): Allah hayvanları Âdem'e getirir, Âdem her birine ne ad koyduysa adı o olur.","<b>Tevrat</b> (Tekvin 11/1-9) <b>Babil Kulesi</b>: Nuh tufanından sonra bütün dünyanın dili birdir; kibir insanları kule yapmaya iter; Tanrı onları cezalandırmak için dillerini karıştırır ve yeryüzüne dağıtır.","<b>İncil</b> (Yuhanna 1/1-2): “Kelam başlangıçta var idi…”","<b>Kur'an-ı Kerim</b> (Bakara 2/31-33): Allah Âdem'e bütün isimleri öğretir; Âdem bunları meleklere haber verir.","Bugün köken çalışmaları daha çok <b>çocuk dili</b> üzerine yönelmiştir ve insan bilimi, ruh bilimi gibi dallarla birlikte yürütülür.","İlk dilin hangisi olduğu, bütün dillerin tek kaynaktan çıkıp çıkmadığı hâlâ aydınlatılamamıştır; bilimsel kanıt yoktur. Kesin hükümler kutsal kitaplardadır, ötesi inanç kapsamındadır."],"kaynak":"Ders 2, s. 9-10"},{"baslik":"Kültürün tanımı ve özellikleri","maddeler":["Sözlük anlamları: 1. fen alanında üretme, yetiştirme (bakteri kültürü); 2. bireyin kazandığı bilgi; 3. bir topluma ait düşünce ve sanat eserlerinin bütünü; 4. muhakeme, zevk ve eleştirme yeteneklerinin öğrenim ve yaşantıyla gelişmiş biçimi.","Kültür, bir toplumu <b>millet hâline getiren</b> ve milletten millete değişen değerler bütünüdür; insana özgüdür, en ilkelinden en gelişmişine her toplulukta vardır; bireyleri birbirine bağlar.","<b>Maddi kültür:</b> eşyayla ilgili düzen (yemek çeşitleri, eşya kullanımı, mimari yapılar, giyim kuşam).","<b>Manevi kültür:</b> toplum yaşayışını düzenleyen unsurlar (örf ve âdetler, <b>dil</b>, din, ahlak, hukuk).","Özellikleri: <b>doğal ve canlıdır</b>, değişip gelişir; toplumun <b>her bireyi üzerinde etkilidir</b> (doğum ve ölüm törenleri).","Kültür <b>millîdir</b>: birden fazla milleti içine alan kültür yoktur; “dünya edebiyatı” olmaz, Türk müziği, İngiliz edebiyatı, Alman mimarisi vardır.","Kültür <b>bütünüyle değiştirilemez</b>; tümü değişirse o toplum başka bir toplumun parçası olmuş demektir.","Kültür <b>nesilden nesile aktarılır</b> ve bir miras oluşturur."],"kaynak":"Ders 2, s. 11-12"},{"baslik":"Dil ve kültür, dil ve toplum","maddeler":["Bir milletin kültür değerlerinin tümü onun dilindedir; sözcük, deyim ve kalıplaşmış ifadeler kültür ögelerini taşır ve kuşaklara aktarır.","Edebiyat, felsefe, tiyatro, sinema, şiir, psikoloji, sosyoloji gibi alanlar ancak dille var olup gelişebilir. Dil ve kültür birbirinden beslenen, <b>ayrılmaz</b> iki varlıktır.","Örnek: “ekmeğini taştan çıkarmak”, “ekmek aslanın ağzında” deyimleri ekmeğin Türk milleti için yalnızca bir yiyecek olmadığını gösterir.","Atatürk'ün sözü: “Türk milleti demek, Türk dili demektir.” Millet ahlakını, ananelerini, hatıralarını dili sayesinde korumuştur.","Dil olmadan bireyler anlaşamaz, toplum oluşamaz; insan ilişkilerinin temeli dildir.","Dil, insanı uzak geçmişin bilgi birikimine ortak eder; kültürü sesler, sözcükler ve cümlelerle <b>şifreleyip</b> gelecek nesillere aktararak toplumun sürekliliğini sağlar.","Toplumun dile etkisi: başka bir toplumun etkisine giren toplumun dili de değişir. Arap ve Fars kültürü etkisiyle edebiyatta “dudak” yerine <i>leb</i>, “yanak” yerine <i>ruhsar</i>, “ağız” yerine <i>fem</i> kullanılmış; bugün İngilizceye hayranlık Türkçeye çok sayıda kelime sokmaktadır.","Dilin topluma etkisi: milletlerin adı ile dillerinin adı genellikle aynıdır (Türk-Türkçe, İtalyan-İtalyanca, Rus-Rusça). Dilin bozulması birlik duygusunu zedeler, kuşaklar arası miras ve tecrübe aktarımını bozar."],"kaynak":"Ders 2, s. 12-13"}],"kurallar":[],"sorular":[{"id":"d2-s01","tip":"kuram","oncul":"","soru":"Aşağıdakilerden hangisi dilin kökeni konusunda ders metninde ele alınan varsayımlardan biri <u>değildir</u>?","siklar":["Dil, dilbilimcilerin ortak çalışmasıyla bilinçli olarak kurulmuştur.","İlk sözcükler, doğadaki seslerin taklit edilmesiyle oluşmuştur.","İlk kelimeler, birlikte çalışırken çıkarılan ritmik seslerden doğmuştur.","Duyguları dile getiren ünlemler zamanla sözcüklere dönüşmüştür.","Sözcüklerle nesneler arasındaki bağ önce jestlerle kurulmuştur."],"dogru":0,"neden":"Derste yansıma, ünlem, jest-mimik, iş kuramı, filozofların varsayımları ve kutsal kitaplar anlatılır; dilin bilim insanlarınca kurulduğu görüşü yoktur.","kaynak":"Ders 2, s. 6-9"},{"id":"d2-s02","tip":"kuram","oncul":"","soru":"İnsanın gerçek dünyayı işitmekten çok görme ve dokunma duyusuyla algıladığını belirterek dilin el ve kol hareketlerinden doğduğunu savunan araştırmacı aşağıdakilerden hangisidir?","siklar":["Michael C. Corballis","Wilhelm Wundt","Wilhelm von Humboldt","Herodot","Eflatun"],"dogru":0,"neden":"Corballis, İşaretten Konuşmaya Dilin Kökeni ve Gelişimi adlı eserinde dilin jestlere dayalı bir sistemden, görsel-elsel bir uyumdan doğduğunu savunur.","kaynak":"Ders 2, s. 8"},{"id":"d2-s03","tip":"kuram","oncul":"","soru":"Dil seslerinin ilk aşamasının fiziki ya da ruhi anlam taşıyan hayvani ses belirtilerinden oluştuğunu ileri süren Alman bilgin aşağıdakilerden hangisidir?","siklar":["Wilhelm Wundt","Michael C. Corballis","Wilhelm von Humboldt","Demokrites","Horatius"],"dogru":0,"neden":"Wundt'a göre içgüdüsel bu sesler zamanla bilinçli anlatım aracı olmuş, bağırma sesleri perdeli sese dönüşmüştür; bu görüş ünlem varsayımı başlığında anlatılır.","kaynak":"Ders 2, s. 7-8"},{"id":"d2-s04","tip":"kuram","oncul":"","soru":"Filozofların dilin kökenine ilişkin varsayımlarıyla ilgili aşağıdakilerden hangisi söylen<u>emez</u>?","siklar":["Epikür ve Demokrites doğuştancı görüşü benimsemiştir.","Doğuştancılar, Tanrı'nın insana ses ve söz yeteneği verdiğini kabul eder.","Sokrates ve Aristo, konuşma yeteneğinin doğuştan verildiğini kabul eder.","Deneyimciler, dilin insanın yaşanmışlıklarıyla ortaya çıktığını söyler.","Humboldt, dilin söz söyleme ihtiyacından doğduğunu söyler."],"dogru":0,"neden":"Epikür, Demokrites ve Romalı Horatius deneyimci görüştedir; doğuştancılar arasında Eflatun, Sokrates ve Aristo anılır.","kaynak":"Ders 2, s. 9"},{"id":"d2-s05","tip":"kultur","oncul":"","soru":"Aşağıdakilerden hangisi manevi kültür ögelerinden biri <u>değildir</u>?","siklar":["Mimari yapılar","Örf ve âdetler","Din","Hukuk","Dil"],"dogru":0,"neden":"Mimari yapılar eşyayla ilgili düzeni oluşturan maddi kültür ögesidir; örf ve âdet, din, hukuk, dil ve ahlak manevi kültürdendir.","kaynak":"Ders 2, s. 11"},{"id":"d2-s06","tip":"kultur","oncul":"","soru":"Kültürün özellikleriyle ilgili aşağıdakilerden hangisi söylen<u>emez</u>?","siklar":["Birden fazla milleti içine alan ortak bir kültürden söz edilebilir.","Toplum yaşamından doğduğu için doğal ve canlıdır.","Toplumun her bireyi üzerinde etkilidir.","Bir toplumun kültürü bütünüyle değiştirilemez.","Nesilden nesile aktarılarak bir miras oluşturur."],"dogru":0,"neden":"Ders metnine göre kültür millî bir olgudur; tüm milletleri ya da birden fazla milleti içine alan bir kültür, örneğin “dünya edebiyatı”, yoktur.","kaynak":"Ders 2, s. 11-12"},{"id":"d2-s07","tip":"kultur","karistirma":false,"oncul":"I. Kültür, bir toplumu millet hâline getiren değerler bütünüdür.\nII. Yemek çeşitleri ve giyim kuşam şekilleri manevi kültür ögeleridir.\nIII. Kültür insana özgü bir özelliktir.\nIV. En ilkelinden en gelişmişine bütün insan topluluklarının bir kültürü vardır.","soru":"Yukarıdaki numaralı cümlelerin hangisinde bilgi yanlışı vardır?","siklar":["I","II","III","IV","III ve IV"],"dogru":1,"neden":"Yemek çeşitleri ve giyim kuşam, toplumların eşyayla ilgili düzenini oluşturan maddi kültür ögeleridir.","kaynak":"Ders 2, s. 11"},{"id":"d2-s08","tip":"dil-toplum","oncul":"","soru":"Eski edebiyat ürünlerinde “dudak” yerine <i>leb</i>, “yanak” yerine <i>ruhsar</i>, “ağız” yerine <i>fem</i> kullanılması ders metninde neye örnek gösterilmiştir?","siklar":["Başka bir toplumun etkisinin dili değiştirmesine","Yansıma sözcüklerin diller arasında benzeşmesine","Kültürün nesilden nesile aktarılmasına","Milletlerin adının dillerinin adıyla aynı olmasına","Dilin anlamlı en küçük biriminin kelime olmasına"],"dogru":0,"neden":"Bu kullanımlar, Türk şairlerinin Arap ve Fars kültürüne hayranlığı sonucu toplumun başka toplum etkisine girmesinin dili de değiştirdiğini gösterir.","kaynak":"Ders 2, s. 13"},{"id":"d2-s09","tip":"dil-toplum","oncul":"","soru":"Ders metnine göre dilin topluma etkisini belki de en iyi ifade eden durum aşağıdakilerden hangisidir?","siklar":["Milletlerin adı ile dillerinin adının genellikle aynı olması","Yansıma sözcüklerin her dilde bulunması","Edebiyatta yabancı kelimelerin kullanılması","Kültürün sözlükte birden çok anlamının bulunması","Yazının konuşmadan çok sonra ortaya çıkması"],"dogru":0,"neden":"Ana dili Türkçe olana Türk, İtalyanca olana İtalyan, Rusça olana Rus denmesi, dilin topluma etkisinin en iyi göstergesi olarak verilir.","kaynak":"Ders 2, s. 13"},{"id":"d2-s10","tip":"dil-toplum","oncul":"","soru":"Dil-kültür ve dil-toplum ilişkisi hakkında aşağıdakilerden hangisi söylen<u>emez</u>?","siklar":["Edebiyat ve felsefe dil olmadan da gelişip topluma aktarılabilir.","Bir milletin kültür değerlerinin tümü o milletin dilinde yer alır.","Dil, kültürü şifreleyip gelecek nesillere aktarır.","Dilin bozulması toplumdaki birlik duygusunu zedeler.","Başka milletlerin kültürü de o milletlerin dili vasıtasıyla öğrenilir."],"dogru":0,"neden":"Ders metnine göre edebiyat, felsefe, tiyatro gibi alanların var olması ve gelişmesi ancak dil ile mümkündür.","kaynak":"Ders 2, s. 12-13"}],"kartlar":[{"id":"d2-k01","on":"En eski yazılı belgeler / Türkçenin en eski yazılı eserleri","arka":"Sümerce metinler (yaklaşık 5500 yıl önce) / Orhun Kitabeleri (MS 7-8. yüzyıl).","kaynak":"Ders 2, s. 5"},{"id":"d2-k02","on":"Psammetik deneyi","arka":"Herodot'a göre MÖ 7. yy'da Mısır hükümdarı iki çocuğu söz duymadan büyüttürdü; sonuçsuz kaldı, çünkü dil duyarak öğrenilir.","kaynak":"Ders 2, s. 5"},{"id":"d2-k03","on":"Yansıma varsayımı","arka":"İlk sözcükler doğadaki seslerin taklidiyle oluştu. Eleştiri: yansımalar söz varlığının küçük bir bölümüdür ve diller arasında hep benzemez (braf / hav).","kaynak":"Ders 2, s. 6"},{"id":"d2-k04","on":"Eflatun'un “ad koyucu”su","arka":"Kratylos ya da Adların Doğruluğu Üzerine: ilk adları veren ad koyucu insandan üstün bir varlıktır; bu yüzden adlar doğrudur.","kaynak":"Ders 2, s. 7"},{"id":"d2-k05","on":"Wilhelm Wundt","arka":"Ünlem varsayımı başlığında: dil seslerinin ilk aşaması hayvani ses belirtileri; önce içgüdüsel, sonra bilinçli; bağırma perdeli sese dönüştü.","kaynak":"Ders 2, s. 7-8"},{"id":"d2-k06","on":"Michael C. Corballis","arka":"Jest-mimik varsayımı: algı görme ve dokunmaya dayanır; dil görsel-elsel bir uyumdan, el hareketlerinden doğdu.","kaynak":"Ders 2, s. 8"},{"id":"d2-k07","on":"İş kuramı","arka":"İlk kelimeler birlikte çalışırken çıkarılan ritmik seslerden oluştu (hay, hop).","kaynak":"Ders 2, s. 8"},{"id":"d2-k08","on":"Doğuştancılar / Deneyimciler","arka":"Doğuştancı: Eflatun, Sokrates, Aristo (söz yeteneği doğuştan). Deneyimci: Epikür, Demokrites, Horatius (dil yaşanmışlıklardan doğar). Humboldt: söz söyleme ihtiyacından.","kaynak":"Ders 2, s. 9"},{"id":"d2-k09","on":"Maddi kültür / Manevi kültür","arka":"Maddi: yemek, eşya kullanımı, mimari, giyim kuşam. Manevi: örf ve âdet, dil, din, ahlak, hukuk.","kaynak":"Ders 2, s. 11"},{"id":"d2-k10","on":"Kültürün özellikleri","arka":"Doğal ve canlıdır; her birey üzerinde etkilidir; millîdir; bütünüyle değiştirilemez; nesilden nesile aktarılır.","kaynak":"Ders 2, s. 11-12"}]},{"id":"d3","ders":3,"baslik":"Yeryüzündeki Dillerin Sınıflandırılması","kisa":"Dillerin sınıflandırılması","ozet":[{"baslik":"Genel bilgiler","maddeler":["Yeryüzündeki dillerin sayısını kesin vermek güçtür. Nedenleri: (1) kimi lehçelerin ayrı dil sayılıp sayılmayacağının belirsizliği, (2) henüz incelenmemiş, yazı dili olmamış diller, (3) bir dile ya da dil ailesine bağlılığı kesinleşmemiş diller.","Diller eskiden beri <b>yapı, köken, coğrafya</b> gibi ölçütlerle sınıflandırılmıştır; en yaygın olanları <b>yapı</b> ve <b>köken</b> sınıflandırmalarıdır.","Yapı bakımından sınıflandırma, <b>kelimenin nasıl türetildiğine veya çekimlendiğine</b> göre yapılır; buna göre diller üç gruptur: yalınlayan, eklemeli, bükümlü."],"kaynak":"Ders 3, s. 3"},{"baslik":"Yapı bakımından diller","maddeler":["<b>1. Yalınlayan (tek heceli) diller:</b> her kelime kök hâlindedir, <b>türetme ve çekim yoktur</b>. Kelimenin cümledeki yeri önemlidir; yan yana gelince yeni anlam ve görev yüklenir; <b>vurgu ve tonlama</b> çok önemlidir. Başlıca temsilci <b>Çince</b>; ayrıca Tibetçe, Siyamca, Vietnamca, Baskça. Örnek: Wo şiye “yazıyorum”, Wo bú şiye “yazmıyorum”.","<b>2. Eklemeli diller</b> iki gruptur:","<b>a. Bağlantılı (bitiştiren, eklemeli) diller:</b> kelime, <b>değişmeyen bir köke</b> ekler getirilerek türetilir. Başlıca temsilci <b>Türkçe</b>; ayrıca Moğolca, Mançu-Tunguzca, Japonca, Korece, Fince, Macarca, Samoyedce. Örnek: Gör-üş-me+y+e.","<b>b. Kaynaştıran diller:</b> kelimeler ve ekler sıkı biçimde kaynaşır; <b>bir cümle tek bir kelimeye sığdırılabilir</b>. Eskimoca, Gürcüce, Amerikan Kızılderili dilleri. Örnek: Eskimoca <i>kiazunek</i> (kia + zu + nek).","<b>3. Bükümlü (çekimli) diller:</b> <b>kök kırılır, değişir</b>; kökler çeşitli şekillere girerek yeni anlam ve görev kazanır; az da olsa ek kullanılır. <b>Hint-Avrupa</b> ve <b>Hami-Sami</b> dilleri. Örnekler: Arapça qa:le “dedi”, yequ:lü “der”, qu: “söyle”; İngilizce do, did, done."],"kaynak":"Ders 3, s. 3-5"},{"baslik":"Köken bakımından diller ve küçük aileler","maddeler":["Köken sınıflandırması, ortak bir kaynaktan geldiği düşünülen <b>akraba dilleri</b> bir araya getirir.","Akrabalık: geriye gidildikçe diller arasında <b>ses, şekil, söz dizimi, köken bilgisi ve söz varlığı</b> bakımından yakınlık olmasıdır.","Dillerin akraba olması <b>milletlerin de akraba olduğu anlamına gelmez</b>.","<b>Kafkas Dilleri Ailesi:</b> Gürcüce, Abhazca, Lazca, Çerkezce, Çeçen-Lezgi dilleri.","<b>Çin-Tibet Dilleri Ailesi:</b> Çince, Tibetçe.","<b>Bantu Dilleri Ailesi:</b> Orta ve Güney Afrika dilleri: Swahili, Zulu, Kongo, Mongo.","<b>Hami-Sami Dilleri:</b> adını <b>Nuh Peygamber'in iki oğlundan</b> alır; İbranice, Aramice, Arapça, Habeşçe, Akkadca (ölü dil)."],"kaynak":"Ders 3, s. 5"},{"baslik":"Hint-Avrupa Dilleri Ailesi","maddeler":["Avrupa'dan Hindistan'a kadar geniş bir alanda konuşulan diller.","XIV. yüzyılın başında İtalyan şair <b>Dante</b>, Avrupa dillerini üç grupta toplayarak bir sınıflandırma denemesi yapmıştır. <b>1498</b>'de <b>Vasco da Gama</b>'nın Hindistan yolculuğu yeni dillerin tanınmasını sağlamıştır.","<b>Asya kolu:</b> Urdu dili, Hint dilleri, Sanskritçe (ölü), Hititçe (ölü), Farsça, Tacikçe, Peştuca, Osetçe, Toharca (ölü), Ermenice.","<b>Avrupa kolu</b> üç grupta incelenir: Latin (Roman), Germen, Slav.","<b>Latin (Roman) dilleri:</b> Latinceden türeyen Fransızca, İtalyanca, İspanyolca, Portekizce, Romence; ayrıca Sardca ve Katalanca.","<b>Germen dilleri:</b> İngilizce, Almanca, Felemenkçe, İsveççe, Danca, İzlandaca, Norveççe (İskandinav dilleri).","<b>Slav dilleri:</b> Rusça, Bulgarca, Sırpça, Slovence, Hırvatça, Boşnakça, Makedonca, Lehçe, Çekçe, Slovakça.","Üç gruba girmeyen ama Avrupa dillerinden sayılanlar: <b>Yunanca</b>, <b>Arnavutça</b> ve bugün İrce ile İskoç Galcesi olarak süren <b>Eski Keltçe</b>."],"kaynak":"Ders 3, s. 5-6"},{"baslik":"Ural-Altay dil grubu: tartışma","maddeler":["Adını Orta Asya'daki <b>Ural ve Altay sıradağlarından</b> alır; Ural dilleri ve Altay dilleri olarak iki grupta incelenir.","İki kol arasında köken akrabalığını destekleyen bir yakınlık yoktur; benzerlik yalnızca <b>yapı benzerliğidir</b>.","Ural-Altay dil ailesi fikrini savunan araştırmacılar: İsveçli <b>J. von Strahlenberg</b>, Fransız <b>Abel Remusat</b>, Danimarkalı <b>R. Rask</b>, Alman <b>W. Schoot</b> (Schoot sınıflandırmayı da yapmıştır).","Dilleri yerinde inceleyen <b>M. A. Castren</b>, Ural-Altay filolojisinin asıl kurucusu sayılır; alanı sistemli bir yola sokmuştur.","<b>H. Peasonen, E. N. Setälä, B. Collinder</b> Ural-Altay teorisine karşı çıkıp Ural dillerini Hint-Avrupa dilleriyle karşılaştırmıştır; iki kol arasındaki benzerliğin sınırlı ve akrabalığı destekleyemeyecek nitelikte olduğu anlaşılmıştır.","Sonuç: teori zayıflamış, <b>“dil ailesi” yerine “dil grubu”</b> terimi tercih edilmeye başlanmıştır; bugün iki kolun ayrı ele alınması daha uygun görülür."],"kaynak":"Ders 3, s. 6-7"},{"baslik":"Ural dilleri ve Altay dilleri","maddeler":["<b>Ural dilleri:</b> (1) <b>Fin-Ugor kolu</b>: Fince (Batı ve Doğu Fince), Estonca, Lapça, Macarca; (2) <b>Samoyed kolu</b>: Kuzey Buz Denizi kıyısındaki Samoyedlerin dili Samoyedce.","<b>Altay dilleri:</b> Türkçe, Moğolca, Mançu-Tunguzca, Korece, Japonca.","Korecenin Altay dilleriyle akrabalığı <b>hemen hemen kesinleşmiştir</b>; Japoncanın akrabalığıyla ilgili çalışmalar <b>devam etmektedir</b>; Moğolca ile Tunguzcanın akrabalığı <b>kesindir</b>.","Altay dilleri içinde <b>Türkçeye en yakın olan Moğolcadır</b>."],"kaynak":"Ders 3, s. 7"},{"baslik":"Altay dillerinin ortak özellikleri","maddeler":["Hepsi <b>eklemelidir</b>.","Türetme ve çekimde <b>son ekler</b> kullanılır; <b>ön ek sistemi yoktur</b>.","<b>Cinsiyet</b> bildiren farklı kelime biçimleri yoktur.","Sayı sıfatından sonra gelen isim <b>teklik</b> biçimindedir (beş çocuk, yedi ev).","Tamlamalarda <b>tamlayan tamlanandan önce</b> gelir.","Cümlede <b>özne fiilden önce</b> gelir ve genellikle baştadır.","<b>Ünlü uyumları</b> vardır.","<b>Tanımlık</b> (artikel, harf-i tarif) yoktur.","Diller arasında aynı kökten gelen ekler bulunur.","Hiçbirinde kelime başında <b>l, r, n</b> sesleri bulunmaz."],"kaynak":"Ders 3, s. 7-8"}],"kurallar":[],"sorular":[{"id":"d3-s01","tip":"yapi-sinif","oncul":"","soru":"Yapı bakımından diller aşağıdakilerden hangisine göre belirlenir?","siklar":["Kelimenin nasıl türetildiğine veya çekimlendiğine göre","Dillerin ortak bir kaynaktan gelip gelmediğine göre","Dillerin konuşulduğu coğrafi bölgeye göre","Dillerin yazı dili olup olmadığına göre","Dillerin söz varlığının büyüklüğüne göre"],"dogru":0,"neden":"Yapı bakımından sınıflandırma kelimenin türetilme ve çekimlenme biçimine dayanır; ortak kaynak ölçütü köken sınıflandırmasıdır.","kaynak":"Ders 3, s. 3"},{"id":"d3-s02","tip":"yapi-sinif","oncul":"Bu dillerde her kelime kök hâlinde bulunur; türetme ve çekim yoktur. Kelimelerin cümle içindeki yeri, vurgusu ve tonlaması anlamı belirler.","soru":"Bu parçada sözü edilen dil türünün başlıca temsilcisi aşağıdakilerden hangisidir?","siklar":["Çince","Türkçe","Eskimoca","Arapça","Macarca"],"dogru":0,"neden":"Parça yalınlayan (tek heceli) dilleri anlatır; başlıca temsilcisi Çincedir.","kaynak":"Ders 3, s. 3"},{"id":"d3-s03","tip":"yapi-sinif","oncul":"","soru":"Kelimelerin ve eklerin sıkı biçimde kaynaştığı, bir cümlenin tek bir kelimeye sığdırılabildiği dillere aşağıdakilerden hangisi örnektir?","siklar":["Gürcüce","Japonca","Vietnamca","İngilizce","Fince"],"dogru":0,"neden":"Kaynaştıran diller arasında Eskimoca, Gürcüce ve Amerikan Kızılderili dilleri sayılır; Japonca ve Fince bağlantılı, Vietnamca yalınlayan, İngilizce bükümlüdür.","kaynak":"Ders 3, s. 4"},{"id":"d3-s04","tip":"yapi-sinif","karistirma":false,"oncul":"I. Bağlantılı dillerde kelime, değişmeyen bir köke ekler getirilerek türetilir.\nII. Bükümlü dillerde kök kırılır ve hiç ek kullanılmaz.\nIII. Hint-Avrupa ve Hami-Sami dilleri bükümlü dillerdir.\nIV. Yalınlayan dillerde vurgu ve tonlama çok önemlidir.","soru":"Yukarıdaki numaralı cümlelerin hangisinde bilgi yanlışı vardır?","siklar":["I","II","III","IV","I ve IV"],"dogru":1,"neden":"Bükümlü dillerde kök kırılıp değişir, ancak az da olsa eklerden de yararlanılır; “hiç ek kullanılmaz” yanlıştır.","kaynak":"Ders 3, s. 3-4"},{"id":"d3-s05","tip":"dil-ailesi","oncul":"","soru":"İbranice, Aramice, Arapça, Habeşçe ve Akkadca aşağıdaki dil ailelerinden hangisinde yer alır?","siklar":["Hami-Sami Dilleri","Hint-Avrupa Dilleri","Kafkas Dilleri","Bantu Dilleri","Çin-Tibet Dilleri"],"dogru":0,"neden":"Bu diller, adını Nuh Peygamber'in iki oğlundan alan Hami-Sami dilleri arasında sayılır; Akkadca ölü bir dildir.","kaynak":"Ders 3, s. 5"},{"id":"d3-s06","tip":"dil-ailesi","oncul":"","soru":"Aşağıdaki dillerden hangisi Hint-Avrupa Dilleri Ailesinin Asya koluna ait <u>değildir</u>?","siklar":["Lazca","Farsça","Peştuca","Osetçe","Ermenice"],"dogru":0,"neden":"Lazca, Kafkas Dilleri Ailesindedir; Farsça, Peştuca, Osetçe ve Ermenice Hint-Avrupa ailesinin Asya kolundadır.","kaynak":"Ders 3, s. 5-6"},{"id":"d3-s07","tip":"dil-ailesi","oncul":"","soru":"Hint-Avrupa dilleriyle ilgili aşağıdakilerden hangisi söylen<u>emez</u>?","siklar":["Romence ve Katalanca, Germen dilleri grubunda yer alır.","Avrupa kolu Latin, Germen ve Slav grupları olarak incelenir.","Yunanca ve Arnavutça bu üç grubun dışında kalan Avrupa dillerindendir.","Sanskritçe, Hititçe ve Toharca bu ailenin ölü dillerindendir.","Dante, Avrupa dillerini üç grupta toplayan bir sınıflandırma denemesi yapmıştır."],"dogru":0,"neden":"Romence ve Katalanca Latinceden gelen Latin (Roman) dilleridir; Germen dilleri İngilizce, Almanca, Felemenkçe ve İskandinav dilleridir.","kaynak":"Ders 3, s. 5-6"},{"id":"d3-s08","tip":"ural-altay","oncul":"","soru":"Türkçe, Moğolca, Mançu-Tunguzca, Korece ve Japonca ders metninde aşağıdaki gruplardan hangisinde yer alır?","siklar":["Altay dilleri","Ural dilleri","Kafkas dilleri","Çin-Tibet dilleri","Hint-Avrupa dilleri"],"dogru":0,"neden":"Bu beş dil Altay dilleri grubunda sayılır; Ural dilleri Fin-Ugor ve Samoyed kollarından oluşur.","kaynak":"Ders 3, s. 7"},{"id":"d3-s09","tip":"ural-altay","oncul":"","soru":"Aşağıdakilerden hangisi Altay dillerinin ortak özelliklerinden biri <u>değildir</u>?","siklar":["Kelime türetmede ön eklerden yararlanılması","Ünlü uyumlarının bulunması","Tanımlıkların bulunmaması","Tamlayanın tamlanandan önce gelmesi","Sayı sıfatından sonra ismin teklik biçiminde olması"],"dogru":0,"neden":"Altay dillerinde türetme ve çekimde son ekler kullanılır, ön ek sistemi yoktur.","kaynak":"Ders 3, s. 7-8"},{"id":"d3-s10","tip":"ural-altay","oncul":"","soru":"Ural ve Altay dilleri hakkında aşağıdakilerden hangisi söylen<u>emez</u>?","siklar":["İki kol arasındaki benzerliğin köken akrabalığını kanıtladığı kesinleşmiştir.","M. A. Castren, Ural-Altay filolojisinin asıl kurucusu sayılır.","Sınıflandırmalarda “dil ailesi” yerine “dil grubu” terimi tercih edilmeye başlanmıştır.","Altay dilleri içinde Türkçeye en yakın olanı Moğolcadır.","Japoncanın Altay dilleriyle akrabalığı konusunda çalışmalar sürmektedir."],"dogru":0,"neden":"İki kol arasındaki benzerlik yalnızca yapı benzerliğidir; araştırmalar köken akrabalığını desteklemediğini göstermiş, teori zayıflamıştır.","kaynak":"Ders 3, s. 6-7"}],"kartlar":[{"id":"d3-k01","on":"Yalınlayan (tek heceli) diller","arka":"Kelime kök hâlinde; türetme ve çekim yok; yer, vurgu ve tonlama önemli. Çince, Tibetçe, Siyamca, Vietnamca, Baskça.","kaynak":"Ders 3, s. 3"},{"id":"d3-k02","on":"Bağlantılı (bitiştiren) diller","arka":"Değişmeyen köke ekler getirilir. Türkçe, Moğolca, Mançu-Tunguzca, Japonca, Korece, Fince, Macarca, Samoyedce.","kaynak":"Ders 3, s. 4"},{"id":"d3-k03","on":"Kaynaştıran diller","arka":"Kelime ve ekler sıkı kaynaşır, cümle tek kelimeye sığabilir. Eskimoca, Gürcüce, Amerikan Kızılderili dilleri.","kaynak":"Ders 3, s. 4"},{"id":"d3-k04","on":"Bükümlü (çekimli) diller","arka":"Kök kırılır, değişir; az da olsa ek kullanılır. Hint-Avrupa ve Hami-Sami dilleri (Arapça qa:le, İngilizce do/did/done).","kaynak":"Ders 3, s. 4-5"},{"id":"d3-k05","on":"Dil akrabalığı","arka":"Geriye gidildikçe ses, şekil, söz dizimi, köken bilgisi ve söz varlığı yakınlığı. Dillerin akrabalığı milletlerin akrabalığı demek değildir.","kaynak":"Ders 3, s. 5"},{"id":"d3-k06","on":"Hami-Sami adı nereden gelir?","arka":"Nuh Peygamber'in iki oğlunun adından. Diller: İbranice, Aramice, Arapça, Habeşçe, Akkadca (ölü).","kaynak":"Ders 3, s. 5"},{"id":"d3-k07","on":"Kafkas / Çin-Tibet / Bantu aileleri","arka":"Kafkas: Gürcüce, Abhazca, Lazca, Çerkezce, Çeçen-Lezgi. Çin-Tibet: Çince, Tibetçe. Bantu: Swahili, Zulu, Kongo, Mongo.","kaynak":"Ders 3, s. 5"},{"id":"d3-k08","on":"Hint-Avrupa: Avrupa kolunun grupları","arka":"Latin (Roman), Germen, Slav; bunların dışında Yunanca, Arnavutça, Eski Keltçe (İrce, İskoç Galcesi).","kaynak":"Ders 3, s. 6"},{"id":"d3-k09","on":"Ural-Altay teorisinin savunucuları / karşı çıkanlar","arka":"Savunan: Strahlenberg, Abel Remusat, R. Rask, W. Schoot; kurucu: M. A. Castren. Karşı: H. Peasonen, E. N. Setälä, B. Collinder.","kaynak":"Ders 3, s. 6-7"},{"id":"d3-k10","on":"Ural dillerinin kolları","arka":"Fin-Ugor (Fince, Estonca, Lapça, Macarca) ve Samoyed (Samoyedce).","kaynak":"Ders 3, s. 7"}]},{"id":"d4","ders":4,"baslik":"Türk Dilinin Tarihî Gelişimi I","kisa":"Tarihî gelişim I","ozet":[{"baslik":"Dönemlerin sırası","maddeler":["Sıra: <b>Ön Türkçe → Eski Türkçe → Orta Türkçe → Yeni Türkçe</b>.","İlk yazılı belgeler: Göktürklerin MS 8. yy.da taşlara yazdığı kitabeler. Bu kitabelerin dili <b>Eski Türkçe</b> diye adlandırılır.","Kitabelerdeki dil gelişmiş ve işlenmiştir; bu, Türkçenin daha önce de konuşulup yazıldığını düşündürür (Ön Türkçe fikrinin dayanağı).","Eski Türkçe iki kol: <b>Göktürk Türkçesi (7–9. yy.)</b> ve <b>Uygur Türkçesi (9–14. yy.)</b>.","Orta Türkçe: <b>Karahanlı (Hakaniye) Türkçesi (11–12. yy.)</b>, ilk İslami Türkçe metinlerin dili."],"kaynak":"Ders 4, s. 2–3, 10, 15"},{"baslik":"Ön Türkçe ve Altay Dil Birliği Teorisi","maddeler":["Teori XX. yy. başlarında ortaya atıldı: Türkçe, Moğolca, Mançuca, Tunguzca ve Korece önce <b>Altaycanın lehçeleri</b> idi, sonra bağımsız diller oldu (Latinceden doğan Fransızca, İspanyolca vb. gibi).","<b>Ramstedt</b> (Fin Mongolist): Altay dillerinin akraba olduğunu <b>ilk</b> ileri süren.","<b>N. Poppe</b> ve <b>P. Aalto</b>: Ramstedt'in öğrencileri, teoriyi savundular.","<b>R. A. Miller</b>: <b>Japoncayı</b> da Altay dillerine katarak aileyi genişletti.","Ön Türkçede Türkçe iki kola ayrılır: <b>Batı kolu = Bulgarca (Eski Çuvaşça)</b>; <b>Doğu kolu = Ana Türkçe (Yakutça ve Genel Türkçe)</b>."],"kaynak":"Ders 4, s. 2–3"},{"baslik":"Bulgarlar","maddeler":["Batı Hun Devleti içindeki Türk kavimlerinden; Attila ölene dek Hunlara bağlı.","VI. yy. ortasına kadar <b>Utigurlar</b> ve <b>Kutrigurlar</b> adıyla yaşadılar; <b>630</b>'da bağımsız devlet kurdular.","Hükümdar <b>Kuvrat</b>'ın ölümünden sonra Hazar baskısıyla dağıldılar: Utigurlar kuzeye, <b>Volga</b> kıyısına; Kutrigurlar batıya, <b>Tuna</b> kıyısına.","<b>Tuna Bulgarları</b>: IX. yy.da Kral Boris zamanında Hristiyanlığı seçip Slavlaştı.","<b>Volga Bulgarları</b>: IX. yy.da İslamiyet'i kabul etti, XVI. yy.da Rusya'ya bağlandı."],"kaynak":"Ders 4, s. 3"},{"baslik":"Eski Türkçe 1: Göktürk Türkçesi (7–9. yy.)","maddeler":["Eski Türkçe: Türklerin İslamiyet'ten önce kullandığı ortak yazı dilinin başlangıç devresi.","Bugünkü <b>Moğolistan</b> sınırlarında kullanıldı. Göktürkler 552–745 arası, <b>Ötüken</b> merkezli iki devlet kurdu; Gök Tanrı inancındaydı; 630–680 arası Çin esaretinde kaldı.","Oğuz, Karluk, Kırgız, Türgiş gibi boyları <b>Türk</b> adı altında birleştirmeye çalıştılar.","Dil: sade, duru cümle; somut kelimeler; Türkçenin <b>en saf dönemi</b>.","Alfabe: <b>38 harf</b> (4 ünlü, 34 ünsüz); sağdan sola veya yukarıdan aşağıya yazılır.","Kitabeler: <b>Çoyr, Orhun, Talas, Yenisey</b>."],"kaynak":"Ders 4, s. 3"},{"baslik":"Göktürk dönemi eserleri","maddeler":["<b>Çoyr (Çoyren, Çöyr) Yazıtı</b>: tarihi belli <b>en eski</b> belge (MS 687–692). Ancak 6 satır ve yıpranmış.","<b>Orhun Yazıtları</b>: metni anlaşılır uzunlukta, hasarı az olduğu için Türk dilinin en eski belgeleri sayılır; <b>hitabet</b> türünün en güzel örneklerinden. Örnekler: Kültigin Anıtı, Tonyukuk.","<b>Irk Bitig (Fal Kitabı)</b>: bu döneme ait, fal üzerine yazılmış <b>tek</b> eser. Londra, British Museum, 8212 numara. <b>65 fal</b>; her falda 3 şans sayısı, fal metni ve iyi/kötü sonucu var."],"kaynak":"Ders 4, s. 3–4"},{"baslik":"Eski Türkçe 2: Uygur Türkçesi (9–14. yy.)","maddeler":["Bugünkü <b>Doğu Türkistan</b>'da kullanıldı. Uygurlar <b>yerleşik hayatın ilk temsilcileri</b>; Buda ve Mani dahil birçok dini benimsediler.","İki devlet: <b>Bozkır Uygur Kağanlığı</b> (Moğolistan, Göktürklerin yerine; Kırgızlar yıktı) ve <b>Hoço Uygur Kağanlığı</b> (Doğu Türkistan; Moğollar yıktı).","Kitabeler ve kâğıt üzerine Uygur, Mani, Soğd, Brahmi, Tibet alfabeleriyle metinler kaldı; çoğu Çince, Toharca, Tibetçe gibi dillerden çeviri ve Budizm'le ilgili.","Göktürkçenin devamı ama <b>sadelikten uzak</b>; <b>soyut</b> kelimelerle söz varlığı genişledi; çevirilerle Çince, Sanskritçe, Toharca kelimeler girdi.","Eserler dört çevrede incelenir: Manici, Budist (Burkancı), Hristiyan, Müslüman."],"kaynak":"Ders 4, s. 10"},{"baslik":"Uygur eserleri (dört çevre)","maddeler":["<b>Manici çevre</b>: bilinen 8 şiir; 2'si <b>Aprın Çor Tigin</b>'e ait. O, <b>adı bilinen ilk Türk şairi</b>. Şiirlerinden biri Mani'ye övgü, diğeri <b>ilk aşk şiiri</b> olan <b>“Sevgili”</b>. Nesir az; çoğu dinî metin ve dua.","<b>Budist (Burkancı) çevre</b>: çok sayıda dinî manzume. Nesir eserler:","• <b>Altun Yaruk (Altın Işık)</b>: Budizm'in inanç ve felsefesi, Buda'nın vaazları; <b>700 sayfa</b>. İçinde <b>Şehzade ile Aç Pars Hikâyesi</b> (şehzade kendini aç parsa yem eder).","• <b>Sekiz Yükmek (Sekiz Yığın)</b>: Budizm'in inanç ve felsefesi.","• <b>Prens Kalyanamkara ve Papamkara Hikâyesi</b> (İyi ve Kötü Düşünceli Şehzade): iki kardeş arasında geçen Budist menkıbe; iyi şehzade sonunda Buda olur.","<b>Hristiyan çevre</b>: Nesturi kolu; İncil'den Uygurcaya çevrilmiş parçalar.","<b>Müslüman çevre</b>: 13. yy.dan itibaren Hoço çevresinde; birkaç şiir."],"kaynak":"Ders 4, s. 11–12"},{"baslik":"Orta Türkçe: Karahanlı (Hakaniye) Türkçesi (11–12. yy.)","maddeler":["Karahanlı devrinde Orta Asya'da gelişen <b>ilk İslami Türkçe metinlerin</b> dili.","Uygur geleneği + İslam kültürü = <b>Türk-İslam sentezi</b>.","Uygur alfabesinin yanında <b>Arap alfabesi</b> de kullanılmaya başlandı."],"kaynak":"Ders 4, s. 15"},{"baslik":"Karahanlı eserleri: eser → yazar → özellik","maddeler":["<b>Satır Altı Kur'an Tercümeleri</b>: kelime kelime karşılık verilir; Karahanlı dönemine ait sanılan 4 nüsha: İstanbul, Taşkent, Manchester, Petersburg.","<b>Kutadgu Bilig (Mutlu Olma Bilgisi)</b> → <b>Yusuf Has Hâcip</b>, 1069/1070. 6645 beyit, aruz ölçüsü, mesnevi, manzum. İslamiyet etkisindeki Türk edebiyatının <b>ilk ürünü</b>; nazım edebiyatının temeli. Ahlak kitabı ve <b>siyasetname</b>; karşılıklı konuşma tarzı.","Kutadgu Bilig'in dört kişisi: <b>Kün-Togdı</b> = adalet (hükümdar); <b>Ay-Toldı</b> = saadet/devlet (vezir); <b>Ögdülmiş</b> = akıl (vezirin oğlu); <b>Odgurmış</b> = akıbet (vezirin kardeşi).","<b>Divânü Lügati’t Türk</b> → <b>Kaşgarlı Mahmut</b>. Türk diliyle ilgili <b>ilk ansiklopedik sözlük</b>; Türkçenin ilk dil bilgisi kitabı sayılır (asıl ilki aynı yazarın günümüze ulaşmayan <b>Kitabu Cevahirü’n-Nahv</b>'i). Amaç: Türkçenin <b>Arapça kadar</b> zengin olduğunu göstermek. Folklor antolojisi: yaklaşık 300 şiir, bir o kadar atasözü (sav). <b>Daire biçimli harita</b>, merkezi <b>Balasagun</b> (ilk Türk dünya haritası). Tek nüsha: İstanbul <b>Millet Kütüphanesi</b>.","DLT'nin bulunuşu: Burhan Efendi → Maarif Nezareti 30 sarı lirayı çok bulur → <b>Ali Emirî</b> satın alır; Talât Paşa'nın araya girmesiyle basılır; basıma <b>Kilisli Muallim Rifat</b> hazırlar.","<b>Atebetü’l-Hakayık (Hakikatlerin Eşiği)</b> → <b>Edib Ahmed bin Yüknekî</b>, <b>XII. yy.</b> Dinî, tasavvufi, ahlaki; öğütler ayet ve hadislere dayanır. Yazar Çin kaynaklarına göre doğuştan kör.","<b>Divân-ı Hikmet</b> → <b>Ahmet Yesevî</b>. Tasavvufi şiirler (hikmetler); hikmetler <b>Türk tasavvuf edebiyatının temeli</b>. Yesevî 63 yaşında yer altında çilehaneye çekildi (efsanevi ömrü 130 yıl)."],"kaynak":"Ders 4, s. 15–20"},{"baslik":"“İlk”ler ve “tek”ler (Ders 4)","maddeler":["İlk yazılı belgeler: Göktürk kitabeleri (Eski Türkçe).","Tarihi belli en eski belge: Çoyr Yazıtı (687–692).","Fal üzerine tek eser: Irk Bitig.","Adı bilinen ilk Türk şairi: Aprın Çor Tigin; ilk aşk şiiri: “Sevgili”.","Yerleşik hayatın ilk temsilcileri: Uygurlar.","İlk İslami Türkçe metinler: Karahanlı Türkçesi.","İslamiyet etkisindeki Türk edebiyatının ilk ürünü: Kutadgu Bilig.","Türk diliyle ilgili ilk ansiklopedik sözlük, ilk dil bilgisi kitabı (sayılan), ilk Türk dünya haritası: Divânü Lügati’t Türk.","Türk tasavvuf edebiyatının temeli: Divân-ı Hikmet'teki hikmetler."],"kaynak":"Ders 4, s. 2–20"}],"kurallar":[],"sorular":[{"id":"d4-s01","tip":"donem-tanima","oncul":"Türkçenin yazılı belgelerinden önceki devredir. Bu devrede Türkçenin Moğolca, Mançuca, Tunguzca ve Korece ile ortak bir dilin lehçesi olduğu düşünülür. Türkçe bu devrede batıda Bulgarca, doğuda Ana Türkçe olmak üzere iki kola ayrılır.","soru":"Yukarıda anlatılan devre aşağıdakilerden hangisidir?","siklar":["Ön Türkçe","Eski Türkçe","Orta Türkçe","Göktürk Türkçesi","Karahanlı Türkçesi"],"dogru":0,"neden":"Altay dil birliği ve Bulgarca–Ana Türkçe ayrımı Ön Türkçe devresine aittir. Eski Türkçe yazılı belgelerle (Göktürk kitabeleri) başlar.","kaynak":"Ders 4, s. 2–3"},{"id":"d4-s02","tip":"donem-tanima","oncul":"Bugünkü Doğu Türkistan sınırları içinde kullanılmıştır. Bu dili konuşan topluluk yerleşik hayata geçmiş, Mani ve Buda gibi birçok dini benimsemiştir. Dil sadelikten uzaklaşmış; söz varlığı soyut kelimelerle ve çeviriler yoluyla giren yabancı kelimelerle genişlemiştir.","soru":"Yukarıda özellikleri verilen tarihî Türk lehçesi aşağıdakilerden hangisidir?","siklar":["Göktürk Türkçesi","Uygur Türkçesi","Karahanlı Türkçesi","Bulgarca (Eski Çuvaşça)","Harezm Türkçesi"],"dogru":1,"neden":"Doğu Türkistan, yerleşik hayat, Mani ve Buda dinleri ile soyut ve yabancı kelimelerle genişleyen söz varlığı Uygur Türkçesinin özellikleridir. Göktürkçe ise sade ve somut kelimelidir.","kaynak":"Ders 4, s. 10"},{"id":"d4-s03","tip":"donem-tanima","oncul":"Uygur geleneğinin İslam kültürüyle birleşmesinden doğmuştur. Bu dönemde Uygur alfabesinin yanında Arap alfabesi de kullanılmaya başlanmıştır. İlk İslami Türkçe metinler bu dille yazılmıştır.","soru":"Yukarıda sözü edilen dil aşağıdakilerden hangisidir?","siklar":["Göktürk Türkçesi","Uygur Türkçesi","Ön Türkçe","Karahanlı Türkçesi","Bulgarca (Eski Çuvaşça)"],"dogru":3,"neden":"Türk-İslam sentezi, Arap alfabesinin kullanılmaya başlanması ve ilk İslami Türkçe metinler Karahanlı (Hakaniye) Türkçesini, yani Orta Türkçeyi gösterir.","kaynak":"Ders 4, s. 15"},{"id":"d4-s04","tip":"donem-tanima","oncul":"Bugünkü Moğolistan sınırları içinde kullanılmıştır. Cümle yapısı sade ve durudur, kelime hazinesi somut kelimelerden oluşur; bu yüzden Türkçenin en saf dönemi kabul edilir. Kullanılan alfabe 38 harflidir.","soru":"Yukarıda özellikleri verilen dönem aşağıdakilerden hangisidir?","siklar":["Uygur Türkçesi","Karahanlı Türkçesi","Göktürk Türkçesi","Ön Türkçe","Harezm Türkçesi"],"dogru":2,"neden":"Sade cümle, somut kelimeler, “en saf dönem” ve 38 harfli alfabe Göktürk Türkçesine aittir. Uygur Türkçesi ise sadelikten uzaktır.","kaynak":"Ders 4, s. 3"},{"id":"d4-s05","tip":"eser-donem","oncul":"","soru":"Aşağıdaki eserlerden hangisi Uygur Türkçesi dönemine aittir?","siklar":["Kutadgu Bilig","Irk Bitig","Atebetü’l-Hakayık","Divân-ı Hikmet","Altun Yaruk"],"dogru":4,"neden":"Altun Yaruk, Budist (Burkancı) çevreye ait bir Uygur eseridir. Irk Bitig Göktürk dönemine; diğer üçü Karahanlı (Orta Türkçe) dönemine aittir.","kaynak":"Ders 4, s. 11"},{"id":"d4-s06","tip":"eser-donem","oncul":"","soru":"Aşağıdaki eserlerden hangisi Karahanlı Türkçesi dönemine ait <u>değildir</u>?","siklar":["Atebetü’l-Hakayık","Divânü Lügati’t Türk","Sekiz Yükmek","Kutadgu Bilig","Satır Altı Kur'an Tercümeleri"],"dogru":2,"neden":"Sekiz Yükmek, Uygur Türkçesi döneminde Budist çevreden kalmış bir eserdir. Diğerleri Karahanlı Türkçesiyle yazılmıştır.","kaynak":"Ders 4, s. 11, 15–16"},{"id":"d4-s07","tip":"eser-donem","oncul":"","soru":"Aşağıdakilerden hangisi Göktürk Türkçesi dönemine ait <u>değildir</u>?","siklar":["Çoyr Yazıtı","Talas Kitabeleri","Irk Bitig","Prens Kalyanamkara ve Papamkara Hikâyesi","Yenisey Kitabeleri"],"dogru":3,"neden":"Prens Kalyanamkara ve Papamkara Hikâyesi, Uygur döneminde Budist çevreye ait bir menkıbedir. Çoyr, Talas ve Yenisey kitabeleri ile Irk Bitig Göktürk dönemine aittir.","kaynak":"Ders 4, s. 3–4, 11"},{"id":"d4-s08","tip":"eser-donem","oncul":"","soru":"İlk aşk şiiri kabul edilen “Sevgili” şiiri hangi dönemde yazılmıştır?","siklar":["Göktürk Türkçesi","Uygur Türkçesi","Karahanlı Türkçesi","Ön Türkçe","Harezm Türkçesi"],"dogru":1,"neden":"“Sevgili”, Manici çevreden kalan ve Aprın Çor Tigin'e ait olan bir Uygur dönemi şiiridir.","kaynak":"Ders 4, s. 11"},{"id":"d4-s09","tip":"eser-yazar","oncul":"","soru":"Kutadgu Bilig aşağıdakilerden hangisinin eseridir?","siklar":["Yusuf Has Hâcip","Kaşgarlı Mahmut","Edib Ahmed bin Yüknekî","Ahmet Yesevî","Aprın Çor Tigin"],"dogru":0,"neden":"Kutadgu Bilig'i Yusuf Has Hâcip 1069/1070'te tamamlamıştır. Kaşgarlı Mahmut DLT'yi, Edib Ahmed Atebetü’l-Hakayık'ı, Ahmet Yesevî Divân-ı Hikmet'i yazmıştır.","kaynak":"Ders 4, s. 16"},{"id":"d4-s10","tip":"eser-yazar","oncul":"","soru":"Aşağıdaki eser – yazar eşleştirmelerinden hangisi <u>yanlıştır</u>?","siklar":["Divânü Lügati’t Türk – Kaşgarlı Mahmut","Atebetü’l-Hakayık – Edib Ahmed bin Yüknekî","Divân-ı Hikmet – Yusuf Has Hâcip","Kitabu Cevahirü’n-Nahv – Kaşgarlı Mahmut","“Sevgili” şiiri – Aprın Çor Tigin"],"dogru":2,"neden":"Divân-ı Hikmet Ahmet Yesevî'nindir. Yusuf Has Hâcip'in eseri Kutadgu Bilig'dir.","kaynak":"Ders 4, s. 11, 16–20"},{"id":"d4-s11","tip":"eser-yazar","oncul":"","soru":"XII. yüzyılda yazılan, öğütlerini ayet ve hadislere dayandıran dinî, tasavvufi ve ahlaki eser Atebetü’l-Hakayık'ın yazarı aşağıdakilerden hangisidir?","siklar":["Ahmet Yesevî","Kaşgarlı Mahmut","Yusuf Has Hâcip","Edib Ahmed bin Yüknekî","Kilisli Muallim Rifat"],"dogru":3,"neden":"Atebetü’l-Hakayık'ı Edib Ahmed bin Yüknekî yazmıştır; Çin kaynaklarına göre doğuştan kördür. Kilisli Muallim Rifat ise DLT'yi basıma hazırlayan kişidir.","kaynak":"Ders 4, s. 19"},{"id":"d4-s12","tip":"bilgi-yanlisi","oncul":"I. Irk Bitig, Göktürk döneminden kalan ve fal üzerine yazılmış tek eserdir.\nII. Altun Yaruk, Buda'nın vaazlarını içeren ve Budist çevreye ait bir eserdir.\nIII. Kutadgu Bilig, İslamiyet'in etkisindeki Türk edebiyatının ilk ürünüdür.\nIV. Divânü Lügati’t Türk, Türkçenin Farsçadan üstün olduğunu göstermek için yazılmıştır.\nV. Divân-ı Hikmet, Ahmet Yesevî'nin tasavvufi şiirlerinden oluşur.","soru":"Yukarıdaki numaralı cümlelerin hangisinde bilgi yanlışı vardır?","siklar":["I","II","III","IV","V"],"dogru":3,"neden":"DLT, Türkçenin <b>Arapça</b> kadar zengin olduğunu göstermek için yazılmıştır. Türkçeyi Farsçayla karşılaştıran eser Nevâî'nin Muhakemetü’l-Lugateyn'idir (Ders 5).","kaynak":"Ders 4, s. 4, 11, 16–17, 20","karistirma":false},{"id":"d4-s13","tip":"bilgi-yanlisi","oncul":"I. Göktürk Türkçesi bugünkü Moğolistan sınırları içinde kullanılmıştır.\nII. Uygur Türkçesi, Göktürkçe gibi sade ve somut kelimelerden oluşan bir dildir.\nIII. Karahanlı Türkçesine Hakaniye Türkçesi de denir.\nIV. Uygurlardan Mani, Soğd, Brahmi ve Tibet alfabeleriyle yazılmış metinler de kalmıştır.\nV. Bozkır Uygur Kağanlığı'nı Kırgızlar yıkmıştır.","soru":"Yukarıdaki numaralı cümlelerin hangisinde bilgi yanlışı vardır?","siklar":["I","II","III","IV","V"],"dogru":1,"neden":"Uygur Türkçesi Göktürkçenin devamıdır ama sadelikten uzaktır ve soyut kelimelerle genişlemiştir. Sade ve somut kelimeli olan Göktürk Türkçesidir.","kaynak":"Ders 4, s. 3, 10, 15","karistirma":false},{"id":"d4-s14","tip":"bilgi-yanlisi","oncul":"I. Kutadgu Bilig, 6645 beyitlik, mesnevi biçiminde yazılmış manzum bir eserdir.\nII. Divânü Lügati’t Türk'teki haritanın merkezinde Balasagun yer alır.\nIII. Irk Bitig'de 65 fal bulunur.\nIV. Altun Yaruk 700 sayfalık büyük bir eserdir.\nV. Divânü Lügati’t Türk'ün bilinen tek nüshası Londra'daki British Museum'dadır.","soru":"Yukarıdaki numaralı cümlelerin hangisinde bilgi yanlışı vardır?","siklar":["I","II","III","IV","V"],"dogru":4,"neden":"DLT'nin bilinen tek nüshası İstanbul'daki Millet Kütüphanesindedir. Londra'da British Museum'da saklanan eser Irk Bitig'dir.","kaynak":"Ders 4, s. 4, 11, 16–17","karistirma":false},{"id":"d4-s15","tip":"bilgi-yanlisi","oncul":"","soru":"Altay Dil Birliği Teorisi ile ilgili aşağıdakilerden hangisi <u>yanlıştır</u>?","siklar":["Teori XX. yüzyıl başlarında ortaya atılmıştır.","Teori, Ön Türkçe devresiyle ilgili olarak ortaya atılmıştır.","Teoriyi Ramstedt'in öğrencileri N. Poppe ve P. Aalto savunmuştur.","Japoncayı Altay dillerinin içine katan araştırmacı N. Poppe'dur.","Teoriye göre Türkçe ve Moğolca bir zamanlar Altaycanın lehçeleriydi."],"dogru":3,"neden":"Japoncayı Altay dillerine katarak aileyi genişleten R. A. Miller'dır. Poppe, Aalto ile birlikte teoriyi savunan öğrencilerdendir.","kaynak":"Ders 4, s. 2–3"},{"id":"d4-s16","tip":"kavram","oncul":"","soru":"Türk dilinin tarihi belli en eski belgesi olduğu hâlde, yalnızca 6 satır olması ve taşının yıpranmış olması yüzünden Orhun Yazıtları kadar öne çıkmayan yazıt hangisidir?","siklar":["Çoyr Yazıtı","Talas Kitabeleri","Yenisey Kitabeleri","Tonyukuk Yazıtı","Kültigin Yazıtı"],"dogru":0,"neden":"Çoyr (Çoyren) Yazıtı MS 687–692 tarihlidir. Orhun Yazıtları (Kültigin, Tonyukuk) ise uzun ve az hasarlı oldukları için en eski belgeler olarak değerlendirilir.","kaynak":"Ders 4, s. 4"},{"id":"d4-s17","tip":"kavram","oncul":"","soru":"Kutadgu Bilig'deki kişi – temsil ettiği kavram eşleştirmelerinden hangisi doğrudur?","siklar":["Kün-Togdı – adalet","Ay-Toldı – akıl","Ögdülmiş – akıbet","Odgurmış – saadet","Ay-Toldı – adalet"],"dogru":0,"neden":"Kün-Togdı (hükümdar) adaleti temsil eder. Ay-Toldı saadet/devlet, Ögdülmiş akıl, Odgurmış akıbettir.","kaynak":"Ders 4, s. 16"},{"id":"d4-s18","tip":"kavram","oncul":"","soru":"Kaşgarlı Mahmut'un yazdığı, aslında Türkçenin ilk dil bilgisi kitabı olan ama günümüze ulaşmayan eser hangisidir?","siklar":["Kitabu Cevahirü’n-Nahv","Divânü Lügati’t Türk","Atebetü’l-Hakayık","Sekiz Yükmek","Kutadgu Bilig"],"dogru":0,"neden":"Ders notuna göre asıl ilk dil bilgisi kitabı Kitabu Cevahirü’n-Nahv'dır; günümüze ulaşmadığı için DLT ilk dil bilgisi kitabı sayılır.","kaynak":"Ders 4, s. 17"}],"kartlar":[{"id":"d4-k01","on":"Ön Türkçe","arka":"Yazılı belgelerden önceki devre. Altay dil birliği dönemi. Batı kolu: Bulgarca (Eski Çuvaşça). Doğu kolu: Ana Türkçe (Yakutça + Genel Türkçe).","kaynak":"Ders 4, s. 2–3"},{"id":"d4-k02","on":"Altay teorisinin araştırmacıları","arka":"Ramstedt: akrabalığı ilk ileri süren (Fin Mongolist). N. Poppe ve P. Aalto: öğrencileri, savundular. R. A. Miller: Japoncayı ekledi.","kaynak":"Ders 4, s. 3"},{"id":"d4-k03","on":"Çoyr (Çoyren) Yazıtı","arka":"Göktürk. Tarihi belli en eski belge (MS 687–692). 6 satır, yıpranmış.","kaynak":"Ders 4, s. 4"},{"id":"d4-k04","on":"Orhun Yazıtları","arka":"Göktürk Türkçesi. Uzun ve az hasarlı oldukları için en eski belgeler sayılır. Hitabet türünün en güzel örneklerinden (Kültigin, Tonyukuk).","kaynak":"Ders 4, s. 3–4"},{"id":"d4-k05","on":"Irk Bitig","arka":"Göktürk dönemi. Fal üzerine yazılmış tek eser. 65 fal; her falda 3 şans sayısı. Londra, British Museum, 8212.","kaynak":"Ders 4, s. 4"},{"id":"d4-k06","on":"Göktürk alfabesi","arka":"38 harf: 4 ünlü, 34 ünsüz. Sağdan sola veya yukarıdan aşağıya yazılır.","kaynak":"Ders 4, s. 3"},{"id":"d4-k07","on":"Aprın Çor Tigin","arka":"Uygur, Manici çevre. Adı bilinen ilk Türk şairi. İki şiiri: Mani'ye övgü ve ilk aşk şiiri “Sevgili”.","kaynak":"Ders 4, s. 11"},{"id":"d4-k08","on":"Altun Yaruk (Altın Işık)","arka":"Uygur, Budist çevre. Budizm'in inanç ve felsefesi, Buda'nın vaazları; 700 sayfa. İçinde Şehzade ile Aç Pars Hikâyesi.","kaynak":"Ders 4, s. 11–12"},{"id":"d4-k09","on":"Sekiz Yükmek / Kalyanamkara ve Papamkara","arka":"İkisi de Uygur, Budist (Burkancı) çevre. Sekiz Yükmek: Budizm'in inanç ve felsefesi. Kalyanamkara ve Papamkara: iki şehzade kardeşin menkıbesi; iyi şehzade Buda olur.","kaynak":"Ders 4, s. 11"},{"id":"d4-k10","on":"Satır Altı Kur'an Tercümeleri (Karahanlı)","arka":"Kelime kelime karşılık verilir. Karahanlı dönemine ait sanılan 4 nüsha: İstanbul, Taşkent, Manchester, Petersburg.","kaynak":"Ders 4, s. 15–16"},{"id":"d4-k11","on":"Kutadgu Bilig","arka":"Yusuf Has Hâcip, 1069/1070, Karahanlı. 6645 beyit, aruz, mesnevi. İslami etkideki Türk edebiyatının ilk ürünü; siyasetname; karşılıklı konuşma.","kaynak":"Ders 4, s. 16"},{"id":"d4-k12","on":"Kutadgu Bilig'in dört kişisi","arka":"Kün-Togdı: adalet (hükümdar). Ay-Toldı: saadet/devlet (vezir). Ögdülmiş: akıl (vezirin oğlu). Odgurmış: akıbet (vezirin kardeşi).","kaynak":"Ders 4, s. 16"},{"id":"d4-k13","on":"Divânü Lügati’t Türk","arka":"Kaşgarlı Mahmut, Karahanlı. Türk diliyle ilgili ilk ansiklopedik sözlük; ilk dil bilgisi kitabı sayılır. Amaç: Türkçe Arapça kadar zengin. ~300 şiir ve atasözü. Daire harita, merkez Balasagun. Tek nüsha: Millet Kütüphanesi.","kaynak":"Ders 4, s. 17"},{"id":"d4-k14","on":"DLT'nin bulunuşu ve basılışı","arka":"Burhan Efendi getirir; Maarif Nezareti 30 sarı lirayı çok bulur; Ali Emirî satın alır. Talât Paşa'nın araya girmesiyle basılır; Kilisli Muallim Rifat hazırlar.","kaynak":"Ders 4, s. 17–18"},{"id":"d4-k15","on":"Atebetü’l-Hakayık (Hakikatlerin Eşiği)","arka":"Edib Ahmed bin Yüknekî, XII. yy., Karahanlı. Dinî, tasavvufi, ahlaki; ayet ve hadislere dayanır. Yazar doğuştan kör.","kaynak":"Ders 4, s. 19"},{"id":"d4-k16","on":"Divân-ı Hikmet","arka":"Ahmet Yesevî, Karahanlı. Tasavvufi şiirler (hikmetler); Türk tasavvuf edebiyatının temeli. 63 yaşında yer altındaki çilehaneye çekilir.","kaynak":"Ders 4, s. 20"}]},{"id":"d5","ders":5,"baslik":"Türk Dilinin Tarihî Gelişimi II","kisa":"Tarihî gelişim II","ozet":[{"baslik":"Yeni Türkçe devresinin başlangıcı","maddeler":["XIII. yy.da özellikle <b>Moğol istilasının</b> yol açtığı göçlerle Türkçe aynı anda iki yazı diline ayrıldı: biri <b>Harezm</b>'de, biri <b>Anadolu</b>'da.","Bu devrede fark
