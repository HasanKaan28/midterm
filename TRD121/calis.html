lı dil özellikleri taşıyan lehçeler edebiyat dili olarak gelişti.","Ders notu Harezm Türkçesini Yeni Türkçe devresinde ele alır. Devre üç kolda incelenir: <b>Kuzey (Kıpçak)</b>, <b>Doğu (Çağatay)</b>, <b>Batı (Eski Anadolu ve Osmanlı Türkçesi)</b>."],"kaynak":"Ders 5, s. 2"},{"baslik":"Harezm Türkçesi (13–14. yy.)","maddeler":["Ceyhun Irmağı'nın Aral Gölü'ne döküldüğü yerde, Karakum ile Kızılkum çölleri arasında oluştu; Altın Orda şehirlerinde ve Kırım'da da etkili oldu.","<b>Karahanlı Türkçesinin devamı</b>; içinde Kıpçakça ve Oğuzca ögeler var: <b>tam bir geçiş dönemi Türkçesi</b>.","Eserler (eser → yazar):","• Satır Altı Kur'an Tercümesi","• <b>Mukaddimetü’l-Edeb</b> (Edebi Öğrenime Giriş) → <b>Zamahşerî</b>; Arapça pratik bir sözlük.","• <b>Kısasü’l-Enbiyâ</b> (Peygamberler Kıssaları) → <b>Rabguzi</b> mahlaslı bir kadı.","• <b>Mu’înü’l-Mürid</b> (Müridin Yardımcısı) → <b>İslâm</b> mahlaslı bir şair; dinî, tasavvufi.","• <b>Hüsrev ü Şîrîn</b> → <b>Kutb</b>; Nizamî'nin mesnevisinin Türk edebiyatındaki <b>ilk tercümesi</b>.","• <b>Nehcü’l-Ferâdis</b> (Cennetlerin Açık Yolu) → <b>Kerderli Mahmud</b>; kırk hadis ve onları açıklayan menkıbeler; dinî, ahlaki."],"kaynak":"Ders 5, s. 2–3"},{"baslik":"Kuzey Türkçesi: Kıpçak Türkçesi (14–16. yy.)","maddeler":["Hazar Denizi ile Karadeniz'in kuzeyindeki göçler Kuman ve Kıpçak unsurlara dayandığı için bu bölgedeki yazı dilleri Kıpçakça temelinde gelişti.","Avrasya'dan Orta Doğu'ya uzanan geniş bölgede önemli bir edebiyat dili oldu.","Eserler üç grupta: (a) Karadeniz'in kuzeyinde <b>Deşt-i Kıpçak</b>'ta yazılan, (b) <b>Memlûkler</b> devrinde yazılan, (c) <b>Kırım</b>'da yazılan eserler.","<b>Codex Cumanicus</b> (Kumanca Bilgiler Kitabı): Deşt-i Kıpçak; Kıpçakların diline dair gramer kuralları ve sözlük; Hristiyan ilahileri ve bilmeceler. Amacı bilinmiyor: yabancılara Türkçe öğretmek ya da Kumanlara Hristiyanlığı yaymak olduğu sanılıyor."],"kaynak":"Ders 5, s. 3"},{"baslik":"Doğu Türkçesi: Çağatay Türkçesi (15–20. yy.)","maddeler":["Timurlular döneminde İlhanlı ve Altın Orda devletlerinin kültür merkezlerinde gelişen yazı dili.","En büyük ismi <b>Ali Şîr Nevâî</b>: beş mesnevi, dört divan.","Nevâî → <b>Muhakemetü’l-Lugateyn</b> (İki Dilin Muhakemesi): Türkçeyi <b>Farsçayla</b> karşılaştırıp Türkçenin üstün olduğunu anlatır.","Nevâî → <b>Mecâlisü’n-Nefâis</b> (Nefis Meclisleri): edebiyatımızın <b>ilk tezkiresi</b> sayılır.","Öteki önemli isimler: Sekkâkî, Haydar Tilbe, Gedâî, Hüseyin Baykara, Şeybanî Han, Bâbur, Ebulgazi Bahadır Han."],"kaynak":"Ders 5, s. 4"},{"baslik":"Batı Türkçesi 1: Eski Anadolu Türkçesi (13–15. yy.)","maddeler":["1071 Malazgirt (Alp Arslan) sonrası Oğuzlar Anadolu'ya yerleşti; 1075'te Anadolu Selçuklu Devleti kuruldu.","XIII. yy.da Moğolların Orta Asya'yı işgaliyle Türkistan'daki Oğuzlar da Anadolu ve Azerbaycan'a göçtü; 1243 Moğol istilasıyla Selçuklu dağıldı, Beylikler dönemi başladı.","<b>Oğuz-Türkmen lehçesinin yazı diline dönüştüğü</b> dönem.","Marco Polo: Anadolu = <b>Turcia Minor</b> (Küçük Türkiye), Orta Asya = <b>Turcia Major</b> (Büyük Türkiye).","Moğollardan kaçan şeyhlerle Anadolu'da tasavvuf gelişti; göçenler destan ve türkülerini getirdi.","İran yoluyla gelen Divan edebiyatı ilk eserlerini XIII. yy.da verdi. <b>Hoca Dehhani</b>: yalnız din dışı konularda kaside ve gazel yazan, Divan edebiyatının ilk şairlerinden.","<b>XIII. yy.</b>: Ahmed Fakih → <b>Çarhname</b>; Sultan Veled → <b>Divan</b>; Şeyyad Hamza → <b>Yusuf u Zeliha</b>; <b>Yunus Emre</b>'nin şiirleri.","<b>XIV. yy.</b>: Hoca Mesud → <b>Süheyl ü Nevbahar</b>; Aşık Paşa → <b>Garipname</b>; Kadı Burhaneddin → <b>Divan</b>.","<b>XV. yy.</b>: Süleyman Çelebi → <b>Mevlid</b>; Şeyhi → <b>Hüsrev ü Şirin</b>; Bergamalı Kadri → <b>Müyessiretü’l-Ulum</b>; <b>Kitab-ı Dede Korkut</b>."],"kaynak":"Ders 5, s. 4–5"},{"baslik":"Batı Türkçesi 2: Osmanlı Türkçesi (16–20. yy.)","maddeler":["Osmanlı Devleti'nin hüküm sürdüğü yerlerde kullanılan tarihî Türk lehçesi; üç dönem.","<b>a. Klasik devir</b> (XVI.–XIX. yy.): edebiyat Divan (klasik) ve Halk edebiyatı olarak iki koldan gelişti. Edebiyat dili Arapça, Farsça ve Türkçe karışımı <b>suni</b> bir dil oldu; yabancı ögeler arttı, <b>yazı dili konuşma dilinden ayrıldı</b>.","Divan temsilcileri: Zati, Fuzuli, Baki, Şeyhülislam Yahya, Nefi, Nabi, Nedim, Şeyh Galip, Evliya Çelebi, Kâtip Çelebi, Naima, İbrahim Peçevi. Halk temsilcileri: Karacaoğlan, Aşık Ömer, Erzurumlu Emrah, Dadaloğlu.","<b>b. Tanzimat devresi</b>: edebiyatın Batı'ya yönelen <b>ilk safhası</b>. 1839 Tanzimat Fermanı; makale, fıkra, deneme, hikâye, roman, tiyatro; gazetelerin rolü büyük. İsimler (ders notundaki listeyle): Ahmet Midhat Efendi, Şinasi, Muallim Naci, Namık Kemal, Ziya Paşa; Tevfik Fikret, Cenap Şahabettin, Halit Ziya.","<b>c. Yeni Lisan devresi</b>: <b>1911</b>, <b>Selanik</b>, <b>Genç Kalemler</b> dergisi; öncüler <b>Ziya Gökalp, Ömer Seyfettin, Ali Canip</b>. Amaç: millî edebiyat, Arapça-Farsça tamlamaları kaldırmak, <b>İstanbul ağzına</b> dayalı yazı dili, yazı dili ile konuşma dili arasındaki farkı kaldırmak."],"kaynak":"Ders 5, s. 5"},{"baslik":"Bugünkü durum ve kavramlar","maddeler":["Türkçe Avrupa, Asya ve Afrika'da konuşulur; yoğun olarak Türkiye, Özbekistan, İran, Çin, Kazakistan.","Yaklaşık <b>220 milyon</b> konuşur, dünya nüfusunun ortalama <b>%3</b>'ü.","<b>Lehçe</b>: bir dilin tarihî, siyasi, sosyal, kültürel nedenlerle farklı bölgelerde ses yapısı ve kelime hazinesi bakımından <b>önemli</b> farklarla ayrılan kollarından her biri.","<b>Şive</b>: söyleyiş özelliği.","<b>Ağız</b>: bir dilin veya lehçenin, yazı diline göre çoğunlukla ses, bazen anlam ve söz varlığı bakımından <b>az çok</b> ayrılan konuşma biçimleri (İstanbul, Aydın, Konya ağzı).","<b>Konuşma dili</b>: ağızdan ağza değişen, yazı dilinden farklı söyleyiş özellikleri taşıyan dil.","<b>Yazı dili</b>: lehçe veya ağızlardan birinin zamanla ortak hâle gelip yazılmasıyla kurulan dil.","Lehçelerin bir kısmı yalnız konuşma dili; <b>yirmiye yakını</b> yazı dili. Yazı dili örnekleri: Türkiye, Kırgız, Azeri, Tatar Türkçesi. Yalnız konuşma dili: <b>Horasan, Halaç, Salar</b> Türkçesi.","Türkçeyle ilgili <b>ilk sınıflandırma</b>: Kaşgarlı Mahmut, Divânü Lügati’t Türk."],"kaynak":"Ders 5, s. 6–7"},{"baslik":"Çağdaş lehçelerin altı grubu ve yayılma alanları","maddeler":["<b>1. Bulgar grubu</b>: <b>Çuvaşça</b> (Çuvaşistan, Tataristan, Başkurdistan).","<b>2. Oğuz grubu</b>: <b>Türkiye Türkçesi</b> (Türkiye, Irak, Suriye, Kıbrıs, Yunanistan, Bulgaristan, Makedonya, Avrupa, Amerika, Avustralya, Arap ülkeleri); <b>Gagavuz</b> (güney Moldova, Ukrayna, Romanya, Bulgaristan); <b>Azeri</b> (Azerbaycan ve İran'daki Güney Azerbaycan); <b>Halaç</b> (İran, Tahran'ın 200 km güneyi, Kum ve Arak); <b>Horasan</b> (İran'ın Horasan bölgesi); <b>Türkmen</b> (Türkmenistan, Horasan, Afganistan, Pakistan).","<b>3. Uygur grubu</b>: <b>Özbek</b> (Özbekistan, Afganistan, Tacikistan, Kırgızistan, Kazakistan, Türkmenistan); <b>Yeni Uygur</b> (Çin, Doğu Türkistan); <b>Sarı Uygur</b> (Çin, Gansu); <b>Salar</b> (Çin, Çinhai ve Gansu, Doğu Türkistan).","<b>4. Kıpçak grubu</b>: <b>Karay (Karaim)</b> (Polonya, Litvanya, Kırım; Musevi Karaylar); <b>Kırım</b> (Kırım, Romanya); <b>Karaçay-Balkar</b> (Kuzey Kafkasya); <b>Kumuk</b> (Kuzeydoğu Kafkasya, Dağıstan); <b>Tatar</b> (Tataristan, Kırım); <b>Başkurt</b> (Başkurt Muhtar Cumhuriyeti); <b>Kazak</b> (Kazakistan, Doğu Türkistan); <b>Kırgız</b> (Kırgızistan, Doğu Türkistan); <b>Karakalpak</b> (Özbekistan'a bağlı Karakalpak Muhtar Cumhuriyeti); <b>Nogay</b> (Dağıstan, Karaçay-Çerkez, Çeçen-İnguş).","<b>5. Güney Sibirya grubu</b>: <b>Altay</b> (Dağlık Altay); <b>Hakas</b> (Hakas Muhtar Cumhuriyeti, Çin); <b>Şor</b> (Hakas Muhtar Cumhuriyeti'ndeki Şorlar); <b>Tuva</b> (Tuva Muhtar Cumhuriyeti).","<b>6. Kuzey Sibirya grubu</b>: <b>Yakutça</b> (Yakut Muhtar Cumhuriyeti)."],"kaynak":"Ders 5, s. 7–9"},{"baslik":"“İlk”ler ve ezber eşleşmeleri (Ders 5)","maddeler":["Nizamî'nin Hüsrev ü Şîrîn'inin Türk edebiyatındaki ilk tercümesi: <b>Kutb</b> (Harezm). Dikkat: Eski Anadolu Türkçesinde (XV. yy.) <b>Şeyhi</b>'nin de Hüsrev ü Şirin'i var.","Edebiyatımızın ilk tezkiresi: <b>Mecâlisü’n-Nefâis</b> (Nevâî, Çağatay).","Türkçe–Farsça karşılaştırması: <b>Muhakemetü’l-Lugateyn</b> (Nevâî). Türkçe–Arapça (Türkçe Arapça kadar zengin): DLT (Ders 4).","Divan edebiyatının ilk şairlerinden: <b>Hoca Dehhani</b>.","Edebiyatın Batı'ya yönelen ilk safhası: <b>Tanzimat</b>.","Türkçeyle ilgili ilk sınıflandırma: <b>Kaşgarlı Mahmut</b> (DLT).","Yüzyıllar: Harezm 13–14 · Kıpçak 14–16 · Çağatay 15–20 · Eski Anadolu 13–15 · Osmanlı 16–20."],"kaynak":"Ders 5, s. 3–7"}],"kurallar":[],"sorular":[{"id":"d5-s01","tip":"donem-tanima","oncul":"Ceyhun Irmağı'nın Aral Gölü'ne döküldüğü bölgede oluşmuş, Altın Orda şehirlerinde ve Kırım'da da etkili olmuştur. Karahanlı Türkçesinin devamıdır, ama içinde Kıpçakça ve Oğuzca ögeler de bulunur. Bu yüzden tam bir geçiş dönemi Türkçesi sayılır.","soru":"Yukarıda sözü edilen tarihî Türk lehçesi aşağıdakilerden hangisidir?","siklar":["Harezm Türkçesi","Çağatay Türkçesi","Kıpçak Türkçesi","Eski Anadolu Türkçesi","Uygur Türkçesi"],"dogru":0,"neden":"Karahanlı Türkçesinin devamı olup Kıpçakça ve Oğuzca ögeler taşıyan geçiş dönemi Türkçesi Harezm Türkçesidir (13–14. yy.).","kaynak":"Ders 5, s. 2"},{"id":"d5-s02","tip":"donem-tanima","oncul":"Timurlular döneminde İlhanlı ve Altın Orda devletlerinin kültür merkezlerinde gelişmiştir. En büyük temsilcisi beş mesnevi ve dört divan sahibi bir şairdir. Hüseyin Baykara, Bâbur ve Ebulgazi Bahadır Han da bu dilin önemli isimlerindendir.","soru":"Yukarıda anlatılan yazı dili aşağıdakilerden hangisidir?","siklar":["Harezm Türkçesi","Kıpçak Türkçesi","Eski Anadolu Türkçesi","Çağatay Türkçesi","Osmanlı Türkçesi"],"dogru":3,"neden":"Timurlular dönemi, Ali Şîr Nevâî, Bâbur ve Hüseyin Baykara Çağatay Türkçesini (Doğu Türkçesi, 15–20. yy.) gösterir.","kaynak":"Ders 5, s. 4"},{"id":"d5-s03","tip":"donem-tanima","oncul":"Malazgirt Zaferi'nden sonra Anadolu'ya yerleşen Oğuzların dili bu dönemde yazı dili hâline gelmiştir. Anadolu Selçuklu Devleti'nin dağılmasıyla Beylikler dönemi başlamış, İran yoluyla gelen Divan edebiyatı ilk eserlerini vermiştir. Dönem XIII.–XV. yüzyılları kapsar.","soru":"Yukarıda özellikleri verilen dönem aşağıdakilerden hangisidir?","siklar":["Osmanlı Türkçesi","Eski Anadolu Türkçesi","Kıpçak Türkçesi","Çağatay Türkçesi","Harezm Türkçesi"],"dogru":1,"neden":"Oğuz-Türkmen lehçesinin yazı diline dönüşmesi, Selçuklu ve Beylikler dönemi ve XIII.–XV. yüzyıllar Eski Anadolu Türkçesine aittir.","kaynak":"Ders 5, s. 4"},{"id":"d5-s04","tip":"eser-yazar","oncul":"","soru":"Türkçeyi Farsçayla karşılaştırarak Türkçenin üstün olduğunu anlatan Muhakemetü’l-Lugateyn adlı eserin yazarı aşağıdakilerden hangisidir?","siklar":["Kerderli Mahmud","Ali Şîr Nevâî","Rabguzi","Ebulgazi Bahadır Han","Hoca Dehhani"],"dogru":1,"neden":"Muhakemetü’l-Lugateyn (İki Dilin Muhakemesi), Çağatay Türkçesinin en büyük ismi Ali Şîr Nevâî'nindir.","kaynak":"Ders 5, s. 4"},{"id":"d5-s05","tip":"eser-yazar","oncul":"","soru":"Kur'an-ı Kerim'de adı geçen peygamberlerin kıssalarını anlatan Harezm dönemi eseri Kısasü’l-Enbiyâ'nın yazarı kimdir?","siklar":["Kutb","Zamahşerî","Rabguzi","Kerderli Mahmud","Sekkâkî"],"dogru":2,"neden":"Kısasü’l-Enbiyâ'yı Rabguzi mahlaslı bir kadı yazmıştır. Kutb Hüsrev ü Şîrîn'i, Kerderli Mahmud Nehcü’l-Ferâdis'i yazmıştır.","kaynak":"Ders 5, s. 3"},{"id":"d5-s06","tip":"eser-yazar","oncul":"","soru":"Eski Anadolu Türkçesi dönemine ait aşağıdaki eser – yazar eşleştirmelerinden hangisi <u>yanlıştır</u>?","siklar":["Çarhname – Ahmed Fakih","Garipname – Aşık Paşa","Mevlid – Süleyman Çelebi","Süheyl ü Nevbahar – Kadı Burhaneddin","Yusuf u Zeliha – Şeyyad Hamza"],"dogru":3,"neden":"Süheyl ü Nevbahar Hoca Mesud'undur (XIV. yy.). Kadı Burhaneddin'in eseri olarak Divan'ı anılır.","kaynak":"Ders 5, s. 5"},{"id":"d5-s07","tip":"eser-yazar","oncul":"","soru":"Nizamî'nin mesnevisinin Türk edebiyatındaki ilk tercümesi olan, Harezm Türkçesiyle yazılmış Hüsrev ü Şîrîn hangi şaire aittir?","siklar":["Şeyhi","Kutb","Rabguzi","Ali Şîr Nevâî","Hoca Dehhani"],"dogru":1,"neden":"Harezm dönemindeki ilk Hüsrev ü Şîrîn tercümesi Kutb'undur. Şeyhi'nin Hüsrev ü Şirin'i ise XV. yy. Eski Anadolu Türkçesi eseridir.","kaynak":"Ders 5, s. 3, 5"},{"id":"d5-s08","tip":"bilgi-yanlisi","oncul":"I. Codex Cumanicus, Deşt-i Kıpçak'taki Kıpçakların diline ait gramer kurallarını ve sözlüğü içerir.\nII. Mecâlisü’n-Nefâis, edebiyatımızın ilk tezkiresi sayılır.\nIII. Nehcü’l-Ferâdis, kırk hadis ve bu hadisleri açıklayan menkıbelerden oluşur.\nIV. Mu’înü’l-Mürid, Kutb mahlaslı bir şairin yaptığı mesnevi tercümesidir.\nV. Kitab-ı Dede Korkut, XV. yüzyıl Eski Anadolu Türkçesi eserleri arasında sayılır.","soru":"Yukarıdaki numaralı cümlelerin hangisinde bilgi yanlışı vardır?","siklar":["I","II","III","IV","V"],"dogru":3,"neden":"Mu’înü’l-Mürid, İslâm mahlaslı bir şairin dinî ve tasavvufi eseridir. Nizamî'den ilk tercüme (Hüsrev ü Şîrîn) Kutb'a aittir.","kaynak":"Ders 5, s. 3–5","karistirma":false},{"id":"d5-s09","tip":"bilgi-yanlisi","oncul":"","soru":"Osmanlı Türkçesi ile ilgili aşağıdakilerden hangisi <u>yanlıştır</u>?","siklar":["Klasik devirde edebiyat, Divan ve Halk edebiyatı olarak iki koldan gelişmiştir.","Klasik devirde yabancı ögeler artmış, yazı dili konuşma dilinden ayrılmıştır.","Tanzimat devresi, Türk edebiyatının Batı'ya yönelen ilk safhasıdır.","Yeni Lisan hareketini başlatan Genç Kalemler dergisi 1911'de İstanbul'da çıkarılmıştır.","Yeni Lisan hareketi İstanbul ağzına dayalı bir yazı dili oluşturmayı amaçlamıştır."],"dogru":3,"neden":"Genç Kalemler dergisi 1911'de <b>Selanik</b>'te çıkarılmıştır. İstanbul, hareketin yazı diline temel aldığı ağızdır.","kaynak":"Ders 5, s. 5"},{"id":"d5-s10","tip":"bilgi-yanlisi","oncul":"I. Harezm Türkçesi: 13–14. yüzyıl\nII. Kıpçak Türkçesi: 14–16. yüzyıl\nIII. Çağatay Türkçesi: 13–15. yüzyıl\nIV. Eski Anadolu Türkçesi: 13–15. yüzyıl\nV. Osmanlı Türkçesi: 16–20. yüzyıl","soru":"Yukarıdaki dönem – yüzyıl eşleştirmelerinin hangisinde bilgi yanlışı vardır?","siklar":["I","II","III","IV","V"],"dogru":2,"neden":"Çağatay Türkçesi 15–20. yüzyıllar arasıdır. 13–15. yüzyıllar Eski Anadolu Türkçesinin aralığıdır.","kaynak":"Ders 5, s. 2–5","karistirma":false},{"id":"d5-s11","tip":"kavram","oncul":"","soru":"“Bir dilin tarihî, siyasi, sosyal ve kültürel nedenlerle değişik bölgelerde, zamanla ses yapısı ve kelime hazinesi bakımından önemli farklarla birbirinden ayrılan kollarından her biri” aşağıdakilerden hangisinin tanımıdır?","siklar":["Ağız","Şive","Lehçe","Yazı dili","Konuşma dili"],"dogru":2,"neden":"Bu, lehçenin tanımıdır. Ağızda farklar “az çok”tur; şive ise yalnızca söyleyiş özelliğidir.","kaynak":"Ders 5, s. 6"},{"id":"d5-s12","tip":"kavram","oncul":"","soru":"Bir dilin lehçe veya ağızlarından birinin zamanla ortak hâle gelmesi ve yazılmasıyla kurulan dile ne ad verilir?","siklar":["Konuşma dili","Yazı dili","Ağız","Şive","Lehçe"],"dogru":1,"neden":"Bu, yazı dilinin tanımıdır. Konuşma dili ise ağızdan ağza değişen, yazı dilinden farklı söyleyiş özellikleri taşıyan dildir.","kaynak":"Ders 5, s. 6"},{"id":"d5-s13","tip":"kavram","oncul":"","soru":"Aşağıdaki çağdaş lehçelerden hangisi Oğuz grubunda <u>değildir</u>?","siklar":["Gagavuz Türkçesi","Azeri Türkçesi","Türkmen Türkçesi","Halaç Türkçesi","Kazak Türkçesi"],"dogru":4,"neden":"Kazak Türkçesi Kıpçak grubundadır. Gagavuz, Azeri, Türkmen ve Halaç Türkçesi Oğuz grubundadır.","kaynak":"Ders 5, s. 7–8"},{"id":"d5-s14","tip":"kavram","oncul":"","soru":"Aşağıdaki Türk lehçelerinden hangisi ders notuna göre yalnızca konuşma dili olarak kullanılır?","siklar":["Türkiye Türkçesi","Kırgız Türkçesi","Halaç Türkçesi","Azeri Türkçesi","Tatar Türkçesi"],"dogru":2,"neden":"Ders notu Horasan, Halaç ve Salar Türkçesini yalnızca konuşma dili olarak sayar. Türkiye, Kırgız, Azeri ve Tatar Türkçesi yazı dilidir.","kaynak":"Ders 5, s. 6–7"}],"kartlar":[{"id":"d5-k01","on":"Yeni Türkçe devresi nasıl başladı?","arka":"XIII. yy.da Moğol istilasının yol açtığı göçlerle Türkçe iki yazı diline ayrıldı: Harezm ve Anadolu. Kollar: Kuzey (Kıpçak), Doğu (Çağatay), Batı (Eski Anadolu, Osmanlı).","kaynak":"Ders 5, s. 2"},{"id":"d5-k02","on":"Harezm Türkçesi","arka":"13–14. yy. Aral Gölü çevresi; Altın Orda ve Kırım'da etkili. Karahanlıcanın devamı, Kıpçakça ve Oğuzca ögeli; tam bir geçiş dönemi Türkçesi.","kaynak":"Ders 5, s. 2"},{"id":"d5-k03","on":"Kısasü’l-Enbiyâ / Mu’înü’l-Mürid","arka":"Harezm. Kısasü’l-Enbiyâ: Rabguzi mahlaslı kadı, peygamber kıssaları. Mu’înü’l-Mürid: İslâm mahlaslı şair, dinî ve tasavvufi.","kaynak":"Ders 5, s. 3"},{"id":"d5-k04","on":"Hüsrev ü Şîrîn (Harezm)","arka":"Kutb. Nizamî'nin mesnevisinin Türk edebiyatındaki ilk tercümesi. Karıştırma: Şeyhi'nin Hüsrev ü Şirin'i XV. yy. Eski Anadolu Türkçesidir.","kaynak":"Ders 5, s. 3, 5"},{"id":"d5-k05","on":"Nehcü’l-Ferâdis / Mukaddimetü’l-Edeb","arka":"Harezm. Nehcü’l-Ferâdis: Kerderli Mahmud; kırk hadis ve açıklayıcı menkıbeler. Mukaddimetü’l-Edeb: Zamahşerî; Arapça pratik sözlük.","kaynak":"Ders 5, s. 3"},{"id":"d5-k06","on":"Kıpçak Türkçesi ve Codex Cumanicus","arka":"Kuzey Türkçesi, 14–16. yy. Eserler: Deşt-i Kıpçak, Memlûk, Kırım. Codex Cumanicus: Deşt-i Kıpçak; gramer, sözlük, Hristiyan ilahileri ve bilmeceler.","kaynak":"Ders 5, s. 3"},{"id":"d5-k07","on":"Çağatay Türkçesi ve Nevâî","arka":"Doğu Türkçesi, 15–20. yy., Timurlular. Ali Şîr Nevâî: beş mesnevi, dört divan; Muhakemetü’l-Lugateyn (Türkçe Farsçadan üstün); Mecâlisü’n-Nefâis (ilk tezkire).","kaynak":"Ders 5, s. 4"},{"id":"d5-k08","on":"Eski Anadolu Türkçesi eserleri","arka":"13–15. yy. XIII: Çarhname (Ahmed Fakih), Divan (Sultan Veled), Yusuf u Zeliha (Şeyyad Hamza), Yunus Emre. XIV: Süheyl ü Nevbahar (Hoca Mesud), Garipname (Aşık Paşa), Divan (Kadı Burhaneddin). XV: Mevlid (Süleyman Çelebi), Hüsrev ü Şirin (Şeyhi), Müyessiretü’l-Ulum (Bergamalı Kadri), Dede Korkut.","kaynak":"Ders 5, s. 4–5"},{"id":"d5-k09","on":"Osmanlı Türkçesinin üç dönemi","arka":"16–20. yy. Klasik devir (XVI–XIX; Divan + Halk; suni dil, yazı dili konuşma dilinden ayrı). Tanzimat (1839; Batı'ya yönelen ilk safha). Yeni Lisan (1911).","kaynak":"Ders 5, s. 5"},{"id":"d5-k10","on":"Yeni Lisan hareketi","arka":"1911, Selanik, Genç Kalemler dergisi. Ziya Gökalp, Ömer Seyfettin, Ali Canip. Amaç: millî edebiyat, Arapça-Farsça tamlamaları kaldırmak, İstanbul ağzına dayalı yazı dili.","kaynak":"Ders 5, s. 5"},{"id":"d5-k11","on":"Lehçe / şive / ağız","arka":"Lehçe: önemli ses ve kelime farklarıyla ayrılan kol. Şive: söyleyiş özelliği. Ağız: yazı diline göre az çok ayrılan konuşma biçimi (İstanbul, Aydın, Konya ağzı).","kaynak":"Ders 5, s. 6"},{"id":"d5-k12","on":"Çağdaş lehçelerin altı grubu","arka":"Bulgar (Çuvaşça), Oğuz (Türkiye, Gagavuz, Azeri, Halaç, Horasan, Türkmen), Uygur (Özbek, Yeni Uygur, Sarı Uygur, Salar), Kıpçak (Kazak, Kırgız, Tatar, Başkurt...), Güney Sibirya (Altay, Hakas, Şor, Tuva), Kuzey Sibirya (Yakutça).","kaynak":"Ders 5, s. 7–9"}]},{"id":"d6","ders":6,"baslik":"Yazım Kuralları","kisa":"Yazım","ozet":[{"baslik":"Yazım nedir?","maddeler":["Yazım, bir dilin belirli kurallarla yazıya geçirilmesidir.","Harf, seslerin yazıdaki işaretidir; Türkçede her ses ayrı bir harfle gösterilir.","Yazım kurallarına uymak, anlatımı başarılı kılan unsurlardan biridir."],"kaynak":"Ders 6, s. 3"},{"baslik":"Üç yazım sistemi","maddeler":["<b>Sese (söyleyişe) bağlı</b> yazım düzeni.","<b>Kökene bağlı</b> yazım düzeni.","<b>Geleneğe bağlı</b> yazım düzeni: alfabesi yüzyıllardır değişmeyen dillerde (İngilizce, Fransızca) görülür; yazılış ile söyleyiş arasındaki fark bundan kaynaklanır.","TDK 1996 Yazım Kılavuzu'ndan beri gelenekleşmiş biçimleri esas alır; Türkçenin ortak söyleyişinde <b>İstanbul ağzı</b> esas alınmıştır."],"kaynak":"Ders 6, s. 3"},{"baslik":"Harf İnkılabı ve yetkili kurum","maddeler":["<b>1 Kasım 1928</b> Harf İnkılabı ile Latin alfabesi temel alınarak millî Türk alfabesine geçildi.","Yazım kılavuzu hazırlama görevi <b>Türk Dil Kurumuna</b> verilmiştir (Anayasa'nın 134. maddesine dayalı 664 sayılı KHK).","Kılavuzda eleştirilecek yerler olsa da bu, herkesin istediği gibi yazmasına gerekçe olamaz."],"kaynak":"Ders 6, s. 3"},{"baslik":"Doğru yazı, iyi yazı, güzel yazı","maddeler":["Ömer Asım Aksoy (<i>Dil Yanlışları</i>) yazı dilinde üç aşama ayırır: doğru yazı, iyi yazı, güzel yazı.","<b>Doğru yazı</b>: anlatmak istediğini dil kurallarına uygun anlatan yazı.","<b>İyi yazı</b>: doğru yazılabilecek biçimlerin en uygunu; <b>güzel yazı</b>: yazın ustalarının sanat ürünleri.","Güzel yazı herkesten beklenmez; doğru ve iyi yazı ise eğitim görmüş herkesten beklenir."],"kaynak":"Ders 6, s. 4"}],"kurallar":[{"grup":"Büyük harflerin kullanımı","kural":"Cümle büyük harfle başlar. Cümle içinde tırnak ya da yay ayraç içine alınan cümleler de büyük harfle başlar ve sonlarına uygun noktalama işareti konur.","dogru":["Öğretmen, “Yarın sınav var.” dedi.","Bu kitabı (Yazarın ilk romanıdır.) bir gecede okudum."],"yanlis":["Öğretmen, “yarın sınav var.” dedi.","Bu kitabı (yazarın ilk romanıdır.) bir gecede okudum."],"not":"","kaynak":"Ders 6, s. 4-5"},{"grup":"Büyük harflerin kullanımı","kural":"Rakamla başlayan cümlede rakamdan sonra gelen kelime özel ad değilse küçük harfle başlar. Ayrıca bir zorunluluk olmadıkça cümle rakamla başlatılmaz.","dogru":["2019 yazında köye taşındık."],"yanlis":["2019 Yazında köye taşındık."],"not":"","kaynak":"Ders 6, s. 5; s. 16"},{"grup":"Büyük harflerin kullanımı","kural":"İki noktadan sonra cümle gelirse büyük harfle başlar; cümle ya da özel ad niteliği taşımayan örnekler sıralanırsa küçük harfle başlar.","dogru":["Babam hep şunu söyler: Emek olmadan yemek olmaz.","Markete gidip şunları aldım: süt, ekmek, peynir."],"yanlis":["Babam hep şunu söyler: emek olmadan yemek olmaz.","Markete gidip şunları aldım: Süt, ekmek, peynir."],"not":"","kaynak":"Ders 6, s. 5"},{"grup":"Büyük harflerin kullanımı","kural":"İki çizgi arasındaki açıklama cümleleri küçük harfle başlar. Örnek olarak verilen kelimeyle başlayan cümlenin ilk harfi ise büyük yazılır.","dogru":["Kardeşim -nedenini hâlâ bilmiyorum- sınava girmedi."],"yanlis":["Kardeşim -Nedenini hâlâ bilmiyorum- sınava girmedi."],"not":"","kaynak":"Ders 6, s. 5"},{"grup":"Büyük harflerin kullanımı","kural":"Şiirde her dize büyük harfle başlar.","dogru":["Akşam olur, yollar uzar / Gönlüm yine sana koşar"],"yanlis":["Akşam olur, yollar uzar / gönlüm yine sana koşar"],"not":"","kaynak":"Ders 6, s. 6"},{"grup":"Büyük harflerin kullanımı","kural":"Kişi adları, soyadları ve takma adlar büyük harfle yazılır. Kişi adından önce ya da sonra gelen unvan, saygı sözü, rütbe ve lakaplar da büyük harfle başlar.","dogru":["Ayşe Hanım bize çay ikram etti.","Toplantıda Sayın Prof. Dr. İnci Enginün konuşmaya başladı.","Bu şiiri Abbas Yolcu takma adıyla yazmış."],"yanlis":["Ayşe hanım bize çay ikram etti.","Toplantıda sayın prof. dr. İnci Enginün konuşmaya başladı."],"not":"Ders notu “ünvan” yazar; güncel TDK yazımı “unvan”dır.","kaynak":"Ders 6, s. 6"},{"grup":"Büyük harflerin kullanımı","kural":"Akrabalık bildiren kelimeler (amca, teyze, abla) küçük harfle yazılır; ancak lakap ya da unvan olarak kullanılan akrabalık adları büyük harfle başlar.","dogru":["Annem Leyla teyzeyi yemeğe çağırdı.","Herkes Ali amcayı tanır.","Nene Hatun, Telli Baba"],"yanlis":["Annem Leyla Teyzeyi yemeğe çağırdı.","Herkes Ali Amcayı tanır."],"not":"Akrabalık adı kişinin adının parçası değil, sadece akrabalık bildiriyorsa küçük yaz.","kaynak":"Ders 6, s. 6"},{"grup":"Büyük harflerin kullanımı","kural":"Belirli bir kişinin adı yerine kullanılan makam ve unvan sözleri ile saygı sözünden sonra gelen makam adları büyük harfle başlar.","dogru":["Çin'den gelen heyeti Vali kabul etti.","Sayın Başbakan, Sayın Vali"],"yanlis":["Çin'den gelen heyeti vali kabul etti.","sayın vali"],"not":"","kaynak":"Ders 6, s. 6; s. 10"},{"grup":"Büyük harflerin kullanımı","kural":"Hayvan adları, millet ve boy adları, dil ve lehçe adları, devlet adları büyük harfle yazılır.","dogru":["Kedimiz Tarçın bütün gün uyudu.","Kardeşim Kırgızca öğrenmeye başladı.","Türkiye Cumhuriyeti"],"yanlis":["Kedimiz tarçın bütün gün uyudu.","Kardeşim kırgızca öğrenmeye başladı."],"not":"","kaynak":"Ders 6, s. 6-7"},{"grup":"Büyük harflerin kullanımı","kural":"Din ve mezhep adları ile din ve mitolojiyle ilgili özel adlar büyük harfle yazılır; Allah, Tanrı, İlah sözleri özel ad olarak kullanılmadığında küçük harfle başlar.","dogru":["Müslüman, Hristiyan, Budist, Hanefi","Yunan tanrıları Olimpos'ta yaşardı."],"yanlis":["Yunan Tanrıları Olimpos'ta yaşardı."],"not":"","kaynak":"Ders 6, s. 7"},{"grup":"Büyük harflerin kullanımı","kural":"Gezegen ve yıldız adları büyük harfle yazılır; dünya, güneş, ay sözleri gezegen ya da gök cismi anlamı dışında kullanıldığında küçük harfle başlar.","dogru":["Mars, Dünya'ya en yakın gezegenlerdendir.","Bütün dünya bu maçı izledi.","Balkona öğleden sonra güneş geliyor."],"yanlis":["Bütün Dünya bu maçı izledi."],"not":"Gökbilim cümlesi değilse (insanlar, hava durumu, gün ışığı anlamı) küçük yaz.","kaynak":"Ders 6, s. 7"},{"grup":"Büyük harflerin kullanımı","kural":"Doğu ve batı kelimeleri düşünce, hayat tarzı, politika gibi anlamlar bildirdiğinde büyük harfle başlar; yön bildirdiğinde küçük yazılır.","dogru":["Doğu felsefesi, Batı kültürü","Antalya'nın batısındaki koylar"],"yanlis":["doğu felsefesi","Antalya'nın Batısındaki koylar"],"not":"","kaynak":"Ders 6, s. 7"},{"grup":"Büyük harflerin kullanımı","kural":"Yer adları (kıta, bölge, il, ilçe, köy, semt) ve bunlardan sonra gelen deniz, göl, dağ, boğaz, ırmak gibi tür bildiren adlar büyük harfle yazılır.","dogru":["Van Gölü","Erciyes Dağı","Çanakkale Boğazı"],"yanlis":["Van gölü","Erciyes dağı"],"not":"","kaynak":"Ders 6, s. 7"},{"grup":"Büyük harflerin kullanımı","kural":"Özel ada dâhil olmayıp tamlama kuran şehir, il, ilçe, belde, köy gibi sözler küçük harfle başlar.","dogru":["Kadıköy ilçesi","Güldallı köyü"],"yanlis":["Kadıköy İlçesi","Güldallı Köyü"],"not":"","kaynak":"Ders 6, s. 7"},{"grup":"Büyük harflerin kullanımı","kural":"Saray, köşk, han, kale, köprü, anıt gibi yapı adları; kurum, kuruluş ve kurul adları; kanun, tüzük, yönetmelik adları büyük harfle yazılır.","dogru":["Galata Kulesi","Türk Dil Kurumu","Medeni Kanun"],"yanlis":["Galata kulesi","Türk Dil kurumu"],"not":"","kaynak":"Ders 6, s. 7-8"},{"grup":"Büyük harflerin kullanımı","kural":"Kitap, dergi, gazete ve sanat eserlerinin adları büyük harfle yazılır; özel ada dâhil olmayan gazete, dergi, tablo gibi sözler küçük harfle başlar.","dogru":["Çalıkuşu","Milliyet gazetesi","Bilim ve Teknik dergisi"],"yanlis":["Milliyet Gazetesi","Bilim ve Teknik Dergisi"],"not":"","kaynak":"Ders 6, s. 8"},{"grup":"Büyük harflerin kullanımı","kural":"Kelimelerin ilk harfleri büyük yazılan eser ve kurum adlarında ve, ile, ya, veya, yahut, ki, da, de sözleri ile soru eki küçük yazılır; adın tamamı büyük yazılırsa bunlar da büyük yazılır.","dogru":["Fahim Bey ve Biz","Ayaşlı ile Kiracıları","SAVAŞ VE BARIŞ"],"yanlis":["Fahim Bey Ve Biz","Ayaşlı İle Kiracıları"],"not":"","kaynak":"Ders 6, s. 8"},{"grup":"Büyük harflerin kullanımı","kural":"Bayram, anma ve kutlama günleri, kurultay ve bilgi şöleni gibi toplantılar ile tarihî olay, çağ ve dönem adları büyük harfle yazılır.","dogru":["Kurban Bayramı","Dünya Tiyatro Günü","Kurtuluş Savaşı, Lale Devri"],"yanlis":["Kurban bayramı","Kurtuluş savaşı"],"not":"","kaynak":"Ders 6, s. 8"},{"grup":"Büyük harflerin kullanımı","kural":"Özel adlardan türetilen bütün kelimeler büyük harfle başlar.","dogru":["Kayserili","Avrupalılaşmak","Türkçülük"],"yanlis":["kayserili","avrupalılaşmak"],"not":"","kaynak":"Ders 6, s. 8"},{"grup":"Büyük harflerin kullanımı","kural":"Kendi anlamı dışında yeni anlam kazanmış özel adlar, para birimleri, müzik makam ve tür adları ile özel ad yerine kullanılan “o” zamiri küçük harfle yazılır.","dogru":["Kitap yirmi dolar tuttu.","hicaz makamında bir şarkı","Ahmet'i aradım ama o gelmedi."],"yanlis":["Kitap yirmi Dolar tuttu.","Hicaz makamında bir şarkı"],"not":"","kaynak":"Ders 6, s. 8"},{"grup":"Büyük harflerin kullanımı","kural":"Yer, millet ve kişi adlarıyla kurulan birleşik kelimelerde özel ad büyük harfle yazılır.","dogru":["Antep fıstığı","Van kedisi","İngiliz anahtarı"],"yanlis":["antep fıstığı","van kedisi"],"not":"","kaynak":"Ders 6, s. 9"},{"grup":"Büyük harflerin kullanımı","kural":"Belirli bir tarih bildiren ay ve gün adları büyük harfle başlar.","dogru":["15 Mayıs 1993 Salı günü doğdu.","Mayıs 1974'te toplantı yapıldı."],"yanlis":["15 mayıs 1993 salı günü doğdu."],"not":"(ders notunda yok) Önünde gün-ay-yıl gibi belirli bir tarih yoksa büyük harf gerekmez; tarih var mı diye bak.","kaynak":"Ders 6, s. 9"},{"grup":"Büyük harflerin kullanımı","kural":"Tabela ve levha yazılarındaki kelimeler büyük harfle başlar. Kitap ve makalede ana başlığın bütün kelimeleri, alt başlıkların yalnızca ilk harfleri büyük yazılır; resim ve tablo altı açıklamaları büyük harfle başlar, cümle değilse sonuna nokta konmaz.","dogru":["Çıkış, Vezne, Otobüs Durağı, 2. Kat"],"yanlis":[],"not":"","kaynak":"Ders 6, s. 9"},{"grup":"Bitişik yazılan birleşik kelimeler","kural":"Birleşirken ses düşmesine uğrayan kelimeler bitişik yazılır.","dogru":["kaynata (kayın ata)","niçin (ne için)","nasıl (ne asıl)"],"yanlis":[],"not":"","kaynak":"Ders 6, s. 9"},{"grup":"Bitişik yazılan birleşik kelimeler","kural":"Tek heceli bazı Arapça kökenli kelimeler etmek, olmak gibi yardımcı fiillerle birleşirken ses düşmesi, değişmesi ya da türemesine uğrarsa bitişik yazılır.","dogru":["hissetmek","şükretmek","hamdetmek","menolunmak"],"yanlis":["his etmek","hamd etmek"],"not":"Ses olayı yoksa ayrı yazılır: terk etmek, arz etmek (bkz. ayrı yazılanlar).","kaynak":"Ders 6, s. 9"},{"grup":"Bitişik yazılan birleşik kelimeler","kural":"Birleşme sırasında her iki kelime ya da yalnızca ikincisi anlam değişmesine uğrarsa birleşik kelime bitişik yazılır (bitki, hayvan, renk, yemek adları gibi).","dogru":["keçiboynuzu","yalıçapkını","vişneçürüğü","kedidili"],"yanlis":["yalı çapkını","vişne çürüğü"],"not":"Kelime gerçek anlamını kaybetmiş mi diye bak: yalıçapkını bir kuş adıdır, yalıda yaşayan çapkın değildir.","kaynak":"Ders 6, s. 9-10"},{"grup":"Bitişik yazılan birleşik kelimeler","kural":"Tasvirî fiiller (-ebilmek, -ivermek, -edurmak, -akalmak, -egelmek) bitişik yazılır.","dogru":["okuyabilmek","bırakıvermek","bakakalmak","alışılagelmek"],"yanlis":["okuya bilmek","bırakı vermek"],"not":"","kaynak":"Ders 6, s. 11"},{"grup":"Bitişik yazılan birleşik kelimeler","kural":"Emir kipiyle, -r/-ar, -maz, -mış, -an sıfat-fiil ekleriyle ya da -dı geçmiş zaman ekiyle kurulmuş kalıplaşmış birleşik kelimeler bitişik yazılır.","dogru":["gökdelen","cankurtaran","uyurgezer","dedikodu","çokbilmiş","ateşkes"],"yanlis":["gök delen","uyur gezer"],"not":"","kaynak":"Ders 6, s. 11"},{"grup":"Bitişik yazılan birleşik kelimeler","kural":"Somut olarak yer bildirmeyen alt, üst, üzeri sözleriyle kurulan birleşik kelimeler bitişik yazılır; somut olarak yer bildiren alt ve üst ile kurulanlar ayrı yazılır.","dogru":["bilinçaltı","akşamüstü","ayaküstü","su altı (somut yer)"],"yanlis":["bilinç altı","akşam üstü"],"not":"Gerçekten bir şeyin altı ya da üstü kastediliyorsa ayrı, mecazsa bitişik.","kaynak":"Ders 6, s. 11-12"},{"grup":"Bitişik yazılan birleşik kelimeler","kural":"Birden çok kelimeden oluşan kişi adları, soyadları ve lakaplar; il, ilçe, semt adları; ara yönler bitişik yazılır. Şehir, köy, dağ, deniz, göl, ırmak, su gibi kelimelerle kurulan yer adları da bitişiktir.","dogru":["Gökalp, Adıvar","Beşiktaş","güneydoğu, kuzeybatı","Karadeniz, Uludağ, Eskişehir"],"yanlis":["güney doğu","Kara Deniz","Ulu Dağ"],"not":"","kaynak":"Ders 6, s. 11"},{"grup":"Bitişik yazılan birleşik kelimeler","kural":"Bazı birleşik kelimeler iki ögesi de anlamını korusa bile gelenekselleşerek bitişik yazılır: baş- ile kurulanlar, -başı ile kurulanlar, birkaç, birçok, biraz, hiçbir, herhangi.","dogru":["başöğretmen, başhekim","onbaşı, elebaşı","birçok, birkaç, hiçbir","ağabey, hanımefendi"],"yanlis":["bir çok","hiç bir","baş öğretmen"],"not":"","kaynak":"Ders 6, s. 11"},{"grup":"Bitişik yazılan birleşik kelimeler","kural":"Ev kelimesiyle kurulan birleşik kelimeler ile hane, name, zade ve -zede ile kurulan kelimeler bitişik yazılır.","dogru":["aşevi, doğumevi","kahvehane","seyahatname","depremzede"],"yanlis":["aş evi","deprem zede"],"not":"","kaynak":"Ders 6, s. 11-12"},{"grup":"Ayrı yazılan birleşik kelimeler","kural":"Etmek, edilmek, eylemek, olmak, olunmak ile kurulan birleşik fiiller ses düşmesi ya da türemesine uğramazsa ayrı yazılır.","dogru":["terk etmek","arz etmek","göç etmek","var olmak"],"yanlis":["terketmek","varolmak"],"not":"Yardımcı fiili ayırınca ilk kelime değişmeden kalıyorsa (terk, göç, var) ayrı yaz; değişiyorsa (his → hissetmek, şükür → şükretmek) bitişik.","kaynak":"Ders 6, s. 12"},{"grup":"Ayrı yazılan birleşik kelimeler","kural":"Birleşme sırasında kelimelerden hiçbiri ya da ikincisi anlam değişikliğine uğramayan birleşik kelimeler ayrı yazılır.","dogru":["köpek balığı","ipek böceği","kol saati","dil bilgisi","gece yarısı"],"yanlis":["köpekbalığı","kolsaati"],"not":"","kaynak":"Ders 6, s. 12"},{"grup":"Ayrı yazılan birleşik kelimeler","kural":"-r/-ar, -maz, -an sıfat-fiil ekleriyle kurulan sıfat tamlaması yapısındaki birleşik kelimeler ile renk adları ayrı yazılır.","dogru":["çalar saat","tükenmez kalem","uçan daire","portakal rengi","açık yeşil"],"yanlis":["tükenmezkalem","açıkyeşil"],"not":"","kaynak":"Ders 6, s. 12"},{"grup":"Ayrı yazılan birleşik kelimeler","kural":"Yer adlarındaki batı, doğu, güney, kuzey, yukarı, orta gibi kelimeler ile kişi adından oluşan mahalle, cadde, sokak adları ayrı yazılır.","dogru":["Doğu Anadolu","Kuzey Amerika","Atatürk Bulvarı"],"yanlis":["Doğuanadolu"],"not":"","kaynak":"Ders 6, s. 12"},{"grup":"Ayrı yazılan birleşik kelimeler","kural":"Dış, iç, sıra sözleriyle; ana, ön, arka, büyük, küçük, sağ, sol, peşin, tek, çift gibi sözlerin başa gelmesiyle oluşan birleşik kelime ve terimler ogru":["seninki","Ahmet'inki","okuldaki","dünkü","yarınki"],"yanlis":["senin ki","dün ki","yarın ki"],"not":"(ders notunda yok) Sonuna -ler getirebiliyorsan (okuldakiler, seninkiler) ektir, bitişik yaz.","kaynak":"Ders 6, s. 14"},{"grup":"Soru eki mı/mi","kural":"Soru eki mı, mi, mu, mü ayrı yazılır; soru ekinden sonra gelen ekler soru ekine bitişik yazılır.","dogru":["Gelecek misin?","Sınav kolay mıydı?","Odun mu, tuz mu?"],"yanlis":["Gelecekmisin?","Sınav kolaymıydı?"],"not":"","kaynak":"Ders 6, s. 14"},{"grup":"Mastarlara gelen ekler","kural":"-ma/-me mastar ekinden sonra -a/-e/-ı/-i hâl eklerinden biri gelince araya y koruyucu ünsüzü girer.","dogru":["okumaya","yazmayı","gitmeye","çalışmayı"],"yanlis":[],"not":"","kaynak":"Ders 6, s. 15"},{"grup":"İle'nin yazılışı","kural":"ile ayrı ya da bitişik yazılabilir. Bitişik yazılınca ünlü uyumuna uyar; ünsüzle biten kelimede i düşer, ünlüyle biten kelimede i düşer ve araya y girer.","dogru":["okulla, çiçekle, seninle","arabayla, sevgiyle","araba ile"],"yanlis":["okulle","arabala"],"not":"","kaynak":"Ders 6, s. 15"},{"grup":"Ek-fiilin yazılışı","kural":"Ek-fiil (imek) ayrı ya da bitişik yazılabilir. Bitişik yazılınca ünlü uyumuna uyar; ünsüzden sonra i düşer, ünlüden sonra i düşer ve araya y girer.","dogru":["solgundu (solgun idi)","büyükmüş","hastaydı (hasta idi)","sözlüyse"],"yanlis":["hastadı","sözlüse"],"not":"","kaynak":"Ders 6, s. 15"},{"grup":"Ek-fiilin yazılışı","kural":"iken ayrı ya da bitişik yazılabilir. Bitişik yazılınca i düşer ve kelimenin ünlüleri kalın olsa bile -ken ince kalır; ünlüyle biten kelimeye -yken biçiminde eklenir.","dogru":["bakarken","okuldayken","sendeyken"],"yanlis":["bakarkan","okuldaken"],"not":"","kaynak":"Ders 6, s. 15"},{"grup":"Sayıların yazılışı","kural":"Sayılar harfle yazılabilir; ancak saat, para tutarı, ölçü ve istatistik verilerinde rakam kullanılır. Saat ve dakikalar metin içinde yazıyla da yazılabilir.","dogru":["on dört gün","35 kilogram","saat 23.00'te","saat beşte"],"yanlis":[],"not":"","kaynak":"Ders 6, s. 15-16"},{"grup":"Sayıların yazılışı","kural":"Birden fazla kelimeden oluşan sayılar ayrı yazılır; yalnızca senet, çek gibi para belgelerinde bitişik yazılır.","dogru":["iki yüz","üç yüz altmış beş","yediyüzyetmişbeşTL (çekte)"],"yanlis":["ikiyüz","üçyüz altmışbeş"],"not":"","kaynak":"Ders 6, s. 16"},{"grup":"Sayıların yazılışı","kural":"Yüzde ve binde işareti ile sayı arasında boşluk bırakılmaz. Dört ve daha çok basamaklı sayılar sondan üçlü gruplara ayrılıp nokta ile yazılır; kesirler virgülle ayrılır.","dogru":["%25","7.774.564","36,7 derece"],"yanlis":["% 25","36.7 derece"],"not":"","kaynak":"Ders 6, s. 16"},{"grup":"Sayıların yazılışı","kural":"Tarihî olaylarda, yüzyıllarda, hükümdar adlarında, kitap ciltlerinde ve tarihlerde ay gösterilirken Romen rakamı kullanılabilir.","dogru":["I. Dünya Savaşı","XII. yüzyıl","IV. Murat","9.X.2012"],"yanlis":[],"not":"","kaynak":"Ders 6, s. 16"},{"grup":"Sayıların yazılışı","kural":"Sıra sayısı rakamla gösterilirken ya rakamdan sonra nokta konur ya da kesme işaretiyle ek yazılır; ikisi birlikte kullanılmaz.","dogru":["9. sınıf","9'uncu","7'nci"],"yanlis":["9.'uncu","7.'nci"],"not":"Nokta ya da ek: ikisinden yalnız biri.","kaynak":"Ders 6, s. 16"},{"grup":"Sayıların yazılışı","kural":"Üleştirme sayıları rakamla değil yazıyla belirtilir. Bayağı kesirlere getirilen ek alttaki sayının okunuşuna göre yazılır.","dogru":["onar, yedişer, biner","1/7'si (bir bölü yedisi)","2/8'i (iki bölü sekizi)"],"yanlis":["10'ar, 7'şer","2/8'si"],"not":"","kaynak":"Ders 6, s. 16"},{"grup":"Düzeltme işareti","kural":"Yazılışları aynı, anlamları ve söylenişleri farklı kelimeleri ayırmak için uzun okunan ünlünün üzerine düzeltme işareti konur.","dogru":["âdet (gelenek) / adet (sayı)","âşık (tutkun) / aşık (kemik)","vâris (mirasçı) / varis (damar)"],"yanlis":["beş âdet kalem (sayı anlamında)"],"not":"katil ve kadir, karışma olasılığına rağmen düzeltme işaretsiz yazılır: “katil zanlısı” doğru, “kâtil” yanlış.","kaynak":"Ders 6, s. 17"},{"grup":"Düzeltme işareti","kural":"Arapça ve Farsçadan gelen kelimelerde ince g ve k'den sonra gelen a ve u'nun üzerine düzeltme işareti konur; kişi ve yer adlarında ince l'den sonra gelen a ve u da işaretlenir.","dogru":["dükkân","hikâye","zekâ","yadigâr","Halûk, Nalân"],"yanlis":["dükkan","hikaye"],"not":"","kaynak":"Ders 6, s. 17"},{"grup":"Düzeltme işareti","kural":"Nispet î'si, belirtme hâli ya da iyelik ekiyle karışabileceği için düzeltme işaretiyle yazılır.","dogru":["resmî tatil","millî takım","askerî okul","dinî konular"],"yanlis":["resmi tatil","askeri okul"],"not":"“Türk askeri” (askerin iyelik hâli) ile “askerî okul” (askerlikle ilgili) farkına bak.","kaynak":"Ders 6, s. 17"},{"grup":"Satır sonunda kelimelerin bölünüşü","kural":"Satır sonunda kelime bölünebilir ama hece bölünmez; satır sonuna kısa çizgi konur ve satır sonunda ya da başında tek harf bırakılmaz.","dogru":["ütü- / letti","şa- / şaa"],"yanlis":["ü- / tületti","şaşa- / a"],"not":"","kaynak":"Ders 6, s. 18"},{"grup":"Satır sonunda kelimelerin bölünüşü","kural":"Satır sonunda kesme işaretli özel adlarda çizgi kullanılmaz. İlk heceden sonraki heceler ünsüzle başlar; bitişik yazılan kelimelerde de bu kurala uyulur.","dogru":["Bursa' / da","yük-se-ko-kul","as-la-nağ-zı"],"yanlis":["Bursa'- / da","yük-sek-o-kul"],"not":"","kaynak":"Ders 6, s. 18"},{"grup":"Kısaltmalar","kural":"Kuruluş, ülke, kitap, dergi ve yön adları her kelimenin ilk harfi büyük alınarak kısaltılır; ölçü birimlerinde uluslararası kısaltmalar kullanılır.","dogru":["TTK (Türk Tarih Kurumu)","ABD","kg, m, cm²"],"yanlis":[],"not":"","kaynak":"Ders 6, s. 18-19"},{"grup":"Kısaltmalar","kural":"Diğer kısaltmalarda ilk harfle birlikte temel harfler alınır; özel ad, unvan ya da rütbe ise ilk harf büyük, cins isim ise küçük olur.","dogru":["Prof. (Profesör)","Av. (Avukat)","İng. (İngilizce)","sf. (sıfat), çev. (çeviren)"],"yanlis":["prof.","Sf. (sıfat)"],"not":"","kaynak":"Ders 6, s. 19"},{"grup":"Kısaltmalar","kural": ndra, Brüksel","Marksizm, Kalvenizm","Ahmet, Necmettin, Mekke","Taşkent, Bişkek"],"yanlis":["Necmeddin"],"not":"","kaynak":"Ders 6, s. 20-21"},{"grup":"Yabancı özel adlar","kural":"Yunanca ve Rusça adlar, harflerin ses değerini karşılayan Türk harfleriyle; Çince ve Japonca adlar Türkçede yerleşmiş biçimleriyle yazılır. Çince adlarda heceler arasına çizgi konur.","dogru":["Sokrates, Aristoteles","Puşkin, Çehov, Dostoyevski","Pekin, Şanghay, Hiroşima","Sun Yat-sen"],"yanlis":["Pushkin","Chekhov"],"not":"Bazı Yunanca adlar dilimizde başka biçimde yerleşmiştir: Sokrat, Aristo, Eflatun, Pisagor, Öklid. Konfüçyüs bitişik yazılır.","kaynak":"Ders 6, s. 20"}],"sorular":[{"id":"d6-s01","tip":"buyuk-harf","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde büyük harflerin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Kardeşim her yaz Van Gölü kıyısındaki köyümüze gider.","Annem dün akşam Leyla Teyzeyi yemeğe çağırdı.","Dedem Kurtuluş Savaşı yıllarını sık sık anlatır.","Bu yıl Kurban Bayramı'nda Kayseri'ye gideceğiz.","Sınıfça Galata Kulesi'ni gezmeye karar verdik."],"dogru":1,"neden":"Akrabalık bildiren kelimeler küçük harfle yazılır: “Leyla teyzeyi” olmalı. Teyze burada lakap değil, sadece akrabalık bildiriyor.","kaynak":"Ders 6, s. 6"},{"id":"d6-s02","tip":"buyuk-harf","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde büyük harflerin yazımıyla ilgili bir yanlışlık <u>yapılmamıştır</u>?","siklar":["Babam her sabah Milliyet Gazetesi'ni okur.","Toplantıdan sonra Ayşe hanımla konuştuk.","Yazın Antalya'nın Batısındaki koylara gittik.","Çantama şunları koydum: Kalem, defter, silgi.","Dedem bize Telli Baba'nın hikâyesini anlattı."],"dogru":4,"neden":"Lakap olarak kullanılan akrabalık adı büyük yazılır (Telli Baba). Diğerleri: “Milliyet gazetesi”, “Ayşe Hanım”, yön bildiren “batısındaki”, iki noktadan sonra sıralanan örnekler küçük “kalem” olmalı.","kaynak":"Ders 6, s. 5-8"},{"id":"d6-s03","tip":"buyuk-harf","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde büyük harflerin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Arkadaşım İngilizceyi kısa sürede öğrendi.","Bütün Dünya bu maçı merak ediyordu.","Kedimiz Pamuk sabaha kadar uyumadı.","Bu kitap Doğu felsefesini anlatıyor.","Bayramda Kadıköy ilçesindeki teyzemi ziyaret ettik."],"dogru":1,"neden":"“Dünya” burada gezegen değil, “bütün insanlar” anlamında kullanılmış; küçük harfle “dünya” yazılmalı.","kaynak":"Ders 6, s. 7"},{"id":"d6-s04","tip":"buyuk-harf","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde büyük harflerin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Geçen yıl ailece İzmir'e taşındık.","Öğretmen bize Ayaşlı İle Kiracıları romanını önerdi.","Fiyatı yirmi avro olan kitabı aldım.","Ali amca -herkes onu severdi- bize çay ikram etti.","Annem bize Antep fıstığı getirdi."],"dogru":1,"neden":"Eser adlarında ve, ile, ya, veya, ki, da, de sözleri küçük yazılır: “Ayaşlı ile Kiracıları” olmalı.","kaynak":"Ders 6, s. 8"},{"id":"d6-s05","tip":"buyuk-harf","oncul":"","soru":"Aşağıdakilerin hangisinde büyük harflerin kullanımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Erciyes Dağı","Medeni Kanun","Lale Devri","elli Dolar","Kayserili"],"dogru":3,"neden":"Para birimleri büyük harfle başlamaz: “elli dolar” olmalı. Dağ adı, kanun adı, dönem adı ve özel addan türeyen kelime büyük harfle doğru yazılmış.","kaynak":"Ders 6, s. 8"},{"id":"d6-s06","tip":"de-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde “de”nin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Kardeşim de bizimle sinemaya gelecek.","Evde kimse olmadığı için kapıyı açamadık.","Ya bu akşam ya da yarın sabah yola çıkarız.","Kitaplarını masada unutmuşsun.","Sınavı geçen öğrenciler arasında bende varım."],"dogru":4,"neden":"Buradaki “de” bağlaçtır (“ben de”), ayrı yazılmalı. Diğerlerindeki “evde, masada” bulunma ekidir, bitişik doğru.","kaynak":"Ders 6, s. 13"},{"id":"d6-s07","tip":"de-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde “de”nin yazımıyla ilgili bir yanlışlık <u>yapılmamıştır</u>?","siklar":["Bu akşam annemler de bize gelecekmiş.","Kitabımı okul da unutmuşum.","Ahmette bu soruyu çözemedi.","Annemler gidince bizde yola çıktık.","Birde şu kitaba bak."],"dogru":0,"neden":"“annemler de” cümlesindeki de bağlaçtır ve ayrı yazılmıştır. Doğrusu: “okulda” (bulunma eki bitişik), “Ahmet de” (bağlacın te biçimi yok), “biz de”, “bir de”.","kaynak":"Ders 6, s. 13"},{"id":"d6-s08","tip":"de-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde “de”nin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Sen de bu konuda haklısın.","Yazın köyde dedemlerle kaldık.","Hem şiirde hem de romanda başarılı bir yazardır.","Ders bitince Mehmet te bahçeye çıktı.","Toplantıda bu konu da konuşuldu."],"dogru":3,"neden":"Bağlaç olan de'nin ta/te biçimi yoktur ve ayrı yazılır: “Mehmet de” olmalı.","kaynak":"Ders 6, s. 13"},{"id":"d6-s09","tip":"de-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde “de” bağlaç değil, bulunma hâl ekidir?","siklar":["Sen de bizimle gel.","Ben de aynı kitabı okudum.","Bahçede çocuklar oynuyor.","Ödevini de yanına al.","Bir de şunu dene."],"dogru":2,"neden":"“Bahçede” sözcüğündeki -de “nerede?” sorusuna cevap veren bulunma hâl ekidir ve bitişik yazılır. Diğerlerindeki de bağlaçtır, ayrı yazılmıştır.","kaynak":"Ders 6, s. 13-14"},{"id":"d6-s10","tip":"ki-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde “ki”nin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Demek ki bu işi sen yapmışsın.","Senin kitabın benimkinden daha kalın.","Madem ki gelmeyecektin, neden söz verdin?","Okuldaki öğretmenler toplantıya katıldı.","Öyle yorgunum ki hemen uyuyacağım."],"dogru":2,"neden":"“Mademki” kalıplaşmış olduğu için bitişik yazılır (belki, çünkü, hâlbuki, mademki, meğerki, oysaki, sanki).","kaynak":"Ders 6, s. 14"},{"id":"d6-s11","tip":"ki-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde “ki”nin yazımıyla ilgili bir yanlışlık <u>yapılmamıştır</u>?","siklar":["Sanki bütün dünya bana küsmüştü.","Bilmemki bu yolu nasıl bulacağız.","Dün ki maçı kaçırdım.","Oysa ki bu konuyu daha önce konuşmuştuk.","Senin ki benimkinden daha güzel olmuş."],"dogru":0,"neden":"“Sanki” kalıplaşmış olduğu için bitişik doğrudur. Doğrusu: “Bilmem ki” (bağlaç ayrı), “dünkü” ve “seninki” (aitlik eki bitişik), “Oysaki” (kalıplaşmış, bitişik).","kaynak":"Ders 6, s. 14"},{"id":"d6-s12","tip":"ki-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde “ki”nin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Duydum ki yeni bir eve taşınmışsınız.","Kaldı ki bu konuda hiçbir bilgim yoktu.","Belki yarın size uğrarız.","Sokaktaki çocuklar top oynuyordu.","Yarın ki toplantıya katılamayacağım."],"dogru":4,"neden":"Buradaki -ki aitlik bildiren ektir (yarına ait toplantı), bitişik yazılmalı: “yarınki”.","kaynak":"Ders 6, s. 14"},{"id":"d6-s13","tip":"mi-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde soru ekinin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Bu akşam bize gelecek misiniz?","Ödevini bitirdin mi?","Sınav kolay mıydı?","Yarın erken kalkabilecekmisin?","Çay mı, kahve mi istersiniz?"],"dogru":3,"neden":"Soru eki ayrı yazılır, ondan sonra gelen ekler soru ekine bitişir: “kalkabilecek misin” olmalı.","kaynak":"Ders 6, s. 14"},{"id":"d6-s14","tip":"mi-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde soru ekinin yazımıyla ilgili bir yanlışlık <u>yapılmamıştır</u>?","siklar":["Bu kitabı sen mi aldın?","Yarın okula gelecekmisin?","Bu filmi izledinmi?","Hava bugün soğukmu?","Onu tanıyormusun?"],"dogru":0,"neden":"“sen mi aldın” cümlesinde soru eki ayrı yazılmıştır. Doğrusu: “gelecek misin”, “izledin mi”, “soğuk mu”, “tanıyor musun”.","kaynak":"Ders 6, s. 14"},{"id":"d6-s15","tip":"mi-yazimi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?","siklar":["Bu yolu daha önce gördün mü?","Kardeşin mi seninle gelecek?","Bu haberi duymuş muydunuz?","Akşam yemeğe kalacak mısın?","Bunu senmi söyledin?"],"dogru":4,"neden":"Soru eki ayrı yazılır: “sen mi” olmalı. “duymuş muydunuz” doğrudur, çünkü soru ekinden sonraki ekler soru ekine bitişir.","kaynak":"Ders 6, s. 14"},{"id":"d6-s16","tip":"birlesik","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde birleşik kelimelerin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Çocuklar akşamüstü parkta buluştu.","Hiçbir öğrenci derse geç kalmadı.","Babam bu evi yıllar önce terketti.","Annem bana bir tükenmez kalem aldı.","Dedemle birlikte ipek böceği yetiştirdik."],"dogru":2,"neden":"Etmek ile kurulan birleşik fiil ses olayına uğramıyorsa ayrı yazılır: “terk etti” olmalı.","kaynak":"Ders 6, s. 12"},{"id":"d6-s17","tip":"birlesik","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde birleşik kelimelerin yazımıyla ilgili bir yanlışlık <u>yapılmamıştır</u>?","siklar":["Kardeşim bir çok kitabı yaz tatilinde okudu.","Deprem zede aileler için yardım toplandı.","Akşam yemeğinden sonra hep birlikte dedikodu yaptık.","Yarın sabah Kara Deniz kıyısına gideceğiz.","Akvaryumda bir köpekbalığı gördük."],"dogru":2,"neden":"“Dedikodu” -DI ekiyle kalıplaşmış birleşik kelimedir, bitişik doğru. Doğrusu: “birçok”, “depremzede”, “Karadeniz” (bitişik); “köpek balığı” (anlam değişmediği için ayrı).","kaynak":"Ders 6, s. 11-12"},{"id":"d6-s18","tip":"birlesik","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?","siklar":["Ağabeyim okulumuza başöğretmen olarak atandı.","Öğretmen bize dil bilgisi kurallarını anlattı.","Pikniğe gitmek için birkaç arkadaş toplandık.","Bu kış kayak yapmak için Uludağ'a gittik.","Kalabalık caddede gök delenlerin arasında kaybolduk."],"dogru":4,"neden":"Sıfat-fiil ekiyle kalıplaşmış birleşik kelime bitişik yazılır: “gökdelenlerin” olmalı.","kaynak":"Ders 6, s. 11"},{"id":"d6-s19","tip":"birlesik","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?","siklar":["Okulun yanısıra bir kursa da gidiyor.","Misafirler gece yarısı evlerine döndü.","Odanın duvarlarını açık yeşile boyadık.","Çocuklar göz göze gelince gülmeye başladı.","Ona boş yere çanak tutma."],"dogru":0,"neden":"Sıra sözüyle kurulan birleşik kelimeler ayrı yazılır: “yanı sıra” olmalı. Renk adı (açık yeşil), ikileme (göz göze) ve deyim (çanak tutmak) ayrı yazılmıştır, doğru.","kaynak":"Ders 6, s. 12-13"},{"id":"d6-s20","tip":"sayi-kisaltma","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde sayıların yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Ürünlerde %20 indirim başladı.","Bu kitap XIX. yüzyılda yazılmış.","Öğrencilere beşer kalem dağıtıldı.","Okulumuzda 1.250 öğrenci var.","Toplantı 7.'nci katta yapılacak."],"dogru":4,"neden":"Sıra sayısı ekle gösterilince nokta konmaz: “7'nci” ya da “7.” olmalı, ikisi birlikte olmaz.","kaynak":"Ders 6, s. 16"},{"id":"d6-s21","tip":"sayi-kisaltma","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde sayıların yazımıyla ilgili bir yanlışlık <u>yapılmamıştır</u>?","siklar":["Öğrencilere 5'er soru dağıtıldı.","Fiyatlar bu ay % 15 arttı.","Osmanlı Devleti XVI. yüzyılda çok güçlüydü.","Pastanın 2/8'sini kardeşime verdim.","Koşu yarışmasında 3.'üncü oldum."],"dogru":2,"neden":"Yüzyıllarda Romen rakamı kullanılır: “XVI. yüzyılda” doğrudur. Doğrusu: “beşer” (üleştirme yazıyla), “%15” (boşluksuz), “2/8'ini” (alttaki sayı “sekiz” esas alınır), “3'üncü” ya da “3.”.","kaynak":"Ders 6, s. 16"},{"id":"d6-s22","tip":"sayi-kisaltma","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde kısaltmalara getirilen eklerin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Bu sözlüğü TDK'dan aldık.","Bavulun ağırlığı 20 kg'ı geçmemeli.","Toplantı NATO'da yapıldı.","Ağabeyim THY'de çalışıyor.","Kardeşim İTÜ'nün sınavını kazandı."],"dogru":0,"neden":"Büyük harfli kısaltmalarda ek son harfin okunuşuna göre gelir; TDK'nin son harfi “ke” okunur: “TDK'den” olmalı.","kaynak":"Ders 6, s. 19"},{"id":"d6-s23","tip":"genel-yazim","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde düzeltme işaretinin kullanımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Bu dükkânda eski kitaplar satılıyor.","Komşumuz her gün beş âdet ekmek alır.","Bayramda resmî tören yapıldı.","Dedem bize güzel bir hikâye anlattı.","Polis, katil zanlısını kısa sürede yakaladı."],"dogru":1,"neden":"Burada “sayı” anlamı var: “adet” yazılmalı. “âdet” gelenek, alışkanlık demektir.","kaynak":"Ders 6, s. 17"},{"id":"d6-s24","tip":"genel-yazim","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde ek-fiilin yazımıyla ilgili bir yanlışlık yapılmıştır?","siklar":["Dün akşam çok yorgundum.","O yıllarda dedem öğretmendi.","Biz okuldaken yağmur başladı.","Tatile arabayla gittik.","Çocuk kitap okurken uyudu."],"dogru":2,"neden":"iken ünlüyle biten kelimeye bitişince araya y girer: “okuldayken” olmalı.","kaynak":"Ders 6, s. 15"},{"id":"d6-s25","tip":"genel-yazim","oncul":"(/ işareti satır geçişini gösterir.)","soru":"Aşağıdakilerin hangisinde satır sonunda kelime bölme kurallarına uyulmuştur?","siklar":["ü- / tületti","kitapl- / ar","yükseko- / kul","Bursa'- / da","şaşa- / a"],"dogru":2,"neden":"Hece yük-se-ko-kul olarak ayrılır; “yükseko- / kul” hece sınırından bölünmüştür. Diğerlerinde tek harf bırakılmış (ü-, a), hece bölünmüş (kitapl-) ya da kesmeden sonra gereksiz çizgi konmuştur.","kaynak":"Ders 6, s. 18"},{"id":"d6-s26","tip":"genel-yazim","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde yazım yanlışı vardır?","siklar":["Kardeşim bu yıl yeni bir kulübe üye oldu.","Psikolog bize faydalı öneriler verdi.","Akşam televizyonda güzel bir filim izledik.","Shakespeare'in oyunlarını okumayı severim.","Londra'da iki hafta kaldık."],"dogru":2,"neden":"Ünsüz kümesiyle biten Batı kökenli alıntılar araya ünlü konmadan yazılır: “film” olmalı.","kaynak":"Ders 6, s. 19"}],"kartlar":[{"id":"d6-k01","on":"Harf sistemini kullanan dillerdeki üç yazım sistemi nedir?","arka":"Sese (söyleyişe) bağlı, kökene bağlı, geleneğe bağlı yazım. İngilizce, Fransızca geleneğe bağlıdır; Türkçede ortak söyleyiş için İstanbul ağzı esastır.","kaynak":"Ders 6, s. 3"},{"id":"d6-k02","on":"Harf İnkılabı hangi tarihte yapıldı?","arka":"1 Kasım 1928. Latin alfabesi temel alınarak millî Türk alfabesine geçildi.","kaynak":"Ders 6, s. 3"},{"id":"d6-k03","on":"Bağlaç olan da/de nasıl yazılır?","arka":"Ayrı yazılır, önceki kelimenin son ünlüsüne uyar (da/de); ta/te biçimi yoktur. “ya da”, “bir de” de ayrıdır. Örnek: Ahmet de geldi (Ahmette değil).","kaynak":"Ders 6, s. 13"},{"id":"d6-k04","on":"Bağlaç olan ki nasıl yazılır? Kalıplaşmış istisnalar?","arka":"Ayrı yazılır: demek ki, kaldı ki, bilmem ki. Bitişik istisnalar: belki, çünkü, hâlbuki, mademki, meğerki, oysaki, sanki.","kaynak":"Ders 6, s. 14"},{"id":"d6-k05","on":"Aitlik bildiren -ki nasıl yazılır?","arka":"Bitişik: seninki, Ahmet'inki, okuldaki, dünkü, yarınki. Şüphe ve pekiştirme ki'si ise ayrıdır: Gelmedi mi ki? Öyle seviyorum ki.","kaynak":"Ders 6, s. 14"},{"id":"d6-k06","on":"Soru eki mı/mi/mu/mü nasıl yazılır?","arka":"Ayrı yazılır; ondan sonra gelen ekler soru ekine bitişir: gelecek misin, kolay mıydı (gelecekmisin değil).","kaynak":"Ders 6, s. 14"},{"id":"d6-k07","on":"Akrabalık adları (amca, teyze, abla) büyük mü küçük mü yazılır?","arka":"Küçük: Ali amca, Leyla teyze. Lakap ya da unvan olarak kullanılırsa büyük: Nene Hatun, Telli Baba, Susuz Dede.","kaynak":"Ders 6, s. 6"},{"id":"d6-k08","on":"İki noktadan sonra büyük harf mi küçük harf mi?","arka":"Cümle gelirse büyük: Şunu söyledi: Emek olmadan yemek olmaz. Cümle ya da özel ad olmayan örnek sıralanırsa küçük: şunları aldım: süt, ekmek, peynir.","kaynak":"Ders 6, s. 5"},{"id":"d6-k09","on":"Dünya, güneş, ay ne zaman küçük yazılır?","arka":"Gezegen ya da gök cismi anlamı dışında: Bütün dünya bunu konuşuyor. Balkona güneş geliyor. Gezegen anlamında büyük: Mars, Dünya.","kaynak":"Ders 6, s. 7"},{"id":"d6-k10","on":"Birleşik kelime ne zaman bitişik yazılır?","arka":"Ses düşmesi (kaynata, niçin), anlam değişmesi (yalıçapkını), tasvirî fiil (okuyabilmek), kalıplaşmış sıfat-fiil/emir/-dı (gökdelen, dedikodu), soyut alt/üst (bilinçaltı), ev/hane/name/zede (aşevi, depremzede), gelenekselleşmiş (birçok, hiçbir, başöğretmen).","kaynak":"Ders 6, s. 9-12"},{"id":"d6-k11","on":"“etmek/olmak” ile kurulan birleşik fiiller: bitişik mi ayrı mı?","arka":"Ses olayı varsa bitişik: hissetmek, şükretmek. Yoksa ayrı: terk etmek, arz etmek, var olmak.","kaynak":"Ders 6, s. 9; s. 12"},{"id":"d6-k12","on":"Sıra sayısı ve üleştirme sayısı rakamla nasıl yazılır?","arka":"Sıra: 7. ya da 7'nci (7.'nci yanlış). Üleştirme rakamla yazılmaz: onar, yedişer (10'ar, 7'şer yanlış).","kaynak":"Ders 6, s. 16"},{"id":"d6-k13","on":"Kısaltmalara ek nasıl getirilir?","arka":"Küçük harfli: kelimenin okunuşu (kg'da, cm'ye). Büyük harfli: son harfin okunuşu (TDK'den, THY'nin, BM'de). Kelime gibi okunan: kısaltmanın okunuşu (NATO'da, İTÜ'nün).","kaynak":"Ders 6, s. 19"},{"id":"d6-k14","on":"Düzeltme işareti hangi üç durumda kullanılır?","arka":"1) Aynı yazılan farklı kelimeleri ayırmak: âdet/adet, âşık/aşık. 2) İnce g, k (ve adlarda l) sonrası a, u: dükkân, hikâye, Nalân. 3) Nispet î'si: resmî, millî, askerî. Not: katil, kadir işaretsiz.","kaynak":"Ders 6, s. 17"},{"id":"d6-k15","on":"iken bitişik yazılınca nasıl olur?","arka":"i düşer, -ken hep ince kalır: bakarken, okurken. Ünlüden sonra y girer: okuldayken, sendeyken.","kaynak":"Ders 6, s. 15"},{"id":"d6-k16","on":"Satır sonunda kelime bölmenin kuralları?","arka":"Hece bölünmez, satır sonuna kısa çizgi; tek harf bırakılmaz (ütü-letti, ü-tületti değil); kesmeli özel adda çizgi yok (Bursa'/da); hece ünsüzle başlar (yük-se-ko-kul).","kaynak":"Ders 6, s. 18"}]},{"id":"d7","ders":7,"baslik":"Noktalama İşaretleri","kisa":"Noktalama","ozet":[{"baslik":"Tanım ve işlev","maddeler":["Noktalama işaretleri; nokta, virgül, noktalı virgül, iki nokta, üç nokta, soru, ünlem, parantez gibi, cümledeki ögeleri birbirinden ayıran işaretlerin genel adıdır.","Metinden çıkarılırlarsa metin zor anlaşılan bir sözcük yığınına döner; okurun metindeki mantıksal bağları kurmasını sağlarlar.","Harfler sesleri gösterirken noktalama işaretleri konuşmadaki vurgu, durak, ton ve ezginin işlevini kısmen üstlenir (Altun 2017).","Ünite, Türk Dil Kurumunun yazım kuralları sitesindeki noktalama açıklamalarından yararlanılarak hazırlanmıştır."],"kaynak":"Ders 7, s. 3"},{"baslik":"Noktalamanın ilk başlangıcı","maddeler":["Noktalama işaretlerinin tarihi <b>MÖ 2. yüzyılda</b>, <b>İskenderiye</b>’de yaşamış <b>Bizans(lı) dil bilgini Aristophanes</b> ile başlar (Koç 2017)."],"kaynak":"Ders 7, s. 3"},{"baslik":"Türk yazı geleneğinde eski işaretler","maddeler":["<b>Göktürk</b> metinlerinde (Orhun ve Yenisey Yazıtları) tek noktalama işareti <b>üst üste iki nokta (:)</b>’dır; sözcükleri, söz gruplarını ayırır, sözcüğün bittiği yeri gösterir.","<b>Mani (Manihey) alfabesi</b> (8.–9. yüzyıl): cümleleri ayırmak için <b>kırmızı daire içinde nokta</b> kullanılır; bu nokta aynı zamanda <b>“ve” bağlacı</b> görevi de görür.","<b>Uygur alfabesi</b>yle yazılmış metinlerde cümleleri ayırmak için <b>yan yana iki nokta (..)</b> kullanılır.","<b>Kur’an-ı Kerim</b>’de bilinen anlamda noktalama yoktur; okurken ses kesip nefes alınacak yerleri gösteren <b>vakıf işaretleri</b> vardır."],"kaynak":"Ders 7, s. 3"},{"baslik":"Bugünkü anlamıyla noktalama: Tanzimat","maddeler":["Bugünkü anlamıyla kullanım, <b>Tanzimat</b> yazarlarının Batı’dan uyarladığı ve çevirdiği eserlerle başlar.","Noktalama hakkında açıklama içeren eserlerin ilki: <b>Şinasi</b>’nin <b>Şair Evlenmesi</b> (<b>Tercümân-ı Ahvâl</b> gazetesinde tefrika). Şinasi piyesin başında <b>üç işaretin</b> görevini açıklar: <b>parantez ( ), uzun çizgi ve nokta</b>.","<b>Direktör Âli Bey</b>, çevirdiği <b>Ayyar Hamza</b> adlı tiyatro eserinde işaretleri daha çok kullanır: <b>soru, ünlem, parantez, uzun çizgi</b>.","Noktalama işaretleri üzerine <b>yazılmış ilk eser</b>: <b>Şemseddin Sami</b>’nin <b>Usûl-i Tenkit ve Tertip</b> adlı kitabı."],"kaynak":"Ders 7, s. 3-4"},{"baslik":"Genel yazım kuralı ve işaret listesi","maddeler":["Noktalama işaretleri ait oldukları kelimeye <b>bitişik</b> yazılır; <b>kesme işareti dışındaki</b> işaretlerden sonra bir boşluk bırakılır.","Derste işlenen 17 işaret: nokta, virgül, noktalı virgül, iki nokta, üç nokta, soru işareti, ünlem işareti, kısa çizgi, uzun çizgi, eğik çizgi, ters eğik çizgi, tırnak işareti, tek tırnak işareti, denden işareti, yay ayraç, köşeli ayraç, kesme işareti."],"kaynak":"Ders 7, s. 2, 4"}],"kurallar":[{"grup":"Nokta","kural":"Tamamlanmış cümlenin sonuna nokta konur.","dogru":["Kardeşim her sabah parkta koşar."],"yanlis":["Kardeşim her sabah parkta koşar"],"not":"Soru ya da duygu bildiren cümlelerin sonunda nokta yerine soru veya ünlem işareti gelir.","kaynak":"Ders 7, s. 4"},{"grup":"Nokta","kural":"Bazı kısaltmaların sonuna nokta konur (Prof., Doç., vb., ör., s., çev., Alm.).","dogru":["Kütüphaneye Prof. Dr. Selim Aydın gelecek."],"yanlis":["Kütüphaneye Prof Dr Selim Aydın gelecek."],"not":"Büyük harfli kurum kısaltmalarına (TDK, THY, İTÜ) nokta konmaz; bunlara gelen ek kesmeyle ayrılır.","kaynak":"Ders 7, s. 4"},{"grup":"Nokta","kural":"Sıra sayılarını rakamla gösterirken rakamdan sonra nokta konur.","dogru":["Sınavda 5. soruyu boş bıraktım.","XVI. yüzyıl Osmanlının en güçlü dönemidir."],"yanlis":["Sınavda 5 soruyu boş bıraktım. (Anlam “beş tane soru”ya döner.)","XVI yüzyıl Osmanlının en güçlü dönemidir."],"not":"Sıra sayısı “-inci” eki ile de yazılabilir (5’inci); o zaman ek kesmeyle ayrılır, nokta konmaz.","kaynak":"Ders 7, s. 4"},{"grup":"Nokta","kural":"Virgülle ya da çizgiyle ayrılarak arka arkaya sıralanan sıra sayılarında yalnızca <b>sonuncu</b> rakamdan sonra nokta konur.","dogru":["2, 3 ve 4. üniteler sınava dâhil.","XVIII-XIX. yüzyıllarda bu şehir çok büyüdü."],"yanlis":["2., 3. ve 4. üniteler sınava dâhil.","XVIII.-XIX. yüzyıllarda bu şehir çok büyüdü."],"not":"Çeldirici: Her rakama nokta koymak yanlıştır; nokta yalnız sondakine konur.","kaynak":"Ders 7, s. 4"},{"grup":"Nokta","kural":"Bir yazının maddelerini gösteren rakam veya harflerden sonra nokta konur: I., 1., A., a.","dogru":["1. Giriş  2. Yöntem  3. Sonuç"],"yanlis":[],"not":"Madde numaralarından sonra yay ayraç da kullanılabilir: 1), a) (bkz. Yay ayraç).","kaynak":"Ders 7, s. 4"},{"grup":"Nokta","kural":"Tarihlerde gün, ay ve yılı gösteren sayılar nokta ile ayrılır.","dogru":["Doğum tarihim 07.03.2006.","Belge 21.IV.2019 tarihlidir."],"yanlis":["Belge 21 IV 2019 tarihlidir."],"not":"Ay adı yazıyla yazılırsa ay adından önce ve sonra nokta konmaz: <b>9 Eylül 1922</b> (yanlış: 9. Eylül. 1922). Tarihlerde nokta yerine eğik çizgi de kullanılabilir: 07/03/2006.","kaynak":"Ders 7, s. 4"},{"grup":"Nokta","kural":"Saati bildiren sayılarda saat ile dakika arasına nokta konur.","dogru":["Tren 19.40’ta kalkıyor."],"yanlis":["Tren 19:40’ta kalkıyor."],"not":"Ders notunda saat için yalnızca nokta verilmiştir; iki nokta bu görevde sayılmaz.","kaynak":"Ders 7, s. 4-5"},{"grup":"Nokta","kural":"Dört ve daha çok rakamlı sayılar sondan üçlü gruplara ayrılır, aralarına nokta konur.","dogru":["Stadyumu 42.500 kişi doldurdu."],"yanlis":["Stadyumu 42,500 kişi doldurdu.","Stadyumu 42500 kişi doldurdu."],"not":"Virgül sayılarda kesir ayırır (24,7 = yirmi dört tam onda yedi); binlik grupları nokta ayırır.","kaynak":"Ders 7, s. 5"},{"grup":"Nokta","kural":"Matematikte çarpma işareti olarak ve genel ağ (internet) adreslerinde nokta kullanılır.","dogru":["6.4=24","www.tdk.gov.tr"],"yanlis":[],"not":"","kaynak":"Ders 7, s. 5"},{"grup":"Virgül","kural":"Birbiri ardınca sıralanan eş görevli kelime ve kelime gruplarını ayırır.","dogru":["Pazardan domates, biber, salatalık aldık.","Uzun boylu, esmer, güler yüzlü bir öğretmendi."],"yanlis":["Pazardan domates biber salatalık aldık."],"not":"Sıralamanın son iki ögesi arasında “ve” varsa “ve”den önce virgül konmaz: domates, biber ve salatalık.","kaynak":"Ders 7, s. 5"},{"grup":"Virgül","kural":"Sıralı cümleleri birbirinden ayırır.","dogru":["Eve geldi, çantasını bıraktı, mutfağa geçti."],"yanlis":["Eve geldi; çantasını bıraktı; mutfağa geçti."],"not":"Sıralı cümlelerin kendi içinde virgül varsa cümleleri <b>noktalı virgül</b> ayırır (bkz. Noktalı virgül).","kaynak":"Ders 7, s. 5"},{"grup":"Virgül","kural":"Uzun cümlelerde yüklemden uzak düşmüş özneyi belirtmek için özneden sonra konur.","dogru":["Mahallenin en yaşlı terzisi Hüsnü Usta, kırk yıldır aynı dükkânda, aynı makinenin başında, gelen her müşteriye güler yüzle hizmet etti."],"yanlis":[],"not":"Kısa cümlede özneden sonra virgül gerekmez: “Hüsnü Usta dükkânı açtı.”","kaynak":"Ders 7, s. 5-6"},{"grup":"Virgül","kural":"Ara söz ve ara cümleleri ayırır (ara sözün başına ve sonuna virgül konur).","dogru":["Bu yaz, doktorun da önerdiği gibi, her gün yürüyüş yaptım."],"yanlis":["Bu yaz, doktorun da önerdiği gibi her gün yürüyüş yaptım."],"not":"Ara söz kısa çizgi arasına da alınabilir: “Bu yaz -doktorun da önerdiği gibi- her gün yürüdüm.”","kaynak":"Ders 7, s. 6"},{"grup":"Virgül","kural":"Anlamı güçlendirmek için tekrarlanan kelimelerin arasına konur.","dogru":["Yıllarca, yıllarca bu anı bekledim."],"yanlis":["Yıllarca yıllarca bu anı bekledim."],"not":"Sayı adlarının yinelenmesi (üç dört kişi) farklıdır: araya kısa çizgi konmaz. (ders notunda yok) Virgül de konmaz.","kaynak":"Ders 7, s. 6"},{"grup":"Virgül","kural":"Tırnak içine alınmamış alıntı cümlesinden sonra ve konuşma çizgisiyle (–) verilen alıntı cümlesinin bitiminde konur.","dogru":["Yarın erken kalkmalıyız, dedi babam.","– Ben hazırım, dedi Zeynep."],"yanlis":["Yarın erken kalkmalıyız dedi babam.","“Yarın erken kalkmalıyız.”, dedi babam."],"not":"Alıntı <b>tırnak içindeyse</b> tırnaktan sonra virgül konmaz: “Yarın erken kalkmalıyız.” dedi babam.","kaynak":"Ders 7, s. 6"},{"grup":"Virgül","kural":"Sonraki cümleye bağlı olan kabul, ret ve teşvik sözlerinden (evet, hayır, yok, peki, tamam, olur, haydi, elbette, başüstüne…) sonra konur.","dogru":["Evet, ödevimi bitirdim.","Haydi, geç kalıyoruz."],"yanlis":["Evet ödevimi bitirdim."],"not":"","kaynak":"Ders 7, s. 6-7"},{"grup":"Virgül","kural":"Bir kelimenin kendisinden sonra gelen kelimeyle ilgisi olmadığını göstermek için konur; virgül anlamı değiştirir.","dogru":["Yaşlı, kadına yol gösterdi. (Yol gösteren yaşlı biri.)"],"yanlis":["Yaşlı kadına yol gösterdi. (Bu kez yol gösterilen yaşlı bir kadın.)"],"not":"Bu iki cümle de kendi içinde doğrudur; virgül olup olmaması kimin “yaşlı” olduğunu değiştirir. Soruda istenen anlam neyse ona bakılır.","kaynak":"Ders 7, s. 7"},{"grup":"Virgül","kural":"Hitap sözlerinden sonra konur (mektup, dilekçe başı).","dogru":["Sayın Müdürüm,","Sevgili Kardeşim,"],"yanlis":["Sayın Müdürüm"],"not":"Seslenme sözünden sonra duygu varsa ünlem de kullanılır (bkz. Ünlem).","kaynak":"Ders 7, s. 7"},{"grup":"Virgül","kural":"Metinlerde <b>art arda gelen</b> zarf-fiil ekli kelimelerden sonra konur.","dogru":["Kimseye haber vermeden, kapıyı usulca kapatarak evden çıktı."],"yanlis":[],"not":"Ders notu bu kurala “Arabasına binip, arkasına bakmadan gitti.” örneğini de verir; hemen ardından gelen DİKKAT ise tek zarf-fiilden sonra virgül konmayacağını söyler. Sınavda “-ip” sonrası virgüle dayalı soru belirsiz olabilir.","kaynak":"Ders 7, s. 7"},{"grup":"Virgül","kural":"DİKKAT: Metinde (tek) zarf-fiil eki almış kelimeden sonra virgül <b>konmaz</b>.","dogru":["Ders bitince kantine indik.","Kitabını alarak sınıftan çıktı."],"yanlis":["Ders bitince, kantine indik.","Kitabını alarak, sınıftan çıktı."],"not":"Virgül yalnızca birden çok zarf-fiil art arda geldiğinde konur.","kaynak":"Ders 7, s. 7"},{"grup":"Virgül","kural":"“Bu, şu, o” zamirleri cümlede <b>özne</b> olarak kullanıldığında sonlarına virgül konur.","dogru":["Bu, annemin en sevdiği şarkıydı.","O, her sabah erkenden çıkardı."],"yanlis":["Bu annemin en sevdiği şarkıydı. (Okur “bu anne” diye bağlayabilir.)"],"not":"“Bu kitap” gibi sıfat olarak kullanıldıklarında virgül konmaz: “Bu kitap çok güzel.”","kaynak":"Ders 7, s. 8"},{"grup":"Virgül","kural":"Sayıların yazılışında kesirleri ayırır.","dogru":["Boyu 1,72 metre."],"yanlis":["Boyu 1.72 metre."],"not":"Nokta binlik grupları ayırır (1.720), virgül ondalık kısmı ayırır (1,72).","kaynak":"Ders 7, s. 8"},{"grup":"Virgül","kural":"Edebî eserlerde konuşma bölümünden önceki ifadenin sonuna konur.","dogru":["Kapıyı açınca kardeşine,\n– Neredeydin bu saate kadar, dedi."],"yanlis":[],"not":"Ders notu aynı görevi iki noktaya da verir (İki nokta, 4. madde). İkisi de kabul edildiği için bu yeri sorulan bir boşluk tek cevaplı değildir.","kaynak":"Ders 7, s. 8"},{"grup":"Virgül","kural":"Kitap, dergi vb. künyelerinde yazar, eser, yayınevi gibi bilgilerden sonra konur; soyadı önce yazılmışsa soyadından sonra da virgül gelir.","dogru":["Sait Faik ABASIYANIK, Semaver, İstanbul: YKY, 2010.","Abasıyanık, Sait Faik (2010), Semaver, İstanbul: YKY."],"yanlis":["Abasıyanık Sait Faik (2010) Semaver İstanbul: YKY."],"not":"","kaynak":"Ders 7, s. 8"},{"grup":"Virgül","kural":"DİKKAT: Metinde “ve, veya, yahut, ya…ya” bağlaçlarından önce de sonra da virgül konmaz.","dogru":["Kapıyı kilitledi ve anahtarı cebine koydu."],"yanlis":["Kapıyı kilitledi, ve anahtarı cebine koydu.","Çay, veya kahve içebilirsin."],"not":"","kaynak":"Ders 7, s. 8"},{"grup":"Virgül","kural":"DİKKAT: Tekrarlı bağlaçlardan (ne…ne, hem…hem, ya…ya, …de…de) önce ve sonra virgül konmaz; pekiştirme ve bağlama görevindeki “da/de”den sonra da virgül konmaz.","dogru":["Hem okuyor hem çalışıyor.","Annem de babam da toplantıya geldi."],"yanlis":["Hem okuyor, hem çalışıyor.","Annem de, babam da toplantıya geldi."],"not":"Virgül–tekrarlı bağlaç karışıklığı sınavda en sık çeldiricidir.","kaynak":"Ders 7, s. 8-9"},{"grup":"Virgül","kural":"DİKKAT: “-ınca/-ince” anlamıyla zarf-fiil görevindeki mI ekinden sonra ve şart ekinden (-sa/-se) sonra virgül konmaz.","dogru":["Kar yağdı mı yollar kapanır.","Erken çıkarsan trafiğe takılmazsın."],"yanlis":["Kar yağdı mı, yollar kapanır.","Erken çıkarsan, trafiğe takılmazsın."],"not":"Bu tür “mI” cümlelerinin sonuna soru işareti de konmaz (bkz. Soru işareti).","kaynak":"Ders 7, s. 8-9"},{"grup":"Noktalı virgül","kural":"Cümlede virgüllerle ayrılmış tür veya takımları birbirinden ayırır.","dogru":["Kalem, silgi, cetvel kırtasiyeden; ekmek, peynir, süt marketten alındı."],"yanlis":["Kalem, silgi, cetvel kırtasiyeden, ekmek, peynir, süt marketten alındı."],"not":"Gruplar içinde virgül olduğu için gruplar arasını virgül değil noktalı virgül ayırır.","kaynak":"Ders 7, s. 9"},{"grup":"Noktalı virgül","kural":"Ögeleri arasında virgül bulunan sıralı cümleleri birbirinden ayırır.","dogru":["Tembeli çalıştırırsın, söylenir; çalışkanı durdurursun, üzülür."],"yanlis":["Tembeli çalıştırırsın, söylenir, çalışkanı durdurursun, üzülür."],"not":"Virgül–noktalı virgül farkı: Sıralı cümlelerin içinde virgül <b>yoksa</b> virgül yeter (Geldi, oturdu, sustu.); içinde virgül <b>varsa</b> cümle grupları noktalı virgülle ayrılır.","kaynak":"Ders 7, s. 9"},{"grup":"Noktalı virgül","kural":"İkiden fazla eş değer ögesi arasında virgül bulunan cümlelerde özneden sonra noktalı virgül <b>kullanılabilir</b>.","dogru":["Bu ülke; bilimde, sanatta, sporda ilerlemiş gençler ister."],"yanlis":[],"not":"“Kullanılabilir” denmiştir; zorunlu değildir.","kaynak":"Ders 7, s. 9"},{"grup":"İki nokta","kural":"Kendisinden sonra örnek verilecek veya açıklama yapılacak cümlenin sonuna konur.","dogru":["Çantaya üç şey koydum: su, kitap, şemsiye.","Başarının sırrı şuydu: Her gün biraz çalışmak."],"yanlis":["Çantaya üç şey koydum; su, kitap, şemsiye.","Çantaya: üç şey koydum su, kitap, şemsiye."],"not":"İki nokta açıklamadan <b>önce</b> gelir; açıklaması olmayan yere konmaz. Ders notunda iki noktadan sonra büyük/küçük harfle ilgili ayrı bir kural yoktur.","kaynak":"Ders 7, s. 10"},{"grup":"İki nokta","kural":"Ses bilgisinde uzun ünlüyü göstermek için kullanılır.","dogru":["ka:til, a:ile"],"yanlis":[],"not":"","kaynak":"Ders 7, s. 10"},{"grup":"İki nokta","kural":"Karşılıklı konuşmalarda (tiyatro metni gibi) konuşan kişiyi belirten sözden sonra konur.","dogru":["Selma: Bu akşam kim gelecek?\nOrhan: Halamlar."],"yanlis":["Selma, Bu akşam kim gelecek?"],"not":"Konuşmanın satır başına uzun çizgiyle alındığı anlatımlarda konuşan adı yazılmaz; uzun çizgi kullanılır.","kaynak":"Ders 7, s. 10"},{"grup":"İki nokta","kural":"Edebî eserlerde konuşma bölümünden önceki ifadenin sonuna konur.","dogru":["Annem pencereden seslendi:\n– Yemek hazır, çabuk gelin!"],"yanlis":[],"not":"Ders notu bu görevi virgüle de verir (Virgül, 14. madde); burada iki işaret de kabul edilir.","kaynak":"Ders 7, s. 10"},{"grup":"İki nokta","kural":"Genel ağ (internet) adreslerinde kullanılır.","dogru":["https://www.tdk.gov.tr"],"yanlis":[],"not":"","kaynak":"Ders 7, s. 10"},{"grup":"Üç nokta","kural":"Tamamlanmamış cümlelerin sonuna konur.","dogru":["Sana bir şey söyleyecektim ama…"],"yanlis":["Sana bir şey söyleyecektim ama."],"not":"","kaynak":"Ders 7, s. 11"},{"grup":"Üç nokta","kural":"Yazılmak istenmeyen kelime veya bölümlerin yerine konur.","dogru":["O gün Z… kasabasından ayrıldık."],"yanlis":[],"not":"","kaynak":"Ders 7, s. 11"},{"grup":"Üç nokta","kural":"Alıntılarda başta, ortada veya sonda alınmayan kelime ve bölümlerin yerine konur.","dogru":["“… ve sonunda yolcular limana ulaştı…”"],"yanlis":[],"not":"Alıntıda alınmayan yer için konan üç nokta yay ayraç içine de alınabilir: (…).","kaynak":"Ders 7, s. 11, 19"},{"grup":"Üç nokta","kural":"Sözün kesilip geri kalanının okurun hayal dünyasına bırakıldığını göstermek veya ifadeye güç katmak için konur.","dogru":["Onun hâlini bir görseydin…"],"yanlis":[],"not":"","kaynak":"Ders 7, s. 11"},{"grup":"Üç nokta","kural":"Karşılıklı konuşmalarda yeterli olmayan, eksik bırakılan cevaplarda kullanılır.","dogru":["– Kaç kişi geldi?\n– Beş… belki altı…\n– …"],"yanlis":[],"not":"","kaynak":"Ders 7, s. 11"},{"grup":"Üç nokta","kural":"Ünlem ve seslenmelerde anlatımı pekiştirmek için konur.","dogru":["Murat… Murat!.. Beni duymuyor musun?"],"yanlis":[],"not":"DİKKAT: Üç nokta yerine iki ya da daha çok nokta kullanılmaz (“Bekle..” yanlış). Ünlem ve soru işaretinden sonra ise üç nokta yerine <b>iki nokta</b> yeterlidir: !.. ?..","kaynak":"Ders 7, s. 12"},{"grup":"Soru işareti","kural":"Soru anlamı taşıyan cümle veya kelimelerin sonuna konur.","dogru":["Bu kitabı sen mi aldın?"],"yanlis":["Bu kitabı sen mi aldın."],"not":"","kaynak":"Ders 7, s. 12"},{"grup":"Soru işareti","kural":"Soru eki ya da soru sözü içermediği hâlde soru bildiren cümlelerin sonuna konur.","dogru":["– Ben eve dönüyorum, sen?"],"yanlis":["– Ben eve dönüyorum, sen."],"not":"","kaynak":"Ders 7, s. 12"},{"grup":"Soru işareti","kural":"Bilinmeyen, kesin olmayan ya da şüpheyle karşılanan yer, tarih vb. bilgiler için kullanılır; yay ayraç içine alınır.","dogru":["Ozan 1650 (?) yılında doğmuştur.","Âşık Kerem (?-?) bu türküyü söylemiştir."],"yanlis":[],"not":"Yay ayraç içindeki (!) alay/küçümseme bildirir; (?) bilginin şüpheli olduğunu bildirir. Karıştırma.","kaynak":"Ders 7, s. 12, 18-19"},{"grup":"Soru işareti","kural":"DİKKAT: mI ekini alan yan cümle temel cümlenin zarf tümleci olduğunda (“-ınca” anlamı) cümlenin sonuna soru işareti konmaz.","dogru":["Yaz geldi mi sahiller dolar."],"yanlis":["Yaz geldi mi sahiller dolar?"],"not":"Bu cümlede soru anlamı yoktur; “mı” = “gelince”.","kaynak":"Ders 7, s. 12"},{"grup":"Soru işareti","kural":"DİKKAT: Soru bildiren sıralı ve bağlı cümlelerde soru işareti yalnızca en sona konur.","dogru":["Tatile denize mi gidelim, dağa mı?"],"yanlis":["Tatile denize mi gidelim?, dağa mı?","Tatile denize mi gidelim? dağa mı?"],"not":"","kaynak":"Ders 7, s. 13"},{"grup":"Ünlem işareti","kural":"Sevinç, kıvanç, acı, korku, şaşma gibi duyguları bildiren cümlelerin sonuna konur.","dogru":["Ne güzel bir sürpriz bu!","Eyvah! Kapı kilitli kaldı."],"yanlis":["Ne güzel bir sürpriz bu?"],"not":"","kaynak":"Ders 7, s. 13"},{"grup":"Ünlem işareti","kural":"Seslenme, hitap ve uyarı sözlerinden sonra kullanılır.","dogru":["Dikkat! Zemin ıslak.","Ey gençler! Geleceği siz kuracaksınız."],"yanlis":[],"not":"DİKKAT: Ünlem, seslenme sözünden hemen sonra konabileceği gibi cümlenin sonuna da konabilir: “Gençler, geleceği siz kuracaksınız!”","kaynak":"Ders 7, s. 13"},{"grup":"Ünlem işareti","kural":"Bir söze alay, kinaye veya küçümseme anlamı katmak için o sözden hemen sonra yay ayraç içinde ünlem kullanılır.","dogru":["Çok çalışkan (!) arkadaşımız bu dönem de kitabını açmadı."],"yanlis":["Çok çalışkan (?) arkadaşımız bu dönem de kitabını açmadı."],"not":"(?) şüphe bildirir, alay bildirmez.","kaynak":"Ders 7, s. 13, 18"},{"grup":"Kısa çizgi","kural":"Satır sonunda kelimenin bölündüğünü göstermek için kullanılır; bölme hece sınırından yapılır.","dogru":["… sabah erkenden yo-\nla çıktık."],"yanlis":["… sabah erkenden yol-\na çıktık."],"not":"","kaynak":"Ders 7, s. 13-14"},{"grup":"Kısa çizgi","kural":"Cümle içindeki ara söz ve ara cümleler kısa çizgi arasına alınır.","dogru":["Dün akşam -hiç beklemediğim bir anda- eski bir dostum aradı."],"yanlis":[],"not":"Ara söz virgül arasına da alınabilir. Kısa çizgi ara söz içindir; satır başındaki <b>konuşma</b> için uzun çizgi kullanılır.","kaynak":"Ders 7, s. 14"},{"grup":"Kısa çizgi","kural":"Dil bilgisinde kelimenin kökünü, gövdesini, eklerini ve hecelerini birbirinden ayırmak için kullanılır.","dogru":["göz-lük-çü (kök-ek)","ki-tap-lık (hece)"],"yanlis":[],"not":"","kaynak":"Ders 7, s. 14"},{"grup":"Kısa çizgi","kural":"Fiil kök ve gövdelerini göstermek için (sonlarına); isim yapma eklerinin başına, fiil yapma eklerinin başına ve sonuna konur.","dogru":["oku-, gel-, sev-","-lık (isim yapma eki), -la- (fiil yapma eki)"],"yanlis":[],"not":"","kaynak":"Ders 7, s. 14"},{"grup":"Kısa çizgi","kural":"“ve, ile, ila, …-den …-e” anlamlarını vermek için kelimeler ya da sayılar arasına konur.","dogru":["Ankara-Sivas treni","Türkçe-Almanca sözlük","2010-2020 yılları"],"yanlis":[],"not":"DİKKAT: Cümle içinde sayı adları yinelenince araya kısa çizgi konmaz: “Üç dört kişi geldi.” (yanlış: üç-dört kişi)","kaynak":"Ders 7, s. 14-15"},{"grup":"Kısa çizgi","kural":"Matematikte çıkarma işareti olarak ve sıfırdan küçük değerleri göstermek için kullan
