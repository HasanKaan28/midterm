 kalan tek hatıradır."],"dogru":2,"neden":"Şart ekinden (-sa/-se) sonra virgül konmaz. Diğerleri doğru: kabul sözü (evet), eş görevli sıfatlar, tırnaksız alıntı ve özne olan “bu” zamirinden sonra virgül konur.","kaynak":"Ders 7, s. 5-9"},{"id":"d7-s06","tip":"islev","oncul":"Yaşlı, kadına yolu tarif etti.","soru":"Bu cümlede virgül hangi görevde kullanılmıştır?","siklar":["Eş görevli kelimeleri ayırmak","Bir kelimenin sonraki kelimeyle ilgisi olmadığını göstermek","Ara sözü ayırmak","Sıralı cümleleri ayırmak","Hitap sözünden sonra gelmek"],"dogru":1,"neden":"Virgül, “yaşlı” kelimesinin “kadın”ın sıfatı olmadığını, yolu tarif edenin yaşlı biri olduğunu gösterir; bu, ilgisizlik gösteren virgüldür.","kaynak":"Ders 7, s. 7"},{"id":"d7-s07","tip":"bilgi","oncul":"","soru":"Orhun ve Yenisey Yazıtları’nda sözcükleri ve söz gruplarını ayırmak için kullanılan tek noktalama işareti aşağıdakilerden hangisidir?","siklar":["Yan yana iki nokta (..)","Kırmızı daire içinde nokta","Üst üste iki nokta (:)","Vakıf işaretleri","Virgül (,)"],"dogru":2,"neden":"Göktürk (Runik) yazıtlarında tek işaret üst üste iki noktadır. Yan yana iki nokta Uygur, kırmızı daire içinde nokta Mani alfabesine; vakıf işaretleri Kur’an-ı Kerim okumasına aittir.","kaynak":"Ders 7, s. 3"},{"id":"d7-s08","tip":"bosluk-doldurma","oncul":"Saat 09 ( ) 30 ( ) da başlayan kongreye 2 ( ) 500 kişi katıldı ( ) Açılış konuşmasını TDK ( ) nin başkanı yaptı ( )","soru":"Yukarıdaki metinde boş bırakılan yerlere sırasıyla hangi noktalama işaretleri getirilmelidir?","siklar":["(.) (’) (.) (.) (’) (.)","(:) (’) (,) (.) (’) (.)","(.) (’) (,) (.) (’) (.)","(.) (’) (.) (,) (’) (.)","(.) (,) (.) (.) (’) (.)"],"dogru":0,"neden":"Saat ile dakika ve binlik gruplar noktayla ayrılır (09.30, 2.500); sayıya ve kısaltmaya gelen ekler kesmeyle ayrılır (09.30’da, TDK’nin).","kaynak":"Ders 7, s. 4-5, 20"},{"id":"d7-s09","tip":"bosluk-doldurma","oncul":"Ne güzel bir gün ( ) Kuşlar ötüyor ( ) çiçekler açıyor ( ) ağaçlar yeşeriyor ( ) Sen de dışarı çıkmak istemez misin ( )","soru":"Yukarıdaki metinde boş bırakılan yerlere sırasıyla hangi noktalama işaretleri getirilmelidir?","siklar":["(!) (,) (,) (.) (?)","(.) (:) (,) (.) (?)","(!) (,) (,) (?) (.)","(?) (,) (,) (.) (!)","(!) (;) (;) (.) (.)"],"dogru":0,"neden":"Sevinç bildiren cümle ünlemle biter; içinde virgül olmayan sıralı cümleler virgülle ayrılır; soru eki (mi) taşıyan cümle soru işaretiyle biter.","kaynak":"Ders 7, s. 5, 12-13"},{"id":"d7-s10","tip":"bosluk-doldurma","oncul":"Kahvaltıda peynir ( ) zeytin ( ) bal ( ) akşam yemeğinde çorba, pilav ve salata vardı ( ) Sen bugün ne yedin ( )","soru":"Yukarıdaki metinde boş bırakılan yerlere sırasıyla hangi noktalama işaretleri getirilmelidir?","siklar":["(,) (,) (;) (.) (.)","(,) (,) (:) (.) (?)","(,) (,) (;) (.) (?)","(;) (,) (;) (.) (?)","(,) (,) (;) (?) (.)"],"dogru":2,"neden":"Peynir, zeytin, bal eş görevli olduğu için virgülle ayrılır; kendi içinde virgül bulunan iki takım (kahvaltıdakiler ve akşam yemeğindekiler) noktalı virgülle ayrılır; soru sözü (ne) taşıyan cümle soru işaretiyle biter.","kaynak":"Ders 7, s. 5, 9, 12"},{"id":"d7-s11","tip":"yanlis-yok","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde noktalama yanlışı <u>yoktur</u>?","siklar":["Çalışırsan, başarırsın.","Annem ve, babam bize geldi.","Ailemin de, arkadaşlarımın da desteği büyüktü.","Bu, benim en sevdiğim kitaptır.","Kurs saat 10:30’da başlayacak."],"dogru":3,"neden":"Özne olarak kullanılan “bu” zamirinden sonra virgül konur. Diğerlerinde: şart ekinden, “ve”den ve da/de bağlacından sonra virgül konmaz; saat ve dakika arasına iki nokta değil nokta konur.","kaynak":"Ders 7, s. 4, 8-9"},{"id":"d7-s12","tip":"yanlis-yok","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde noktalama yanlışı <u>yoktur</u>?","siklar":["Atatürk “Yurtta sulh, cihanda sulh.”, demiştir.","Yahya Kemal’in “Sessiz Gemi”’sini okudunuz mu?","Bu konuyu Türk Tarih Kurumu’nun yayınlarında bulabilirsin.","Türkçe’nin zenginliği bizi her gün şaşırtıyor.","Öğretmen sınıfa “Yarın Çanakkale Savaşı’nı anlatacağım.” dedi."],"dogru":4,"neden":"Tırnak içindeki alıntının noktası tırnağın içinde kalır, ardından virgül gelmez; özel ada (Çanakkale Savaşı) gelen ek kesmeyle ayrılır. Diğerlerinde: tırnaklı alıntıdan sonra virgül, tırnaktan sonra kesme, kurum adına kesme, yapım ekine (Türkçe) kesme yanlıştır.","kaynak":"Ders 7, s. 17-18, 21"},{"id":"d7-s13","tip":"yanlis-yok","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde noktalama yanlışı <u>yoktur</u>?","siklar":["Akşam oldu mu sokak lambaları yanardı?","Okula otobüsle mi gidersin?, yürüyerek mi?","Ozan 1650 (?) yılında Kayseri’de doğmuştur.","Hasan Bey (1900-1970)’in mektupları yayımlandı.","Bu tarifte un, şeker, yumurta ve, süt kullanılır."],"dogru":2,"neden":"Kesin olmayan tarihten sonra soru işareti yay ayraç içinde kullanılır. Diğerlerinde: “-ınca” anlamlı mI’lı cümlenin sonuna soru işareti konmaz; sıralı soru cümlelerinde soru işareti yalnız sona konur; ek ayraçtan önce gelir (Bey’in); “ve”den sonra virgül konmaz.","kaynak":"Ders 7, s. 8, 12-13, 18-19"},{"id":"d7-s14","tip":"yanlis-var","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde kesme işaretinin kullanımıyla ilgili bir yanlışlık vardır?","siklar":["Bu yıl 23 Nisan’ı çocuklarla kutladık.","Kâzım Paşa’nın mektubu bulundu.","THY’nin yeni uçakları geldi.","Konyalı’lar misafirlerini iyi ağırlar.","1923’te Cumhuriyet ilan edildi."],"dogru":3,"neden":"Özel adlara gelen yapım eki (-lı) ve çokluk eki (-lar) kesmeyle ayrılmaz: Konyalılar. Belirli tarih bildiren ay adı, unvan, kısaltma ve sayıya gelen ekler kesmeyle ayrılır.","kaynak":"Ders 7, s. 20-21"},{"id":"d7-s15","tip":"yanlis-var","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde iki nokta işaretinin kullanımıyla ilgili bir yanlışlık vardır?","siklar":["Sepette üç meyve vardı: elma, armut, ayva.","Kitabımı: masanın üstüne bıraktım.","Ses bilgisinde uzun ünlü şöyle gösterilir: ka:til.","Okulun adresi https://www.ornek.edu.tr biçimindedir.","Başarının sırrı şuydu: Her gün biraz çalışmak."],"dogru":1,"neden":"İki nokta, ardından açıklama ya da örnek gelecek sözden sonra konur; “Kitabımı” sözünden sonra açıklama gelmediği için iki nokta yanlıştır. Diğerleri açıklama, uzun ünlü ve genel ağ adresi kullanımıdır.","kaynak":"Ders 7, s. 10"},{"id":"d7-s16","tip":"yanlis-var","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde kısa çizginin kullanımıyla ilgili bir yanlışlık vardır?","siklar":["Ankara-Sivas treni sabah erkenden kalktı.","Toplantıya ancak üç-dört kişi geldi.","“gel-” fiil kökü tek hecelidir.","Dün akşam -hiç beklemediğim bir anda- eski bir dostum aradı.","Termometre bu sabah -4°C’yi gösteriyordu."],"dogru":1,"neden":"Cümle içinde sayı adları yinelendiğinde araya kısa çizgi konmaz: üç dört kişi. Diğerleri: “-den -e” anlamı, fiil kökü, ara söz ve sıfırdan küçük değer kullanımlarıdır.","kaynak":"Ders 7, s. 14-15"},{"id":"d7-s17","tip":"islev","oncul":"Bu ilaç, doktorun da söylediği gibi, günde iki kez alınmalı.","soru":"Bu cümlede virgüller hangi görevde kullanılmıştır?","siklar":["Eş görevli kelimeleri ayırmak","Ara sözü ayırmak","Sıralı cümleleri ayırmak","Tırnak içine alınmamış alıntıdan sonra gelmek","Kabul bildiren sözden sonra gelmek"],"dogru":1,"neden":"“doktorun da söylediği gibi” cümleye sonradan eklenmiş bir ara sözdür; başına ve sonuna virgül konmuştur.","kaynak":"Ders 7, s. 6"},{"id":"d7-s18","tip":"islev","oncul":"","soru":"Kısa çizgi aşağıdakilerin hangisinde <u>farklı</u> bir görevde kullanılmıştır?","siklar":["İzmir-Ankara otobüsü","Türkçe-Almanca sözlük","1990-2000 yılları arası","ev-ler-i-miz","Fenerbahçe-Galatasaray maçı"],"dogru":3,"neden":"“ev-ler-i-miz”de kısa çizgi kökü ve ekleri ayırır; diğerlerinde “ve, ile, …-den …-e” anlamı vermek için kelime veya sayıların arasına konmuştur.","kaynak":"Ders 7, s. 14"},{"id":"d7-s19","tip":"islev","oncul":"","soru":"Virgül aşağıdakilerin hangisinde <u>farklı</u> bir görevde kullanılmıştır?","siklar":["Kırmızı, mavi, sarı balonlar havaya uçtu.","Uzun, dar, karanlık bir koridordu.","Kalemi, defteri, silgiyi çantasına koydu.","Güldü, sevindi, yerinde zıpladı.","Sıcak, nemli, bunaltıcı bir gündü."],"dogru":3,"neden":"“Güldü, sevindi, yerinde zıpladı.”da virgül sıralı cümleleri ayırır; diğerlerinde eş görevli kelimeleri (sıfatları, nesneleri) ayırır.","kaynak":"Ders 7, s. 5"},{"id":"d7-s20","tip":"islev","oncul":"","soru":"Kesme işareti aşağıdakilerin hangisinde <u>farklı</u> bir görevde kullanılmıştır?","siklar":["Ankara’dan","Ahmet’e","Van Gölü’nde","n’eyleyim","Kızılırmak’ın"],"dogru":3,"neden":"“n’eyleyim”de kesme, şiirde ölçü ve söyleyiş gereği düşen sesi gösterir; diğerlerinde özel adlara getirilen ekleri ayırır.","kaynak":"Ders 7, s. 18, 20"},{"id":"d7-s21","tip":"bilgi","oncul":"","soru":"Noktalama işaretleri üzerine yazılmış <b>ilk eser</b> aşağıdakilerden hangisidir?","siklar":["Şinasi – Şair Evlenmesi","Direktör Âli Bey – Ayyar Hamza","Şemseddin Sami – Usûl-i Tenkit ve Tertip","Aristophanes – İskenderiye notları","Tercümân-ı Ahvâl gazetesi"],"dogru":2,"neden":"Noktalama ile ilgili yazılmış ilk eser Şemseddin Sami’nin Usûl-i Tenkit ve Tertip’idir. Şair Evlenmesi, noktalama hakkında açıklayıcı bilgi içeren ilk eserdir; noktalama üzerine yazılmış bir kitap değildir.","kaynak":"Ders 7, s. 4"},{"id":"d7-s22","tip":"bilgi","oncul":"","soru":"Şinasi, Şair Evlenmesi’nin başında hangi üç yazı işaretinin görevini açıklamıştır?","siklar":["Parantez, uzun çizgi, nokta","Soru, ünlem, parantez","Nokta, virgül, noktalı virgül","Ünlem, uzun çizgi, virgül","İki nokta, nokta, soru işareti"],"dogru":0,"neden":"Şinasi piyesin başında parantez, uzun çizgi ve noktanın görevini açıklar. Soru, ünlem, parantez ve uzun çizgiyi daha çok kullanan Direktör Âli Bey’dir (Ayyar Hamza).","kaynak":"Ders 7, s. 3-4"}],"kartlar":[{"id":"d7-k01","on":"Noktalama tarihinin başlangıcı ve Türk yazılarındaki ilk işaretler?","arka":"MÖ 2. yy, İskenderiye, Bizans(lı) Aristophanes. Göktürk: üst üste iki nokta (:). Mani (8–9. yy): kırmızı daire içinde nokta (= “ve”). Uygur: yan yana iki nokta (..). Kur’an: vakıf işaretleri.","kaynak":"Ders 7, s. 3"},{"id":"d7-k02","on":"Tanzimat’ta noktalama: Şinasi, Âli Bey, Şemseddin Sami?","arka":"Şinasi, Şair Evlenmesi (Tercümân-ı Ahvâl): açıklama içeren ilk eser; 3 işaret: parantez, uzun çizgi, nokta. Âli Bey, Ayyar Hamza: soru, ünlem, parantez, uzun çizgi. Noktalama üzerine yazılan ilk kitap: Şemseddin Sami, Usûl-i Tenkit ve Tertip.","kaynak":"Ders 7, s. 3-4"},{"id":"d7-k03","on":"Nokta: sayılarda ve tarihlerde nasıl kullanılır?","arka":"Sıra sayısı: 5. kat, XV. yüzyıl; sıralıysa yalnız sonuncu: 1, 2 ve 3. maddeler. Tarih: 07.03.2006 (ay yazıyla ise nokta yok: 9 Eylül 1922). Saat: 19.40. Binlik: 42.500.","kaynak":"Ders 7, s. 4-5"},{"id":"d7-k04","on":"Virgül nerelerde KONMAZ?","arka":"ve, veya, yahut, ya…ya’dan önce/sonra; tekrarlı bağlaçlarda (hem…hem, ne…ne); -ınca anlamlı mI’dan sonra (Okullar açıldı mı trafik azalır); şart ekinden sonra; da/de bağlacından sonra; tek zarf-fiilden sonra.","kaynak":"Ders 7, s. 7-9"},{"id":"d7-k05","on":"Virgül ilgisizlik ve “bu/şu/o” zamiri","arka":"Virgül, kelimenin sonrakiyle ilgisi olmadığını gösterir: “Yaşlı, kadına yol gösterdi.” Bu/şu/o özne olunca virgül: “Bu, annemin şarkısı.” Sıfat ise virgül yok: “Bu kitap güzel.”","kaynak":"Ders 7, s. 7-8"},{"id":"d7-k06","on":"Tırnaklı ve tırnaksız alıntıda virgül","arka":"Tırnaksız alıntıdan sonra virgül: Geliyorum, dedi. Tırnaklı alıntıda nokta tırnağın içinde, virgül yok: “Geliyorum.” dedi.","kaynak":"Ders 7, s. 6, 17"},{"id":"d7-k07","on":"Noktalı virgül nerelerde kullanılır?","arka":"1) Virgülle ayrılmış tür/takımları ayırır: Kalem, silgi kırtasiyeden; ekmek, süt marketten. 2) İçinde virgül olan sıralı cümleleri ayırır: Çalıştırırsın, söylenir; durdurursun, üzülür. 3) Özneden sonra kullanılabilir (zorunlu değil).","kaynak":"Ders 7, s. 9"},{"id":"d7-k08","on":"İki nokta nerelerde kullanılır?","arka":"Açıklama/örnekten önce (üç şey aldım: su, kitap, şemsiye); uzun ünlü (ka:til); tiyatroda konuşan adından sonra (Selma: Gel!); konuşmadan önceki ifadenin sonunda; genel ağ adresinde (https:).","kaynak":"Ders 7, s. 10"},{"id":"d7-k09","on":"Üç nokta: görevleri ve iki DİKKAT","arka":"Tamamlanmamış cümle; yazılmak istenmeyen söz (Z… kasabası); alıntıda atlanan yer; sözü okura bırakma; eksik cevap; seslenmeyi pekiştirme. DİKKAT: iki nokta (..) üç nokta yerine kullanılmaz; ama ! ve ? sonrasında iki nokta yeter: !.. ?..","kaynak":"Ders 7, s. 11-12"},{"id":"d7-k10","on":"Soru işareti: konmayan yer ve sıralı sorular","arka":"“-ınca” anlamlı mI cümlesine soru işareti konmaz: Yaz geldi mi sahiller dolar. Sıralı sorularda yalnız sona: Denize mi gidelim, dağa mı? (?) yay ayraç içinde şüphe: 1650 (?).","kaynak":"Ders 7, s. 12-13"},{"id":"d7-k11","on":"Kısa çizgi mi, uzun çizgi mi?","arka":"Kısa çizgi (-): satır sonu bölme, ara söz (-hiç ummadığım yerde-), kök/ek/hece, gel-, Ankara-Sivas, 15-4, -7°C. Sayı yinelemesinde konmaz: üç dört kişi. Uzun çizgi (–): satır başındaki konuşma; konuşma tırnak içindeyse kullanılmaz.","kaynak":"Ders 7, s. 13-15"},{"id":"d7-k12","on":"Eğik çizgi ve ters eğik çizgi","arka":"Eğik (/): yan yana dizeler, No: 8/4, Üsküdar/İstanbul, 21/04/2019, -lar/-ler, internet adresi, bölme (36/6), km/sa. Ters eğik (\\): bilgisayar dizinleri: D:\\Belgeler\\Ödevler.","kaynak":"Ders 7, s. 15-16"},{"id":"d7-k13","on":"Tırnak, tek tırnak, denden","arka":"Tırnak: aktarılan söz, vurgulanan söz, eser/bölüm/makale adı. Sondaki nokta/soru/ünlem tırnağın içinde: “Kim geldi?” diye sordu. Tırnaktan sonra ek kesmesiz: “Semaver”i. Tek tırnak: tırnak içinde tırnak. Denden (ʺ): alt alta tekrar eden sözün yerine.","kaynak":"Ders 7, s. 16-17"},{"id":"d7-k14","on":"Kesme işareti nerelerde KONMAZ?","arka":"Kurum/kuruluş/iş yeri adları (Türk Dil Kurumunun; istisna: Avrupa Birliği’nin); yapım ve çokluk eki (Türkçenin, Konyalılar); 3. teklik iyelikli özel ada 2. iyelik (Zafer Bayramımız); “o” zamiri (onu); tırnaktan sonraki ek. Ayraçlı açıklamada kesme ayraçtan önce: Veysel’in (1894-1973).","kaynak":"Ders 7, s. 17, 20-21"}]},{"id":"d8","ders":8,"ek":true,"baslik":"Ek: Örnek sınavda geçen, ders notlarında olmayan konular","kisa":"Ek (notta yok)","ozet":[{"baslik":"Bu bölüm ders notlarında yok","maddeler":["Örnek sınavın 11, 13, 14, 15, 16, 17, 18, 19 ve 20. soruları (20 sorudan 9'u) ders notlarında (Ders 1–7) hiç işlenmeyen konulardan geliyor.","Midterm yalnızca Ders 1–7'yi kapsıyorsa bu konular <b>çıkmaz</b>; bu bölüm yalnızca “çıkarsa hazır ol” sigortasıdır.","<b>Önce Ders 1–7'yi bitir</b>; buraya kalan zamanda bak.","Buradaki bilgiler ders notundan değil, okul dil bilgisinin standart (TDK / ÖSYM geleneği) kurallarından derlendi."],"kaynak":"Ders notunda yok · örnek sınav 11, 13–20. sorular"},{"baslik":"Anlatım kusurları ve anlatım bozuklukları","maddeler":["<b>Garabet:</b> yaygın olmayan, anlamı herkesçe bilinmeyen (eskimiş, yabancı) sözcük kullanmak.","<b>Tenafür:</b> söylenişi güç, kulağı tırmalayan ses dizilişi. <b>Kakofoni:</b> ses uyumsuzluğu, kulağa kötü gelen ses yığılması. İkisi de sesle ilgilidir ve anlamca çok yakındır.","<b>Zincirleme tamlama</b> (tetâbu-ı izâfât): tamlamaların art arda uzayıp anlatımı ağırlaştırması: “arkadaşımın annesinin evinin bahçesinin kapısı”.","<b>Gereksiz tekrar:</b> aynı sözcüğün ya da aynı anlamı veren sözün boş yere yinelenmesi.","<b>Yanlış anlamda sözcük:</b> “sayesinde” yalnızca olumlu sonuçla, “yüzünden” olumsuz sonuçla kullanılır. “Yağmur sayesinde ekinler çürüdü” bozuktur.","<b>Anlamca çelişen sözcükler:</b> kesinlik bildiren “mutlaka, kesinlikle” ile olasılık bildiren “-ebilir, galiba, belki” bir arada kullanılamaz.","Öteki başlıca bozukluklar: gereksiz sözcük (“yaklaşık yüz kişi kadar”), sözcüğün yanlış yerde kullanımı, yapı (dil bilgisi) yanlışlığı."],"kaynak":"Ders notunda yok · örnek sınav 11, 13, 14. soru türü"},{"baslik":"Ses olayları","maddeler":["<b>Ünlü düşmesi:</b> iki heceli bazı sözcükler ünlüyle başlayan ek alınca ikinci hecedeki dar ünlü düşer: ağız → ağzı, burun → burnu, oğul → oğlu, kıvır- + -ıl → kıvrıl-.","<b>Ünlü daralması:</b> a/e ile biten fiil -yor alınca a/e daralır: başla → başlıyor, bekle → bekliyor.","<b>Ünsüz yumuşaması (değişimi):</b> p, ç, t, k ile biten sözcük ünlüyle başlayan ek alınca b, c, d, ğ/g olur: kitap → kitabı, ağaç → ağacı, çocuk → çocuğu.","<b>Ünsüz benzeşmesi (sertleşmesi):</b> sert ünsüzle (f, s, t, k, ç, ş, h, p) biten sözcüğe gelen ekin c, d, g'si ç, t, k olur: kitapçı, sokakta, gitti.","<b>Ünsüz düşmesi:</b> k ile biten bazı sözcüklerde ek alınca k düşer: küçük → küçücük, ufak → ufacık, yüksek → yüksel-.","Tanıma yolu: sözcüğü kök + ek diye ayır; kökte kaybolan ses varsa düşme, değişen ses varsa yumuşama/benzeşme, -yor öncesi a/e değiştiyse daralma."],"kaynak":"Ders notunda yok · örnek sınav 15. soru türü"},{"baslik":"Yapım eki ve çekim eki","maddeler":["<b>Yapım eki</b> yeni anlamlı bir sözcük türetir: göz → gözlük, yol → yolcu, temiz → temizle-.","<b>Çekim eki</b> anlamı değiştirmez, sözcüğü cümleye bağlar: çokluk (-ler), iyelik (-im), hâl (-i, -e, -de, -den), ilgi (-in), kip/zaman ve kişi ekleri.","Genellikle önce yapım ekleri, sonra çekim ekleri gelir: yol-cu-luk-lar-ımız.","Bir sözcük birden fazla yapım eki alabilir: balık-çı-lık, göz-lük-çü, sev-gi-li.","<b>Çokluk eki</b> -ler/-lar bir çekim ekidir: ağaçlar, evlerimiz.","Tanıma yolu: eki at; geriye kalan sözcük anlamca aynı kavramsa ek çekim ekidir, farklı bir kavramsa yapım ekidir."],"kaynak":"Ders notunda yok · örnek sınav 16, 17. soru türü"},{"baslik":"Yapı bakımından fiiller","maddeler":["<b>Basit fiil:</b> yapım eki almamış fiil kökü: gel-, yaz-, oku-, gör-.","<b>Türemiş fiil:</b> yapım eki almış fiil: yeşil-len-, kara-r-, temiz-le-, kır-ıl-.","<b>Birleşik fiil (yardımcı eylemle):</b> isim + et-, ol-, eyle-, kıl-: yardım et-, hasta ol-. Ses olayı olursa bitişik yazılır: kaybol-, hissetmek, affetmek.","<b>Kurallı birleşik fiil:</b> iki fiil -a/-e, -ı/-i bağlantısıyla birleşir: yeterlik (gel-ebil-), tezlik (koş-uver-), sürerlik (bak-akal-, süre-gel-, yap-adur-), yaklaşma (düş-eyaz-).","<b>Anlamca kaynaşmış birleşik fiil:</b> deyim niteliğindeki fiiller: göz yum-, kulak ver-.","Tanıma yolu: yüklemden kip ve kişi eklerini at, kalan gövdeye bak: tek kök → basit; yapım ekli → türemiş; iki sözcük ya da -ebil-, -iver- gibi kalıp → birleşik."],"kaynak":"Ders notunda yok · örnek sınav 18. soru türü"},{"baslik":"Fiilde çatı","maddeler":["<b>Etken:</b> öznesi belli, işi özne yapar: Ali kapıyı açtı.","<b>Edilgen:</b> -l/-n eki alır; işi yapan belli değildir (sözde özne): Kapı açıldı. Cümleye “tarafından” eklenebilir.","<b>Dönüşlü:</b> -l/-n eki alır; özne işi kendi üzerine yapar: giyindi, süslendi, tarandı. Test: “kendini …” diye açılabilir (süslendi = kendini süsledi).","<b>İşteş:</b> -ş eki alır; iş karşılıklı ya da birlikte yapılır: yazıştılar, selamlaştılar, öpüştüler.","<b>Ettirgen:</b> -dir/-t eki alır; özne işi başkasına yaptırır: yazdır-, okut-, boyat-.","Edilgen ile dönüşlü aynı eki alır; ayırmak için “işi kim yaptı?” diye sor: belli değilse edilgen, öznenin kendisiyse dönüşlü."],"kaynak":"Ders notunda yok · örnek sınav 19. soru türü"},{"baslik":"Cümlenin ögeleri","maddeler":["Önce <b>yüklemi</b> bul (çekimli fiil ya da ek-fiil almış isim); öteki ögeleri ona sorularak bul.","<b>Özne:</b> “kim, ne?” sorusunun cevabı. Cümlede yoksa kişi ekinden çıkar: <b>gizli özne</b> (yaptık → biz).","<b>Belirtili nesne:</b> “neyi, kimi?” (-ı/-i eki alır): kitabı okudum. <b>Belirtisiz nesne:</b> “ne?” (ek almaz): kitap okudum.","<b>Yer tamlayıcısı (dolaylı tümleç):</b> -e, -de, -den hâl ekli; “nereye, nerede, nereden, kime, kimden?”: eve, okulda, annemden.","<b>Zarf tümleci:</b> “ne zaman, nasıl, niçin, ne kadar?”: dün akşam, hızla, kısa sürede. Hâl eki almamış yön sözleri (içeri, yukarı) de zarf tümlecidir.","Örnek: “Biz (gizli özne) dün (zarf t.) kardeşime (yer t.) bir kitap (belirtisiz nesne) aldık (yüklem).”"],"kaynak":"Ders notunda yok · örnek sınav 20. soru türü"}],"kurallar":[{"grup":"Anlatım kusurları","kural":"Garabet: yaygın olmayan, anlamı herkesçe bilinmeyen (eskimiş ya da yabancı) sözcüklerin kullanılmasından doğan kusur.","dogru":["Herkesin bildiği “kuşku” yerine ağır, az bilinen eş anlamlıların seçilmesi garabete yol açar."],"yanlis":[],"not":"Tanımda “sık kullanılmayan, herkesçe bilinmeyen sözcük” geçiyorsa cevap garabettir.","kaynak":"Ders notunda yok"},{"grup":"Anlatım kusurları","kural":"Tenafür: harflerin/seslerin birbirine uymayıp söylenişi güçleştirmesi, kulağı tırmalayan ses dizilişi.","dogru":[],"yanlis":[],"not":"Kakofoni ile anlamca çok yakındır; ikisi de sesle ilgili kusurdur.","kaynak":"Ders notunda yok"},{"grup":"Anlatım kusurları","kural":"Kakofoni: ses uyumsuzluğu; kulağa hoş gelmeyen seslerin bir araya gelmesi.","dogru":[],"yanlis":[],"not":"Batı kaynaklı terimdir; tenafürle aynı alana (ses) aittir.","kaynak":"Ders notunda yok"},{"grup":"Anlatım kusurları","kural":"Zincirleme tamlama (tetâbu-ı izâfât): isim tamlamalarının art arda uzaması, anlatımın ağırlaşması.","dogru":["Kusurlu: “Okulumuzun bahçesinin duvarının rengi solmuş.”","Daha iyi: “Okul bahçemizdeki duvarın rengi solmuş.”"],"yanlis":[],"not":"Art arda gelen -ın/-in ilgi ekleri bu kusurun işaretidir.","kaynak":"Ders notunda yok"},{"grup":"Anlatım kusurları","kural":"Gereksiz tekrar: aynı sözcüğün ya da aynı anlamı veren sözlerin gereksiz yere yinelenmesi.","dogru":["Daha iyi: “Sorunu çözmek için yeni yöntemi bu hafta deneyeceğiz.”"],"yanlis":["Bu sorunu çözmek için bu yöntemi bu hafta deneyeceğiz."],"not":"","kaynak":"Ders notunda yok"},{"grup":"Anlatım bozuklukları","kural":"Sözcüğün yanlış anlamda kullanılması: “sayesinde” olumlu, “yüzünden” olumsuz sonuç için kullanılır.","dogru":["Şiddetli yağmur yüzünden ekinler zarar gördü.","Düzenli çalışması sayesinde sınavı kazandı."],"yanlis":["Şiddetli yağmur sayesinde ekinler zarar gördü."],"not":"Sonuç kötüyse “sayesinde” bozukluktur.","kaynak":"Ders notunda yok"},{"grup":"Anlatım bozuklukları","kural":"Anlamca çelişen sözcüklerin bir arada kullanılması: kesinlik (mutlaka, kesinlikle) ile olasılık (-ebilir, galiba, belki) bir arada olmaz.","dogru":["Galiba bu akşam yağmur yağacak.","Bu akşam kesinlikle yağmur yağacak."],"yanlis":["Galiba bu akşam kesinlikle yağmur yağacak."],"not":"“Mutlaka … -ebilir” kalıbı da aynı türdendir.","kaynak":"Ders notunda yok"},{"grup":"Anlatım bozuklukları","kural":"Gereksiz sözcük kullanımı: aynı anlamı veren iki sözcüğün birlikte kullanılması.","dogru":["Toplantıya yaklaşık yüz kişi katıldı.","Toplantıya yüz kişi kadar katıldı."],"yanlis":["Toplantıya yaklaşık yüz kişi kadar katıldı."],"not":"“Yaklaşık” ile “kadar / civarında” aynı işi görür; biri atılır.","kaynak":"Ders notunda yok"},{"grup":"Anlatım bozuklukları","kural":"Sözcüğün yanlış yerde kullanılması: sözcük yanlış yerde durduğu için anlam karışır.","dogru":["Babası ona yeni bir bisiklet aldı."],"yanlis":["Babası yeni ona bir bisiklet aldı."],"not":"Bozuk cümlede “yeni” “az önce” anlamına kayar.","kaynak":"Ders notunda yok"},{"grup":"Anlatım bozuklukları","kural":"Yapı (dil bilgisi) yanlışlığı: ortak kullanılan bir ögenin istediği ek her iki sözcüğe uymaz.","dogru":["Ders çalışmaya ve kitap okumaya önem veriyor."],"yanlis":["Ders çalışmayı ve kitaplara çok önem veriyor."],"not":"“Önem vermek” -e hâli ister: çalışmaya önem vermek.","kaynak":"Ders notunda yok"},{"grup":"Ses olayları","kural":"Ünlü düşmesi: iki heceli bazı sözcükler ünlüyle başlayan ek alınca ikinci hecedeki dar ünlü düşer.","dogru":["ağız + ı → ağzı","burun + u → burnu","oğul + u → oğlu","kıvır- + -ıl → kıvrıl-","şehir + i → şehri","kayıp + ol- → kaybol-"],"yanlis":[],"not":"Yanında başka ses olayı da olabilir (kaybol-: düşme + yumuşama).","kaynak":"Ders notunda yok"},{"grup":"Ses olayları","kural":"Ünlü daralması: a/e ile biten fiil -yor eki alınca a/e, ı/i/u/ü olur.","dogru":["başla + yor → başlıyor","bekle + yor → bekliyor","sula + yor → suluyor"],"yanlis":[],"not":"Ünsüzle biten köklerde (gel-iyor) daralma yoktur.","kaynak":"Ders notunda yok"},{"grup":"Ses olayları","kural":"Ünsüz yumuşaması (değişimi): p, ç, t, k ile biten sözcük ünlüyle başlayan ek alınca b, c, d, ğ/g olur.","dogru":["kitap + ı → kitabı","ağaç + ı → ağacı","kanat + ı → kanadı","çocuk + u → çocuğu","git- + -iyor → gidiyor"],"yanlis":[],"not":"Tek heceli sözcüklerin çoğu yumuşamaz (top → topu, saç → saçı); özel adlar yazıda yumuşatılmaz.","kaynak":"Ders notunda yok"},{"grup":"Ses olayları","kural":"Ünsüz benzeşmesi (sertleşmesi): sert ünsüzle (f, s, t, k, ç, ş, h, p) biten sözcüğe gelen ekin c, d, g'si ç, t, k olur.","dogru":["kitap + cı → kitapçı","sokak + da → sokakta","git + di → gitti","ağaç + dan → ağaçtan"],"yanlis":[],"not":"Sert ünsüzler: “FıSTıKÇı ŞaHaP”.","kaynak":"Ders notunda yok"},{"grup":"Ses olayları","kural":"Ünsüz düşmesi: k ile biten bazı sözcüklerde ek alınca k düşer.","dogru":["küçük + cük → küçücük","ufak + cık → ufacık","yüksek + el- → yüksel-","alçak + al- → alçal-"],"yanlis":[],"not":"","kaynak":"Ders notunda yok"},{"grup":"Ses olayları","kural":"Ünsüz türemesi: Arapçadan gelen bazı sözcüklerde ünlüyle başlayan ek ya da et-/ol- gelince son ünsüz ikizleşir.","dogru":["hak + ı → hakkı","his + et- → hisset-","af + et- → affet-","zan + et- → zannet-"],"yanlis":[],"not":"Ses olayı olduğu için bu birleşik fiiller bitişik yazılır.","kaynak":"Ders notunda yok"},{"grup":"Ekler","kural":"Yapım eki: kökten yeni anlamlı bir sözcük türetir; bir sözcük birden fazla yapım eki alabilir.","dogru":["göz → gözlük → gözlükçü","yol → yolcu → yolculuk","balık → balıkçı → balıkçılık","yeşil → yeşillen-"],"yanlis":[],"not":"Genellikle önce yapım, sonra çekim ekleri gelir (yol-cu-luk-lar).","kaynak":"Ders notunda yok"},{"grup":"Ekler","kural":"Çekim eki: sözcüğün anlamını değiştirmez, onu cümleye bağlar: çokluk (-ler/-lar), iyelik, hâl, ilgi (-in), kip/zaman ve kişi ekleri.","dogru":["ev-ler-imiz-de (çokluk + iyelik + hâl)","çiçek-ler-i","gel-ecek-sin"],"yanlis":[],"not":"Çokluk eki -ler/-lar çekim ekidir.","kaynak":"Ders notunda yok"},{"grup":"Yapı bakımından fiiller","kural":"Basit fiil: yapım eki almamış fiil kökü.","dogru":["gel-di","yaz-acak","oku-yor","gör-müş"],"yanlis":[],"not":"Çekim ekleri (zaman, kişi) fiili türemiş yapmaz.","kaynak":"Ders notunda yok"},{"grup":"Yapı bakımından fiiller","kural":"Türemiş fiil: isimden ya da fiilden yapım ekiyle türetilmiş fiil.","dogru":["yeşil-len-di","kara-r-dı","temiz-le-di","kır-ıl-dı"],"yanlis":[],"not":"","kaynak":"Ders notunda yok"},{"grup":"Yapı bakımından fiiller","kural":"Birleşik fiil (yardımcı eylemle): isim + et-, ol-, eyle-, kıl-.","dogru":["yardım etti","hasta oldu","kaybol- (bitişik)","hissetti (bitişik)"],"yanlis":[],"not":"Ses olayı (düşme, türeme) varsa bitişik, yoksa ayrı yazılır.","kaynak":"Ders notunda yok"},{"grup":"Yapı bakımından fiiller","kural":"Kurallı birleşik fiil: iki fiil -a/-e, -ı/-i bağlantısıyla birleşir: yeterlik, tezlik, sürerlik, yaklaşma.","dogru":["yeterlik: oynayabilecek, çözebilir","tezlik: koşuverdi, söyleyiverdi","sürerlik: bakakaldı, süregelmek, yapadurdu","yaklaşma: düşeyazdı"],"yanlis":[],"not":"Yeterliğin olumsuzu -ama/-eme ile yapılır: gelemedi.","kaynak":"Ders notunda yok"},{"grup":"Yapı bakımından fiiller","kural":"Anlamca kaynaşmış birleşik fiil: deyim niteliğinde, mecaz anlamlı fiiller.","dogru":["göz yummak","kulak vermek"],"yanlis":[],"not":"","kaynak":"Ders notunda yok"},{"grup":"Fiilde çatı","kural":"Etken: öznesi belli, işi öznenin yaptığı fiil.","dogru":["Ali kapıyı açtı.","Kardeşim bütün gece roman okudu."],"yanlis":[],"not":"","kaynak":"Ders notunda yok"},{"grup":"Fiilde çatı","kural":"Edilgen: -l/-n eki alır; işi yapan belli değildir, özne sözde öznedir.","dogru":["Kapı açıldı.","Sınav sonuçları açıklanacak.","Ödüller dağıtıldı."],"yanlis":[],"not":"Cümleye “tarafından” eklenebilir; işi yapan özne değildir.","kaynak":"Ders notunda yok"},{"grup":"Fiilde çatı","kural":"Dönüşlü: -l/-n eki alır; özne işi kendi üzerine yapar.","dogru":["Kız aynanın karşısında süslendi.","Çocuk hızla giyindi."],"yanlis":[],"not":"Test: “kendini …” diye açılır: süslendi = kendini süsledi; tarandı = kendini taradı (saçını taradı).","kaynak":"Ders notunda yok"},{"grup":"Fiilde çatı","kural":"İşteş: -ş eki alır; iş karşılıklı ya da birlikte yapılır.","dogru":["İki arkadaş yıllarca yazıştı.","Komşular bayramda selamlaştı."],"yanlis":[],"not":"","kaynak":"Ders notunda yok"},{"grup":"Fiilde çatı","kural":"Ettirgen: -dir/-t eki alır; özne işi başkasına yaptırır.","dogru":["Annem duvarları boyacıya boyattı.","Öğretmen bize şiir okuttu."],"yanlis":[],"not":"Geçişsiz fiil bu eklerle geçişli olursa (gül- → güldür-) buna oldurgan denir.","kaynak":"Ders notunda yok"},{"grup":"Cümlenin ögeleri","kural":"Yüklem: cümlede işi, oluşu ya da yargıyı bildiren çekimli fiil ya da ek-fiil almış isim; temel ögedir.","dogru":["Bu yıl çok kitap <b>okuduk</b>.","Hava bugün çok <b>soğuk</b>."],"yanlis":[],"not":"Öteki ögeler yükleme soru sorularak bulunur.","kaynak":"Ders notunda yok"},{"grup":"Cümlenin ögeleri","kural":"Özne: yükleme sorulan “kim, ne?” sorusunun cevabı; cümlede söylenmemişse kişi ekinden anlaşılır (gizli özne).","dogru":["<b>Kardeşim</b> her akşam kitap okur.","Erkenden yola çıktık. (gizli özne: biz)"],"yanlis":[],"not":"","kaynak":"Ders notunda yok"},{"grup":"Cümlenin ögeleri","kural":"Belirtili nesne: “neyi, kimi?” sorusunun cevabı, -ı/-i hâl ekini alır.","dogru":["Annem <b>pastayı</b> fırından çıkardı.","Öğretmen <b>ödevleri</b> topladı."],"yanlis":[],"not":"","kaynak":"Ders notunda yok"},{"grup":"Cümlenin ögeleri","kural":"Belirtisiz nesne: “ne?” sorusunun cevabı, hâl eki almaz.","dogru":["Kardeşim her sabah <b>süt</b> içer.","Babam bize <b>yeni bir bisiklet</b> aldı."],"yanlis":[],"not":"“Ne?” sorusunun cevabı özne değilse belirtisiz nesnedir.","kaynak":"Ders notunda yok"},{"grup":"Cümlenin ögeleri","kural":"Yer tamlayıcısı (dolaylı tümleç): -e, -de, -den hâl ekli söz; “nereye, nerede, nereden, kime, kimde, kimden?”","dogru":["Annem <b>pazardan</b> sebze aldı.","Kardeşime bir kitap aldım. (kime? <b>kardeşime</b>)"],"yanlis":[],"not":"","kaynak":"Ders notunda yok"},{"grup":"Cümlenin ögeleri","kural":"Zarf tümleci: yüklemi zaman, durum, miktar, neden ve hâl eki almamış yön bakımından tamamlar; “ne zaman, nasıl, niçin, ne kadar?”","dogru":["<b>Kısa sürede</b> bütün işleri bitirdik.","<b>Yarın sabah</b> yola çıkacağız.","Çocuk <b>içeri</b> girdi."],"yanlis":[],"not":"“eve girdi”: yer tamlayıcısı; “içeri girdi”: zarf tümleci.","kaynak":"Ders notunda yok"}],"sorular":[{"id":"d8-s01","tip":"anlatim","oncul":"","soru":"Bir yazarın, okurun büyük bölümünün anlamını bilmediği, günlük dilde artık kullanılmayan sözcükleri seçmesi hangi anlatım kusuruna yol açar?","siklar":["Zincirleme tamlama","Kakofoni","Garabet","Tenafür","Gereksiz tekrar"],"dogru":2,"neden":"Yaygın olmayan, herkesçe bilinmeyen sözcük kullanmak garabettir. Tenafür ve kakofoni ses, zincirleme tamlama yapı kusurudur.","kaynak":"Ders notunda yok · örnek sınav 11. soru türü"},{"id":"d8-s02","tip":"anlatim","oncul":"Arkadaşımın annesinin kardeşinin evinin bahçesi çok genişti.","soru":"Yukarıdaki cümlede hangi anlatım kusuru vardır?","siklar":["Garabet","Tenafür","Kakofoni","Zincirleme tamlama","Anlamca çelişen sözcükler"],"dogru":3,"neden":"İsim tamlamaları art arda uzamış, anlatım ağırlaşmıştır; bu zincirleme tamlama (tetâbu-ı izâfât) kusurudur.","kaynak":"Ders notunda yok · örnek sınav 11. soru türü"},{"id":"d8-s03","tip":"anlatim","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde anlatım bozukluğu vardır?","siklar":["Düzenli çalışması sayesinde sınavı kazandı.","Buzlu yollar yüzünden birçok kaza oldu.","Doktorun ihmali sayesinde hastanın durumu ağırlaştı.","Komşumuzun yardımı sayesinde taşınmayı bir günde bitirdik.","Fırtına yüzünden bütün uçuşlar iptal edildi."],"dogru":2,"neden":"“Sayesinde” olumlu sonuç için kullanılır; durumun ağırlaşması olumsuz bir sonuç olduğundan “yüzünden” denmelidir.","kaynak":"Ders notunda yok · örnek sınav 13. soru türü"},{"id":"d8-s04","tip":"anlatim","oncul":"Galiba bu akşam kesinlikle yağmur yağacak.","soru":"Yukarıdaki cümlede anlatım bozukluğunun nedeni nedir?","siklar":["Gereksiz sözcük kullanımı","Sözcüğün yanlış yerde kullanımı","Anlamca çelişen sözcüklerin bir arada kullanımı","Yapı (dil bilgisi) yanlışlığı","Sözcüğün yanlış anlamda kullanımı"],"dogru":2,"neden":"“Galiba” olasılık, “kesinlikle” kesinlik bildirir; ikisi aynı cümlede çelişir. Biri atılmalıdır.","kaynak":"Ders notunda yok · örnek sınav 14. soru türü","karistirma":false},{"id":"d8-s05","tip":"ses-olayi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde ünlü düşmesi vardır?","siklar":["Çocuğun burnu soğuktan kızarmıştı.","Annem bize sıcak bir çorba hazırladı.","Kitabını masanın üstünde unutmuş.","Akşam yemeğinden sonra parkta yürüdük.","Sabah erkenden kalkıp okula gittik."],"dogru":0,"neden":"“burun + u → burnu” sözcüğünde ikinci hecedeki dar ünlü (u) düşmüştür.","kaynak":"Ders notunda yok · örnek sınav 15. soru türü"},{"id":"d8-s06","tip":"ses-olayi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde ünsüz yumuşaması vardır?","siklar":["Kardeşim her sabah süt içer.","Ağacın dallarına kuşlar konmuş.","Bu yaz tatilde denize girdik.","Annem pazardan taze sebze aldı.","Öğrenciler sınavdan sonra bahçeye çıktı."],"dogru":1,"neden":"“ağaç + ın → ağacın” sözcüğünde ç, ünlüyle başlayan ek alınca c olmuştur.","kaynak":"Ders notunda yok · örnek sınav 15. soru türü"},{"id":"d8-s07","tip":"ses-olayi","oncul":"Annem bahçede çiçekleri suluyor.","soru":"Yukarıdaki cümlede aşağıdaki ses olaylarından hangisi vardır?","siklar":["Ünsüz yumuşaması","Ünlü daralması","Ünsüz benzeşmesi","Ünlü düşmesi","Ünsüz düşmesi"],"dogru":1,"neden":"“sula- + -yor → suluyor”: -yor eki gelince fiilin sonundaki a, u'ya daralmıştır.","kaynak":"Ders notunda yok · örnek sınav 15. soru türü"},{"id":"d8-s08","tip":"ek","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde birden fazla yapım eki almış bir sözcük vardır?","siklar":["Dedem gençliğinde uzun yıllar balıkçılık yaptı.","Ablam akşam yemeğinden sonra kitap okudu.","Ağaçların dalları fırtınada kırıldı.","Annem pazardan taze meyve aldı.","Çocuklar parkta saatlerce top oynadı."],"dogru":0,"neden":"“balık-çı-lık” sözcüğü -çı ve -lık olmak üzere iki yapım eki almıştır.","kaynak":"Ders notunda yok · örnek sınav 16. soru türü"},{"id":"d8-s09","tip":"ek","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde çokluk eki vardır?","siklar":["Kardeşim okuldan dönünce hemen ödevine başladı.","Bu sabah otobüs durağında eski bir arkadaşımı gördüm.","Annem bize sıcak bir çorba hazırladı.","Bahçedeki çiçekleri sabah erkenden suladım.","Yağmur dinince sokakta kısa bir yürüyüş yaptık."],"dogru":3,"neden":"“çiçek-ler-i” sözcüğündeki -ler çokluk ekidir; çokluk eki bir çekim ekidir.","kaynak":"Ders notunda yok · örnek sınav 17. soru türü"},{"id":"d8-s10","tip":"ek","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde koyu yazılan ek bir yapım ekidir?","siklar":["Ev<b>ler</b>in önü çok kalabalıktı.","Okul<b>a</b> her gün yürüyerek gidiyorum.","Kitap<b>çı</b>dan yeni bir roman aldım.","Kardeşim yarın sabah gel<b>ecek</b>.","Bu kalem sen<b>in</b> mi?"],"dogru":2,"neden":"-çı eki “kitap”tan yeni bir sözcük (kitapçı) türetir. Ötekiler çokluk, hâl, zaman ve ilgi ekidir; hepsi çekim ekidir.","kaynak":"Ders notunda yok · örnek sınav 16, 17. soru türü"},{"id":"d8-s11","tip":"fiil-yapi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinin yüklemi yapı bakımından türemiş fiildir?","siklar":["Kardeşim bütün gece kitap okudu.","Misafirler akşam yemeğinden sonra geldi.","Babam bize uzun bir mektup yazdı.","Bahar gelince bahçedeki ağaçlar yeşillendi.","Yorgun çocuklar erkenden uyudu."],"dogru":3,"neden":"“yeşil-len-di” yükleminde isimden fiil yapan -len yapım eki vardır. Ötekiler basit fiildir.","kaynak":"Ders notunda yok · örnek sınav 18. soru türü"},{"id":"d8-s12","tip":"fiil-yapi","oncul":"Kapı çalınınca küçük kız kapıya koşuverdi.","soru":"Aşağıdaki cümlelerin hangisinin yüklemi, yukarıdaki cümlenin yüklemiyle aynı yapıdadır?","siklar":["Akşam yemeğinden sonra erkenden yattık.","Güneş batınca hava birden karardı.","Bu zor soruyu sen de çözebilirsin.","Kardeşim her gün düzenli olarak süt içer.","Yaz gelince bahçedeki çiçekler renklendi."],"dogru":2,"neden":"“koşuverdi” (tezlik) ve “çözebilirsin” (yeterlik) kurallı birleşik fiildir. Ötekiler basit ya da türemiştir.","kaynak":"Ders notunda yok · örnek sınav 18. soru türü"},{"id":"d8-s13","tip":"fiil-yapi","oncul":"","soru":"Aşağıdaki cümlelerin hangisinin yüklemi isim ve yardımcı eylemle kurulmuş birleşik fiildir?","siklar":["Çocuklar bahçede neşeyle koştu.","Kar yağınca bütün yollar beyazlandı.","Bu ağır kutuyu tek başına taşıyabilir.","Yaşlı komşumuz bize her zaman yardım eder.","Annem bize sıcak bir çorba verdi."],"dogru":3,"neden":"“yardım eder” yüklemi isim (yardım) ile yardımcı eylemin (et-) birleşmesiyle kurulmuştur.","kaynak":"Ders notunda yok · örnek sınav 18. soru türü"},{"id":"d8-s14","tip":"cati","oncul":"","soru":"Aşağıdaki cümlelerin hangisinin yüklemi dönüşlü fiildir?","siklar":["Toplantı gelecek haftaya ertelendi.","Ödüller törenle sahiplerine dağıtıldı.","Kız, aynanın karşısında uzun uzun süslendi.","Eski evler belediye tarafından yıkıldı.","Sınav sonuçları yarın açıklanacak."],"dogru":2,"neden":"“süslendi” = kendini süsledi; özne işi kendi üzerine yapmıştır. Ötekilerde işi yapan belli değildir, yüklemler edilgendir.","kaynak":"Ders notunda yok · örnek sınav 19. soru türü"},{"id":"d8-s15","tip":"cati","oncul":"","soru":"Aşağıdaki cümlelerin hangisinin yüklemi işteş fiildir?","siklar":["Çocuk sabah kendi kendine giyindi.","Bütün okullar bir hafta kapatıldı.","Annem evin duvarlarını boyacıya boyattı.","İki eski arkadaş yıllarca birbirleriyle yazıştı.","Kardeşim bütün gece roman okudu."],"dogru":3,"neden":"“yaz-ış-tı” yüklemi -ş ekiyle karşılıklı yapılan bir işi bildirir.","kaynak":"Ders notunda yok · örnek sınav 19. soru türü"},{"id":"d8-s16","tip":"cati","oncul":"","soru":"Aşağıdaki cümlelerin hangisinin yüklemi edilgen fiildir?","siklar":["Çocuk okula gitmek için hızla giyindi.","Komşular bayramda birbirleriyle bayramlaştı.","Babam arabasını ustaya tamir ettirdi.","Öğrenciler kitaplarını çantalarına koydu.","Sınav sonuçları yarın açıklanacak."],"dogru":4,"neden":"“açıkla-n-acak” yükleminde işi yapan belli değildir; “sonuçlar” sözde öznedir.","kaynak":"Ders notunda yok · örnek sınav 19. soru türü"},{"id":"d8-s17","tip":"oge","oncul":"Dün akşam kardeşime bir kitap aldım.","soru":"Yukarıdaki cümlenin ögeleri hangisinde doğru gösterilmiştir?","siklar":["Ben (gizli özne), dün akşam (zarf tümleci), kardeşime (yer tamlayıcısı), bir kitap (belirtisiz nesne), aldım (yüklem)","Ben (gizli özne), dün akşam (yer tamlayıcısı), kardeşime (zarf tümleci), bir kitap (belirtisiz nesne), aldım (yüklem)","Ben (gizli özne), dün akşam (zarf tümleci), kardeşime (yer tamlayıcısı), bir kitap (belirtili nesne), aldım (yüklem)","Dün akşam (özne), kardeşime (yer tamlayıcısı), bir kitap (belirtisiz nesne), aldım (yüklem)","Ben (gizli özne), dün akşam (zarf tümleci), kardeşime bir kitap (belirtisiz nesne), aldım (yüklem)"],"dogru":0,"neden":"Ne zaman? → dün akşam (zarf tümleci); kime? → kardeşime (yer tamlayıcısı); ne? → bir kitap (ek almadığı için belirtisiz nesne); özne kişi ekinden anlaşılan “ben”dir.","kaynak":"Ders notunda yok · örnek sınav 20. soru türü"},{"id":"d8-s18","tip":"oge","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde belirtili nesne vardır?","siklar":["Kardeşim her sabah süt içer.","Misafirler akşam saatlerinde eve geldi.","Annem pastayı fırından yeni çıkardı.","Babam bize yeni bir bisiklet aldı.","Çocuklar bahçede neşeyle oynuyor."],"dogru":2,"neden":"“Neyi çıkardı?” → pastayı; -ı hâl ekini aldığı için belirtili nesnedir.","kaynak":"Ders notunda yok · örnek sınav 20. soru türü"},{"id":"d8-s19","tip":"oge","oncul":"","soru":"Aşağıdaki cümlelerin hangisinde koyu yazılan söz zarf tümlecidir?","siklar":["<b>Kardeşim</b> her akşam kitap okur.","Annem <b>pazardan</b> taze sebze aldı.","Öğretmen <b>ödevleri</b> tek tek kontrol etti.","<b>Yarın sabah</b> erkenden yola çıkacağız.","Çocuklar akşama kadar bahçede <b>oynadı</b>."],"dogru":3,"neden":"“Ne zaman çıkacağız?” → yarın sabah; zaman bildirdiği için zarf tümlecidir. Ötekiler özne, yer tamlayıcısı, belirtili nesne ve yüklemdir.","kaynak":"Ders notunda yok · örnek sınav 20. soru türü"}],"kartlar":[{"id":"d8-k01","on":"Garabet nedir?","arka":"Yaygın olmayan, anlamı herkesçe bilinmeyen (eskimiş, yabancı) sözcük kullanmaktan doğan anlatım kusuru.","kaynak":"Ders notunda yok"},{"id":"d8-k02","on":"Tenafür ve kakofoni neyle ilgili kusurlardır?","arka":"İkisi de <b>sesle</b> ilgilidir. Tenafür: söylenişi güç, kulağı tırmalayan ses dizilişi. Kakofoni: ses uyumsuzluğu.","kaynak":"Ders notunda yok"},{"id":"d8-k03","on":"Zincirleme tamlama (tetâbu-ı izâfât) kusuru?","arka":"İsim tamlamalarının art arda uzaması: “okulumuzun bahçesinin duvarının rengi”.","kaynak":"Ders notunda yok"},{"id":"d8-k04","on":"“sayesinde” mi “yüzünden” mi?","arka":"Olumlu sonuç → sayesinde. Olumsuz sonuç → yüzünden. “Yağmur sayesinde ekinler çürüdü” bozuktur.","kaynak":"Ders notunda yok"},{"id":"d8-k05","on":"“Mutlaka gelebilir” neden bozuk?","arka":"Kesinlik (mutlaka, kesinlikle) ile olasılık (-ebilir, galiba) çelişir: anlamca çelişen sözcüklerin bir arada kullanımı.","kaynak":"Ders notunda yok"},{"id":"d8-k06","on":"Ünlü düşmesi örnekleri?","arka":"ağız → ağzı, burun → burnu, oğul → oğlu, kıvır- → kıvrıl-, şehir → şehri, kayıp → kaybol-.","kaynak":"Ders notunda yok"},{"id":"d8-k07","on":"Ünsüz yumuşaması ile ünsüz benzeşmesi farkı?","arka":"Yumuşama: p, ç, t, k + ünlü → b, c, d, ğ (kitabı). Benzeşme: sert ünsüz + c, d, g → ç, t, k (kitapçı, sokakta). Sert ünsüzler: FıSTıKÇı ŞaHaP.","kaynak":"Ders notunda yok"},{"id":"d8-k08","on":"Ünlü daralması ve ünsüz düşmesi?","arka":"Daralma: a/e ile biten fiil + -yor → başlıyor, bekliyor. Ünsüz düşmesi: küçük → küçücük, yüksek → yüksel-.","kaynak":"Ders notunda yok"},{"id":"d8-k09","on":"Yapım eki ile çekim eki nasıl ayrılır?","arka":"Yapım eki yeni sözcük türetir (göz → gözlük). Çekim eki anlamı değiştirmez (çokluk -ler, hâl, iyelik, ilgi, zaman, kişi). Genellikle önce yapım, sonra çekim gelir.","kaynak":"Ders notunda yok"},{"id":"d8-k10","on":"Yapı bakımından fiil türleri?","arka":"Basit (gel-), türemiş (yeşillen-), birleşik: yardımcı eylemli (yardım et-, kaybol-), kurallı (gelebil-, koşuver-), anlamca kaynaşmış (göz yum-).","kaynak":"Ders notunda yok"},{"id":"d8-k11","on":"Kurallı birleşik fiilin dört türü?","arka":"Yeterlik (-ebil-: oynayabilecek), tezlik (-iver-: koşuverdi), sürerlik (-akal-, -agel-, -adur-: süregelmek), yaklaşma (-ayaz-: düşeyazdı).","kaynak":"Ders notunda yok"},{"id":"d8-k12","on":"Edilgen ile dönüşlü nasıl ayrılır?","arka":"İkisi de -l/-n alır. İşi yapan belli değilse edilgen (kapı açıldı). Özne işi kendi üzerine yapıyorsa dönüşlü (süslendi = kendini süsledi).","kaynak":"Ders notunda yok"},{"id":"d8-k13","on":"İşteş ve ettirgen?","arka":"İşteş: -ş, karşılıklı/birlikte iş (yazıştılar). Ettirgen: -dir/-t, işi başkasına yaptırma (boyattı, okuttu).","kaynak":"Ders notunda yok"},{"id":"d8-k14","on":"Yer tamlayıcısı mı zarf tümleci mi?","arka":"-e, -de, -den hâl ekli → yer tamlayıcısı (eve, okulda). Ne zaman, nasıl, ne kadar; hâl eki almamış yön sözü → zarf tümleci (kısa sürede, içeri).","kaynak":"Ders notunda yok"}]}];/*VERI-BITIR*/
</script>
<script>
"use strict";
/* ---------- YARDIMCILAR ---------- */
const $ = s => document.querySelector(s);
const KEY = "trd121-calis-v1";
const SINAV = new Date("2026-11-20T17:45:00+01:00");
const HARF = "ABCDE";
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* Yalnızca <b>, <i>, <u> geçer; geri kalan her şey kaçırılır (varlıklar korunur). */
function san(s){
  return String(s == null ? "" : s)
    .replace(/&(?!(?:#\d+|#x[0-9a-f]+|[a-z][a-z0-9]*);)/gi, "&amp;")
    .replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    .replace(/&lt;(\/?)([biu])&gt;/gi, "<$1$2>");
}
function plain(s){ const d = document.createElement("div"); d.innerHTML = san(s); return d.textContent; }
function norm(s){ return String(s).toLocaleLowerCase("tr").replace(/ı/g, "i").normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function arr(x){ return Array.isArray(x) ? x : (x ? [x] : []); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function src(k){ return k ? `<span class="qsrc">${esc(k)}</span>` : ""; }
function tarih(t){ try { return new Date(t).toLocaleString("tr-TR", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"}); } catch (e) { return ""; } }
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2400); }

/* ---------- VERİ ---------- */
const DERS = (Array.isArray(VERI) ? VERI : []).filter(d => d && typeof d === "object").slice().sort((a, b) => (a.ders || 0) - (b.ders || 0));
const Q = {}, QL = [], K = {}, KL = [];
DERS.forEach(d => {
  arr(d.sorular).forEach(q => { if (!q || !q.id || Q[q.id] || !Array.isArray(q.siklar) || !q.siklar.length) return; q._d = d.ders; Q[q.id] = q; QL.push(q); });
  arr(d.kartlar).forEach(k => { if (!k || !k.id || K[k.id]) return; k._d = d.ders; K[k.id] = k; KL.push(k); });
});
const dersNo = n => DERS.find(d => d.ders == n);
const dersAd = n => { const d = dersNo(n); return d ? (d.kisa || d.baslik || "Ders " + n) : "Ders " + n; };

/* ---------- KAYIT ---------- */
function yeniDurum(){ return {tab:"konular", ders:null, fil:"all", q:{}, hata:{}, cur:null, lock:null, kart:{}, kfil:"all", kq:null, den:{aktif:null, son:null, gecmis:[]}, dk:30, theme:null}; }
function load(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = Object.assign(yeniDurum(), load() || {});
["q", "hata", "kart"].forEach(k => { if (!S[k] || typeof S[k] !== "object") S[k] = {}; });
S.den = Object.assign({aktif:null, son:null, gecmis:[]}, S.den || {});
if (!Array.isArray(S.den.gecmis)) S.den.gecmis = [];
Object.keys(S.hata).forEach(id => { if (!Q[id]) delete S.hata[id]; });
if (S.lock && !QL.some(q => q._d == S.lock.d)) S.lock = null;
if (S.den.aktif && !(Array.isArray(S.den.aktif.ids) && S.den.aktif.ids.every(id => Q[id]))) S.den.aktif = null;
if (S.theme) document.documentElement.dataset.theme = S.theme;

const solved = id => !!(S.q[id] && S.q[id].ok);

/* ---------- SEKMELER ---------- */
const TABS = [["konular","Konular"],["alistirma","Alıştırma"],["kartlar","Kartlar"],["deneme","Deneme"],["ilerleme","İlerleme & Hatalar"]];
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k, t]) => `<button type="button" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${S.tab === k}" tabindex="${S.tab === k ? 0 : -1}">${t}${k === "deneme" && S.den.aktif ? '<span class="dot" title="Deneme sürüyor"></span>' : ""}</button>`).join("");
}
function render(){
  renderTabs();
  const v = {konular:vKonular, alistirma:vAlis, kartlar:vKart, deneme:vDen, ilerleme:vIlr}[S.tab] || vKonular;
  $("#main").innerHTML = v();
  header();
}
function bos(){ return `<section class="sheet"><div class="empty">Henüz ders verisi yok. <code>python -I _metin\\birlestir.py</code> ile veriyi birleştir.</div></section>`; }
function header(){
  // The bar counts Ders 1–7 only; the "ek" lesson (outside the lecture notes) does not hold it below 100%.
  const ekD = {}; VERI.forEach(d => { if (d && d.ek) ekD[d.ders] = 1; });
  const core = QL.filter(q => !ekD[q._d]);
  const n = core.length, ok = core.filter(q => solved(q.id)).length, bad = Object.keys(S.hata).length;
  $("#barOk").style.width = n ? (100 * ok / n) + "%" : "0";
  $("#barBad").style.width = n ? (100 * Math.min(bad, n - ok) / n) + "%" : "0";
  $("#barLbl").textContent = `${ok}/${n} soru doğru · ${bad} hata`;
}

/* ---------- 1. KONULAR ---------- */
function dersSecici(act, cur, withAll, extra){
  let h = `<div class="filter-bar" role="group" aria-label="Ders seç">`;
  if (withAll) h += `<button type="button" class="filter-btn ${cur === "all" ? "active" : ""}" data-act="${act}" data-v="all">Tümü</button>`;
  h += DERS.map(d => `<button type="button" class="filter-btn ${String(cur) === String(d.ders) ? "active" : ""}" data-act="${act}" data-v="${d.ders}">${d.ders}. ${esc(d.kisa || d.baslik)}</button>`).join("");
  return h + (extra || "") + `</div>`;
}
function ruleCard(r, id){
  const dg = arr(r.dogru), yn = arr(r.yanlis);
  let h = `<div class="rule" id="${id}"><div class="rule-k">${san(r.kural)}</div>`;
  if (dg.length || yn.length) h += `<div class="rule-grid"><div class="ex ok"><span class="exl">✓ Doğru</span>${dg.map(x => `<div>${san(x)}</div>`).join("") || '<span class="muted">—</span>'}</div><div class="ex bad"><span class="exl">✗ Yanlış</span>${yn.map(x => `<div>${san(x)}</div>`).join("") || '<span class="muted">—</span>'}</div></div>`;
  if (r.not) h += `<div class="rule-not">${san(r.not)}</div>`;
  return h + src(r.kaynak) + `</div>`;
}
function vKonular(){
  if (!DERS.length) return bos();
  if (!dersNo(S.ders)) S.ders = DERS[0].ders;
  const d = dersNo(S.ders);
  let h = `<section class="sheet"><h2>Konular</h2><p class="muted small" style="margin:0">Dersi seç: özet ve (varsa) kurallar aşağıda. Kurallarda yeşil doğru, kırmızı yanlış yazımdır.</p>${dersSecici("ders", d.ders)}</section>`;
  h += `<section class="sheet"><div class="chips"><span class="chip">Ders ${d.ders}</span>${arr(d.sorular).length ? `<button type="button" class="chip purple" data-act="dersAlis" data-v="${d.ders}">Bu dersin sorularını çöz →</button>` : ""}</div><h2>${san(d.baslik)}</h2>`;
  const oz = arr(d.ozet);
  if (!oz.length) h += `<p class="muted">Bu ders için özet yok.</p>`;
  oz.forEach((o, i) => { h += `<div class="oz" id="oz-${d.ders}-${i}"><h3>${san(o.baslik)}</h3><ul>${arr(o.maddeler).map(m => `<li>${san(m)}</li>`).join("")}</ul>${src(o.kaynak)}</div>`; });
  h += `</section>`;
  const kr = arr(d.kurallar);
  if (kr.length) {
    const G = [], gi = {};
    kr.forEach((r, i) => { const g = (r && r.grup) || "Genel"; if (!(g in gi)) { gi[g] = G.length; G.push({g, items:[]}); } G[gi[g]].items.push([r, i]); });
    h += `<section class="sheet"><h2>Kurallar <span class="muted small">(${kr.length} kural, ${G.length} grup)</span></h2><p class="muted small" style="margin:0">Gruba atlamak için çipe dokun.</p><div class="chips">${G.map((x, j) => `<button type="button" class="chip" data-act="goto" data-v="kg-${d.ders}-${j}">${san(x.g)} · ${x.items.length}</button>`).join("")}</div><div class="actions" style="margin-top:0"><button type="button" class="btn ghost" data-act="acall" data-v="1">Tümünü aç</button><button type="button" class="btn ghost" data-act="acall" data-v="0">Tümünü kapat</button></div>`;
    G.forEach((x, j) => { h += `<details open id="kg-${d.ders}-${j}"><summary>${san(x.g)} <span class="muted small">(${x.items.length})</span></summary>${x.items.map(([r, i]) => ruleCard(r || {}, `kr-${d.ders}-${i}`)).join("")}</details>`; });
    h += `</section>`;
  }
  return h;
}

/* ---------- 2. ALIŞTIRMA ---------- */
let A = {id:null, ord:null, sec:null};
function pool(){
  if (S.fil === "yanlis") return QL.filter(q => S.hata[q.id]);
  if (S.fil === "all") return QL;
  return QL.filter(q => q._d == S.fil);
}
function ordFor(q){ const o = q.siklar.map((_, i) => i); return q.karistirma === false ? o : shuffle(o); }
function pickNext(cur){
  const L = S.lock;
  if (L) {
    let c = QL.filter(q => q._d == L.d && (q.tip || "") === L.tip && !solved(q.id) && q.id !== cur);
    if (c.length) { L.fb = false; return pick(c).id; }
    c = QL.filter(q => q._d == L.d && !solved(q.id) && q.id !== cur);
    if (!c.length) c = QL.filter(q => q._d == L.d && q.id !== cur);
    if (c.length) { L.fb = true; return pick(c).id; }
    L.fb = true; return cur;
  }
  const p = pool(); if (!p.length) return null;
  const i = p.findIndex(q => q.id === cur);
  for (let k = 1; k <= p.length; k++) { const q = p[(i + k + p.length) % p.length]; if (!solved(q.id) && q.id !== cur) return q.id; }
  if (S.fil !== "yanlis") toast("Bu süzgeçteki bütün soruları en az bir kez doğru yaptın. Rastgele tekrar.");
  const o = p.filter(q => q.id !== cur);
  return o.length ? pick(o).id : (p[0] ? p[0].id : null);
}
function answer(oi){
  const q = Q[S.cur]; if (!q || A.sec !== null || A.id !== q.id) return;
  A.sec = oi;
  const r = S.q[q.id] || (S.q[q.id] = {d:0, y:0, ok:false});
  if (oi === q.dogru) {
    r.d++; r.ok = true; delete S.hata[q.id];
    if (S.lock && ((q._d == S.lock.d && (q.tip || "") === S.lock.tip) || S.lock.fb)) { S.lock = null; A.unlocked = true; }
  } else {
    r.y++; S.hata[q.id] = {ver:oi, t:Date.now()};
    if (!S.lock) S.lock = {d:q._d, tip:q.tip || "", fb:false};
  }
  save(); render();
  const nb = $("#nextBtn"); if (nb) nb.focus({preventScroll:true});
}
function next(){ S.cur = pickNext(S.cur); A = {id:null, ord:null, sec:null}; save(); render(); const c = $(".qcard"); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({block:"start"}); }
function dersStats(){
  return `<div class="stats">${DERS.map(d => {
    let dd = 0, yy = 0; arr(d.sorular).forEach(q => { const r = S.q[q.id]; if (r) { dd += r.d || 0; yy += r.y || 0; } });
    return `<span title="${esc(d.baslik)}">D${d.ders}: <b class="g">${dd}✓</b> <b class="r">${yy}✗</b></span>`;
  }).join("")}</div>`;
}
function vAlis(){
  if (!QL.length) return bos();
  const p = pool(), hc = Object.keys(S.hata).length;
  let h = `<section class="sheet"><h2>Alıştırma</h2><p class="muted small" style="margin:0">Yanlış yaparsan aynı türden soru gelir; o türü doğru yapınca devam edersin. Kısayol: 1–5 ya da A–E, sonra Enter.</p>${dersSecici("fil", S.fil, true, `<button type="button" class="filter-btn warn ${S.fil === "yanlis" ? "active" : ""}" data-act="fil" data-v="yanlis">Yanlışlarım (${hc})</button>`)}${dersStats()}</section>`;
  const inPool = S.cur && p.some(q => q.id === S.cur);
  if (!S.lock && (!S.cur || !Q[S.cur] || (!inPool && (A.sec === null || A.id !== S.cur)))) {

/* ---------- 3. KARTLAR ---------- */

/* ---------- 4. DENEME ---------- */

  const fr = shuffle(ds).sort((a, b) => (by[b].length / QD.length * N - alloc[b]) - (by[a].length / QD.length * N - alloc[a]));
  for (let i = 0, guard = 0; sum < N && guard < 1000; i++, guard++) { const d = fr[i % fr.length]; if (alloc[d] < by[d].length) { alloc[d]++; sum++; } }
  let ids = []; ds.forEach(d => { ids = ids.concat(shuffle(by[d]).slice(0, alloc[d])); });

}

}

  if (e.target.id === "searchModal") { closeSearch(); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { S.tab = tb.dataset.tab; save(); render(); window.scrollTo(0, 0); const b = $("#tab-" + S.tab); if (b) b.focus({preventScroll:true}); return; }
  const t = e.target.closest("[data-act],button"); if (!t) return;
  const act = t.dataset.act, v = t.dataset.v;
  switch (t.id) {
    case "pomoToggle":
      if (pomo.run) { pomo.left = pomoLeft(); pomo.run = false; t.textContent = "Başlat"; } else { pomo.run = true; pomo.at = Date.now(); t.textContent = "Durdur"; toast("🍅 25 dakikalık Pomodoro başladı."); }
      tick(); return;
    case "pomoReset": pomo = {left:25 * 60, run:false, at:0}; $("#pomoToggle").textContent = "Başlat"; tick(); return;
    case "searchBtn": openSearch(); return;
    case "themeBtn": {
      const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      r.dataset.theme = cur === "dark" ? "light" : "dark"; S.theme = r.dataset.theme; save(); toast(S.theme === "dark" ? "Koyu tema" : "Açık tema"); return;
    }
  }
  if (!act) return;
  const a = S.den.aktif;
  switch (act) {
    case "ders": S.ders = +v; save(); render(); break;
    case "dersAlis": S.tab = "alistirma"; S.fil = +v; S.cur = null; A = {id:null}; save(); render(); window.scrollTo(0, 0); break;
    case "goto": { const el = document.getElementById(v); if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView({block:"start"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } break; }
    case "acall": document.querySelectorAll("main details").forEach(d => { d.open = v === "1"; }); break;
    case "fil": S.fil = v === "all" || v === "yanlis" ? v : +v; if (!S.lock) { S.cur = null; A = {id:null}; } save(); render(); break;
    case "ans": answer(+v); break;
    case "next": next(); break;
    case "kfil": S.kfil = v === "all" ? v : +v; buildKQ(); save(); render(); break;
    case "flip": flip = !flip; render(); { const c = $(".fc-big"); if (c) c.focus({preventScroll:true}); } break;
    case "kmark": kMark(v); break;
    case "knext": kMove(1); break;
    case "kprev": kMove(-1); break;
    case "kreset": kpool().forEach(k => { delete S.kart[k.id]; }); buildKQ(); save(); render(); break;
    case "dk": S.dk = +v; save(); render(); break;
    case "dstart": startDen(); break;
    case "dans": if (a) { const id = a.ids[a.cur]; a.cev[id] = +v; save(); render(); } break;
    case "dclr": if (a) { delete a.cev[a.ids[a.cur]]; save(); render(); } break;
    case "dgo": if (a) { const i = +v; if (i >= 0 && i < a.ids.length) { a.cur = i; save(); render(); } } break;
    case "dfin": if (a) { const bosN = a.ids.length - Object.keys(a.cev).length; if (!bosN || confirm(`${bosN} soru boş. Yine de bitirilsin mi?`)) finishDen(false); } break;
    case "solve": solve(v); break;
    case "reset":
      if (confirm("Bütün ilerleme (cevaplar, hata listesi, kartlar, deneme geçmişi) silinsin mi? Bu geri alınamaz.")) {
        const th = S.theme; S = yeniDurum(); S.theme = th; S.tab = "ilerleme"; A = {id:null}; flip = false; save(); render(); toast("İlerleme sıfırlandı.");
      }
      break;
  }
});
$("#searchInput").addEventListener("input", runSearch);
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if ($("#searchModal").hidden) openSearch(); else closeSearch(); return; }
  if (!$("#searchModal").hidden) {
    if (e.key === "Escape") { closeSearch(); return; }
    if (e.key === "Enter" && e.target.id === "searchInput") { const f = $(".modal-item"); if (f) { e.preventDefault(); f.click(); } }
    return;
  }
  const tg = e.target;
  if (tg.matches && tg.matches("input,textarea,select")) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (tg.getAttribute && tg.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const i = TABS.findIndex(x => x[0] === S.tab), n = (i + (e.key === "ArrowRight" ? 1 : -1) + TABS.length) % TABS.length;
    S.tab = TABS[n][0]; save(); render(); const b = $("#tab-" + S.tab); if (b) b.focus(); e.preventDefault(); return;
  }
  const key = e.key.toLocaleLowerCase("en");
  let k = "12345".indexOf(e.key); if (k < 0 && key.length === 1) k = "abcde".indexOf(key);
  if (S.tab === "alistirma") {
    if (A.sec === null) { if (k >= 0 && A.ord && k < A.ord.length) { e.preventDefault(); answer(A.ord[k]); } }
    else if (e.key === "Enter" && tg.tagName !== "BUTTON") { e.preventDefault(); next(); }
  } else if (S.tab === "kartlar") {
    if (e.key === " " || e.key === "Spacebar") { e.preventDefault(); if (Array.isArray(S.kq) && S.kq.length) { flip = !flip; render(); } }
    else if (e.key === "ArrowRight") { e.preventDefault(); kMove(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); kMove(-1); }
    else if (e.key === "Enter" && tg.classList && tg.classList.contains("fc-big")) { e.preventDefault(); flip = !flip; render(); }
  } else if (S.tab === "deneme" && S.den.aktif) {
    const a = S.den.aktif;
    if (k >= 0) { const id = a.ids[a.cur]; if (k < a.ord[id].length) { a.cev[id] = a.ord[id][k]; save(); render(); } }
    else if (e.key === "ArrowRight" && a.cur < a.ids.length - 1) { a.cur++; save(); render(); }
    else if (e.key === "ArrowLeft" && a.cur > 0) { a.cur--; save(); render(); }
  }
});

/* ---------- BAŞLAT ---------- */
if (S.den.aktif && kalan() <= 0) finishDen(true);
render();
countdown(); setInterval(countdown, 30000);
tick(); setInterval(tick, 1000);
</script>
