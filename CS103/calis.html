# CS103 Konu Özetleri (Hafta 1–7)

Her bölümün sonunda **Tuzak** satırı var. Sınavdan önce en alttaki tuzak listesini oku.

## 1. Basics (Hafta 1–2)

**Computer (Hafta 1, sadece Part I için):** CPU, main memory / RAM (geçici, elektrik gidince silinir), secondary memory (kalıcı: HDD, SSD, USB). Machine language = 0 ve 1. Assembly language → assembler ile machine language'e. High-level language (C++) → **compiler** ile machine language'e. 1 byte = 8 bit, 1 KB = 1024 byte. ASCII: 128 karakter. Algorithm (algoritma) = sonlu sürede biten adım adım çözüm. Structured programming = problemi alt problemlere böl (top-down design). OOP = object'ler (data + işlemler).

**Program iskeleti:**

```cpp
#include <iostream>     // preprocessor directive
using namespace std;
int main() {
    cout << "Hello" << endl;
    return 0;
}
```

**Identifier kuralı:** harf veya `_` ile başlar, sonra harf/rakam/`_`. Rakamla başlayamaz. Keyword (`int`, `return`, `while`…) olamaz. C++ case-sensitive'dir (büyük-küçük harf farklı). Function adları da aynı kurala uyar.

**Declaration (bildirim):** `int a, b = 5;` tek satırda birden çok variable (değişken) yasal. Uninitialized variable'ın değeri belirsiz (garbage). Initialization (ilk değer verme) declaration ile birlikte yapılabilir.

**Output:** `cout << x << " " << y;` Escape sequence'ler: `\n` new line, `\t` tab, `\\` backslash, `\"` tırnak.

**Input:** `cin >> a >> b;` boşluk ve satır sonlarını atlar. `char` okurken de boşluk atlanır (`J D` ve `JD` aynı sonuç).

**Decimal output format:**

```cpp
cout.setf(ios::fixed);
cout.setf(ios::showpoint);
cout.precision(2);      // 7.5 → 7.50
```

**Tuzak:** `"a"` string, `'a'` char. `cout << "number";` variable'ı değil `number` yazısını basar.

## 2. Data types ve arithmetic (Hafta 2)

| Data type | Örnek |
| --- | --- |
| `int` | `3`, `-45` |
| `double` | `3.0`, `1.5e3` |
| `char` | `'A'` (aslında sayı: `'A'` = 65) |
| `bool` | `true` (1), `false` (0); sıfır olmayan her sayı `true` |
| `string` | `"Ali"` (`#include <string>`) |

**Integer division (tam sayı bölmesi):** iki operand da `int` ise sonuç `int`, kesir **atılır** (yuvarlanmaz). `7/2 = 3`, `7/2.0 = 3.5`, `3/4 = 0`.
**Remainder (`%`, kalan):** sadece integer'larda. `17 % 5 = 2`. Negatifte işaret soldakinden: `-3 % 2 = -1`.
**Assignment'ta type conversion:** `int a = 4.75;` → `4` (kesilir). `double d = 11/2;` → `5` (önce integer division yapılır).

**Type casting (tip dönüştürme):**

```cpp
static_cast<double>(a) / b    // doğru: 3.5
a / static_cast<double>(b)    // doğru: 3.5
static_cast<double>(a / b)    // YANLIŞ: önce int bölme → 3
double(a), (double)a          // eski stil, çalışır
static_cast<int>(2.9)         // 2
```

**Operator precedence (öncelik):** `* / %` → `+ -` → comparison operator'leri → `&&` → `||`. Aynı seviyede soldan sağa. `3 + 10 * 3 = 33`.

**Compound assignment (kısaltmalı atama):** `a += 2` → `a = a + 2`. `b *= a - 14` → `b = b * (a - 14)` (sağ taraf önce hesaplanır).

**Increment / decrement (`++` ve `--`):** postfix `n++` önce kullanır, prefix `++n` önce artırır.

```cpp
int n = 2;
int v = 2 * (n++);   // v = 4, n = 3  (önce kullan, sonra artır)
int w = 2 * (++n);   // n = 4, w = 8  (önce artır, sonra kullan)
```

**Tuzak:** `static_cast<float>(3/4)` → `0`. `x++ < 5` comparison'ı eski değerle yapar ama `x` yine de artar.

## 3. Branching: if / else, switch (Hafta 3–4)

**Comparison operator'leri:** `==  !=  <  <=  >  >=`. Logical operator'ler: `&&` (and), `||` (or), `!` (not). Bunlarla kurulan condition (koşul) bir Boolean expression'dır.

- `2 <= x <= 15` C++'ta yanlış yazım. Doğrusu: `(x >= 2 && x <= 15)`.
- `if (x = 5)` derlenir ama `x`'e 5 atar (assignment) ve her zaman `true` olur. Comparison `==`.
- `!time > limit` → `(!time) > limit` olarak okunur. Niyet `!(time > limit)` ise parantez şart.
- **Short-circuit evaluation:** `&&`'de sol taraf `false` ise sağ taraf hiç hesaplanmaz; `||`'de sol taraf `true` ise sağ taraf hesaplanmaz. `(kids != 0) && (pieces / kids >= 2)` division by zero'yu önler.

**if / else:** `{}` (block) yoksa sadece ilk statement condition'a bağlıdır.

**Dangling else:** `else` her zaman **en yakın, eşleşmemiş `if`**'e bağlanır, indentation'a (girinti) bakılmaz.

```cpp
if (fuel < 75)
    if (fuel < 25) cout << "low";
else cout << "high";      // içteki if'in else'i! fuel = 80 → hiçbir şey basılmaz
```

**switch:**

```cpp
switch (grade) {          // int, char, bool, enum olabilir; string ve double OLAMAZ
    case 'A':
    case 'a': cout << "Excellent"; break;   // iki etiket aynı kodu çalıştırır
    case 'B': cout << "Good";               // break YOK → alttaki case'e düşer
    case 'C': cout << "Pass"; break;
    default:  cout << "Wrong";              // hiçbiri tutmazsa
}
```

**Fall-through kuralı:** eşleşen `case`'ten başla, `break` veya `}` görene kadar **alttaki tüm satırları** çalıştır (diğer `case` etiketlerini yok say). `default` en altta değilse de aynı kural geçerli.

**Block scope (blok kapsamı):** `{}` içinde tanımlanan variable sadece o block'ta yaşar. İç block'ta aynı isimle yeni variable tanımlanırsa dıştakini gizler.

**Tuzak:** `case "A":` compile error verir (string), `case 'A':` doğru. `default` sonrası `:` unutulmaz.

## 4. Loops (Hafta 3–5)

| Loop | Ne zaman | Condition |
| --- | --- | --- |
| `while (k) {...}` | Hiç çalışmayabilir | Başta kontrol |
| `do {...} while (k);` | **En az bir kez** çalışır | Sonda kontrol, sonunda `;` var |
| `for (init; k; update) {...}` | Sayısı belli tekrar (iteration) | Başta kontrol |

**Tracing (elde izleme) yöntemi:** her iteration'da tablo tut: variable'lar, condition, output. Condition'ı kontrol et → loop body → update → condition…

**break:** içinde bulunduğu **tek** loop'tan (veya switch'ten) çıkar. Nested loop'ta sadece içtekinden.
**continue:** iteration'ın geri kalanını atla, sonrakine geç (`for`'da update yine yapılır).

**Nested loop (iç içe döngü):** outer loop'un her iteration'ında inner loop baştan sona çalışır. Toplam iç tur = dış × iç.

```cpp
for (int i = 1; i <= 3; i++) {          // satır
    for (int j = 1; j <= i; j++)        // her satırda i yıldız
        cout << "*";
    cout << endl;
}
```

**Loop bitirme yöntemleri:** baştan sayı al (list headed by size), her iteration'da sor (ask before iterating, Y/N), sentinel value (ör. negatif sayı gelince dur; sentinel işlenmez), running out of input (file bitene kadar oku).

**Sum ve product:** `sum = 0`, `product = 1` ile başlat.

**Input validation loop (sınavda çıktı):**

```cpp
cin >> n;
while (n <= 0) {
    cout << "Warning!\n";
    cin >> n;
}
```

**Tuzak:**
- `for (...);` veya `while (...);` → noktalı virgül loop body'yi boşaltır (empty statement). `for (i = 0; i < 3; i++); cout << i;` → bir kez `3` basar.
- Counter güncellenmezse infinite loop.
- `<` ile `<=` farkı: bir iteration eksik/fazla (off-by-one error).
- `for (int i...)` içinde tanımlanan `i` loop dışında yoktur (scope).

## 5. Predefined functions (Hafta 5)

| Function | Library | Not |
| --- | --- | --- |
| `sqrt(x)`, `pow(x, y)` | `<cmath>` | `double` döndürür. `pow(2,3)` = 8 |
| `fabs(x)` | `<cmath>` | `double` mutlak değer |
| `abs(x)` | `<cstdlib>` | `int` mutlak değer. `7 / abs(-2)` = 3 (integer division) |
| `ceil(5.8)` = 6, `floor(5.8)` = 5 | `<cmath>` | |
| `rand()`, `srand(time(0))` | `<cstdlib>`, `<ctime>` | `srand` bir kez çağrılır |

**Random number aralığı:** `rand() % N + a` → `a` ile `a + N - 1` arası. Zar: `rand() % 6 + 1`. `10 < x < 21` için: `rand() % 10 + 11`.

**Geçerli function call:** return value bir expression gibi kullanılır: `fabs(3.5);` (değer atılır ama yasal), `cout << fabs(3.5);`. `cin >> fabs(3.5);` geçersiz.

## 6. Programmer-defined functions (Hafta 5–6)

```cpp
double totalCost(int number, double price);     // BİLDİRİM (prototype), ; ile biter

int main() {
    double bill = totalCost(3, 2.5);            // ÇAĞRI: argümanlar , ile ayrılır
}

double totalCost(int number, double price) {    // TANIM: başlık + gövde
    const double TAX = 0.05;
    double subtotal = number * price;
    return subtotal + subtotal * TAX;           // return fonksiyonu bitirir
}
```

- Function call'dan **önce** function declaration (prototype) veya function definition görünmeli. Definition `main`'den önceyse declaration gerekmez.
- Declaration'da parameter adları yazılmayabilir: `double totalCost(int, double);`. Definition'da adlar şart.
- Değer döndüren function'ın her yolu bir `return` statement ile bitmeli.
- Function içinde başka function **tanımlanamaz**, ama çağrılabilir.
- Argument sırası önemlidir; compiler type kontrolü yapar, mantıksal sıra kontrolü yapmaz.
- `bool` döndüren function `if (isEven(n))` şeklinde kullanılır.

**Call-by-value (değerle çağırma):** formal parameter, argument'ın **kopyasıdır**. Function içindeki değişiklik çağıranı etkilemez.

**Scope (kapsam): local / global:** function'da tanımlanan local variable sadece orada yaşar. Parameter'lar da local'dir; function body'de tekrar tanımlanmaz. Global variable tüm function'ların dışında tanımlanır; aynı isimde local varsa local kazanır. Global constant (`const double PI = 3.14159;`) yaygın ve kabul görür.

**Function overloading (aşırı yükleme):** aynı isim, **farklı parameter list** (sayı, type veya sıra).

```cpp
int    add(int a, int b);            // geçerli
double add(double a, double b);      // geçerli (tipler farklı)
int    add(int a, int b, int c);     // geçerli (sayı farklı)
double add(int a, int b);            // GEÇERSİZ: sadece dönüş tipi farklı
int    add(int x, int y);            // GEÇERSİZ: sadece parametre adları farklı
```

**Hangisi çağrılır?** Exact match kazanır. Exact match yoksa compiler en az type conversion gereken sürümü seçer. İki aday eşit derecede iyiyse **compile error (ambiguous call)**.

- `add(2, 3)` → `(int,int)`.
- `add(2.5, 3.0)` → `(double,double)`.
- `add(2, 3.0)` iki sürüm varken (`int,int` ve `double,double`) → **ambiguous, compile error**. Hafta 6 kodunda (`week6.cpp`) bu call var.
- Tek sürüm varsa automatic type conversion olur: `mpg(45, 2)` → `mpg(45.0, 2.0)`.

## 7. void functions ve call-by-reference (Hafta 7)

**void function:** değer döndürmez. `return;` (değersiz) erken çıkış için kullanılabilir, zorunlu değil. Call'u tek başına bir statement'tır: `showResults(a, b);`. `cout << showResults(a, b);` **compile error**.

```cpp
void shareBudget(int number, double total) {
    if (number == 0) {
        cout << "No people!\n";
        return;                 // fonksiyonu burada bitir
    }
    cout << total / number;
}
```

**Call-by-reference (`&`, referansla çağırma):** reference parameter, argument'ın **kendisidir** (aynı memory address). Function'daki değişiklik çağıranın variable'ını değiştirir.

```cpp
void swapValues(int& a, int& b) {   // & hem bildirimde hem tanımda
    int temp = a;
    a = b;
    b = temp;
}
```

- Reference argument **variable** olmalı: `swapValues(x, 5);` compile error.
- Mixed parameter list yasal: `void f(int& a, int b, double& c);`.
- `&` unutulursa kod derlenir ama variable değişmez (sık logic error).
- Ne zaman `&`? Function çağıranın variable'ını değiştirecekse (input okuma, swap, birden çok sonuç döndürme).

**Tracing taktiği:** reference parameter'ı gördüğünde kâğıda "`a` = main'deki `x`" yaz ve tek bir kutu üzerinde çalış.

**Precondition / postcondition:** function comment'inde "call'dan önce doğru olan" ve "call'dan sonra doğru olan".

## 8. File I/O (Hafta 5, 6.1)

```cpp
#include <fstream>

ifstream in;                 // okuma
in.open("file.txt");
int x;
while (in >> x) {            // okuma başarılı oldukça döner
    cout << x << endl;
}
in.close();

ofstream out;                // yazma (dosya yoksa oluşturur, varsa üzerine yazar)
out.open("numbers.txt");
out << "a = " << 20 << endl;
out.close();
```

File'ın ilk satırında kayıt sayısı varsa: önce `in >> total;`, sonra `for (int i = 0; i < total; i++) { in >> name >> score; }`.

 {id:"C2",topic:"fonk",prompt:"(Örnek midterm IV-2, 30 puan) <code>factorial(int n)</code> loop ile (recursion yok), <code>permutation(int n, int r)</code> = factorial(n) / factorial(n - r). <code>main</code> n ve r okuyup function'ı çağırsın ve sonucu yazsın.",en:"Write a C++ program that asks the user to enter values for n and r, calculates the permutation using the formula above, and displays the result. Your program is required to include: 1. A function named factorial that calculates and returns the factorial of a given integer using a loop (do not use recursion). 2. A function named permutation that calculates permutations using the formula P(n, r) = factorial(n) / factorial(n - r). 3. A main() function that reads the values of n and r, calls the required function, and prints the result.",sol:String.raw`#include <iostream>
using namespace std;

int factorial(int n);
int permutation(int n, int r);

int main() {
    int n, r;
    cout << "Enter n and r: ";
    cin >> n >> r;
    cout << "P(" << n << "," << r << ") = " << permutation(n, r) << endl;

int factorial(int n) {
    int result = 1;
    for (int i = 1; i <= n; i++) {
        result *= i;
    }
    return result;
}

    return factorial(n) / factorial(n - r);
}`,tip:"Test: n=5, r=2 → 20. result 1 ile başlatılır, 0 ile değil."},

 {id:"C7",topic:"dongu",prompt:"Önce sola dayalı, sonra sağa dayalı ters üçgen çizen <code>void triangles(int n)</code> function'ı (nested loop). n = 3:<pre>*\n**\n***\n***\n **\n  *</pre>",sol:String.raw`void triangles(int n) {

const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(s){return String(s).replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+/g," ").trim()).filter(l=>l.length).join("\n")}
function loose(s){return norm(s).replace(/ /g,"")}
function toast(t){const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),2300);}
function codeBlock(c){return c?`<pre><code class="language-cpp">${esc(c)}</code></pre>`:""}
function hl(root){if(window.hljs)root.querySelectorAll("pre code:not(.hljs)").forEach(e=>{if(!/language-/.test(e.className))e.classList.add("language-cpp");try{hljs.highlightElement(e)}catch(_){}})}
function status(id){const a=S.ans[id]; if(a&&typeof a.ok==="boolean"&&!(a.v===""||a.v===-1)) return a.ok?"ok":"bad"; if(S.self[id]!==undefined) return S.self[id]?"ok":"bad"; if(a&&typeof a.ok==="boolean") return a.ok?"ok":"bad"; return null;}
function applyTheme(){
  const r=document.documentElement; if(S.theme) r.dataset.theme=S.theme;
  const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  $("#hlLight").disabled=dark; $("#hlDark").disabled=!dark;
}

function qCard(x){
  const st=status(x.id), open=S.open[x.id], hOpen=S.open["h"+x.id];
  const txtKey=(x.kind==="code"||x.kind==="bug");
  const scVal=txtKey?(S.txt[x.id]||""):(S.scratch[x.id]||"");
  const scOpen=S.open["sc"+x.id]!==undefined?S.open["sc"+x.id]:(txtKey&&!!scVal);
  let body="";
  if(x.kind==="out"){ body=(x.prompt?`<div class="prompt">${x.prompt}</div>`:`<div class="prompt">Çıktı nedir?</div>`)+codeBlock(x.code)+
     `<textarea class="out" id="in-${x.id}" data-in="${x.id}" aria-label="${x.id} cevabın" placeholder="Çıktıyı yaz (her satır ayrı satıra)" spellcheck="false">${esc(S.inputs[x.id]!==undefined?S.inputs[x.id]:((S.ans[x.id]&&typeof S.ans[x.id].v==="string")?S.ans[x.id].v:""))}</textarea>`; }
  else if(x.kind==="choice"){ const sel=S.ans[x.id]?S.ans[x.id].v:null;
     body=(x.prompt?`<div class="prompt">${x.prompt}</div>`:`<div class="prompt">Çıktı nedir?</div>`)+codeBlock(x.code)+
     `<div class="choices" role="radiogroup" aria-label="${x.id} şıkları">${x.choices.map((c,i)=>`<label><input type="radio" name="r-${x.id}" value="${i}"${sel===i?" checked":""}> <span>${esc(c)}</span></label>`).join("")}</div>`; }
  else if(x.kind==="bug"){ body=(x.prompt?`<div class="prompt">${x.prompt}</div>`:`<div class="prompt">Hatalı satırları bul ve düzelt.</div>`)+codeBlock(x.code); }
  else { body=`<div class="prompt">${x.prompt}</div>`+(x.en?`<div class="prompt-en"><b>Sınavdaki yazılışı:</b> <span lang="en">${esc(x.en)}</span></div>`:""); }
  let sol="";
  if(x.kind==="out") sol=`<p><b>Cevap:</b></p><pre>${esc(x.ans)}</pre><p>${x.why}</p>`;
  else if(x.kind==="choice") sol=`<p><b>Cevap:</b> <span class="ans">${esc(x.choices[x.correct])}</span></p><p>${x.why}</p>`;
  else if(x.kind==="bug") sol=`<p>${x.sol}</p>`;
  else sol=codeBlock(x.sol)+`<p class="small">${x.tip}</p>`;
  const auto=(x.kind==="out"||x.kind==="choice");
  return `<article class="q" id="q-${x.id}" data-id="${x.id}">
   <header><span class="qid">${esc(x.id)}</span><span class="chip">${TOPICS[x.topic]}</span><span class="qsrc">${esc(x.src)}</span>

   ${body}
   <div class="actions">
     ${auto?`<button class="btn" data-check="${x.id}" type="button">Kontrol et</button><span class="fb" id="fb-${x.id}" aria-live="polite"></span>`:""}
     ${x.h?`<button class="btn ghost" data-hint="${x.id}" type="button" aria-expanded="${!!hOpen}">💡 İpucu</button>`:""}
     <button class="btn soft" data-reveal="${x.id}" type="button" aria-expanded="${!!open}">${open?"Çözümü gizle":"Çözümü göster"}</button>
     <button class="btn ghost" data-scratch="${x.id}" type="button" aria-expanded="${!!scOpen}">✏️ Karalama</button>
   </div>
   ${x.h?`<div class="hint" id="h-${x.id}" ${hOpen?"":"hidden"}><b>İpucu:</b> ${esc(x.h)}</div>`:""}
   <div class="scratch-box" id="sc-${x.id}" ${scOpen?"":"hidden"}>
     <div class="small muted"><b>Karalama</b> · ${x.kind==="code"?"sol kutuya kodunu yaz (kaydedilir), sağa çiz":x.kind==="bug"?"hatalı satırları ve düzeltmeyi yaz (kaydedilir), sağa çiz":"izleme tablonu yaz (kaydedilir), sağa çiz"}</div>
     <div class="scratch-grid${x.kind==="code"?" code":""}">
       <textarea class="scratch-Area" data-scinput="${x.id}" data-sckind="${txtKey?"txt":"scratch"}" aria-label="${x.id} karalama" spellcheck="false" placeholder="${x.kind==="code"?"int main() {\n    ...\n}":x.kind==="bug"?"Satır 5: ; eksik ...":"i | j | çıktı"}">${esc(scVal)}</textarea>
       <div class="scratch-canvas-wrap">
         <canvas class="scratch-canvas" id="canv-${x.id}" width="420" height="${x.kind==="code"?220:130}" aria-label="Çizim alanı"></canvas>

function setView(k){
  const set=SETS[k]; let qs=set.qs;
  const ok=qs.filter(x=>status(x.id)==="ok").length, bad=qs.filter(x=>status(x.id)==="bad").length;
  let h=`<section class="sheet"><h2>${set.title}</h2><p class="muted">${set.intro}</p>
   <p class="small">Bu setteki durumun: <b style="color:var(--green)">${ok} doğru</b> · <b style="color:var(--red)">${bad} yanlış</b> · <b>${qs.length-ok-bad} çözülmemiş</b></p>`;
  if(k==="cikti"){
    const counts={}; qs.forEach(x=>counts[x.topic]=(counts[x.topic]||0)+1);
    const filters=[["all",`Tümü (${qs.length})`],...Object.keys(TOPICS).filter(t=>counts[t]).map(t=>[t,`${TOPICS[t]} (${counts[t]})`]),["bad",`✗ Yanlışlarım (${bad})`],["todo",`⏳ Çözülmemiş (${qs.length-ok-bad})`]];
    if(!filters.some(f=>f[0]===S.filter)) S.filter="all";
    h+=`<div class="filter-bar" role="group" aria-label="Filtre">${filters.map(([fk,fl])=>`<button type="button" class="filter-btn ${S.filter===fk?"active":""}" aria-pressed="${S.filter===fk}" data-filter="${fk}">${fl}</button>`).join("")}</div>`;
    if(S.filter==="bad") qs=qs.filter(x=>status(x.id)==="bad");
    else if(S.filter==="todo") qs=qs.filter(x=>!status(x.id));
    else if(S.filter!=="all") qs=qs.filter(x=>x.topic===S.filter);
  }
  if(set.time) h+=timerHTML(k,set.time);
  h+=`<div class="actions"><button class="btn ghost" data-resetset="${k}" type="button">Bu setin işaretlerini sıfırla</button><button class="btn ghost" data-expandall="${k}" type="button">Tüm çözümleri aç/kapat</button></div>`;
  h+=qs.length?qs.map(qCard).join(""):`<p class="muted" style="padding:20px 0">Bu filtrede soru yok.</p>`;
  return h+`</section>`;
}

}
function tState(k){ if(!S.timers[k]) S.timers[k]={left:SETS[k].time*60,run:false,at:0}; return S.timers[k]; }
function tLeft(k){ const t=tState(k); return t.run?t.left-(Date.now()-t.at)/1000:t.left; }
let pomo={left:25*60,run:false,at:0};
function pomoLeft(){ return pomo.run?pomo.left-(Date.now()-pomo.at)/1000:pomo.left; }

function stats(){
  const r={}; for(const t in TOPICS) r[t]={ok:0,bad:0,tot:0};
  for(const id in ALLQ){const x=ALLQ[id], s=status(id); r[x.topic].tot++; if(s==="ok") r[x.topic].ok++; if(s==="bad") r[x.topic].bad++;}
  return r;
}

     <td class="small">${OZETREF[t]}</td><td>${hasOut?`<button type="button" class="btn soft" data-go="cikti:${t}" style="padding:2px 8px;font-size:.76rem">Soruları aç</button>`:""}</td></tr>`;}
  h+=`</table></div><p class="small"><b>Zayıf konular:</b> ${weakList.length?weakList.map(esc).join(", "):"henüz yok"}</p>
   <div class="actions"><button class="btn" id="copyBtn" type="button">📋 İlerleme özetini kopyala</button><button class="btn ghost" id="resetAll" type="button">Tümünü sıfırla</button></div></section>`;

function summaryText(){
  const r=stats(), lines=["CS103 İlerleme Raporu:"];
  for(const t in TOPICS){const s=r[t]; if(s.tot) lines.push(`- ${TOPICS[t]}: ${s.ok} doğru, ${s.bad} yanlış, ${s.tot-s.ok-s.bad} boş`);}

/* ---------- KARALAMA TUVALİ ---------- */
function initScratchCanvases(){
  document.querySelectorAll(".scratch-canvas").forEach(canv=>{
    if(canv.dataset.bound) return; canv.dataset.bound="1";
    const ctx=canv.getContext("2d"); let drawing=false;
    const pos=e=>{const r=canv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return [(p.clientX-r.left)*(canv.width/r.width),(p.clientY-r.top)*(canv.height/r.height)];};
    const start=e=>{drawing=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault();};
    const move=e=>{if(!drawing) return; const [x,y]=pos(e); ctx.strokeStyle="#3b82f6"; ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineTo(x,y); ctx.stroke(); e.preventDefault();};
    const stop=()=>{drawing=false;};
    canv.addEventListener("mousedown",start); canv.addEventListener("mousemove",move); window.addEventListener("mouseup",stop);
    canv.addEventListener("touchstart",start,{passive:false}); canv.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",stop);
  });
}

function mark(id,v){
  S.self[id]=(v==="ok"); if(S.ans[id]) S.ans[id].ok=(v==="ok"); save();
  const c=document.getElementById("q-"+id);
  if(c){const st=c.querySelector(".st"); st.className="st "+v; st.textContent=v==="ok"?"✓ Doğru":"✗ Yanlış";}
  header();
}
function check(id){
  const x=ALLQ[id], fb=document.getElementById("fb-"+id), c=document.getElementById("q-"+id); let v,ok;
  if(x.kind==="choice"){const r=c.querySelector("input:checked"); if(!r){fb.className="fb bad"; fb.textContent="Bir şık seç."; return} v=+r.value; ok=v===x.correct;}
  else{v=c.querySelector("textarea.out").value; if(!v.trim()){fb.className="fb bad"; fb.textContent="Önce cevabını yaz."; return} ok=norm(v)===norm(x.ans)||loose(v)===loose(x.ans);}
  S.ans[id]={v,ok}; delete S.self[id]; save();
  fb.className="fb "+(ok?"ok":"bad"); fb.textContent=ok?"Doğru!":"Yanlış. İpucuna ya da çözüme bak.";
  const st=c.querySelector(".st"); st.className="st "+(ok?"ok":"bad"); st.textContent=ok?"✓ Doğru":"✗ Yanlış";
  header();
}

/* Arama: İngilizce terimler eski Türkçe kelimeyle de bulunsun */
const TR_ALIAS=[["integer division","int bölme tam sayı bölmesi"],["type cast","tip dönüştürme casting"],["data type","tip tipler"],["nested loop","iç içe döngü"],["infinite loop","sonsuz döngü"],["loop","döngü"],["function","fonksiyon"],["declaration","bildirim"],["declare","bildirim"],["definition","tanım"],["scope","kapsam"],["variable","değişken"],["assignment","atama"],["condition","koşul"],["parameter","parametre"],["argument","argüman"],["return","dönüş döndürme"],["compile error","derleme hatası"],["logic error","mantık hatası"],["file","dosya"],["overload","aşırı yükleme"],["reference","referans"],["remainder","kalan"],["precedence","öncelik"],["increment","artırma"],["decrement","azaltma"],["comparison","karşılaştırma"],["recursion","özyineleme"],["output","çıktı"],["input","girdi"],["iteration","tur"],["initializ","başlatma"],["constant","sabit"],["predefined","hazır fonksiyon"],["branching","karar"],["indentation","girinti"]];
function trAlias(t){const l=t.toLowerCase(); return t+" "+TR_ALIAS.filter(([e])=>l.includes(e)).map(a=>a[1]).join(" ");}
let lastFocus=null;
$("#searchModal").addEventListener("click",e=>{ if(e.target.id==="searchModal") closeSearch(); });

  const q=qs.trim().toLocaleLowerCase("tr"), box=$("#searchModalResults");
  const list=searchIndex().filter(x=>!q||x.text.toLocaleLowerCase("tr").includes(q)).slice(0,24);
  box.innerHTML=list.map(x=>`<button type="button" class="modal-item" data-stype="${x.type}" data-sid="${x.id}"><span><b>${esc(x.title)}</b><span class="small muted" style="display:block">${esc(x.sub)}</span></span><span class="chip">${esc(x.chip)}</span></button>`).join("")||`<div class="small muted" style="padding:12px">Sonuç bulunamadı.</div>`;
  box.querySelectorAll(".modal-item").forEach(b=>b.addEventListener("click",()=>{
    $("#searchModal").hidden=true; const ty=b.dataset.stype, id=b.dataset.sid;
    if(ty==="q"){ jumpQ(id); return; }
    go("konu");
    setTimeout(()=>{ if(ty==="fc") flash(document.getElementById("fc-"+id)); else { const d=document.getElementById("oz-"+id); if(d){d.open=true; flash(d);} } },80);
  }));
}

applyTheme();

const h0=location.hash.slice(1); if(TABS.some(([k])=>k===h0)) S.tab=h0;
if(!TABS.some(([k])=>k===S.tab)) S.tab="plan";
if(location.hash.slice(1)!==S.tab) history.replaceState(null,"","#"+S.tab);
countdown(); setInterval(countdown,30000);
render();
window.addEventListener("load",()=>{OZET_SECTIONS=null; render();});
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1); if(TABS.some(([t])=>t===k)&&k!==S.tab) go(k);});
</script>
