<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELIT100 Midterm Stüdyosu · Academic Writing and Effective Communication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f6fb; --paper-2:#ffffff; --paper-3:#eef2fa; --grid:rgba(35,70,168,.055);
  --ink:#111827; --ink-2:#4b5563; --ink-3:#6b7280;
  --blue:#1d4ed8; --blue-soft:#dbeafe; --blue-border:#93c5fd;
  --red:#dc2626; --red-soft:#fee2e2;
  --green:#15803d; --green-soft:#dcfce7;
  --amber:#b45309; --amber-soft:#fef3c7;
  --purple:#6d28d9; --purple-soft:#ede9fe;
  --line:#d5dce8; --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px -12px rgba(29,78,216,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b0f19; --paper-2:#131a2a; --paper-3:#1c2539; --grid:rgba(96,165,250,.05);
  --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
  --blue:#60a5fa; --blue-soft:#1e293b; --blue-border:#2563eb;
  --red:#f87171; --red-soft:#3b181c;
  --green:#4ade80; --green-soft:#143022;
  --amber:#fbbf24; --amber-soft:#362812;
  --purple:#c084fc; --purple-soft:#2b1c44;
  --line:#263147; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0b0f19; --paper-2:#131a2a; --paper-3:#1c2539; --grid:rgba(96,165,250,.05);
  --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
  --blue:#60a5fa; --blue-soft:#1e293b; --blue-border:#2563eb;
  --red:#f87171; --red-soft:#3b181c;
  --green:#4ade80; --green-soft:#143022;
  --amber:#fbbf24; --amber-soft:#362812;
  --purple:#c084fc; --purple-soft:#2b1c44;
  --line:#263147; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.58 "IBM Plex Sans",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Sticky Top Command HUD */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 18px 0}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font:800 1.38rem/1.1 "Outfit",system-ui,sans-serif;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand h1 span.badge-course{background:var(--blue);color:#fff;font-size:.75rem;padding:3px 8px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase}
.brand h1 span.sub{color:var(--red);font-weight:700}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count{font:500 .82rem "IBM Plex Mono",monospace;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);padding:4px 10px;border-radius:7px}
.count b{color:var(--ink)}
.pomo-pill{display:flex;align-items:center;gap:6px;background:var(--paper-2);border:1px solid var(--line);padding:3px 9px;border-radius:7px;font:600 .8rem "IBM Plex Mono",monospace}
.pomo-pill button{border:none;background:var(--blue-soft);color:var(--blue);border-radius:4px;padding:2px 6px;font-size:.74rem;font-weight:600}
.search-trigger{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);border-radius:7px;padding:4px 10px;font-size:.8rem;display:flex;align-items:center;gap:6px}
.search-trigger kbd{font:500 .72rem "IBM Plex Mono",monospace;background:var(--paper-3);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.theme{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);border-radius:7px;padding:4px 10px;font-size:.8rem;font-weight:500}

.bar-wrap{display:flex;align-items:center;gap:12px;margin-top:8px}
.bar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.bar i.g{display:block;height:100%;background:var(--green);width:0;transition:width .35s}
.bar i.r{display:block;height:100%;background:var(--red);width:0;transition:width .35s}
.barlbl{font:500 .76rem "IBM Plex Mono",monospace;color:var(--ink-2);white-space:nowrap}

nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:1px solid transparent;border-bottom:none;background:none;color:var(--ink-2);padding:8px 13px;border-radius:9px 9px 0 0;white-space:nowrap;font-weight:600;font-size:.9rem;transition:all .15s}
nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--paper-2) 50%,transparent)}
nav button[aria-selected="true"]{background:var(--paper-2);color:var(--blue);border-color:var(--line);box-shadow:0 1px 0 var(--paper-2)}

main{max-width:1120px;margin:0 auto;padding:20px 18px 90px}
.sheet{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px 22px 34px;position:relative;margin-bottom:18px}
.sheet::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2.5px;background:var(--blue);opacity:.3}
h2{font:700 1.38rem/1.22 "Outfit",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
h3{font:700 1.1rem/1.3 "Outfit",system-ui,sans-serif;margin:18px 0 8px}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:.77rem;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.chip.purple{background:var(--purple-soft);color:var(--purple)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}

/* Filter bar for Zbirka & Question sets */
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;padding:10px;background:var(--paper-3);border-radius:10px;border:1px solid var(--line)}
.filter-btn{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);padding:5px 11px;border-radius:7px;font-size:.82rem;font-weight:600;transition:all .15s}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Question Card */
.q{border-top:1px dashed var(--line);padding:18px 0 14px}
.q:first-of-type{border-top:none}
.q header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qid{font:600 .8rem "IBM Plex Mono",monospace;background:var(--ink);color:var(--paper-2);padding:2px 8px;border-radius:5px}
.qsrc{font:500 .75rem "IBM Plex Mono",monospace;color:var(--ink-2);background:var(--paper-3);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
.st{margin-left:auto;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px}
.st.ok{background:var(--green-soft);color:var(--green)}
.st.bad{background:var(--red-soft);color:var(--red)}
.prompt{font-size:1.05rem;overflow-x:auto;overflow-y:hidden;padding:4px 0 8px}
.prompt .katex-display,.sol .katex-display{overflow:visible;margin:.25em 0}

/* Input Fields */
.fields{display:grid;gap:8px;margin-top:8px}
.field{display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr);gap:4px 10px;align-items:center}
.field label{font-size:.88rem;color:var(--ink-2);font-weight:500}
.field .inwrap{display:flex;gap:8px;align-items:center;min-width:0}
input[type=text],input[type=number],select,textarea{font:500 .95rem "IBM Plex Mono",monospace;padding:7px 10px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);min-width:0}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--blue);outline:none}
.field input[type=text]{width:100%;max-width:350px}
.field input.val{max-width:180px}
.mk{font-weight:700;min-width:1.2em}
.mk.ok{color:var(--green)} .mk.bad{color:var(--red)}
.pv{grid-column:2;font-size:.92rem;color:var(--ink-2);overflow-x:auto;overflow-y:hidden;padding:2px 0 4px}
.pv:empty,.ferr:empty{display:none}
.ferr{grid-column:2;font-size:.82rem;color:var(--red)}
.syntax{font-size:.82rem;color:var(--ink-2);background:var(--paper-3);padding:8px 12px;border-radius:8px;border:1px solid var(--line)}

/* Buttons */
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper-2);padding:6px 13px;border-radius:7px;font-weight:600;font-size:.88rem;transition:all .15s}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.btn.purple{background:var(--purple-soft);color:var(--purple);border-color:transparent}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{background:var(--red);border-color:var(--red);color:#fff}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.fb{font-weight:600;font-size:.9rem}
.fb.ok{color:var(--green)} .fb.bad{color:var(--red)}

/* Solution, Hint, Scratchpad */
.sol,.hint,.scratch-box{margin-top:10px;padding:13px 15px;border-radius:9px;overflow-x:auto}
.sol{background:var(--blue-soft);border-left:3.5px solid var(--blue)}
.hint{background:var(--amber-soft);border-left:3.5px solid var(--amber)}
.scratch-box{background:var(--paper-3);border:1px solid var(--line)}
.sol p,.hint p{margin:.35em 0}
.ans{font-weight:700;color:var(--blue)}
.self{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.scratch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.scratch-Area{width:100%;height:130px;resize:vertical;font-size:.86rem}
.scratch-canvas-wrap{border:1px solid var(--line);border-radius:7px;background:var(--paper-2);position:relative;height:130px;overflow:hidden}
.scratch-canvas{width:100%;height:100%;cursor:crosshair;touch-action:none;display:block}
@media (max-width:680px){.scratch-grid{grid-template-columns:1fr}.field{grid-template-columns:1fr}.pv,.ferr{grid-column:1}}

/* Visual Calculus Lab (Atölye) */
.lab-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,1fr);gap:16px;margin-top:12px}
@media (max-width:860px){.lab-grid{grid-template-columns:1fr}}
.canvas-card{background:var(--paper-3);border:1px solid var(--line);border-radius:10px;padding:12px}
#calcCanvas{width:100%;height:380px;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;display:block;cursor:crosshair}
.lab-controls{display:flex;flex-direction:column;gap:10px}
.ctrl-box{background:var(--paper-3);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.ctrl-box label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.num-table{width:100%;font:500 .78rem "IBM Plex Mono",monospace;border-collapse:collapse}
.num-table th,.num-table td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.num-table th:first-child,.num-table td:first-child{text-align:left}

/* Step-by-Step Definition of Derivative Trainer */
.step-card{border:1px solid var(--line);background:var(--paper-3);border-radius:9px;padding:12px 14px;margin-bottom:9px}
.step-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.92rem}
.step-body{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

/* Flashcards */
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:12px}
.fc-card{background:var(--paper-3);border:1.5px solid var(--line);border-radius:10px;padding:15px;min-height:155px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s,border-color .15s}
.fc-card:hover{transform:translateY(-2px);border-color:var(--blue)}
.fc-card.flipped{background:var(--blue-soft);border-color:var(--blue)}
.fc-card.mastered{opacity:.65;border-color:var(--green)}
.fc-top{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.fc-main{margin:12px 0;font-size:.98rem;font-weight:500}
.fc-foot{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--ink-2)}

/* Tables, Plan, Details */
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.tblwrap{overflow-x:auto}
.plan li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px dashed var(--line)}
.plan ul{padding:0;margin:0}
.plan input{margin-top:4px;width:18px;height:18px;accent-color:var(--blue)}
.plan .time{font:600 .82rem "IBM Plex Mono",monospace;color:var(--ink-2);min-width:100px}
.plan li.done .what{text-decoration:line-through;color:var(--ink-2)}
.timer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1.5px solid var(--blue);border-radius:9px;margin:10px 0;background:var(--paper-3)}
.timer .clock{font:600 1.55rem "IBM Plex Mono",monospace;min-width:92px;color:var(--blue)}
.timer.over .clock{color:var(--red)}
details{border-top:1px dashed var(--line);padding:11px 0}
summary{cursor:pointer;font:700 1.04rem "Outfit",system-ui,sans-serif}
details[open] summary{margin-bottom:8px;color:var(--blue)}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);min-width:120px}
.meter .g{background:var(--green)} .meter .r{background:var(--red)}
.weak{color:var(--red);font-weight:700}

/* Quick Search Modal (Ctrl+K) */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,15,28,.65);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 20px}
.modal-backdrop[hidden]{display:none}
.modal-box{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;width:100%;max-width:620px;box-shadow:var(--shadow);overflow:hidden}
.modal-box input{width:100%;border:none;border-bottom:1px solid var(--line);padding:14px 16px;font-size:1rem;border-radius:0;background:var(--paper-2)}
.modal-results{max-height:380px;overflow-y:auto;padding:8px}
.modal-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;gap:10px}
.modal-item:hover{background:var(--blue-soft)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:10px 18px;border-radius:8px;font-size:.9rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
/* ---------- ELIT100 eklemeleri (aynı değişkenler) ---------- */
.hud-back{font:600 .78rem "IBM Plex Mono",monospace;color:var(--ink-2);border:1px solid var(--line);background:var(--paper-2);padding:3px 8px;border-radius:7px}
.hud-back:hover{color:var(--blue);text-decoration:none}
.q{scroll-margin-top:170px}
.st.mid{background:var(--amber-soft);color:var(--amber)}
.opts{display:grid;gap:6px;margin-top:6px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default;opacity:1}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);text-decoration:line-through;text-decoration-color:var(--red)}
ol.sel{margin:6px 0 0;padding-left:24px}
ol.sel li{padding:7px 0;border-bottom:1px dotted var(--line)}
ol.sel .stem{display:block;margin-bottom:5px}
ol.sel select{font-family:"IBM Plex Sans",system-ui,sans-serif;min-width:130px}
ol.sel select:disabled{opacity:1}
textarea.answer{width:100%;margin-top:8px;font:400 .97rem/1.6 "IBM Plex Sans",system-ui,sans-serif;resize:vertical}
.wc{font:500 .78rem "IBM Plex Mono",monospace;color:var(--ink-2)}
.wc.off{color:var(--red)}
.note{font-size:.86rem;color:var(--ink-2);background:var(--paper-3);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px}
.lbl{font:600 .74rem "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin:.2em 0 .35em!important}
.sol ol,.sol ul{margin:.3em 0;padding-left:22px}
.flash{outline:2.5px solid var(--blue);outline-offset:4px;border-radius:8px}
.plan .day-today{border-left:4px solid var(--amber)}
.plan .daynote{font:500 .8rem "IBM Plex Mono",monospace;color:var(--ink-2);margin-left:6px}
.plan .what{flex:1}
details.konu{border-top:1px dashed var(--line)}
details.konu:first-of-type{border-top:none}
details.konu blockquote{margin:10px 0;padding:8px 14px;border-left:3.5px solid var(--purple);background:var(--purple-soft);border-radius:0 8px 8px 0}
details.konu blockquote p{margin:.3em 0}
details.konu h3{font-size:1rem;margin:14px 0 6px}
details.konu table{margin:8px 0}
code{font:500 .86em "IBM Plex Mono",monospace;background:var(--paper-3);border:1px solid var(--line);padding:0 5px;border-radius:4px}
pre{background:var(--paper-3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.85rem}
pre code{background:none;border:none;padding:0}
.fc-card:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.fc-main ul{margin:.3em 0;padding-left:18px}
.timerpill{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;gap:7px;align-items:center;background:var(--ink);color:var(--paper-2);border-radius:999px;padding:5px 7px 5px 14px;box-shadow:var(--shadow)}
.timerpill[hidden]{display:none}
.timerpill .pclock{font:600 1rem "IBM Plex Mono",monospace;min-width:56px}
.timerpill.over .pclock{color:var(--red)}
.timerpill button{border:none;background:color-mix(in srgb,var(--paper-2) 20%,transparent);color:inherit;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.modal-item{width:100%;border:none;background:none;color:var(--ink);text-align:left;font:inherit}
.modal-item:focus-visible{background:var(--blue-soft);outline-offset:-2px}
.part-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 4px;padding-top:14px;border-top:2px solid var(--line)}
.part-h:first-of-type{border-top:none;margin-top:10px}
.part-h h3{margin:0}
.chk-out{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--paper);line-height:1.8;white-space:pre-wrap;word-wrap:break-word}
.chk-out mark{border-radius:4px;padding:0 2px;color:inherit}
.m-per{background:var(--red-soft);box-shadow:inset 0 -2px 0 var(--red)}
.m-emo{background:var(--amber-soft);box-shadow:inset 0 -2px 0 var(--amber)}
.m-phr{background:var(--purple-soft);box-shadow:inset 0 -2px 0 var(--purple)}
.m-reg{background:var(--blue-soft);box-shadow:inset 0 -2px 0 var(--blue)}
.m-tr{background:var(--green-soft);box-shadow:inset 0 -2px 0 var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem;margin-top:8px}
.legend mark{padding:1px 6px;border-radius:4px;color:var(--ink)}
.findings{margin:10px 0 0;padding-left:20px;font-size:.92rem}
.findings li{margin:3px 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media (max-width:560px){
  .top-in{padding:8px 12px 0} main{padding:14px 10px 90px}
  .sheet{padding:16px 14px 16px 24px}.sheet::before{left:11px}
  .brand h1{font-size:1.15rem}
  .hud-right{margin-left:0;gap:6px;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .hud-right::-webkit-scrollbar{display:none}
  .hud-right>*{flex:none}
  .q{scroll-margin-top:150px}

<script>

const OZET = [{"title": "1. Note-taking", "html": "<p>Kaynak: <code>WEEK 1/Essential academic skills NOTETAKING.pptx<\/code>, <code>Week 1 additional.pptx<\/code>.<\/p>\n<p><strong>Ne zaman:<\/strong> lecture'da ve araştırmada. Primary research = survey, interview, observation. Secondary research = library, Internet sources.<\/p>\n<p><strong>Note-taking neden önemli:<\/strong> understanding, memory, exam revision, writing için kullanılabilir kayıt.<\/p>\n<p><strong>İpuçları (slayt 3):<\/strong><\/p>\n<ul><li>Her kaynak için author, title, publication information yaz.<\/li><li>Sadece ilgili olanı seç. Amaç hızlı yazmak değil, neyin yazmaya değer olduğunu seçmek.<\/li><li>Signpost expressions'ı tanı (hocanın konu açma, geçiş, örnek, tanım ve vurgu ifadeleri): <em>first of all, for example, in contrast, the important thing here, to sum up<\/em>.<\/li><li>Non-verbal signs'a (sözsüz vurgu işaretleri) dikkat: gestures, intonation, volume.<\/li><li>Symbols ve abbreviations (kısaltmalar) kullan.<\/li><li>Kendi stilini geliştir: linear, outline, mind map, Cornell.<\/li><\/ul>\n<p><strong>Note-taking'in üç parçası:<\/strong> active listening, identifying key ideas, reviewing notes afterwards.<\/p>\n<p><strong>Symbols (ezberle):<\/strong><\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Symbol<\/th><th>Anlam<\/th><\/tr><\/thead><tbody><tr><td>→<\/td><td>leads to, causes<\/td><\/tr><tr><td>=<\/td><td>equals, is<\/td><\/tr><tr><td>≠<\/td><td>is different from<\/td><\/tr><tr><td>↑ / ↓<\/td><td>increase / decrease<\/td><\/tr><tr><td>∵<\/td><td>because<\/td><\/tr><tr><td>∴<\/td><td>therefore<\/td><\/tr><tr><td>e.g.<\/td><td>for example<\/td><\/tr><tr><td>*<\/td><td>important<\/td><\/tr><tr><td>?<\/td><td>question<\/td><\/tr><tr><td>w/, w/out<\/td><td>with, without<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Örnek dönüşüm:<\/strong> \"Students who don't get enough sleep tend to have difficulty concentrating.\" → <code>insufficient sleep → ↓ concentration<\/code><\/p>\n<p><strong>İyi not / kötü not (slayt 5):<\/strong> Student A her şeyi alt alta düz yazmış (\"sleep is important, students need sleep...\"). Student B başlık koymuş, symbol kullanmış, main idea'yı ve bir soruyu ayırmış. İki hafta sonra işe yarayan B'nin notu: düzenli, ilişkileri gösteriyor, main idea belli.<\/p>\n<p><strong>Note-taking stilleri:<\/strong><\/p>\n<ul><li><strong>Outline:<\/strong> başlık, alt başlık, girintili hiyerarşi (I, A, 1...). Avantaj: ilişkiyi ve içeriği gösterir, düzenli. Dezavantaj: derste dikkat ister, hızlı derste zor, sıralı ilişkiyi her zaman göstermez.<\/li><li><strong>Cornell:<\/strong> sayfa üçe bölünür: sağda notes column, solda cue column (keywords ve sorular), altta summary.<\/li><li><strong>Mind map:<\/strong> ortada main idea, dallar halinde alt fikirler; resim ve renk kullanılır.<\/li><li><strong>Linear:<\/strong> düz satırlar halinde.<\/li><\/ul>\n<p><strong>Julian Treasure notu (sınavda video ya da metin özetlenebilir):<\/strong><\/p>\n<ul><li>Seven deadly sins of speaking: gossip, judging, negativity, complaining, excuses, exaggeration (lying), dogmatism (confusing facts with opinions).<\/li><li>HAIL: Honesty, Authenticity, Integrity, Love.<\/li><li>Ses araçları: register (göğüsten konuş), timbre, prosody (monoton olma), pace, silence, pitch, volume.<\/li><\/ul>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> symbol tablosu; signpost expressions; Cornell'in üç bölümü; \"select what is relevant, don't write faster\".<\/p><\/blockquote>"}, {"title": "2. Subjective vs. objective language", "html": "<p>Kaynak: <code>WEEK 2/Objective vs Subjective Language.pptx<\/code>, <code>Week 2 (1) Subjective and objective style.pptx<\/code>.<\/p>\n<p><strong>Objective language özellikleri:<\/strong> formal; fair and accurate; avoids exaggeration and bias; relies on facts rather than opinions; plain, without unnecessary flourishes; no personal, judgmental or emotive language.<\/p>\n<h3>Fact vs. opinion<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>Fact<\/th><th>Opinion<\/th><\/tr><\/thead><tbody><tr><td>Gözlenebilir, ölçülebilir, sayıyla gösterilebilir<\/td><td>Birinin fikri, judgment'ı<\/td><\/tr><tr><td>Genel olabilir (proof ister) ya da özel<\/td><td>Adjective / adverb içerir (<em>bad, easy, serious<\/em>)<\/td><\/tr><tr><td>Kabul edilmek zorunda<\/td><td>Comparative / superlative içerir (<em>more than, better, the most<\/em>)<\/td><\/tr><tr><td><\/td><td>Tartışılabilir<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Sınıflandırma alıştırmasındaki üç etiket (slayt 6-8):<\/strong><\/p>\n<ul><li><strong>O<\/strong> = Opinion. Örnek: <em>Punishment for identity thieves is not severe enough.<\/em><\/li><li><strong>F-NP<\/strong> = Fact that Needs Proof (general fact, proof ister). Örnek: <em>Identity theft is increasing at a rapid pace.<\/em><\/li><li><strong>SSD<\/strong> = Specific Supporting Detail (sayı, tarih, kaynak, quotation). Örnek: <em>In 2003, 60 percent of identity theft victims did not notify the police, according to the FTC.<\/em><\/li><\/ul>\n<p>Kural: opinion evidence olarak kullanılamaz. Opinion bildirebilirsin ama onu fact ile desteklemelisin.<\/p>\n<h3>Kaçınılacak üç dil türü<\/h3>\n<ol><li><strong>Personal language<\/strong> (I, me, my, we).<ul><li><em>I believe that there is a discrepancy...<\/em> → <em>Research suggests that there is a discrepancy...<\/em><\/li><li><em>I interviewed a total of 22 parents...<\/em> → <em>A total of 22 parents were interviewed...<\/em><\/li><\/ul><\/li><li><strong>Judgmental language<\/strong> (kendi inancına göre hüküm verir).<ul><li><em>Jessen's (1956) theory is the most influential...<\/em> → <em>...remains one of the most influential...<\/em><\/li><li><em>International schools are always elitist.<\/em> → <em>International schools are often viewed as elitist.<\/em><\/li><li><em>Smith's paper made such a remarkable contribution<\/em> → <em>made a major contribution<\/em><\/li><\/ul><\/li><li><strong>Emotive language<\/strong> (superlative, exaggeration, duygu uyandırma).<ul><li><em>Japanese orthography is too difficult to be well-understood<\/em> → <em>is not generally well-understood<\/em><\/li><li><em>an incredibly vivacious school market<\/em> → <em>an active and dynamic school market<\/em><\/li><li><em>These really lucky people<\/em> → <em>These people<\/em><\/li><\/ul><\/li><\/ol>\n<p>Australian immunisation paragrafında işaretlenen subjective unsurlar: personal language (<em>our, we<\/em>), judgment (<em>Of course, Obviously, Clearly<\/em>), assumption, emotive (<em>ghastly, precious, fragile<\/em>), exaggeration (<em>countless, all our children<\/em>), drama, exclamation marks (!!), capitalisation (TODAY).<\/p>\n<h3>Objective yazma teknikleri<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>Teknik<\/th><th>Örnek<\/th><\/tr><\/thead><tbody><tr><td>Evaluative words yerine technical evaluation<\/td><td><em>amazing, badly<\/em> yerine <em>valid, reliable, inaccurate<\/em><\/td><\/tr><tr><td>Passive voice<\/td><td><em>I gathered the data...<\/em> → <em>The data was gathered...<\/em>; <em>I believe...<\/em> → <em>It is believed that...<\/em><\/td><\/tr><tr><td>Moving information around<\/td><td><em>I believe the model is valid, based on these findings.<\/em> → <em>These findings indicate that the model is valid.<\/em><\/td><\/tr><tr><td>Phrasal verb, idiom yerine tek kelime<\/td><td>talk into → persuade; carry out → conduct; find out → discover; look into → investigate; rule out → eliminate; tell fibs → lie<\/td><\/tr><tr><td>\"It / There / One\" özne<\/td><td><em>It is very difficult to...<\/em>, <em>There is a serious risk of...<\/em>, <em>One may ask whether...<\/em><\/td><\/tr><tr><td>Hedging: adverb<\/td><td><em>Driving at night is somewhat dangerous.<\/em> (a little, slightly, relatively, probably, often)<\/td><\/tr><tr><td>Hedging: modal<\/td><td><em>there could be accidents<\/em> (can, could, may, might, should)<\/td><\/tr><tr><td>Hedging: quantifier<\/td><td><em>a good number of people<\/em> (many, most, several, some, the majority of)<\/td><\/tr><tr><td>Hedging: conditional<\/td><td><em>...dangerous if you don't pay attention to the road.<\/em><\/td><\/tr><tr><td>Tentative verbs<\/td><td><em>appears to, seems to, possibly, probably<\/em><\/td><\/tr><tr><td>always / every yerine<\/td><td><em>often, many, much<\/em><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>I yerine kullanılacak kalıplar:<\/strong> <em>The literature suggests that... / The results indicate that... / According to the figures... / It is evident that... / The research suggests that...<\/em><\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> üç kaçınılacak tür (personal, judgmental, emotive); O / F-NP / SSD; dört hedging aracı (adverb, modal, quantifier, conditional); yedi phrasal verb karşılığı.<\/p><\/blockquote>"}, {"title": "3. Paragraph", "html": "<p>Kaynak: <code>WEEK 3/Paragraph construction.pptx<\/code>, <code>A strong paragraph.pptx<\/code>. Quiz 1 bu konudandı (yazma, 30 dakika).<\/p>\n<h3>Yapı<\/h3>\n<p>Bir paragraf = <strong>topic sentence + supporting sentences + concluding sentence.<\/strong><\/p>\n<p><strong>Topic sentence<\/strong> iki parçalı: <strong>topic<\/strong> (konu) + <strong>controlling idea / direction<\/strong> (konu hakkında yorum).<\/p>\n<ul><li><em>Doing housework<\/em> (topic) + <em>can be very boring<\/em> (direction).<\/li><li><em>Living in a dormitory<\/em> + <em>can be challenging because of too many strict rules.<\/em><\/li><\/ul>\n<p>Topic sentence:<\/p>\n<ul><li><strong>Simple fact olamaz<\/strong> (geliştirilemez). <em>Susan paid $3.95 for her new blouse.<\/em> (F) → <em>Susan loves to shop for bargains.<\/em> (TS)<\/li><li><strong>Çok geniş olamaz<\/strong> (B, too broad). <em>The causes of war are many.<\/em> / <em>Politics affect the lives of many people.<\/em> / <em>The Internet has made the world a better place.<\/em><\/li><li>Genel ama tek yöne odaklı olmalı. <em>The birds are enjoyable to watch.<\/em> (TS)<\/li><\/ul>\n<p><strong>Supporting sentences:<\/strong> topic sentence'ı açıklar, örnek, detay, evidence verir.<\/p>\n<p><strong>Concluding sentence:<\/strong><\/p>\n<ul><li>Main idea'yı hatırlatır, güçlü bir izlenim bırakır.<\/li><li>Topic sentence'ı aynen tekrar etmez.<\/li><li><em>In conclusion<\/em> ya da <em>As you can see<\/em> ile başlamaz.<\/li><li>Yeni fikir getirmez.<\/li><\/ul>\n<h3>Güçlü paragrafın dört özelliği<\/h3>\n<ol><li><strong>Completeness:<\/strong> yeterli detay ve örnek var. Detaysız paragraf \"incomplete / undeveloped\" olur. (Dancing paragrafının ilk hali eksik, ikinci hali tam.)<\/li><li><strong>Logical order:<\/strong> cümleler mantıklı sırada. Türleri: zaman sırası (kar yağdı → sabah temizlendi), mekân sırası (odayı soldan sağa anlatma), önem sırası.<\/li><li><strong>Unity:<\/strong> her cümle topic sentence'a bağlı. Bağlı olmayan cümle (U) unity'yi bozar. Örnek: deniz kaplumbağası sayan bilim insanları paragrafında <em>\"The leatherback is the only kind of turtle that can live in the cold North Atlantic Ocean\"<\/em> cümlesi.<\/li><li><strong>Coherence:<\/strong> cümleler birbirine bağlı, liste gibi okunmaz. Üç teknik:<ul><li>Repetition of key words (ölçülü).<\/li><li>Repetition of sentence structures (Pamuk: <em>I write because... I write because...<\/em>).<\/li><li><strong>Transition signals.<\/strong><\/li><\/ul><\/li><\/ol>\n<h3>Transition signals (ezberle)<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>İşlev<\/th><th>Kelimeler<\/th><\/tr><\/thead><tbody><tr><td>Addition<\/td><td>and, moreover, besides, what's more, additionally, in addition, furthermore, also<\/td><\/tr><tr><td>Contrast / concession<\/td><td>but, however, although, even though, in spite of, despite, in contrast, conversely, on the other hand, instead, while, whereas, nevertheless, yet, still<\/td><\/tr><tr><td>Comparison<\/td><td>likewise, similarly, in the same way, as ... as, compared to<\/td><\/tr><tr><td>Cause<\/td><td>because (of), since, for<\/td><\/tr><tr><td>Effect<\/td><td>so, as a result, consequently, therefore, thus<\/td><\/tr><tr><td>Purpose<\/td><td>so that, in order to<\/td><\/tr><tr><td>Example<\/td><td>for example, for instance, to illustrate, in particular, such as<\/td><\/tr><tr><td>Clarification<\/td><td>in other words, (to put it) more simply<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Dikkat: <em>despite / in spite of / because of / such as<\/em> + noun. <em>although / even though / because / since<\/em> + clause.<\/p>\n<h3>Paragraf yazma adımları (slayt 24-29)<\/h3>\n<ol><li>Konuyu brainstorming ile aç (university life → dormitory).<\/li><li>Bir direction seç (too many strict rules).<\/li><li>Direction hakkında fikir üret, en iyi 3-5'ini seç.<\/li><li>Topic sentence taslağı yaz.<\/li><li>Outline: TS, support ideas, concluding idea.<\/li><li>Paragrafı yaz.<\/li><\/ol>\n<h3>Hocanın geri bildirimde işaretlediği hatalar (slayt 28-31)<\/h3>\n<ul><li>Topic sentence ile içerik uyuşmuyor (?).<\/li><li>Explanation eksik (Expl.).<\/li><li>Repetition (Rep.).<\/li><li><em>you<\/em> ile okura doğrudan hitap, personal ve subjective language.<\/li><li>Çok kısa, undeveloped paragraf (Paragraf 4).<\/li><\/ul>\n<h3>Model paragraf<\/h3>\n<blockquote><p>Living in a university dormitory can be challenging because of its strict rules. First of all, residents are usually not allowed to stay out late, so students who have evening classes or part-time jobs often find it difficult to return on time. In addition, visitors from outside the campus are generally not permitted, which limits students' social lives. Lights must also be turned off at a certain time, even during exam periods when many students need to study at night. Furthermore, most dormitories have no kitchen, and as a result, residents cannot prepare their own meals. These regulations may help maintain order, but they appear to conflict with the idea that university is a time of independence.<\/p><\/blockquote>\n<p>Kontrol: TS (topic + direction), dört support, transition signals, <em>I<\/em> yok, hedging var (<em>usually, generally, may, appear to<\/em>), concluding sentence yeni fikir getirmiyor ve <em>In conclusion<\/em> ile başlamıyor.<\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> TS = topic + controlling idea; F / B / TS ayrımı; dört özellik (completeness, logical order, unity, coherence); coherence'ın üç tekniği; transition tablosu; concluding sentence'ın üç yasağı.<\/p><\/blockquote>"}, {"title": "4. Norms in academic communication (formal vs. informal register)", "html": "<p>Kaynak: <code>WEEK 4/Norms in academic communication.pptx<\/code>.<\/p>\n<p><strong>Formal English nerede:<\/strong> academic writing, resumes, applications, business reports, technical and scientific writing, cold communication (tanımadığın kişiye yazma), iş ile ilgili her şey.<\/p>\n<p><strong>Informal → formal dönüşüm kuralları:<\/strong><\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Informal<\/th><th>Formal<\/th><\/tr><\/thead><tbody><tr><td>Contractions (<em>I'm, won't, can't<\/em>)<\/td><td>Full forms (<em>I am, will not, cannot<\/em>)<\/td><\/tr><tr><td><em>u, r, 4, asap, thx<\/em><\/td><td>Full words<\/td><\/tr><tr><td><em>Hey, Hi<\/em><\/td><td><em>Dear Dr. Jones<\/em><\/td><\/tr><tr><td>Phrasal verb (<em>get in touch, find out<\/em>)<\/td><td>Tek kelime (<em>contact, discover<\/em>)<\/td><\/tr><tr><td><em>Thanks<\/em><\/td><td><em>Thank you<\/em><\/td><\/tr><tr><td><em>Sorry for...<\/em><\/td><td><em>I apologise for...<\/em><\/td><\/tr><tr><td><em>Because of...<\/em><\/td><td><em>Owing to... / Due to...<\/em><\/td><\/tr><tr><td><em>Can you tell us more about...?<\/em><\/td><td><em>We would be grateful if you could send us further information about...<\/em><\/td><\/tr><tr><td><em>Here are...<\/em><\/td><td><em>Please find enclosed / attached...<\/em><\/td><\/tr><tr><td><em>I've got some bad news.<\/em><\/td><td><em>We regret to inform you that...<\/em><\/td><\/tr><tr><td><em>I've got some good news.<\/em><\/td><td><em>We are pleased to inform you that...<\/em><\/td><\/tr><tr><td><em>What exactly do you need?<\/em><\/td><td><em>Please let us know your exact requirements.<\/em><\/td><\/tr><tr><td><em>If you need...<\/em><\/td><td><em>Should you require...<\/em><\/td><\/tr><tr><td><em>Just get in touch<\/em><\/td><td><em>Please do not hesitate to contact me<\/em><\/td><\/tr><tr><td><em>All the best<\/em><\/td><td><em>Kind regards / Yours sincerely<\/em><\/td><\/tr><tr><td><em>I got it 14 Sept.<\/em><\/td><td><em>received 14 September 2002<\/em><\/td><\/tr><tr><td><em>I've set a meeting... to talk about<\/em><\/td><td><em>A meeting has been scheduled... to discuss<\/em><\/td><\/tr><tr><td>Abbreviations: <em>inc., exp., G.M., re.<\/em><\/td><td>Full forms: <em>income, expenditure, General Manager, concerning<\/em><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Formal letter yapısı:<\/strong><\/p>\n<ul><li>Sağ üst: gönderenin adresi, tarih.<\/li><li>Sol: alıcının adı, title'ı, kurumu, adresi; varsa reference / subject line (<em>Re:<\/em>).<\/li><li>Salutation:<ul><li><em>Dear Sir/Madam<\/em> (adı bilmiyorsan) → <em>Yours faithfully<\/em><\/li><li><em>Dear Ms Howes<\/em> (adı biliyorsan) → <em>Yours sincerely<\/em><\/li><li><em>Dear Sirs<\/em> (şirkete yazarken)<\/li><li><em>Yours truly<\/em> Amerikan İngilizcesi.<\/li><\/ul><\/li><li>E-postada <em>Best regards / Best wishes<\/em> daha yaygın; <em>Yours sincerely / faithfully<\/em> mektupta.<\/li><li>Titles: <em>Mr<\/em> (erkek), <em>Mrs<\/em> (evli kadın), <em>Ms<\/em> (medeni durum belirtilmeden kadın). ABD'de nokta alır: <em>Ms. Howes<\/em>.<\/li><li>Tarih: İngiliz <em>6 May 2012<\/em>, Amerikan <em>May 6, 2012<\/em>.<\/li><li>Signature: imza, altına ad soyad ve görev.<\/li><li>Abbreviations: <em>encl.<\/em> (ekte belge var), <em>cc<\/em> (kopya gidenler), <em>p.p.<\/em> (başkası adına imza), <em>Re.<\/em> (regarding).<\/li><\/ul>\n<p><strong>To / Cc / Bcc:<\/strong> To = asıl alıcı. Cc = bilgilendirilecek kişiler, herkes görür. Bcc = gizli kopya, diğerleri görmez.<\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> Sir/Madam → faithfully, isim → sincerely; Mr / Mrs / Ms; informal-formal tablosundaki ilk 12 satır.<\/p><\/blockquote>"}, {"title": "5. Email writing (profesöre e-posta)", "html": "<p>Kaynak: <code>WEEK 4/Norms in academic communication.pptx<\/code> slayt 14-16, <code>email_writing_exercises.pptx<\/code>.<\/p>\n<h3>Hocanın 10 kuralı (slayt 16)<\/h3>\n<ol><li>Akademik hesabını kullan.<\/li><li>Açık bir subject line yaz.<\/li><li>Hocayı title ve soyadıyla selamla (<em>Dear Professor Hanes<\/em>).<\/li><li>Kim olduğunu hatırlat (ad, ders, section).<\/li><li>Konuya sadık kal, gereksiz detay yok.<\/li><li>Hocadan ne istediğini açıkça söyle.<\/li><li>Ton profesyonel: emoji yok, kişisel detay yok.<\/li><li>Rica kibar olsun.<\/li><li>Grammar, spelling, punctuation kontrolü.<\/li><li>Kibar bir closing ile bitir.<\/li><\/ol>\n<h3>Kalıplar<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>Bölüm<\/th><th>Formal<\/th><th>Informal<\/th><\/tr><\/thead><tbody><tr><td>Salutation<\/td><td>Dear Professor / Dr. + soyad; Dear Mr / Ms + soyad; Dear Sir/Madam<\/td><td>Hi Jags; Dear Jay<\/td><\/tr><tr><td>Opening<\/td><td>Thank you for your email of 14 May concerning...; In reply to your letter...; Following our phone conversation...<\/td><td>Thanks for your email...; Just a quick note to...<\/td><\/tr><tr><td>Purpose<\/td><td>I am writing to request / inform / confirm...; This email is to...<\/td><td>Just a quick note to...<\/td><\/tr><tr><td>Request<\/td><td>Could you please...?; Would you please...?; I would be grateful if you could...; Kindly send...<\/td><td>Can you...?<\/td><\/tr><tr><td>Bad news / apology<\/td><td>I am sorry to inform you...; Unfortunately...; I apologise for...<\/td><td>Sorry about...<\/td><\/tr><tr><td>Attachment<\/td><td>Please find attached...; I attach...; Please find enclosed... (mektup)<\/td><td>Here's...<\/td><\/tr><tr><td>Closing sentence<\/td><td>I look forward to hearing from you.; Please do not hesitate to contact me if you need any further information.<\/td><td>Hear from you soon.; Let me know if you need anything else.; Take care.<\/td><\/tr><tr><td>Sign-off<\/td><td>Yours sincerely / Yours faithfully / Kind regards / Best regards<\/td><td>Best wishes; See you soon; Take care<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Kötü ve iyi örnek (ders slaytı)<\/h3>\n<p>Kötü: <em>Dear Tony, I know the deadline 4 our first assignment was last week. But, you see, I had a problm. My kitchen tap was leaking... Really sorry for being late! ... Hope u can accept this excuse. Here's my paper. See you<\/em><\/p>\n<p>Hatalar: hocanın adı ile hitap (Tony), <em>4<\/em> ve <em>u<\/em>, spelling hatası (<em>problm<\/em>), gereksiz kişisel detay (musluk, tesisatçı), exclamation mark, <em>Here's<\/em>, <em>See you<\/em>, kim olduğu yazmıyor, subject line yok, ne istediği belli değil.<\/p>\n<p>İyi: <em>Dear Professor Hanes, I am Ali Razaq, ELIT100, Section 2. I am writing to request an extension... However, I had some urgent personal issues... I apologize for this tardiness... Please find attached my assignment. Best regards, Ali<\/em><\/p>\n<h3>E-posta iskeleti (sınavda bunu kullan)<\/h3>\n<pre><code>Subject: [Konu]: [Ders kodu], Section [X]\n\nDear Professor [Soyad],\n\nI am [Ad Soyad], a student in your [ELIT100], Section [X].\n\nI am writing to [inform you / request / ask] [konu]. [1-2 cümle gerekçe, gereksiz detay yok.]\n\n[Talep / ayrıntılar: 2-4 cümle. Hocanın ne yapmasını istediğini açık söyle.]\n\nI would be grateful if you could [talep]. Please find attached [belge], if relevant.\n\nThank you for your understanding. I look forward to hearing from you.\n\nKind regards,\n[Ad Soyad]\n[Öğrenci numarası]<\/code><\/pre>\n<p>Ders slaytındaki görev (Email Exercise 1): bir geziye gidiyorsun, derse gelemeyeceksin; hocaya nereye, neden, ne kadar süre, hangi yerleri ziyaret edeceğin ve bunun bölümünle ilgisi ile e-posta yaz. Model cevap <code>deneme-1-cevaplar.md<\/code> Part D'de.<\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> iskelet; 10 kural; <em>I am writing to... / I would be grateful if you could... / Please find attached... / I look forward to hearing from you.<\/em><\/p><\/blockquote>"}, {"title": "6. Summarising ve paraphrasing", "html": "<p>Kaynak: <code>WEEK 5/Essential academic skills SUMMARIZING PARAPHRASING.pptx<\/code>, <code>WEEK 5/articles for practice/<\/code>.<\/p>\n<h3>Summary<\/h3>\n<ul><li>Metnin main point'lerinin kısa hali (who, when, where, why, what, how).<\/li><li>Bir cümle ile bir paragraf arası.<\/li><\/ul>\n<p><strong>Yap:<\/strong><\/p>\n<ul><li>Önemli noktaları işaretle.<\/li><li>Yazarın soyadını etiket olarak kullan + reporting verb: <em>argue, claim, note, emphasise, point out, suggest, add<\/em> (\"Brown argues that...\").<\/li><li>Yazarın argümanını <strong>present simple<\/strong> ile anlat.<\/li><li>Kendi kelimelerinle yaz: synonyms ve structure değişikliği.<\/li><\/ul>\n<p><strong>Yapma:<\/strong><\/p>\n<ul><li>Gereksiz detay (Treasure summary'sinde annesinin 1 Ekim yorumu).<\/li><li>Kaynakta olmayan bilgi.<\/li><li>Kendi value judgment'ların.<\/li><\/ul>\n<p><strong>Summary iskeleti:<\/strong><\/p>\n<pre><code>In an article published on [site / dergi] in [yıl], [Yazar] [discusses / argues / explains] [main idea].\nAccording to [Soyad], [main point 1]. [Soyad] also points out that [main point 2].\nFurthermore, [main point 3]. [Soyad] concludes that [sonuç].<\/code><\/pre>\n<p><strong>Üç Treasure summary'sinin karşılaştırması (slayt 5-7):<\/strong> A kısa ama sadece liste, past ve present tense karışık. B gereksiz detay içeriyor (annesi) ve listeyi kopyalıyor. C en iyisi: kendi kelimeleri, reporting verbs (<em>elaborates on, argues<\/em>), açıklama, liste değil. Sınavda C gibi yaz.<\/p>\n<h3>Paraphrase<\/h3>\n<ul><li>Kaynaktaki bilgiyi <strong>kendi kelimelerinle<\/strong>, <strong>aynı uzunlukta<\/strong>, <strong>aynı fikirlerle<\/strong> yeniden yaz.<\/li><li>Sonuna kaynağı ekle: <em>(Snell, 2005)<\/em>.<\/li><li>Sadece synonym koymak = plagiarism. Teknikleri birleştir.<\/li><\/ul>\n<p><strong>Beş teknik:<\/strong><\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Teknik<\/th><th>Örnek<\/th><\/tr><\/thead><tbody><tr><td>Synonyms<\/td><td><em>declared → announced; poses a national security threat → could harm the nation's security<\/em><\/td><\/tr><tr><td>Word form değiştir<\/td><td><em>Medical professor → a professor of medicine; global changes → changes across the globe<\/em><\/td><\/tr><tr><td>Sentence structure (active/passive, birleştir, böl, conjunction değiştir)<\/td><td><em>Angier reported that malaria kills more than one million people annually.<\/em> → <em>Every year, more than one million people are killed by malaria (Angier, 2001).<\/em><\/td><\/tr><tr><td>Attribution signal değiştir<\/td><td><em>\"...,\" veterinarian Mark Walters declared<\/em> → <em>According to Mark Walters, a veterinarian...<\/em><\/td><\/tr><tr><td>Numbers and percentages değiştir<\/td><td><em>13% → less than 15 percent; 46 percent → almost half<\/em><\/td><\/tr><tr><td>(Plagiarism slaytından) kelimeyi genişlet / tanımla<\/td><td><em>know tax laws → know the general workings and effects of taxation laws<\/em><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Summary vs. paraphrase vs. quotation<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Uzunluk<\/th><th>Kelimeler<\/th><th>Kaynak<\/th><\/tr><\/thead><tbody><tr><td>Quotation<\/td><td>Orijinal kadar<\/td><td>Aynen, tırnak içinde<\/td><td>Gerekli, sayfa no ile<\/td><\/tr><tr><td>Paraphrase<\/td><td>Yaklaşık aynı<\/td><td>Kendi kelimelerin<\/td><td>Gerekli<\/td><\/tr><tr><td>Summary<\/td><td>Çok daha kısa, sadece main points<\/td><td>Kendi kelimelerin<\/td><td>Gerekli<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Örnek (Jordan, 1997):<\/p>\n<ul><li>Quotation: <em>Jordan (1997: 8) comments that 'study skills are not something acquired instinctively'.<\/em><\/li><li>Paraphrase: <em>As students do not obtain study skills automatically, it is very important to teach them these skills (Jordan, 1997).<\/em><\/li><li>Summary: <em>It is important to teach study skills to students (Jordan, 1997).<\/em><\/li><\/ul>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> summary do / don't; reporting verbs; present simple; beş paraphrase tekniği; \"sadece synonym = plagiarism\".<\/p><\/blockquote>"}, {"title": "7. Plagiarism ve APA", "html": "<p>Kaynak: <code>WEEK 6/Plagiarism APA.pptx<\/code>, <code>APA_7th_handout__14Oct21_.pdf<\/code>.<\/p>\n<h3>Tanım<\/h3>\n<p>Plagiarism: başkasının yaratıcı işini uygun kaynak göstermeden kendi özgün işin gibi sunmak (The University of Melbourne, 2005). Sadece kelimeleri değil fikirleri, argümanları, diyagram, grafik, resim, besteyi ve organizasyon yapısını da kapsar. Kısaca: intellectual dishonesty or theft.<\/p>\n<h3>Plagiarism türleri (slayt 4)<\/h3>\n<ul><li>Metin, fikir, sonuç, tablo, program, tasarım, resim ya da ses kopyalamak (ya da kopyalanmasına izin vermek).<\/li><li>Küçük değişikliklerle paraphrase edip anlamı, biçimi ve fikir sırasını korumak.<\/li><li>Başkalarının işlerinden parçaları birleştirip yeni bir bütün yapmak.<\/li><li>Aynı ödevi iki ayrı ders için iki kez teslim etmek (self-plagiarism).<\/li><li>Başkasıyla birlikte yapılmış işi bireysel iş gibi sunmak (collusion).<\/li><\/ul>\n<h3>Library metni: beş versiyon (slayt 5-10)<\/h3>\n<p>Orijinal: <em>The Internet has changed the appearance of libraries and how librarians work today. The library is no longer confined to the four walls of a building...<\/em> (Yong, 2001, p. 294)<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Versiyon<\/th><th>Ne yapılmış<\/th><th>Plagiarism mı?<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Kelimeler aynen kopyalanmış, kaynak yok<\/td><td>Evet<\/td><\/tr><tr><td>2<\/td><td>Aynı kopya + kaynak var ama tırnak yok<\/td><td>Evet<\/td><\/tr><tr><td>3<\/td><td>Cümlelerin yeri değiştirilmiş, kelimeler aynı, kaynak var<\/td><td>Evet<\/td><\/tr><tr><td>4<\/td><td>İyi paraphrase ama kaynak yok<\/td><td>Evet<\/td><\/tr><tr><td>5<\/td><td>İyi paraphrase + kaynak<\/td><td><strong>Hayır, doğru<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Quote, paraphrase, summary kuralları<\/h3>\n<ul><li><strong>Direct quotation:<\/strong> aynen kelimeler. Kısa quotation'da tırnak, uzun quotation'da (40+ kelime) girintili block quotation. Sadece kaynak yazmak yetmez, tırnak da gerekir.<\/li><li><strong>Paraphrase:<\/strong> kendi kelimelerin. Kaynak <strong>yine gerekli<\/strong>. Kısmi paraphrase (birkaç kelime değiştirmek) plagiarism. Orijinalden ayırt edici bir ifade tırnaksız kalırsa plagiarism.<\/li><li>İyi bir araştırma yazısı çoğunlukla senin yazından (paraphrase dahil) oluşur. Quotation sadece destek içindir.<\/li><\/ul>\n<h3>Motivation örnekleri (slayt 18-20), ezberle<\/h3>\n<p>Orijinal: <em>Motivation is such a key factor that it appears to be more important in learning than intelligence.<\/em> (Newble &amp; Cannon, 1989, p. 2)<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Örnek<\/th><th>Kabul?<\/th><th>Neden<\/th><\/tr><\/thead><tbody><tr><td>Aynen yazılmış, tırnak ve kaynak yok<\/td><td>Hayır<\/td><td>Tırnak ve kaynak eksik<\/td><\/tr><tr><td>Tırnak var, kaynak yok<\/td><td>Hayır<\/td><td>Kaynak eksik<\/td><\/tr><tr><td>\"...\" (Newble &amp; Cannon, 1989, p. 2)<\/td><td>Evet<\/td><td>Tırnak + kaynak<\/td><\/tr><tr><td>According to Newble and Cannon (1989, p. 2), \"...\"<\/td><td>Evet<\/td><td>Tırnak + kaynak<\/td><\/tr><tr><td>A key factor in learning is motivation, which appears to be more important than intelligence (Newble &amp; Cannon, 1989, p. 2).<\/td><td>Hayır<\/td><td>Orijinale çok yakın<\/td><\/tr><tr><td>Motivation may be more critical than intelligence in learning (Newble &amp; Cannon, 1989, p. 2).<\/td><td>Evet<\/td><td>Gerçek paraphrase + kaynak<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Kaynak gösterilmesi gerekmeyenler<\/h3>\n<ol><li>Kendi fikirlerin, argümanların, kendi araştırma sonuçların.<\/li><li><strong>Common knowledge<\/strong> (genel bilinen gerçekler): <em>World War I began in 1914 and ended in 1918.<\/em><\/li><li>Genel başvuru kaynaklarındaki bilgiler (ders kitabı, sözlük, ansiklopedi). Ama istatistik yine de verilmeli.<\/li><\/ol>\n<p>Dikkat: common knowledge <strong>sadece fact<\/strong>. Interpretation ve opinion kaynak ister.<\/p>\n<ul><li><em>J.S. Bach was a famous composer during the Baroque period.<\/em> → kaynak gerekmez.<\/li><li><em>J.S. Bach was the greatest composer of the Baroque period (Sterling, 1977).<\/em> → opinion, kaynak gerekir.<\/li><li>Kesin tarih, isim, yaş gibi özel detaylar kaynak ister (Lincoln, 14 April 1865, John Wilkes Booth).<\/li><li>Common knowledge'ı bile aynen kopyalarsan tırnak ve kaynak gerekir.<\/li><li>Emin değilsen kaynak göster.<\/li><\/ul>\n<p>Ayrıca kaynak gösterilecekler: tablo, grafik, resim; ders notları ve kişisel görüşmeden (personal communication) alınan fikirler.<\/p>\n<h3>Neden kaynak gösterilir<\/h3>\n<p>Başkasının sahipliğini tanımak; geniş araştırma yaptığını gösterip güvenilirlik kazanmak; okurun kaynağa ulaşmasını sağlamak; argümana evidence ve otorite eklemek; akademik değerleri korumak; plagiarism'den kaçınmak.<\/p>\n<h3>Referans yöntemleri ve stiller<\/h3>\n<ul><li><strong>In-text:<\/strong> (Cole, 2011, p. 45) → APA, MLA, Harvard.<\/li><li><strong>Numeric:<\/strong> (7) → Vancouver (tıp, fen).<\/li><li><strong>Footnote:<\/strong> ³ → Chicago (iş, tarih, sanat).<\/li><li>APA: eğitim, psikoloji, bilim. MLA: beşeri bilimler.<\/li><\/ul>\n<h3>APA 7 in-text citation (ezberle)<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>Yazar sayısı<\/th><th>Parenthetical<\/th><th>Narrative<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>(Frogmouth, 2020)<\/td><td>Frogmouth (2020)<\/td><\/tr><tr><td>2<\/td><td>(Frogmouth <strong>&amp;<\/strong> Spoonbill, 2020)<\/td><td>Frogmouth <strong>and<\/strong> Spoonbill (2020)<\/td><\/tr><tr><td>3+<\/td><td>(Frogmouth et al., 2020)<\/td><td>Frogmouth et al. (2020)<\/td><\/tr><tr><td>Kurum<\/td><td>(UNICEF, 2023)<\/td><td>UNICEF (2023)<\/td><\/tr><tr><td>Tarih yok<\/td><td>(Johnson, n.d.)<\/td><td>Johnson (n.d.)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Kurallar:<\/strong><\/p>\n<ul><li>Direct quote'ta sayfa no zorunlu: <em>(Frogmouth, 2020, p. 3)<\/em>, birden çok sayfa <em>pp. 7-8<\/em>.<\/li><li>Sayfa yoksa (web): <em>(Johnson, 2023, para. 4)<\/em>.<\/li><li>İki yazarda her seferinde iki soyadı da yazılır. Parenthetical citation'da <strong>&amp;<\/strong>, narrative citation'da <strong>and<\/strong>.<\/li><li>3+ yazarda <strong>first citation'dan itibaren<\/strong> <em>et al.<\/em> kullanılır. <em>et al.<\/em> = <em>et alia<\/em> = \"and others\". İtalik değil, <em>al.<\/em> sonunda nokta var. Reference list'te <em>et al.<\/em> kullanılmaz, tüm yazarlar yazılır.<\/li><li><strong>Block quotation (40+ kelime):<\/strong> tırnak yok; soldan 0.5 inch (1.27 cm) indentation (girinti); double spacing (çift satır aralığı); nokta quotation'ın sonunda, kaynaktan <strong>önce<\/strong>: <em>...in the classroom. (Haelermans, 2022, p. 243)<\/em><\/li><li>Kurum adı abbreviation'ı: ilk kullanımda <em>(Australian Institute of Health and Welfare [AIHW], 2020)<\/em>, sonra <em>(AIHW, 2020)<\/em>.<\/li><\/ul>\n<p><strong>Reference list (web içeriği):<\/strong> <em>Author, A. A. (Year, Month Day). Title in italics and sentence case. Site Name. URL<\/em> Örnek: <em>James, F. (2019, November 5). One mum's plea to the education system. Kidspot. https://tinyurl.com/vxa76lb<\/em><\/p>\n<p><strong>Narrative citation fiilleri:<\/strong> <em>According to X (2022), ... / X (2022) found / argues / points out / explains / suggests that ... / As X (2022) points out, ... / Research by X (2022) suggests that ...<\/em><\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> beş library versiyonu; motivation tablosu; &amp; ve and; et al. kuralları; p. / pp. / para.; block quote altı kuralı; common knowledge sadece fact.<\/p><\/blockquote>"}];
const TAGS = {note:"Note-taking", obj:"Objective / subjective", para:"Paragraph", reg:"Register & email", sum:"Summary / paraphrase", plag:"Plagiarism & APA"};
const OZET_TAG = ["note","obj","para","reg","reg","sum","plag"];

  {t:"mc", id:"t3", tag:"para", q:"<p><em>“Education is important for society.”</em> Topic sentence olarak:</p>", o:["F: simple fact","B: too broad","TS: iyi bir topic sentence"], a:1,

  {t:"mc", id:"t5", tag:"reg", q:"<p>Hocaya e-postada en uygun hali: <em>“Here's my homework, sorry it's late.”</em></p>", o:["Here is my homework, I am sorry it is late.","Please find attached my assignment. I apologise for the late submission.","Attached is my homework, sorry for the lateness!","I'm attaching my homework, so sorry!!"], a:1,
