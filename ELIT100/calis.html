 {id:"obj", tag:"obj", title:"Objective / subjective", items:[
  {t:"sel", id:"o1", q:"<p>Her cümleyi etiketle.</p>", ch:OFNS, items:[
    {s:"Smoking is a bad habit.", a:"O"},
    {s:"Cigarettes are addictive.", a:"F-NP"},
    {s:"In 2000, 31,000 cases of identity theft were reported to the FTC; in 2003, the number was 210,000.", a:"SSD"},
    {s:"Identity theft is more serious than any other type of theft.", a:"O"},
    {s:"Most victims of identity theft are young adults.", a:"F-NP"},
    {s:"The FTC reports that there were more victims in the age group 18-29 than in any other group.", a:"SSD"}],
   why:"O: judgment, comparison, adjective (<em>bad, more serious</em>). F-NP: general fact, proof ister. SSD: sayı, tarih, kurum adı."},
  {t:"mc", id:"o2", q:"<p>En objective cümle hangisi?</p>", o:["I believe the new policy is a total disaster.","The new policy is absolutely terrible for everyone!","The findings suggest that the new policy may have negative effects on some employees.","Obviously, the new policy failed."], a:2},
  {t:"mc", id:"o3", q:"<p><em>carry out</em> yerine akademik fiil:</p>", o:["do","conduct","make","finish"], a:1,
   why:"talk into → persuade · carry out → conduct · find out → discover · look into → investigate · rule out → eliminate"},
  {t:"mc", id:"o4", q:"<p><em>rule out</em> yerine:</p>", o:["eliminate","investigate","discover","persuade"], a:0},
  {t:"mc", id:"o5", q:"<p><em>“...a good number of people could have an accident.”</em> Altı çizili hedging aracı (<em>a good number of</em>) hangisi?</p>", o:["adverb","modal verb","quantifier","qualifying conditional"], a:2,
   why:"Dört hedging aracı: adverb (<em>somewhat, relatively</em>), modal (<em>could, may</em>), quantifier (<em>many, some, a good number of</em>), conditional (<em>if you don't pay attention...</em>)."},
  {t:"mc", id:"o6", q:"<p><em>“It is believed that students should not be required to do homework.”</em> Hangi teknik?</p>", o:["moving information around","passive voice","hedging with a quantifier","avoiding phrasal verbs"], a:1},
  {t:"mc", id:"o7", q:"<p>Hangisi objective language özelliği <strong>değildir</strong>?</p>", o:["Formal","Fair and accurate","Relies on facts rather than opinions","Uses superlatives to make the reader feel strongly"], a:3},
  {t:"mc", id:"o8", q:"<p><em>“Gorard's study provided an awesome classification model.”</em> En iyi düzeltme:</p>", o:["...provided an amazing classification model.","...provided a concise classification model.","...provided the best classification model ever.","I think Gorard's study provided a good model."], a:1,
   why:"Emotive / judgmental adjective yerine technical evaluation: <em>concise, valid, reliable</em>."}
 ]},
 {id:"para", tag:"para", title:"Paragraph", items:[
  {t:"sel", id:"p1", q:"<p>Her cümle F (simple fact), B (too broad) ya da TS (topic sentence)?</p>", ch:FBT, items:[
    {s:"The background music in the grocery store was annoying.", a:"TS"},
    {s:"In 2007, Daylight Savings Time started on March 11.", a:"F"},
    {s:"Politics affect the lives of many people.", a:"B"},
    {s:"Stephanie's room is a disaster.", a:"TS"},
    {s:"The Internet has made the world a better place.", a:"B"},
    {s:"In the United States, 350 obese children had weight-loss surgery in 2004.", a:"F"},
    {s:"Cross-country skiing provides great exercise.", a:"TS"},
    {s:"The 911 call came into the police department at 12:00 noon.", a:"F"},
    {s:"Throughout the world, family structures vary.", a:"B"},
    {s:"The Internet has changed Tina's social life.", a:"TS"}],
   why:"F: geliştirilemeyen tek bilgi. B: bir paragrafa sığmaz. TS: genel ama tek yöne odaklı (topic + controlling idea)."},
  {t:"sel", id:"p2", q:"<p>Her cümle TS, S ya da U?</p>", ch:TSU, items:[
    {s:"Mechanics enjoy looking through salvage yards to find engine parts.", a:"S"},
    {s:"Rebuilding an engine can be fun.", a:"TS"},
    {s:"Many new car models have elaborate computer systems.", a:"U"}]},
  {t:"sel", id:"p3", q:"<p>Her cümle TS, S ya da U?</p>", ch:TSU, items:[
    {s:"Injured birds are nurtured back to health.", a:"S"},
    {s:"Wildlife centers are dedicated to helping sick and injured animals.", a:"TS"},
    {s:"Wildlife centers are often privately funded.", a:"U"}]},
  {t:"mc", id:"p4", q:"<p>Bilim insanlarının leatherback kaplumbağalarını nasıl saydığını anlatan paragrafta unity'yi bozan cümle hangisi?</p>", o:["The observers work, no matter what the weather is like.","They count the turtles as they come ashore.","The leatherback is the only kind of turtle that can live in the cold North Atlantic Ocean.","Then, later, they count the eggs that hatch."], a:2,
   why:"Paragrafın konusu gözlemcilerin nasıl çalıştığı. Kaplumbağa türüyle ilgili bilgi bu fikri desteklemiyor: <strong>unity</strong> bozuluyor."},
  {t:"mc", id:"p5", q:"<p>Concluding sentence için hangisi <strong>yapılmamalı</strong>?</p>", o:["Main idea'yı hatırlatmak","Okurda güçlü bir izlenim bırakmak","Cümleye <em>In conclusion</em> ile başlamak","Topic sentence'ı farklı kelimelerle yansıtmak"], a:2,
   why:"Üç yasak: topic sentence'ı aynen tekrar etmek, <em>In conclusion / As you can see</em> ile başlamak, yeni fikir getirmek."},
  {t:"mc", id:"p6", q:"<p>Topic sentence'ın iki parçası:</p>", o:["Topic + controlling idea (direction)","Fact + example","Introduction + conclusion","Claim + citation"], a:0},
  {t:"mc", id:"p7", q:"<p>Pamuk'un <em>“I write because... I write because...”</em> örneği hangi coherence tekniği?</p>", o:["Repetition of key words","Repetition of sentence structures","Transition signals","Logical order"], a:1},
  {t:"mc", id:"p8", q:"<p>Detay ve örnek içermeyen, belirsiz kalan paragrafta hangi özellik eksik?</p>", o:["Unity","Coherence","Completeness","Logical order"], a:2},
  {t:"sel", id:"p9", q:"<p>Çocuk yetiştirme paragrafındaki boşluklar (slayt alıştırması). Her boşluğa uygun transition signal'ı seç.</p>", ch:["For instance","such as","Since","Furthermore","Despite","As a result","To illustrate","because","Besides","nevertheless"], items:[
    {s:"(1) ___, children often catch illnesses ...", a:"For instance"},
    {s:"(2) ... illnesses ___ the flu, cold, measles, etc.", a:"such as"},
    {s:"(3) ___ their immune system is not so strong, parents are often concerned ...", a:"Since"},
    {s:"(4) ___, raising children leaves parents very little time for themselves.", a:"Furthermore"},
    {s:"(5) ___ being rewarding, parenting is a round-the-clock job.", a:"Despite"},
    {s:"(6) ___, parents rarely have any time to go out on their own ...", a:"As a result"},
    {s:"(7) ___, children's clothes often cost a fortune ...", a:"To illustrate"},
    {s:"(8) ... have to be bought often ___ children grow out of them so quickly.", a:"because"},
    {s:"(9) ___, toys, books and other school supplies are costly ...", a:"Besides"},
    {s:"(10) ... a considerable challenge, which parents are ___ happy to take on.", a:"nevertheless"}]}
 ]},
 {id:"reg", tag:"reg", title:"Register & email", items:[
  {t:"mc", id:"r1", q:"<p><em>Dear Sir/Madam</em> ile başlayan mektup nasıl biter?</p>", o:["Yours sincerely","Yours faithfully","See you soon","Cheers"], a:1,
   why:"Adı bilmiyorsan <em>Dear Sir/Madam → Yours faithfully</em>. Adı biliyorsan <em>Dear Ms Howes → Yours sincerely</em>. E-postada <em>Kind / Best regards</em> yaygın."},
  {t:"mc", id:"r2", q:"<p><em>Ms</em> title'ı ne zaman kullanılır?</p>", o:["Sadece evli kadınlar için","Medeni durumu belirtmeden kadınlar için","Erkekler için","Profesörler için"], a:1},
  {t:"mc", id:"r3", q:"<p><strong>Bcc</strong> satırındaki kişiler:</p>", o:["Asıl alıcılardır","Kopya alır ve herkes onları görür","Kopya alır ama diğer alıcılar onları görmez","Cevap vermek zorundadır"], a:2},
  {t:"mc", id:"r4", q:"<p><em>“I've got some bad news.”</em> formal hali:</p>", o:["We regret to inform you that...","Sorry, bad news...","Unfortunately for you...","I've some bad news to tell."], a:0},
  {t:"mc", id:"r5", q:"<p><em>“If you need further details...”</em> en formal hali:</p>", o:["If you want more stuff...","Should you require further details...","Just ask if you need more...","In case you need details..."], a:1},
  {t:"mc", id:"r6", q:"<p>Hocaya e-postanın en uygun ilk satırları:</p>", o:["Hey Prof! Quick question...","Dear Tony,","Dear Professor Hanes, I am Ali Razaq, ELIT100, Section 2.","To whom it may concern, it's Ali."], a:2,
   why:"Title + soyad ile selamla, sonra kim olduğunu ve dersini söyle."},
  {t:"mc", id:"r7", q:"<p>Profesöre gecikme e-postasında hangisi olmamalı?</p>", o:["Açık bir subject line","Ne istediğini net söylemek","Mutfak musluğunun nasıl bozulduğunun detayları","Kibar bir closing"], a:2,
   why:"Kural: “Stick to the point, leave out any extraneous details.” Kötü örnekteki tesisatçı hikâyesi tam olarak bu."},
  {t:"mc", id:"r8", q:"<p><em>encl.</em> ne anlama gelir?</p>", o:["Mektupla birlikte belge gönderildi","Kopyası şu kişilere gitti","Başkası adına imzalandı","Konusu şudur"], a:0,
   why:"encl. = enclosed · cc = carbon copies · p.p. = başkası adına imza · Re. = regarding"},
  {t:"mc", id:"r9", q:"<p><em>“Because of the delay...”</em> formal karşılığı:</p>", o:["Owing to the delay...","Coz of the delay...","Cause the delay...","So the delay..."], a:0}
 ]},
 {id:"sum", tag:"sum", title:"Summary / paraphrase", items:[
  {t:"mc", id:"s1", q:"<p>Summary'de yazarın argümanı hangi tense ile anlatılır?</p>", o:["Past simple","Present simple","Present perfect continuous","Future"], a:1},
  {t:"mc", id:"s2", q:"<p>Summary'de hangisi <strong>olmamalı</strong>?</p>", o:["Yazarın soyadı ve reporting verb","Main points","Kendi value judgment'ların","Kendi kelimelerin"], a:2,
   why:"Don'ts: gereksiz detay, kaynakta olmayan bilgi, kendi value judgment'ların."},
  {t:"mc", id:"s3", q:"<p>Paraphrase uzunluğu:</p>", o:["Orijinalin yarısı","Orijinalle yaklaşık aynı","Tek cümle","Orijinalin iki katı"], a:1,
   why:"Paraphrase: aynı uzunluk, aynı fikirler, kendi kelimelerin. Summary: çok daha kısa, sadece main points."},
  {t:"mc", id:"s4", q:"<p>Sadece birkaç kelimeyi synonym'iyle değiştirip yapıyı korumak:</p>", o:["İyi bir paraphrase","Summary","Plagiarism","Direct quotation"], a:2},
  {t:"mc", id:"s5", q:"<p><em>13% → less than 15 percent; 46 percent → almost half</em>. Hangi teknik?</p>", o:["Synonyms","Change word form","Change attribution signals","Change numbers and percentages"], a:3},
  {t:"mc", id:"s6", q:"<p>Treasure konuşmasının üç summary'sinden (A, B, C) hangisi en iyisi ve neden?</p>", o:["A: en kısa olduğu için","B: annesiyle ilgili detayı da verdiği için","C: kendi kelimeleri, açıklama ve reporting verb kullandığı için","Hepsi eşit"], a:2,
   why:"A sadece liste. B gereksiz detay (annesinin yorumu) içeriyor. C main idea'ları açıklıyor, <em>argues, elaborates on</em> kullanıyor."},
  {t:"mc", id:"s7", q:"<p>Orijinal: <em>“Advocates of internet tracking believe that it may help marketers understand what people want.”</em> En iyi paraphrase:</p>", o:["Advocates of internet tracking think that it may help marketers understand what people want.","Supporters argue the case for internet tracking by saying that it may assist marketers in discovering customers' needs and wants.","Internet tracking definitely shows marketers everything people want.","Internet tracking is bad because marketers know too much."], a:1,
   why:"A: tek kelime değişmiş, plagiarism. C: anlamı değiştirmiş (<em>may → definitely</em>). D: kendi yorumun."},
  {t:"mc", id:"s8", q:"<p>Hangisi summary için uygun bir reporting verb?</p>", o:["says me","argues","is telling","told"], a:1,
   why:"argue, claim, note, emphasise, point out, suggest, add · present simple ile."}
 ]},
 {id:"plag", tag:"plag", title:"Plagiarism & APA", items:[
  {t:"mc", id:"x1", q:"<p>Library metninin beş versiyonundan hangisi kabul edilebilir?</p>", o:["Version 2: aynen kopya + kaynak","Version 3: cümlelerin yeri değişmiş + kaynak","Version 4: iyi paraphrase, kaynak yok","Version 5: iyi paraphrase + kaynak"], a:3},
  {t:"mc", id:"x2", q:"<p>Version 2 (kelimeler aynen + <em>(Yong, 2001: 294)</em>) neden plagiarism?</p>", o:["Kaynak yanlış biçimde","Aynen alınan kelimeler tırnak içinde değil","Çok kısa","Yıl eksik"], a:1},
  {t:"mc", id:"x3", q:"<p>İki yazarlı kaynak, parenthetical citation:</p>", o:["(Frogmouth and Spoonbill, 2020)","(Frogmouth & Spoonbill, 2020)","(Frogmouth et al., 2020)","(Frogmouth, Spoonbill 2020)"], a:1,
   why:"Parenthetical citation'da <strong>&amp;</strong>, narrative citation'da <strong>and</strong>: <em>Frogmouth and Spoonbill (2020) noted...</em>"},
  {t:"mc", id:"x4", q:"<p>Üç yazarlı bir kaynağın <strong>first citation</strong>'ı:</p>", o:["(Smith, Brown, & Lee, 2022)","(Smith et al., 2022)","(Smith and others, 2022)","(Smith, 2022)"], a:1,
   why:"APA 7: 3+ yazarda first citation'dan itibaren <em>et al.</em> Reference list'te ise tüm yazarlar yazılır."},
  {t:"mc", id:"x5", q:"<p>Block quotation kaç kelimeden itibaren?</p>", o:["20","30","40","100"], a:2,
   why:"40+ kelime: tırnak yok, 0.5 inch indentation, double spacing, nokta kaynaktan önce."},
  {t:"mc", id:"x6", q:"<p>Sayfa numarası olmayan bir web sayfasından direct quotation:</p>", o:["(Johnson, 2023, p. 4)","(Johnson, 2023, para. 4)","(Johnson, 2023)","(Johnson, para 4, 2023)"], a:1},
  {t:"mc", id:"x7", q:"<p><em>“J.S. Bach was the greatest composer of the Baroque period.”</em> Kaynak gerekir mi?</p>", o:["Hayır, common knowledge","Evet, çünkü bu bir opinion","Hayır, Bach ünlü","Sadece tırnak gerekir"], a:1,
   why:"Common knowledge sadece fact'leri kapsar. <em>“Bach was a famous Baroque composer”</em> kaynak istemez; <em>“the greatest”</em> opinion, ister."},
  {t:"mc", id:"x8", q:"<p>Hangi stil footnote kullanır?</p>", o:["APA","MLA","Chicago","Vancouver"], a:2,
   why:"APA, MLA, Harvard: in-text · Chicago: footnotes · Vancouver: numeric."},
  {t:"mc", id:"x9", q:"<p>Geçen dönem başka bir derse verdiğin ödevi tekrar teslim etmek:</p>", o:["Sorun değil, kendi işin","Plagiarism","Sadece kaynak göstermek gerekir","Paraphrase sayılır"], a:1},
  {t:"mc", id:"x10", q:"<p>Bu kullanım kabul edilir mi?</p><p><em>“Motivation may be more critical than intelligence in learning (Newble &amp; Cannon, 1989, p. 2).”</em></p>", o:["Kabul edilmez: tırnak yok","Kabul edilir: gerçek paraphrase ve kaynak var","Kabul edilmez: orijinale çok yakın","Kabul edilmez: sayfa olmamalı"], a:1}
 ]}
];

const DENEME = [
 {id:"A", title:"Part A: Note-taking", pts:10, items:[
  {t:"open", id:"a1", tag:"note", pts:4, label:"1", rows:5, en:"Rewrite each sentence as a short note. Use symbols and abbreviations.", q:"<p>Her cümleyi kısa bir not olarak yeniden yaz. Symbols ve abbreviations kullan.</p><p>a) Students who use their phones during lectures tend to remember less of the lecture content.<br>b) Because the library is closed on Sundays, students therefore study in cafés.<br>c) Online courses are different from face-to-face courses in terms of student motivation.<br>d) An important point: the number of international students has increased, for example in engineering departments.</p>",
   model:"<p>a) <code>phone use in lectures → ↓ memory of content</code><br>b) <code>library closed Sun. ∴ sts study in cafés</code><br>c) <code>online courses ≠ face-to-face (motivation)</code><br>d) <code>* no. of int'l sts ↑, e.g. engineering depts</code></p><p>Senin symbol'lerin farklı olabilir; kısa olması ve ilişkiyi göstermesi yeter.</p>"},
  {t:"open", id:"a2", tag:"note", pts:3, label:"2", rows:3, en:"Name the three sections of a page in the Cornell note-taking method and say what goes in each.", q:"<p>Cornell note-taking method'unda bir sayfanın üç bölümünü adlandır ve her bölüme ne yazıldığını söyle.</p>",
   model:"<p>Notes column (sağ, geniş): ders sırasındaki notlar. Cue column (sol): keywords ve sorular. Summary (alt): sayfanın kısa summary'si.</p>"},
  {t:"open", id:"a3", tag:"note", pts:3, label:"3", rows:4, en:"A classmate says: “…” Explain in 2-3 sentences why this is wrong.", q:"<p>Bir sınıf arkadaşın şöyle diyor: <em>“Good note-taking means writing as fast as possible so you don't miss anything.”</em> Bunun neden yanlış olduğunu 2-3 cümleyle açıkla.</p>",
   model:"<p><em>Note-taking is a skill that develops progressively, and its aim is not to write faster but to identify what is worth writing down. A good note-taker listens actively, selects only the key ideas that are relevant to the purpose, and reviews the notes afterwards. Signpost expressions such as “the important thing here” help to decide what to write.</em></p>"}
 ]},
 {id:"B", title:"Part B: Subjective vs. objective language", pts:20, items:[
  {t:"sel", id:"b4", tag:"obj", pts:6, label:"4", en:"Label each statement O, F-NP or SSD.", q:"<p>Her ifadeyi O, F-NP ya da SSD olarak etiketle. Sayılar bu alıştırma için uyduruldu.</p>", ch:OFNS, items:[
    {s:"University students spend too much time on social media.", a:"O"},
    {s:"Many students use social media during study time.", a:"F-NP"},
    {s:"In a 2024 survey of 1,200 students at one university, 64 percent reported checking social media at least once every hour while studying.", a:"SSD"},
    {s:"Social media is the worst distraction a student can have.", a:"O"},
    {s:"Students' sleep patterns are affected by late-night phone use.", a:"F-NP"},
    {s:"“Students who kept their phones in another room scored on average 11 points higher on the test,” the study's lead researcher reported.", a:"SSD"}],
   why:"a ve d judgment (<em>too much, the worst</em>). b ve e general fact, proof ister. c sayı ve tarih veriyor, f bir uzmandan quotation."},
  {t:"open", id:"b5", tag:"obj", pts:12, label:"5", rows:9, en:"Rewrite each sentence in objective academic style. Use a different technique each time and name it.", q:"<p>Her cümleyi objective academic style ile yeniden yaz. Her seferinde farklı bir teknik kullan ve tekniğin adını yaz.</p><p>a) I think that online exams are always unfair to students.<br>b) The researchers found out that sleep deprivation has a huge, terrible effect on memory.<br>c) We interviewed 40 teachers in March 2025.<br>d) Smith's (2020) amazing study proves that homework is useless.<br>e) Video games will make teenagers violent.<br>f) I believe the results are reliable, based on these data.</p>",
   model:"<p>a) <em>Online exams may be unfair to some students.</em> (no personal pronoun + hedging)<br>b) <em>The researchers discovered that sleep deprivation has a significant effect on memory.</em> (phrasal verb, emotive language)<br>c) <em>Forty teachers were interviewed in March 2025.</em> (passive voice)<br>d) <em>Smith's (2020) study suggests that homework may have limited benefits.</em> (judgmental language, hedging)<br>e) <em>Video games may increase aggressive behaviour in some teenagers.</em> (hedging: modal, quantifier)<br>f) <em>These data indicate that the results are reliable.</em> (moving information around)</p>",
   rub:"<p>Her madde 2 puan: 1 doğru yeniden yazım, 1 doğru teknik adı.</p>"},
  {t:"open", id:"b6", tag:"obj", pts:2, label:"6", rows:2, en:"Name two words or features that make this sentence subjective.", q:"<p>Bu cümleyi subjective yapan iki kelimeyi ya da özelliği yaz:</p><p><em>Obviously, ALL first-year students are completely lost in their incredibly difficult courses!!</em></p>",
   model:"<p>Herhangi ikisi: <em>Obviously</em> (judgment), <em>ALL</em> (capitalisation, exaggeration), <em>completely, incredibly</em> (emotive), <em>!!</em> (exclamation marks).</p>"}
 ]},
 {id:"C", title:"Part C: Paragraph", pts:25, items:[
  {t:"sel", id:"c7", tag:"para", pts:5, label:"7", en:"Simple fact (F), too broad (B) or good topic sentence (TS)?", q:"<p>Her cümle simple fact (F), too broad (B) ya da iyi bir topic sentence (TS)?</p>", ch:FBT, items:[
    {s:"The cafeteria opens at 7:30 a.m.", a:"F"},
    {s:"Technology has changed human history.", a:"B"},
    {s:"Living with a roommate requires a great deal of patience.", a:"TS"},
    {s:"Our professor gave us three assignments last week.", a:"F"},
    {s:"Part-time jobs can help university students develop useful skills.", a:"TS"}]},
  {t:"sel", id:"c8", tag:"para", pts:3, label:"8", en:"Topic sentence (TS), support (S) or unrelated (U)?", q:"<p>Her cümle topic sentence (TS), support (S) ya da unrelated (U)?</p>", ch:TSU, items:[
    {s:"Many students choose to study in the library.", a:"TS"},
    {s:"The library has comfortable chairs and large tables.", a:"S"},
    {s:"The library is quiet, so students can concentrate.", a:"S"},
    {s:"The university was founded in 2004.", a:"U"}]},
  {t:"mc", id:"c9", tag:"para", pts:3, label:"9", en:"Which sentence breaks the unity of this paragraph?", q:"<p>Bu paragrafın unity'sini bozan cümle hangisi?</p><p><em>Regular exercise brings several benefits for university students. Students who exercise regularly tend to sleep better, which helps them stay focused in class. Exercise is also a healthy way to reduce exam stress. Many universities in Europe were founded in the Middle Ages. In addition, team sports give students a chance to make new friends.</em></p>",
   o:["Students who exercise regularly tend to sleep better...","Exercise is also a healthy way to reduce exam stress.","Many universities in Europe were founded in the Middle Ages.","In addition, team sports give students a chance to make new friends."], a:2,
   why:"Bu cümle egzersizin öğrencilere faydasından bahsetmiyor; topic sentence'ı desteklemiyor."},
  {t:"sel", id:"c10", tag:"para", pts:3, label:"10", en:"Fill in the gaps. Use each signal once.", q:"<p>Boşlukları doldur. Her transition signal'ı bir kez kullan.</p><p><em>Studying abroad can be a valuable experience. (1) ___, students often improve their language skills (2) ___ they use a foreign language every day. (3) ___, they learn to live independently. Daily tasks (4) ___ cooking, paying bills and dealing with banks help them become more responsible. (5) ___, studying abroad is not easy for everyone. Some students feel homesick and, (6) ___, their grades may drop in the first semester.</em></p>",
   ch:["however","for example","as a result","in addition","because","such as"], items:[
    {s:"(1)", a:"for example"},{s:"(2)", a:"because"},{s:"(3)", a:"in addition"},{s:"(4)", a:"such as"},{s:"(5)", a:"however"},{s:"(6)", a:"as a result"}]},
  {t:"open", id:"c11", tag:"para", pts:11, label:"11", rows:12, words:[120,150], timer:20, en:"Write a paragraph of 120-150 words: The challenges of the first year at university. Include a topic sentence (topic + controlling idea), at least three supporting points, transition signals and a concluding sentence. Use objective language.", q:"<p><strong>120-150 kelimelik</strong> bir paragraf yaz: <strong>The challenges of the first year at university.</strong> Paragrafta bir topic sentence (topic + controlling idea), en az üç supporting point, transition signals ve bir concluding sentence olsun. Objective language kullan.</p>",
   model:"<p><em>The first year at university presents students with several challenges. First of all, many first-year students find it difficult to manage their time, as university courses require more independent study than high school. In addition, students who move to a new city often experience homesickness, which may affect their motivation and concentration. Financial responsibilities can also be demanding, since some students have to pay rent and bills for the first time. Furthermore, academic expectations are usually higher; for example, assignments must be written in a formal style and supported by reliable sources. As a result, a number of students receive lower grades in their first semester than they expected. Although these difficulties are common, they are generally temporary, and most students adapt once they develop effective study habits and support networks.</em></p>",
   rub:"<p>Topic sentence 2 · support ve completeness 3 · unity ve logical order 2 · coherence (transitions) 2 · objective language ve doğruluk 2. Paragrafı sohbete yapıştırırsan puanlayıp düzeltirim.</p>"}
 ]},
 {id:"D", title:"Part D: Formal register and email writing", pts:15, items:[
  {t:"open", id:"d12", tag:"reg", pts:5, label:"12", rows:6, en:"Rewrite in formal register.", q:"<p>Formal register ile yeniden yaz.</p><p>a) Thanks for your email.<br>b) Sorry I couldn't come to class.<br>c) Here's my essay.<br>d) Can you tell me when your office hours are?<br>e) Just let me know if you need anything else.</p>",
   model:"<p>a) <em>Thank you for your email.</em><br>b) <em>I apologise for not being able to attend class.</em><br>c) <em>Please find attached my essay.</em><br>d) <em>Could you please let me know your office hours?</em> / <em>I would be grateful if you could inform me of your office hours.</em><br>e) <em>Please do not hesitate to contact me should you require any further information.</em></p>"},
  {t:"sel", id:"d13", tag:"reg", pts:1, label:"13", en:"Complete the sign-offs.", q:"<p>Sign-off'ları tamamla.</p>", ch:["faithfully","sincerely","truly"], items:[
    {s:"Dear Sir/Madam → Yours ___", a:"faithfully"},{s:"Dear Ms Smith → Yours ___", a:"sincerely"}]},
  {t:"open", id:"d14", tag:"reg", pts:9, label:"14", rows:12, words:[100,130], timer:15, en:"Write an email to Professor Kovač (ELIT100, Section 3). You will miss next week's Tuesday and Thursday classes because you are travelling to a student conference in Vienna with the university's Engineering Club. Explain where, why, for how long, and how the trip relates to your studies. Ask how you can make up for the missed classes. 100-130 words, include a subject line.", q:"<p><strong>Professor Kovač</strong>'a (ELIT100, Section 3) bir e-posta yaz. Gelecek haftaki salı ve perşembe derslerini kaçıracaksın, çünkü üniversitenin Engineering Club'ı ile Viyana'daki bir öğrenci konferansına gidiyorsun. Nereye, neden ve ne kadar süreyle gittiğini, gezinin bölümünle ilgisini açıkla. Kaçırdığın dersleri nasıl telafi edebileceğini sor. <strong>100-130 kelime</strong>, subject line ekle.</p>",
   model:"<p><strong>Subject:</strong> Absence from classes on 24 and 26 November: ELIT100, Section 3</p><p>Dear Professor Kovač,</p><p>I am Kaan [Surname], a student in your ELIT100 course, Section 3.</p><p>I am writing to inform you that I will not be able to attend the classes on Tuesday and Thursday next week. I will be travelling to Vienna with the university's Engineering Club to attend a three-day international student conference on renewable energy. During the conference, I will take part in workshops and visit the Vienna University of Technology. This trip is closely related to my engineering programme, and I believe it will help me develop my academic communication skills.</p><p>I would be grateful if you could let me know how I can make up for the missed classes and whether there are any materials I should study.</p><p>Thank you for your understanding.</p><p>Kind regards,<br>Kaan [Surname]<br>Student ID: [number]</p>",
   rub:"<p>Subject line ve salutation 1 · kendini tanıtma 1 · net amaç ve talep 3 · formal register (contraction, slang yok) 2 · kibar closing 1 · doğruluk 1.</p>"}
 ]},
 {id:"E", title:"Part E: Summarising and paraphrasing", pts:15, items:[
  {t:"open", id:"e15", tag:"sum", pts:6, label:"15", rows:7, en:"Paraphrase each sentence. Change words and structure, keep the meaning, add the citation.", q:"<p>Her cümleyi paraphrase et. Kelimeleri ve yapıyı değiştir, anlamı koru, citation'ı ekle.</p><p>a) Researchers at the university discovered that students who take handwritten notes remember more information than students who type. (Patel, 2021)<br>b) Because rents in the city centre have risen sharply, many students now live in the suburbs. (Morris &amp; Lee, 2023)<br>c) About 25 percent of first-year students change their major before the end of their second year. (Huang et al., 2019)</p>",
   model:"<p>a) <em>Handwriting notes, rather than typing them, appears to help students retain more information (Patel, 2021).</em><br>b) <em>A steep increase in city-centre rents has led many students to move to the suburbs (Morris &amp; Lee, 2023).</em><br>c) <em>Roughly one in four first-year students switch to a different major before their second year ends (Huang et al., 2019).</em></p><p>Teknikler: a) synonym + sentence structure (özne değişti) · b) cause-effect yer değiştirdi · c) numbers and percentages (<em>25 percent → one in four</em>) + synonym.</p>"},
  {t:"open", id:"e16", tag:"sum", pts:9, label:"16", rows:9, words:[80,100], timer:20, article:true, en:"Read the article by Sara Chodosh (Popular Science, 2017) about sleeping in at the weekend. Write a summary of 80-100 words: author's name with reporting verbs, present simple, your own words, no opinion.", q:"<p>Sara Chodosh'un hafta sonu geç kalkmakla ilgili makalesini (<em>Popular Science</em>, 2017) oku. <strong>80-100 kelimelik</strong> bir summary yaz: yazarın adı ve reporting verbs, present simple, kendi kelimelerin, opinion yok.</p>",
   model:"<p><em>In an article published in Popular Science in 2017, Sara Chodosh questions headlines claiming that sleeping late at weekends causes heart disease. She explains that the study behind these claims found only a correlation: each hour by which people shift their weekend sleep schedule is linked to an 11 percent higher risk. Chodosh argues that other factors, such as heavy drinking, smoking or a poor diet, may explain this link. She points out that the real reason to keep a regular wake-up time is that irregular sleep makes people more tired, and she emphasises that an 11 percent increase is relatively small.</em></p>",
   rub:"<p>Main ideas 4 · kendi kelimelerin 2 · reporting verbs ve present simple 1 · gereksiz detay ve opinion yok 1 · uzunluk ve doğruluk 1.</p>"}
 ]},
 {id:"F", title:"Part F: Plagiarism and APA", pts:15, items:[
  {t:"sel", id:"f17", tag:"plag", pts:5, label:"17", en:"Is each case plagiarism?", q:"<p>Her durum plagiarism mi?</p>", ch:YN, items:[
    {s:"You copy two sentences from a website, put them in quotation marks, but do not name the source.", a:"Yes"},
    {s:"You change a few words in a paragraph from a book, keep the same sentence structure, and add (Brown, 2018).", a:"Yes"},
    {s:"You write “Water boils at 100 °C at sea level” without a citation.", a:"No"},
    {s:"You submit the same essay you wrote for another course last semester.", a:"Yes"},
    {s:"You rewrite an author's idea completely in your own words and add (Kaya, 2022).", a:"No"}],
   why:"a) tırnak tek başına yetmez, kaynak şart. b) kısmi paraphrase. c) common knowledge. d) aynı işi iki kez teslim. e) doğru paraphrase + kaynak."},
  {t:"mc", id:"f18a", tag:"plag", pts:1, label:"18a", q:"<p>Düzelt: <em>(Johnson and Smith, 2019)</em></p>", o:["(Johnson & Smith, 2019)","(Johnson, Smith, 2019)","Johnson and Smith (2019)","(Johnson et al., 2019)"], a:0, why:"Parenthetical citation'da &amp;. C de doğru bir biçim ama parenthetical citation'ın düzeltmesi değil."},
  {t:"mc", id:"f18b", tag:"plag", pts:1, label:"18b", q:"<p>Düzelt: <em>Brown &amp; Davis (2021) argue that...</em></p>", o:["Brown and Davis (2021) argue that...","Brown, Davis (2021) argue that...","(Brown & Davis) 2021 argue that...","Brown et al. (2021) argue that..."], a:0, why:"Narrative citation'da <strong>and</strong>."},
  {t:"mc", id:"f18c", tag:"plag", pts:1, label:"18c", en:"Correct the first citation of a three-author source.", q:"<p>Üç yazarlı bir kaynağın first citation'ını düzelt: <em>(Martin, Clark, Lewis, 2020)</em></p>", o:["(Martin, Clark, & Lewis, 2020)","(Martin et al., 2020)","(Martin et al. 2020)","(Martin and others, 2020)"], a:1},
  {t:"mc", id:"f18d", tag:"plag", pts:1, label:"18d", en:"Direct quotation from page 12.", q:"<p>Sayfa 12'den direct quotation; doğru biçim hangisi? <em>“Language shapes thought” (Wilson, 2018).</em></p>", o:["“Language shapes thought” (Wilson, 2018, p. 12).","“Language shapes thought” (Wilson, 2018, page 12).","“Language shapes thought” (Wilson, p. 12, 2018).","Language shapes thought (Wilson, 2018, p. 12)."], a:0},
  {t:"mc", id:"f18e", tag:"plag", pts:1, label:"18e", q:"<p>Düzelt: <em>(Unicef 2023)</em></p>", o:["(Unicef, 2023)","(UNICEF, 2023)","(UNICEF 2023)","UNICEF, (2023)"], a:1},
  {t:"open", id:"f19", tag:"plag", pts:5, label:"19", rows:6, en:"a) What does et al. stand for and mean? b) How many words does a quotation need to be a block quotation in APA 7? c) Give two rules for formatting a block quotation. d) A website has no publication date. How do you show this in an in-text citation? e) Is “…” common knowledge? Why?", q:"<p>a) <em>et al.</em> neyin açılımıdır ve ne anlama gelir?<br>b) APA 7'de bir quotation kaç kelimeden itibaren block quotation olur?<br>c) Block quotation biçimlendirmenin iki kuralını yaz.<br>d) Bir web sitesinde publication date yok. Bunu in-text citation'da nasıl gösterirsin?<br>e) <em>“Mozart was the most talented composer who ever lived”</em> common knowledge mı? Neden?</p>",
   model:"<p>a) <em>et alia</em>, “and others”; italik değil, <em>al.</em> noktalı.<br>b) 40 kelime ve üstü.<br>c) Tırnak yok; 0.5 inch (1.27 cm) indentation; double spacing; nokta quotation'ın sonunda, kaynaktan önce.<br>d) <em>(Johnson, n.d.)</em><br>e) Hayır: <em>the most talented</em> bir opinion, kaynak ister.</p>"}
 ]}
];

/* ---------- DURUM (anahtar ve biçim önceki sürümle aynı; yeni alanlar varsayılanlı) ---------- */
const KEY = "elit100-calis-v1";
let S = {plan:{}, ans:{}, res:{}, txt:{}, tab:"plan", theme:null, open:{}, scratch:{}, fc:{}, filter:"all", timers:{}, chk:""};
let storageOK = true;
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); localStorage.setItem(KEY + "-probe", "1"); localStorage.removeItem(KEY + "-probe"); }
catch (e) { storageOK = false; }
for (const k of ["plan","ans","res","txt","open","scratch","fc","timers"]) if (!S[k] || typeof S[k] !== "object") S[k] = {};
const OLD_TAB = {konular:"konu", zayif:"ilerleme"};
if (OLD_TAB[S.tab]) S.tab = OLD_TAB[S.tab];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- SORU KAYDI ---------- */
const ALLQ = {};
function reg(q, set, lbl, src){ q.pts = q.pts || (q.t === "sel" ? q.items.length : 1); q.set = set; q.lbl = lbl; q.src = src; ALLQ[q.id] = q; return q; }
const TANI = PRACTICE.find(g => g.id === "tani");
const PGROUPS = PRACTICE.filter(g => g.id !== "tani");
TANI.items.forEach((q, i) => reg(q, "tani", "T" + (i + 1), "Tanı"));
PGROUPS.forEach(g => g.items.forEach((q, i) => { q.tag = q.tag || g.tag; reg(q, "alistirma", q.id.toUpperCase(), "Alıştırma · " + g.title); }));
DENEME.forEach(p => p.items.forEach(q => reg(q, "deneme", "D" + q.label, "Deneme 1 · Part " + p.id)));
for (const id in S.res) { const x = ALLQ[id], r = S.res[id]; if (x && r && r.max && r.max !== x.pts) S.res[id] = {got: Math.round(r.got / r.max * x.pts * 10) / 10, max: x.pts}; }
const SETS = {
  tani:{qs:TANI.items},
  alistirma:{qs:PGROUPS.flatMap(g => g.items)},
  deneme:{qs:DENEME.flatMap(p => p.items), time:90}
};

/* ---------- YARDIMCILAR ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function plain(h){ return String(h).replace(/<[^>]+>/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/\s+/g, " ").trim(); }
function fmt(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function low(s){ return String(s).toLocaleLowerCase("tr"); }
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2300); }
function stOf(id){ const r = S.res[id]; if (!r) return null; return r.got >= r.max ? "ok" : r.got > 0 ? "mid" : "bad"; }
function stText(id){ const s = stOf(id), r = S.res[id]; return s === "ok" ? "✓ Doğru" : s === "bad" ? "✗ Yanlış" : s === "mid" ? `◐ ${fmt(r.got)}/${fmt(r.max)}` : ""; }
function hintOf(x){ return HINT[x.id] || (x.t === "sel" && SEL_HINT[x.ch.join(",")]) || TAG_HINT[x.tag]; }
function todayStr(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

/* ---------- SEKMELER ---------- */
const TABS = [
  ["plan","🧭 Plan & Kapsam"],
  ["konu","⚡ Konu & Ezber"],
  ["tani","🩺 Tanılama"],
  ["alistirma","🎯 Alıştırma"],
  ["deneme","📝 Deneme"],
  ["denetle","🔍 Metin Denetleyici"],
  ["ilerleme","📊 İlerleme & Hatalar"]
];
function badge(k){
  if (k === "konu") return ` <span class="muted small">${FLASHCARDS.filter(f => S.fc[f.id] === "ok").length}/${FLASHCARDS.length}</span>`;
  if (k === "plan") { const all = PLAN.flatMap(d => d.items); return ` <span class="muted small">${all.filter(i => S.plan[i.id]).length}/${all.length}</span>`; }
  if (!SETS[k]) return "";
  const qs = SETS[k].qs; return ` <span class="muted small">${qs.filter(x => S.res[x.id]).length}/${qs.length}</span>`;
}
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" type="button" id="tab-${k}" aria-controls="main" aria-selected="${S.tab === k}" tabindex="${S.tab === k ? 0 : -1}" data-tab="${k}">${l}${badge(k)}</button>`).join("");
}
function go(k, arg, keepScroll){
  if (!TABS.some(([t]) => t === k)) k = "plan";
  if (k === "alistirma" && arg && (TAGS[arg] || arg === "bad" || arg === "todo" || arg === "all")) { S.filter = arg; arg = null; }
  S.tab = k; save();
  try { history.replaceState(null, "", "#" + k); } catch (e) { location.hash = k; }
  render();
  if (arg) setTimeout(() => focusTarget(arg), 60);
  else if (!keepScroll) window.scrollTo(0, 0);
  const b = $("#tab-" + k); if (b) b.scrollIntoView({block:"nearest", inline:"nearest"});
}
function focusTarget(id){
  const t = document.getElementById(id); if (!t) return;
  if (t.tagName === "DETAILS") t.open = true;
  t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: t.classList.contains("q") || t.classList.contains("fc-card") ? "center" : "start"});
  t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 1800);
}

/* ---------- SORU KARTI ---------- */
function bodyHTML(x){
  const a = S.ans[x.id];
  if (x.t === "mc") {
    const done = typeof a === "number";
    return `<div class="opts" role="group" aria-label="Seçenekler">${x.o.map((o, i) => `<button type="button" class="opt ${done && i === x.a ? "right" : ""} ${done && i === a && i !== x.a ? "wrong" : ""}" data-opt="${x.id}:${i}" ${done ? "disabled" : ""}>${o}</button>`).join("")}</div>`;
  }
  if (x.t === "sel") {
    const v = Array.isArray(a) ? a : null;
    return `<ol class="sel">${x.items.map((it, i) => {
      const cur = v ? v[i] : "", ok = v && v[i] === it.a;
      return `<li><span class="stem">${it.s}</span><select data-sel="${x.id}:${i}" aria-label="${x.lbl} madde ${i + 1}" ${v ? "disabled" : ""}><option value="">seç</option>${x.ch.map(c => `<option value="${esc(c)}" ${cur === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>${v ? `<span class="mk ${ok ? "ok" : "bad"}">${ok ? "✓" : "✗ doğrusu: " + esc(it.a)}</span>` : ""}</li>`;
    }).join("")}</ol>`;
  }
  const art = x.article ? `<div class="note">Makale bu sayfada yok (telif). Kendi bilgisayarındaki ders klasöründen aç: <code>WEEK 5 / articles for practice / SLEEPING IN ON WEEKEND</code>, ya da Teams'teki ders dosyalarından.</div>` : "";
  return `${art}<label class="sr-only" for="ta-${x.id}">${x.lbl} cevabın</label><textarea class="answer" id="ta-${x.id}" data-txt="${x.id}" rows="${x.rows || 6}" spellcheck="true" lang="en" placeholder="Cevabını buraya yaz (kaydedilir)">${esc(S.txt[x.id] || "")}</textarea>`;
}
function wcText(x){
  const n = ((S.txt[x.id] || "").trim().match(/\S+/g) || []).length;
  return n + " kelime" + (x.words ? ` · hedef ${x.words[0]}-${x.words[1]}` : "");
}
function wcOff(x){ const n = ((S.txt[x.id] || "").trim().match(/\S+/g) || []).length; return !!x.words && n > 0 && (n < x.words[0] || n > x.words[1]); }
function fbHTML(x){
  const a = S.ans[x.id];
  if (x.t === "mc" && typeof a === "number") return a === x.a ? `<span class="fb ok">Doğru.</span>` : `<span class="fb bad">Yanlış. Doğrusu: ${x.o[x.a]}</span>`;
  if (x.t === "sel" && Array.isArray(a)) { const n = a.filter((v, i) => v === x.items[i].a).length; return `<span class="fb ${n === x.items.length ? "ok" : "bad"}">${n}/${x.items.length} doğru</span>`; }
  return "";
}
function solHTML(x){
  let h = "";
  if (x.t === "mc") h = `<p class="lbl">Doğru cevap</p><p><b>${x.o[x.a]}</b></p>${x.why ? `<p>${x.why}</p>` : ""}`;
  else if (x.t === "sel") h = `<p class="lbl">Cevaplar</p><ol>${x.items.map(it => `<li><b>${esc(it.a)}</b> · <span class="small">${it.s}</span></li>`).join("")}</ol>${x.why ? `<p>${x.why}</p>` : ""}`;
  else h = `<p class="lbl">Örnek cevap</p>${x.model}${x.rub ? `<p class="lbl">Puanlama</p>${x.rub}` : ""}`;
  const open = x.t === "open";
  return h + `<div class="self"><span class="small muted">${open ? "Örnekle karşılaştır:" : "Kağıttaki cevabın:"}</span>
    <button class="btn ok" type="button" data-mark="1" data-id="${x.id}">✓ Doğru yaptım</button>
    ${open ? `<button class="btn soft" type="button" data-mark="0.5" data-id="${x.id}">◐ Kısmen</button>` : ""}
    <button class="btn bad" type="button" data-mark="0" data-id="${x.id}">✗ Yanlış yaptım</button>
    ${open ? `<span class="small muted">Emin değilsen metni sohbete yapıştır.</span>` : ""}</div>`;
}
function qCard(x){
  const st = stOf(x.id), open = !!S.open[x.id], sc = !!S.open["sc" + x.id], hO = !!S.open["h" + x.id];
  const answered = S.ans[x.id] !== undefined || S.res[x.id];
  return `<article class="q" id="q-${x.id}" data-id="${x.id}">
   <header>
     <span class="qid">${x.lbl}</span>
     <span class="chip">${TAGS[x.tag]}</span>
     <span class="qsrc">${esc(x.src)}</span>
     <span class="small muted">${fmt(x.pts)} puan</span>
     <span class="st ${st || ""}">${stText(x.id)}</span>
   </header>
   <div class="prompt">${x.q}${x.en ? `<p class="small muted">Sınavdaki yazılışı: <span lang="en">${esc(x.en)}</span></p>` : ""}</div>
   ${bodyHTML(x)}
   <div class="actions">
     ${x.t === "sel" && !Array.isArray(S.ans[x.id]) ? `<button class="btn" type="button" data-check="${x.id}">Kontrol et</button>` : ""}
     <span id="fb-${x.id}" aria-live="polite">${fbHTML(x)}</span>
     ${x.t === "open" ? `<span class="wc ${wcOff(x) ? "off" : ""}" id="wc-${x.id}">${wcText(x)}</span>` : ""}
     <button class="btn ghost" type="button" data-hint="${x.id}" aria-expanded="${hO}" aria-controls="h-${x.id}">💡 İpucu</button>
     <button class="btn soft" type="button" data-reveal="${x.id}" aria-expanded="${open}" aria-controls="s-${x.id}">${open ? "Çözümü gizle" : "Çözümü göster"}</button>
     <button class="btn ghost" type="button" data-scratch="${x.id}" aria-expanded="${sc}" aria-controls="sc-${x.id}">✏️ Karalama</button>
     ${x.timer ? `<button class="btn purple" type="button" data-qtimer="${x.timer}">⏱ ${x.timer} dk başlat</button>` : ""}
     ${answered ? `<button class="btn ghost" type="button" data-qreset="${x.id}">Sıfırla</button>` : ""}
   </div>
   <div class="hint" id="h-${x.id}" ${hO ? "" : "hidden"}><b>İpucu:</b> ${esc(hintOf(x))}</div>
   <div class="scratch-box" id="sc-${x.id}" ${sc ? "" : "hidden"}>
     <div class="small muted"><b>Karalama:</b> soldaki kutuya taslak ya da not yaz (kaydedilir), sağa fare veya kalemle çiz.</div>
     <div class="scratch-grid">
       <textarea class="scratch-Area" data-scinput="${x.id}" aria-label="${x.lbl} karalama notu" placeholder="Outline: TS → S1 → S2 → S3 → CS ...">${esc(S.scratch[x.id] || "")}</textarea>
       <div class="scratch-canvas-wrap">
         <canvas class="scratch-canvas" id="canv-${x.id}" width="420" height="130" aria-label="Çizim alanı"></canvas>
         <button type="button" class="btn ghost" data-clearcanv="${x.id}" style="position:absolute;top:5px;right:5px;padding:2px 7px;font-size:.73rem">Temizle</button>
       </div>
     </div>
   </div>
   <div class="sol" id="s-${x.id}" ${open ? "" : "hidden"}>${solHTML(x)}</div>
  </article>`;
}
function refreshCard(id, focusSel){
  const old = document.getElementById("q-" + id); if (!old) return;
  const tmp = document.createElement("div"); tmp.innerHTML = qCard(ALLQ[id]);
  const n = tmp.firstElementChild; old.replaceWith(n);
  initScratchCanvases();
  if (focusSel) { const f = n.querySelector(focusSel) || n.querySelector(".actions button"); if (f) f.focus({preventScroll:true}); }
}

/* ---------- SET GÖRÜNÜMLERİ ---------- */
function setStats(qs){ const ok = qs.filter(x => stOf(x.id) === "ok").length, bad = qs.filter(x => S.res[x.id] && stOf(x.id) !== "ok").length; return {ok, bad, todo: qs.length - ok - bad}; }
function setHead(qs, title, intro, k){
  const s = setStats(qs);
  return `<h2>${title}</h2><p class="muted">${intro}</p>
   <p class="small" style="margin-top:6px">Durumun: <b style="color:var(--green)">${s.ok} doğru</b> · <b style="color:var(--red)">${s.bad} yanlış/eksik</b> · <b>${s.todo} çözülmemiş</b></p>
   <div class="actions"><button class="btn ghost" type="button" data-resetset="${k}">Bu setin cevaplarını sıfırla</button><button class="btn ghost" type="button" data-expandall="${k}">Tüm çözümleri aç/kapat</button></div>`;
}
function taniView(){
  const qs = SETS.tani.qs;
  return `<section class="sheet">${setHead(qs, "🩺 Tanılama: 6 kısa soru", TANI.intro + " Çoktan seçmeliler ilk tıklamada puanlanır.", "tani")}${qs.map(qCard).join("")}</section>`;
}
function alistirmaView(){
  const all = SETS.alistirma.qs;
  let h = `<section class="sheet">${setHead(all, "🎯 Alıştırma", "Konu başına sorular. Çoktan seçmeliler ilk tıklamada, listeli sorular “Kontrol et” ile puanlanır. Filtreyle konu, yanlışların ya da çözülmemişler.", "alistirma")}`;
  const cnt = {all: all.length, bad: all.filter(x => S.res[x.id] && stOf(x.id) !== "ok").length, todo: all.filter(x => !S.res[x.id]).length};
  PGROUPS.forEach(g => cnt[g.tag] = g.items.length);
  const F = [["all", `Tümü (${cnt.all})`], ...PGROUPS.map(g => [g.tag, `${TAGS[g.tag]} (${cnt[g.tag]})`]), ["bad", `✗ Yanlışlarım (${cnt.bad})`], ["todo", `⏳ Çözülmemiş (${cnt.todo})`]];
  if (!F.some(([k]) => k === S.filter)) S.filter = "all";
  h += `<div class="filter-bar" role="group" aria-label="Filtre">${F.map(([k, l]) => `<button type="button" class="filter-btn ${S.filter === k ? "active" : ""}" aria-pressed="${S.filter === k}" data-filter="${k}">${l}</button>`).join("")}</div>`;
  const keep = x => S.filter === "all" ? true : S.filter === "bad" ? (S.res[x.id] && stOf(x.id) !== "ok") : S.filter === "todo" ? !S.res[x.id] : x.tag === S.filter;
  let shown = 0;
  PGROUPS.forEach(g => {
    const qs = g.items.filter(keep); if (!qs.length) return; shown += qs.length;
    h += `<div class="part-h" id="g-${g.tag}"><h3>${g.title}</h3><span class="chip">${TAG_WEEK[g.tag]}</span><button type="button" class="btn ghost" style="padding:2px 9px;font-size:.78rem" data-go="konu:konu-${TAG_KONU[g.tag]}">Konu özeti →</button></div>`;
    h += qs.map(qCard).join("");
  });
  if (!shown) h += `<p class="muted" style="padding:20px 0">Bu filtrede soru yok.</p>`;
  return h + `</section>`;
}
function timerHTML(){
  return `<div class="timer" id="timer-deneme"><span class="clock" id="clock-deneme" aria-live="off">90:00</span>
   <button class="btn" type="button" data-t="start">Süreyi başlat</button>
   <button class="btn ghost" type="button" data-t="pause">Duraklat</button>
   <button class="btn ghost" type="button" data-t="reset">Sıfırla (90 dk)</button>
   <span class="small muted">Deneme 90 dk. Yazma sorularındaki ⏱ düğmeleri aynı sayacı 20 / 15 dk'ya kurar.</span></div>`;
}
function denemeView(){
  const qs = SETS.deneme.qs;
  let got = 0, max = 0; const parts = [];
  DENEME.forEach(p => { let g = 0, m = 0; p.items.forEach(q => { const r = S.res[q.id]; if (r) { g += r.got; m += r.max; } }); got += g; max += m; parts.push(`${p.id}: ${fmt(g)}/${fmt(m)}`); });
  let h = `<section class="sheet">${setHead(qs, "📝 Deneme Sınavı 1", "90 dakika, 100 puan. Gerçek sınavın formatı bilinmiyor; bu deneme ders alıştırmalarının tiplerinden kuruldu. Yazma sorularında önce yaz, sonra çözümü aç ve kendini puanla.", "deneme")}
   ${timerHTML()}
   <p class="small"><b>Puan:</b> <span>${fmt(got)} / ${fmt(max)}</span> cevaplanan (toplam 100) · <span class="muted">${parts.join(" · ")}</span></p>`;
  DENEME.forEach(p => {
    h += `<div class="part-h" id="part-${p.id}"><h3>${p.title}</h3><span class="chip">${p.pts} puan</span></div>`;
    h += p.items.map(qCard).join("");
  });
  return h + `</section>`;
}

/* ---------- PLAN ---------- */

  let h = `<section class="sheet">

/* ---------- METİN DENETLEYİCİ (ders listelerine dayalı) ---------- */
const CHK = {
  per: {re:/\b(I|me|my|mine|we|us|our|ours|you|your|yours)\b/g, l:"Personal language", tip:"I / we / you yerine It is..., There is..., passive ya da The results indicate that..."},
  emo: {re:/\b(obviously|clearly|of course|indeed|definitely|absolutely|incredibly|extremely|totally|completely|really|so much|amazing|awesome|terrible|horrible|ghastly|huge|disaster|worst|best ever|perfect|useless|remarkable|precious|fragile|always|never|every)\b/gi, l:"Judgmental / emotive", tip:"Judgmental ve emotive kelime yerine technical evaluation (valid, reliable, significant) ve hedging (may, often, many, somewhat). always / every → often / many."},
  phr: {re:/\b(talk(?:s|ed|ing)? into|carr(?:y|ies|ied|ying) out|f(?:ind|inds|ound|inding) out|look(?:s|ed|ing)? into|rul(?:e|es|ed|ing) out|get(?:s|ting)? in touch|pull your socks up|tell(?:s|ing)? fibs|told fibs)\b/gi, l:"Phrasal verb / idiom", tip:"talk into → persuade, carry out → conduct, find out → discover, look into → investigate, rule out → eliminate, get in touch → contact."},
  reg: {re:/(\b(?:hey|hi|thanks|thx|sorry|gonna|wanna|gotta|cheers|asap|u|r|ur|btw|ok|okay|stuff|kids)\b|\b\w+'(?:m|re|s|ve|ll|d)\b|\b\w+n't\b|!+|\b[A-Z]{3,}\b)/g, l:"Informal register", tip:"Contraction'ları aç (I am, do not), Thanks → Thank you, Sorry → I apologise; exclamation mark ve capitalisation kullanma (abbreviation değilse)."},
  tr: {re:/\b(moreover|besides|what's more|additionally|in addition|furthermore|also|however|although|even though|in spite of|despite|in contrast|conversely|on the other hand|instead|whereas|nevertheless|likewise|similarly|in the same way|compared to|because|since|as a result|consequently|therefore|thus|so that|in order to|for example|for instance|to illustrate|in particular|such as|in other words|first of all|finally)\b/gi, l:"Transition signal (iyi)", tip:"Coherence için gerekli; paragrafta 3-5 farklı transition hedefle."}
};
function analyze(text){
  const marks = [];
  for (const [k, c] of Object.entries(CHK)) { c.re.lastIndex = 0; let m; while ((m = c.re.exec(text))) { marks.push({s:m.index, e:m.index + m[0].length, k, w:m[0]}); if (m[0] === "") c.re.lastIndex++; } }
  marks.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const kept = []; let end = -1; for (const m of marks) if (m.s >= end) { kept.push(m); end = m.e; }
  return kept;
}
function chkRender(){
  const out = $("#chkOut"), sum = $("#chkSum"); if (!out) return;
  const text = S.chk || "";
  if (!text.trim()) { out.textContent = "Metin yazınca işaretler burada görünür."; sum.innerHTML = ""; return; }
  const ms = analyze(text); let h = "", p = 0;
  ms.forEach(m => { h += esc(text.slice(p, m.s)) + `<mark class="m-${m.k}" title="${esc(CHK[m.k].l)}">${esc(text.slice(m.s, m.e))}</mark>`; p = m.e; });
  out.innerHTML = h + esc(text.slice(p));
  const words = (text.trim().match(/\S+/g) || []).length, sents = (text.match(/[^.!?]+[.!?]+/g) || []).length;
  const by = k => ms.filter(m => m.k === k);
  const uniq = arr => [...new Set(arr.map(m => m.w.toLowerCase()))];
  let li = `<li><b>${words} kelime</b>, ${sents} cümle. Paragraf hedefi 120-150, e-posta 100-130, summary 80-100 kelime.</li>`;
  for (const k of ["per","emo","phr","reg"]) { const b = by(k); if (b.length) li += `<li><mark class="m-${k}">${CHK[k].l}</mark> ${b.length} yer: ${esc(uniq(b).join(", "))}. ${esc(CHK[k].tip)}</li>`; }
  const t = uniq(by("tr")); li += `<li><mark class="m-tr">${CHK.tr.l}</mark> ${t.length ? t.length + " farklı: " + esc(t.join(", ")) : "yok"}. ${t.length < 3 ? "Daha fazla transition ekle." : ""}</li>`;
  if (!["per","emo","phr","reg"].some(k => by(k).length)) li += `<li>Listedeki subjective ya da informal kalıplardan hiçbiri bulunmadı.</li>`;
  sum.innerHTML = `<ul class="findings">${li}</ul>`;
}

/* ---------- İLERLEME & HATALAR ---------- */
function stats(){
  const r = {}; for (const t in TAGS) r[t] = {ok:0, bad:0, tot:0, got:0, max:0};
  for (const id in ALLQ) { const x = ALLQ[id], s = r[x.tag], q = S.res[id]; s.tot++; if (q) { s.got += q.got; s.max += q.max; if (q.got >= q.max) s.ok++; else s.bad++; } }
  return r;
}
function ilerlemeView(){
  const r = stats();
  let h = `<section class="sheet"><h2>📊 Konu Bazlı İlerleme & Zayıf Konular</h2><p class="muted">Tanı, alıştırma ve denemedeki cevaplardan hesaplanır. Yanlışı doğrudan fazla ya da puan oranı %60'ın altında olan konu <span class="weak">zayıf</span> sayılır.</p><div class="tblwrap"><table>
   <tr><th>Konu</th><th>Doğru</th><th>Yanlış</th><th>Boş</th><th>Puan</th><th>Oran</th><th>İşlem</th></tr>`;
  for (const t in TAGS) {
    const s = r[t], tried = s.ok + s.bad, pc = s.max ? Math.round(100 * s.got / s.max) : null, weak = tried > 0 && (s.bad > s.ok || (pc !== null && pc < 60));
    h += `<tr><td class="${weak ? "weak" : ""}">${TAGS[t]}${weak ? " · zayıf" : ""}</td><td style="color:var(--green);font-weight:700">${s.ok}</td><td style="color:var(--red);font-weight:700">${s.bad}</td><td>${s.tot - tried}</td><td class="small">${pc === null ? "—" : pc + "%"}</td>
     <td><div class="meter" role="img" aria-label="${s.ok} doğru, ${s.bad} yanlış, ${s.tot - tried} boş"><span class="g" style="width:${100 * s.ok / s.tot}%"></span><span class="r" style="width:${100 * s.bad / s.tot}%"></span></div></td>
     <td><button type="button" class="btn soft" data-go="alistirma:${t}" style="padding:2px 8px;font-size:.76rem">Soruları aç</button></td></tr>`;
  }
  h += `</table></div><div class="actions"><button class="btn" id="copyBtn" type="button">📋 İlerleme özetini kopyala</button><button class="btn ghost" id="resetAll" type="button">Tüm ilerlemeyi sıfırla</button></div></section>`;
  const bad = Object.keys(ALLQ).filter(id => S.res[id] && stOf(id) !== "ok");
  h += `<section class="sheet"><h2>📕 Hata Listesi (${bad.length} soru)</h2>`;
  if (!bad.length) h += `<p class="muted">Henüz yanlış ya da eksik puanlı soru yok. Tanı, alıştırma ve denemede yanlış yaptıkların burada birikir.</p>`;
  else h += `<p class="muted">Sınavdan önce bunları tekrar çöz. “Sıfırla” ile soruyu yeniden çözebilir ya da “✓ Doğru yaptım” ile listeden düşürebilirsin. Sorunun kendi setine gitmek için:</p>` +
    `<div class="chips">${bad.map(id => `<button type="button" class="chip red" style="border:none" data-go="${ALLQ[id].set}:q-${id}">${ALLQ[id].lbl}</button>`).join("")}</div>` + bad.map(id => qCard(ALLQ[id])).join("");
  return h + `</section>`;
}
function summaryText(){
  const r = stats(), L = ["ELIT100 ilerleme raporu:"];
  for (const t in TAGS) { const s = r[t]; L.push(`- ${TAGS[t]}: ${s.ok} doğru, ${s.bad} yanlış/eksik, ${s.tot - s.ok - s.bad} boş${s.max ? `, puan %${Math.round(100 * s.got / s.max)}` : ""}`); }
  const bad = Object.keys(ALLQ).filter(id => S.res[id] && stOf(id) !== "ok");
  L.push("Yanlışlar: " + (bad.length ? bad.map(id => ALLQ[id].lbl).join(", ") : "yok"));
  return L.join("\n");
}

/* ---------- SAYAÇLAR ---------- */
function tState(){ if (!S.timers.deneme) S.timers.deneme = {left:90 * 60, run:false, at:0, total:90}; return S.timers.deneme; }
function tLeft(){ const t = tState(); return t.run ? t.left - (Date.now() - t.at) / 1000 : t.left; }
function clockStr(l){ const a = Math.abs(Math.round(l)); return (l < 0 ? "−" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0"); }
function startTimer(min){ S.timers.deneme = {left:min * 60, run:true, at:Date.now(), total:min}; save(); tTick(); toast(min + " dakikalık süre başladı."); }
let pomo = {left:25 * 60, run:false, at:0};
function pomoLeft(){ return pomo.run ? pomo.left - (Date.now() - pomo.at) / 1000 : pomo.left; }
function tTick(){
  const t = tState(), l = tLeft(), el = $("#clock-deneme");
  if (el) { el.textContent = clockStr(l); $("#timer-deneme").classList.toggle("over", l < 0); }
  const pill = $("#timerPill"); pill.hidden = !t.run;
  if (t.run) { $("#pillClock").textContent = clockStr(l); pill.classList.toggle("over", l < 0); }
  if (t.run && l < 0 && !t.warned) { t.warned = true; save(); toast("Süre doldu."); }
  const pl = Math.max(0, Math.round(pomoLeft()));
  $("#pomoClock").textContent = String(Math.floor(pl / 60)).padStart(2, "0") + ":" + String(pl % 60).padStart(2, "0");
  if (pl === 0 && pomo.run) { pomo = {left:25 * 60, run:false, at:0}; $("#pomoToggle").textContent = "Başlat"; toast("🍅 Pomodoro bitti. 5 dakika mola."); }
}
setInterval(tTick, 1000);

/* ---------- KARALAMA TUVALİ ---------- */
function initScratchCanvases(){
  document.querySelectorAll(".scratch-canvas").forEach(canv => {
    if (canv.dataset.bound) return; canv.dataset.bound = "1";
    const ctx = canv.getContext("2d"); let drawing = false;
    const pos = e => { const r = canv.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; return [(p.clientX - r.left) * (canv.width / r.width), (p.clientY - r.top) * (canv.height / r.height)]; };
    const start = e => { drawing = true; const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); e.preventDefault(); };
    const move = e => { if (!drawing) return; const [x, y] = pos(e); ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--blue").trim() || "#3b82f6"; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineTo(x, y); ctx.stroke(); e.preventDefault(); };
    const stop = () => { drawing = false; };
    canv.addEventListener("mousedown", start); canv.addEventListener("mousemove", move); window.addEventListener("mouseup", stop);
    canv.addEventListener("touchstart", start, {passive:false}); canv.addEventListener("touchmove", move, {passive:false}); window.addEventListener("touchend", stop);
  });
}

/* ---------- OLAYLAR ---------- */
function setRes(id, f){ const x = ALLQ[id]; S.res[id] = {got: Math.round(x.pts * f * 10) / 10, max: x.pts}; }
document.addEventListener("click", e => {
  const t = e.target.closest("button,a,[data-fcflip]"); if (!t) return;
  const d = t.dataset;
  if (d.fcmark) { e.stopPropagation(); S.fc[d.fcmark] = S.fc[d.fcmark] === "ok" ? null : "ok"; save(); render(); const c = document.getElementById("fc-" + d.fcmark); if (c) c.focus({preventScroll:true}); return; }

    S.ans[x.id] = v; setRes(x.id, v.filter((s, i) => s === x.items[i].a).length / x.items.length); S.open[x.id] = true; save(); refreshCard(x.id, "[data-reveal]"); header(); return;
  }
  if (d.qreset) { const id = d.qreset; delete S.ans[id]; delete S.res[id]; delete S.open[id]; save(); refreshCard(id, ".opt,select,textarea"); header(); return; }
  if (d.mark !== undefined) { const id = d.id; if (ALLQ[id].t === "open") S.ans[id] = +d.mark; setRes(id, +d.mark); save(); refreshCard(id, `[data-mark="${d.mark}"]`); header(); toast(+d.mark === 1 ? "✓ Doğru olarak işaretlendi" : +d.mark === 0 ? "✗ Hata listesine eklendi" : "◐ Kısmen olarak işaretlendi"); return; }
  if (d.reveal) { const id = d.reveal, s = $("#s-" + id), open = s.hidden; s.hidden = !open; S.open[id] = open; t.textContent = open ? "Çözümü gizle" : "Çözümü göster"; t.setAttribute("aria-expanded", open); save(); return; }
  if (d.hint) { const id = d.hint, s = $("#h-" + id), open = s.hidden; s.hidden = !open; S.open["h" + id] = open; t.setAttribute("aria-expanded", open); save(); return; }
  if (d.scratch) { const id = d.scratch, s = $("#sc-" + id), open = s.hidden; s.hidden = !open; S.open["sc" + id] = open; t.setAttribute("aria-expanded", open); save(); initScratchCanvases(); if (open) s.querySelector("textarea").focus({preventScroll:true}); return; }
  if (d.clearcanv) { const c = document.getElementById("canv-" + d.clearcanv); if (c) c.getContext("2d").clearRect(0, 0, c.width, c.height); return; }
  if (d.qtimer) { startTimer(+d.qtimer); return; }
  if (d.t) {
    const s = tState();
    if (d.t === "start") { if (!s.run) { s.run = true; s.at = Date.now(); s.warned = s.warned && tLeft() < 0; save(); toast("Süre başladı"); } }
    else if (d.t === "pause") { if (s.run) { s.left = tLeft(); s.run = false; } else if (t.id === "pillPause") { s.run = true; s.at = Date.now(); } save(); }
    else if (d.t === "reset") { S.timers.deneme = null; tState(); save(); }
    else if (d.t === "stop") { s.left = tLeft(); s.run = false; save(); }
    $("#pillPause").textContent = tState().run ? "Duraklat" : "Devam"; tTick(); return;
  }

  if (t.id === "copyBtn") { const txt = summaryText(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("İlerleme özeti kopyalandı."), () => prompt("Kopyala:", txt)); return; }
  if (t.id === "resetAll") { if (confirm("Tüm cevaplar, puanlar, yazdıkların, kart ve plan işaretleri silinsin mi? Bu geri alınamaz.")) { S = {plan:{}, ans:{}, res:{}, txt:{}, tab:"ilerleme", theme:S.theme, open:{}, scratch:{}, fc:{}, filter:"all", timers:{}, chk:""}; save(); render(); toast("İlerleme sıfırlandı."); } return; }
  if (t.id === "themeBtn") { const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); r.dataset.theme = cur === "dark" ? "light" : "dark"; S.theme = r.dataset.theme; save(); toast(S.theme === "dark" ? "Koyu tema" : "Açık tema"); return; }
  if (t.id === "chkFill") { S.chk = "Indeed, there are countless values that are shared by our community. Obviously, kids are such vulnerable creatures and it is the full responsibility of all of us to stop endangering their fragile lives. I think we must find out the truth TODAY!! So enforcing these programs is the only logical way."; save(); $("#chkIn").value = S.chk; chkRender(); return; }
  if (t.id === "chkClear") { S.chk = ""; save(); $("#chkIn").value = ""; chkRender(); $("#chkIn").focus(); return; }
  if (d.jump) { closeSearch(false); jump(d.jump); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.plan) { S.plan[t.dataset.plan] = t.checked; t.closest("li").classList.toggle("done", t.checked); save(); renderTabs(); return; }
});
document.addEventListener("toggle", e => { const t = e.target; if (t.matches && t.matches("details.konu")) { S.open["k" + t.dataset.k] = t.open; save(); } }, true);
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset || {};
  if (d.txt) { S.txt[d.txt] = t.value; save(); const w = $("#wc-" + d.txt); if (w) { w.textContent = wcText(ALLQ[d.txt]); w.classList.toggle("off", wcOff(ALLQ[d.txt])); } return; }
  if (d.scinput) { S.scratch[d.scinput] = t.value; save(); return; }
  if (t.id === "chkIn") { S.chk = t.value; save(); chkRender(); return; }
  if (t.id === "searchModalInput") { renderResults(t.value); return; }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); return; }
  const modalOpen = !$("#searchModal").hidden;
  if (e.key === "Escape" && modalOpen) { closeSearch(true); return; }
  if (modalOpen && e.key === "Enter" && e.target.id === "searchModalInput") { const f = $("#searchModalResults [data-jump]"); if (f) f.click(); return; }
  if (modalOpen && e.key === "ArrowDown" && e.target.id === "searchModalInput") { const f = $("#searchModalResults [data-jump]"); if (f) { e.preventDefault(); f.focus(); } return; }
  if (modalOpen && e.key === "Tab") { const f = [$("#searchModalInput"), ...document.querySelectorAll("#searchModalResults [data-jump]")]; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } return; }
  const tgt = e.target;
  if (tgt.getAttribute && tgt.getAttribute("role") === "tab" && ["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) {
    e.preventDefault(); const ks = TABS.map(([k]) => k); let i = ks.indexOf(tgt.dataset.tab);
    i = e.key === "Home" ? 0 : e.key === "End" ? ks.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + ks.length) % ks.length;
    go(ks[i]); $("#tab-" + ks[i]).focus(); return;
  }
  if (tgt.dataset && tgt.dataset.fcflip && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tgt.click(); return; }
});
$("#searchModal").addEventListener("click", e => { if (e.target.id === "searchModal") closeSearch(true); });

/* ---------- Ctrl+K ARAMA ---------- */
let INDEX = null, lastFocus = null;
function buildIndex(){
  INDEX = [];
  Object.values(ALLQ).forEach(x => INDEX.push({k:"q:" + x.id, title:`${x.lbl} · ${TAGS[x.tag]}`, sub:x.src, chip:x.set === "tani" ? "Tanılama" : x.set === "deneme" ? "Deneme" : "Alıştırma",
    text: low([x.lbl, x.id, TAGS[x.tag], x.src, plain(x.q), x.en || "", (x.o || []).join(" "), (x.items || []).map(i => i.s).join(" "), plain(x.why || ""), plain(x.model || "")].join(" "))}));
  OZET.forEach((s, i) => INDEX.push({k:"k:" + i, title:s.title, sub:"Konu özeti", chip:"Konu", text: low(s.title + " " + plain(s.html))}));
  FLASHCARDS.forEach(f => INDEX.push({k:"f:" + f.id, title:f.q, sub:"Ezber kartı · " + TAGS[f.tag], chip:"Kart", text: low(f.q + " " + f.a + " " + TAGS[f.tag])}));
}
function openSearch(){ if (!INDEX) buildIndex(); lastFocus = document.activeElement; const m = $("#searchModal"), inp = $("#searchModalInput"); m.hidden = false; inp.value = ""; renderResults(""); inp.focus(); }
function closeSearch(restore){ $("#searchModal").hidden = true; if (restore && lastFocus) lastFocus.focus(); }
/* Türkçe arama kelimesi → sayfadaki İngilizce terim: eski Türkçe kelimeyle arayınca da bulunur */
const TR_ALIAS = [
  ["konu cümle", "topic sentence"], ["sonuç cümle", "concluding sentence"], ["destek cümle", "supporting"], ["konu satır", "subject line"],
  ["kaynak liste", "reference list"], ["eş anlam", "synonym"], ["not alma", "note-taking"], ["ana fikir", "main idea"], ["ana nokta", "main point"],
  ["kelime türü", "word form"], ["cümle yapı", "sentence structure"], ["doğrudan alıntı", "direct quot"], ["blok alıntı", "block quot"], ["isim öbeği", "noun phrase"],
  ["satır aralığı", "double spacing"],
  ["özet", "summar"], ["alıntı", "quot"], ["atıf", "citation"], ["kaynakça", "reference list"], ["intihal", "plagiarism"],
  ["birlik", "unity"], ["tutarlılık", "coherence"], ["bütünlük", "completeness"], ["geçiş", "transition"], ["bağlaç", "transition|conjunction"],
  ["kısaltma", "abbreviation|contraction"], ["ünlem", "exclamation"], ["zamir", "pronoun"], ["edilgen", "passive"], ["pasif", "passive"],
  ["abartı", "exaggeration"], ["duygusal", "emotive"], ["yargı", "judg"], ["görüş", "opinion"], ["kanıt", "proof|evidence"],
  ["öznel", "subjective"], ["subjektif", "subjective"], ["nesnel", "objective"], ["objektif", "objective"], ["resmi", "formal"], ["resmî", "formal"],
  ["samimi", "informal"], ["argo", "slang"], ["selamla", "salutation"], ["kapanış", "closing|sign-off"], ["unvan", "title"], ["sembol", "symbol"],
  ["sıfat", "adjective"], ["zarf", "adverb"], ["girinti", "indent"]
].map(([tr, en]) => [low(tr), en.split("|")]);
function queryTerms(q){
  let s = low(q); const terms = [];
  for (const [tr, en] of TR_ALIAS) if (tr.includes(" ") && s.includes(tr)) { terms.push([tr, ...en]); s = s.split(tr).join(" "); }
  s.trim().split(/\s+/).filter(Boolean).forEach(w => {
    const alt = [w];
    for (const [tr, en] of TR_ALIAS) if (!tr.includes(" ") && (w.startsWith(tr) || (w.length >= 4 && tr.startsWith(w)))) alt.push(...en);
    terms.push(alt);
  });
  return terms;
}
function renderResults(q){
  const terms = queryTerms(q);
  const list = INDEX.filter(it => terms.every(alt => alt.some(w => it.text.includes(w) || low(it.title).includes(w)))).slice(0, 20);
  $("#searchModalResults").innerHTML = list.map(it => `<button type="button" class="modal-item" role="listitem" data-jump="${it.k}"><span><b>${esc(it.title)}</b><span class="small muted" style="display:block">${esc(it.sub)}</span></span><span class="chip">${it.chip}</span></button>`).join("") || `<div class="small muted" style="padding:12px">Sonuç bulunamadı.</div>`;
}
function jump(key){
  const [type, id] = key.split(":");
  if (type === "q") { const x = ALLQ[id]; if (x.set === "alistirma") S.filter = "all"; go(x.set, "q-" + id); }
  else if (type === "k") { S.open["k" + id] = true; go("konu", "konu-" + (+id + 1)); }
  else go("konu", "fc-" + id);
}

/* ---------- AÇILIŞ ---------- */
if (S.theme) document.documentElement.dataset.theme = S.theme;
const h0 = location.hash.slice(1); if (TABS.some(([k]) => k === h0)) S.tab = h0;
if (!TABS.some(([k]) => k === S.tab)) S.tab = "plan";
try { history.replaceState(null, "", "#" + S.tab); } catch (e) {}
countdown(); setInterval(countdown, 30000);
render();
$("#pillPause").textContent = tState().run ? "Duraklat" : "Devam";
window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (TABS.some(([t]) => t === k) && k !== S.tab) go(k); });
</script>
