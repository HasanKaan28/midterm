<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELIT100 Çalışma Masası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#f6f3ea; --paper-2:#fffdf8; --rule:rgba(47,74,138,.09); --ink:#1f2330; --ink-2:#535a6c;
  --pen:#a3213f; --pen-soft:#f7e2e7; --blue:#2f4a8a; --blue-soft:#e4e9f5; --green:#1d7647; --green-soft:#dcefe3;
  --amber:#8f5b00; --amber-soft:#f5e8cf; --line:#dbd4c3; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(30,40,70,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15171e; --paper-2:#1c1f29; --rule:rgba(140,170,255,.06); --ink:#e8e9ee; --ink-2:#a9b0c1;
  --pen:#ff8fa6; --pen-soft:#3b1d25; --blue:#93abff; --blue-soft:#222b45; --green:#72d39f; --green-soft:#1a3125;
  --amber:#f1bd5c; --amber-soft:#382b14; --line:#2d3242; --shadow:0 6px 18px -10px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#15171e; --paper-2:#1c1f29; --rule:rgba(140,170,255,.06); --ink:#e8e9ee; --ink-2:#a9b0c1;
  --pen:#ff8fa6; --pen-soft:#3b1d25; --blue:#93abff; --blue-soft:#222b45; --green:#72d39f; --green-soft:#1a3125;
  --amber:#f1bd5c; --amber-soft:#382b14; --line:#2d3242; --shadow:0 6px 18px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 27px}
a{color:var(--blue)}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:900px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font:700 1.45rem/1.1 "Fraunces",Georgia,serif;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--pen);font-style:italic}
.count{font:500 .84rem "IBM Plex Mono",monospace;color:var(--ink-2)}
.count b{color:var(--ink)}
.theme{margin-left:auto;border:1px solid var(--line);background:none;color:var(--ink-2);border-radius:6px;padding:3px 8px;font-size:.8rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen);width:0;transition:width .4s}
.barlbl{font-size:.78rem;color:var(--ink-2);margin-top:4px}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:1px solid transparent;border-bottom:none;background:none;color:var(--ink-2);padding:8px 12px;border-radius:8px 8px 0 0;white-space:nowrap;font-weight:500}
nav button[aria-selected="true"]{background:var(--paper-2);color:var(--ink);border-color:var(--line);box-shadow:0 1px 0 var(--paper-2)}
main{max-width:900px;margin:0 auto;padding:20px 16px 110px}
.sheet{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px 20px 20px 36px;position:relative;margin-bottom:18px}
.sheet::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--pen);opacity:.4}
h2{font:700 1.35rem/1.2 "Fraunces",Georgia,serif;margin:0 0 6px}
h3{font:700 1.08rem/1.3 "Fraunces",Georgia,serif;margin:18px 0 6px}
h4{margin:14px 0 4px;font-size:1rem}
.muted{color:var(--ink-2)} .small{font-size:.86rem}
.warn{background:var(--amber-soft);border-left:3px solid var(--amber);padding:10px 12px;border-radius:6px;margin:10px 0}
code{font:500 .9em "IBM Plex Mono",monospace;background:var(--blue-soft);padding:1px 5px;border-radius:4px}
pre{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.88rem}
pre code{background:none;padding:0}
blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--pen);background:var(--pen-soft);border-radius:0 8px 8px 0}
blockquote p{margin:.3em 0}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin:8px 0}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:.82rem}
.tblwrap{overflow-x:auto}
details.konu{border-top:1px dashed var(--line);padding:10px 0}
details.konu:first-of-type{border-top:none}
details.konu>summary{cursor:pointer;font:700 1.1rem "Fraunces",Georgia,serif;padding:4px 0}
details.konu[open]>summary{margin-bottom:6px;color:var(--pen)}
.q{border-top:1px dashed var(--line);padding:16px 0 14px;scroll-margin-top:150px}
.q:first-of-type{border-top:none}
.q header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qid{font:600 .8rem "IBM Plex Mono",monospace;color:var(--pen);border:1.5px solid var(--pen);padding:0 7px;border-radius:999px}
.chip{font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:500}
.st{margin-left:auto;font:600 .8rem "IBM Plex Mono",monospace;padding:2px 8px;border-radius:999px}
.st.ok{background:var(--green-soft);color:var(--green)} .st.bad{background:var(--pen-soft);color:var(--pen)} .st.mid{background:var(--amber-soft);color:var(--amber)}
.prompt p{margin:.3em 0}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft);text-decoration:line-through;text-decoration-color:var(--pen)}
ol.sel{margin:8px 0 0;padding-left:22px}
ol.sel li{padding:6px 0;border-bottom:1px dotted var(--line)}
ol.sel .stem{display:block;margin-bottom:4px}
select{border:1.5px solid var(--line);border-radius:6px;background:var(--paper);padding:5px 8px;min-width:120px}
select:disabled{opacity:1}
.mark{margin-left:10px;font-weight:700}
.mark.ok{color:var(--green)} .mark.bad{color:var(--pen)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 12px;line-height:1.55;resize:vertical;margin-top:8px}
textarea:focus{border-color:var(--blue);outline:none}
.wc{font:500 .8rem "IBM Plex Mono",monospace;color:var(--ink-2)}
.wc.off{color:var(--pen)}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper-2);padding:6px 13px;border-radius:6px;font-weight:600;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.soft{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.link{background:none;border:none;color:var(--blue);padding:2px 4px;text-decoration:underline;font-weight:500}
.btn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--amber)}
.btn:hover{filter:brightness(1.08)}
.actions,.self{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{font-weight:600;margin:8px 0 0}
.fb.ok{color:var(--green)} .fb.bad{color:var(--pen)}
.sol{margin-top:10px;padding:12px 14px;border-radius:8px;background:var(--blue-soft);border-left:3px solid var(--blue);overflow-x:auto}
.sol p{margin:.35em 0}
.lbl{font:600 .76rem "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--blue);margin:.2em 0 .4em!important}
.article{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);max-height:420px;overflow:auto;white-space:pre-wrap;font-size:.92rem}
.plan .day{border-top:1px dashed var(--line);padding:12px 0 6px}
.plan .day:first-of-type{border-top:none}
.plan .day h3{margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.plan .day h3 small{font:500 .78rem "IBM Plex Sans";color:var(--ink-2)}
.plan .today{background:var(--amber-soft);border-radius:8px;padding:12px 10px 6px;margin:0 -10px}
.plan ul{padding:0;margin:0}
.plan li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.plan input{margin-top:5px;width:18px;height:18px;accent-color:var(--pen);flex:none}
.plan li.done label{text-decoration:line-through;color:var(--ink-2)}
.plan .time{font:500 .8rem "IBM Plex Mono",monospace;color:var(--ink-2);min-width:58px;padding-top:3px}
.meterrow{display:grid;grid-template-columns:minmax(130px,190px) 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.meter .g{background:var(--green)} .meter .r{background:var(--pen)}
.weak{color:var(--pen);font-weight:600}
.score{font:500 .95rem "IBM Plex Mono",monospace}
.timerpill{position:fixed;left:16px;bottom:16px;z-index:9;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--paper-2);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:var(--shadow)}
.timerpill[hidden]{display:none}
.timerpill .clock{font:500 1.05rem "IBM Plex Mono",monospace;min-width:58px}
.timerpill.over .clock{color:var(--pen)}
.timerpill button{border:none;background:color-mix(in srgb,var(--paper-2) 18%,transparent);color:inherit;border-radius:999px;padding:3px 10px;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.on{opacity:1}
.partscore{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:560px){
  .sheet{padding:16px 14px 16px 28px}.sheet::before{left:14px}
  .meterrow{grid-template-columns:1fr auto}.meterrow .meter{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>ELIT100 <span>midterm</span></h1>
      <span class="count" id="count"></span>
      <button class="theme" id="themeBtn" type="button" aria-label="Açık ya da koyu temaya geç">Tema</button>
    </div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <div class="barlbl" id="barLbl"></div>
    <nav role="tablist" aria-label="Bölümler" id="tabs"></nav>
  </div>
</header>
<main id="main"></main>
<div class="timerpill" id="timer" hidden role="timer" aria-live="off">
  <span class="clock" id="clock">00:00</span>
  <button type="button" id="tPause">Duraklat</button>
  <button type="button" id="tStop">Bitir</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- içerik ---------- */
const OZET = [{"title": "1. Note-taking", "html": "<p>Kaynak: <code>WEEK 1/Essential academic skills NOTETAKING.pptx<\/code>, <code>Week 1 additional.pptx<\/code>.<\/p>\n<p><strong>Ne zaman:<\/strong> derste (lecture) ve araştırmada. Primary research = survey, interview, observation. Secondary research = library, Internet sources.<\/p>\n<p><strong>Neden not alınır:<\/strong> understanding, memory, exam revision, writing için kullanılabilir kayıt.<\/p>\n<p><strong>İpuçları (slayt 3):<\/strong><\/p>\n<ul><li>Her kaynak için author, title, publication information yaz.<\/li><li>Sadece ilgili olanı seç. Amaç hızlı yazmak değil, neyin yazmaya değer olduğunu seçmek.<\/li><li>Hocanın konu açma, geçiş, örnek, tanım ve vurgu ifadelerini tanı (signpost expressions): <em>first of all, for example, in contrast, the important thing here, to sum up<\/em>.<\/li><li>Sözsüz vurgu işaretlerine dikkat: jest, tonlama, ses yüksekliği.<\/li><li>Sembol ve kısaltma kullan.<\/li><li>Kendi stilini geliştir: linear, outline, mind map, Cornell.<\/li><\/ul>\n<p><strong>Not almanın üç parçası:<\/strong> active listening, identifying key ideas, reviewing notes afterwards.<\/p>\n<p><strong>Semboller (ezberle):<\/strong><\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Sembol<\/th><th>Anlam<\/th><\/tr><\/thead><tbody><tr><td>→<\/td><td>leads to, causes<\/td><\/tr><tr><td>=<\/td><td>equals, is<\/td><\/tr><tr><td>≠<\/td><td>is different from<\/td><\/tr><tr><td>↑ / ↓<\/td><td>increase / decrease<\/td><\/tr><tr><td>∵<\/td><td>because<\/td><\/tr><tr><td>∴<\/td><td>therefore<\/td><\/tr><tr><td>e.g.<\/td><td>for example<\/td><\/tr><tr><td>*<\/td><td>important<\/td><\/tr><tr><td>?<\/td><td>question<\/td><\/tr><tr><td>w/, w/out<\/td><td>with, without<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Örnek dönüşüm:<\/strong> \"Students who don't get enough sleep tend to have difficulty concentrating.\" → <code>insufficient sleep → ↓ concentration<\/code><\/p>\n<p><strong>İyi not / kötü not (slayt 5):<\/strong> Student A her şeyi alt alta düz yazmış (\"sleep is important, students need sleep...\"). Student B başlık koymuş, sembol kullanmış, ana fikri ve bir soruyu ayırmış. İki hafta sonra işe yarayan B'nin notu: düzenli, ilişkileri gösteriyor, ana fikir belli.<\/p>\n<p><strong>Not stilleri:<\/strong><\/p>\n<ul><li><strong>Outline:<\/strong> başlık, alt başlık, girintili hiyerarşi (I, A, 1...). Avantaj: ilişkiyi ve içeriği gösterir, düzenli. Dezavantaj: derste dikkat ister, hızlı derste zor, sıralı ilişkiyi her zaman göstermez.<\/li><li><strong>Cornell:<\/strong> sayfa üçe bölünür: sağda notlar, solda anahtar kelime ve sorular, altta özet.<\/li><li><strong>Mind map:<\/strong> ortada ana fikir, dallar halinde alt fikirler; resim ve renk kullanılır.<\/li><li><strong>Linear:<\/strong> düz satırlar halinde.<\/li><\/ul>\n<p><strong>Julian Treasure notu (sınavda video ya da metin özetlenebilir):<\/strong><\/p>\n<ul><li>Seven deadly sins of speaking: gossip, judging, negativity, complaining, excuses, exaggeration (lying), dogmatism (confusing facts with opinions).<\/li><li>HAIL: Honesty, Authenticity, Integrity, Love.<\/li><li>Ses araçları: register (göğüsten konuş), timbre, prosody (monoton olma), pace, silence, pitch, volume.<\/li><\/ul>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> sembol tablosu; signpost expressions; Cornell'in üç bölümü; \"select what is relevant, don't write faster\".<\/p><\/blockquote>"}, {"title": "2. Subjective vs. objective language", "html": "<p>Kaynak: <code>WEEK 2/Objective vs Subjective Language.pptx<\/code>, <code>Week 2 (1) Subjective and objective style.pptx<\/code>.<\/p>\n<p><strong>Objective language özellikleri:<\/strong> formal; fair and accurate; avoids exaggeration and bias; relies on facts rather than opinions; plain, without unnecessary flourishes; no personal, judgmental or emotive language.<\/p>\n<h3>Fact vs. opinion<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>Fact<\/th><th>Opinion<\/th><\/tr><\/thead><tbody><tr><td>Gözlenebilir, ölçülebilir, sayıyla gösterilebilir<\/td><td>Birinin fikri, yargısı<\/td><\/tr><tr><td>Genel olabilir (kanıt ister) ya da özel<\/td><td>Sıfat / zarf içerir (<em>bad, easy, serious<\/em>)<\/td><\/tr><tr><td>Kabul edilmek zorunda<\/td><td>Karşılaştırma kelimesi içerir (<em>more than, better, the most<\/em>)<\/td><\/tr><tr><td><\/td><td>Tartışılabilir<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Sınıflandırma alıştırmasındaki üç etiket (slayt 6-8):<\/strong><\/p>\n<ul><li><strong>O<\/strong> = Opinion. Örnek: <em>Punishment for identity thieves is not severe enough.<\/em><\/li><li><strong>F-NP<\/strong> = Fact that Needs Proof (genel bir gerçek, kanıt ister). Örnek: <em>Identity theft is increasing at a rapid pace.<\/em><\/li><li><strong>SSD<\/strong> = Specific Supporting Detail (sayı, tarih, kaynak, alıntı). Örnek: <em>In 2003, 60 percent of identity theft victims did not notify the police, according to the FTC.<\/em><\/li><\/ul>\n<p>Kural: opinion kanıt olarak kullanılamaz. Görüş bildirebilirsin ama onu fact ile desteklemelisin.<\/p>\n<h3>Kaçınılacak üç dil türü<\/h3>\n<ol><li><strong>Personal language<\/strong> (I, me, my, we).<ul><li><em>I believe that there is a discrepancy...<\/em> → <em>Research suggests that there is a discrepancy...<\/em><\/li><li><em>I interviewed a total of 22 parents...<\/em> → <em>A total of 22 parents were interviewed...<\/em><\/li><\/ul><\/li><li><strong>Judgmental language<\/strong> (kendi inancına göre hüküm verir).<ul><li><em>Jessen's (1956) theory is the most influential...<\/em> → <em>...remains one of the most influential...<\/em><\/li><li><em>International schools are always elitist.<\/em> → <em>International schools are often viewed as elitist.<\/em><\/li><li><em>Smith's paper made such a remarkable contribution<\/em> → <em>made a major contribution<\/em><\/li><\/ul><\/li><li><strong>Emotive language<\/strong> (superlative, abartı, duygu uyandırma).<ul><li><em>Japanese orthography is too difficult to be well-understood<\/em> → <em>is not generally well-understood<\/em><\/li><li><em>an incredibly vivacious school market<\/em> → <em>an active and dynamic school market<\/em><\/li><li><em>These really lucky people<\/em> → <em>These people<\/em><\/li><\/ul><\/li><\/ol>\n<p>Australian immunisation paragrafında işaretlenen subjektif unsurlar: personal language (<em>our, we<\/em>), judgment (<em>Of course, Obviously, Clearly<\/em>), assumption, emotive (<em>ghastly, precious, fragile<\/em>), exaggeration (<em>countless, all our children<\/em>), drama, exclamation marks (!!), capitalisation (TODAY).<\/p>\n<h3>Objektif yazma teknikleri<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>Teknik<\/th><th>Örnek<\/th><\/tr><\/thead><tbody><tr><td>Değerlendirme kelimesi yerine teknik kelime<\/td><td><em>amazing, badly<\/em> yerine <em>valid, reliable, inaccurate<\/em><\/td><\/tr><tr><td>Passive voice<\/td><td><em>I gathered the data...<\/em> → <em>The data was gathered...<\/em>; <em>I believe...<\/em> → <em>It is believed that...<\/em><\/td><\/tr><tr><td>Bilgiyi yer değiştir<\/td><td><em>I believe the model is valid, based on these findings.<\/em> → <em>These findings indicate that the model is valid.<\/em><\/td><\/tr><tr><td>Phrasal verb, idiom yerine tek kelime<\/td><td>talk into → persuade; carry out → conduct; find out → discover; look into → investigate; rule out → eliminate; tell fibs → lie<\/td><\/tr><tr><td>\"It / There / One\" özne<\/td><td><em>It is very difficult to...<\/em>, <em>There is a serious risk of...<\/em>, <em>One may ask whether...<\/em><\/td><\/tr><tr><td>Hedging: zarf<\/td><td><em>Driving at night is somewhat dangerous.<\/em> (a little, slightly, relatively, probably, often)<\/td><\/tr><tr><td>Hedging: modal<\/td><td><em>there could be accidents<\/em> (can, could, may, might, should)<\/td><\/tr><tr><td>Hedging: quantifier<\/td><td><em>a good number of people<\/em> (many, most, several, some, the majority of)<\/td><\/tr><tr><td>Hedging: conditional<\/td><td><em>...dangerous if you don't pay attention to the road.<\/em><\/td><\/tr><tr><td>Tentative fiiller<\/td><td><em>appears to, seems to, possibly, probably<\/em><\/td><\/tr><tr><td>always / every yerine<\/td><td><em>often, many, much<\/em><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>I yerine kullanılacak kalıplar:<\/strong> <em>The literature suggests that... / The results indicate that... / According to the figures... / It is evident that... / The research suggests that...<\/em><\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> üç kaçınılacak tür (personal, judgmental, emotive); O / F-NP / SSD; dört hedging aracı (adverb, modal, quantifier, conditional); yedi phrasal verb karşılığı.<\/p><\/blockquote>"}, {"title": "3. Paragraph", "html": "<p>Kaynak: <code>WEEK 3/Paragraph construction.pptx<\/code>, <code>A strong paragraph.pptx<\/code>. Quiz 1 bu konudandı (yazma, 30 dakika).<\/p>\n<h3>Yapı<\/h3>\n<p>Bir paragraf = <strong>topic sentence + supporting sentences + concluding sentence.<\/strong><\/p>\n<p><strong>Topic sentence<\/strong> iki parçalı: <strong>topic<\/strong> (konu) + <strong>controlling idea / direction<\/strong> (konu hakkında yorum).<\/p>\n<ul><li><em>Doing housework<\/em> (topic) + <em>can be very boring<\/em> (direction).<\/li><li><em>Living in a dormitory<\/em> + <em>can be challenging because of too many strict rules.<\/em><\/li><\/ul>\n<p>Topic sentence:<\/p>\n<ul><li><strong>Simple fact olamaz<\/strong> (geliştirilemez). <em>Susan paid $3.95 for her new blouse.<\/em> (F) → <em>Susan loves to shop for bargains.<\/em> (TS)<\/li><li><strong>Çok geniş olamaz<\/strong> (B, too broad). <em>The causes of war are many.<\/em> / <em>Politics affect the lives of many people.<\/em> / <em>The Internet has made the world a better place.<\/em><\/li><li>Genel ama tek yöne odaklı olmalı. <em>The birds are enjoyable to watch.<\/em> (TS)<\/li><\/ul>\n<p><strong>Supporting sentences:<\/strong> topic sentence'ı açıklar, örnek, detay, kanıt verir.<\/p>\n<p><strong>Concluding sentence:<\/strong><\/p>\n<ul><li>Ana fikri hatırlatır, güçlü bir izlenim bırakır.<\/li><li>Topic sentence'ı aynen tekrar etmez.<\/li><li><em>In conclusion<\/em> ya da <em>As you can see<\/em> ile başlamaz.<\/li><li>Yeni fikir getirmez.<\/li><\/ul>\n<h3>Güçlü paragrafın dört özelliği<\/h3>\n<ol><li><strong>Completeness:<\/strong> yeterli detay ve örnek var. Detaysız paragraf \"incomplete / undeveloped\" olur. (Dancing paragrafının ilk hali eksik, ikinci hali tam.)<\/li><li><strong>Logical order:<\/strong> cümleler mantıklı sırada. Türleri: zaman sırası (kar yağdı → sabah temizlendi), mekân sırası (odayı soldan sağa anlatma), önem sırası.<\/li><li><strong>Unity:<\/strong> her cümle topic sentence'a bağlı. Bağlı olmayan cümle (U) birliği bozar. Örnek: deniz kaplumbağası sayan bilim insanları paragrafında <em>\"The leatherback is the only kind of turtle that can live in the cold North Atlantic Ocean\"<\/em> cümlesi.<\/li><li><strong>Coherence:<\/strong> cümleler birbirine bağlı, liste gibi okunmaz. Üç teknik:<ul><li>Anahtar kelime tekrarı (ölçülü).<\/li><li>Cümle yapısı tekrarı (Pamuk: <em>I write because... I write because...<\/em>).<\/li><li><strong>Transition signals.<\/strong><\/li><\/ul><\/li><\/ol>\n<h3>Transition signals (ezberle)<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>İşlev<\/th><th>Kelimeler<\/th><\/tr><\/thead><tbody><tr><td>Addition<\/td><td>and, moreover, besides, what's more, additionally, in addition, furthermore, also<\/td><\/tr><tr><td>Contrast / concession<\/td><td>but, however, although, even though, in spite of, despite, in contrast, conversely, on the other hand, instead, while, whereas, nevertheless, yet, still<\/td><\/tr><tr><td>Comparison<\/td><td>likewise, similarly, in the same way, as ... as, compared to<\/td><\/tr><tr><td>Cause<\/td><td>because (of), since, for<\/td><\/tr><tr><td>Effect<\/td><td>so, as a result, consequently, therefore, thus<\/td><\/tr><tr><td>Purpose<\/td><td>so that, in order to<\/td><\/tr><tr><td>Example<\/td><td>for example, for instance, to illustrate, in particular, such as<\/td><\/tr><tr><td>Clarification<\/td><td>in other words, (to put it) more simply<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Dikkat: <em>despite / in spite of / because of / such as<\/em> + isim. <em>although / even though / because / since<\/em> + cümle.<\/p>\n<h3>Paragraf yazma adımları (slayt 24-29)<\/h3>\n<ol><li>Konuyu beyin fırtınası ile aç (university life → dormitory).<\/li><li>Bir yön seç (too many strict rules).<\/li><li>Yön hakkında fikir üret, en iyi 3-5'ini seç.<\/li><li>Topic sentence taslağı yaz.<\/li><li>Outline: TS, support ideas, concluding idea.<\/li><li>Paragrafı yaz.<\/li><\/ol>\n<h3>Hocanın geri bildirimde işaretlediği hatalar (slayt 28-31)<\/h3>\n<ul><li>Topic sentence ile içerik uyuşmuyor (?).<\/li><li>Açıklama eksik (Expl.).<\/li><li>Tekrar (Rep.).<\/li><li><em>you<\/em> ile okura doğrudan hitap, kişisel ve öznel dil.<\/li><li>Çok kısa, gelişmemiş paragraf (Paragraf 4).<\/li><\/ul>\n<h3>Model paragraf<\/h3>\n<blockquote><p>Living in a university dormitory can be challenging because of its strict rules. First of all, residents are usually not allowed to stay out late, so students who have evening classes or part-time jobs often find it difficult to return on time. In addition, visitors from outside the campus are generally not permitted, which limits students' social lives. Lights must also be turned off at a certain time, even during exam periods when many students need to study at night. Furthermore, most dormitories have no kitchen, and as a result, residents cannot prepare their own meals. These regulations may help maintain order, but they appear to conflict with the idea that university is a time of independence.<\/p><\/blockquote>\n<p>Kontrol: TS (topic + direction), dört support, transition signals, <em>I<\/em> yok, hedging var (<em>usually, generally, may, appear to<\/em>), concluding sentence yeni fikir getirmiyor ve <em>In conclusion<\/em> ile başlamıyor.<\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> TS = topic + controlling idea; F / B / TS ayrımı; dört özellik (completeness, logical order, unity, coherence); coherence'ın üç tekniği; transition tablosu; concluding sentence'ın üç yasağı.<\/p><\/blockquote>"}, {"title": "4. Norms in academic communication (formal vs. informal register)", "html": "<p>Kaynak: <code>WEEK 4/Norms in academic communication.pptx<\/code>.<\/p>\n<p><strong>Formal English nerede:<\/strong> academic writing, resumes, applications, business reports, technical and scientific writing, cold communication (tanımadığın kişiye yazma), iş ile ilgili her şey.<\/p>\n<p><strong>Informal → formal dönüşüm kuralları:<\/strong><\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Informal<\/th><th>Formal<\/th><\/tr><\/thead><tbody><tr><td>Kısaltmalar (<em>I'm, won't, can't<\/em>)<\/td><td>Açık yazım (<em>I am, will not, cannot<\/em>)<\/td><\/tr><tr><td><em>u, r, 4, asap, thx<\/em><\/td><td>Tam kelimeler<\/td><\/tr><tr><td><em>Hey, Hi<\/em><\/td><td><em>Dear Dr. Jones<\/em><\/td><\/tr><tr><td>Phrasal verb (<em>get in touch, find out<\/em>)<\/td><td>Tek kelime (<em>contact, discover<\/em>)<\/td><\/tr><tr><td><em>Thanks<\/em><\/td><td><em>Thank you<\/em><\/td><\/tr><tr><td><em>Sorry for...<\/em><\/td><td><em>I apologise for...<\/em><\/td><\/tr><tr><td><em>Because of...<\/em><\/td><td><em>Owing to... / Due to...<\/em><\/td><\/tr><tr><td><em>Can you tell us more about...?<\/em><\/td><td><em>We would be grateful if you could send us further information about...<\/em><\/td><\/tr><tr><td><em>Here are...<\/em><\/td><td><em>Please find enclosed / attached...<\/em><\/td><\/tr><tr><td><em>I've got some bad news.<\/em><\/td><td><em>We regret to inform you that...<\/em><\/td><\/tr><tr><td><em>I've got some good news.<\/em><\/td><td><em>We are pleased to inform you that...<\/em><\/td><\/tr><tr><td><em>What exactly do you need?<\/em><\/td><td><em>Please let us know your exact requirements.<\/em><\/td><\/tr><tr><td><em>If you need...<\/em><\/td><td><em>Should you require...<\/em><\/td><\/tr><tr><td><em>Just get in touch<\/em><\/td><td><em>Please do not hesitate to contact me<\/em><\/td><\/tr><tr><td><em>All the best<\/em><\/td><td><em>Kind regards / Yours sincerely<\/em><\/td><\/tr><tr><td><em>I got it 14 Sept.<\/em><\/td><td><em>received 14 September 2002<\/em><\/td><\/tr><tr><td><em>I've set a meeting... to talk about<\/em><\/td><td><em>A meeting has been scheduled... to discuss<\/em><\/td><\/tr><tr><td>Kısaltma: <em>inc., exp., G.M., re.<\/em><\/td><td>Açık yazım: <em>income, expenditure, General Manager, concerning<\/em><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Formal letter yapısı:<\/strong><\/p>\n<ul><li>Sağ üst: gönderenin adresi, tarih.<\/li><li>Sol: alıcının adı, unvanı, kurumu, adresi; varsa referans / konu satırı (<em>Re:<\/em>).<\/li><li>Salutation:<ul><li><em>Dear Sir/Madam<\/em> (adı bilmiyorsan) → <em>Yours faithfully<\/em><\/li><li><em>Dear Ms Howes<\/em> (adı biliyorsan) → <em>Yours sincerely<\/em><\/li><li><em>Dear Sirs<\/em> (şirkete yazarken)<\/li><li><em>Yours truly<\/em> Amerikan İngilizcesi.<\/li><\/ul><\/li><li>E-postada <em>Best regards / Best wishes<\/em> daha yaygın; <em>Yours sincerely / faithfully<\/em> mektupta.<\/li><li>Unvanlar: <em>Mr<\/em> (erkek), <em>Mrs<\/em> (evli kadın), <em>Ms<\/em> (medeni durum belirtilmeden kadın). ABD'de nokta alır: <em>Ms. Howes<\/em>.<\/li><li>Tarih: İngiliz <em>6 May 2012<\/em>, Amerikan <em>May 6, 2012<\/em>.<\/li><li>İmza: imza, altına ad soyad ve görev.<\/li><li>Kısaltmalar: <em>encl.<\/em> (ekte belge var), <em>cc<\/em> (kopya gidenler), <em>p.p.<\/em> (başkası adına imza), <em>Re.<\/em> (regarding).<\/li><\/ul>\n<p><strong>To / Cc / Bcc:<\/strong> To = asıl alıcı. Cc = bilgilendirilecek kişiler, herkes görür. Bcc = gizli kopya, diğerleri görmez.<\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> Sir/Madam → faithfully, isim → sincerely; Mr / Mrs / Ms; informal-formal tablosundaki ilk 12 satır.<\/p><\/blockquote>"}, {"title": "5. Email writing (profesöre e-posta)", "html": "<p>Kaynak: <code>WEEK 4/Norms in academic communication.pptx<\/code> slayt 14-16, <code>email_writing_exercises.pptx<\/code>.<\/p>\n<h3>Hocanın 10 kuralı (slayt 16)<\/h3>\n<ol><li>Akademik hesabını kullan.<\/li><li>Açık bir subject line yaz.<\/li><li>Hocanın unvanı ve soyadıyla selamla (<em>Dear Professor Hanes<\/em>).<\/li><li>Kim olduğunu hatırlat (ad, ders, section).<\/li><li>Konuya sadık kal, gereksiz detay yok.<\/li><li>Hocadan ne istediğini açıkça söyle.<\/li><li>Ton profesyonel: emoji yok, kişisel detay yok.<\/li><li>Rica kibar olsun.<\/li><li>Dilbilgisi, yazım, noktalama kontrolü.<\/li><li>Kibar bir kapanışla bitir.<\/li><\/ol>\n<h3>Kalıplar<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>Bölüm<\/th><th>Formal<\/th><th>Informal<\/th><\/tr><\/thead><tbody><tr><td>Selamlama<\/td><td>Dear Professor / Dr. + soyad; Dear Mr / Ms + soyad; Dear Sir/Madam<\/td><td>Hi Jags; Dear Jay<\/td><\/tr><tr><td>Açılış<\/td><td>Thank you for your email of 14 May concerning...; In reply to your letter...; Following our phone conversation...<\/td><td>Thanks for your email...; Just a quick note to...<\/td><\/tr><tr><td>Amaç<\/td><td>I am writing to request / inform / confirm...; This email is to...<\/td><td>Just a quick note to...<\/td><\/tr><tr><td>Rica<\/td><td>Could you please...?; Would you please...?; I would be grateful if you could...; Kindly send...<\/td><td>Can you...?<\/td><\/tr><tr><td>Kötü haber / özür<\/td><td>I am sorry to inform you...; Unfortunately...; I apologise for...<\/td><td>Sorry about...<\/td><\/tr><tr><td>Ek<\/td><td>Please find attached...; I attach...; Please find enclosed... (mektup)<\/td><td>Here's...<\/td><\/tr><tr><td>Kapanış cümlesi<\/td><td>I look forward to hearing from you.; Please do not hesitate to contact me if you need any further information.<\/td><td>Hear from you soon.; Let me know if you need anything else.; Take care.<\/td><\/tr><tr><td>İmza<\/td><td>Yours sincerely / Yours faithfully / Kind regards / Best regards<\/td><td>Best wishes; See you soon; Take care<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Kötü ve iyi örnek (ders slaytı)<\/h3>\n<p>Kötü: <em>Dear Tony, I know the deadline 4 our first assignment was last week. But, you see, I had a problm. My kitchen tap was leaking... Really sorry for being late! ... Hope u can accept this excuse. Here's my paper. See you<\/em><\/p>\n<p>Hatalar: hocanın adı ile hitap (Tony), <em>4<\/em> ve <em>u<\/em>, yazım hatası (<em>problm<\/em>), gereksiz kişisel detay (musluk, tesisatçı), ünlem, <em>Here's<\/em>, <em>See you<\/em>, kim olduğu yazmıyor, konu satırı yok, ne istediği belli değil.<\/p>\n<p>İyi: <em>Dear Professor Hanes, I am Ali Razaq, ELIT100, Section 2. I am writing to request an extension... However, I had some urgent personal issues... I apologize for this tardiness... Please find attached my assignment. Best regards, Ali<\/em><\/p>\n<h3>E-posta iskeleti (sınavda bunu kullan)<\/h3>\n<pre><code>Subject: [Konu]: [Ders kodu], Section [X]\n\nDear Professor [Soyad],\n\nI am [Ad Soyad], a student in your [ELIT100], Section [X].\n\nI am writing to [inform you / request / ask] [konu]. [1-2 cümle gerekçe, gereksiz detay yok.]\n\n[Talep / ayrıntılar: 2-4 cümle. Hocanın ne yapmasını istediğini açık söyle.]\n\nI would be grateful if you could [talep]. Please find attached [belge], if relevant.\n\nThank you for your understanding. I look forward to hearing from you.\n\nKind regards,\n[Ad Soyad]\n[Öğrenci numarası]<\/code><\/pre>\n<p>Ders slaytındaki görev (Email Exercise 1): bir geziye gidiyorsun, derse gelemeyeceksin; hocaya nereye, neden, ne kadar süre, hangi yerleri ziyaret edeceğin ve bunun bölümünle ilgisi ile e-posta yaz. Model cevap <code>deneme-1-cevaplar.md<\/code> Part D'de.<\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> iskelet; 10 kural; <em>I am writing to... / I would be grateful if you could... / Please find attached... / I look forward to hearing from you.<\/em><\/p><\/blockquote>"}, {"title": "6. Summarising ve paraphrasing", "html": "<p>Kaynak: <code>WEEK 5/Essential academic skills SUMMARIZING PARAPHRASING.pptx<\/code>, <code>WEEK 5/articles for practice/<\/code>.<\/p>\n<h3>Summary<\/h3>\n<ul><li>Metnin ana noktalarının kısa hali (who, when, where, why, what, how).<\/li><li>Bir cümle ile bir paragraf arası.<\/li><\/ul>\n<p><strong>Yap:<\/strong><\/p>\n<ul><li>Önemli noktaları işaretle.<\/li><li>Yazarın soyadını etiket olarak kullan + reporting verb: <em>argue, claim, note, emphasise, point out, suggest, add<\/em> (\"Brown argues that...\").<\/li><li>Yazarın argümanını <strong>present simple<\/strong> ile anlat.<\/li><li>Kendi kelimelerinle yaz: eş anlamlı kelime ve yapı değişikliği.<\/li><\/ul>\n<p><strong>Yapma:<\/strong><\/p>\n<ul><li>Gereksiz detay (Treasure özetinde annesinin 1 Ekim yorumu).<\/li><li>Kaynakta olmayan bilgi.<\/li><li>Kendi değer yargın.<\/li><\/ul>\n<p><strong>Özet iskeleti:<\/strong><\/p>\n<pre><code>In an article published on [site / dergi] in [yıl], [Yazar] [discusses / argues / explains] [ana fikir].\nAccording to [Soyad], [ana nokta 1]. [Soyad] also points out that [ana nokta 2].\nFurthermore, [ana nokta 3]. [Soyad] concludes that [sonuç].<\/code><\/pre>\n<p><strong>Üç Treasure özetinin karşılaştırması (slayt 5-7):<\/strong> A kısa ama sadece liste, geçmiş ve şimdiki zaman karışık. B gereksiz detay içeriyor (annesi) ve listeyi kopyalıyor. C en iyisi: kendi kelimeleri, reporting verbs (<em>elaborates on, argues<\/em>), açıklama, liste değil. Sınavda C gibi yaz.<\/p>\n<h3>Paraphrase<\/h3>\n<ul><li>Kaynaktaki bilgiyi <strong>kendi kelimelerinle<\/strong>, <strong>aynı uzunlukta<\/strong>, <strong>aynı fikirlerle<\/strong> yeniden yaz.<\/li><li>Sonuna kaynağı ekle: <em>(Snell, 2005)<\/em>.<\/li><li>Sadece eş anlamlı kelime koymak = plagiarism. Teknikleri birleştir.<\/li><\/ul>\n<p><strong>Beş teknik:<\/strong><\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Teknik<\/th><th>Örnek<\/th><\/tr><\/thead><tbody><tr><td>Synonyms<\/td><td><em>declared → announced; poses a national security threat → could harm the nation's security<\/em><\/td><\/tr><tr><td>Word form değiştir<\/td><td><em>Medical professor → a professor of medicine; global changes → changes across the globe<\/em><\/td><\/tr><tr><td>Sentence structure (active/passive, birleştir, böl, bağlaç değiştir)<\/td><td><em>Angier reported that malaria kills more than one million people annually.<\/em> → <em>Every year, more than one million people are killed by malaria (Angier, 2001).<\/em><\/td><\/tr><tr><td>Attribution signal değiştir<\/td><td><em>\"...,\" veterinarian Mark Walters declared<\/em> → <em>According to Mark Walters, a veterinarian...<\/em><\/td><\/tr><tr><td>Sayı / yüzde biçimi değiştir<\/td><td><em>13% → less than 15 percent; 46 percent → almost half<\/em><\/td><\/tr><tr><td>(Plagiarism slaytından) kelimeyi genişlet / tanımla<\/td><td><em>know tax laws → know the general workings and effects of taxation laws<\/em><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Summary vs. paraphrase vs. quotation<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Uzunluk<\/th><th>Kelimeler<\/th><th>Kaynak<\/th><\/tr><\/thead><tbody><tr><td>Quotation<\/td><td>Orijinal kadar<\/td><td>Aynen, tırnak içinde<\/td><td>Gerekli, sayfa no ile<\/td><\/tr><tr><td>Paraphrase<\/td><td>Yaklaşık aynı<\/td><td>Kendi kelimelerin<\/td><td>Gerekli<\/td><\/tr><tr><td>Summary<\/td><td>Çok daha kısa, sadece ana noktalar<\/td><td>Kendi kelimelerin<\/td><td>Gerekli<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Örnek (Jordan, 1997):<\/p>\n<ul><li>Quotation: <em>Jordan (1997: 8) comments that 'study skills are not something acquired instinctively'.<\/em><\/li><li>Paraphrase: <em>As students do not obtain study skills automatically, it is very important to teach them these skills (Jordan, 1997).<\/em><\/li><li>Summary: <em>It is important to teach study skills to students (Jordan, 1997).<\/em><\/li><\/ul>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> summary do / don't; reporting verbs; present simple; beş paraphrase tekniği; \"sadece synonym = plagiarism\".<\/p><\/blockquote>"}, {"title": "7. Plagiarism ve APA", "html": "<p>Kaynak: <code>WEEK 6/Plagiarism APA.pptx<\/code>, <code>APA_7th_handout__14Oct21_.pdf<\/code>.<\/p>\n<h3>Tanım<\/h3>\n<p>Plagiarism: başkasının yaratıcı işini uygun kaynak göstermeden kendi özgün işin gibi sunmak (The University of Melbourne, 2005). Sadece kelimeleri değil fikirleri, argümanları, diyagram, grafik, resim, besteyi ve organizasyon yapısını da kapsar. Kısaca: intellectual dishonesty or theft.<\/p>\n<h3>Plagiarism türleri (slayt 4)<\/h3>\n<ul><li>Metin, fikir, sonuç, tablo, program, tasarım, resim ya da ses kopyalamak (ya da kopyalanmasına izin vermek).<\/li><li>Küçük değişikliklerle paraphrase edip anlamı, biçimi ve fikir sırasını korumak.<\/li><li>Başkalarının işlerinden parçaları birleştirip yeni bir bütün yapmak.<\/li><li>Aynı ödevi iki ayrı ders için iki kez teslim etmek (self-plagiarism).<\/li><li>Başkasıyla birlikte yapılmış işi bireysel iş gibi sunmak (collusion).<\/li><\/ul>\n<h3>Library metni: beş versiyon (slayt 5-10)<\/h3>\n<p>Orijinal: <em>The Internet has changed the appearance of libraries and how librarians work today. The library is no longer confined to the four walls of a building...<\/em> (Yong, 2001, p. 294)<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Versiyon<\/th><th>Ne yapılmış<\/th><th>Plagiarism mı?<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Kelimeler aynen kopyalanmış, kaynak yok<\/td><td>Evet<\/td><\/tr><tr><td>2<\/td><td>Aynı kopya + kaynak var ama tırnak yok<\/td><td>Evet<\/td><\/tr><tr><td>3<\/td><td>Cümlelerin yeri değiştirilmiş, kelimeler aynı, kaynak var<\/td><td>Evet<\/td><\/tr><tr><td>4<\/td><td>İyi paraphrase ama kaynak yok<\/td><td>Evet<\/td><\/tr><tr><td>5<\/td><td>İyi paraphrase + kaynak<\/td><td><strong>Hayır, doğru<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Quote, paraphrase, summary kuralları<\/h3>\n<ul><li><strong>Direct quotation:<\/strong> aynen kelimeler. Kısa alıntıda tırnak, uzun alıntıda (40+ kelime) girintili blok. Sadece kaynak yazmak yetmez, tırnak da gerekir.<\/li><li><strong>Paraphrase:<\/strong> kendi kelimelerin. Kaynak <strong>yine gerekli<\/strong>. Kısmi paraphrase (birkaç kelime değiştirmek) plagiarism. Orijinalden ayırt edici bir ifade tırnaksız kalırsa plagiarism.<\/li><li>İyi bir araştırma yazısı çoğunlukla senin yazından (paraphrase dahil) oluşur. Alıntı sadece destek içindir.<\/li><\/ul>\n<h3>Motivation örnekleri (slayt 18-20), ezberle<\/h3>\n<p>Orijinal: <em>Motivation is such a key factor that it appears to be more important in learning than intelligence.<\/em> (Newble &amp; Cannon, 1989, p. 2)<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Örnek<\/th><th>Kabul?<\/th><th>Neden<\/th><\/tr><\/thead><tbody><tr><td>Aynen yazılmış, tırnak ve kaynak yok<\/td><td>Hayır<\/td><td>Tırnak ve kaynak eksik<\/td><\/tr><tr><td>Tırnak var, kaynak yok<\/td><td>Hayır<\/td><td>Kaynak eksik<\/td><\/tr><tr><td>\"...\" (Newble &amp; Cannon, 1989, p. 2)<\/td><td>Evet<\/td><td>Tırnak + kaynak<\/td><\/tr><tr><td>According to Newble and Cannon (1989, p. 2), \"...\"<\/td><td>Evet<\/td><td>Tırnak + kaynak<\/td><\/tr><tr><td>A key factor in learning is motivation, which appears to be more important than intelligence (Newble &amp; Cannon, 1989, p. 2).<\/td><td>Hayır<\/td><td>Orijinale çok yakın<\/td><\/tr><tr><td>Motivation may be more critical than intelligence in learning (Newble &amp; Cannon, 1989, p. 2).<\/td><td>Evet<\/td><td>Gerçek paraphrase + kaynak<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Kaynak gösterilmesi gerekmeyenler<\/h3>\n<ol><li>Kendi fikirlerin, argümanların, kendi araştırma sonuçların.<\/li><li><strong>Common knowledge<\/strong> (genel bilinen gerçekler): <em>World War I began in 1914 and ended in 1918.<\/em><\/li><li>Genel başvuru kaynaklarındaki bilgiler (ders kitabı, sözlük, ansiklopedi). Ama istatistik yine de verilmeli.<\/li><\/ol>\n<p>Dikkat: common knowledge <strong>sadece fact<\/strong>. Yorum ve görüş kaynak ister.<\/p>\n<ul><li><em>J.S. Bach was a famous composer during the Baroque period.<\/em> → kaynak gerekmez.<\/li><li><em>J.S. Bach was the greatest composer of the Baroque period (Sterling, 1977).<\/em> → görüş, kaynak gerekir.<\/li><li>Kesin tarih, isim, yaş gibi özel detaylar kaynak ister (Lincoln, 14 April 1865, John Wilkes Booth).<\/li><li>Common knowledge'ı bile aynen kopyalarsan tırnak ve kaynak gerekir.<\/li><li>Emin değilsen kaynak göster.<\/li><\/ul>\n<p>Ayrıca kaynak gösterilecekler: tablo, grafik, resim; ders notları ve kişisel görüşmeden (personal communication) alınan fikirler.<\/p>\n<h3>Neden kaynak gösterilir<\/h3>\n<p>Başkasının sahipliğini tanımak; geniş araştırma yaptığını gösterip güvenilirlik kazanmak; okurun kaynağa ulaşmasını sağlamak; argümana kanıt ve otorite eklemek; akademik değerleri korumak; plagiarism'den kaçınmak.<\/p>\n<h3>Referans yöntemleri ve stiller<\/h3>\n<ul><li><strong>In-text:<\/strong> (Cole, 2011, p. 45) → APA, MLA, Harvard.<\/li><li><strong>Numeric:<\/strong> (7) → Vancouver (tıp, fen).<\/li><li><strong>Footnote:<\/strong> ³ → Chicago (iş, tarih, sanat).<\/li><li>APA: eğitim, psikoloji, bilim. MLA: beşeri bilimler.<\/li><\/ul>\n<h3>APA 7 in-text citation (ezberle)<\/h3>\n<div class=\"tblwrap\"><table><thead><tr><th>Yazar sayısı<\/th><th>Parenthetical<\/th><th>Narrative<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>(Frogmouth, 2020)<\/td><td>Frogmouth (2020)<\/td><\/tr><tr><td>2<\/td><td>(Frogmouth <strong>&amp;<\/strong> Spoonbill, 2020)<\/td><td>Frogmouth <strong>and<\/strong> Spoonbill (2020)<\/td><\/tr><tr><td>3+<\/td><td>(Frogmouth et al., 2020)<\/td><td>Frogmouth et al. (2020)<\/td><\/tr><tr><td>Kurum<\/td><td>(UNICEF, 2023)<\/td><td>UNICEF (2023)<\/td><\/tr><tr><td>Tarih yok<\/td><td>(Johnson, n.d.)<\/td><td>Johnson (n.d.)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Kurallar:<\/strong><\/p>\n<ul><li>Direct quote'ta sayfa no zorunlu: <em>(Frogmouth, 2020, p. 3)<\/em>, birden çok sayfa <em>pp. 7-8<\/em>.<\/li><li>Sayfa yoksa (web): <em>(Johnson, 2023, para. 4)<\/em>.<\/li><li>İki yazarda her seferinde iki soyadı da yazılır. Parantez içinde <strong>&amp;<\/strong>, cümle içinde <strong>and<\/strong>.<\/li><li>3+ yazarda <strong>ilk atıftan itibaren<\/strong> <em>et al.<\/em> kullanılır. <em>et al.<\/em> = <em>et alia<\/em> = \"and others\". İtalik değil, <em>al.<\/em> sonunda nokta var. Kaynakçada (reference list) <em>et al.<\/em> kullanılmaz, tüm yazarlar yazılır.<\/li><li><strong>Block quotation (40+ kelime):<\/strong> tırnak yok; soldan 0.5 inç (1.27 cm) girinti; çift satır aralığı; nokta alıntının sonunda, kaynaktan <strong>önce<\/strong>: <em>...in the classroom. (Haelermans, 2022, p. 243)<\/em><\/li><li>Kurum adı kısaltması: ilk kullanımda <em>(Australian Institute of Health and Welfare [AIHW], 2020)<\/em>, sonra <em>(AIHW, 2020)<\/em>.<\/li><\/ul>\n<p><strong>Reference list (web içeriği):<\/strong> <em>Author, A. A. (Year, Month Day). Title in italics and sentence case. Site Name. URL<\/em> Örnek: <em>James, F. (2019, November 5). One mum's plea to the education system. Kidspot. https://tinyurl.com/vxa76lb<\/em><\/p>\n<p><strong>Narrative citation fiilleri:<\/strong> <em>According to X (2022), ... / X (2022) found / argues / points out / explains / suggests that ... / As X (2022) points out, ... / Research by X (2022) suggests that ...<\/em><\/p>\n<blockquote><p><strong>Ezberlenecekler:<\/strong> beş library versiyonu; motivation tablosu; &amp; ve and; et al. kuralları; p. / pp. / para.; block quote altı kuralı; common knowledge sadece fact.<\/p><\/blockquote>"}];

  {t:"mc", id:"n4", q:"<p>Cornell yönteminde sayfanın altındaki bölüm ne için?</p>", o:["Anahtar kelimeler ve sorular","Dersteki notlar","Kısa özet","Kaynakça"], a:2,
   why:"Sağ büyük alan: notlar. Sol dar sütun: anahtar kelime ve sorular. Alt: özet."},
  {t:"mc", id:"n5", q:"<p>Derste hoca hangi ifadeyle bir özet yapacağını gösterir?</p>", o:["for example","in contrast","to sum up","first of all"], a:2,
   why:"Signpost expressions: <em>first of all</em> (giriş), <em>for example</em> (örnek), <em>in contrast</em> (karşıtlık), <em>to sum up</em> (özet)."},
  {t:"mc", id:"n6", q:"<p>Kursa göre iyi not almanın amacı nedir?</p>", o:["Her şeyi kaçırmadan, olabildiğince hızlı yazmak","Neyin yazmaya değer olduğunu seçmek","Hocanın cümlelerini aynen yazmak","Sadece slaytları kopyalamak"], a:1,
   why:"“You should learn to identify what is worth writing down, not simply write faster.” Üç parça: active listening, identifying key ideas, reviewing afterwards."},
  {t:"mc", id:"n7", q:"<p>Outline (girintili başlık) yönteminin slayttaki dezavantajı hangisi?</p>", o:["İlişkileri hiç göstermez","Hızlı tempolu derslerde iyi çalışmaz","Sembol kullanılamaz","Sadece kâğıtta yapılabilir"], a:1}
 ]},
 {id:"obj", tag:"obj", title:"Objective / subjective", items:[
  {t:"sel", id:"o1", q:"<p>Her cümleyi etiketle.</p>", ch:OFNS, items:[
    {s:"Smoking is a bad habit.", a:"O"},
    {s:"Cigarettes are addictive.", a:"F-NP"},
    {s:"In 2000, 31,000 cases of identity theft were reported to the FTC; in 2003, the number was 210,000.", a:"SSD"},
    {s:"Identity theft is more serious than any other type of theft.", a:"O"},
    {s:"Most victims of identity theft are young adults.", a:"F-NP"},
    {s:"The FTC reports that there were more victims in the age group 18-29 than in any other group.", a:"SSD"}],
   why:"O: yargı, karşılaştırma, sıfat (<em>bad, more serious</em>). F-NP: genel gerçek, kanıt ister. SSD: sayı, tarih, kurum adı."},
  {t:"mc", id:"o2", q:"<p>En objektif cümle hangisi?</p>", o:["I believe the new policy is a total disaster.","The new policy is absolutely terrible for everyone!","The findings suggest that the new policy may have negative effects on some employees.","Obviously, the new policy failed."], a:2},
  {t:"mc", id:"o3", q:"<p><em>carry out</em> yerine akademik fiil:</p>", o:["do","conduct","make","finish"], a:1,
   why:"talk into → persuade · carry out → conduct · find out → discover · look into → investigate · rule out → eliminate"},
  {t:"mc", id:"o4", q:"<p><em>rule out</em> yerine:</p>", o:["eliminate","investigate","discover","persuade"], a:0},
  {t:"mc", id:"o5", q:"<p><em>“...a good number of people could have an accident.”</em> Altı çizili hedging aracı (<em>a good number of</em>) hangisi?</p>", o:["adverb","modal verb","quantifier","qualifying conditional"], a:2,
   why:"Dört hedging aracı: adverb (<em>somewhat, relatively</em>), modal (<em>could, may</em>), quantifier (<em>many, some, a good number of</em>), conditional (<em>if you don't pay attention...</em>)."},
  {t:"mc", id:"o6", q:"<p><em>“It is believed that students should not be required to do homework.”</em> Hangi teknik?</p>", o:["moving information around","passive voice","hedging with a quantifier","avoiding phrasal verbs"], a:1},
  {t:"mc", id:"o7", q:"<p>Hangisi objective language özelliği <strong>değildir</strong>?</p>", o:["Formal","Fair and accurate","Relies on facts rather than opinions","Uses superlatives to make the reader feel strongly"], a:3},
  {t:"mc", id:"o8", q:"<p><em>“Gorard's study provided an awesome classification model.”</em> En iyi düzeltme:</p>", o:["...provided an amazing classification model.","...provided a concise classification model.","...provided the best classification model ever.","I think Gorard's study provided a good model."], a:1,
   why:"Duygusal / yargılayıcı sıfat yerine teknik değerlendirme: <em>concise, valid, reliable</em>."}
 ]},
 {id:"para", tag:"para", title:"Paragraph", items:[
  {t:"sel", id:"p1", q:"<p>F (simple fact), B (too broad), TS (topic sentence)?</p>", ch:FBT, items:[
    {s:"The background music in the grocery store was annoying.", a:"TS"},
    {s:"In 2007, Daylight Savings Time started on March 11.", a:"F"},
    {s:"Politics affect the lives of many people.", a:"B"},
    {s:"Stephanie's room is a disaster.", a:"TS"},
    {s:"The Internet has made the world a better place.", a:"B"},
    {s:"In the United States, 350 obese children had weight-loss surgery in 2004.", a:"F"},
    {s:"Cross-country skiing provides great exercise.", a:"TS"},
    {s:"The 911 call came into the police department at 12:00 noon.", a:"F"},
    {s:"Throughout the world, family structures vary.", a:"B"},
    {s:"The Internet has changed Tina's social life.", a:"TS"}],
   why:"F: geliştirilemeyen tek bilgi. B: bir paragrafa sığmaz. TS: genel ama tek yöne odaklı (topic + controlling idea)."},
  {t:"sel", id:"p2", q:"<p>TS / S / U?</p>", ch:TSU, items:[
    {s:"Mechanics enjoy looking through salvage yards to find engine parts.", a:"S"},
    {s:"Rebuilding an engine can be fun.", a:"TS"},
    {s:"Many new car models have elaborate computer systems.", a:"U"}]},
  {t:"sel", id:"p3", q:"<p>TS / S / U?</p>", ch:TSU, items:[
    {s:"Injured birds are nurtured back to health.", a:"S"},
    {s:"Wildlife centers are dedicated to helping sick and injured animals.", a:"TS"},
    {s:"Wildlife centers are often privately funded.", a:"U"}]},
  {t:"mc", id:"p4", q:"<p>Bilim insanlarının leatherback kaplumbağalarını nasıl saydığını anlatan paragrafta birliği bozan cümle hangisi?</p>", o:["The observers work, no matter what the weather is like.","They count the turtles as they come ashore.","The leatherback is the only kind of turtle that can live in the cold North Atlantic Ocean.","Then, later, they count the eggs that hatch."], a:2,
   why:"Paragrafın konusu gözlemcilerin nasıl çalıştığı. Kaplumbağa türüyle ilgili bilgi bu fikri desteklemiyor: <strong>unity</strong> bozuluyor."},
  {t:"mc", id:"p5", q:"<p>Concluding sentence için hangisi <strong>yapılmamalı</strong>?</p>", o:["Ana fikri hatırlatmak","Okurda güçlü bir izlenim bırakmak","Cümleye <em>In conclusion</em> ile başlamak","Topic sentence'ı farklı kelimelerle yansıtmak"], a:2,
   why:"Üç yasak: topic sentence'ı aynen tekrar etmek, <em>In conclusion / As you can see</em> ile başlamak, yeni fikir getirmek."},
  {t:"mc", id:"p6", q:"<p>Topic sentence'ın iki parçası:</p>", o:["Topic + controlling idea (direction)","Fact + example","Introduction + conclusion","Claim + citation"], a:0},
  {t:"mc", id:"p7", q:"<p>Pamuk'un <em>“I write because... I write because...”</em> örneği hangi coherence tekniği?</p>", o:["Repetition of key words","Repetition of sentence structures","Transition signals","Logical order"], a:1},
  {t:"mc", id:"p8", q:"<p>Detay ve örnek içermeyen, belirsiz kalan paragrafta hangi özellik eksik?</p>", o:["Unity","Coherence","Completeness","Logical order"], a:2},
  {t:"sel", id:"p9", q:"<p>Çocuk yetiştirme paragrafındaki boşluklar (slayt alıştırması). Her boşluğa uygun bağlacı seç.</p>", ch:["For instance","such as","Since","Furthermore","Despite","As a result","To illustrate","because","Besides","nevertheless"], items:[
    {s:"(1) ___, children often catch illnesses ...", a:"For instance"},
    {s:"(2) ... illnesses ___ the flu, cold, measles, etc.", a:"such as"},
    {s:"(3) ___ their immune system is not so strong, parents are often concerned ...", a:"Since"},
    {s:"(4) ___, raising children leaves parents very little time for themselves.", a:"Furthermore"},
    {s:"(5) ___ being rewarding, parenting is a round-the-clock job.", a:"Despite"},
    {s:"(6) ___, parents rarely have any time to go out on their own ...", a:"As a result"},
    {s:"(7) ___, children's clothes often cost a fortune ...", a:"To illustrate"},
    {s:"(8) ... have to be bought often ___ children grow out of them so quickly.", a:"because"},
    {s:"(9) ___, toys, books and other school supplies are costly ...", a:"Besides"},
    {s:"(10) ... a considerable challenge, which parents are ___ happy to take on.", a:"nevertheless"}]}
 ]},
 {id:"reg", tag:"reg", title:"Register ve e-posta", items:[
  {t:"mc", id:"r1", q:"<p><em>Dear Sir/Madam</em> ile başlayan mektup nasıl biter?</p>", o:["Yours sincerely","Yours faithfully","See you soon","Cheers"], a:1,
   why:"Adı bilmiyorsan <em>Dear Sir/Madam → Yours faithfully</em>. Adı biliyorsan <em>Dear Ms Howes → Yours sincerely</em>. E-postada <em>Kind / Best regards</em> yaygın."},
  {t:"mc", id:"r2", q:"<p><em>Ms</em> unvanı ne zaman kullanılır?</p>", o:["Sadece evli kadınlar için","Medeni durumu belirtmeden kadınlar için","Erkekler için","Profesörler için"], a:1},
  {t:"mc", id:"r3", q:"<p><strong>Bcc</strong> satırındaki kişiler:</p>", o:["Asıl alıcılardır","Kopya alır ve herkes onları görür","Kopya alır ama diğer alıcılar onları görmez","Cevap vermek zorundadır"], a:2},
  {t:"mc", id:"r4", q:"<p><em>“I've got some bad news.”</em> formal hali:</p>", o:["We regret to inform you that...","Sorry, bad news...","Unfortunately for you...","I've some bad news to tell."], a:0},
  {t:"mc", id:"r5", q:"<p><em>“If you need further details...”</em> en formal hali:</p>", o:["If you want more stuff...","Should you require further details...","Just ask if you need more...","In case you need details..."], a:1},
  {t:"mc", id:"r6", q:"<p>Hocaya e-postanın en uygun ilk satırları:</p>", o:["Hey Prof! Quick question...","Dear Tony,","Dear Professor Hanes, I am Ali Razaq, ELIT100, Section 2.","To whom it may concern, it's Ali."], a:2,
   why:"Unvan + soyad ile selamla, sonra kim olduğunu ve dersini söyle."},
  {t:"mc", id:"r7", q:"<p>Profesöre gecikme e-postasında hangisi olmamalı?</p>", o:["Açık bir konu satırı","Ne istediğini net söylemek","Mutfak musluğunun nasıl bozulduğunun detayları","Kibar bir kapanış"], a:2,
   why:"Kural: “Stick to the point, leave out any extraneous details.” Kötü örnekteki tesisatçı hikâyesi tam olarak bu."},
  {t:"mc", id:"r8", q:"<p><em>encl.</em> ne anlama gelir?</p>", o:["Mektupla birlikte belge gönderildi","Kopyası şu kişilere gitti","Başkası adına imzalandı","Konusu şudur"], a:0,
   why:"encl. = enclosed · cc = carbon copies · p.p. = başkası adına imza · Re. = regarding"},
  {t:"mc", id:"r9", q:"<p><em>“Because of the delay...”</em> formal karşılığı:</p>", o:["Owing to the delay...","Coz of the delay...","Cause the delay...","So the delay..."], a:0}
 ]},
 {id:"sum", tag:"sum", title:"Summary / paraphrase", items:[
  {t:"mc", id:"s1", q:"<p>Özette yazarın argümanı hangi zamanla anlatılır?</p>", o:["Past simple","Present simple","Present perfect continuous","Future"], a:1},
  {t:"mc", id:"s2", q:"<p>Özette hangisi <strong>olmamalı</strong>?</p>", o:["Yazarın soyadı ve reporting verb","Ana noktalar","Kendi değer yargın","Kendi kelimelerin"], a:2,
   why:"Don'ts: gereksiz detay, kaynakta olmayan bilgi, kendi değer yargın."},
  {t:"mc", id:"s3", q:"<p>Paraphrase uzunluğu:</p>", o:["Orijinalin yarısı","Orijinalle yaklaşık aynı","Tek cümle","Orijinalin iki katı"], a:1,
   why:"Paraphrase: aynı uzunluk, aynı fikirler, kendi kelimelerin. Summary: çok daha kısa, sadece ana noktalar."},
  {t:"mc", id:"s4", q:"<p>Sadece birkaç kelimeyi eş anlamlısıyla değiştirip yapıyı korumak:</p>", o:["İyi bir paraphrase","Summary","Plagiarism","Direct quotation"], a:2},
  {t:"mc", id:"s5", q:"<p><em>13% → less than 15 percent; 46 percent → almost half</em>. Hangi teknik?</p>", o:["Synonyms","Change word form","Change attribution signals","Change numbers and percentages"], a:3},
  {t:"mc", id:"s6", q:"<p>Treasure konuşmasının üç özetinden (A, B, C) hangisi en iyisi ve neden?</p>", o:["A: en kısa olduğu için","B: annesiyle ilgili detayı da verdiği için","C: kendi kelimeleri, açıklama ve reporting verb kullandığı için","Hepsi eşit"], a:2,
   why:"A sadece liste. B gereksiz detay (annesinin yorumu) içeriyor. C ana fikirleri açıklıyor, <em>argues, elaborates on</em> kullanıyor."},
  {t:"mc", id:"s7", q:"<p>Orijinal: <em>“Advocates of internet tracking believe that it may help marketers understand what people want.”</em> En iyi paraphrase:</p>", o:["Advocates of internet tracking think that it may help marketers understand what people want.","Supporters argue the case for internet tracking by saying that it may assist marketers in discovering customers' needs and wants.","Internet tracking definitely shows marketers everything people want.","Internet tracking is bad because marketers know too much."], a:1,
   why:"A: tek kelime değişmiş, plagiarism. C: anlamı değiştirmiş (<em>may → definitely</em>). D: kendi yorumun."},
  {t:"mc", id:"s8", q:"<p>Hangisi özet için uygun bir reporting verb?</p>", o:["says me","argues","is telling","told"], a:1,
   why:"argue, claim, note, emphasise, point out, suggest, add · present simple ile."}
 ]},
 {id:"plag", tag:"plag", title:"Plagiarism ve APA", items:[
  {t:"mc", id:"x1", q:"<p>Library metninin beş versiyonundan hangisi kabul edilebilir?</p>", o:["Version 2: aynen kopya + kaynak","Version 3: cümlelerin yeri değişmiş + kaynak","Version 4: iyi paraphrase, kaynak yok","Version 5: iyi paraphrase + kaynak"], a:3},
  {t:"mc", id:"x2", q:"<p>Version 2 (kelimeler aynen + <em>(Yong, 2001: 294)</em>) neden plagiarism?</p>", o:["Kaynak yanlış biçimde","Aynen alınan kelimeler tırnak içinde değil","Çok kısa","Yıl eksik"], a:1},
  {t:"mc", id:"x3", q:"<p>İki yazarlı kaynak, parantez içi atıf:</p>", o:["(Frogmouth and Spoonbill, 2020)","(Frogmouth & Spoonbill, 2020)","(Frogmouth et al., 2020)","(Frogmouth, Spoonbill 2020)"], a:1,
   why:"Parantez içinde <strong>&amp;</strong>, cümle içinde <strong>and</strong>: <em>Frogmouth and Spoonbill (2020) noted...</em>"},
  {t:"mc", id:"x4", q:"<p>Üç yazarlı bir kaynağın <strong>ilk</strong> atıfı:</p>", o:["(Smith, Brown, & Lee, 2022)","(Smith et al., 2022)","(Smith and others, 2022)","(Smith, 2022)"], a:1,
   why:"APA 7: 3+ yazarda ilk atıftan itibaren <em>et al.</em> Kaynakçada ise tüm yazarlar yazılır."},
  {t:"mc", id:"x5", q:"<p>Block quotation kaç kelimeden itibaren?</p>", o:["20","30","40","100"], a:2,
   why:"40+ kelime: tırnak yok, 0.5 inç girinti, çift satır aralığı, nokta kaynaktan önce."},
  {t:"mc", id:"x6", q:"<p>Sayfa numarası olmayan bir web sayfasından doğrudan alıntı:</p>", o:["(Johnson, 2023, p. 4)","(Johnson, 2023, para. 4)","(Johnson, 2023)","(Johnson, para 4, 2023)"], a:1},
  {t:"mc", id:"x7", q:"<p><em>“J.S. Bach was the greatest composer of the Baroque period.”</em> Kaynak gerekir mi?</p>", o:["Hayır, common knowledge","Evet, çünkü bu bir görüş","Hayır, Bach ünlü","Sadece tırnak gerekir"], a:1,
   why:"Common knowledge sadece fact'leri kapsar. <em>“Bach was a famous Baroque composer”</em> kaynak istemez; <em>“the greatest”</em> görüş, ister."},
  {t:"mc", id:"x8", q:"<p>Hangi stil footnote kullanır?</p>", o:["APA","MLA","Chicago","Vancouver"], a:2,
   why:"APA, MLA, Harvard: in-text · Chicago: footnotes · Vancouver: numeric."},
  {t:"mc", id:"x9", q:"<p>Geçen dönem başka bir derse verdiğin ödevi tekrar teslim etmek:</p>", o:["Sorun değil, kendi işin","Plagiarism","Sadece kaynak göstermek gerekir","Paraphrase sayılır"], a:1},
  {t:"mc", id:"x10", q:"<p><em>“Motivation may be more critical than intelligence in learning (Newble &amp; Cannon, 1989, p. 2).”</em></p>", o:["Kabul edilmez: tırnak yok","Kabul edilir: gerçek paraphrase ve kaynak var","Kabul edilmez: orijinale çok yakın","Kabul edilmez: sayfa olmamalı"], a:1}
 ]}
];

const DENEME = [
 {id:"A", title:"Part A: Note-taking", pts:10, items:[
  {t:"open", id:"a1", tag:"note", pts:4, label:"1", rows:5, q:"<p>Rewrite each sentence as a short note. Use symbols and abbreviations.</p><p>a) Students who use their phones during lectures tend to remember less of the lecture content.<br>b) Because the library is closed on Sundays, students therefore study in cafés.<br>c) Online courses are different from face-to-face courses in terms of student motivation.<br>d) An important point: the number of international students has increased, for example in engineering departments.</p>",
   model:"<p>a) <code>phone use in lectures → ↓ memory of content</code><br>b) <code>library closed Sun. ∴ sts study in cafés</code><br>c) <code>online courses ≠ face-to-face (motivation)</code><br>d) <code>* no. of int'l sts ↑, e.g. engineering depts</code></p><p>Senin sembollerin farklı olabilir; kısa olması ve ilişkiyi göstermesi yeter.</p>"},
  {t:"open", id:"a2", tag:"note", pts:3, label:"2", rows:3, q:"<p>Name the three sections of a page in the Cornell note-taking method and say what goes in each.</p>",
   model:"<p>Notes column (sağ, geniş): ders sırasındaki notlar. Cue column (sol): anahtar kelimeler ve sorular. Summary (alt): sayfanın kısa özeti.</p>"},
  {t:"open", id:"a3", tag:"note", pts:3, label:"3", rows:4, q:"<p>A classmate says: “Good note-taking means writing as fast as possible so you don't miss anything.” Explain in 2-3 sentences why this is wrong.</p>",
   model:"<p><em>Note-taking is a skill that develops progressively, and its aim is not to write faster but to identify what is worth writing down. A good note-taker listens actively, selects only the key ideas that are relevant to the purpose, and reviews the notes afterwards. Signpost expressions such as “the important thing here” help to decide what to write.</em></p>"}
 ]},
 {id:"B", title:"Part B: Subjective vs. objective language", pts:20, items:[
  {t:"sel", id:"b4", tag:"obj", pts:6, label:"4", q:"<p>Label each statement O, F-NP or SSD. The figures are invented for this exercise.</p>", ch:OFNS, items:[
    {s:"University students spend too much time on social media.", a:"O"},
    {s:"Many students use social media during study time.", a:"F-NP"},
    {s:"In a 2024 survey of 1,200 students at one university, 64 percent reported checking social media at least once every hour while studying.", a:"SSD"},
    {s:"Social media is the worst distraction a student can have.", a:"O"},
    {s:"Students' sleep patterns are affected by late-night phone use.", a:"F-NP"},
    {s:"“Students who kept their phones in another room scored on average 11 points higher on the test,” the study's lead researcher reported.", a:"SSD"}],
   why:"a ve d yargı (<em>too much, the worst</em>). b ve e genel gerçek, kanıt ister. c sayı ve tarih veriyor, f bir uzmandan alıntı."},
  {t:"open", id:"b5", tag:"obj", pts:12, label:"5", rows:9, q:"<p>Rewrite each sentence in objective academic style. Use a different technique each time and name it.</p><p>a) I think that online exams are always unfair to students.<br>b) The researchers found out that sleep deprivation has a huge, terrible effect on memory.<br>c) We interviewed 40 teachers in March 2025.<br>d) Smith's (2020) amazing study proves that homework is useless.<br>e) Video games will make teenagers violent.<br>f) I believe the results are reliable, based on these data.</p>",
   model:"<p>a) <em>Online exams may be unfair to some students.</em> (no personal pronoun + hedging)<br>b) <em>The researchers discovered that sleep deprivation has a significant effect on memory.</em> (phrasal verb, emotive language)<br>c) <em>Forty teachers were interviewed in March 2025.</em> (passive voice)<br>d) <em>Smith's (2020) study suggests that homework may have limited benefits.</em> (judgmental language, hedging)<br>e) <em>Video games may increase aggressive behaviour in some teenagers.</em> (hedging: modal, quantifier)<br>f) <em>These data indicate that the results are reliable.</em> (moving information around)</p>",
   rub:"<p>Her madde 2 puan: 1 doğru yeniden yazım, 1 doğru teknik adı.</p>"},
  {t:"open", id:"b6", tag:"obj", pts:2, label:"6", rows:2, q:"<p>Name two words or features that make this sentence subjective:</p><p><em>Obviously, ALL first-year students are completely lost in their incredibly difficult courses!!</em></p>",
   model:"<p>Herhangi ikisi: <em>Obviously</em> (judgment), <em>ALL</em> (capitalisation, exaggeration), <em>completely, incredibly</em> (emotive), <em>!!</em> (exclamation marks).</p>"}
 ]},
 {id:"C", title:"Part C: Paragraph", pts:25, items:[
  {t:"sel", id:"c7", tag:"para", pts:5, label:"7", q:"<p>Simple fact (F), too broad (B) or good topic sentence (TS)?</p>", ch:FBT, items:[
    {s:"The cafeteria opens at 7:30 a.m.", a:"F"},
    {s:"Technology has changed human history.", a:"B"},
    {s:"Living with a roommate requires a great deal of patience.", a:"TS"},
    {s:"Our professor gave us three assignments last week.", a:"F"},
    {s:"Part-time jobs can help university students develop useful skills.", a:"TS"}]},
  {t:"sel", id:"c8", tag:"para", pts:3, label:"8", q:"<p>Topic sentence (TS), support (S) or unrelated (U)?</p>", ch:TSU, items:[
    {s:"Many students choose to study in the library.", a:"TS"},
    {s:"The library has comfortable chairs and large tables.", a:"S"},
    {s:"The library is quiet, so students can concentrate.", a:"S"},
    {s:"The university was founded in 2004.", a:"U"}]},
  {t:"mc", id:"c9", tag:"para", pts:3, label:"9", q:"<p>Which sentence breaks the unity of this paragraph?</p><p><em>Regular exercise brings several benefits for university students. Students who exercise regularly tend to sleep better, which helps them stay focused in class. Exercise is also a healthy way to reduce exam stress. Many universities in Europe were founded in the Middle Ages. In addition, team sports give students a chance to make new friends.</em></p>",
   o:["Students who exercise regularly tend to sleep better...","Exercise is also a healthy way to reduce exam stress.","Many universities in Europe were founded in the Middle Ages.","In addition, team sports give students a chance to make new friends."], a:2,
   why:"Bu cümle egzersizin öğrencilere faydasından bahsetmiyor; topic sentence'ı desteklemiyor."},
  {t:"sel", id:"c10", tag:"para", pts:3, label:"10", q:"<p>Fill in the gaps. Use each signal once.</p><p><em>Studying abroad can be a valuable experience. (1) ___, students often improve their language skills (2) ___ they use a foreign language every day. (3) ___, they learn to live independently. Daily tasks (4) ___ cooking, paying bills and dealing with banks help them become more responsible. (5) ___, studying abroad is not easy for everyone. Some students feel homesick and, (6) ___, their grades may drop in the first semester.</em></p>",
   ch:["however","for example","as a result","in addition","because","such as"], items:[
    {s:"(1)", a:"for example"},{s:"(2)", a:"because"},{s:"(3)", a:"in addition"},{s:"(4)", a:"such as"},{s:"(5)", a:"however"},{s:"(6)", a:"as a result"}]},
