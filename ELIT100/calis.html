/* ---------- durum ---------- */
const KEY = "elit100-calis-v1";
let S = {plan:{}, ans:{}, res:{}, txt:{}, tab:"plan", theme:null};
let storageOK = true;
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); localStorage.setItem(KEY + "-probe", "1"); localStorage.removeItem(KEY + "-probe"); }
catch (e) { storageOK = false; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, html = ""){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (v !== false && v != null) e.setAttribute(k, v); }
  if (html) e.innerHTML = html;
  return e;
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200); }

/* ---------- soru çizimi ---------- */
const ALLQ = {};
function qShell(q, label){
  const box = el("div", {class:"q", id:"q-" + q.id});
  const head = el("header");
  head.append(el("span", {class:"qid"}, label));
  if (q.tag) head.append(el("span", {class:"chip"}, TAGS[q.tag]));
  if (q.pts) head.append(el("span", {class:"small muted"}, q.pts + " puan"));
  const st = el("span", {class:"st"}); head.append(st);
  box.append(head, el("div", {class:"prompt"}, q.q));
  box._st = st;
  return box;
}
function status(q, box){
  const r = S.res[q.id];
  box._st.className = "st"; box._st.textContent = "";
  if (r) { box._st.textContent = fmt(r.got) + "/" + fmt(r.max); box._st.classList.add(r.got >= r.max ? "ok" : r.got > 0 ? "mid" : "bad"); }
  refreshScores();
}
function fmt(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function addReset(q, box, after){
  const b = el("button", {type:"button", class:"btn link"}, "Sıfırla");
  b.onclick = () => { delete S.ans[q.id]; delete S.res[q.id]; save(); after(); };
  box.append(b);
}
function renderQ(q, label){
  q.pts = q.pts || (q.t === "sel" ? q.items.length : 1);
  ALLQ[q.id] = q;
  const box = qShell(q, label);
  if (q.t === "mc") renderMC(q, box); else if (q.t === "sel") renderSel(q, box); else renderOpen(q, box);
  return box;
}
function renderMC(q, box){
  const opts = el("div", {class:"opts"});
  q.o.forEach((t, i) => {
    const b = el("button", {type:"button", class:"opt"}, t);
    b.onclick = () => { if (S.ans[q.id] !== undefined) return; S.ans[q.id] = i; S.res[q.id] = {got: i === q.a ? q.pts : 0, max: q.pts}; save(); paint(); };
    opts.append(b);
  });
  const fb = el("div");
  box.append(opts, fb);
  function paint(){
    const c = S.ans[q.id];
    [...opts.children].forEach((b, i) => { b.disabled = c !== undefined; b.classList.toggle("right", c !== undefined && i === q.a); b.classList.toggle("wrong", c === i && i !== q.a); });
    fb.innerHTML = c === undefined ? "" : `<p class="fb ${c === q.a ? "ok" : "bad"}">${c === q.a ? "Doğru." : "Yanlış. Doğrusu: " + q.o[q.a]}</p>` + (q.why ? `<div class="sol">${q.why}</div>` : "");
    status(q, box);
  }
  paint(); addReset(q, box, paint);
}
function renderSel(q, box){
  const list = el("ol", {class:"sel"});
  const rows = q.items.map((it, i) => {
    const li = el("li");
    const s = el("select", {"aria-label": "Madde " + (i + 1) + " cevabı"});
    s.append(el("option", {value:""}, "seç"));
    q.ch.forEach(c => s.append(el("option", {value:c}, c)));
    const mark = el("span", {class:"mark"});
    li.append(el("span", {class:"stem"}, it.s), s, mark);
    list.append(li);
    return {s, mark, it};
  });
  const act = el("div", {class:"actions"});
  const chk = el("button", {type:"button", class:"btn"}, "Kontrol et");
  act.append(chk);
  const fb = el("div");
  box.append(list, act, fb);
  chk.onclick = () => {
    const v = rows.map(r => r.s.value);
    if (v.some(x => !x)) { toast("Önce bütün maddeleri seç."); return; }
    const right = v.filter((x, i) => x === q.items[i].a).length;
    S.ans[q.id] = v; S.res[q.id] = {got: Math.round(right * q.pts / q.items.length * 10) / 10, max: q.pts};
    save(); paint();
  };
  function paint(){
    const v = S.ans[q.id];
    rows.forEach((r, i) => {
      r.s.disabled = !!v; r.mark.className = "mark"; r.mark.textContent = "";
      if (v) { r.s.value = v[i]; const ok = v[i] === r.it.a; r.mark.textContent = ok ? "✓" : "✗ doğrusu: " + r.it.a; r.mark.classList.add(ok ? "ok" : "bad"); }
    });
    chk.hidden = !!v;
    fb.innerHTML = v && q.why ? `<div class="sol">${q.why}</div>` : "";
    status(q, box);
  }
  paint(); addReset(q, box, () => { rows.forEach(r => r.s.value = ""); paint(); });
}
function renderOpen(q, box){
  if (q.article) {
    const ab = el("button", {type:"button", class:"btn soft"}, "Makaleyi göster");
    const art = el("div", {class:"article", hidden:""});
    ab.onclick = async () => {
      if (!art.hidden) { art.hidden = true; ab.textContent = "Makaleyi göster"; return; }
      if (!art.dataset.loaded) {
        try { const r = await fetch(ARTICLE); if (!r.ok) throw new Error(r.status); art.textContent = await r.text(); art.dataset.loaded = "1"; }
        catch (e) { art.innerHTML = "Makale yüklenemedi. Dosyayı aç: <code>materyal/WEEK 5/articles for practice/SLEEPING IN ON WEEKEND-article for summary.docx</code>"; }
      }
      art.hidden = false; ab.textContent = "Makaleyi gizle";
    };
    box.append(el("div", {class:"actions"}), art); box.lastChild.previousSibling.append(ab);
  }
  const ta = el("textarea", {rows: q.rows || 6, "aria-label": "Cevabın", spellcheck:"true", lang:"en"});
  ta.value = S.txt[q.id] || "";
  const wc = el("span", {class:"wc"});
  const upd = () => {
    const n = (ta.value.trim().match(/\S+/g) || []).length;
    wc.textContent = n + " kelime" + (q.words ? ` · hedef ${q.words[0]}-${q.words[1]}` : "");
    wc.classList.toggle("off", !!q.words && n > 0 && (n < q.words[0] || n > q.words[1]));
  };
  ta.oninput = () => { S.txt[q.id] = ta.value; save(); upd(); };
  upd();
  const act = el("div", {class:"actions"});
  const show = el("button", {type:"button", class:"btn ghost", "aria-expanded":"false"}, "Örnek cevabı göster");
  act.append(show);
  if (q.timer) { const tb = el("button", {type:"button", class:"btn soft"}, q.timer + " dk süre başlat"); tb.onclick = () => startTimer(q.timer); act.append(tb); }
  act.append(wc);
  const model = el("div", {class:"sol", hidden:""}, `<p class="lbl">Örnek cevap</p>${q.model}${q.rub ? `<p class="lbl">Puanlama</p>${q.rub}` : ""}`);
  const self = el("div", {class:"self", hidden:""});
  self.append(el("span", {class:"small"}, "Örnekle karşılaştır, kendini puanla:"));
  const marks = [["Tam", 1, "ok"], ["Kısmen", .5, "soft"], ["Yok", 0, "bad"]].map(([l, f, c]) => {
    const b = el("button", {type:"button", class:"btn " + c, "aria-pressed":"false"}, l);
    b.onclick = () => { S.ans[q.id] = f; S.res[q.id] = {got: q.pts * f, max: q.pts}; save(); paint(); };
    self.append(b); return [b, f];
  });
  self.append(el("span", {class:"small muted"}, "Emin değilsen metni sohbete yapıştır."));
  show.onclick = () => { const open = model.hidden; model.hidden = !open; show.setAttribute("aria-expanded", String(open)); show.textContent = open ? "Örnek cevabı gizle" : "Örnek cevabı göster"; paint(); };
  box.append(ta, act, model, self);
  function paint(){
    const f = S.ans[q.id];
    self.hidden = model.hidden && f === undefined;
    marks.forEach(([b, v]) => b.setAttribute("aria-pressed", String(f === v)));
    status(q, box);
  }
  paint(); addReset(q, box, paint);
}

/* ---------- sekmeler ---------- */
const TABS = [["plan","Plan"],["konular","Konular"],["alistirma","Alıştırma"],["deneme","Deneme"],["zayif","Zayıf konular"]];
const panels = {};
function buildTabs(){
  const nav = $("#tabs");
  TABS.forEach(([id, label]) => {
    const b = el("button", {type:"button", role:"tab", id:"tab-" + id, "aria-controls":"panel-" + id}, label);
    b.onclick = () => show(id);
    nav.append(b);
    const p = el("section", {role:"tabpanel", id:"panel-" + id, "aria-labelledby":"tab-" + id});
    panels[id] = p; $("#main").append(p);
  });
}
function show(id){
  TABS.forEach(([t]) => { panels[t].hidden = t !== id; $("#tab-" + t).setAttribute("aria-selected", String(t === id)); });
  S.tab = id; save();
  if (id === "zayif") renderWeak();
}
function go(tab, anchor){
  show(tab);
  const t = document.getElementById(anchor);
  if (t) { if (t.tagName === "DETAILS") t.open = true; t.scrollIntoView({behavior:"smooth", block:"start"}); }
  else window.scrollTo({top:0});
}

/* ---------- Plan ---------- */
function todayStr(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function renderPlan(){
  const p = panels.plan, sh = el("div", {class:"sheet plan"});
  sh.append(el("h2", {}, "Gün gün plan"), el("p", {class:"muted small"}, "İşaretler bu tarayıcıda saklanır. Bugünün günü sarı. Her maddenin “aç” bağlantısı ilgili yere götürür."));
  if (!storageOK) sh.append(el("div", {class:"warn"}, "Bu sayfa tarayıcı hafızasına yazamıyor; işaretlerin sayfayı kapatınca kaybolur. Sayfayı <code>http://127.0.0.1</code> adresinden aç."));
  const today = todayStr();
  PLAN.forEach(d => {
    const day = el("div", {class:"day" + (d.date === today ? " today" : "")});
    day.append(el("h3", {}, `${d.day} <small>${d.note}</small>`));
    const ul = el("ul");
    d.items.forEach(it => {
      const li = el("li"), id = "plan-" + it.id;
      const cb = el("input", {type:"checkbox", id});
      cb.checked = !!S.plan[it.id];
      li.classList.toggle("done", cb.checked);
      cb.onchange = () => { S.plan[it.id] = cb.checked; li.classList.toggle("done", cb.checked); save(); refreshBar(); };
      const lab = el("label", {for:id}, it.t);
      li.append(cb, el("span", {class:"time"}, it.time || ""), lab);
      if (it.go) { const a = el("button", {type:"button", class:"btn link"}, "aç"); a.onclick = () => go(...it.go); li.append(a); }
      ul.append(li);
    });
    day.append(ul); sh.append(day);
  });
  const info = el("div", {class:"sheet"});
  info.append(el("h2", {}, "Bilinmeyenler"));
  info.append(el("div", {}, "<ul><li>Sınav formatı slaytlarda yok. Deneme, ders alıştırmalarının tiplerine göre kuruldu; gerçek sınav farklı olabilir.</li><li>ELIT100 Reader (Teams'teki PDF) klasörde yok. Gönderirsen alıştırmalarını eklerim.</li><li>Kapsam: Week 1 tanıtım slaytı. Note-taking, objective/subjective, paragraph, norms in academic communication, email writing, summarising/paraphrasing, plagiarism.</li></ul>"));
  p.append(sh, info);
}
function refreshBar(){
  const all = PLAN.flatMap(d => d.items), done = all.filter(i => S.plan[i.id]).length;
  $("#barFill").style.width = (100 * done / all.length) + "%";
  $("#barLbl").textContent = `Plan: ${done}/${all.length} madde`;
}

/* ---------- Konular ---------- */
function renderTopics(){
  const sh = el("div", {class:"sheet"});
  sh.append(el("h2", {}, "Konu özetleri"), el("p", {class:"muted small"}, "Açıklamalar Türkçe, örnekler İngilizce. Kaynak: <code>ozet.md</code>. Her konunun sonunda o konudan alıştırmaya geçiş var."));
  OZET.forEach((s, i) => {
    const d = el("details", {class:"konu", id:"konu-" + (i + 1)});
    d.append(el("summary", {}, s.title));
    const body = el("div", {}, s.html);
    const tag = OZET_TAG[i];
    const b = el("button", {type:"button", class:"btn soft"}, "Bu konudan alıştırma: " + TAGS[tag]);
    b.onclick = () => go("alistirma", "g-" + tag);
    body.append(el("div", {class:"actions"})); body.lastChild.append(b);
    d.append(body); sh.append(d);
  });
  panels.konular.append(sh);
}

/* ---------- Alıştırma ---------- */
function renderPractice(){
  const head = el("div", {class:"sheet"});
  head.append(el("h2", {}, "Alıştırma"), el("p", {class:"muted small"}, "Çoktan seçmeliler ilk tıklamada puanlanır. Tekrar denemek için “Sıfırla”. Sonuçlar Zayıf konular sekmesinde toplanır."));
  const jump = el("div", {class:"actions"});
  PRACTICE.forEach(g => { const b = el("button", {type:"button", class:"btn ghost"}, g.tag ? TAGS[g.tag] : "Tanı"); b.onclick = () => go("alistirma", "g-" + (g.tag || g.id)); jump.append(b); });
  head.append(jump);
  panels.alistirma.append(head);
  PRACTICE.forEach(g => {
    const sh = el("div", {class:"sheet", id:"g-" + (g.tag || g.id)});
    sh.style.scrollMarginTop = "150px";
    sh.append(el("h2", {}, g.title));
    if (g.intro) sh.append(el("p", {class:"muted small"}, g.intro));
    g.items.forEach((q, i) => { if (!q.tag) q.tag = g.tag; sh.append(renderQ(q, String(i + 1))); });
    panels.alistirma.append(sh);
  });
}

/* ---------- Deneme ---------- */
function renderExam(){
  const head = el("div", {class:"sheet"});
  head.append(el("h2", {}, "Deneme sınavı 1"));
  head.append(el("p", {class:"small"}, "90 dakika, 100 puan. Sınavın gerçek formatı bilinmiyor; bu deneme ders alıştırmalarının tiplerinden kuruldu. Yazma sorularında önce yaz, sonra örnek cevabı aç ve kendini puanla."));
  const act = el("div", {class:"actions partscore"});
  const tb = el("button", {type:"button", class:"btn"}, "90 dk süre başlat"); tb.onclick = () => startTimer(90);
  act.append(tb, el("span", {class:"score", id:"examScore"}));
  head.append(act, el("div", {class:"small muted", id:"partScores"}));
  panels.deneme.append(head);
  DENEME.forEach(part => {
    const sh = el("div", {class:"sheet", id:"part-" + part.id});
    sh.style.scrollMarginTop = "150px";
    sh.append(el("h2", {}, `${part.title} <span class="small muted">(${part.pts} puan)</span>`));
    part.items.forEach(q => sh.append(renderQ(q, q.label)));
    panels.deneme.append(sh);
  });
}

/* ---------- Skorlar ve zayıf konular ---------- */
function tagStats(){
  const st = {}; Object.keys(TAGS).forEach(t => st[t] = {got:0, max:0, n:0, wrong:[]});
  Object.values(ALLQ).forEach(q => { const r = S.res[q.id]; if (!r) return; const s = st[q.tag]; s.got += r.got; s.max += r.max; s.n++; if (r.got < r.max) s.wrong.push(q); });
  return st;
}
function refreshScores(){
  const sc = $("#examScore"); if (!sc) return;
  let got = 0, max = 0; const parts = [];
  DENEME.forEach(p => { let g = 0, m = 0; p.items.forEach(q => { const r = S.res[q.id]; if (r) { g += r.got; m += r.max; } }); got += g; max += m; parts.push(`${p.id}: ${fmt(g)}/${fmt(m)}`); });
  sc.textContent = `Deneme: ${fmt(got)} / ${max} cevaplanan (toplam 100)`;
  $("#partScores").textContent = parts.join(" · ");
  if (READY && !panels.zayif.hidden) renderWeak();
}
let READY = false;
function renderWeak(){
  const p = panels.zayif; p.innerHTML = "";
  const sh = el("div", {class:"sheet", id:"zayif-top"});
  sh.append(el("h2", {}, "Zayıf konular"), el("p", {class:"muted small"}, "Alıştırma ve denemedeki cevaplanmış sorulardan hesaplanır. %60 altı ve en az 3 puanlık soru cevaplanmışsa zayıf sayılır."));
  const st = tagStats();
  const order = Object.keys(TAGS).sort((a, b) => pct(st[a]) - pct(st[b]));
  let any = false;
  order.forEach(t => {
    const s = st[t], row = el("div", {class:"meterrow"});
    const pc = pct(s), weak = s.max >= 3 && pc < 60;
    row.append(el("span", {class: weak ? "weak" : ""}, TAGS[t] + (weak ? " · zayıf" : "")));
    const m = el("div", {class:"meter", "aria-hidden":"true"});
    if (s.max) { m.append(el("i", {class:"g", style:`width:${100 * s.got / s.max}%`}), el("i", {class:"r", style:`width:${100 * (s.max - s.got) / s.max}%`})); any = true; }
    row.append(m, el("span", {class:"score small"}, s.max ? `${Math.round(pc)}% · ${fmt(s.got)}/${fmt(s.max)}` : "henüz yok"));
    sh.append(row);
  });
  if (!any) sh.append(el("p", {class:"muted"}, "Henüz cevaplanmış soru yok. Tanı sorularıyla başla."));
  p.append(sh);
  const wr = el("div", {class:"sheet"});
  wr.append(el("h2", {}, "Tekrar çözülecekler"));
  const list = order.flatMap(t => st[t].wrong);
  if (!list.length) wr.append(el("p", {class:"muted"}, "Yanlış ya da eksik puanlı soru yok."));
  else {
    const ul = el("ul");
    list.forEach(q => {
      const inExam = DENEME.some(pt => pt.items.includes(q));
      const li = el("li"), r = S.res[q.id];
      const txt = q.q.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      li.append(el("span", {}, `<span class="chip">${TAGS[q.tag]}</span> ${inExam ? "Deneme " + q.label : "Alıştırma"} · ${fmt(r.got)}/${fmt(r.max)} · ${txt.slice(0, 90)}${txt.length > 90 ? "…" : ""} `));
      const b = el("button", {type:"button", class:"btn link"}, "git"); b.onclick = () => go(inExam ? "deneme" : "alistirma", "q-" + q.id);
      li.append(b); ul.append(li);
    });
    wr.append(ul);
  }
  const reset = el("button", {type:"button", class:"btn ghost"}, "Bütün cevapları sıfırla");
  reset.onclick = () => { if (!confirm("Bütün cevaplar, puanlar ve yazdıkların silinsin mi? Plan işaretleri kalır.")) return; S.ans = {}; S.res = {}; S.txt = {}; save(); location.reload(); };
  wr.append(el("div", {class:"actions"})); wr.lastChild.append(reset);
  p.append(wr);
}
function pct(s){ return s.max ? 100 * s.got / s.max : 101; }

/* ---------- zamanlayıcı ---------- */
let T = null;
function startTimer(min){
  T = {end: Date.now() + min * 60000, left: null, total: min};
  $("#timer").hidden = false; $("#tPause").textContent = "Duraklat"; tick(); toast(min + " dakika başladı.");
}
function tick(){
  if (!T) return;
  const ms = T.left != null ? T.left : T.end - Date.now();
  const neg = ms < 0, a = Math.abs(ms), m = Math.floor(a / 60000), s = Math.floor(a % 60000 / 1000);
  $("#clock").textContent = (neg ? "+" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  $("#timer").classList.toggle("over", neg);
  if (neg && !T.warned) { T.warned = true; toast("Süre doldu."); }
}
setInterval(tick, 500);
$("#tPause").onclick = () => { if (!T) return; if (T.left == null) { T.left = T.end - Date.now(); $("#tPause").textContent = "Devam"; } else { T.end = Date.now() + T.left; T.left = null; $("#tPause").textContent = "Duraklat"; } };
$("#tStop").onclick = () => { T = null; $("#timer").hidden = true; };

/* ---------- başlık ---------- */
const EXAM = new Date(2026, 10, 17, 17, 45);
function countdown(){
  const ms = EXAM - new Date(), c = $("#count");
  if (ms <= 0) { c.textContent = "Sınav: 17 Kas Sal 17:45"; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5);
  c.innerHTML = `Sınav 17 Kas Sal 17:45 · <b>${d} gün ${h} saat</b>`;
}
function applyTheme(){ if (S.theme) document.documentElement.setAttribute("data-theme", S.theme); else document.documentElement.removeAttribute("data-theme"); }
$("#themeBtn").onclick = () => {
  const dark = S.theme ? S.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme = dark ? "light" : "dark"; save(); applyTheme();
};

/* ---------- başlat ---------- */
applyTheme();
buildTabs(); renderPlan(); renderTopics(); renderPractice(); renderExam();
refreshBar(); countdown(); setInterval(countdown, 60000);
READY = true;
show(TABS.some(([t]) => t === S.tab) ? S.tab : "plan");
refreshScores();
</script>
</body>
