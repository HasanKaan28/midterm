<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NS102 Etkileşimli Çalışma Alanı · Fizik Midterm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --paper:#f4f6fb; --paper-2:#ffffff; --paper-3:#eef2fa; --grid:rgba(35,70,168,.055);
  --ink:#111827; --ink-2:#4b5563; --ink-3:#6b7280;
  --blue:#1d4ed8; --blue-soft:#dbeafe; --blue-border:#93c5fd;
  --red:#dc2626; --red-soft:#fee2e2;
  --green:#15803d; --green-soft:#dcfce7;
  --amber:#b45309; --amber-soft:#fef3c7;
  --purple:#6d28d9; --purple-soft:#ede9fe;
  --line:#d5dce8; --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px -12px rgba(29,78,216,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b0f19; --paper-2:#131a2a; --paper-3:#1c2539; --grid:rgba(96,165,250,.05);
  --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
  --blue:#60a5fa; --blue-soft:#1e293b; --blue-border:#2563eb;
  --red:#f87171; --red-soft:#3b181c;
  --green:#4ade80; --green-soft:#143022;
  --amber:#fbbf24; --amber-soft:#362812;
  --purple:#c084fc; --purple-soft:#2b1c44;
  --line:#263147; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0b0f19; --paper-2:#131a2a; --paper-3:#1c2539; --grid:rgba(96,165,250,.05);
  --ink:#f1f5f9; --ink-2:#94a3b8; --ink-3:#64748b;
  --blue:#60a5fa; --blue-soft:#1e293b; --blue-border:#2563eb;
  --red:#f87171; --red-soft:#3b181c;
  --green:#4ade80; --green-soft:#143022;
  --amber:#fbbf24; --amber-soft:#362812;
  --purple:#c084fc; --purple-soft:#2b1c44;
  --line:#263147; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.58 "IBM Plex Sans",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Sticky Top Command HUD */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 18px 0}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font:800 1.38rem/1.1 "Outfit",system-ui,sans-serif;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand h1 span.badge-course{background:var(--blue);color:#fff;font-size:.75rem;padding:3px 8px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase}
.brand h1 span.sub{color:var(--red);font-weight:700}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count{font:500 .82rem "IBM Plex Mono",monospace;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);padding:4px 10px;border-radius:7px}
.count b{color:var(--ink)}
.pomo-pill{display:flex;align-items:center;gap:6px;background:var(--paper-2);border:1px solid var(--line);padding:3px 9px;border-radius:7px;font:600 .8rem "IBM Plex Mono",monospace}
.pomo-pill button{border:none;background:var(--blue-soft);color:var(--blue);border-radius:4px;padding:2px 6px;font-size:.74rem;font-weight:600}
.search-trigger{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);border-radius:7px;padding:4px 10px;font-size:.8rem;display:flex;align-items:center;gap:6px}
.search-trigger kbd{font:500 .72rem "IBM Plex Mono",monospace;background:var(--paper-3);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.theme{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);border-radius:7px;padding:4px 10px;font-size:.8rem;font-weight:500}

.bar-wrap{display:flex;align-items:center;gap:12px;margin-top:8px}
.bar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.bar i.g{display:block;height:100%;background:var(--green);width:0;transition:width .35s}
.bar i.r{display:block;height:100%;background:var(--red);width:0;transition:width .35s}
.barlbl{font:500 .76rem "IBM Plex Mono",monospace;color:var(--ink-2);white-space:nowrap}

nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:1px solid transparent;border-bottom:none;background:none;color:var(--ink-2);padding:8px 13px;border-radius:9px 9px 0 0;white-space:nowrap;font-weight:600;font-size:.9rem;transition:all .15s}
nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--paper-2) 50%,transparent)}
nav button[aria-selected="true"]{background:var(--paper-2);color:var(--blue);border-color:var(--line);box-shadow:0 1px 0 var(--paper-2)}

main{max-width:1120px;margin:0 auto;padding:20px 18px 90px}
.sheet{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px 22px 34px;position:relative;margin-bottom:18px}
.sheet::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2.5px;background:var(--blue);opacity:.3}
h2{font:700 1.38rem/1.22 "Outfit",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
h3{font:700 1.1rem/1.3 "Outfit",system-ui,sans-serif;margin:18px 0 8px}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:.77rem;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.chip.purple{background:var(--purple-soft);color:var(--purple)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}

/* Filter bar for Zbirka & Question sets */
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;padding:10px;background:var(--paper-3);border-radius:10px;border:1px solid var(--line)}
.filter-btn{border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);padding:5px 11px;border-radius:7px;font-size:.82rem;font-weight:600;transition:all .15s}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Question Card */
.q{border-top:1px dashed var(--line);padding:18px 0 14px}
.q:first-of-type{border-top:none}
.q header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qid{font:600 .8rem "IBM Plex Mono",monospace;background:var(--ink);color:var(--paper-2);padding:2px 8px;border-radius:5px}
.qsrc{font:500 .75rem "IBM Plex Mono",monospace;color:var(--ink-2);background:var(--paper-3);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
.st{margin-left:auto;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px}
.st.ok{background:var(--green-soft);color:var(--green)}
.st.bad{background:var(--red-soft);color:var(--red)}
.prompt{font-size:1.05rem;overflow-x:auto;overflow-y:hidden;padding:4px 0 8px}
.prompt .katex-display,.sol .katex-display{overflow:visible;margin:.25em 0}

/* Input Fields */
.fields{display:grid;gap:8px;margin-top:8px}
.field{display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr);gap:4px 10px;align-items:center}
.field label{font-size:.88rem;color:var(--ink-2);font-weight:500}
.field .inwrap{display:flex;gap:8px;align-items:center;min-width:0}
input[type=text],input[type=number],select,textarea{font:500 .95rem "IBM Plex Mono",monospace;padding:7px 10px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);min-width:0}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--blue);outline:none}
.field input[type=text]{width:100%;max-width:350px}
.field input.val{max-width:180px}
.mk{font-weight:700;min-width:1.2em}
.mk.ok{color:var(--green)} .mk.bad{color:var(--red)}
.pv{grid-column:2;font-size:.92rem;color:var(--ink-2);overflow-x:auto;overflow-y:hidden;padding:2px 0 4px}
.pv:empty,.ferr:empty{display:none}
.ferr{grid-column:2;font-size:.82rem;color:var(--red)}
.syntax{font-size:.82rem;color:var(--ink-2);background:var(--paper-3);padding:8px 12px;border-radius:8px;border:1px solid var(--line)}

/* Buttons */
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper-2);padding:6px 13px;border-radius:7px;font-weight:600;font-size:.88rem;transition:all .15s}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.btn.purple{background:var(--purple-soft);color:var(--purple);border-color:transparent}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{background:var(--red);border-color:var(--red);color:#fff}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.fb{font-weight:600;font-size:.9rem}
.fb.ok{color:var(--green)} .fb.bad{color:var(--red)}

/* Solution, Hint, Scratchpad */
.sol,.hint,.scratch-box{margin-top:10px;padding:13px 15px;border-radius:9px;overflow-x:auto}
.sol{background:var(--blue-soft);border-left:3.5px solid var(--blue)}
.hint{background:var(--amber-soft);border-left:3.5px solid var(--amber)}
.scratch-box{background:var(--paper-3);border:1px solid var(--line)}
.sol p,.hint p{margin:.35em 0}
.ans{font-weight:700;color:var(--blue)}
.self{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.scratch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.scratch-Area{width:100%;height:130px;resize:vertical;font-size:.86rem}
.scratch-canvas-wrap{border:1px solid var(--line);border-radius:7px;background:var(--paper-2);position:relative;height:130px;overflow:hidden}
.scratch-canvas{width:100%;height:100%;cursor:crosshair;touch-action:none;display:block}
@media (max-width:680px){.scratch-grid{grid-template-columns:1fr}.field{grid-template-columns:1fr}.pv,.ferr{grid-column:1}}

/* Visual Calculus Lab (Atölye) */
.lab-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,1fr);gap:16px;margin-top:12px}
@media (max-width:860px){.lab-grid{grid-template-columns:1fr}}
.canvas-card{background:var(--paper-3);border:1px solid var(--line);border-radius:10px;padding:12px}
#calcCanvas{width:100%;height:380px;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;display:block;cursor:crosshair}
.lab-controls{display:flex;flex-direction:column;gap:10px}
.ctrl-box{background:var(--paper-3);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.ctrl-box label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.num-table{width:100%;font:500 .78rem "IBM Plex Mono",monospace;border-collapse:collapse}
.num-table th,.num-table td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.num-table th:first-child,.num-table td:first-child{text-align:left}

/* Step-by-Step Definition of Derivative Trainer */
.step-card{border:1px solid var(--line);background:var(--paper-3);border-radius:9px;padding:12px 14px;margin-bottom:9px}
.step-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.92rem}
.step-body{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

/* Flashcards */
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:12px}
.fc-card{background:var(--paper-3);border:1.5px solid var(--line);border-radius:10px;padding:15px;min-height:155px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s,border-color .15s}
.fc-card:hover{transform:translateY(-2px);border-color:var(--blue)}
.fc-card.flipped{background:var(--blue-soft);border-color:var(--blue)}
.fc-card.mastered{opacity:.65;border-color:var(--green)}
.fc-top{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.fc-main{margin:12px 0;font-size:.98rem;font-weight:500}
.fc-foot{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--ink-2)}

/* Tables, Plan, Details */
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.tblwrap{overflow-x:auto}
.plan li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px dashed var(--line)}
.plan ul{padding:0;margin:0}
.plan input{margin-top:4px;width:18px;height:18px;accent-color:var(--blue)}
.plan .time{font:600 .82rem "IBM Plex Mono",monospace;color:var(--ink-2);min-width:100px}
.plan li.done .what{text-decoration:line-through;color:var(--ink-2)}
.timer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1.5px solid var(--blue);border-radius:9px;margin:10px 0;background:var(--paper-3)}
.timer .clock{font:600 1.55rem "IBM Plex Mono",monospace;min-width:92px;color:var(--blue)}
.timer.over .clock{color:var(--red)}
details{border-top:1px dashed var(--line);padding:11px 0}
summary{cursor:pointer;font:700 1.04rem "Outfit",system-ui,sans-serif}
details[open] summary{margin-bottom:8px;color:var(--blue)}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);min-width:120px}
.meter .g{background:var(--green)} .meter .r{background:var(--red)}
.weak{color:var(--red);font-weight:700}

/* Quick Search Modal (Ctrl+K) */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,15,28,.65);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 20px}
.modal-backdrop[hidden]{display:none}
.modal-box{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;width:100%;max-width:620px;box-shadow:var(--shadow);overflow:hidden}
.modal-box input{width:100%;border:none;border-bottom:1px solid var(--line);padding:14px 16px;font-size:1rem;border-radius:0;background:var(--paper-2)}
.modal-results{max-height:380px;overflow-y:auto;padding:8px}
.modal-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;gap:10px}
.modal-item:hover{background:var(--blue-soft)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:10px 18px;border-radius:8px;font-size:.9rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
/* ---------- NS102 additions (same token system) ---------- */
.back{font:600 .78rem "IBM Plex Sans",system-ui,sans-serif;color:var(--ink-2);border:1px solid var(--line);background:var(--paper-2);padding:3px 9px;border-radius:7px}
.back:hover{color:var(--blue);text-decoration:none}
.st:empty{display:none}
.st.mid{background:var(--amber-soft);color:var(--amber)}
.btn.mid{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.sel-off{opacity:.55}
.opts{display:grid;gap:6px;margin-top:6px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;overflow-x:auto}
.opt input{margin-top:5px;accent-color:var(--blue);flex:none}
.opt .L{font:600 .86rem "IBM Plex Mono",monospace;color:var(--ink-2);min-width:1.4em}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.dis{cursor:default}
.note{background:var(--amber-soft);border-left:3.5px solid var(--amber);padding:10px 13px;border-radius:8px;margin:10px 0}
.warn{background:var(--red-soft);border-left:3.5px solid var(--red);padding:10px 13px;border-radius:8px;margin:0 0 14px}
.score{font:600 1rem "IBM Plex Mono",monospace;padding:12px 15px;border:1.5px solid var(--blue);border-radius:9px;background:var(--paper-3);margin:12px 0}
.score b{font-size:1.25rem;color:var(--blue)}
.score .small{font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:500;margin-top:6px}
.day{margin-top:14px;padding:4px 10px 6px;border-radius:9px}
.day.today{background:var(--amber-soft)}
.day h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:6px 0 2px}
.day h3 .muted{font:500 .82rem "IBM Plex Sans",system-ui,sans-serif}
.plan .what{flex:1}
.go{font-size:.8rem;border:none;background:none;color:var(--blue);text-decoration:underline;padding:0;font-weight:600}
.flist{display:grid;gap:2px}
.f{padding:7px 0;border-bottom:1px dotted var(--line);overflow-x:auto;overflow-y:hidden}
.f:last-child{border-bottom:none}
.f .k{display:block;font-size:.8rem;color:var(--ink-2);font-weight:600}
.sub{font-weight:700;margin:.8em 0 .2em;color:var(--ink-2);font-size:.86rem;text-transform:uppercase;letter-spacing:.03em}
.fc-card:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.fc-main{overflow-x:auto;overflow-y:hidden}
.wklist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.errrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line)}
.errrow .what{flex:1;min-width:180px;font-size:.92rem}
.modal-item{width:100%;text-align:left;border:none;background:none;color:var(--ink);font:inherit}
.modal-item:focus-visible{background:var(--blue-soft)}
.flash{outline:2.5px solid var(--blue);outline-offset:4px;border-radius:8px}
@media (max-width:560px){
  .top-in{padding:8px 12px 0} main{padding:16px 12px 80px}
  .sheet{padding:16px 14px 16px 26px}.sheet::before{left:12px}
  .brand h1{font-size:1.15rem}
  .brand{gap:8px}
  .hud-right{margin-left:0;width:100%;gap:6px}
  .count{font-size:.74rem;padding:3px 7px}
  .pomo-pill{padding:2px 6px;gap:4px;font-size:.74rem}
  .search-trigger,.theme{padding:3px 8px;font-size:.76rem}
  .search-trigger kbd,.search-trigger .lbl{display:none}
  .bar-wrap{margin-top:6px}
  nav{padding-top:6px} nav button{padding:6px 10px;font-size:.84rem}
  .scratch-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.btn:hover,.fc-card:hover{transform:none}}

/* Turkish meaning of English terms (glossary tooltips) */
.term{border-bottom:1px dotted var(--blue);cursor:help;position:relative;outline:none}
.term:hover::after,.term:focus::after{content:attr(data-tr);position:absolute;left:0;top:calc(100% + 4px);z-index:60;background:var(--ink);color:var(--paper);font:500 .74rem/1.3 "IBM Plex Sans",system-ui,sans-serif;padding:3px 7px;border-radius:6px;width:max-content;max-width:60vw;white-space:normal;box-shadow:var(--shadow);pointer-events:none}
.term:focus-visible{box-shadow:0 0 0 2px var(--blue-border);border-radius:3px}
#glossBtn[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-border)}

/* Turkish translation of each question (overlay; hover, tap or TR button) */
.q .prompt{position:relative}
.trbox{display:none;position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:45;background:var(--paper-2);color:var(--ink);border:1px solid var(--blue-border);border-radius:10px;padding:8px 12px 6px;box-shadow:var(--shadow);font-size:.9rem;line-height:1.5}
.trbox p{margin:0 0 4px}

<template id="tpl-ozet"><details id="oz-b1">
      <summary>Bölüm 1: Units, physical quantities, vectors</summary>
      <p class="sub">Ana fikirler</p>
      <ul>
        <li>SI base units (SI temel birimleri): metre, saniye, kilogram. Bir denklemin iki tarafının birimi aynı olmalı.</li>
        <li>Significant figures (anlamlı rakam): çarpma ve bölmede sonuç, en az significant figure'ı olan çarpan kadar rakam taşır. Toplama ve çıkarmada ondalık basamak sayısı belirler.</li>
        <li>Scalar (skaler) tek sayıdır (mass, time, energy). Vector'ün (vektör) magnitude'u (büyüklük) ve direction'ı (yön) vardır (displacement, velocity, force).</li>
        <li>Vector'leri component'leriyle (bileşen) topla: önce her vector'ün $x$ ve $y$ component'ini bul, component'leri topla, sonra magnitude ve açıya dön.</li>
        <li>Scalar product (dot product, skaler çarpım) bir sayı verir. Vector'ler dikse sıfırdır, zıt yönlüyse negatiftir.</li>
        <li>Vector product (cross product, vektörel çarpım), iki vector'e de dik bir vector verir. Vector'ler paralelse sıfırdır.</li>
      </ul>
      <p class="sub">Sık yapılan hatalar</p>
      <ul>
        <li>Hesap makinesinin verdiği arctan sonucu yanlış quadrant'ta (çeyrek) olabilir. $A_x$ negatifse sonuca $180°$ ekle.</li>
        <li>Açı $+x$ axis'ten (eksen) ölçülmüyorsa (örneğin "kuzeyin 30° doğusu") sin ve cos yer değiştirir. Şekil çiz.</li>
        <li>$\vec A\times\vec B$ ile $\vec B\times\vec A$ aynı değildir, işaretleri terstir.</li>
      </ul>
    </details>

    <details id="oz-b2">
      <summary>Bölüm 2: Motion along a straight line</summary>
      <p class="sub">Ana fikirler</p>
      <ul>
        <li>Displacement (yer değiştirme) $\Delta x=x_2-x_1$ işaretlidir. Distance (alınan yol) işaretsizdir.</li>
        <li>Average speed (ortalama sürat), average velocity'nin (ortalama hız) magnitude'u değildir. Gidip geri dönen cismin average velocity'si sıfır, average speed'i sıfırdan farklıdır.</li>
        <li>Velocity'nin işareti hareket yönünü gösterir. Acceleration (ivme) ile velocity aynı işaretliyse cisim hızlanır, zıt işaretliyse yavaşlar.</li>
        <li>Constant acceleration (sabit ivme) denklemleri yalnız acceleration sabitken geçerlidir. Acceleration zamana bağlıysa türev ve integral kullan.</li>
        <li>Free fall'da (serbest düşme) acceleration'ın magnitude'u her an $g$, yönü aşağıdır: çıkarken de, tepede de, inerken de.</li>
      </ul>
      <p class="sub">Sık yapılan hatalar</p>
      <ul>
        <li>Tepe noktasında velocity sıfırdır ama acceleration sıfır değildir.</li>
        <li>"Negatif acceleration yavaşlama demektir" yanlıştır. $-x$ yönünde giden cisim negatif acceleration'la hızlanır.</li>
        <li>Yukarı atılıp aşağı düşen cisimde hareketi ikiye bölmeye gerek yok. Tek denklem, işaretlere dikkat ederek, yeter.</li>
      </ul>
    </details>

    <details id="oz-b3">
      <summary>Bölüm 3: Motion in two or three dimensions</summary>
      <p class="sub">Ana fikirler</p>
      <ul>
        <li>Velocity vector'ü her zaman trajectory'ye (yörünge) tangent'tir (teğet). Acceleration vector'ü trajectory'nin içbükey tarafına bakar.</li>
        <li>Acceleration'ın velocity'ye paralel component'i speed'i (sürat) değiştirir. Dik component'i yönü değiştirir.</li>
        <li>Projectile motion'da (eğik atış) yatay ve düşey hareket bağımsızdır. Yatayda velocity sabittir, düşeyde acceleration $-g$'dir. İki hareketi birbirine zaman bağlar.</li>
        <li>Aynı yükseklikten bırakılan ve yatay fırlatılan cisimler yere aynı anda düşer.</li>
        <li>Tepe noktasında $v_y=0$ olur, ama speed sıfır değildir: $v=v_0\cos\alpha_0$.</li>
        <li>Uniform circular motion'da (düzgün çembersel hareket) speed sabittir, velocity sabit değildir. Centripetal acceleration (merkezcil ivme) merkeze doğrudur, magnitude'u $v^2/R$'dir.</li>
        <li>Speed değişiyorsa tangential acceleration (teğetsel ivme) da vardır.</li>
        <li>Relative velocity (bağıl hız): alt indisleri zincir gibi bağla. $\vec v_{P/A}=\vec v_{P/B}+\vec v_{B/A}$.</li>
      </ul>
      <p class="sub">Sık yapılan hatalar</p>
      <ul>
        <li>Range (menzil) formülü $R=v_0^2\sin 2\alpha_0/g$ yalnız atış ve iniş aynı yükseklikteyse geçerlidir. Uçurumdan atışta kullanma.</li>
        <li>Projectile motion'da acceleration tepe noktasında da $g$'dir, sıfır değildir.</li>
        <li>Nehir sorularında tekneyi karşıya dik geçirmek için burnu akıntıya karşı çevirmek gerekir.</li>
      </ul>
    </details>

    <details id="oz-b4">
      <summary>Bölüm 4: Newton's laws of motion</summary>
      <p class="sub">Ana fikirler</p>
      <ul>
        <li>Force (kuvvet) vector'dür. Cisme etki eden force'ların vector toplamı net force'tur (net kuvvet).</li>
        <li>Dört yaygın force: normal force (yüzeye dik), friction (sürtünme, yüzeye paralel), tension (ip gerilmesi, ip boyunca, çeker), weight (ağırlık, aşağı).</li>
        <li>Newton's first law: net force sıfırsa velocity değişmez. Hareket için force gerekmez, velocity'yi değiştirmek için gerekir.</li>
        <li>First law yalnız inertial frame of reference'ta (eylemsiz referans sistemi, ivmelenmeyen) geçerlidir.</li>
        <li>Newton's second law: acceleration net force'la doğru, mass'le (kütle) ters orantılıdır.</li>
        <li>Mass cismin özelliğidir, her yerde aynıdır. Weight bir force'tur, $g$'ye bağlıdır.</li>
        <li>Newton's third law: action ve reaction (etki–tepki) eşit magnitude'da, zıt yönlüdür ve farklı cisimlere etki eder. Bu yüzden birbirlerini götürmezler.</li>
      </ul>
      <p class="sub">Free-body diagram (serbest cisim diyagramı) kuralları</p>
      <ul>
        <li>Yalnız o cisme etki eden force'ları çiz. Cismin başkasına uyguladığı force'ları çizme.</li>
        <li>Her force için "bunu hangi cisim uyguluyor?" diye sor. Cevap yoksa o force yoktur.</li>
        <li>$m\vec a$ bir force değildir, diyagrama çizilmez.</li>
      </ul>
      <p class="sub">Sık yapılan hatalar</p>
      <ul>
        <li>Masadaki kitapta normal force, weight'in reaction'ı değildir. Weight'in reaction'ı, kitabın Dünya'yı çekmesidir.</li>
        <li>Kamyon ile küçük araba çarpışınca force'lar eşittir. Acceleration'lar farklıdır, çünkü mass'ler farklıdır.</li>
      </ul>
    </details>

    <details id="oz-b5">
      <summary>Bölüm 5: Applying Newton's laws</summary>
      <p class="sub">Çözüm yöntemi</p>
      <ol>
        <li>Şekil çiz. Her cisim için ayrı free-body diagram çiz.</li>
        <li>Axis seç. Inclined plane'de (eğik düzlem) axis'leri düzleme paralel ve dik al.</li>
        <li>Force'ları component'lerine ayır.</li>
        <li>Her cisim ve her axis için $\sum F=ma$ yaz (equilibrium'daysa sıfır).</li>
        <li>İple bağlı cisimlerin acceleration magnitude'ları aynıdır. İp ve pulley (makara) hafifse tension ip boyunca aynıdır.</li>
        <li>Bilinmeyen sayısı kadar denklem olduğunu kontrol et, çöz.</li>
      </ol>
      <p class="sub">Ana fikirler</p>
      <ul>
        <li>Normal force her zaman $mg$ değildir. Inclined plane'de $mg\cos\theta$, yukarı çekilen kutuda $mg-F\sin\theta$, asansörde $m(g+a)$.</li>
        <li>Static friction (statik sürtünme) sıfır ile $\mu_s n$ arasında, gereken değeri alır. Kinetic friction (kinetik sürtünme) $\mu_k n$'dir. Genelde $\mu_s\gt\mu_k$.</li>
        <li>Circular motion'da "centripetal force" (merkezcil kuvvet) ayrı bir force değildir. Gerçek force'ların (tension, friction, normal force, weight) merkeze doğru net component'idir.</li>
        <li>Inertial frame'de centrifugal force (merkezkaç kuvveti) yoktur, diyagrama çizilmez.</li>
        <li>İp koparsa cisim tangent yönünde düz çizgide gider.</li>
        <li>Fluid resistance (akışkan direnci) speed'e bağlıdır. Fluid resistance weight'e eşit olunca terminal speed'e (limit sürat) ulaşılır.</li>
      </ul>
      <p class="sub">Sık yapılan hatalar</p>
      <ul>
        <li>Kaymayan cisimde friction'ı doğrudan $\mu_s n$ almak.</li>
        <li>Vertical circle'da (düşey çember) tepe ve dipte işaretleri karıştırmak. Dipte: $T-mg=mv^2/R$. Tepede: $T+mg=mv^2/R$.</li>
        <li>Asılı mass'in tension'ını $mg$ almak. Sistemin acceleration'ı varsa $T\ne mg$.</li>
      </ul>
    </details>

    <details id="oz-b6">
      <summary>Bölüm 6: Work and kinetic energy</summary>
      <p class="sub">Ana fikirler</p>
      <ul>
        <li>Work (iş) scalar'dır: $W=Fs\cos\varphi$. Force displacement'la aynı yönlüyse pozitif, zıtsa negatif, dikse sıfırdır.</li>
        <li>Normal force ve uniform circular motion'da centripetal force work yapmaz, çünkü harekete diktirler.</li>
        <li>Cismi hareketsiz tutmak work değildir (displacement yok).</li>
        <li>Kinetic energy (kinetik enerji) yöne bağlı değildir, asla negatif olmaz. Speed iki katına çıkarsa dört katına çıkar.</li>
        <li>Work–energy theorem (iş–enerji teoremi): total work, kinetic energy'deki değişime eşittir. Total work pozitifse cisim hızlanır.</li>
        <li>Değişken force'un work'ü integralle ya da $F$–$x$ grafiğinin altındaki alanla bulunur.</li>
        <li>Power (güç) work'ün yapılma hızıdır. Aynı work'ü daha kısa sürede yapanın power'ı daha büyüktür.</li>
      </ul>
      <p class="sub">Sık yapılan hatalar</p>
      <ul>
        <li>Work–energy theorem'de yalnız bir force'un work'ünü almak. Bütün force'ların work'ünü topla.</li>
        <li>Friction work'ünde normal force'u yanlış almak (çekme açılıysa $n\ne mg$).</li>
      </ul>
    </details>

    <details id="oz-b7">
      <summary>Bölüm 7: Potential energy and energy conservation</summary>
      <p class="sub">Ana fikirler</p>
      <ul>
        <li>Gravity'nin (yerçekimi) work'ü yalnız yükseklik farkına bağlıdır, yola bağlı değildir. Cisim yükselirse gravitational potential energy $U_{grav}$ artar, gravity negatif work yapar.</li>
        <li>$y=0$ seviyesini istediğin yere koyabilirsin. Önemli olan farktır.</li>
        <li>Elastic potential energy (yay potansiyel enerjisi) $\tfrac12kx^2$'dir, $x$ spring'in (yay) doğal boyundan sapmasıdır. Asla negatif olmaz.</li>
        <li>Conservative force (korunumlu kuvvet; gravity, spring force): work'ü yoldan bağımsızdır, kapalı yolda sıfırdır, potential energy function'ı vardır.</li>
        <li>Nonconservative force (korunumsuz kuvvet; friction, air resistance): mechanical energy'yi (mekanik enerji) internal energy'ye (iç enerji) çevirir.</li>
        <li>Yalnız conservative force'lar work yapıyorsa $K+U$ sabittir.</li>
        <li>Friction varsa: $K_1+U_1+W_{other}=K_2+U_2$ ve $W_{other}$ negatiftir.</li>
        <li>Force, potential energy eğrisinin eğiminin eksi işaretlisidir. Force sistemi her zaman düşük potential energy'ye iter.</li>
        <li>$U$'nun minimumu stable equilibrium (kararlı denge), maksimumu unstable equilibrium'dur (kararsız denge).</li>
      </ul>
      <p class="sub">Energy sorusu çözüm yöntemi</p>
      <ol>
        <li>Başlangıç ve bitiş noktalarını seç. $y=0$ seviyesini belirle.</li>
        <li>Her noktada $K$, $U_{grav}$ ve $U_{el}$ değerlerini yaz.</li>
        <li>Friction ya da dış force varsa $W_{other}$'ı hesapla.</li>
        <li>$K_1+U_1+W_{other}=K_2+U_2$ denkleminden bilinmeyeni çöz.</li>
      </ol>
      <p class="sub">Sık yapılan hatalar</p>
      <ul>
        <li>Aynı yükseklikten aynı speed'le farklı açılarla atılan cisimlerin yere çarpma speed'leri aynıdır. Yön farklıdır.</li>
        <li>Gravity'yi hem $U_{grav}$ içinde hem $W_{other}$ içinde saymak. Bir force ya potential energy olarak ya work olarak yazılır.</li>
      </ul>
    </details>

    <details id="oz-kisa">
      <summary>Slaytlarda geçen kısa konular</summary>
      <p class="muted small">Slaytlarda bir iki sayfa tutuyor. Hesap sorusu beklenmez, kavram sorusu gelebilir.</p>
      <ul>
        <li>Problem çözmenin dört adımı: Identify, Set Up, Execute, Evaluate.</li>
        <li>Unit prefixes (birim önekleri: nano, micro, milli, kilo) ve unit systems tablosu (SI, cgs, British).</li>
        <li>Four fundamental forces (dört temel kuvvet): gravitational, electromagnetic, strong, weak.</li>
        <li>Eğri boyunca work için line integral (çizgi integrali) ve üç boyutta gradient (gradyan).</li>
      </ul>
    </details></template>
<template id="tpl-form"><h3 id="fo-b1">Bölüm 1: Units and vectors</h3>
    <div class="flist">
      <div class="f"><span class="k">Unit conversion (birim çevirme)</span> $1\ \text{km/h}=\dfrac{1}{3{,}6}\ \text{m/s}$</div>
      <div class="f"><span class="k">Components (bileşenler; $\theta$, $+x$ axis'ten counterclockwise)</span> $$A_x=A\cos\theta,\qquad A_y=A\sin\theta$$</div>
      <div class="f"><span class="k">Magnitude ve direction (quadrant'ı işaretlerden kontrol et)</span> $$A=\sqrt{A_x^2+A_y^2},\qquad \tan\theta=\frac{A_y}{A_x}$$</div>
      <div class="f"><span class="k">Vector addition (toplama)</span> $R_x=A_x+B_x,\quad R_y=A_y+B_y$</div>
      <div class="f"><span class="k">Scalar product (skaler çarpım)</span> $$\vec A\cdot\vec B=AB\cos\varphi=A_xB_x+A_yB_y+A_zB_z,\qquad \cos\varphi=\frac{\vec A\cdot\vec B}{AB}$$</div>
      <div class="f"><span class="k">Vector product (vektörel çarpım; direction: right-hand rule)</span> $$|\vec A\times\vec B|=AB\sin\varphi$$ $$\vec A\times\vec B=(A_yB_z-A_zB_y)\,\hat\imath+(A_zB_x-A_xB_z)\,\hat\jmath+(A_xB_y-A_yB_x)\,\hat k$$</div>
      <div class="f"><span class="k">Unit vectors (birim vektörler)</span> $\hat\imath\times\hat\jmath=\hat k,\ \ \hat\jmath\times\hat k=\hat\imath,\ \ \hat k\times\hat\imath=\hat\jmath,\ \ \vec A\times\vec B=-\vec B\times\vec A$</div>
    </div>

    <h3 id="fo-b2">Bölüm 2: Motion along a straight line</h3>
    <div class="flist">
      <div class="f"><span class="k">Average ve instantaneous (ortalama ve anlık)</span> $$v_{ort}=\frac{\Delta x}{\Delta t},\quad a_{ort}=\frac{\Delta v}{\Delta t},\quad v=\frac{dx}{dt},\quad a=\frac{dv}{dt}$$</div>
      <div class="f"><span class="k">Constant acceleration (sabit ivme)</span> $$v=v_0+at\qquad x=x_0+v_0t+\tfrac12at^2$$ $$v^2=v_0^2+2a(x-x_0)\qquad x-x_0=\tfrac12(v_0+v)\,t$$</div>
      <div class="f"><span class="k">Free fall (serbest düşme; yukarı pozitif)</span> $a=-g$</div>
      <div class="f"><span class="k">Acceleration sabit değilse</span> $v=v_0+\int a\,dt,\quad x=x_0+\int v\,dt$</div>
      <div class="f"><span class="k">Graphs (grafikler)</span> $x$–$t$ slope'u velocity. $v$–$t$ slope'u acceleration. $v$–$t$ altındaki alan displacement.</div>
    </div>

    <h3 id="fo-b3">Bölüm 3: Motion in two or three dimensions</h3>
    <div class="flist">
      <div class="f"><span class="k">Projectile motion (eğik atış), başlangıç</span> $v_{0x}=v_0\cos\alpha_0,\quad v_{0y}=v_0\sin\alpha_0$</div>
      <div class="f"><span class="k">Projectile motion, $x_0=y_0=0$</span> $$x=v_{0x}t,\qquad y=v_{0y}t-\tfrac12gt^2,\qquad v_x=v_{0x},\qquad v_y=v_{0y}-gt$$</div>
      <div class="f"><span class="k">Yatay zeminde (atış ve iniş aynı yükseklik): maximum height, time of flight, range</span> $$h=\frac{v_{0y}^2}{2g},\qquad t_{u}=\frac{2v_{0y}}{g},\qquad R=\frac{v_0^2\sin 2\alpha_0}{g}$$</div>
      <div class="f"><span class="k">Uniform circular motion (düzgün çembersel hareket; acceleration merkeze)</span> $$a_{rad}=\frac{v^2}{R}=\frac{4\pi^2R}{T^2},\qquad v=\frac{2\pi R}{T}$$</div>
      <div class="f"><span class="k">Nonuniform circular motion: tangential acceleration</span> $a_{tan}=\dfrac{d|\vec v|}{dt},\quad a=\sqrt{a_{rad}^2+a_{tan}^2}$</div>
      <div class="f"><span class="k">Relative velocity (bağıl hız)</span> $\vec v_{P/A}=\vec v_{P/B}+\vec v_{B/A}$</div>
    </div>

    <h3 id="fo-b4">Bölüm 4: Newton's laws</h3>
    <div class="flist">
      <div class="f"><span class="k">First law</span> $\sum\vec F=0\ \Rightarrow$ velocity sabit</div>
      <div class="f"><span class="k">Second law</span> $\sum\vec F=m\vec a,\quad \sum F_x=ma_x,\quad \sum F_y=ma_y$</div>
      <div class="f"><span class="k">Weight (ağırlık)</span> $w=mg$</div>
      <div class="f"><span class="k">Third law (farklı cisimlere etki eder)</span> $\vec F_{A\to B}=-\vec F_{B\to A}$</div>
    </div>

    <h3 id="fo-b5">Bölüm 5: Applying Newton's laws</h3>
    <div class="flist">
      <div class="f"><span class="k">Equilibrium (denge)</span> $\sum F_x=0,\quad \sum F_y=0$</div>
      <div class="f"><span class="k">Inclined plane (eğik düzlem; açı $\theta$)</span> paralel component $mg\sin\theta$, dik component $mg\cos\theta$</div>
      <div class="f"><span class="k">Apparent weight (görünür ağırlık; asansör)</span> $n=m(g+a_y)$</div>
      <div class="f"><span class="k">Friction (sürtünme)</span> $f_k=\mu_k n,\qquad f_s\le\mu_s n$ (kaymıyorsa $f_s$ equilibrium'u sağlayan değer)</div>
      <div class="f"><span class="k">Friction'lı inclined plane'de aşağı kayma</span> $a=g(\sin\theta-\mu_k\cos\theta)$</div>
      <div class="f"><span class="k">Kaymanın başladığı açı</span> $\tan\theta=\mu_s$</div>
      <div class="f"><span class="k">Dynamics of circular motion (çembersel dinamik)</span> $\sum F_{merkez}=\dfrac{mv^2}{R}$</div>
      <div class="f"><span class="k">Frictionless banked curve (sürtünmesiz eğimli viraj)</span> $\tan\beta=\dfrac{v^2}{gR}$</div>
      <div class="f"><span class="k">Flat curve (düz viraj), kaymadan en büyük speed</span> $v=\sqrt{\mu_s gR}$</div>
      <div class="f"><span class="k">Vertical circle'ın tepesinde en küçük speed</span> $v=\sqrt{gR}$</div>
      <div class="f"><span class="k">Conical pendulum (konik sarkaç)</span> $\tan\beta=\dfrac{v^2}{gR},\qquad T=2\pi\sqrt{\dfrac{L\cos\beta}{g}}$</div>
    </div>

    <h3 id="fo-b6">Bölüm 6: Work and kinetic energy</h3>
    <div class="flist">
      <div class="f"><span class="k">Constant force'un work'ü (iş)</span> $W=Fs\cos\varphi=\vec F\cdot\vec s$</div>
      <div class="f"><span class="k">Kinetic energy ve work–energy theorem (iş–enerji teoremi)</span> $K=\tfrac12mv^2,\qquad W_{top}=K_2-K_1$</div>
      <div class="f"><span class="k">Varying force (değişken kuvvet; grafiğin altındaki alan)</span> $W=\displaystyle\int_{x_1}^{x_2}F_x\,dx$</div>
      <div class="f"><span class="k">Spring (yay; germek için gereken force ve work)</span> $F_x=kx,\qquad W=\tfrac12kx^2$</div>
      <div class="f"><span class="k">Power (güç)</span> $P_{ort}=\dfrac{\Delta W}{\Delta t},\qquad P=\dfrac{dW}{dt}=\vec F\cdot\vec v,\qquad 1\ \text{W}=1\ \text{J/s}$</div>
    </div>

    <h3 id="fo-b7">Bölüm 7: Potential energy and energy conservation</h3>
    <div class="flist">
      <div class="f"><span class="k">Gravitational potential energy (yerçekimi)</span> $U_{grav}=mgy,\qquad W_{grav}=mgy_1-mgy_2=-\Delta U_{grav}$</div>
      <div class="f"><span class="k">Elastic potential energy (yay)</span> $U_{el}=\tfrac12kx^2,\qquad W_{el}=\tfrac12kx_1^2-\tfrac12kx_2^2$</div>
      <div class="f"><span class="k">Yalnız conservative force'lar (korunumlu kuvvetler)</span> $K_1+U_1=K_2+U_2$</div>
      <div class="f"><span class="k">Başka force'lar da work yapıyorsa</span> $K_1+U_1+W_{other}=K_2+U_2,\qquad W_f=-f_k s$</div>
      <div class="f"><span class="k">Conservation of energy, genel (enerji korunumu)</span> $\Delta K+\Delta U+\Delta U_{int}=0$</div>
      <div class="f"><span class="k">Potential energy'den force</span> $$F_x=-\frac{dU}{dx},\qquad \vec F=-\left(\frac{\partial U}{\partial x}\hat\imath+\frac{\partial U}{\partial y}\hat\jmath+\frac{\partial U}{\partial z}\hat k\right)$$</div>
      <div class="f"><span class="k">Equilibrium</span> $dU/dx=0$. $U$ minimum: stable (kararlı). $U$ maksimum: unstable (kararsız).</div>
      <div class="f"><span class="k">Energy diagram (enerji diyagramı)</span> $K=E-U\ge0$. Cisim $U\gt E$ bölgesine giremez, $U=E$ olan turning point'te (dönüş noktası) döner.</div>
    </div></template>

      <div class="q ex" data-ex="13" data-ch="b7">

          <li>$d^2U/dx^2=6-6x$. $x=0$'da $+6$: $U$ minimum, stable. $x=2$ m'de $-6$: $U$ maksimum, unstable.</li>
        </ul></div>
      </div></template>

  {id:1,ch:"b1",q:R`Bir vector'ün component'leri $A_x=-3$, $A_y=+3$. $+x$ axis'ten counterclockwise ölçülen açısı kaç derecedir?`,o:["$135°$","$45°$","$225°$","$315°$"],a:0,e:R`$\arctan(3/{-3})=-45°$ çıkar, ama $A_x\lt0$, $A_y\gt0$: vector 2. quadrant'ta. $-45°+180°=135°$.`},

  {id:3,ch:"b2",q:R`$+x$ yönünde giden bir araba fren yapıyor. Velocity'sinin ve acceleration'ının işaretleri sırasıyla nedir?`,o:["$+,\ +$","$+,\ -$","$-,\ +$","$-,\ -$"],a:1,e:R`Velocity hareket yönünde ($+$). Yavaşlıyorsa acceleration velocity'yle zıt işaretli ($-$).`},
  {id:4,ch:"b2",q:R`Durgun halden bırakılan bir taş free fall'da $t$ sürede $h$ kadar düşüyor. $2t$ sürede toplam ne kadar düşer?`,o:["$2h$","$3h$","$h\sqrt2$","$4h$"],a:3,e:R`$h=\tfrac12gt^2$, süre iki katı olunca distance $2^2=4$ katı.`},

  {id:7,ch:"b4",q:R`Bir kamyon küçük bir arabayla çarpışıyor. Çarpışma anında force'lar için hangisi doğrudur?`,o:["Kamyonun arabaya uyguladığı force daha büyüktür.","Arabanın kamyona uyguladığı force daha büyüktür.","İki force'un magnitude'u eşittir.","Hangisinin hızlı gittiğine bağlıdır."],a:2,e:R`Newton's third law: action ve reaction eşit magnitude'da. Acceleration'lar farklı, çünkü mass'ler farklı.`},
  {id:8,ch:"b4",q:R`Bir cisim düz çizgide sabit $5$ m/s speed'le gidiyor. Üzerindeki net force:`,o:["Sıfırdır.","Hareket yönündedir.","Harekete zıttır.","$mg$'ye eşittir."],a:0,e:R`Velocity sabit, acceleration sıfır, Newton's first law: net force sıfır.`},
  {id:9,ch:"b5",q:R`$m$ mass'li bir blok, $\theta$ açılı, friction'lı inclined plane'de kaymadan duruyor. Friction force'un magnitude'u nedir?`,o:[R`$\mu_s mg\cos\theta$`,R`$mg\cos\theta$`,R`$\mu_k mg\cos\theta$`,R`$mg\sin\theta$`],a:3,e:R`Kaymıyor, static friction equilibrium'u sağlayan değeri alır: $f_s=mg\sin\theta$. $\mu_s n$ yalnız sınır değer.`},
  {id:10,ch:"b5",q:R`İpe bağlı bir top vertical circle'da dönüyor. En alt noktada tension $T$ ile weight $mg$ arasındaki ilişki nedir?`,o:["$T=mg$","$T\lt mg$","$T\gt mg$","$T=0$"],a:2,e:R`Altta merkez yukarıda: $T-mg=mv^2/R\gt0$, yani $T\gt mg$.`},
  {id:11,ch:"b6",q:R`$10$ N'luk bir force, displacement'la $60°$ açı yapıyor. Displacement $4$ m. Force'un yaptığı work kaç J'dur?`,o:["$40$","$34{,}6$","$20$","$0$"],a:2,e:R`$W=Fs\cos\varphi=10\cdot4\cdot0{,}5=20$ J.`},
  {id:12,ch:"b6",q:R`Bir cisme yapılan total work negatif. Cisim:`,o:["Hızlanır.","Yavaşlar.","Aynı speed'le gider.","Geriye doğru hareket eder."],a:1,e:R`Work–energy theorem: $W_{top}=\Delta K\lt0$, kinetic energy azalır.`},
  {id:13,ch:"b7",q:R`Aynı yükseklikte, eğimleri farklı iki frictionless ramp'tan özdeş bloklar durgun halden bırakılıyor. Dipteki speed'leri için hangisi doğrudur?`,o:["Dik ramp'taki daha hızlıdır.","Yatık ramp'taki daha hızlıdır.","Bloğun mass'ine bağlıdır.","İkisinin speed'i aynıdır."],a:3,e:R`Conservation of energy: $mgh=\tfrac12mv^2$, $v=\sqrt{2gh}$. Eğim ve mass fark etmez.`},
  {id:14,ch:"b7",q:R`Potential energy function $U(x)$'in maksimum olduğu noktada:`,o:["Force sıfırdır, equilibrium stable'dır.","Force sıfırdır, equilibrium unstable'dır.","Force en büyük değerindedir.","Kinetic energy en büyük değerindedir."],a:1,e:R`$F=-dU/dx=0$. Maksimumdan biraz kayınca force cismi daha da uzağa iter: unstable.`}

const DB = [
  {id:"B1",ch:"b3",part:"X",pt:12,n:"Ek 1",q:R`<b>(Bölüm 3)</b> $45$ m yüksekliğindeki bir uçurumun kenarından bir taş $12$ m/s speed'le yatay fırlatılıyor. (a) Taş yere kaç saniyede ulaşır? (b) Uçurumun dibinden kaç metre uzağa düşer? (c) Yere çarpma speed'i ve yatayın altındaki açısı nedir?`,
   s:R`<ul><li>(a) $45=\tfrac12(9{,}80)t^2$, $t=\sqrt{90/9{,}80}=3{,}03$ s</li><li>(b) $x=(12)(3{,}03)=36{,}4$ m</li><li>(c) $v_x=12$ m/s, $v_y=(9{,}80)(3{,}03)=29{,}7$ m/s. $v=\sqrt{12^2+29{,}7^2}=32{,}0$ m/s. Açı $\arctan(29{,}7/12)=68{,}0°$, yatayın altında.</li></ul>`},
  {id:"B2",ch:"b5",part:"C",pt:20,n:"C1",q:R`<b>(Bölüm 5)</b> $3{,}0$ kg'lık $m_1$ bloğu $30°$ eğimli inclined plane'in üzerinde, düzlemle arasında $\mu_k=0{,}25$. Hafif bir ip, düzlemin tepesindeki frictionless pulley'den geçip $5{,}0$ kg'lık asılı $m_2$ bloğuna bağlanıyor. Sistem serbest bırakılıyor ve $m_2$ aşağı iniyor. (a) Her iki blok için free-body diagram çiz. (b) Sistemin acceleration'ını bul. (c) İpteki tension'ı bul.`,
   s:R`<ul><li>(a) $m_1$: weight (aşağı), normal force (düzleme dik), tension (düzlem boyunca yukarı), kinetic friction (düzlem boyunca aşağı, çünkü blok yukarı kayıyor). $m_2$: weight (aşağı), tension (yukarı).</li><li>(b) $m_1$: $T-m_1g\sin30°-\mu_km_1g\cos30°=m_1a$. $m_2$: $m_2g-T=m_2a$. Topla: $a=\dfrac{49{,}0-14{,}7-6{,}37}{8{,}0}=3{,}49\ \text{m/s}^2$</li><li>(c) $T=m_2(g-a)=5{,}0(9{,}80-3{,}49)=31{,}5$ N</li></ul>`},
  {id:"B3",ch:"b5",part:"C",pt:10,n:"C2",q:R`<b>(Bölüm 5)</b> $0{,}50$ kg'lık bir top $1{,}2$ m uzunluğunda bir ipin ucunda horizontal circle'da dönüyor (conical pendulum). İp düşeyle $25°$ yapıyor. (a) İpteki tension kaç N'dur? (b) Topun speed'i nedir? (c) Bir turun süresi (period) nedir?`,
   s:R`<ul><li>(a) Düşey equilibrium: $T\cos25°=mg$, $T=\dfrac{(0{,}50)(9{,}80)}{\cos25°}=5{,}41$ N</li><li>(b) $R=L\sin25°=0{,}507$ m. Yatay: $T\sin25°=mv^2/R$, yani $v^2=gR\tan25°$, $v=1{,}52$ m/s</li><li>(c) Period $=2\pi R/v=2{,}09$ s</li></ul>`},
  {id:"B4",ch:"b7",part:"C",pt:20,n:"C3",q:R`<b>(Bölüm 7)</b> $2{,}0$ kg'lık bir blok, $3{,}0$ m yükseklikten frictionless eğri bir ramp'tan durgun halden bırakılıyor. Ramp'ın dibinde $2{,}5$ m uzunluğunda, $\mu_k=0{,}40$ olan pürüzlü yatay bir bölge var. Bölgenin sonunda spring constant'ı $800$ N/m olan bir spring duruyor (spring'in altı frictionless). (a) Bloğun ramp'ın dibindeki speed'i nedir? (b) Pürüzlü bölgeyi geçtikten sonraki speed'i nedir? (c) Spring en fazla ne kadar sıkışır?`,

function glossify(root){
  if(S.gloss===false) return;
  const skip = n => n.parentElement && n.parentElement.closest(".katex, script, style, textarea, .term, .no-gloss, kbd, code");
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => (!skip(n) && /[A-Za-z]/.test(n.nodeValue)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    const t=n.nodeValue; GLOSS_RE.lastIndex=0; if(!GLOSS_RE.test(t)) continue; GLOSS_RE.lastIndex=0;
    const frag=document.createDocumentFragment(); let last=0, m;
    while((m=GLOSS_RE.exec(t))){
      const trw = GLOSS_MAP.get(m[1].toLowerCase().replace(/’/g,"'"));
      if(!trw) continue;
      frag.append(t.slice(last,m.index));
      const sp=document.createElement("span"); sp.className="term"; sp.tabIndex=0; sp.dataset.tr=trw; sp.title=trw; sp.textContent=m[1];
      frag.append(sp); last=m.index+m[1].length;
    }
    frag.append(t.slice(last)); n.replaceWith(frag);
  }
}

for(const set in Q_TR_FIX) for(const id in Q_TR_FIX[set]){
  const f=Q_TR_FIX[set][id]; Q_TR[set][id]=Q_TR[set][id]||{};
  for(const k in f){ if(k==="q") Q_TR[set][id].q=f[k]; else Q_TR[set][id].o[+k.slice(1)]=f[k]; }
}
/* English display text; option arrays without English text are numbers or symbols, shown with a decimal point. */
function enQ(set,id,fallback){ const e=(Q_EN[set]||{})[id]; return e&&e.q ? e.q : fallback; }
function enO(set,id,fallback){ const e=(Q_EN[set]||{})[id]; return e&&e.o ? e.o : fallback.map(x=>String(x).replace(/\{,\}/g,".")); }
/* Turkish translation box: opens on hover, on tap of the question, or with the TR button; an overlay, so nothing jumps. */
function trBox(set,id){
  if(S.gloss===false) return "";
  const t=(Q_TR[set]||{})[id]; if(!t) return "";
  const opts = t.o ? `<ol class="tr-opts" type="A">${t.o.map(o=>`<li>${o}</li>`).join("")}</ol>` : "";
  return `<div class="trbox no-gloss" id="tr-${set}-${id}" role="note"><span class="trlab">Türkçesi</span>${t.q.startsWith("<p")?t.q:`<p>${t.q}</p>`}${opts}</div>`;
}
function trBtn(set,id){
  if(S.gloss===false || !(Q_TR[set]||{})[id]) return "";
  return `<button class="btn ghost trbtn" type="button" data-trq="${set}:${id}" aria-expanded="false" aria-controls="tr-${set}-${id}" title="Sorunun Türkçesi">TR</button>`;
}

const BANK_C = [{"id": "C2.19", "ref": "2.19", "ch": 2, "lvl": 2, "title": "Accelerating antelope", "text": "An antelope with constant acceleration runs between two posts 80.0 m apart in 7.00 s. As it passes the second post its speed is 16.0 m/s. Find (a) its speed at the first post and (b) its acceleration.", "parts": [{"l": "(a) v₁", "u": "m/s", "a": 6.857142857142858}, {"l": "(b) a", "u": "m/s²", "a": 1.3061224489795917}], "sol": ["x = ½(v₁ + v₂)t → v₁ = 2x/t − v₂ = 6.86 m/s", "a = (v₂ − v₁)/t = 1.31 m/s²"], "star": false, "trTitle": "Hızlanan antilop", "tr": "Sabit ivmeyle koşan bir antilop, aralarında 80.0 m olan iki direğin arasını 7.00 s'de koşuyor. İkinci direğin yanından geçerken sürati 16.0 m/s. (a) Birinci direkteki süratini ve (b) ivmesini bulun."}, {"id": "C2.31", "ref": "2.31", "ch": 2, "lvl": 2, "title": "Jumping flea", "text": "A flea jumps straight up and reaches a maximum height of 0.380 m. (a) What is its speed as it leaves the ground? (b) How long is it in the air?", "parts": [{"l": "(a) v₀", "u": "m/s", "a": 2.72910241654651}, {"l": "(b) t", "u": "s", "a": 0.5569596768462265}], "sol": ["v₀ = √(2gh) = 2.73 m/s", "t = 2v₀/g = 0.557 s"], "star": false, "trTitle": "Zıplayan pire", "tr": "Bir pire dümdüz yukarı zıplıyor ve en fazla 0.380 m yüksekliğe çıkıyor. (a) Yerden ayrılırken sürati nedir? (b) Havada ne kadar süre kalır?"}, {"id": "C2.32", "ref": "2.32", "ch": 2, "lvl": 2, "title": "Rock thrown up from a roof", "text": "A rock is thrown straight up at 18.0 m/s from the edge of a 25.0-m-tall roof and falls past the roof to the street. Ignore air resistance. Find (a) its speed just before it hits the street and (b) the total time of flight.", "parts": [{"l": "(a) v", "u": "m/s", "a": 28.53068523537421}, {"l": "(b) t", "u": "s", "a": 4.748029105650429}], "sol": ["v² = v₀² + 2gH → v = 28.5 m/s", "t = (v₀ + v)/g = 4.75 s (yukarı +, son hız aşağı)"], "star": false, "trTitle": "Çatıdan yukarı atılan taş", "tr": "Bir taş, 25.0 m yüksekliğindeki bir çatının kenarından 18.0 m/s ile dümdüz yukarı atılıyor, sonra çatının yanından geçerek sokağa düşüyor. Hava direncini ihmal edin. (a) Sokağa çarpmadan hemen önceki süratini ve (b) toplam uçuş süresini bulun."}, {"id": "C2.38", "ref": "2.38", "ch": 2, "lvl": 2, "title": "Dropped brick", "text": "A brick is dropped from rest from a roof and hits the ground 2.20 s later. Find (a) the height of the roof and (b) the brick's speed just before impact.", "parts": [{"l": "(a) h", "u": "m", "a": 23.716000000000005}, {"l": "(b) v", "u": "m/s", "a": 21.560000000000002}], "sol": ["h = ½gt² = 23.7 m", "v = gt = 21.6 m/s"], "star": false, "trTitle": "Bırakılan tuğla", "tr": "Bir tuğla bir çatıdan durgun hâlde bırakılıyor ve 2.20 s sonra yere çarpıyor. (a) Çatının yüksekliğini ve (b) tuğlanın çarpmadan hemen önceki süratini bulun."}, {"id": "C2.43", "ref": "2.43", "ch": 2, "lvl": 1, "title": "Round trip to the hand", "text": "You throw a rock straight up and catch it 4.00 s later at the same height. What maximum height above your hand did it reach?", "parts": [{"l": "h", "u": "m", "a": 19.6}], "sol": ["Çıkış süresi t/2 = 2.00 s", "h = ½g(t/2)² = 19.6 m"], "star": false, "trTitle": "Ele gidiş-dönüş", "tr": "Bir taşı dümdüz yukarı atıyorsunuz ve 4.00 s sonra aynı yükseklikte yakalıyorsunuz. Taş elinizin en fazla ne kadar yukarısına çıktı?"}, {"id": "C2.47", "ref": "2.47", "ch": 2, "lvl": 2, "title": "Rock from a bridge", "text": "You throw a rock straight up from a bridge. It passes your hand on the way down 5.00 s after the throw. How fast is it moving when it reaches the water 22.0 m below your hand?", "parts": [{"l": "v", "u": "m/s", "a": 32.11619529147249}], "sol": ["Elin hizasına dönüş t = 2v₀/g → v₀ = 24.5 m/s", "v² = v₀² + 2gd → v = 32.1 m/s"], "star": false, "trTitle": "Köprüden atılan taş", "tr": "Bir köprüden bir taşı dümdüz yukarı atıyorsunuz. Taş, atıştan 5.00 s sonra aşağı inerken elinizin yanından geçiyor. Elinizin 22.0 m altındaki suya ulaştığında sürati ne kadardır?"}, {"id": "C3.9", "ref": "3.9", "ch": 3, "lvl": 1, "title": "Book sliding off a table", "text": "A book slides off a horizontal table at 1.60 m/s and hits the floor 0.350 s later. Find (a) the table height, (b) the horizontal distance to the impact point, (c) the speed and (d) the angle below the horizontal just before impact.", "parts": [{"l": "(a) h", "u": "m", "a": 0.60025}, {"l": "(b) x", "u": "m", "a": 0.5599999999999999}, {"l": "(c) v", "u": "m/s", "a": 3.7848249629276123}, {"l": "(d) θ", "u": "°", "a": 64.99225189764243}], "sol": ["h = ½gt² = 0.600 m; x = v₀t = 0.560 m", "v_y = gt = 3.43 m/s → v = 3.78 m/s, θ = 65.0°"], "star": false, "trTitle": "Masadan kayıp düşen kitap", "tr": "Bir kitap yatay bir masanın kenarından 1.60 m/s ile kayıp düşüyor ve 0.350 s sonra yere çarpıyor. (a) Masanın yüksekliğini, (b) çarpma noktasına olan yatay uzaklığı, (c) çarpmadan hemen önceki sürati ve (d) o andaki hızın yatayın altında yaptığı açıyı bulun."}, {"id": "C3.12", "ref": "3.12", "ch": 3, "lvl": 1, "title": "Basketball shot", "text": "A ball is thrown with an upward velocity component of 9.0 m/s and a horizontal component of 11.0 m/s. Find (a) the time to the highest point, (b) the maximum height, (c) the time to return to the launch height and (d) the horizontal distance covered by then.", "parts": [{"l": "(a) t", "u": "s", "a": 0.9183673469387754}, {"l": "(b) H", "u": "m", "a": 4.13265306122449}, {"l": "(c) T", "u": "s", "a": 1.8367346938775508}, {"l": "(d) x", "u": "m", "a": 20.20408163265306}], "sol": ["t = v_y/g = 0.918 s, H = v_y²/2g = 4.13 m", "T = 2t = 1.84 s, x = vₓT = 20.2 m"], "star": false, "trTitle": "Basketbol atışı", "tr": "Bir top, hızının yukarı doğru bileşeni 9.0 m/s ve yatay bileşeni 11.0 m/s olacak şekilde atılıyor. (a) En yüksek noktaya çıkma süresini, (b) en büyük yüksekliği, (c) atıldığı yüksekliğe geri dönme süresini ve (d) o ana kadar aldığı yatay yolu bulun."}, {"id": "C3.13", "ref": "3.13", "ch": 3, "lvl": 2, "title": "Car leaping a river", "text": "A car drives horizontally off a road 25.0 m above a river and must land on the far bank, which is 4.0 m above the river and 60.0 m away horizontally. Find (a) the minimum launch speed and (b) the speed on landing.", "parts": [{"l": "(a) v₀", "u": "m/s", "a": 28.982753492378876}, {"l": "(b) v", "u": "m/s", "a": 35.3779592401823}], "sol": ["Düşüş 21.0 m: t = √(2Δh/g) = 2.07 s", "v₀ = w/t = 29.0 m/s; v = √(v₀² + (gt)²) = 35.4 m/s"], "star": false, "trTitle": "Nehrin üstünden atlayan araba", "tr": "Bir araba, nehrin 25.0 m üstündeki bir yoldan yatay olarak fırlıyor ve karşı kıyıya inmesi gerekiyor; karşı kıyı nehrin 4.0 m üstünde ve yatayda 60.0 m uzakta. (a) Gereken en küçük fırlama süratini ve (b) iniş anındaki sürati bulun."}, {"id": "C3.16", "ref": "3.16", "ch": 3, "lvl": 1, "title": "Artillery shell", "text": "A shell is fired over level ground at 65.0 m/s, 50.0° above the horizontal. Find (a) the horizontal and (b) vertical velocity components, (c) the time to the top, (d) the maximum height and (e) the range.", "parts": [{"l": "(a) vₓ", "u": "m/s", "a": 41.781194629625055}, {"l": "(b) v_y", "u": "m/s", "a": 49.79288880273357}, {"l": "(c) t", "u": "s", "a": 5.080907020687099}, {"l": "(d) H", "u": "m", "a": 126.49651914905053}, {"l": "(e) R", "u": "m", "a": 424.5727302527121}], "sol": ["vₓ = v₀cos α = 41.8, v_y = v₀sin α = 49.8 m/s", "t = v_y/g = 5.08 s, H = 126 m, R = vₓ·2t = 425 m", "Tepede: v = (vₓ, 0), a = (0, −g)"], "star": false, "trTitle": "Top mermisi", "tr": "Düz bir arazide bir mermi, yatayın 50.0° üstüne doğru 65.0 m/s ile ateşleniyor. Hızın (a) yatay ve (b) düşey bileşenlerini, (c) tepeye çıkma süresini, (d) en büyük yüksekliği ve (e) menzili (gittiği yatay uzaklığı) bulun."}, {"id": "C3.21", "ref": "3.21", "ch": 3, "lvl": 2, "title": "Throw from a rooftop", "text": "From the roof of an 18.0-m building you throw a rock at 28.0 m/s, 35.0° above the horizontal. Find (a) the maximum height above the roof, (b) the speed just before it hits the ground and (c) the horizontal distance from the building.", "parts": [{"l": "(a) H", "u": "m", "a": 13.15959713348662}, {"l": "(b) v", "u": "m/s", "a": 33.71646482061843}, {"l": "(c) x", "u": "m", "a": 95.42665849489867}], "sol": ["H = v_y²/2g = 13.2 m", "v = √(v₀² + 2gh) = 33.7 m/s", "−h = v_y t − ½gt² → t = 4.16 s, x = vₓt = 95.4 m"], "star": false, "trTitle": "Çatıdan eğik atış", "tr": "18.0 m yüksekliğindeki bir binanın çatısından bir taşı yatayın 35.0° üstüne doğru 28.0 m/s ile atıyorsunuz. (a) Taşın çatının üstünde çıktığı en büyük yüksekliği, (b) yere çarpmadan hemen önceki süratini ve (c) binadan olan yatay uzaklığını bulun."}, {"id": "C3.22", "ref": "3.22", "ch": 3, "lvl": 2, "title": "Two times at one height", "text": "A rock is launched from the ground at 16.0 m/s, 55.0° above the horizontal. At what (a) earlier and (b) later time is it 6.00 m above the ground? (c) What is the magnitude of its vertical velocity at those times?", "parts": [{"l": "(a) t₁", "u": "s", "a": 0.586308448156445}, {"l": "(b) t₂", "u": "s", "a": 2.0884737372769973}, {"l": "(c) |v_y|", "u": "m/s", "a": 7.3606099166907075}], "sol": ["6.0 = v_y t − ½gt², v_y = 13.1 m/s", "t = (v_y ∓ √(v_y² − 2gy))/g → 0.586 s, 2.09 s", "|v_y| = √(v_y² − 2gy) = 7.36 m/s (önce +, sonra −)"], "star": false, "trTitle": "Aynı yükseklikte iki an", "tr": "Bir taş yerden yatayın 55.0° üstüne doğru 16.0 m/s ile fırlatılıyor. (a) Daha erken ve (b) daha geç hangi anlarda yerden 6.00 m yüksektedir? (c) O anlarda düşey hızının büyüklüğü nedir?"}, {"id": "C3.29", "ref": "3.29", "ch": 3, "lvl": 1, "title": "Pilot blackout (C2)", "text": "The bottom of a jet's dive is a circular arc of radius 320 m. The pilot blacks out at an upward acceleration of 6.0g. At what speed does this happen, in (a) m/s and (b) km/h?", "parts": [{"l": "(a) v", "u": "m/s", "a": 137.17142559585798}, {"l": "(b) v", "u": "km/h", "a": 493.81713214508875}], "sol": ["a = v²/R = 6.0g → v = √(6.0gR) = 137 m/s = 494 km/h", "Tuzak: v² = 2as değil! Dairesel hareket."], "star": true, "trTitle": "Pilotun bayılması (C2)", "tr": "Bir jetin dalışının en alt kısmı, yarıçapı 320 m olan bir çember yayıdır. Pilot, yukarı doğru ivme 6.0g olduğunda bayılıyor. Bu hangi süratte olur? (a) m/s ve (b) km/h cinsinden bulun."}, {"id": "C3.31", "ref": "3.31", "ch": 3, "lvl": 1, "title": "Ferris wheel", "text": "A Ferris wheel of radius 12.0 m turns so that a rider on the rim moves at a constant 6.50 m/s. Find (a) the magnitude of her acceleration and (b) the time for one revolution. (Direction: up at the bottom, down at the top.)", "parts": [{"l": "(a) a", "u": "m/s²", "a": 3.5208333333333335}, {"l": "(b) T", "u": "s", "a": 11.59972672094693}], "sol": ["a = v²/R = 3.52 m/s², merkeze doğru", "T = 2πR/v = 11.6 s"], "star": false, "trTitle": "Dönme dolap", "tr": "Yarıçapı 12.0 m olan bir dönme dolap, kenardaki bir yolcu sabit 6.50 m/s süratle hareket edecek şekilde dönüyor. (a) Yolcunun ivmesinin büyüklüğünü ve (b) bir tam turun süresini bulun. (Yön: en altta yukarı, en üstte aşağı.)"}, {"id": "C3.35", "ref": "3.35", "ch": 3, "lvl": 1, "title": "Moving walkway", "text": "A moving walkway 40.0 m long moves at 1.2 m/s. A woman walks at 1.5 m/s relative to it. How long does she take to reach the other end walking (a) with the walkway and (b) against it?", "parts": [{"l": "(a) t", "u": "s", "a": 14.814814814814813}, {"l": "(b) t", "u": "s", "a": 133.33333333333331}], "sol": ["Yere göre hız 2.7 m/s → 14.8 s", "Ters yönde 0.3 m/s → 133 s"], "star": false, "trTitle": "Yürüyen bant", "tr": "40.0 m uzunluğundaki yürüyen bir bant 1.2 m/s ile hareket ediyor. Bir kadın banda göre 1.5 m/s ile yürüyor. Diğer uca (a) bantla aynı yönde ve (b) bandın tersine yürürken ne kadar sürede varır?"}, {"id": "C3.41", "ref": "3.41", "ch": 3, "lvl": 1, "title": "Crossing a river I", "text": "A river flows south at 1.8 m/s and is 400 m wide. You point a boat due east and move at 4.5 m/s relative to the water. Find (a) your speed relative to the earth, (b) its angle south of east, (c) the crossing time and (d) how far south you land.", "parts": [{"l": "(a) v", "u": "m/s", "a": 4.846648326421054}, {"l": "(b) θ", "u": "°", "a": 21.80140948635181}, {"l": "(c) t", "u": "s", "a": 88.88888888888889}, {"l": "(d) d", "u": "m", "a": 160.0}], "sol": ["v = √(4.5² + 1.8²) = 4.85 m/s, tan θ = 1.8/4.5", "t = W/v_doğu = 88.9 s; d = 1.8 × t = 160 m"], "star": false, "trTitle": "Nehri geçmek I", "tr": "Bir nehir 1.8 m/s ile güneye akıyor ve 400 m genişliğinde. Teknenin burnunu tam doğuya çeviriyorsunuz ve suya göre 4.5 m/s ile gidiyorsunuz. (a) Yere göre süratinizi, (b) hareket yönünüzün doğudan güneye doğru açısını, (c) karşıya geçme süresini ve (d) ne kadar güneyde karaya çıktığınızı bulun."}, {"id": "C3.42", "ref": "3.42", "ch": 3, "lvl": 1, "title": "Crossing a river II", "text": "Same river (1.8 m/s south, 400 m wide), same boat speed 4.5 m/s relative to the water. You want to land directly east of the start. Find (a) the heading angle north of east, (b) your speed relative to the earth and (c) the crossing time.", "parts": [{"l": "(a) θ", "u": "°", "a": 23.578178478201835}, {"l": "(b) v", "u": "m/s", "a": 4.124318125460256}, {"l": "(c) t", "u": "s", "a": 96.98572899377439}], "sol": ["sin θ = 1.8/4.5 → θ = 23.6°", "v = √(4.5² − 1.8²) = 4.12 m/s, t = 97.0 s"], "star": false, "trTitle": "Nehri geçmek II", "tr": "Aynı nehir (1.8 m/s güneye, 400 m genişlik), teknenin suya göre sürati yine 4.5 m/s. Başladığınız noktanın tam doğusunda karaya çıkmak istiyorsunuz. (a) Teknenin burnunun doğudan kuzeye doğru açısını, (b) yere göre süratinizi ve (c) karşıya geçme süresini bulun."}, {"id": "C3.43", "ref": "3.43", "ch": 3, "lvl": 2, "title": "Flying west in a crosswind", "text": "A pilot wants to fly due west. The wind blows toward the south at 60 km/h and the plane's airspeed is 280 km/h. Find (a) the heading angle north of west and (b) the ground speed.", "parts": [{"l": "(a) θ", "u": "°", "a": 12.373625116188558}, {"l": "(b) v", "u": "km/h", "a": 273.4958866235469}], "sol": ["sin θ = 60.0/280.0 → θ = 12.4°", "v = √(280.0² − 60.0²) = 273 km/h"], "star": false, "trTitle": "Yan rüzgârda batıya uçmak", "tr": "Bir pilot tam batıya uçmak istiyor. Rüzgâr 60 km/h ile güneye doğru esiyor ve uçağın havaya göre sürati 280 km/h. (a) Uçağın burnunun batıdan kuzeye doğru açısını ve (b) yere göre sürati bulun."}, {"id": "C4.7", "ref": "4.7", "ch": 4, "lvl": 2, "title": "Skater stopped by friction", "text": "A 72.0 kg skater moving at 2.80 m/s slows uniformly to rest in 4.00 s because of friction. What is the friction force?", "parts": [{"l": "f", "u": "N", "a": 50.4}], "sol": ["a = 2.8/4.0 = 0.700 m/s²", "f = ma = 50.4 N"], "star": false, "trTitle": "Sürtünmeyle duran patenci", "tr": "2.80 m/s ile giden 72.0 kg'lık bir patenci, sürtünme yüzünden 4.00 s içinde düzgün şekilde yavaşlayıp duruyor. Sürtünme kuvveti nedir?"}, {"id": "C4.8", "ref": "4.8", "ch": 4, "lvl": 2, "title": "Scale in an elevator", "text": "Your normal weight is 700 N. The elevator accelerates upward at 2.00 m/s². (a) What does the scale read? (b) What is the tension in a light string holding a 4.00 kg package?", "parts": [{"l": "(a) n", "u": "N", "a": 842.8571428571428}, {"l": "(b) T", "u": "N", "a": 47.2}], "sol": ["m = 700.0/9.8 = 71.4 kg; n = m(g + a) = 843 N", "T = m_p(g + a) = 47.2 N"], "star": false, "trTitle": "Asansörde tartı", "tr": "Normal ağırlığınız 700 N. Asansör 2.00 m/s² ile yukarı doğru ivmeleniyor. (a) Tartı ne gösterir? (b) 4.00 kg'lık bir paketi tutan hafif bir ipteki gerilme nedir?"}, {"id": "C4.10", "ref": "4.10", "ch": 4, "lvl": 2, "title": "Pushing a block of ice", "text": "A worker pushes a block of ice on a frictionless floor with a constant horizontal 90.0 N force. Starting from rest it moves 12.0 m in 4.00 s. (a) What is its mass? (b) If the push stops then, how far does it move in the next 4.00 s?", "parts": [{"l": "(a) m", "u": "kg", "a": 60.0}, {"l": "(b) d", "u": "m", "a": 24.0}], "sol": ["x = ½at² → a = 1.50 m/s², m = F/a = 60.0 kg", "v = at = 6.00 m/s, sabit hız: d = vt = 24.0 m"], "star": false, "trTitle": "Buz kalıbını itmek", "tr": "Bir işçi, sürtünmesiz bir zeminde bir buz kalıbını sabit, yatay 90.0 N'luk bir kuvvetle itiyor. Durgun hâlden başlayan kalıp 4.00 s'de 12.0 m yol alıyor. (a) Kütlesi nedir? (b) İtme o anda biterse, sonraki 4.00 s içinde ne kadar yol alır?"}, {"id": "C4.23", "ref": "4.23", "ch": 4, "lvl": 2, "title": "Boxes in contact", "text": "Boxes A (30.0 kg) and B (10.0 kg) touch on a frictionless floor. A 120 N horizontal force pushes A, which pushes B. What force does A exert on B?", "parts": [{"l": "F_AB", "u": "N", "a": 30.0}], "sol": ["a = F/(m_A + m_B) = 3.00 m/s²", "F_AB = m_B a = 30.0 N"], "star": false, "trTitle": "Birbirine değen kutular", "tr": "A (30.0 kg) ve B (10.0 kg) kutuları sürtünmesiz bir zeminde birbirine değiyor. 120 N'luk yatay bir kuvvet A'yı itiyor, A da B'yi itiyor. A, B'ye ne kadar kuvvet uygular?"}, {"id": "C4.24", "ref": "4.24", "ch": 4, "lvl": 2, "title": "Elevator passenger", "text": "The floor pushes up with 600 N on a passenger who weighs 640 N. What is the passenger's acceleration (magnitude; direction is down)?", "parts": [{"l": "a", "u": "m/s²", "a": 0.6124999999999999}], "sol": ["Net 40 N aşağı, m = 65.3 kg", "a = 0.612 m/s² aşağı. Tepkiler: yolcunun zemine itmesi ve Dünya'yı çekmesi"], "star": false, "trTitle": "Asansördeki yolcu", "tr": "Zemin, ağırlığı 640 N olan bir yolcuyu 600 N ile yukarı itiyor. Yolcunun ivmesi nedir (büyüklüğü; yönü aşağı)?"}, {"id": "C4.28", "ref": "4.28", "ch": 4, "lvl": 2, "title": "Bullet into wood", "text": "A 2.00 g bullet moving at 400 m/s penetrates 0.150 m into a tree. Assume a constant force. Find (a) the stopping time and (b) the force on the bullet.", "parts": [{"l": "(a) t", "u": "s", "a": 0.0007499999999999999}, {"l": "(b) F", "u": "N", "a": 1066.6666666666667}], "sol": ["a = v²/(2d) = 533333 m/s²", "t = v/a = 0.000750 s, F = ma = 1067 N"], "star": false, "trTitle": "Tahtaya giren mermi", "tr": "400 m/s ile giden 2.00 g'lık bir mermi bir ağaca 0.150 m giriyor. Kuvveti sabit kabul edin. (a) Durma süresini ve (b) mermiye etki eden kuvveti bulun."}, {"id": "C4.30", "ref": "4.30", "ch": 4, "lvl": 2, "title": "Pushing a chair downward", "text": "You push a 15.0 kg chair with a 40.0 N force directed 35° below the horizontal. What normal force does the floor exert on it?", "parts": [{"l": "n", "u": "N", "a": 169.94305745404185}], "sol": ["Düşeyde denge: n = mg + F sin 35° = 170 N"], "star": false, "trTitle": "Sandalyeyi aşağı doğru itmek", "tr": "15.0 kg'lık bir sandalyeyi, yatayın 35° altına doğru yönelmiş 40.0 N'luk bir kuvvetle itiyorsunuz. Zemin sandalyeye ne kadar normal kuvvet uygular?"}, {"id": "C5.4", "ref": "5.4", "ch": 5, "lvl": 2, "title": "Traction frame (C1)", "text": "A 82.0 kg patient lies on a horizontal bed; the coefficient of static friction is 0.450. (a) What is the largest traction force along the spine that does not make the patient slide? (b) The force is applied to a neck collar by two symmetric cables, each at 60° to the line across the collar. What is the tension in each cable?", "parts": [{"l": "(a) F", "u": "N", "a": 361.62}, {"l": "(b) T", "u": "N", "a": 208.7814043443525}], "sol": ["F = μ_s n = μ_s mg = 362 N", "2T sin 60° = F → T = 209 N"], "star": true, "trTitle": "Germe (traksiyon) düzeneği (C1)", "tr": "82.0 kg'lık bir hasta yatay bir yatakta yatıyor; statik sürtünme katsayısı 0.450. (a) Omurga boyunca uygulanan ve hastayı kaydırmayan en büyük germe kuvveti nedir? (b) Bu kuvvet, boyun tasmasına iki simetrik kabloyla uygulanıyor; her kablo, tasmanın enine çizgisiyle 60° açı yapıyor. Her kablodaki gerilme nedir?"}, {"id": "C5.5", "ref": "5.5", "ch": 5, "lvl": 2, "title": "Picture on two wires", "text": "A picture hangs from two wires that make equal angles with the vertical. What angle makes the tension in each wire 0.80 of the picture's weight?", "parts": [{"l": "θ", "u": "°", "a": 51.31781254651057}], "sol": ["2T cos θ = w → cos θ = 1/(2 × 0.8) → θ = 51.3°"], "star": false, "trTitle": "İki tele asılı tablo", "tr": "Bir tablo, düşeyle eşit açılar yapan iki tele asılı. Hangi açıda her teldeki gerilme tablonun ağırlığının 0.80 katı olur?"}, {"id": "C5.6", "ref": "5.6", "ch": 5, "lvl": 2, "title": "Wrecking ball on two cables", "text": "A 3000 kg wrecking ball hangs at rest from two cables: cable B makes 35° with the vertical, cable A is horizontal. Find (a) T_B and (b) T_A.", "parts": [{"l": "(a) T_B", "u": "N", "a": 35890.77290958681}, {"l": "(b) T_A", "u": "N", "a": 20586.101623365466}], "sol": ["T_B cos 35° = mg → T_B = 35891 N", "T_A = T_B sin 35° = mg tan 35° = 20586 N"], "star": false, "trTitle": "İki kabloya asılı yıkım güllesi", "tr": "3000 kg'lık bir yıkım güllesi iki kabloya asılı ve duruyor: B kablosu düşeyle 35° açı yapıyor, A kablosu yatay. (a) T_B'yi ve (b) T_A'yı bulun."}, {"id": "C5.10", "ref": "5.10", "ch": 5, "lvl": 2, "title": "Apparent weight", "text": "A 550 N student stands on a scale in an elevator; student plus elevator have mass 900 kg. (a) The scale reads 510 N: find the acceleration (negative = down). (b) It reads 720 N: find the acceleration. (c) Find the cable tension in case (a).", "parts": [{"l": "(a) a", "u": "m/s²", "a": -0.7127272727272728}, {"l": "(b) a", "u": "m/s²", "a": 3.0290909090909093}, {"l": "(c) T", "u": "N", "a": 8178.545454545455}], "sol": ["m = 56.1 kg; a = (n − w)/m = -0.713 m/s² (aşağı)", "(b) a = 3.03 m/s² (yukarı)", "T = M(g + a) = 8179 N. Tartı 0 → serbest düşüş"], "star": false, "trTitle": "Görünür ağırlık", "tr": "Ağırlığı 550 N olan bir öğrenci asansörde bir tartının üstünde duruyor; öğrenci ile asansörün toplam kütlesi 900 kg. (a) Tartı 510 N gösteriyor: ivmeyi bulun (negatif = aşağı). (b) Tartı 720 N gösteriyor: ivmeyi bulun. (c) (a) durumunda kablodaki gerilmeyi bulun."}, {"id": "C5.12", "ref": "5.12", "ch": 5, "lvl": 2, "title": "Rocket and power supply", "text": "A 140 kg rocket has an engine thrust of 2000 N. A 20.0 N device rests on its floor. Find (a) the initial acceleration and (b) the force of the floor on the device.", "parts": [{"l": "(a) a", "u": "m/s²", "a": 4.485714285714286}, {"l": "(b) n", "u": "N", "a": 29.15451895043732}], "sol": ["a = F/m − g = 4.49 m/s²", "n = m_d(g + a) = 29.2 N"], "star": false, "trTitle": "Roket ve güç kaynağı", "tr": "140 kg'lık bir roketin motor itme kuvveti 2000 N. Roketin tabanında 20.0 N'luk bir cihaz duruyor. (a) İlk ivmeyi ve (b) tabanın cihaza uyguladığı kuvveti bulun."}, {"id": "C5.15", "ref": "5.15", "ch": 5, "lvl": 2, "title": "Atwood machine", "text": "A 12.0 kg load and a 25.0 kg counterweight hang from the two ends of a rope over a frictionless pulley and are released. Find (a) the acceleration and (b) the tension.", "parts": [{"l": "(a) a", "u": "m/s²", "a": 3.4432432432432436}, {"l": "(b) T", "u": "N", "a": 158.91891891891893}], "sol": ["a = (m₂ − m₁)g/(m₁ + m₂) = 3.44 m/s²", "T = m₁(g + a) = 159 N (iki ağırlığın arasında)"], "star": false, "trTitle": "Atwood makinesi", "tr": "12.0 kg'lık bir yük ve 25.0 kg'lık bir karşı ağırlık, sürtünmesiz bir makaradan geçen bir ipin iki ucuna asılı ve serbest bırakılıyor. (a) İvmeyi ve (b) ipteki gerilmeyi bulun."}, {"id": "C5.16", "ref": "5.16", "ch": 5, "lvl": 2, "title": "Ice block on a ramp", "text": "A 6.00 kg block of ice starts from rest at the top of a frictionless 1.50 m ramp and reaches 2.80 m/s at the bottom. (a) What is the ramp angle? (b) What would the final speed be with a 8.0 N friction force along the ramp?", "parts": [{"l": "(a) θ", "u": "°", "a": 15.466009953420548}, {"l": "(b) v", "u": "m/s", "a": 1.9595917942265422}], "sol": ["a = v²/2L = 2.61 = g sin θ → θ = 15.5°", "a' = a − f/m = 1.28, v = √(2a'L) = 1.96 m/s"], "star": false, "trTitle": "Rampadaki buz kalıbı", "tr": "6.00 kg'lık bir buz kalıbı, 1.50 m uzunluğundaki sürtünmesiz bir rampanın tepesinden durgun hâlde harekete başlıyor ve altta 2.80 m/s sürate ulaşıyor. (a) Rampanın açısı nedir? (b) Rampa boyunca 8.0 N'luk bir sürtünme kuvveti olsaydı son sürat ne olurdu?"}, {"id": "C5.17", "ref": "5.17", "ch": 5, "lvl": 2, "title": "Table block and hanging block", "text": "A 5.00 kg block on a frictionless table is tied by a horizontal rope over a pulley to a hanging block of mass m. When released, the tension is 15.0 N. Find (a) the acceleration and (b) m.", "parts": [{"l": "(a) a", "u": "m/s²", "a": 3.0}, {"l": "(b) m", "u": "kg", "a": 2.205882352941176}], "sol": ["a = T/m_masa = 3.00 m/s²", "mg − T = ma → m = T/(g − a) = 2.21 kg"], "star": false, "trTitle": "Masadaki blok ve asılı blok", "tr": "Sürtünmesiz bir masadaki 5.00 kg'lık bir blok, bir makaradan geçen yatay bir iple kütlesi m olan asılı bir bloğa bağlı. Serbest bırakıldığında ipteki gerilme 15.0 N. (a) İvmeyi ve (b) m'yi bulun."}, {"id": "C5.25", "ref": "5.25", "ch": 5, "lvl": 2, "title": "Pushing a box", "text": "A worker pushes a 20.0 kg box at a constant 3.00 m/s; μ_k = 0.25. (a) What horizontal force is needed? (b) If the push is removed, how far does the box slide?", "parts": [{"l": "(a) F", "u": "N", "a": 49.0}, {"l": "(b) d", "u": "m", "a": 1.8367346938775508}], "sol": ["F = μ_k mg = 49.0 N", "d = v²/(2μ_k g) = 1.84 m"], "star": false, "trTitle": "Kutu itmek", "tr": "Bir işçi 20.0 kg'lık bir kutuyu sabit 3.00 m/s ile itiyor; μ_k = 0.25. (a) Ne kadar yatay kuvvet gerekir? (b) İtme kesilirse kutu ne kadar kayar?"}, {"id": "C5.26", "ref": "5.26", "ch": 5, "lvl": 2, "title": "Static vs kinetic friction", "text": "A 50 N box rests on a floor (μ_s = 0.45, μ_k = 0.25). Find the friction force (a) with no push, (b) with an 8 N push. (c) Minimum push to start it; (d) push to keep it at constant speed. (e) With a 20 N push, find the acceleration.", "parts": [{"l": "(a) f", "u": "N", "a": 0.0}, {"l": "(b) f", "u": "N", "a": 8.0}, {"l": "(c) F", "u": "N", "a": 22.5}, {"l": "(d) F", "u": "N", "a": 12.5}, {"l": "(e) a", "u": "m/s²", "a": 1.47}], "sol": ["(a) 0 (b) 8 N: statik sürtünme dengeden", "(c) μ_s w = 22.5 N (d) μ_k w = 12.5 N", "(e) a = (20.0 − 12.5)/(w/g) = 1.47 m/s²"], "star": false, "trTitle": "Statik ve kinetik sürtünme", "tr": "50 N'luk bir kutu zeminde duruyor (μ_s = 0.45, μ_k = 0.25). Sürtünme kuvvetini (a) hiç itme yokken, (b) 8 N'luk bir itmeyle bulun. (c) Kutuyu harekete geçirmek için gereken en küçük itme nedir? (d) Kutuyu sabit süratle götüren itme nedir? (e) 20 N'luk bir itmeyle ivmeyi bulun."}, {"id": "C5.27", "ref": "5.27", "ch": 5, "lvl": 2, "title": "Measuring friction coefficients", "text": "A 42.0 kg crate starts to move when your push exceeds 350 N; afterward 240 N keeps it at constant speed. Find (a) μ_s, (b) μ_k and (c) the push needed for an acceleration of 1.20 m/s².", "parts": [{"l": "(a) μ_s", "u": "", "a": 0.8503401360544217}, {"l": "(b) μ_k", "u": "", "a": 0.5830903790087463}, {"l": "(c) F", "u": "N", "a": 290.4}], "sol": ["μ_s = 350.0/mg = 0.850, μ_k = 240.0/mg = 0.583", "F = f_k + ma = 290 N"], "star": false, "trTitle": "Sürtünme katsayılarını ölçmek", "tr": "42.0 kg'lık bir sandık, itmeniz 350 N'u geçince hareket etmeye başlıyor; sonra 240 N onu sabit süratle götürüyor. (a) μ_s'yi, (b) μ_k'yi ve (c) 1.20 m/s²'lik bir ivme için gereken itmeyi bulun."}, {"id": "C5.30", "ref": "5.30", "ch": 5, "lvl": 2, "title": "Rocks sliding up a hill", "text": "Rocks slide up a 38° slope (μ_k = 0.40, μ_s = 0.55). (a) What is the magnitude of their deceleration going up? (b) At the top they slide back down (tan 38° > μ_s). What is the acceleration going down?", "parts": [{"l": "(a) a", "u": "m/s²", "a": 9.122484612329801}, {"l": "(b) a", "u": "m/s²", "a": 2.9444803040531013}], "sol": ["Yukarı: g(sin θ + μ_k cos θ) = 9.12", "tan θ = 0.781 > μ_s → kayar; aşağı: g(sin θ − μ_k cos θ) = 2.94"], "star": false, "trTitle": "Tepeye doğru kayan kayalar", "tr": "Kayalar 38°'lik bir yokuşta yukarı doğru kayıyor (μ_k = 0.40, μ_s = 0.55). (a) Yukarı çıkarken yavaşlama ivmelerinin büyüklüğü nedir? (b) Tepede geri aşağı kayıyorlar (tan 38° > μ_s). Aşağı inerken ivme nedir?"}, {"id": "C5.31", "ref": "5.31", "ch": 5, "lvl": 2, "title": "Pushing along a steep ramp", "text": "A 12.0 kg box is on a 50° ramp with μ_k = 0.25. You push it with 130 N parallel to the ramp. Find its acceleration when it is pushed and moving (a) down the ramp and (b) up the ramp.", "parts": [{"l": "(a) a", "u": "m/s²", "a": 16.765739232167295}, {"l": "(b) a", "u": "m/s²", "a": 1.7512681470353266}], "sol": ["Aşağı: (F + mg sin θ − μ_k mg cos θ)/m = 16.8", "Yukarı: (F − mg sin θ − μ_k mg cos θ)/m = 1.75"], "star": false, "trTitle": "Dik rampada itmek", "tr": "12.0 kg'lık bir kutu 50°'lik bir rampada duruyor, μ_k = 0.25. Kutuyu rampaya paralel 130 N'luk bir kuvvetle itiyorsunuz. İtilirken ve hareket ederken ivmesini (a) rampadan aşağı ve (b) rampadan yukarı giderken bulun."}, {"id": "C5.33", "ref": "5.33", "ch": 5, "lvl": 2, "title": "Two stacked boxes down a ramp (C3)", "text": "Two boxes (lower 50.0 kg, upper 30.0 kg on top of it) are lowered at constant speed down a ramp by a rope parallel to the ramp. The ramp rises 2.60 m over 5.00 m horizontally; μ_k between ramp and lower box is 0.42; the boxes do not slip on each other. Find (a) the rope force and (b) the friction force on the upper box (direction: up the ramp).", "parts": [{"l": "(a) T", "u": "N", "a": 69.55779721679228}, {"l": "(b) f_s", "u": "N", "a": 135.63770457274492}], "sol": ["θ = arctan(2.6/5.0) = 27.47°", "T = Mg(sin θ − μ_k cos θ) = 69.6 N", "Üst kutu dengede: f_s = m g sin θ = 136 N (μ_s n değil!)"], "star": true, "trTitle": "Rampadan indirilen üst üste iki kutu (C3)", "tr": "İki kutu (alttaki 50.0 kg, onun üstündeki 30.0 kg), rampaya paralel bir iple rampadan aşağı sabit süratle indiriliyor. Rampa yatayda 5.00 m boyunca 2.60 m yükseliyor; rampa ile alttaki kutu arasında μ_k 0.42; kutular birbirinin üstünde kaymıyor. (a) İpteki kuvveti ve (b) üstteki kutuya etki eden sürtünme kuvvetini bulun (yönü: rampadan yukarı)."}, {"id": "C5.34", "ref": "5.34", "ch": 5, "lvl": 2, "title": "Block on table, block hanging", "text": "Block A (
