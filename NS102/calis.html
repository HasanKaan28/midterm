50 N) on a table is tied over a pulley to hanging block B (30 N). Once moving, B descends at constant speed. (a) Find μ_k. (b) A 50 N cat sits on A; B is set moving downward again. Find the magnitude of its acceleration (it slows down).", "parts": [{"l": "(a) μ_k", "u": "", "a": 0.6}, {"l": "(b) a", "u": "m/s²", "a": 2.261538461538462}], "sol": ["Sabit hız: μ_k w_A = w_B → μ_k = 0.600", "Kediyle sürtünme 60.0 N > 30.0 N: a = 2.26 m/s², B yavaşlar"], "star": false, "trTitle": "Masada bir blok, asılı bir blok", "tr": "Masadaki A bloğu (50 N), bir makaradan geçen iple asılı B bloğuna (30 N) bağlı. Hareket başladıktan sonra B sabit süratle iniyor. (a) μ_k'yi bulun. (b) A'nın üstüne 50 N'luk bir kedi oturuyor; B yeniden aşağı doğru harekete geçiriliyor. İvmesinin büyüklüğünü bulun (yavaşlıyor)."}, {"id": "C5.35", "ref": "5.35", "ch": 5, "lvl": 2, "title": "Stopping distance", "text": "(a) With μ_k = 0.75, what is the shortest locked-wheel stopping distance from 30.0 m/s? (b) On wet road (μ_k = 0.30), what speed gives the same distance?", "parts": [{"l": "(a) d", "u": "m", "a": 61.224489795918366}, {"l": "(b) v", "u": "m/s", "a": 18.973665961010276}], "sol": ["d = v²/(2μ_k g) = 61.2 m", "v = √(2μ_k g d) = 19.0 m/s"], "star": false, "trTitle": "Durma mesafesi", "tr": "(a) μ_k = 0.75 iken, tekerlekler kilitlenmiş olarak 30.0 m/s'den en kısa durma mesafesi nedir? (b) Islak yolda (μ_k = 0.30) hangi sürat aynı mesafeyi verir?"}, {"id": "C5.36", "ref": "5.36", "ch": 5, "lvl": 2, "title": "Box on a tilting ramp", "text": "A box sits on a ramp whose angle is slowly increased (μ_s = 0.40, μ_k = 0.28). (a) At what angle does it start to slip? (b) What is its acceleration then? (c) How fast is it moving after sliding 4.0 m?", "parts": [{"l": "(a) θ", "u": "°", "a": 21.80140948635181}, {"l": "(b) a", "u": "m/s²", "a": 1.0918885884810647}, {"l": "(c) v", "u": "m/s", "a": 2.955521731919513}], "sol": ["tan θ = μ_s → θ = 21.8°", "a = g(sin θ − μ_k cos θ) = 1.09 m/s², v = √(2aL) = 2.96 m/s"], "star": false, "trTitle": "Eğimi artan rampadaki kutu", "tr": "Bir kutu, açısı yavaş yavaş artırılan bir rampada duruyor (μ_s = 0.40, μ_k = 0.28). (a) Hangi açıda kaymaya başlar? (b) O zaman ivmesi nedir? (c) 4.0 m kaydıktan sonra sürati ne olur?"}, {"id": "C5.39", "ref": "5.39", "ch": 5, "lvl": 2, "title": "Released from rest", "text": "Block A (2.50 kg) on a table (μ_k = 0.30) is tied over a pulley to hanging block B (2.00 kg). They are released from rest. Find (a) their speed after moving 4.00 cm and (b) the tension.", "parts": [{"l": "(a) v", "u": "m/s", "a": 0.4666666666666667}, {"l": "(b) T", "u": "N", "a": 14.155555555555557}], "sol": ["a = (m_B − μ_k m_A)g/(m_A + m_B) = 2.72 m/s²", "v = √(2ad) = 0.467 m/s, T = m_B(g − a) = 14.2 N"], "star": false, "trTitle": "Durgun hâlden bırakılan bloklar", "tr": "Masadaki A bloğu (2.50 kg, μ_k = 0.30), bir makaradan geçen iple asılı B bloğuna (2.00 kg) bağlı. Durgun hâlden serbest bırakılıyorlar. (a) 4.00 cm hareket ettikten sonraki süratlerini ve (b) ipteki gerilmeyi bulun."}, {"id": "C5.43", "ref": "5.43", "ch": 5, "lvl": 1, "title": "Stone on a string", "text": "A 0.60 kg stone on a 0.80 m string moves in a horizontal circle on a frictionless table. The string breaks above 50 N. What is the maximum speed?", "parts": [{"l": "v", "u": "m/s", "a": 8.16496580927726}], "sol": ["T = mv²/r → v = √(Tr/m) = 8.16 m/s"], "star": false, "trTitle": "İpe bağlı taş", "tr": "0.80 m'lik bir ipe bağlı 0.60 kg'lık bir taş, sürtünmesiz bir masada yatay bir çember çiziyor. İp 50 N'un üstünde kopuyor. En büyük sürat nedir?"}, {"id": "C5.45", "ref": "5.45", "ch": 5, "lvl": 2, "title": "Car inside a vertical loop", "text": "A 1.40 kg toy car moves at a constant 10.0 m/s around the inside of a vertical circle of radius 4.00 m. Find the normal force (a) at the bottom and (b) at the top.", "parts": [{"l": "(a) n", "u": "N", "a": 48.71999999999999}, {"l": "(b) n", "u": "N", "a": 21.279999999999998}], "sol": ["v²/R = 25.0 m/s²", "Alt: n = m(g + v²/R) = 48.7 N; üst: n = m(v²/R − g) = 21.3 N"], "star": false, "trTitle": "Düşey çemberin içindeki araba", "tr": "1.40 kg'lık bir oyuncak araba, yarıçapı 4.00 m olan düşey bir çemberin içinde sabit 10.0 m/s ile dönüyor. Normal kuvveti (a) en altta ve (b) en üstte bulun."}, {"id": "C5.46", "ref": "5.46", "ch": 5, "lvl": 2, "title": "Loop: top to bottom", "text": "A 0.900 kg car moves at constant speed inside a vertical circular track. At the top the normal force is 8.00 N. What is it at the bottom?", "parts": [{"l": "n", "u": "N", "a": 25.64}], "sol": ["Sabit hızda n_alt − n_üst = 2mg → 25.6 N"], "star": false, "trTitle": "Çember: tepeden dibe", "tr": "0.900 kg'lık bir araba, düşey çember şeklindeki bir pistin içinde sabit süratle hareket ediyor. Tepede normal kuvvet 8.00 N. En altta kaçtır?"}, {"id": "C5.48", "ref": "5.48", "ch": 5, "lvl": 1, "title": "Flat curve", "text": "A car takes a flat curve of radius 200 m at 25.0 m/s. (a) What minimum μ_s prevents sliding? (b) If μ_s is only one-third of that, what is the maximum safe speed?", "parts": [{"l": "(a) μ_s", "u": "", "a": 0.3188775510204081}, {"l": "(b) v", "u": "m/s", "a": 14.433756729740645}], "sol": ["μ_s = v²/(gR) = 0.319", "μ/3 → v/√3 = 14.4 m/s"], "star": false, "trTitle": "Düz viraj", "tr": "Bir araba, yarıçapı 200 m olan düz (eğimsiz) bir virajı 25.0 m/s ile dönüyor. (a) Kaymayı önleyen en küçük μ_s nedir? (b) μ_s bunun yalnızca üçte biri olsaydı, en büyük güvenli sürat ne olurdu?"}, {"id": "C5.49", "ref": "5.49", "ch": 5, "lvl": 2, "title": "Banked curve", "text": "A curve of radius 250 m is to be banked so cars can take it at 90 km/h without friction. (a) What bank angle? (b) What normal force acts on a 1200 kg car?", "parts": [{"l": "(a) β", "u": "°", "a": 14.31104126260641}, {"l": "(b) n", "u": "N", "a": 12136.622264864307}], "sol": ["tan β = v²/(gR) = 0.255 → β = 14.3° (kütleden bağımsız)", "n = mg/cos β = 12137 N"], "star": false, "trTitle": "Eğimli viraj", "tr": "Yarıçapı 250 m olan bir viraja, arabalar sürtünme olmadan 90 km/h ile dönebilsin diye eğim verilecek. (a) Eğim açısı ne olmalı? (b) 1200 kg'lık bir arabaya ne kadar normal kuvvet etki eder?"}, {"id": "C5.56", "ref": "5.56", "ch": 5, "lvl": 2, "title": "Pulling out of a dive", "text": "A 60.0 kg pilot pulls out of a vertical dive along a circle; at the bottom the speed is 100 m/s. (a) What minimum radius keeps the acceleration at or below 5.00g? (b) What is her apparent weight at the bottom?", "parts": [{"l": "(a) R", "u": "m", "a": 204.08163265306123}, {"l": "(b) n", "u": "N", "a": 3528.0}], "sol": ["R = v²/(5.0g) = 204 m", "n = m(g + 5.0g) = 3528 N"], "star": false, "trTitle": "Dalıştan çıkış", "tr": "60.0 kg'lık bir pilot, düşey bir dalıştan bir çember yayı boyunca çıkıyor; en altta sürat 100 m/s. (a) İvmeyi 5.00g veya altında tutan en küçük yarıçap nedir? (b) En altta görünür ağırlığı nedir?"}, {"id": "C5.57", "ref": "5.57", "ch": 5, "lvl": 1, "title": "Swinging a pail of water", "text": "You swing a pail of water in a vertical circle of radius 0.800 m. What minimum speed at the top keeps the water in?", "parts": [{"l": "v", "u": "m/s", "a": 2.8000000000000003}], "sol": ["Tepede sadece yerçekimi: mg = mv²/R → v = √(gR) = 2.80 m/s"], "star": false, "trTitle": "Su kovasını çevirmek", "tr": "Bir su kovasını yarıçapı 0.800 m olan düşey bir çemberde çeviriyorsunuz. Suyun dökülmemesi için tepede en az ne kadar sürat gerekir?"}, {"id": "C5.58", "ref": "5.58", "ch": 5, "lvl": 2, "title": "Pendulum at the bottom", "text": "A 70 N ball hangs from a 4.00 m rope and swings like a pendulum, moving at 4.50 m/s through the lowest point. Find (a) its acceleration (direction: up) and (b) the rope tension.", "parts": [{"l": "(a) a", "u": "m/s²", "a": 5.0625}, {"l": "(b) T", "u": "N", "a": 106.16071428571428}], "sol": ["a = v²/L = 5.06 m/s² yukarı", "T = m(g + a) = 106 N"], "star": false, "trTitle": "En alt noktadaki sarkaç", "tr": "70 N'luk bir top 4.00 m'lik bir ipe asılı ve sarkaç gibi salınıyor; en alçak noktadan 4.50 m/s ile geçiyor. (a) İvmesini (yönü: yukarı) ve (b) ipteki gerilmeyi bulun."}, {"id": "C6.3", "ref": "6.3", "ch": 6, "lvl": 1, "title": "Pushing a crate at constant speed", "text": "A worker pushes a 35.0 kg crate 5.0 m across a level floor at constant speed with a horizontal force (μ_k = 0.30). Find (a) the force, (b) its work, (c) the work of friction and (d) the total work.", "parts": [{"l": "(a) F", "u": "N", "a": 102.9}, {"l": "(b) W_F", "u": "J", "a": 514.5}, {"l": "(c) W_f", "u": "J", "a": -514.5}, {"l": "(d) W_top", "u": "J", "a": 0.0}], "sol": ["F = μ_k mg = 103 N; W_F = Fd = 514 J", "W_f = −W_F; normal ve yerçekimi 0; toplam 0 (sabit hız)"], "star": false, "trTitle": "Sandığı sabit süratle itmek", "tr": "Bir işçi 35.0 kg'lık bir sandığı düz bir zeminde yatay bir kuvvetle sabit süratle 5.0 m itiyor (μ_k = 0.30). (a) Kuvveti, (b) bu kuvvetin yaptığı işi, (c) sürtünmenin yaptığı işi ve (d) toplam işi bulun."}, {"id": "C6.4", "ref": "6.4", "ch": 6, "lvl": 2, "title": "Pushing at an angle below horizontal", "text": "Same crate (35.0 kg, μ_k = 0.30, 5.0 m, constant speed), but the push is 25° below the horizontal. Find (a) the force and (b) its work.", "parts": [{"l": "(a) F", "u": "N", "a": 132.00391942098454}, {"l": "(b) W_F", "u": "J", "a": 598.1809004529838}], "sol": ["F cos θ = μ_k(mg + F sin θ) → F = 132 N", "W_F = F cos θ · d = 598 J; W_f = −598 J; toplam 0"], "star": false, "trTitle": "Yatayın altına doğru açılı itmek", "tr": "Aynı sandık (35.0 kg, μ_k = 0.30, 5.0 m, sabit sürat), ama bu sefer itme yatayın 25° altına doğru. (a) Kuvveti ve (b) bu kuvvetin yaptığı işi bulun."}, {"id": "C6.10", "ref": "6.10", "ch": 6, "lvl": 2, "title": "Package down a chute", "text": "A 15.0 kg package slides 2.50 m down a chute inclined 50° below the horizontal (μ_k = 0.35). Find the work done by (a) friction and (b) gravity, and (c) the net work.", "parts": [{"l": "(a) W_f", "u": "J", "a": -82.67855629593112}, {"l": "(b) W_g", "u": "J", "a": 281.5213328462244}, {"l": "(c) W_net", "u": "J", "a": 198.8427765502933}], "sol": ["n = mg cos θ = 94.5 N; W_f = −μ_k n d = -82.7 J", "W_g = mgd sin θ = 282 J; W_n = 0; net 199 J"], "star": false, "trTitle": "Kanaldan kayan paket", "tr": "15.0 kg'lık bir paket, yatayın 50° altına eğimli bir kanalda 2.50 m aşağı kayıyor (μ_k = 0.35). (a) Sürtünmenin ve (b) yer çekiminin yaptığı işi ve (c) net işi bulun."}, {"id": "C6.12", "ref": "6.12", "ch": 6, "lvl": 2, "title": "Carried up a conveyor belt", "text": "A 10.0 kg box rides 6.00 m up a conveyor belt inclined at 30°, at constant speed, held by friction. Find the work done by (a) friction and (b) gravity.", "parts": [{"l": "(a) W_f", "u": "J", "a": 293.99999999999994}, {"l": "(b) W_g", "u": "J", "a": -293.99999999999994}], "sol": ["Statik sürtünme yukarı = mg sin θ; W_f = +294 J", "W_g = −294 J; W_n = 0"], "star": false, "trTitle": "Taşıyıcı bantla yukarı çıkan kutu", "tr": "10.0 kg'lık bir kutu, 30° eğimli bir taşıyıcı bantta sürtünme sayesinde kaymadan sabit süratle 6.00 m yukarı çıkıyor. (a) Sürtünmenin ve (b) yer çekiminin yaptığı işi bulun."}, {"id": "C6.16", "ref": "6.16", "ch": 6, "lvl": 2, "title": "Sliding book", "text": "A 2.00 kg book slides on a rough table: 3.50 m/s at A, 1.50 m/s at B. (a) Total work from A to B? (b) Speed at C if a further −1.00 J of work is done from B to C? (c) Speed at C if instead +1.00 J were done?", "parts": [{"l": "(a) W", "u": "J", "a": -10.0}, {"l": "(b) v_C", "u": "m/s", "a": 1.118033988749895}, {"l": "(c) v_C", "u": "m/s", "a": 1.8027756377319946}], "sol": ["W = ΔK = -10.0 J", "K_B = 2.25 J → K_C = K_B ∓ 1.0: v = 1.12 ve 1.80 m/s"], "star": false, "trTitle": "Kayan kitap", "tr": "2.00 kg'lık bir kitap pürüzlü bir masada kayıyor: A noktasında 3.50 m/s, B noktasında 1.50 m/s. (a) A'dan B'ye toplam iş nedir? (b) B'den C'ye ayrıca −1.00 J iş yapılırsa C'deki sürat nedir? (c) Bunun yerine +1.00 J iş yapılsaydı C'deki sürat ne olurdu?"}, {"id": "C6.24", "ref": "6.24", "ch": 6, "lvl": 2, "title": "Rock thrown upward (energy)", "text": "A 4.00 N rock thrown straight up is moving upward at 20.0 m/s when 12.0 m above the ground. Using the work–energy theorem, find (a) its launch speed and (b) its maximum height.", "parts": [{"l": "(a) v₀", "u": "m/s", "a": 25.203174403237384}, {"l": "(b) h", "u": "m", "a": 32.40816326530612}], "sol": ["−mg·h = ½mv² − ½mv₀² → v₀ = 25.2 m/s", "h_max = v₀²/2g = 32.4 m"], "star": false, "trTitle": "Yukarı atılan taş (enerji)", "tr": "Dümdüz yukarı atılan 4.00 N'luk bir taş, yerden 12.0 m yüksekteyken 20.0 m/s ile yukarı gidiyor. İş–enerji teoremini kullanarak (a) atış süratini ve (b) çıktığı en büyük yüksekliği bulun."}, {"id": "C6.28", "ref": "6.28", "ch": 6, "lvl": 2, "title": "Ice down a frictionless incline", "text": "A 3.00 kg block of ice starts from rest and slides 1.80 m down a frictionless incline at 30°. What is its final speed?", "parts": [{"l": "v", "u": "m/s", "a": 4.199999999999999}], "sol": ["W_g = mgd sin θ = ½mv² → v = 4.20 m/s"], "star": false, "trTitle": "Sürtünmesiz eğik düzlemde buz", "tr": "3.00 kg'lık bir buz kalıbı durgun hâlden başlıyor ve 30°'lik sürtünmesiz bir eğik düzlemde 1.80 m aşağı kayıyor. Son sürati nedir?"}, {"id": "C6.29", "ref": "6.29", "ch": 6, "lvl": 1, "title": "Kinetic energy ratios", "text": "Object A has 32 J of kinetic energy; B has one-quarter of A's mass and also 32 J. (a) v_B/v_A = ? (b) If −24 J of total work is done on each, by what factor does each speed change?", "parts": [{"l": "(a) v_B/v_A", "u": "", "a": 2.0}, {"l": "(b) faktör", "u": "", "a": 0.5}], "sol": ["K = ½mv², m_B = m_A/4 → v_B = 2v_A", "K: 32 → 8 J, hız √(8/32) = 0.500 katına iner"], "star": false, "trTitle": "Kinetik enerji oranları", "tr": "A cisminin kinetik enerjisi 32 J; B'nin kütlesi A'nınkinin dörtte biri ve onun kinetik enerjisi de 32 J. (a) v_B/v_A = ? (b) Her birine −24 J toplam iş yapılırsa, her birinin sürati hangi çarpanla değişir?"}, {"id": "C6.32", "ref": "6.32", "ch": 6, "lvl": 2, "title": "Stretching a spring", "text": "It takes 16.0 J of work to stretch a spring 8.00 cm. Find (a) k, (b) the force at that stretch, (c) the work to compress it 5.00 cm and (d) the force needed then.", "parts": [{"l": "(a) k", "u": "N/m", "a": 5000.0}, {"l": "(b) F", "u": "N", "a": 400.0}, {"l": "(c) W", "u": "J", "a": 6.25}, {"l": "(d) F", "u": "N", "a": 250.0}], "sol": ["W = ½kx² → k = 5000 N/m; F = kx = 400 N", "W = ½k(0.05)² = 6.25 J, F = 250 N"], "star": false, "trTitle": "Yayı germek", "tr": "Bir yayı 8.00 cm germek için 16.0 J iş gerekiyor. (a) k'yi, (b) bu uzamadaki kuvveti, (c) yayı 5.00 cm sıkıştırmak için gereken işi ve (d) o durumda gereken kuvveti bulun."}, {"id": "C6.37", "ref": "6.37", "ch": 6, "lvl": 2, "title": "Box hits a spring", "text": "A 5.0 kg box moving at 2.5 m/s on a frictionless floor runs into a spring with k = 60 N/cm. What is the maximum compression?", "parts": [{"l": "x", "u": "cm", "a": 7.216878364870323}], "sol": ["k = 6000 N/m; ½mv² = ½kx² → x = v√(m/k) = 7.22 cm"], "star": false, "trTitle": "Yaya çarpan kutu", "tr": "Sürtünmesiz bir zeminde 2.5 m/s ile giden 5.0 kg'lık bir kutu, k = 60 N/cm olan bir yaya çarpıyor. Yayın en büyük sıkışması nedir?"}, {"id": "C6.40", "ref": "6.40", "ch": 6, "lvl": 1, "title": "Spring launcher", "text": "A 4.00 kg block is pushed against a spring (k = 300 N/m) compressed 0.025 m and released on a frictionless floor. Find (a) the spring's work and (b) the block's final speed.", "parts": [{"l": "(a) W", "u": "J", "a": 0.09375}, {"l": "(b) v", "u": "m/s", "a": 0.21650635094610965}], "sol": ["W = ½kx² = 0.0938 J", "v = √(2W/m) = 0.217 m/s"], "star": false, "trTitle": "Yaylı fırlatıcı", "tr": "4.00 kg'lık bir blok, 0.025 m sıkıştırılmış bir yaya (k = 300 N/m) dayalıyken sürtünmesiz bir zeminde serbest bırakılıyor. (a) Yayın yaptığı işi ve (b) bloğun son süratini bulun."}, {"id": "C6.50", "ref": "6.50", "ch": 6, "lvl": 2, "title": "Average power of friction", "text": "A 25.0 kg rock slides at 6.00 m/s on rough ground (μ_k = 0.25) until it stops. What average power does friction deliver?", "parts": [{"l": "P", "u": "W", "a": 183.75000000000003}], "sol": ["K = 450 J; t = v/(μ_k g) = 2.45 s", "P = K/t = 184 W"], "star": false, "trTitle": "Sürtünmenin ortalama gücü", "tr": "25.0 kg'lık bir kaya pürüzlü bir zeminde (μ_k = 0.25) 6.00 m/s ile kayıyor ve sonunda duruyor. Sürtünmenin ortalama gücü nedir?"}, {"id": "C6.54", "ref": "6.54", "ch": 6, "lvl": 2, "title": "Elevator motor", "text": "An elevator (500 kg empty) must rise 24.0 m at constant speed in 20.0 s; the motor provides at most 25 kW. How many 70 kg passengers can ride? (round down)", "parts": [{"l": "N", "u": "kişi", "a": 23}], "sol": ["v = 1.20 m/s; F = P/v = 20833 N", "Toplam kütle 2126 kg → (2126 − 500)/70 = 23.2 → 23"], "star": false, "trTitle": "Asansör motoru", "tr": "Bir asansör (boşken 500 kg) 20.0 s içinde sabit süratle 24.0 m yükselmeli; motor en fazla 25 kW güç veriyor. 70 kg'lık kaç yolcu binebilir? (aşağı yuvarlayın)"}, {"id": "C7.5", "ref": "7.5", "ch": 7, "lvl": 1, "title": "Speed from energy", "text": "A ball is thrown at 12.0 m/s from a 24.0 m roof. Using energy, find its speed just before hitting the ground. (Does the launch angle matter?)", "parts": [{"l": "v", "u": "m/s", "a": 24.78709341572747}], "sol": ["½mv² = ½mv₀² + mgh → v = 24.8 m/s", "Açıdan bağımsız (hava direnci yoksa)"], "star": false, "trTitle": "Enerjiden sürat bulmak", "tr": "Bir top, 24.0 m yüksekliğindeki bir çatıdan 12.0 m/s ile atılıyor. Enerjiyi kullanarak yere çarpmadan hemen önceki süratini bulun. (Atış açısı önemli mi?)"}, {"id": "C7.10", "ref": "7.10", "ch": 7, "lvl": 2, "title": "Swing", "text": "A 30.0 kg child on a swing with 2.50 m ropes is released from rest at 40° from the vertical. Find (a) her potential energy relative to the bottom and (b) her speed at the bottom.", "parts": [{"l": "(a) U", "u": "J", "a": 171.95733430755118}, {"l": "(b) v", "u": "m/s", "a": 3.385826677071654}], "sol": ["Δh = L(1 − cos θ) = 0.585 m; U = mgΔh = 172 J", "v = √(2gΔh) = 3.39 m/s; gerilmenin işi 0"], "star": false, "trTitle": "Salıncak", "tr": "İpleri 2.50 m olan bir salıncaktaki 30.0 kg'lık bir çocuk, düşeyle 40° açı yaptığı konumdan durgun hâlde bırakılıyor. (a) En alt noktaya göre potansiyel enerjisini ve (b) en alttaki süratini bulun."}, {"id": "C7.15", "ref": "7.15", "ch": 7, "lvl": 2, "title": "Spring potential energy", "text": "A force of 800 N stretches a spring 0.080 m. Find its potential energy (a) at that stretch and (b) when compressed 0.040 m.", "parts": [{"l": "(a) U", "u": "J", "a": 32.0}, {"l": "(b) U", "u": "J", "a": 8.0}], "sol": ["k = F/x = 10000 N/m", "U = ½kx²: 32.0 J ve 8.00 J"], "star": false, "trTitle": "Yay potansiyel enerjisi", "tr": "800 N'luk bir kuvvet bir yayı 0.080 m geriyor. Yayın potansiyel enerjisini (a) bu uzamada ve (b) yay 0.040 m sıkıştırıldığında bulun."}, {"id": "C7.21", "ref": "7.21", "ch": 7, "lvl": 2, "title": "Book dropped on a spring", "text": "A spring has k = 1500 N/m. (a) How far must it be compressed to store 4.00 J? (b) A 1.50 kg book is dropped onto the vertical spring from 0.600 m above its top. Find the maximum compression.", "parts": [{"l": "(a) x", "u": "m", "a": 0.07302967433402215}, {"l": "(b) x", "u": "m", "a": 0.11868544438996426}], "sol": ["x = √(2U/k) = 0.0730 m", "mg(h + x) = ½kx² → x = 0.119 m"], "star": false, "trTitle": "Yayın üstüne düşen kitap", "tr": "Bir yayın yay sabiti k = 1500 N/m. (a) 4.00 J enerji depolaması için ne kadar sıkıştırılmalıdır? (b) 1.50 kg'lık bir kitap, düşey duran yayın üst ucunun 0.600 m yukarısından yayın üstüne bırakılıyor. Yayın en büyük sıkışmasını bulun."}, {"id": "C7.24", "ref": "7.24", "ch": 7, "lvl": 2, "title": "Spring with friction", "text": "A 3.00 kg block attached to a spring (k = 900 N/m) compressed 0.040 m is released on a floor with μ_k = 0.35. What is its speed after moving 0.025 m?", "parts": [{"l": "v", "u": "m/s", "a": 0.4909175083453431}], "sol": ["½k(x₁² − x₂²) − μ_k mg d = ½mv², x₂ = 0.015 m", "v = 0.491 m/s"], "star": false, "trTitle": "Sürtünmeli zeminde yay", "tr": "0.040 m sıkıştırılmış bir yaya (k = 900 N/m) bağlı 3.00 kg'lık bir blok, μ_k = 0.35 olan bir zeminde serbest bırakılıyor. 0.025 m hareket ettikten sonra sürati nedir?"}, {"id": "C7.29", "ref": "7.29", "ch": 7, "lvl": 2, "title": "Skier over a rough patch", "text": "A 60.0 kg skier moving at 7.00 m/s crosses a rough patch 5.00 m long (μ_k = 0.25), then skis down a frictionless 3.00 m hill. Find (a) her speed at the bottom and (b) the internal energy produced on the patch.", "parts": [{"l": "(a) v", "u": "m/s", "a": 9.126883367283709}, {"l": "(b) ΔU_iç", "u": "J", "a": 735.0}], "sol": ["Yamadan sonra v₁² = v₀² − 2μ_k gL = 24.5", "v = √(v₁² + 2gh) = 9.13 m/s; iç enerji μ_k mgL = 735 J"], "star": false, "trTitle": "Pürüzlü bölgeden geçen kayakçı", "tr": "7.00 m/s ile giden 60.0 kg'lık bir kayakçı, 5.00 m uzunluğundaki pürüzlü bir bölgeyi (μ_k = 0.25) geçiyor, sonra 3.00 m yüksekliğindeki sürtünmesiz bir tepeden aşağı kayıyor. (a) En alttaki süratini ve (b) pürüzlü bölgede oluşan iç enerjiyi (ısıyı) bulun."}, {"id": "C7.30", "ref": "7.30", "ch": 7, "lvl": 1, "title": "Toolbox sliding off a roof", "text": "A 90 N toolbox starts from rest and slides 5.00 m down a roof inclined at 40°; the friction force is 25 N. How fast is it moving at the edge?", "parts": [{"l": "v", "u": "m/s", "a": 5.9808831728314695}], "sol": ["(w sin θ − f)d = ½mv², m = 9.18 kg", "v = 5.98 m/s"], "star": false, "trTitle": "Çatıdan kayan alet çantası", "tr": "90 N'luk bir alet çantası durgun hâlden başlıyor ve 40° eğimli bir çatıdan 5.00 m aşağı kayıyor; sürtünme kuvveti 25 N. Çatının kenarına geldiğinde sürati ne kadardır?"}];
const BANK_B = [{"id": "BQ2.1", "ref": "Q2.1", "ch": 2, "q": "Does a car's speedometer show speed or velocity? Why?", "a": "Sürat (büyüklük). Yön göstermediği için hız vektörünü ölçmez.", "star": false, "tr": "Bir arabanın hız göstergesi sürati mi yoksa hızı (yönlü hız, vektör) mı gösterir? Neden?"}, {"id": "BQ2.3", "ref": "Q2.3", "ch": 2, "q": "With constant acceleration, can an object reverse its direction of motion once? Twice? Explain.", "a": "Bir kez evet (yukarı atılan top). İki kez hayır: sabit a ile v doğrusal değişir, sıfırdan sadece bir kez geçer.", "star": false, "tr": "Sabit ivmeyle hareket eden bir cisim hareket yönünü bir kez tersine çevirebilir mi? İki kez? Açıklayın."}, {"id": "BQ2.4", "ref": "Q2.4", "ch": 2, "q": "When is the average velocity over an interval equal to the instantaneous velocity?", "a": "Hız sabitken (ivme sıfır).", "star": false, "tr": "Bir zaman aralığındaki ortalama hız ne zaman anlık hıza eşit olur?"}, {"id": "BQ2.5", "ref": "Q2.5", "ch": 2, "q": "Can an object (a) slow down while the magnitude of its acceleration grows, (b) speed up while its acceleration shrinks?", "a": "(a) Evet: v ile a zıt yönde ve |a| büyüyor. (b) Evet: v ile a aynı yönde ama |a| küçülüyor; yine hızlanıyor.", "star": false, "tr": "Bir cisim (a) ivmesinin büyüklüğü artarken yavaşlayabilir mi, (b) ivmesi azalırken hızlanabilir mi?"}, {"id": "BQ2.6", "ref": "Q2.6", "ch": 2, "q": "When is the magnitude of the average velocity equal to the average speed?", "a": "Cisim düz çizgide yön değiştirmeden giderse (yol = |yer değiştirme|).", "star": false, "tr": "Ortalama hızın büyüklüğü ne zaman ortalama sürate eşit olur?"}, {"id": "BQ2.7", "ref": "Q2.7", "ch": 2, "q": "Two cars swap positions in the same time interval (each ends where the other started). How do their average velocities compare?", "a": "Eşit büyüklükte, zıt yönde: yer değiştirmeleri zıt.", "star": false, "tr": "İki araba aynı zaman aralığında yer değiştiriyor (her biri diğerinin başladığı yerde duruyor). Ortalama hızları nasıl karşılaştırılır?"}, {"id": "BQ2.9", "ref": "Q2.9", "ch": 2, "q": "Can an object have zero displacement but nonzero average velocity? Zero displacement but nonzero velocity at some instant?", "a": "Ortalama hız Δx/Δt = 0 olmak zorunda. Anlık hız sıfırdan farklı olabilir (gidip dönen cisim).", "star": false, "tr": "Bir cismin yer değiştirmesi sıfır ama ortalama hızı sıfırdan farklı olabilir mi? Yer değiştirmesi sıfır ama bir anda hızı sıfırdan farklı olabilir mi?"}, {"id": "BQ2.10", "ref": "Q2.10", "ch": 2, "q": "Can an object have zero acceleration and nonzero velocity? Sketch v–t.", "a": "Evet: sabit hız; v–t grafiği yatay çizgi.", "star": false, "tr": "Bir cismin ivmesi sıfır, hızı sıfırdan farklı olabilir mi? v–t grafiğini çizin."}, {"id": "BQ2.11", "ref": "Q2.11", "ch": 2, "q": "Can an object have zero velocity but nonzero acceleration? Give an example.", "a": "Evet: yukarı atılan top tepede v = 0, a = g.", "star": false, "tr": "Bir cismin hızı sıfır ama ivmesi sıfırdan farklı olabilir mi? Bir örnek verin."}, {"id": "BQ2.12", "ref": "Q2.12", "ch": 2, "q": "A car moves west. Can its acceleration point east? When?", "a": "Evet: batıya giderken yavaşlıyorsa.", "star": false, "tr": "Bir araba batıya gidiyor. İvmesi doğuyu gösterebilir mi? Ne zaman?"}, {"id": "BQ2.14", "ref": "Q2.14", "ch": 2, "q": "Is \"average velocity = (v₀ + v)/2\" still true if the acceleration is not constant?", "a": "Hayır, sadece sabit ivmede doğru.", "star": false, "tr": "İvme sabit değilse “ortalama hız = (v₀ + v)/2” hâlâ doğru mudur?"}, {"id": "BQ2.15", "ref": "Q2.15", "ch": 2, "q": "You throw a ball high in the air. Is its acceleration larger while you are throwing it or after it leaves your hand?", "a": "Atılırken: kısa sürede büyük hıza çıkıyor, a ≫ g. Elden çıkınca a = g.", "star": false, "tr": "Bir topu havaya, yükseğe atıyorsunuz. İvmesi siz onu atarken mi yoksa elinizden çıktıktan sonra mı daha büyüktür?"}, {"id": "BQ2.16", "ref": "Q2.16", "ch": 2, "q": "Show that (a) a ball thrown straight up returns to the release point with its launch speed and (b) its flight time is twice its rise time.", "a": "v² = v₀² − 2g(y − y₀): aynı yükseklikte sürat v₀. Çıkış v₀/g, iniş v₀/g → toplam 2v₀/g.", "star": false, "tr": "Gösterin: (a) dümdüz yukarı atılan bir top, bırakıldığı noktaya atış süratiyle geri döner ve (b) uçuş süresi, çıkış süresinin iki katıdır."}, {"id": "BQ2.17", "ref": "Q2.17", "ch": 2, "q": "A faucet releases a drop every 1.0 s. As the drops fall, does the distance between neighbouring drops grow, shrink or stay the same?", "a": "Artar: önceki damla hep 1 s daha uzun düşüyor, hızı g·(1 s) daha fazla.", "star": false, "tr": "Bir musluktan her 1.0 s'de bir damla düşüyor. Damlalar düşerken, art arda gelen iki damla arasındaki uzaklık artar mı, azalır mı, yoksa aynı mı kalır?"}, {"id": "BQ2.19", "ref": "Q2.19", "ch": 2, "q": "From a tall building one ball is thrown up at v₀ and another down at v₀. Compare (a) impact speeds, (b) which lands first, (c) displacements, (d) distances travelled.", "a": "(a) Eşit sürat (b) Aşağı atılan önce (c) Yer değiştirme eşit (d) Yukarı atılan daha uzun yol alır.", "star": false, "tr": "Yüksek bir binadan bir top v₀ ile yukarı, diğeri v₀ ile aşağı atılıyor. Karşılaştırın: (a) yere çarpma süratleri, (b) hangisinin önce yere düştüğü, (c) yer değiştirmeleri, (d) aldıkları yollar."}, {"id": "BQ2.20", "ref": "Q2.20", "ch": 2, "q": "You run 120 m east at 3.00 m/s, then 120 m east at 5.00 m/s. Is your average velocity 4.00 m/s, more, or less?", "a": "4 m/s'den az: yavaş kısımda daha uzun kalırsın. 240/(40 + 24) = 3.75 m/s.", "star": false, "tr": "120 m doğuya 3.00 m/s ile, sonra yine 120 m doğuya 5.00 m/s ile koşuyorsunuz. Ortalama hızınız 4.00 m/s mi, daha fazla mı, yoksa daha az mı?"}, {"id": "BQ2.21", "ref": "Q2.21", "ch": 2, "q": "A ball thrown up stops for an instant at the top. How can it have an acceleration there?", "a": "İvme hızın değişimidir. Anlık v = 0 ama hız değişmeye devam ediyor.", "star": false, "tr": "Yukarı atılan bir top tepede bir an için duruyor. Orada nasıl ivmesi olabilir?"}, {"id": "BQ2.22", "ref": "Q2.22", "ch": 2, "q": "An object dropped from height h takes time T. How long does it take from height 3h?", "a": "h = ½gt² → t ∝ √h: √3 T.", "star": false, "tr": "h yüksekliğinden bırakılan bir cisim T sürede yere düşüyor. 3h yüksekliğinden ne kadar sürede düşer?"}, {"id": "BQ3.1", "ref": "Q3.1", "ch": 3, "q": "A pendulum swings in an arc. What is the direction of the bob's acceleration at the ends of the swing? At the midpoint?", "a": "Uçlarda v = 0 → merkezcil 0; ivme yola teğet, alt noktaya doğru. Ortada teğetsel 0; ivme yukarı, merkeze doğru.", "star": false, "tr": "Bir sarkaç bir yay boyunca salınıyor. Salınımın uç noktalarında sarkaç topunun ivmesi hangi yöndedir? Orta noktada?"}, {"id": "BQ3.2", "ref": "Q3.2", "ch": 3, "q": "If a particle's acceleration is antiparallel to its velocity, does it move in a straight line? What happens to its speed?", "a": "Düz çizgide gider ve yavaşlar.", "star": false, "tr": "Bir parçacığın ivmesi hızına tam zıt yöndeyse (antiparalel), düz bir çizgide mi hareket eder? Süratine ne olur?"}, {"id": "BQ3.3", "ref": "Q3.3", "ch": 3, "q": "For a projectile without air resistance, is there a point where a⃗ is parallel to v⃗? Perpendicular?", "a": "Paralel olduğu nokta yok (dik atış hariç). Dik olduğu tek yer tepe noktası.", "star": false, "tr": "Hava direnci olmayan bir eğik atışta a⃗'nın v⃗'ye paralel olduğu bir nokta var mı? Dik olduğu bir nokta?"}, {"id": "BQ3.4", "ref": "Q3.4", "ch": 3, "q": "A book leaves a table edge at v₀ and lands after time t. If the speed is 2v₀, what happens to (a) the time, (b) the horizontal distance, (c) the impact speed?", "a": "(a) Süre aynı (b) Yatay mesafe 2 kat (c) Çarpma hızı artar: vₓ 2 kat, v_y aynı.", "star": false, "tr": "Bir kitap masanın kenarından v₀ ile çıkıyor ve t süre sonra yere düşüyor. Sürat 2v₀ olursa (a) düşme süresine, (b) yatay uzaklığa, (c) çarpma süratine ne olur?"}, {"id": "BQ3.5", "ref": "Q3.5", "ch": 3, "q": "A bullet is fired horizontally while another is dropped from the same height at the same moment. Which hits level ground first?", "a": "Aynı anda: düşey hareketleri aynı.", "star": false, "tr": "Bir mermi yatay olarak ateşlenirken aynı anda aynı yükseklikten başka bir mermi serbest bırakılıyor. Düz zemine hangisi önce çarpar?"}, {"id": "BQ3.6", "ref": "Q3.6", "ch": 3, "q": "A package falls from a plane flying straight and level at constant speed. Ignoring air resistance, what path does the pilot see? A person on the ground?", "a": "Pilot: paket hep uçağın altında, düşey doğru. Yerden: parabol. Paket uçakla aynı yatay hıza sahip.", "star": true, "tr": "Düz ve yatay olarak sabit süratle uçan bir uçaktan bir paket düşüyor. Hava direncini ihmal ederseniz pilot paketin nasıl bir yol izlediğini görür? Yerdeki bir kişi?"}, {"id": "BQ3.7", "ref": "Q3.7", "ch": 3, "q": "Sketch x, y, vₓ, v_y, aₓ, a_y versus t for a projectile launched from the origin at 0 < α < 90°.", "a": "x–t doğru, y–t aşağı açılan parabol, vₓ–t yatay, v_y–t eğimi −g olan doğru, aₓ = 0, a_y = −g sabit.", "star": false, "tr": "Orijinden 0 < α < 90° açıyla fırlatılan bir cisim (eğik atış) için x, y, vₓ, v_y, aₓ, a_y'nin t'ye göre grafiklerini çizin."}, {"id": "BQ3.8", "ref": "Q3.8", "ch": 3, "q": "A frog has the same launch speed in any direction. How is its maximum straight-up height related to its maximum range R_max = v₀²/g?", "a": "h_max = v₀²/2g = R_max/2.", "star": false, "tr": "Bir kurbağanın zıplama sürati her yönde aynı. Dümdüz yukarı çıkabildiği en büyük yükseklik, en büyük menziliyle R_max = v₀²/g nasıl ilişkilidir?"}, {"id": "BQ3.9", "ref": "Q3.9", "ch": 3, "q": "A projectile is launched at θ with speed v₀. At the top, what are its velocity, speed and acceleration?", "a": "v⃗ = v₀cos θ î (yatay), sürat v₀cos θ, a⃗ = −g ĵ.", "star": false, "tr": "Bir cisim θ açısıyla v₀ süratle fırlatılıyor (eğik atış). Tepede hızı, sürati ve ivmesi nedir?"}, {"id": "BQ3.10", "ref": "Q3.10", "ch": 3, "q": "In uniform circular motion, what are the average velocity and average acceleration over one full revolution?", "a": "İkisi de sıfır: yer değiştirme 0, v⃗ başa döner.", "star": false, "tr": "Düzgün dairesel harekette, bir tam tur boyunca ortalama hız ve ortalama ivme nedir?"}, {"id": "BQ3.11", "ref": "Q3.11", "ch": 3, "q": "In uniform circular motion, how does the acceleration change if the speed triples? If the radius is halved?", "a": "a = v²/R: v ×3 → 9 kat; R ÷2 → 2 kat.", "star": false, "tr": "Düzgün dairesel harekette sürat üç katına çıkarsa ivme nasıl değişir? Yarıçap yarıya inerse?"}, {"id": "BQ3.12", "ref": "Q3.12", "ch": 3, "q": "Is the acceleration perpendicular to the velocity in circular motion when the speed is changing?", "a": "Hayır: teğetsel bileşen var, ivme hıza dik olmaz.", "star": false, "tr": "Dairesel harekette sürat değişirken ivme hıza dik midir?"}, {"id": "BQ3.13", "ref": "Q3.13", "ch": 3, "q": "Why does rain leave diagonal streaks on a moving car's side windows even without wind?", "a": "Damlanın arabaya göre hızı = v_damla − v_araba: düşey + geriye → çapraz.", "star": false, "tr": "Rüzgâr olmasa bile yağmur, hareket eden bir arabanın yan camlarında neden çapraz izler bırakır?"}, {"id": "BQ3.14", "ref": "Q3.14", "ch": 3, "q": "In wind-driven rain, how should you tilt your umbrella?", "a": "Yağmurun sana göre hızına (v_yağmur − v_sen) karşı tut.", "star": false, "tr": "Rüzgârın savurduğu yağmurda şemsiyenizi nasıl eğmelisiniz?"}, {"id": "BQ3.15", "ref": "Q3.15", "ch": 3, "q": "A 60 m wide river flows north at 1.2 m/s; you swim at 1.5 m/s relative to the water. What path relative to the earth crosses in the shortest time?", "a": "Suya göre dosdoğru karşıya yüz: t = 60/1.5 = 40 s; akıntı seni 48 m kuzeye taşır, yere göre yol çapraz.", "star": false, "tr": "60 m genişliğindeki bir nehir 1.2 m/s ile kuzeye akıyor; siz suya göre 1.5 m/s ile yüzüyorsunuz. Yere göre hangi yol sizi karşıya en kısa sürede geçirir?"}, {"id": "BQ3.16", "ref": "Q3.16", "ch": 3, "q": "A stone is thrown at an angle with no air resistance. Sketch its speed versus time.", "a": "Önce azalır, tepede en küçük (v₀cos α, sıfır değil), sonra artar.", "star": false, "tr": "Bir taş hava direnci olmadan açılı olarak atılıyor. Süratinin zamana göre grafiğini çizin."}, {"id": "BQ4.1", "ref": "Q4.1", "ch": 4, "q": "Can an object be in equilibrium with only one force acting on it?", "a": "Hayır: tek kuvvet varsa net kuvvet sıfır olamaz.", "star": false, "tr": "Bir cisme yalnızca tek bir kuvvet etki ederken cisim dengede olabilir mi?"}, {"id": "BQ4.2", "ref": "Q4.2", "ch": 4, "q": "A ball thrown up has zero velocity at the top. Is it in equilibrium there?", "a": "Hayır: net kuvvet mg, ivme g. Denge a = 0 demek.", "star": false, "tr": "Yukarı atılan bir topun tepede hızı sıfırdır. Orada dengede midir?"}, {"id": "BQ4.3", "ref": "Q4.3", "ch": 4, "q": "A helium balloon hovers. Is it in equilibrium? Which forces act?", "a": "Evet: ağırlık ile havanın kaldırma kuvveti eşit.", "star": false, "tr": "Helyumlu bir balon havada asılı duruyor. Dengede mi? Hangi kuvvetler etki ediyor?"}, {"id": "BQ4.4", "ref": "Q4.4", "ch": 4, "q": "Why can't you feel an airliner's 800 km/h speed in smooth air?", "a": "Sabit hız eylemsiz çerçeve; ivme yokken fark edilmez.", "star": false, "tr": "Sakin havada bir yolcu uçağının 800 km/h'lik süratini neden hissedemezsiniz?"}, {"id": "BQ4.5", "ref": "Q4.5", "ch": 4, "q": "A rope in equilibrium is pulled at both ends with equal and opposite forces. Why isn't the tension zero?", "a": "Net kuvvet sıfır ama her noktada ipin iki parçası birbirini F ile çeker: gerilme F.", "star": false, "tr": "Dengedeki bir ip iki ucundan eşit ve zıt kuvvetlerle çekiliyor. İpteki gerilme neden sıfır değildir?"}, {"id": "BQ4.6", "ref": "Q4.6", "ch": 4, "q": "You whirl a brick on a rope in a horizontal circle and let go. What path does it take?", "a": "Teğet yönünde düz gider (ve düşer). Dışa doğru değil.", "star": false, "tr": "Bir tuğlayı bir ipin ucunda yatay bir çemberde döndürüp bırakıyorsunuz. Tuğla nasıl bir yol izler?"}, {"id": "BQ4.7", "ref": "Q4.7", "ch": 4, "q": "Why do passengers lurch forward when a car brakes, and slide sideways in a sharp turn?", "a": "Eylemsizlik: yolcu eski hızıyla devam etmek ister, araba yavaşlar ya da döner.", "star": false, "tr": "Araba fren yaptığında yolcular neden öne doğru savrulur, keskin bir virajda neden yana kayar?"}, {"id": "BQ4.8", "ref": "Q4.8", "ch": 4, "q": "What is wrong with saying a \"force of inertia\" throws passengers forward in braking?", "a": "Öyle bir kuvvet yok; yolcuya net kuvvet etki etmediği için sabit hızla devam eder.", "star": false, "tr": "Frende yolcuları öne fırlatanın bir “eylemsizlik kuvveti” olduğunu söylemenin nesi yanlıştır?"}, {"id": "BQ4.13", "ref": "Q4.13", "ch": 4, "q": "Is \"ma\" a force (\"the force of acceleration\")? If not, what is it?", "a": "Hayır, net kuvvetin sonucudur. FBD'ye çizilmez.", "star": false, "tr": "“ma” bir kuvvet midir (“ivme kuvveti”)? Değilse nedir?"}, {"id": "BQ4.14", "ref": "Q4.14", "ch": 4, "q": "What acceleration do you measure for a falling object inside an elevator rising at constant 9.8 m/s?", "a": "g = 9.8 m/s²: sabit hızlı asansör eylemsiz çerçeve.", "star": false, "tr": "Sabit 9.8 m/s ile yükselen bir asansörün içinde düşen bir cisim için ne kadar ivme ölçersiniz?"}, {"id": "BQ4.16", "ref": "Q4.16", "ch": 4, "q": "What is wrong with saying \"the force of gravity on an object is 9.8 m/s²\"?", "a": "9.8 m/s² ivmedir. Kuvvet mg, birimi N.", "star": false, "tr": "“Bir cisme etki eden yer çekimi kuvveti 9.8 m/s²'dir” demenin nesi yanlıştır?"}, {"id": "BQ4.18", "ref": "Q4.18", "ch": 4, "q": "Explain \"it's not the fall that hurts, it's the sudden stop\" with Newton's laws.", "a": "Kısa sürede hız sıfırlanınca ivme ve kuvvet çok büyük olur.", "star": false, "tr": "“Acıtan düşmek değil, aniden durmaktır” sözünü Newton yasalarıyla açıklayın."}, {"id": "BQ4.21", "ref": "Q4.21", "ch": 4, "q": "A string can lift a heavy weight with a steady pull but breaks when jerked. Why?", "a": "Ani çekiş büyük ivme → T = m(g + a) büyür.", "star": false, "tr": "Bir ip, yavaş ve sabit çekilince ağır bir yükü kaldırabiliyor ama birden sertçe çekilince kopuyor. Neden?"}, {"id": "BQ4.22", "ref": "Q4.22", "ch": 4, "q": "A crate hangs on a rope. Is the tension larger at rest or moving up at constant speed? Moving up: larger when speeding up or slowing down?", "a": "Durgun ve sabit hızda eşit (T = mg). Yukarı hızlanırken T > mg, yavaşlarken T < mg.", "star": false, "tr": "Bir sandık bir ipe asılı. Gerilme sandık dururken mi yoksa sabit süratle yukarı çıkarken mi daha büyüktür? Yukarı çıkarken: hızlanırken mi yoksa yavaşlarken mi daha büyüktür?"}, {"id": "BQ4.23", "ref": "Q4.23", "ch": 4, "q": "Which feels a larger gravitational pull, a 10 kg or a 20 kg stone? Why doesn't the 20 kg stone fall with twice the acceleration?", "a": "20 kg iki kat çekilir ama kütlesi de iki kat: a = g aynı.", "star": false, "tr": "10 kg'lık bir taş mı yoksa 20 kg'lık bir taş mı daha büyük bir yer çekimi kuvveti hisseder? 20 kg'lık taş neden iki kat ivmeyle düşmez?"}, {"id": "BQ4.24", "ref": "Q4.24", "ch": 4, "q": "The wagon pulls back on the horse as hard as the horse pulls the wagon. Why can the wagon still accelerate?", "a": "Etki–tepki farklı cisimlere etki eder. Arabanın ivmesi ona etki eden net kuvvete bağlı.", "star": false, "tr": "At arabası atı, atın arabayı çektiği kadar güçlü geri çeker. Araba yine de nasıl ivmelenebilir?"}, {"id": "BQ4.25", "ref": "Q4.25", "ch": 4, "q": "True or false: you push an object with P and it pushes back with F; F = P at constant velocity, but P > F if it accelerates.", "a": "Yanlış: üçüncü yasa, her durumda F = P.", "star": false, "tr": "Doğru mu yanlış mı: bir cismi P kuvvetiyle itiyorsunuz, o da sizi F ile geri itiyor; sabit hızda F = P, ama cisim ivmelenirse P > F olur."}, {"id": "BQ4.26", "ref": "Q4.26", "ch": 4, "q": "A truck and a small car collide head-on. Which exerts the larger force? Which has the larger acceleration?", "a": "Kuvvetler eşit; küçük araba daha büyük ivme alır.", "star": false, "tr": "Bir kamyon ile küçük bir araba kafa kafaya çarpışıyor. Hangisi daha büyük kuvvet uygular? Hangisinin ivmesi daha büyüktür?"}, {"id": "BQ4.27", "ref": "Q4.27", "ch": 4, "q": "What force slows a car stopping on a level road? What force speeds it up?", "a": "Yolun lastiklere uyguladığı sürtünme: durmada geriye, hızlanmada ileri.", "star": false, "tr": "Düz bir yolda duran (fren yapan) bir arabayı hangi kuvvet yavaşlatır? Onu hangi kuvvet hızlandırır?"}, {"id": "BQ4.28", "ref": "Q4.28", "ch": 4, "q": "A small car pushes a large van; they speed up together. Compare the forces they exert on each other and their net forces.", "a": "Birbirlerine kuvvetleri eşit. Aynı ivme: ağır vanın net kuvveti büyük.", "star": false, "tr": "Küçük bir araba büyük bir minibüsü itiyor; birlikte hızlanıyorlar. Birbirlerine uyguladıkları kuvvetleri ve her birine etki eden net kuvvetleri karşılaştırın."}, {"id": "BQ4.29", "ref": "Q4.29", "ch": 4, "q": "In a tug-of-war each person pulls the other equally hard. What decides who wins?", "a": "Yerin ayaklarına uyguladığı sürtünme kuvveti.", "star": false, "tr": "Halat çekmede her kişi diğerini eşit kuvvetle çeker. Kimin kazanacağını ne belirler?"}, {"id": "BQ4.30", "ref": "Q4.30", "ch": 4, "q": "You push box A (150 N) with 100 N; it pushes box B (50 N) on a frictionless floor. Is A's force on B equal to, greater or less than 100 N?", "a": "Az: a = 100/(200/g); F_AB = m_B a = 25 N.", "star": false, "tr": "Sürtünmesiz bir zeminde A kutusunu (150 N) 100 N ile itiyorsunuz; A da B kutusunu (50 N) itiyor. A'nın B'ye uyguladığı kuvvet 100 N'a eşit mi, ondan büyük mü, küçük mü?"}, {"id": "BQ4.31", "ref": "Q4.31", "ch": 4, "q": "A manual says lift exceeds weight while a plane climbs steadily and is less while it descends steadily. Correct?", "a": "Yanlış: sabit hızla tırmanma ya da alçalmada ivme 0, kaldırma = ağırlık.", "star": false, "tr": "Bir kılavuz kitap, uçak sabit hızla yükselirken kaldırma kuvvetinin ağırlıktan büyük, sabit hızla alçalırken ağırlıktan küçük olduğunu söylüyor. Doğru mu?"}, {"id": "BQ4.36", "ref": "Q4.36", "ch": 4, "q": "A 1000 kg car hits a 2500 kg car head-on. Which feels the larger force? The larger acceleration? Why are small-car passengers more at risk?", "a": "Kuvvetler eşit; küçük araba 2.5 kat ivme alır, yolcuları daha çok zarar görür.", "star": false, "tr": "1000 kg'lık bir araba 2500 kg'lık bir arabaya kafa kafaya çarpıyor. Hangisi daha büyük kuvvet hisseder? Hangisinin ivmesi daha büyüktür? Küçük arabadaki yolcular neden daha fazla risk altındadır?"}, {"id": "BQ4.37", "ref": "Q4.37", "ch": 4, "q": "In a windowless rocket in deep space, how can you tell whether you are accelerating?", "a": "Bir cisim bırak: havada kalırsa ivme yok, bir duvara giderse roket ivmeli.", "star": false, "tr": "Derin uzayda penceresiz bir roketteyseniz ivmelenip ivmelenmediğinizi nasıl anlarsınız?"}, {"id": "BQ5.1", "ref": "Q5.1", "ch": 5, "q": "A man sits in a seat hung from a rope over a ceiling pulley and holds the other end. What is the tension, and what force does the seat exert on him?", "a": "Adam + koltuk dengede: 2T = (m_adam + m_koltuk)g. Koltuğun adama kuvveti n = m_adam g − T.", "star": false, "tr": "Bir adam, tavandaki bir makaradan geçen ipe asılı bir koltukta oturuyor ve ipin diğer ucunu tutuyor. İpteki gerilme nedir ve koltuk adama ne kadar kuvvet uygular?"}, {"id": "BQ5.2", "ref": "Q5.2", "ch": 5, "q": "Give one case where the normal force equals the weight and two where it does not.", "a": "Eşit: yatay zemin, başka dikey kuvvet yok. Değil: eğik düzlem (mg cos θ), ivmeli asansör, açılı itme.", "star": false, "tr": "Normal kuvvetin ağırlığa eşit olduğu bir durum ve eşit olmadığı iki durum örneği verin."}, {"id": "BQ5.3", "ref": "Q5.3", "ch": 5, "q": "Why does a clothesline always sag a little, however tight it is?", "a": "Gerilmenin düşey bileşeni ipin ağırlığını taşımalı; tam yatay ipte düşey bileşen olmazdı.", "star": false, "tr": "Bir çamaşır ipi ne kadar gergin olursa olsun neden hep biraz sarkar?"}, {"id": "BQ5.4", "ref": "Q5.4", "ch": 5, "q": "A car climbs a steep hill at constant speed. List the forces. What pushes it up the hill?", "a": "Ağırlık, normal, hava direnci, yolun lastiklere yokuş yukarı statik sürtünmesi (iten bu). Net 0.", "star": false, "tr": "Bir araba dik bir yokuşu sabit süratle çıkıyor. Etki eden kuvvetleri sıralayın. Arabayı yokuş yukarı ne iter?"}, {"id": "BQ5.5", "ref": "Q5.5", "ch": 5, "q": "How could astronauts measure their mass in apparent weightlessness?", "a": "Bilinen kuvvet uygula, ivmeyi ölç: m = F/a (ya da yay salınım periyodu).", "star": false, "tr": "Astronotlar görünür ağırlıksızlık ortamında kütlelerini nasıl ölçebilir?"}, {"id": "BQ5.6", "ref": "Q5.6", "ch": 5, "q": "Is it easier to push a box up a ramp horizontally or parallel to the ramp? Why?", "a": "Paralel: yatay itmenin bir bileşeni yüzeye bastırır, sürtünmeyi artırır.", "star": false, "tr": "Bir kutuyu rampada yukarı doğru, yatay iterek mi yoksa rampaya paralel iterek mi taşımak daha kolaydır? Neden?"}, {"id": "BQ5.7", "ref": "Q5.7", "ch": 5, "q": "A woman in an elevator lets go of her briefcase and it doesn't fall to the floor. How is the elevator moving?", "a": "Serbest düşüşte (a = g aşağı).", "star": false, "tr": "Asansördeki bir kadın çantasını bırakıyor ve çanta yere düşmüyor. Asansör nasıl hareket ediyor?"}, {"id": "BQ5.8", "ref": "Q5.8", "ch": 5, "q": "A block rests on a ramp held by friction. Is it easier to start it moving up or down the ramp?", "a": "Aşağı: ağırlığın eğim bileşeni yardım eder.", "star": false, "tr": "Bir blok, sürtünme sayesinde bir rampada duruyor. Onu rampadan yukarı mı yoksa aşağı mı harekete geçirmek daha kolaydır?"}, {"id": "BQ5.9", "ref": "Q5.9", "ch": 5, "q": "A crate slides up a ramp with kinetic friction, stops, and slides down. Which acceleration is larger, going up or going down?", "a": "Çıkarken: g(sin θ + μ_k cos θ) > g(sin θ − μ_k cos θ).", "star": false, "tr": "Bir sandık kinetik sürtünmeli bir rampada yukarı kayıyor, duruyor ve geri aşağı kayıyor. Hangi ivme daha büyüktür, çıkarken mi inerken mi?"}, {"id": "BQ5.10", "ref": "Q5.10", "ch": 5, "q": "Why is less force needed to pull a crate at θ above horizontal than to push it at θ below?", "a": "Yukarı çekişte F sin θ n'yi azaltır, sürtünme küçülür; aşağı itişte n büyür.", "star": false, "tr": "Bir sandığı yatayın θ kadar üstünden çekmek için, θ kadar altından itmekten neden daha az kuvvet gerekir?"}, {"id": "BQ5.11", "ref": "Q5.11", "ch": 5, "q": "Without friction, could you (a) round a flat curve, (b) jump up, (c) start walking, (d) climb a vertical ladder, (e) change lanes?", "a": "(a) Hayır (b) Evet (normal kuvvet) (c) Hayır (d) Evet, basamaklara basarak (e) Hayır.", "star": false, "tr": "Sürtünme olmasaydı (a) düz bir virajı dönebilir miydiniz, (b) yukarı zıplayabilir miydiniz, (c) yürümeye başlayabilir miydiniz, (d) düşey bir merdivene tırmanabilir miydiniz, (e) şerit değiştirebilir miydiniz?"}, {"id": "BQ5.12", "ref": "Q5.12", "ch": 5, "q": "Why does a wet bathtub feel secure but allow catastrophic slips? Use the two friction coefficients.", "a": "μ_s > μ_k: kayma başlamadan tutuş iyi, başlayınca μ_k küçük olduğu için durmak zor.", "star": false, "tr": "Islak bir küvet neden güvenli hissettirir ama yine de çok tehlikeli kaymalara yol açabilir? İki sürtünme katsayısını kullanarak açıklayın."}, {"id": "BQ5.13", "ref": "Q5.13", "ch": 5, "q": "You push a crate across an elevator floor. When is the needed force least, greatest: accelerating up, down, or constant speed?", "a": "n = m(g ± a): yukarı hızlanırken en büyük, aşağı hızlanırken en küçük.", "star": false, "tr": "Bir asansörün zemininde bir sandığı itiyorsunuz. Gereken kuvvet ne zaman en az, ne zaman en fazladır: asansör yukarı ivmelenirken mi, aşağı ivmelenirken mi, yoksa sabit süratle giderken mi?"}, {"id": "BQ5.14", "ref": "Q5.14", "ch": 5, "q": "\"Friction always opposes motion.\" Give an example where (a) static and (b) kinetic friction causes motion.", "a": "(a) Yürümek, hızlanan araba, kamyon kasasındaki kutu (b) Hareketli banda bırakılan kutu kayarken hızlanır.", "star": false, "tr": "“Sürtünme her zaman harekete karşı koyar.” (a) Statik ve (b) kinetik sürtünmenin hareketi sağladığı birer örnek verin."}, {"id": "BQ5.15", "ref": "Q5.15", "ch": 5, "q": "In uniform circular motion there is a net force. Why doesn't the speed change?", "a": "Net kuvvet hıza dik; sadece yönü değiştirir.", "star": false, "tr": "Düzgün dairesel harekette net bir kuvvet vardır. Sürat neden değişmez?"}, {"id": "BQ5.16", "ref": "Q5.16", "ch": 5, "q": "An icy curve is banked for 80 km/h. You drive more slowly to be careful. What may happen?", "a": "Sürtünme yok: yavaş gidersen araba eğimden içe doğru kayar.", "star": false, "tr": "Buzlu bir viraja 80 km/h için eğim verilmiş. Dikkatli olmak için daha yavaş gidiyorsunuz. Ne olabilir?"}, {"id": "BQ5.17", "ref": "Q5.17", "ch": 5, "q": "Can a string whirling a ball in a horizontal circle ever be exactly horizontal?", "a": "Hayır: düşey bileşen ağırlığı dengelemeli; ip yatayın altına eğik.", "star": false, "tr": "Bir topu yatay bir çemberde döndüren ip hiç tam yatay olabilir mi?"}, {"id": "BQ5.18", "ref": "Q5.18", "ch": 5, "q": "Why is \"centrifugal force\" not drawn in free-body diagrams?", "a": "Eylemsiz çerçevede böyle bir kuvvet yok; merkezcil ivmeyi gerçek kuvvetler sağlar.", "star": false, "tr": "“Merkezkaç kuvveti” serbest cisim diyagramlarına neden çizilmez?"}, {"id": "BQ5.19", "ref": "Q5.19", "ch": 5, "q": "A stopper whirled on a string is released when directly in front of a student. Should she worry?", "a": "Hayır: tıpa bırakıldığı andaki teğet boyunca gider, ona doğru değil.", "star": false, "tr": "Bir ipin ucunda döndürülen bir tıpa, tam bir öğrencinin önündeyken serbest bırakılıyor. Öğrenci endişelenmeli mi?"}, {"id": "BQ5.20", "ref": "Q5.20", "ch": 5, "q": "Why are loop-the-loop tracks given a larger radius at the bottom than at the top?", "a": "n = m(g + v²/R): altta hız büyük, R büyük tutulursa kuvvet sınırda kalır.", "star": false, "tr": "Çember (loop) yapan hız trenlerinde rayın yarıçapı neden altta üsttekinden daha büyük yapılır?"}, {"id": "BQ5.21", "ref": "Q5.21", "ch": 5, "q": "A ball is dropped in a tube with and without air. How can multiflash photos tell which is which?", "a": "Hava dirençli olanda aralıklar daha az büyür (terminal hıza yaklaşır).", "star": false, "tr": "Bir top, içinde hava olan ve havası boşaltılmış bir tüpte düşürülüyor. Çok flaşlı (art arda çekilmiş) fotoğraflar hangisinin hangisi olduğunu nasıl gösterir?"}, {"id": "BQ5.22", "ref": "Q5.22", "ch": 5, "q": "A ball thrown up at v₀ returns to your hand. Compare its speed to v₀ (a) without and (b) with air resistance.", "a": "(a) v₀ (b) Daha küçük: sürükleme enerji alır.", "star": false, "tr": "v₀ ile yukarı atılan bir top elinize geri dönüyor. Dönüşteki süratini v₀ ile karşılaştırın: (a) hava direnci yokken ve (b) varken."}, {"id": "BQ5.23", "ref": "Q5.23", "ch": 5, "q": "With air resistance, is the rise time or the fall time longer?", "a": "İniş uzun: yukarıda ivme g + D/m, aşağıda g − D/m.", "star": false, "tr": "Hava direnci varken çıkış süresi mi yoksa iniş süresi mi daha uzundur?"}, {"id": "BQ5.24", "ref": "Q5.24", "ch": 5, "q": "Two identical tennis balls, one water-filled, are dropped together. Which lands first without air resistance? With it?", "a": "Hava yok: aynı anda. Hava var: su dolu önce.", "star": false, "tr": "Biri suyla dolu iki özdeş tenis topu birlikte bırakılıyor. Hava direnci yokken hangisi önce yere düşer? Hava direnci varken?"}, {"id": "BQ5.25", "ref": "Q5.25", "ch": 5, "q": "A ball falls with air resistance. Sketch its acceleration versus time.", "a": "g'den başlayıp sıfıra azalır.", "star": false, "tr": "Bir top hava direnci altında düşüyor. İvmesinin zamana göre grafiğini çizin."}, {"id": "BQ5.26", "ref": "Q5.26", "ch": 5, "q": "Same ball, +y downward. Sketch v_y versus time.", "a": "Sıfırdan artıp terminal hıza yaklaşan eğri.", "star": false, "tr": "Aynı top, +y aşağı yönde. v_y'nin zamana göre grafiğini çizin."}, {"id": "BQ5.27", "ref": "Q5.27", "ch": 5, "q": "With air drag, does a batted ball cover more horizontal distance while rising or while falling?", "a": "Çıkarken: yatay hız sürekli azalır, tepe noktası menzilin ortasından ileride.", "star": false, "tr": "Hava direnci varken, sopayla vurulan bir top yükselirken mi yoksa düşerken mi daha fazla yatay yol alır?"}, {"id": "BQ5.28", "ref": "Q5.28", "ch": 5, "q": "Why does a ball thrown off a high cliff eventually move straight down when there is air resistance?", "a": "Sürükleme yatay hızı sıfıra götürür, düşey hız terminal hıza yaklaşır.", "star": false, "tr": "Hava direnci varken, yüksek bir uçurumdan atılan bir top neden sonunda dümdüz aşağı hareket eder?"}, {"id": "BQ6.1", "ref": "Q6.1", "ch": 6, "q": "Can a change of coordinates turn positive work into negative work?", "a": "Hayır: W = F⃗·s⃗, kuvvet ile yer değiştirme arasındaki açıya bağlı.", "star": false, "tr": "Koordinat sistemini değiştirmek pozitif bir işi negatif işe çevirebilir mi?"}, {"id": "BQ6.2", "ref": "Q6.2", "ch": 6, "q": "An elevator is lifted at constant speed. Is the total work on it positive, negative or zero?", "a": "Sıfır: ΔK = 0.", "star": false, "tr": "Bir asansör sabit süratle yukarı kaldırılıyor. Ona yapılan toplam iş pozitif mi, negatif mi, yoksa sıfır mı?"}, {"id": "BQ6.3", "ref": "Q6.3", "ch": 6, "q": "A rope accelerates an object, and the object pulls back equally on the rope. Is the total work then zero?", "a": "Hayır: tepki ipe etki eder. Cisim üzerindeki toplam iş = ipin işi ≠ 0.", "star": false, "tr": "Bir ip bir cismi ivmelendiriyor, cisim de ipi eşit kuvvetle geri çekiyor. O zaman toplam iş sıfır mıdır?"}, {"id": "BQ6.4", "ref": "Q6.4", "ch": 6, "q": "Work W brings an object from rest to speed v and kinetic energy K. With twice the work (from rest), what are the speed (in terms of v) and K (in terms of K)?", "a": "K₂ = 2K, v₂ = √2 v. İş-enerji teoremi W = ΔK.", "star": true, "tr": "W işi bir cismi durgun hâlden v süratine ve K kinetik enerjisine getiriyor. İki kat işle (yine durgun hâlden) sürat (v cinsinden) ve kinetik enerji (K cinsinden) ne olur?"}, {"id": "BQ6.5", "ref": "Q6.5", "ch": 6, "q": "Can the total work be zero when a nonzero net force acts on a moving object? Example?", "a": "Evet: düzgün dairesel hareket, kuvvet hıza dik.", "star": false, "tr": "Hareket eden bir cisme sıfırdan farklı bir net kuvvet etki ederken toplam iş sıfır olabilir mi? Örnek verin."}, {"id": "BQ6.7", "ref": "Q6.7", "ch": 6, "q": "In a conical pendulum, which forces do work on the bob?", "a": "Hiçbiri: gerilme ve ağırlık hıza dik.", "star": false, "tr": "Konik sarkaçta sarkaç topuna hangi kuvvetler iş yapar?"}, {"id": "BQ6.9", "ref": "Q6.9", "ch": 6, "q": "Sketch an F(x) that does zero total work from x₁ to x₂ although F is not zero everywhere.", "a": "F–x eğrisi eksenin üstünde ve altında eşit alan kaplasın.", "star": false, "tr": "F her yerde sıfır olmadığı hâlde x₁'den x₂'ye toplam sıfır iş yapan bir F(x) grafiği çizin."}, {"id": "BQ6.10", "ref": "Q6.10", "ch": 6, "q": "Does K change more from 10 to 15 m/s or from 15 to 20 m/s?", "a": "15→20: ΔK ∝ v₂² − v₁² = 175 > 125.", "star": false, "tr": "K, sürat 10'dan 15 m/s'ye çıkarken mi yoksa 15'ten 20 m/s'ye çıkarken mi daha çok değişir?"}, {"id": "BQ6.11", "ref": "Q6.11", "ch": 6, "q": "Three 1.5 kg objects move at 5.0 m/s in different directions (one with components 3 and 4 m/s). Same kinetic energy?", "a": "Evet: üçünün sürati 5.0 m/s, K = 18.8 J. K yöne bağlı değil.", "star": false, "tr": "1.5 kg'lık üç cisim farklı yönlerde 5.0 m/s ile hareket ediyor (birinin hız bileşenleri 3 ve 4 m/s). Kinetik enerjileri aynı mı?"}, {"id": "BQ6.12", "ref": "Q6.12", "ch": 6, "q": "Can the total work on an object be negative? Can its magnitude exceed the initial kinetic energy?", "a": "Negatif olabilir; büyüklüğü başlangıç K'sını aşamaz (K negatif olmaz).", "star": false, "tr": "Bir cisme yapılan toplam iş negatif olabilir mi? Büyüklüğü ilk kinetik enerjiyi aşabilir mi?"}, {"id": "BQ6.13", "ref": "Q6.13", "ch": 6, "q": "By what factor must the work increase to give three times the final speed (from rest)?", "a": "9 kat: K ∝ v².", "star": false, "tr": "Son süratin üç katına çıkması için (durgun hâlden başlayarak) işin hangi çarpanla artması gerekir?"}, {"id": "BQ6.14", "ref": "Q6.14", "ch": 6, "q": "Is the work needed to stop a speeding truck the same in the frame of a roadside officer and of the driver?", "a": "Hayır, çerçeveye bağlı: polise göre K büyük, şoföre göre zaten 0.", "star": false, "tr": "Hızla giden bir kamyonu durdurmak için gereken iş, yol kenarındaki bir polisin referans çerçevesinde ve sürücünün referans çerçevesinde aynı mıdır?"}, {"id": "BQ6.15", "ref": "Q6.15", "ch": 6, "q": "You hold a briefcase with your arm straight down. Does your hand do work while (a) walking level at constant speed, (b) riding an elevator up?", "a": "(a) Hayır (kuvvet ⊥ hareket) (b) Evet, pozitif.", "star": false, "tr": "Bir çantayı kolunuz dümdüz aşağı sarkacak şekilde tutuyorsunuz. Eliniz (a) düz zeminde sabit süratle yürürken, (b) asansörle yukarı çıkarken iş yapar mı?"}, {"id": "BQ6.16", "ref": "Q6.16", "ch": 6, "q": "Can friction ever do positive work?", "a": "Evet: hızlanan kamyondaki kutuya statik sürtünme ileri, kutu ileri gider.", "star": false, "tr": "Sürtünme hiç pozitif iş yapabilir mi?"}, {"id": "BQ6.18", "ref": "Q6.18", "ch": 6, "q": "What is wrong with calling a strong person \"powerful\", or saying a worker carrying a bag across level ground does a lot of work?", "a": "Güç = iş/zaman; güçlü kişi büyük kuvvet uygular. Yatay taşımada fiziksel iş 0.", "star": false, "tr": "Kuvvetli bir kişiye “güçlü” (powerful) demenin ya da düz zeminde çanta taşıyan bir işçinin çok iş yaptığını söylemenin nesi yanlıştır?"}, {"id": "BQ6.19", "ref": "Q6.19", "ch": 6, "q": "A 20 MW diesel engine drives a 30 MW generator. Possible?", "a": "İmkânsız: çıkış gücü girişten büyük olamaz.", "star": false, "tr": "20 MW'lık bir dizel motor 30 MW'lık bir jeneratörü çalıştırıyor. Bu mümkün mü?"}, {"id": "BQ6.20", "ref": "Q6.20", "ch": 6, "q": "A car speeds up with the engine at constant power. Is the acceleration larger at the start or the end?", "a": "Başta: P = Fv, v küçükken F büyük.", "star": false, "tr": "Bir araba, motoru sabit güçte çalışırken hızlanıyor. İvme başta mı yoksa sonda mı daha büyüktür?"}, {"id": "BQ6.21", "ref": "Q6.21", "ch": 6, "q": "What does the area under a P–t graph mean? How do you get the average power from it?", "a": "Alan = iş. Ortalama güç = alan/(t₂ − t₁).", "star": false, "tr": "Bir P–t grafiğinin altındaki alan ne anlama gelir? Ortalama gücü bu grafikten nasıl bulursunuz?"}, {"id": "BQ6.22", "ref": "Q6.22", "ch": 6, "q": "A nonzero net force acts. Can (a) speed, (b) velocity, (c) kinetic energy stay constant?", "a": "(a) Evet (b) Hayır (c) Evet (düzgün dairesel).", "star": false, "tr": "Sıfırdan farklı bir net kuvvet etki ediyor. (a) Sürat, (b) hız, (c) kinetik enerji sabit kalabilir mi?"}, {"id": "BQ6.23", "ref": "Q6.23", "ch": 6, "q": "A force stretches a spring x with work W. Twice the force: what stretch and what work?", "a": "2x ve ½k(2x)² = 4W.", "star": false, "tr": "Bir kuvvet bir yayı W işiyle x kadar geriyor. İki kat kuvvetle uzama ne olur ve ne kadar iş yapılır?"}, {"id": "BQ6.24", "ref": "Q6.24", "ch": 6, "q": "Work W stretches a spring x. How much work for an additional x?", "a": "½k(2x)² − ½kx² = 3W.", "star": false, "tr": "W işi bir yayı x kadar geriyor. Yayı ayrıca bir x daha germek için ne kadar iş gerekir?"}, {"id": "BQ7.1", "ref": "Q7.1", "ch": 7, "q": "Using energy, explain why a ball thrown up returns slower than v₀ when there is air resistance.", "a": "Sürükleme negatif iş yapar, mekanik enerji azalır: v < v₀.", "star": false, "tr": "Enerjiyi kullanarak, hava direnci varken yukarı atılan bir topun neden v₀'dan daha yavaş geri döndüğünü açıklayın."}, {"id": "BQ7.2", "ref": "Q7.2", "ch": 7, "q": "A projectile has the same initial K at any launch angle. Why doesn't it reach the same height?", "a": "Tepede yatay hız (K'nın bir kısmı) kalır; sadece düşey kısım U'ya döner.", "star": false, "tr": "Fırlatılan bir cismin ilk kinetik enerjisi K her atış açısında aynı. Cisim neden her seferinde aynı yüksekliğe çıkmaz?"}, {"id": "BQ7.3", "ref": "Q7.3", "ch": 7, "q": "Does the speed at the bottom of a frictionless ramp depend on its shape or only its height? With friction?", "a": "Sürtünmesiz: sadece yükseklik. Sürtünmeli: yol uzunluğu ve şekil de önemli.", "star": false, "tr": "Sürtünmesiz bir rampanın altındaki sürat, rampanın şekline mi yoksa yalnızca yüksekliğine mi bağlıdır? Sürtünme varken?"}, {"id": "BQ7.4", "ref": "Q7.4", "ch": 7, "q": "Two students use different origins (roof, ground) for a falling egg. Do they agree on initial U, final U, ΔU and final K?", "a": "U₁ ve U₂ farklı; ΔU ve son K aynı.", "star": false, "tr": "İki öğrenci, düşen bir yumurta için farklı başlangıç noktaları (orijin: çatı, yer) kullanıyor. İlk U, son U, ΔU ve son K konusunda aynı sonucu bulurlar mı?"}, {"id": "BQ7.5", "ref": "Q7.5", "ch": 7, "q": "A bowling ball pendulum released from the nose of a teacher returns to stop at his nose. What happens if a student gives it a push?", "a": "Enerji eklenir: top bırakıldığı yükseklikten daha yükseğe çıkar, öğretmene çarpar.", "star": false, "tr": "Bir öğretmenin burnunun ucundan bırakılan bowling topu sarkaç, geri gelip tam burnunun önünde duruyor. Bir öğrenci topu bırakırken ona itme verirse ne olur?"}, {"id": "BQ7.6", "ref": "Q7.6", "ch": 7, "q": "Can friction increase a system's mechanical energy? Example?", "a": "Evet: hızlanan kamyon kasasındaki kutu, statik sürtünme pozitif iş yapar.", "star": false, "tr": "Sürtünme bir sistemin mekanik enerjisini artırabilir mi? Örnek verin."}, {"id": "BQ7.9", "ref": "Q7.9", "ch": 7, "q": "A book is lifted. Does gravity do positive or negative work? Does U increase?", "a": "Yerçekiminin işi negatif, U artar.", "star": false, "tr": "Bir kitap yukarı kaldırılıyor. Yer çekimi pozitif mi negatif mi iş yapar? U artar mı?"}, {"id": "BQ7.11", "ref": "Q7.11", "ch": 7, "q": "A 1 kg and a 10 kg stone are dropped from the same height. Same initial U? Same acceleration? Same final speed? Same final K?", "a": "(a) Hayır (b) Evet, g (c) Evet, √(2gh) (d) Hayır, K = mgh.", "star": false, "tr": "1 kg'lık ve 10 kg'lık iki taş aynı yükseklikten bırakılıyor. İlk U'ları aynı mı? İvmeleri aynı mı? Son süratleri aynı mı? Son K'leri aynı mı?"}, {"id": "BQ7.12", "ref": "Q7.12", "ch": 7, "q": "Two different masses are launched up by identical, equally compressed springs. Same maximum height? Same U at the top?", "a": "(a) Hayır: hafif olan daha yükseğe (b) Evet: ikisinde de ½kx².", "star": false, "tr": "Farklı kütleli iki cisim, eşit miktarda sıkıştırılmış özdeş yaylarla yukarı fırlatılıyor. Çıktıkları en büyük yükseklik aynı mı? Tepedeki U'ları aynı mı?"}, {"id": "BQ7.14", "ref": "Q7.14", "ch": 7, "q": "Can the work of gravity and of friction on a sliding box each be written as −ΔU?", "a": "Yerçekimi evet (U = mgy). Sürtünme hayır: işi yola bağlı, korunumsuz.", "star": false, "tr": "Kayan bir kutuya yer çekiminin ve sürtünmenin yaptığı işlerin her biri −ΔU şeklinde yazılabilir mi?"}, {"id": "BQ7.15", "ref": "Q7.15", "ch": 7, "q": "Why is friction non-conservative? Does it store energy?", "a": "Kapalı yolda işi sıfır değil; enerjiyi geri vermez, iç enerjiye çevirir.", "star": false, "tr": "Sürtünme neden korunumsuz (konservatif olmayan) bir kuvvettir? Enerji depolar mı?"}];
const BANK_A = [{"ref": "1.1", "q": "A rock has mass 2.40 kg and volume 8.0 × 10⁻⁴ m³. With correct significant figures, its density is", "o": ["3 × 10³ kg/m³", "3.0 × 10³ kg/m³", "3.00 × 10³ kg/m³", "3.000 × 10³ kg/m³", "Any of these; they are equal"], "c": 1, "w": "Hacim iki anlamlı basamaklı (8.0), sonuç da iki basamak: 3.0 × 10³.", "tr": "Bir kayanın kütlesi 2.40 kg ve hacmi 8.0 × 10⁻⁴ m³. Anlamlı rakamlar doğru kullanılırsa yoğunluğu", "tro": ["3 × 10³ kg/m³", "3.0 × 10³ kg/m³", "3.00 × 10³ kg/m³", "3.000 × 10³ kg/m³", "Hepsi olur; hepsi birbirine eşit"]}, {"ref": "1.2", "q": "Vector E⃗ has magnitude E. Its direction is given by the angle β measured from the +y axis toward the +x axis. Its components are", "o": ["Eₓ = E cos β, E_y = E sin β", "Eₓ = E sin β, E_y = E cos β", "Eₓ = −E cos β, E_y = −E sin β", "Eₓ = −E sin β, E_y = −E cos β", "Eₓ = −E cos β, E_y = E sin β"], "c": 1, "w": "Açı y ekseninden ölçülünce sin ve cos yer değiştirir: Eₓ = E sin β, E_y = E cos β.", "tr": "E⃗ vektörünün büyüklüğü E. Yönü, +y ekseninden +x eksenine doğru ölçülen β açısıyla veriliyor. Bileşenleri", "tro": ["Eₓ = E cos β, E_y = E sin β", "Eₓ = E sin β, E_y = E cos β", "Eₓ = −E cos β, E_y = −E sin β", "Eₓ = −E sin β, E_y = −E cos β", "Eₓ = −E cos β, E_y = E sin β"]}, {"ref": "1.3", "q": "Which vector has a negative x-component and a positive y-component?", "o": ["A⃗ = 3î − 2ĵ", "B⃗ = −4î + ĵ", "C⃗ = 2î + 5ĵ", "D⃗ = −î − 3ĵ", "None of these"], "c": 1, "w": "−x ve +y: sol üst çeyrek. Sadece B⃗ = −4î + ĵ.", "tr": "Hangi vektörün x bileşeni negatif, y bileşeni pozitiftir?", "tro": ["A⃗ = 3î − 2ĵ", "B⃗ = −4î + ĵ", "C⃗ = 2î + 5ĵ", "D⃗ = −î − 3ĵ", "Hiçbiri"]}, {"ref": "1.4", "q": "Vectors A⃗ and B⃗ are drawn tip-to-tail (B⃗ starts at the tip of A⃗). Vector C⃗ goes from the tail of A⃗ to the tip of B⃗. Then C⃗ =", "o": ["A⃗ + B⃗", "A⃗ − B⃗", "B⃗ − A⃗", "−A⃗ − B⃗", "Not enough information"], "c": 0, "w": "Uç uca ekleme: ilk kuyruktan son uca giden vektör toplamdır.", "tr": "A⃗ ve B⃗ uç uca çizilmiş (B⃗, A⃗'nın ucundan başlıyor). C⃗, A⃗'nın başlangıç noktasından B⃗'nin ucuna gidiyor. O hâlde C⃗ =", "tro": ["A⃗ + B⃗", "A⃗ − B⃗", "B⃗ − A⃗", "−A⃗ − B⃗", "Bilgi yetersiz"]}, {"ref": "1.5", "q": "A⃗ and B⃗ start at the same point. Vector D⃗ goes from the tip of B⃗ to the tip of A⃗. Then D⃗ =", "o": ["A⃗ + B⃗", "A⃗ − B⃗", "B⃗ − A⃗", "−(A⃗ + B⃗)", "Not enough information"], "c": 1, "w": "B⃗ + D⃗ = A⃗ → D⃗ = A⃗ − B⃗.", "tr": "A⃗ ve B⃗ aynı noktadan başlıyor. D⃗, B⃗'nin ucundan A⃗'nın ucuna gidiyor. O hâlde D⃗ =", "tro": ["A⃗ + B⃗", "A⃗ − B⃗", "B⃗ − A⃗", "−(A⃗ + B⃗)", "Bilgi yetersiz"]}, {"ref": "1.6", "q": "A⃗ and B⃗ start at the same point. Vector D⃗ goes from the tip of A⃗ to the tip of B⃗. Then D⃗ =", "o": ["A⃗ + B⃗", "A⃗ − B⃗", "B⃗ − A⃗", "−(A⃗ + B⃗)", "Not enough information"], "c": 2, "w": "A⃗ + D⃗ = B⃗ → D⃗ = B⃗ − A⃗.", "tr": "A⃗ ve B⃗ aynı noktadan başlıyor. D⃗, A⃗'nın ucundan B⃗'nin ucuna gidiyor. O hâlde D⃗ =", "tro": ["A⃗ + B⃗", "A⃗ − B⃗", "B⃗ − A⃗", "−(A⃗ + B⃗)", "Bilgi yetersiz"]}, {"ref": "1.7", "q": "A⃗ = 6.0 m pointing in the −y direction. B⃗ = 12.0 m at 30° from the +y axis toward +x. For A⃗ + B⃗:", "o": ["x > 0, y > 0", "x > 0, y < 0", "x < 0, y > 0", "x < 0, y < 0", "x = 0, y > 0"], "c": 0, "w": "B⃗ = (6.0, 10.4) m; toplam (6.0, 4.4) m: ikisi de pozitif.", "tr": "A⃗ = 6.0 m, −y yönünde. B⃗ = 12.0 m, +y ekseninden +x'e doğru 30° açıyla. A⃗ + B⃗ için:", "tro": ["x > 0, y > 0", "x > 0, y < 0", "x < 0, y > 0", "x < 0, y < 0", "x = 0, y > 0"]}, {"ref": "1.8", "q": "Same vectors (A⃗ = 6.0 m along −y, B⃗ = 12.0 m at 30° from +y toward +x). For A⃗ − B⃗:", "o": ["x > 0, y > 0", "x > 0, y < 0", "x < 0, y > 0", "x < 0, y < 0", "x = 0, y > 0"], "c": 3, "w": "A⃗ − B⃗ = (0 − 6.0, −6.0 − 10.4) = (−6.0, −16.4): ikisi de negatif.", "tr": "Aynı vektörler (A⃗ = 6.0 m, −y boyunca; B⃗ = 12.0 m, +y'den +x'e doğru 30°). A⃗ − B⃗ için:", "tro": ["x > 0, y > 0", "x > 0, y < 0", "x < 0, y > 0", "x < 0, y < 0", "x = 0, y > 0"]}, {"ref": "1.9", "q": "For any two vectors A⃗ and B⃗ (magnitudes A and B), which is always true?", "o": ["|A⃗ + B⃗| = A + B", "|A⃗ + B⃗| = A − B", "|A⃗ + B⃗| ≥ |A − B|", "|A⃗ + B⃗| > |A⃗ − B⃗|", "|A⃗ + B⃗| = √(A² + B²)"], "c": 2, "w": "Toplamın büyüklüğü |A − B| ile A + B arasında. Diğerleri sadece özel açılarda doğru.", "tr": "Herhangi iki vektör A⃗ ve B⃗ için (büyüklükleri A ve B), hangisi her zaman doğrudur?", "tro": ["|A⃗ + B⃗| = A + B", "|A⃗ + B⃗| = A − B", "|A⃗ + B⃗| ≥ |A − B|", "|A⃗ + B⃗| > |A⃗ − B⃗|", "|A⃗ + B⃗| = √(A² + B²)"]}, {"ref": "1.10", "q": "For any two vectors A⃗ and B⃗, which is always true?", "o": ["|A⃗ − B⃗| = A − B", "|A⃗ − B⃗| = A + B", "|A⃗ − B⃗| ≥ |A − B|", "|A⃗ − B⃗| > |A⃗ + B⃗|", "|A⃗ − B⃗| = √(A² + B²)"], "c": 2, "w": "Fark vektörü için de aynı üçgen eşitsizliği: |A − B| ≤ |A⃗ − B⃗| ≤ A + B.", "tr": "Herhangi iki vektör A⃗ ve B⃗ için hangisi her zaman doğrudur?", "tro": ["|A⃗ − B⃗| = A − B", "|A⃗ − B⃗| = A + B", "|A⃗ − B⃗| ≥ |A − B|", "|A⃗ − B⃗| > |A⃗ + B⃗|", "|A⃗ − B⃗| = √(A² + B²)"]}, {"ref": "1.11", "q": "A⃗ = (0, −6.0) m and D⃗ = (−6.0, 8.0) m. The components of E⃗ = A⃗ + D⃗ are", "o": ["(−6.0, −2.0) m", "(−6.0, +2.0) m", "(−6.0, +14.0) m", "(+6.0, +2.0) m", "(0, +2.0) m"], "c": 1, "w": "Bileşenleri topla: (0 − 6.0, −6.0 + 8.0) = (−6.0, 2.0).", "tr": "A⃗ = (0, −6.0) m ve D⃗ = (−6.0, 8.0) m. E⃗ = A⃗ + D⃗ vektörünün bileşenleri", "tro": ["(−6.0, −2.0) m", "(−6.0, +2.0) m", "(−6.0, +14.0) m", "(+6.0, +2.0) m", "(0, +2.0) m"]}, {"ref": "1.12", "q": "The angle θ is measured counterclockwise from the +x axis. For which vector is θ largest?", "o": ["3î + 4ĵ", "−3î + 4ĵ", "−3î − 4ĵ", "3î − 4ĵ", "−4î + 3ĵ"], "c": 3, "w": "Açılar: 53°, 127°, 233°, 307°, 143°. En büyük: 3î − 4ĵ (dördüncü çeyrek).", "tr": "θ açısı +x ekseninden saat yönünün tersine ölçülüyor. Hangi vektör için θ en büyüktür?", "tro": ["3î + 4ĵ", "−3î + 4ĵ", "−3î − 4ĵ", "3î − 4ĵ", "−4î + 3ĵ"]}, {"ref": "1.13", "q": "C⃗ has magnitude 10 m, D⃗ has magnitude 12 m, and the angle between them is 60°. C⃗ · D⃗ =", "o": ["60 m²", ject moves toward −x and the spacing between dots keeps increasing. Signs of vₓ and aₓ?", "o": ["vₓ < 0, aₓ = 0", "vₓ < 0, aₓ > 0", "vₓ < 0, aₓ < 0", "vₓ > 0, aₓ > 0", "vₓ > 0, aₓ < 0"], "c": 2, "w": "−x yönünde gidiyor ve hızlanıyor: ivme de −x yönünde.", "tr": "Bir hareket diyagramında (eşit zaman aralıklarında konan noktalar) bir cisim −x yönüne gidiyor ve noktalar arasındaki boşluk giderek artıyor. vₓ ve aₓ'in işaretleri nedir?", "tro": ["vₓ < 0, aₓ = 0", "vₓ < 0, aₓ > 0", "vₓ < 0, aₓ < 0", "vₓ > 0, aₓ > 0", "vₓ > 0, aₓ < 0"]}, {"ref": "2.7", "q": "Same motion (toward −x, speeding up). Which vₓ–t graph fits?", "o": ["A line rising, always positive", "A line rising from a negative value through zero", "A line falling, always positive", "A line falling from positive through zero", "A line falling, always negative"], "c": 4, "w": "vₓ negatif ve büyüklüğü artıyor: hep negatif, düşen doğru.", "tr": "Aynı hareket (−x yönüne, hızlanarak). Hangi vₓ–t grafiği uyar?", "tro": ["Yükselen bir doğru, her zaman pozitif", "Negatif bir değerden başlayıp sıfırı geçerek yükselen bir doğru", "Alçalan bir doğru, her zaman pozitif", "Pozitiften başlayıp sıfırı geçerek alçalan bir doğru", "Alçalan bir doğru, her zaman negatif"]}, {"ref": "2.8", "q": "Same motion. Which aₓ–t graph fits?", "o": ["Constant, positive", "Constant, negative", "Increasing, positive", "Increasing through zero", "Decreasing through zero"], "c": 1, "w": "Sabit ivme, negatif.", "tr": "Aynı hareket. Hangi aₓ–t grafiği uyar?", "tro": ["Sabit, pozitif", "Sabit, negatif", "Artan, pozitif", "Sıfırı geçerek artan", "Sıfırı geçerek azalan"]}, {"ref": "2.9", "q": "x₀ > 0, v₀ₓ < 0, aₓ > 0 (constant). Which vₓ–t graph fits?", "o": ["A line rising, always positive", "A line rising from a negative value through zero", "A line falling, always positive", "A line falling from positive through zero", "A line falling, always negative"], "c": 1, "w": "Negatif değerden başlayıp yükselen doğru (eğim = a > 0).", "tr": "x₀ > 0, v₀ₓ <
