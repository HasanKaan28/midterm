ative and rises steadily through zero", "Starts positive and falls", "Starts positive and falls to zero", "Starts at zero and rises", "Constant negative"], "c": 0, "w": "Başta yukarı (v < 0), ivme + → negatiften yükselen doğru.", "tr": "Aynı araba (x yokuş aşağı, yokuş yukarı giderek başlıyor). Hangi vₓ–t grafiği uyar?", "tro": ["Negatif başlar ve sıfırı geçerek düzgünce yükselir", "Pozitif başlar ve alçalır", "Pozitif başlar ve sıfıra iner", "Sıfırdan başlar ve yükselir", "Sabit, negatif"]}, {"ref": "2.14", "q": "Same glider. Which x–t graph fits?", "o": ["Starts at 0, rises, then falls (∩)", "Starts at 0, goes negative, then returns (∪)", "A straight line with negative slope", "Starts at 0 and keeps rising", "Constant"], "c": 1, "w": "Önce −x'e gider sonra döner: sıfırdan inip çıkan parabol.", "tr": "Aynı araba. Hangi x–t grafiği uyar?", "tro": ["0'dan başlar, yükselir, sonra düşer (∩)", "0'dan başlar, negatife gider, sonra geri döner (∪)", "Eğimi negatif olan düz bir doğru", "0'dan başlar ve sürekli yükselir", "Sabit"]}, {"ref": "2.15", "q": "A vₓ–t curve is negative and becoming more negative, but it is flattening out. The object is", "o": ["Slowing down at a decreasing rate", "Slowing down at an increasing rate", "Speeding up at a decreasing rate", "Speeding up at an increasing rate", "Changing speed at a steady rate"], "c": 2, "w": "|vₓ| artıyor (hızlanma), eğim küçülüyor (ivme azalıyor).", "tr": "Bir vₓ–t eğrisi negatif ve giderek daha negatif oluyor, ama yatıklaşıyor (eğimi azalıyor). Cisim", "tro": ["Azalan bir oranla yavaşlıyor", "Artan bir oranla yavaşlıyor", "Azalan bir oranla hızlanıyor", "Artan bir oranla hızlanıyor", "Süratini sabit bir oranla değiştiriyor"]}, {"ref": "2.16", "q": "From a vₓ–t graph alone (constant acceleration), what can you NOT find?", "o": ["The acceleration at any time", "The velocity at any time", "The position at any time", "More than one of these", "All can be found"], "c": 2, "w": "Alan sadece Δx verir; konum için x₀ gerekir.", "tr": "Yalnızca bir vₓ–t grafiğinden (sabit ivme) neyi BULAMAZSINIZ?", "tro": ["Herhangi bir andaki ivmeyi", "Herhangi bir andaki hızı", "Herhangi bir andaki konumu", "Bunlardan birden fazlasını", "Hepsi bulunabilir"]}, {"ref": "2.17", "q": "x = 8.0 − 6.0t + 3.0t² (SI). When is the object at rest?", "o": ["Never for t > 0", "t = 0.50 s", "t = 1.0 s", "t = 2.0 s", "More than one time"], "c": 2, "w": "v = −6 + 6t = 0 → t = 1.0 s.", "tr": "x = 8.0 − 6.0t + 3.0t² (SI). Cisim ne zaman durgundur?", "tro": ["t > 0 için hiçbir zaman", "t = 0.50 s", "t = 1.0 s", "t = 2.0 s", "Birden fazla anda"]}, {"ref": "2.18", "q": "Same x = 8.0 − 6.0t + 3.0t². How many times does it pass x = 0?", "o": ["Twice: first moving +x, then −x", "Twice: first moving −x, then +x", "Once, moving +x", "Once, moving −x", "Never"], "c": 4, "w": "3t² − 6t + 8 = 0 → diskriminant 36 − 96 < 0: hiç.", "tr": "Aynı x = 8.0 − 6.0t + 3.0t². Cisim x = 0'dan kaç kez geçer?", "tro": ["İki kez: önce +x yönünde, sonra −x yönünde giderken", "İki kez: önce −x yönünde, sonra +x yönünde giderken", "Bir kez, +x yönünde giderken", "Bir kez, −x yönünde giderken", "Hiç geçmez"]}, {"ref": "2.19", "q": "x = 4.0 + 6.0t − 3.0t² (SI). The x–t graph is", "o": ["A ∪ dipping below zero", "A ∩ starting at x = 4 (rises, then falls)", "A straight line", "A ∪ starting at x = 4, always positive", "A ∩ starting at x = 0"], "c": 1, "w": "x₀ = 4, başta artar (v₀ = 6), sonra azalır: aşağı açılan parabol.", "tr": "x = 4.0 + 6.0t − 3.0t² (SI). x–t grafiği", "tro": ["Sıfırın altına inen bir ∪", "x = 4'ten başlayan bir ∩ (yükselir, sonra düşer)", "Düz bir doğru", "x = 4'ten başlayan, hep pozitif bir ∪", "x = 0'dan başlayan bir ∩"]}, {"ref": "2.20", "q": "Same x = 4.0 + 6.0t − 3.0t². The vₓ–t graph is", "o": ["Rising, starting positive", "Rising, starting negative", "Falling, starting positive", "Falling, starting at zero", "Falling, starting negative"], "c": 2, "w": "v = 6 − 6t: pozitiften başlayıp düşen doğru.", "tr": "Aynı x = 4.0 + 6.0t − 3.0t². vₓ–t grafiği", "tro": ["Yükselen, pozitiften başlayan", "Yükselen, negatiften başlayan", "Alçalan, pozitiften başlayan", "Alçalan, sıfırdan başlayan", "Alçalan, negatiften başlayan"]}, {"ref": "2.21", "q": "A ball thrown up reaches height h. By what factor must the launch speed increase to reach 4h?", "o": ["√2", "2", "4", "8", "16"], "c": 1, "w": "h = v₀²/2g → h ∝ v₀²: 4h için 2 kat hız.", "tr": "Yukarı atılan bir top h yüksekliğine çıkıyor. 4h'ye çıkması için atış sürati hangi çarpanla artmalıdır?", "tro": ["√2", "2", "4", "8", "16"]}, {"ref": "3.1", "q": "A cyclist rides once around a square path of 200 m sides and returns to the start. Magnitude of her net displacement?", "o": ["800 m", "400 m", "200 m", "283 m", "Zero"], "c": 4, "w": "Başladığı yere dönüyor: yer değiştirme 0.", "tr": "Bir bisikletçi, kenarları 200 m olan kare bir yolda bir tur atıp başlangıç noktasına dönüyor. Net yer değiştirmesinin büyüklüğü nedir?", "tro": ["800 m", "400 m", "200 m", "283 m", "Sıfır"]}, {"ref": "3.2", "q": "When is the average velocity over an interval equal to the instantaneous velocity at the end of the interval?", "o": ["Curved path, constant speed", "Curved path, speeding up", "Straight line, constant speed", "Straight line, speeding up", "More than one of these"], "c": 2, "w": "Sadece hız vektörü hiç değişmiyorsa: düz çizgi, sabit sürat.", "tr": "Bir zaman aralığındaki ortalama hız, ne zaman aralığın sonundaki anlık hıza eşit olur?", "tro": ["Eğri yol, sabit sürat", "Eğri yol, hızlanarak", "Düz çizgi, sabit sürat", "Düz çizgi, hızlanarak", "Bunlardan birden fazlası"]}, {"ref": "3.3", "q": "A rover moves north at 1.0 m/s at t = 0. At t = 2.0 s it moves at 2.0 m/s in a direction 128° counterclockwise from +x (up and to the left). Direction of its average acceleration?", "o": ["Up and to the left", "Up and to the right", "Down and to the left", "Down and to the right", "None of these"], "c": 0, "w": "Δv⃗ = v⃗₂ − v⃗₀ = (−1.23, 1.58 − 1.0) = (−1.23, +0.58): sola ve yukarı.", "tr": "Bir keşif aracı t = 0'da 1.0 m/s ile kuzeye gidiyor. t = 2.0 s'de +x'ten saat yönünün tersine 128° yönünde (yukarı ve sola) 2.0 m/s ile gidiyor. Ortalama ivmesinin yönü nedir?", "tro": ["Yukarı ve sola", "Yukarı ve sağa", "Aşağı ve sola", "Aşağı ve sağa", "Hiçbiri"]}, {"ref": "3.4", "q": "An object moves at constant speed along a path: a curve, then a straight section, then another curve. Where is its acceleration zero?", "o": ["Only on the curves", "Only on the straight section", "Everywhere, since speed is constant", "Nowhere", "Only at the ends of the curves"], "c": 1, "w": "Düz kısımda hız vektörü değişmiyor → ivme 0. Eğrilerde yön değişiyor.", "tr": "Bir cisim bir yol boyunca sabit süratle gidiyor: önce bir eğri, sonra düz bir kısım, sonra başka bir eğri. İvmesi nerede sıfırdır?", "tro": ["Yalnızca eğrilerde", "Yalnızca düz kısımda", "Her yerde, çünkü sürat sabit", "Hiçbir yerde", "Yalnızca eğrilerin uçlarında"]}, {"ref": "3.5", "q": "A cyclist rounds a curve at constant speed. Is he accelerating?", "o": ["No", "Yes, in his direction of motion", "Yes, toward the inside of the curve", "Yes, toward the outside of the curve", "Yes, in some other direction"], "c": 2, "w": "Yön değişiyor: ivme eğrinin içine doğru.", "tr": "Bir bisikletçi bir virajı sabit süratle dönüyor. İvmesi var mı?", "tro": ["Hayır", "Evet, hareket yönünde", "Evet, virajın içine doğru", "Evet, virajın dışına doğru", "Evet, başka bir yönde"]}, {"ref": "3.6", "q": "An object moves at constant speed around an oval (not circular) track. Its acceleration at a point on the track points", "o": ["Away from the geometric center", "In the direction of motion", "Toward the geometric center", "Perpendicular to the track, toward the inside", "Perpendicular to the track, toward the outside"], "c": 3, "w": "Sabit süratte ivme hıza dik ve eğrinin içine doğru; ovalde merkeze doğru değil.", "tr": "Bir cisim oval (çember olmayan) bir pistte sabit süratle dönüyor. Pistteki bir noktada ivmesinin yönü", "tro": ["Geometrik merkezden dışarı doğru", "Hareket yönünde", "Geometrik merkeze doğru", "Piste dik, içe doğru", "Piste dik, dışa doğru"]}, {"ref": "3.7", "q": "A sled slows down going up a hill and speeds up going down the other side. Its acceleration at the very top points", "o": ["Backward (horizontal)", "Straight up", "Forward (horizontal)", "Straight down", "None of these"], "c": 3, "w": "Tepede teğetsel bileşen 0 (yavaşlamadan hızlanmaya geçiş); sadece merkezcil, aşağı.", "tr": "Bir kızak tepeye çıkarken yavaşlıyor, diğer taraftan inerken hızlanıyor. Tam tepede ivmesinin yönü", "tro": ["Geriye (yatay)", "Dümdüz yukarı", "İleriye (yatay)", "Dümdüz aşağı", "Hiçbiri"]}, {"ref": "3.8", "q": "A pendulum bob passes through its lowest point moving to the right. Its acceleration points", "o": ["Left", "Straight up", "Right", "Straight down", "It is zero"], "c": 1, "w": "Teğetsel 0, merkezcil yukarı (ipe doğru).", "tr": "Bir sarkaç topu en alçak noktasından sağa doğru giderek geçiyor. İvmesinin yönü", "tro": ["Sola", "Dümdüz yukarı", "Sağa", "Dümdüz aşağı", "İvme sıfır"]}, {"ref": "3.9", "q": "A pendulum bob is at the far left end of its swing (momentarily at rest). Its acceleration points", "o": ["Up and to the left", "Up and to the right", "Down and to the right, along the arc", "Straight down", "Down and to the left"], "c": 2, "w": "v = 0 → merkezcil 0; ivme yola teğet, alt noktaya doğru.", "tr": "Bir sarkaç topu salınımının en sol ucunda (o an için duruyor). İvmesinin yönü", "tro": ["Yukarı ve sola", "Yukarı ve sağa", "Yay boyunca aşağı ve sağa", "Dümdüz aşağı", "Aşağı ve sola"]}, {"ref": "3.10", "q": "At one instant v⃗ = 4.0ĵ m/s and a⃗ = (1.0î − 0.5ĵ) m/s². The object is", "o": ["Speeding up, curved path", "Speeding up, straight line", "Slowing down, curved path", "Slowing down, straight line", "None of these"], "c": 2, "w": "a⃗·v⃗ = −2 < 0 → yavaşlıyor; a⃗'nın dik bileşeni var → eğri.", "tr": "Bir anda v⃗ = 4.0ĵ m/s ve a⃗ = (1.0î − 0.5ĵ) m/s². Cisim", "tro": ["Hızlanıyor, eğri bir yolda", "Hızlanıyor, düz bir çizgide", "Yavaşlıyor, eğri bir yolda", "Yavaşlıyor, düz bir çizgide", "Hiçbiri"]}, {"ref": "3.11", "q": "At one instant v⃗ = (3.0î + 2.0ĵ) m/s and a⃗ = (1.0î − 0.5ĵ) m/s². The object is", "o": ["Speeding up, curved path", "Speeding up, straight line", "Slowing down, curved path", "Slowing down, straight line", "None of these"], "c": 0, "w": "a⃗·v⃗ = 3 − 1 = 2 > 0 → hızlanıyor; paralel değil → eğri.", "tr": "Bir anda v⃗ = (3.0î + 2.0ĵ) m/s ve a⃗ = (1.0î − 0.5ĵ) m/s². Cisim", "tro": ["Hızlanıyor, eğri bir yolda", "Hızlanıyor, düz bir çizgide", "Yavaşlıyor, eğri bir yolda", "Yavaşlıyor, düz bir çizgide", "Hiçbiri"]}, {"ref": "3.12", "q": "One ball is dropped and an identical ball is fired horizontally from the same height at the same time. Which lands first?", "o": ["The dropped ball", "The fired ball", "They land together", "Depends on the firing speed", "Depends on speed and masses"], "c": 2, "w": "Düşey hareket yatay hızdan bağımsız.", "tr": "Bir top serbest bırakılıyor, özdeş bir top da aynı anda aynı yükseklikten yatay olarak fırlatılıyor. Hangisi önce yere düşer?", "tro": ["Bırakılan top", "Fırlatılan top", "Birlikte düşerler", "Fırlatma süratine bağlı", "Sürate ve kütlelere bağlı"]}, {"ref": "3.13", "q": "An object is released from a plane flying straight and level at constant speed. Seen from the ground, the object", "o": ["Falls behind the plane but still moves forward", "Falls behind and drops straight down", "Falls behind and moves backward", "Stays directly below the plane", "Moves ahead of the plane"], "c": 3, "w": "Uçakla aynı yatay hıza sahip: hep tam altında. Geçen yılın B1'i!", "tr": "Düz ve yatay olarak sabit süratle uçan bir uçaktan bir cisim bırakılıyor. Yerden bakıldığında cisim", "tro": ["Uçağın gerisinde kalır ama yine de ileri gider", "Geride kalır ve dümdüz aşağı düşer", "Geride kalır ve geriye doğru gider", "Hep uçağın tam altında kalır", "Uçağın önüne geçer"]}, {"ref": "3.14", "q": "A dart is aimed straight at a monkey, which lets go of its branch the instant the dart is fired. When the dart is at the top of its path (point P), the monkey is", "o": ["Higher than P", "At the same height as P", "Lower than P", "Not enough information"], "c": 0, "w": "İkisi aynı ½gt² kadar düşer; dart tepedeyken henüz maymuna ulaşmadı, maymun P'den yüksekte.", "tr": "Bir dart doğrudan bir maymuna nişan alınarak atılıyor; maymun, dart atıldığı anda daldan kendini bırakıyor. Dart yolunun tepesindeyken (P noktası) maymun", "tro": ["P'den daha yüksekte", "P ile aynı yükseklikte", "P'den daha alçakta", "Bilgi yetersiz"]}, {"ref": "3.15", "q": "A projectile is launched 40° above the horizontal (no air resistance). Its acceleration is greatest", "o": ["On the way up", "At the top", "On the way down", "Nowhere: it is the same nonzero value everywhere", "Nowhere: it is zero everywhere"], "c": 3, "w": "Her yerde g, aşağı.", "tr": "Bir cisim yatayın 40° üstüne doğru fırlatılıyor (hava direnci yok). İvmesi en büyük", "tro": ["Çıkarken", "Tepede", "İnerken", "Hiçbir yerde: her yerde aynı, sıfır olmayan değerde", "Hiçbir yerde: her yerde sıfır"]}, {"ref": "3.16", "q": "Car 1 rounds a 50 m radius circle at 60 km/h; car 2 rounds a 150 m circle at 180 km/h. Car 2's acceleration compared with car 1's:", "o": ["9 times", "3 times", "The same", "1/3", "27 times"], "c": 1, "w": "a = v²/R → (3v)²/(3R) = 3 v²/R.", "tr": "1. araba 50 m yarıçaplı bir çemberi 60 km/h ile, 2. araba 150 m'lik bir çemberi 180 km/h ile dönüyor. 2. arabanın ivmesi, 1. arabanınkine göre:", "tro": ["9 katı", "3 katı", "Aynı", "1/3'ü", "27 katı"]}, {"ref": "3.17", "q": "In a vertical loop the radial acceleration at the bottom is 9 times that at the top (same radius). Speed at the bottom compared with the top:", "o": ["√3 times", "3 times", "9 times", "81 times", "1/3"], "c": 1, "w": "Aynı R: a ∝ v² → 9 kat a = 3 kat v.", "tr": "Düşey bir çemberde en alttaki merkezcil (radyal) ivme, en üsttekinin 9 katı (yarıçap aynı). En alttaki sürat, en üsttekine göre:", "tro": ["√3 katı", "3 katı", "9 katı", "81 katı", "1/3'ü"]}, {"ref": "3.18", "q": "A plane with airspeed 250 km/h wants to travel due east. The wind blows toward the north at 150 km/h. Its ground speed is", "o": ["100 km/h", "150 km/h", "200 km/h", "250 km/h", "It cannot fly due east"], "c": 2, "w": "Burnu güney-doğuya çevirir: yer hızı √(250² − 150²) = 200 km/h.", "tr": "Havaya göre sürati 250 km/h olan bir uçak tam doğuya gitmek istiyor. Rüzgâr 150 km/h ile kuzeye doğru esiyor. Uçağın yere göre sürati", "tro": ["100 km/h", "150 km/h", "200 km/h", "250 km/h", "Tam doğuya uçamaz"]}, {"ref": "3.19", "q": "A plane points due east with airspeed 100 km/h but moves due north at 100 km/h relative to the ground. The wind velocity is", "o": ["100 km/h from SW toward NE", "100 km/h from SE toward NW", "141 km/h from SW toward NE", "141 km/h from SE toward NW", "No wind can do this"], "c": 3, "w": "v_rüzgâr = v_yer − v_uçak = (−100, +100) → 141 km/h kuzeybatıya, güneydoğudan esiyor.", "tr": "Bir uçağın burnu tam doğuyu gösteriyor ve havaya göre sürati 100 km/h, ama yere göre 100 km/h ile tam kuzeye gidiyor. Rüzgârın hızı", "tro": ["100 km/h, güneybatıdan (SW) kuzeydoğuya (NE) doğru", "100 km/h, güneydoğudan (SE) kuzeybatıya (NW) doğru", "141 km/h, güneybatıdan (SW) kuzeydoğuya (NE) doğru", "141 km/h, güneydoğudan (SE) kuzeybatıya (NW) doğru", "Hiçbir rüzgâr bunu yapamaz"]}, {"ref": "4.1", "q": "An elevator is lifted at constant speed by a cable (no friction, no air resistance). The cable's upward force on it is", "o": ["Greater than the gravitational force", "Equal to the gravitational force", "Less than the gravitational force", "Any of these, depending on the speed", "Any of these, depending on the acceleration"], "c": 1, "w": "Sabit hız → ΣF = 0 → T = mg.", "tr": "Bir asansör bir kabloyla sabit süratle yukarı çekiliyor (sürtünme yok, hava direnci yok). Kablonun asansöre uyguladığı yukarı kuvvet", "tro": ["Yer çekimi kuvvetinden büyüktür", "Yer çekimi kuvvetine eşittir", "Yer çekimi kuvvetinden küçüktür", "Sürate bağlı olarak bunlardan herhangi biri", "İvmeye bağlı olarak bunlardan herhangi biri"]}, {"ref": "4.2", "q": "The same elevator is lowered at constant speed. The cable's upward force is", "o": ["Greater than the gravitational force", "Equal to the gravitational force", "Less than the gravitational force", "Any of these, depending on the speed", "Any of these, depending on the acceleration"], "c": 1, "w": "Yine sabit hız: T = mg. Hareket yönü değil ivme önemli.", "tr": "Aynı asansör sabit süratle aşağı indiriliyor. Kablonun yukarı kuvveti", "tro": ["Yer çekimi kuvvetinden büyüktür", "Yer çekimi kuvvetine eşittir", "Yer çekimi kuvvetinden küçüktür", "Sürate bağlı olarak bunlardan herhangi biri", "İvmeye bağlı olarak bunlardan herhangi biri"]}, {"ref": "4.3", "q": "An object's vₓ–t graph: constant and positive, then rising linearly, then constant again. Its net-force graph is", "o": ["The same shape as the v–t graph", "Zero, then a rising line, then constant", "Zero, then constant positive, then zero", "Constant positive the whole time", "Zero the whole time"], "c": 2, "w": "F_net ∝ a = v–t eğimi: düz kısımlarda 0, yükselen kısımda sabit pozitif.", "tr": "Bir cismin vₓ–t grafiği: önce sabit ve pozitif, sonra doğrusal olarak yükseliyor, sonra yine sabit. Net kuvvet grafiği", "tro": ["v–t grafiğiyle aynı şekilde", "Sıfır, sonra yükselen bir doğru, sonra sabit", "Sıfır, sonra sabit ve pozitif, sonra sıfır", "Tüm süre boyunca sabit ve pozitif", "Tüm süre boyunca sıfır"]}, {"ref": "4.4", "q": "A horse pulls a wagon. Compare the horse's force on the wagon with the wagon's force on the horse.", "o": ["Horse on wagon is greater", "Wagon on horse is greater", "They are equal in magnitude", "Depends on the velocity", "Depends on the acceleration"], "c": 2, "w": "Üçüncü yasa: her zaman eşit.", "tr": "Bir at bir at arabasını çekiyor. Atın arabaya uyguladığı kuvveti arabanın ata uyguladığı kuvvetle karşılaştırın.", "tro": ["Atın arabaya uyguladığı daha büyük", "Arabanın ata uyguladığı daha büyük", "Büyüklükleri eşit", "Hıza bağlı", "İvmeye bağlı"]}, {"ref": "4.5", "q": "A light crate A pushes a heavy crate B on a floor with friction; both accelerate. Compare the force of A on B with the force of B on A.", "o": ["The force of A on B is greater", "The force of B on A is greater", "Both forces have the same magnitude", "It depends on the speed", "It depends on the acceleration"], "c": 2, "w": "Üçüncü yasa; sürtünme ve ivme fark etmez.", "tr": "Hafif bir A sandığı, sürtünmeli bir zeminde ağır bir B sandığını itiyor; ikisi de ivmeleniyor. A'nın B'ye uyguladığı kuvveti B'nin A'ya uyguladığı kuvvetle karşılaştırın.", "tro": ["A'nın B'ye uyguladığı kuvvet daha büyük", "B'nin A'ya uyguladığı kuvvet daha büyük", "İki kuvvetin büyüklüğü aynı", "Sürate bağlı", "İvmeye bağlı"]}, {"ref": "4.6", "q": "At constant speed the cable force on an elevator equals its weight. Which law explains this?", "o": ["Newton's first law", "Newton's second law", "Newton's third law", "Two of these", "All three"], "c": 0, "w": "Birinci yasa: ivme 0 ↔ net kuvvet 0. Kablo kuvveti ile ağırlık üçüncü yasa çifti değil.", "tr": "Sabit süratte kablonun asansöre uyguladığı kuvvet asansörün ağırlığına eşittir. Bunu hangi yasa açıklar?", "tro": ["Newton'un birinci yasası", "Newton'un ikinci yasası", "Newton'un üçüncü yasası", "Bunlardan ikisi", "Üçü de"]}, {"ref": "4.7", "q": "On a frictionless floor you push light crate A with force F; A pushes heavy crate B and they accelerate together. Compare F, the net force on A and the net force on B.", "o": ["F = net on A = net on B", "F > net on A = net on B", "F > net on A > net on B", "F > net on B > net on A", "None of these"], "c": 3, "w": "Aynı a: F = (m_A + m_B)a, net_B = m_B a, net_A = m_A a. B ağır → F > net_B > net_A.", "tr": "Sürtünmesiz bir zeminde hafif A sandığını F kuvvetiyle itiyorsunuz; A ağır B sandığını itiyor ve birlikte ivmeleniyorlar. F'yi, A'ya etki eden net kuvveti ve B'ye etki eden net kuvveti karşılaştırın.", "tro": ["F = A'ya etki eden net = B'ye etki eden net", "F > A'ya etki eden net = B'ye etki eden net", "F > A'ya etki eden net > B'ye etki eden net", "F > B'ye etki eden net > A'ya etki eden net", "Hiçbiri"]}, {"ref": "4.8", "q": "Same crates on a frictionless floor, pushed by F on A. Which is true?", "o": ["a is larger than if the order were reversed", "a is smaller than if the order were reversed", "They won't move if F is less than their total weight", "Two of these", "None of these"], "c": 4, "w": "a = F/(m_A + m_B), sıra fark etmez; sürtünmesiz yüzeyde her F hareket ettirir.", "tr": "Sürtünmesiz zeminde aynı sandıklar, A'ya uygulanan F ile itiliyor. Hangisi doğrudur?", "tro": ["a, sıralama ters olsaydı olacağından daha büyüktür", "a, sıralama ters olsaydı olacağından daha küçüktür", "F toplam ağırlıklarından küçükse hareket etmezler", "Bunlardan ikisi", "Hiçbiri"]}, {"ref": "4.9", "q": "You start walking from rest. What force pushes you forward?", "o": ["Your feet on the ground", "The force of acceleration", "The force of velocity", "The force of momentum", "The ground on your feet"], "c": 4, "w": "Yerin ayağına uyguladığı (statik sürtünme) kuvvet.", "tr": "Durgun hâlden yürümeye başlıyorsunuz. Sizi hangi kuvvet ileri iter?", "tro": ["Ayaklarınızın yere uyguladığı kuvvet", "İvme kuvveti", "Hız kuvveti", "Momentum kuvveti", "Yerin ayaklarınıza uyguladığı kuvvet"]}, {"ref": "4.10", "q": "Block A sits on block B. A person pulls B horizontally; both move right at constant velocity (friction only between B and the table). The horizontal force of B on A is", "o": ["To the left", "To the right", "Zero", "Depends on the pull", "Depends on the pull and the masses"], "c": 2, "w": "A'nın ivmesi 0 → A'ya yatay net kuvvet 0 → B, A'ya yatay kuvvet uygulamaz.", "tr": "A bloğu B bloğunun üstünde duruyor. Bir kişi B'yi yatay olarak çekiyor; ikisi de sabit hızla sağa gidiyor (sürtünme yalnızca B ile masa arasında). B'nin A'ya uyguladığı yatay kuvvet", "tro": ["Sola doğru", "Sağa doğru", "Sıfır", "Çekme kuvvetine bağlı", "Çekme kuvvetine ve kütlelere bağlı"]}, {"ref": "4.11", "q": "A ball rests on a table. The third-law partner of the ball's weight is", "o": ["The ball's downward push on the table", "The table's upward push on the ball", "The ball's upward pull on the earth", "Two of these", "All of these"], "c": 2, "w": "Ağırlık = Dünya'nın topu çekmesi; çifti topun Dünya'yı çekmesi.", "tr": "Bir top masada duruyor. Topun ağırlığının üçüncü yasa eşi (etki–tepki çifti)", "tro": ["Topun masayı aşağı itmesi", "Masanın topu yukarı itmesi", "Topun Dünya'yı yukarı çekmesi", "Bunlardan ikisi", "Hepsi"]}, {"ref": "4.12", "q": "A ball rests on a table. Why does its weight equal the table's upward force on it?", "o": ["Newton's first law", "Newton's third law", "The table is perfectly rigid", "Two of these", "All of these"], "c": 0, "w": "Top hareketsiz: net kuvvet 0, birinci yasa. Üçüncü yasa çifti değiller.", "tr": "Bir top masada duruyor. Topun ağırlığı neden masanın ona uyguladığı yukarı kuvvete eşittir?", "tro": ["Newton'un birinci yasası", "Newton'un üçüncü yasası", "Masa tamamen rijit (hiç esnemiyor)", "Bunlardan ikisi", "Hepsi"]}, {"ref": "4.13", "q": "A woman pulls a 6.0 kg crate, which pulls a 4.0 kg crate by a taut rope. Compared with the 6.0 kg crate, the 4.0 kg crate has", "o": ["The same net force, same acceleration", "A smaller net force, same acceleration", "The same net force, smaller acceleration", "A smaller net force, smaller acceleration", "None of these"], "c": 1, "w": "Aynı ivme; küçük kütle → küçük net kuvvet.", "tr": "Bir kadın 6.0 kg'lık bir sandığı çekiyor, o sandık da gergin bir iple 4.0 kg'lık bir sandığı çekiyor. 6.0 kg'lık sandığa göre 4.0 kg'lık sandığın", "tro": ["Net kuvveti aynı, ivmesi aynı", "Net kuvveti daha küçük, ivmesi aynı", "Net kuvveti aynı, ivmesi daha küçük", "Net kuvveti daha küçük, ivmesi daha küçük", "Hiçbiri"]}, {"ref": "4.14", "q": "Same two crates moving at constant speed. Compare the force of the 6.0 kg crate on the 4.0 kg crate with the reverse.", "o": ["6 kg on 4 kg is greater", "4 kg on 6 kg is greater", "Same magnitude", "Depends on the pull", "Depends on the pull and friction"], "c": 2, "w": "Üçüncü yasa: eşit.", "tr": "Aynı iki sandık sabit süratle gidiyor. 6.0 kg'lık sandığın 4.0 kg'lık sandığa uyguladığı kuvveti, tersiyle (4.0 kg'lığın 6.0 kg'lığa uyguladığıyla) karşılaştırın.", "tro": ["6 kg'lık sandığın 4 kg'lık sandığa uyguladığı daha büyük", "4 kg'lık sandığın 6 kg'lık sandığa uyguladığı daha büyük", "Büyüklükleri aynı", "Çekme kuvvetine bağlı", "Çekme kuvvetine ve sürtünmeye bağlı"]}, {"ref": "4.15", "q": "Same two crates, now accelerating. Compare the force of the 6.0 kg crate on the 4.0 kg crate with the reverse.", "o": ["6 kg on 4 kg is greater", "4 kg on 6 kg is greater", "Same magnitude", "Depends on the pull", "Depends on the pull and friction"], "c": 2, "w": "Üçüncü yasa: ivme olsa da eşit.", "tr": "Aynı iki sandık, şimdi ivmeleniyor. 6.0 kg'lık sandığın 4.0 kg'lık sandığa uyguladığı kuvveti, tersiyle karşılaştırın.", "tro": ["6 kg'lık sandığın 4 kg'lık sandığa uyguladığı daha büyük", "4 kg'lık sandığın 6 kg'lık sandığa uyguladığı daha büyük", "Büyüklükleri aynı", "Çekme kuvvetine bağlı", "Çekme kuvvetine ve sürtünmeye bağlı"]}, {"ref": "4.16", "q": "You push a tray, which pushes a milk carton; both move at constant speed. Compare the tray's force on the carton with the carton's force on the tray.", "o": ["The force of A on B is greater", "The force of B on A is greater", "Both forces have the same magnitude", "It depends on the speed", "It depends on the acceleration"], "c": 2, "w": "Üçüncü yasa: eşit.", "tr": "Bir tepsiyi itiyorsunuz, tepsi de bir süt kutusunu itiyor; ikisi de sabit süratle gidiyor. Tepsinin kutuya uyguladığı kuvveti kutunun tepsiye uyguladığı kuvvetle karşılaştırın.", "tro": ["A'nın B'ye uyguladığı kuvvet daha büyük", "B'nin A'ya uyguladığı kuvvet daha büyük", "İki kuvvetin büyüklüğü aynı", "Sürate bağlı", "İvmeye bağlı"]}, {"ref": "4.17", "q": "Same tray and carton, now accelerating. Compare the two forces.", "o": ["The force of A on B is greater", "The force of B on A is greater", "Both forces have the same magnitude", "It depends on the speed", "It depends on the acceleration"], "c": 2, "w": "Üçüncü yasa: eşit.", "tr": "Aynı tepsi ve süt kutusu, şimdi ivmeleniyor. İki kuvveti karşılaştırın.", "tro": ["A'nın B'ye uyguladığı kuvvet daha büyük", "B'nin A'ya uyguladığı kuvvet daha büyük", "İki kuvvetin büyüklüğü aynı", "Sürate bağlı", "İvmeye bağlı"]}, {"ref": "5.1", "q": "An engine hangs from chain 1, which is tied to a ring; the ring is held by chain 2 (to a wall) and chain 3 (to the ceiling). Which tensions belong in the engine's free-body diagram?", "o": ["T₁", "T₂", "T₃", "Two of these", "All three"], "c": 0, "w": "Motora sadece zincir 1 dokunuyor (ve ağırlık). T₂, T₃ halkaya etki eder.", "tr": "Bir motor 1. zincire asılı; bu zincir bir halkaya bağlı. Halkayı 2. zincir (duvara bağlı) ve 3. zincir (tavana bağlı) tutuyor. Motorun serbest cisim diyagramına hangi gerilmeler girer?", "tro": ["T₁", "T₂", "T₃", "Bunlardan ikisi", "Üçü de"]}, {"ref": "5.2", "q": "A cable parallel to a frictionless ramp holds a car at rest. Compare the normal force n with the weight w.", "o": ["n = w", "n > w", "n < w", "Two of these are possible", "All are possible"], "c": 2, "w": "n = w cos α < w.", "tr": "Sürtünmesiz bir rampaya paralel bir kablo bir arabayı durgun tutuyor. Normal kuvvet n'yi ağırlık w ile karşılaştırın.", "tro": ["n = w", "n > w", "n < w", "Bunlardan ikisi mümkün", "Hepsi mümkün"]}, {"ref": "5.3", "q": "A lamp of weight w hangs from two cables, each 60° from the vertical. The tension in each cable is", "o": ["w/2", "w/√3", "w", "√3 w", "2w"], "c": 2, "w": "2T cos 60° = w → T = w.", "tr": "Ağırlığı w olan bir lamba, her biri düşeyle 60° açı yapan iki kabloya asılı. Her kablodaki gerilme", "tro": ["w/2", "w/√3", "w", "√3 w", "2w"]}, {"ref": "5.4", "q": "A cart on a frictionless incline is pulled up the incline by a cable to a hanging bucket and accelerates up. The correct free-body diagram for the cart shows", "o": ["n ⊥ incline, T up the incline, w down", "n straight up, T up the incline, w down", "n ⊥ incline, T up the incline, w down, and m₁a up the incline", "n ⊥ incline and w down only", "Not enough information"], "c": 0, "w": "n yüzeye dik, T ip boyunca, w aşağı. ma kuvvet değildir.", "tr": "Sürtünmesiz bir eğik düzlemdeki bir araba, asılı bir kovaya giden bir kabloyla eğik düzlemde yukarı çekiliyor ve yukarı doğru ivmeleniyor. Arabanın doğru serbest cisim diyagramı neyi gösterir?", "tro": ["n ⊥ eğik düzlem (dik), T eğik düzlemde yukarı, w aşağı", "n dümdüz yukarı, T eğik düzlemde yukarı, w aşağı", "n ⊥ eğik düzlem, T eğik düzlemde yukarı, w aşağı, ayrıca eğik düzlemde yukarı m₁a", "Yalnızca n ⊥ eğik düzlem ve w aşağı", "Bilgi yetersiz"]}, {"ref": "5.5", "q": "Same system: the bucket (weight w₂) accelerates downward. Compare the tension T with w₂.", "o": ["T = w₂", "T > w₂", "T < w₂", "Two are possible", "All are possible"], "c": 2, "w": "w₂ − T = m₂a > 0 → T < w₂.", "tr": "Aynı sistem: kova (ağırlığı w₂) aşağı doğru ivmeleniyor. T gerilmesini w₂ ile karşılaştırın.", "tro": ["T = w₂", "T > w₂", "T < w₂", "İkisi mümkün", "Hepsi mümkün"]}, {"ref": "5.6", "q": "Block A on a frictionless table is tied over a pulley to hanging block B. You push A to the left and release it; A moves left, stops, then moves right. At the instant A is at rest, the tension T satisfies", "o": ["T = w_A", "T > w_A", "T = w_B", "T < w_B", "More than one of these"], "c": 3, "w": "Sistemin ivmesi hep B aşağı yönünde (v = 0 olsa da) → T < w_B.", "tr": "Sürtünmesiz bir masadaki A bloğu, bir makaradan geçen iple asılı B bloğuna bağlı. A'yı sola itip bırakıyorsunuz; A sola gidiyor, duruyor, sonra sağa gidiyor. A'nın durduğu anda T gerilmesi için hangisi doğrudur?", "tro": ["T = w_A", "T > w_A", "T = w_B", "T < w_B", "Bunlardan birden fazlası"]}, {"ref": "5.7", "q": "On a frictionless floor you push light crate A, which pushes heavy crate B. Which belongs in B's free-body diagram?", "o": ["The weight of B", "The force of B on A", "Your force F", "The acceleration of B", "More than one of these"], "c": 0, "w": "F sadece A'ya etki eder; B'nin A'ya kuvveti A'nın FBD'sinde; ivme kuvvet değil.", "tr": "Sürtünmesiz bir zeminde hafif A sandığını itiyorsunuz, A da ağır B sandığını itiyor. B'nin serbest cisim diyagramına hangisi girer?", "tro": ["B'nin ağırlığı", "B'nin A'ya uyguladığı kuvvet", "Sizin F kuvvetiniz", "B'nin ivmesi", "Bunlardan birden fazlası"]}, {"ref": "5.8", "q": "A toboggan slides down a slope at constant speed. Compare the normal force n with its weight w.", "o": ["n = w", "n > w", "n < w", "Two are possible, depending on speed", "All are possible"], "c": 2, "w": "Eğimde n = w cos α < w (hız fark etmez).", "tr": "Bir kızak bir yokuştan sabit süratle aşağı kayıyor. Normal kuvvet n'yi ağırlığı w ile karşılaştırın.", "tro": ["n = w", "n > w", "n < w", "Sürate bağlı olarak ikisi mümkün", "Hepsi mümkün"]}, {"ref": "5.9", "q": "Block B sits on block A. A is pulled to the right by a string to a hanging block and accelerates; B slips on A but there is friction between them. Seen from the ground, B is", "o": ["At rest", "Moving left at constant speed", "Moving right at constant speed", "Accelerating to the left", "Accelerating to the right"], "c": 4, "w": "A, B'ye sağa kinetik sürtünme uygular → B sağa ivmelenir (A'dan yavaş).", "tr": "B bloğu A bloğunun üstünde duruyor. A, asılı bir bloğa giden bir iple sağa çekiliyor ve ivmeleniyor; B, A'nın üstünde kayıyor ama aralarında sürtünme var. Yerden bakıldığında B", "tro": ["Duruyor", "Sabit süratle sola gidiyor", "Sabit süratle sağa gidiyor", "Sola doğru ivmeleniyor", "Sağa doğru ivmeleniyor"]}, {"ref": "5.10", "q": "You walk on a level floor without slipping. Which force belongs in your free-body diagram?", "o": ["Kin const EXTRA_MC = [{"ref": "7.1", "q": "A piece of fruit falls straight down. While it falls,", "o": ["the gravitational force does positive work on it and its gravitational potential energy increases.", "the gravitational force does positive work on it and its gravitational potential energy decreases.", "the gravitational force does negative work on it and its gravitational potential energy increases.", "the gravitational force does negative work on it and its gravitational potential energy decreases."], "c": 1, "w": "Yerçekimi aşağı çeker, meyve de aşağı gider: gravity pozitif work yapar. W_grav = −ΔU_grav olduğu için U_grav azalır.", "tr": "Bir meyve dümdüz aşağı düşüyor. Düşerken,", "tro": ["yerçekimi kuvveti pozitif iş yapar ve yerçekimi potansiyel enerjisi artar.", "yerçekimi kuvveti pozitif iş yapar ve yerçekimi potansiyel enerjisi azalır.", "yerçekimi kuvveti negatif iş yapar ve yerçekimi potansiyel enerjisi artar.", "yerçekimi kuvveti negatif iş yapar ve yerçekimi potansiyel enerjisi azalır."]}, {"ref": "7.2", "q": "You throw a 0.150 kg ball straight up; it leaves your hand at 20.0 m/s and rises to a maximum height y₂. Ignoring air resistance, what is its speed at height y₂/2?", "o": ["10.0 m/s", "less than 10.0 m/s but more than zero", "more than 10.0 m/s", "zero", "There is not enough information to decide."], "c": 2, "w": "Enerji korunumu: v² = v₁² − 2g(y₂/2) ve v₁² = 2gy₂, yani v² = v₁²/2 ve v = 20,0/√2 ≈ 14,1 m/s; bu 10,0 m/s'den büyük.", "tr": "0,150 kg'lık bir topu dümdüz yukarı atıyorsun; top elinden 20,0 m/s ile çıkıyor ve en fazla y₂ yüksekliğine çıkıyor. Hava direncini ihmal edersen, y₂/2 yüksekliğinde sürati nedir?", "tro": ["10,0 m/s", "10,0 m/s'den küçük ama sıfırdan büyük", "10,0 m/s'den büyük", "sıfır", "Karar vermek için bilgi yeterli değil."]}, {"ref": "7.3", "q": "A ball of mass m rests on a table whose top is a height d above the floor. The gravitational potential energy of the ball is", "o": ["mgd.", "zero.", "−mgd.", "any value you choose."], "c": 3, "w": "Yalnız U_grav farkları önemlidir; değeri y = 0'ı nereye koyduğuna bağlıdır, yani istediğin değeri alabilir.", "tr": "m kütleli bir top, üst yüzeyi yerden d yükseklikte olan bir masada duruyor. Topun yerçekimi potansiyel enerjisi", "tro": ["mgd'dir.", "sıfırdır.", "−mgd'dir.", "senin seçtiğin herhangi bir değerdir."]}, {"ref": "7.4", "q": "A rock slides from the rim A to the bottom B on the inside of a frictionless hemispherical bowl, and its mechanical energy is conserved (ignore air resistance). Why?", "o": ["Because the bowl is hemispherical.", "Because the normal force is balanced by a centrifugal force.", "Because the normal force is balanced by a centripetal force.", "Because the normal force is perpendicular to the bowl's surface, so it does no work.", "Because the rock's acceleration is perpendicular to the bowl's surface."], "c": 3, "w": "Normal force hareket yönüne her an diktir, bu yüzden iş yapmaz; iş yapan tek kuvvet gravity (conservative force).", "tr": "Bir taş, sürtünmesiz yarım küre biçimli bir kâsenin içinde kenardaki A noktasından dipteki B noktasına kayıyor ve mekanik enerjisi korunuyor (hava direncini ihmal et). Neden?", "tro": ["Çünkü kâse yarım küre biçimindedir.", "Çünkü normal kuvveti merkezkaç kuvveti dengeler.", "Çünkü normal kuvveti merkezcil kuvvet dengeler.", "Çünkü normal kuvvet kâsenin yüzeyine diktir, bu yüzden iş yapmaz.", "Çünkü taşın ivmesi kâsenin yüzeyine diktir."]}, {"ref": "7.5", "q": "Two frictionless ramps start at the same height y₁ and end at the same height y₂; one is curved, the other is straight. Identical blocks are released from rest at the start of each. Which block reaches the end with the greater speed?", "o": ["The block on the curved ramp.", "The block on the straight ramp.", "Both arrive with the same speed.", "There is not enough information to decide."], "c": 2, "w": "Sürtünme yoksa iki rampada da ½mv² = mg(y₁ − y₂); yolun şekli önemli değil.", "tr": "Sürtünmesiz iki rampa aynı y₁ yüksekliğinden başlıyor ve aynı y₂ yüksekliğinde bitiyor; biri eğri, öteki düz. Her birinin başından özdeş bloklar durgun halden bırakılıyor. Hangi blok sona daha büyük süratle varır?", "tro": ["Eğri rampadaki blok.", "Düz rampadaki blok.", "İkisi aynı süratle varır.", "Karar vermek için bilgi yeterli değil."]}, {"ref": "7.6", "q": "A block released from rest slides down a frictionless incline and then compresses a spring at the bottom. While it is compressing the spring, what happens to the gravitational potential energy U_grav and the elastic potential energy U_el?", "o": ["U_grav and U_el both increase.", "U_grav and U_el both decrease.", "U_grav increases; U_el decreases.", "U_grav decreases; U_el increases."], "c": 3, "w": "Blok hâlâ aşağı iniyor (U_grav azalır), yay da daha çok sıkışıyor (U_el = ½kx² artar).", "tr": "Durgun halden bırakılan bir blok sürtünmesiz bir eğik düzlemden aşağı kayıyor, sonra dipteki bir yayı sıkıştırıyor. Yayı sıkıştırırken yerçekimi potansiyel enerjisi U_grav ve yay potansiyel enerjisi U_el ne olur?", "tro": ["U_grav ve U_el ikisi de artar.", "U_grav ve U_el ikisi de azalır.", "U_grav artar, U_el azalır.", "U_grav azalır, U_el artar."]}, {"ref": "7.7", "q": "A particle moves along the x-axis and the only force on it comes from a potential energy U(x). U decreases through x = a, reaches a minimum (below zero) at x = b, increases through x = c and reaches a maximum at x = d. The particle starts at x = d moving in the −x-direction. At which point is its speed greatest?", "o": ["x = a", "x = b", "x = c", "x = d", "more than one of these"], "c": 1, "w": "K = E − U: sürat, U'nun en küçük olduğu yerde, yani minimumda (x = b) en büyüktür.", "tr": "Bir parçacık x ekseni boyunca hareket ediyor ve üzerindeki tek kuvvet U(x) potansiyel enerjisinden geliyor. U, x = a'dan geçerken azalıyor, x = b'de minimuma iniyor (sıfırın altında), x = c'den geçerken artıyor ve x = d'de maksimuma çıkıyor. Parçacık x = d'den −x yönünde hareket ederek başlıyor. Sürati hangi noktada en büyüktür?", "tro": ["x = a", "x = b", "x = c", "x = d", "bunlardan birden fazlası"]}, {"ref": "7.8", "q": "Same potential energy curve and same motion as before (the particle starts at x = d and moves in the −x-direction). At which point is the particle slowing down?", "o": ["x = a", "x = b", "x = c", "x = d", "more than one of these"], "c": 0, "w": "Sola giderken U'nun arttığı yerde yavaşlar; x = a'da x azaldıkça U büyüyor.", "tr": "Aynı potansiyel enerji eğrisi ve aynı hareket (parçacık x = d'den başlıyor ve −x yönünde gidiyor). Parçacık hangi noktada yavaşlıyor?", "tro": ["x = a", "x = b", "x = c", "x = d", "bunlardan birden fazlası"]}, {"ref": "7.9", "q": "For the same potential energy curve, at which points is the force on the particle zero?", "o": ["at x = a and x = c", "at x = b only", "at x = d only", "at x = b and x = d", "nowhere: there is a force at every x"], "c": 3, "w": "F_x = −dU/dx, U'nun eğiminin sıfır olduğu yerde sıfırdır: minimum (b) ve maksimum (d).", "tr": "Aynı potansiyel enerji eğrisi için parçacığa etki eden kuvvet hangi noktalarda sıfırdır?", "tro": ["x = a ve x = c'de", "yalnız x = b'de", "yalnız x = d'de", "x = b ve x = d'de", "hiçbir yerde: her x'te bir kuvvet var"]}, {"ref": "7.10", "q": "A conservative force F_x is negative just left of x = a, zero at x = a and positive just right of x = a (the graph of F_x rises through zero at a). Which statement about the potential energy U at x = a is correct?", "o": ["U = 0 at x = a.", "U has a maximum at x = a.", "U has a minimum at x = a.", "U is neither a maximum nor a minimum at x = a, and its value there need not be zero.", "There is not enough information to decide."], "c": 1, "w": "dU/dx = −F_x: a'nın solunda pozitif, sağında negatif; U önce artar sonra azalır, yani maksimum.", "tr": "Korunumlu bir F_x kuvveti x = a'nın hemen solunda negatif, x = a'da sıfır ve hemen sağında pozitif (F_x grafiği a'da sıfırdan geçerek yükseliyor). x = a'daki potansiyel enerji U için hangisi doğrudur?", "tro": ["x = a'da U = 0'dır.", "U'nun x = a'da maksimumu vardır.", "U'nun x = a'da minimumu vardır.", "U, x = a'da ne maksimum ne minimumdur ve oradaki değeri sıfır olmak zorunda değildir.", "Karar vermek için bilgi yeterli değil."]}, {"ref": "7.11", "q": "Now the conservative force F_x is positive just left of x = a, zero at x = a and negative just right of x = a (the graph falls through zero at a). Which statement about U at x = a is correct?", "o": ["U = 0 at x = a.", "U has a maximum at x = a.", "U has a minimum at x = a.", "U is neither a maximum nor a minimum at x = a, and its value there need not be zero.", "There is not enough information to decide."], "c": 2, "w": "dU/dx = −F_x: a'nın solunda negatif, sağında pozitif; U önce azalır sonra artar, yani minimum (stable equilibrium).", "tr": "Şimdi korunumlu F_x kuvveti x = a'nın hemen solunda pozitif, x = a'da sıfır ve hemen sağında negatif (grafik a'da sıfırdan geçerek düşüyor). x = a'daki U için hangisi doğrudur?", "tro": ["x = a'da U = 0'dır.", "U'nun x = a'da maksimumu vardır.", "U'nun x = a'da minimumu vardır.", "U, x = a'da ne maksimum ne minimumdur ve oradaki değeri sıfır olmak zorunda değildir.", "Karar vermek için bilgi yeterli değil."]}, {"ref": "7.12", "q": "At x = a a conservative force has F_x > 0 and dF_x/dx < 0. Which statement about the potential energy U at x = a is correct?", "o": ["dU/dx > 0 at x = a", "dU/dx < 0 at x = a", "dU/dx = 0 at x = a", "Any of these could be correct."], "c": 1, "w": "dU/dx = −F_x ve F_x > 0, yani dU/dx < 0.", "tr": "x = a'da korunumlu bir kuvvet için F_x > 0 ve dF_x/dx < 0. x = a'daki potansiyel enerji U için hangisi doğrudur?", "tro": ["x = a'da dU/dx > 0", "x = a'da dU/dx < 0", "x = a'da dU/dx = 0", "Bunların hepsi doğru olabilir."]}, {"ref": "7.13", "q": "You push a block up a ramp at constant speed; there is friction between the block and the ramp. The rate at which the internal energy of the block and ramp increases is", "o": ["greater than the rate at which you do work on the block.", "equal to the rate at which you do work on the block.", "less than the rate at which you do work on the block, but not zero.", "zero."], "c": 2, "w": "Senin işinin bir kısmı gravitational potential energy'ye (blok yükseliyor), bir kısmı friction ile internal energy'ye gidiyor; iç enerjinin artma hızı senin power'ından küçük ama sıfır değil.", "tr": "Bir bloğu sabit süratle bir rampadan yukarı itiyorsun; blokla rampa arasında sürtünme var. Blok ve rampanın iç enerjisinin artma hızı", "tro": ["bloğa iş yapma hızından büyüktür.", "bloğa iş yapma hızına eşittir.", "bloğa iş yapma hızından küçüktür ama sıfır değildir.", "sıfırdır."]}];
const EXTRA_RT = [{"ref": "RT1.1", "ch": 1, "q": "The angle θ of a vector is measured counterclockwise from the +x-axis. Rank these five vectors by θ, from largest to smallest: A = +24î + 18ĵ, B = −24î − 18ĵ, C = −18î + 24ĵ, D = −18î − 24ĵ, E = +18î − 24ĵ.", "ans": "E D B C A", "w": "θ: A ≈ 36,9°, C ≈ 126,9°, B ≈ 216,9°, D ≈ 233,1°, E ≈ 306,9°.", "tr": "Bir vektörün θ açısı +x ekseninden saat yönünün tersine ölçülüyor. Bu beş vektörü θ'ya göre büyükten küçüğe sırala: A = +24î + 18ĵ, B = −24î − 18ĵ, C = −18î + 24ĵ, D = −18î − 24ĵ, E = +18î − 24ĵ."}, {"ref": "RT2.1", "ch": 2, "q": "An x–t graph: x decreases through time A, has a minimum at time B, increases through time C, reaches a maximum, then decreases through time D and keeps decreasing more and more steeply through time E. Rank the times by the x-velocity v_x, from most positive to most negative.", "ans": "C B A D E", "w": "v_x, x–t grafiğinin eğimidir: C'de pozitif, B'de sıfır, A ve D'de negatif, E'de en negatif (en dik iniş).", "tr": "Bir x–t grafiği: x, A anından geçerken azalıyor, B anında minimuma iniyor, C anından geçerken artıyor, bir maksimuma çıkıyor, sonra D anından geçerken azalıyor ve E anından geçerken giderek daha dik azalıyor. Anları x-hızı v_x'e göre en pozitiften en negatife sırala."}, {"ref": "RT3.1", "ch": 3, "q": "Five objects all move at 3.00 m/s east at t = 0. At t = 10.0 s their velocities are: A 2.00 m/s east, B 4.00 m/s north, C 5.00 m/s east, D 5.00 m/s west, E zero. Rank them by the magnitude of their average acceleration over the 10.0 s, from largest to smallest.", "ans": "D B E C A", "w": "|Δv⃗|: D = 8,00, B = 5,00 (√(3² + 4²)), E = 3,00, C = 2,00, A = 1,00 m/s; ortalama ivme |Δv⃗|/10,0 s. Slaytın anahtarı A C E B D diyor: bu, aynı sıranın küçükten büyüğe hali.", "tr": "Beş cismin hepsi t = 0'da doğuya 3,00 m/s ile gidiyor. t = 10,0 s'de hızları: A doğuya 2,00 m/s, B kuzeye 4,00 m/s, C doğuya 5,00 m/s, D batıya 5,00 m/s, E sıfır. Onları 10,0 s boyunca ortalama ivmelerinin büyüklüğüne göre büyükten küçüğe sırala."}, {"ref": "RT3.2", "ch": 3, "q": "Five identical objects are launched at the same time from level ground (no air resistance). Their maximum heights are A 1.9 m, B 0.8 m, C 0.65 m, D 2.3 m, E 1.2 m. Rank them by when they hit the ground, from first to last.", "ans": "C B E A D", "w": "Havada kalma süresi yalnız düşey harekete bağlı: t = 2√(2h/g). En alçak çıkan önce düşer.", "tr": "Beş özdeş cisim düz zeminden aynı anda fırlatılıyor (hava direnci yok). En büyük yükseklikleri A 1,9 m, B 0,8 m, C 0,65 m, D 2,3 m, E 1,2 m. Onları yere çarpma sırasına göre ilkten sona sırala."}, {"ref": "RT3.3", "ch": 3, "q": "Five objects move in circles at constant speed: A 5.00 m/s, radius 5.00 m; B 5.00 m/s, 10.0 m; C 5.00 m/s, 20.0 m; D 10.0 m/s, 5.00 m; E 10.0 m/s, 10.0 m. Rank them by the magnitude of their acceleration, from largest to smallest.", "ans": "D E A B C", "w": "a = v²/R: D = 20, E = 10, A = 5, B = 2,5, C = 1,25 m/s².", "tr": "Beş cisim sabit süratle çember çiziyor: A 5,00 m/s, yarıçap 5,00 m; B 5,00 m/s, 10,0 m; C 5,00 m/s, 20,0 m; D 10,0 m/s, 5,00 m; E 10,0 m/s, 10,0 m. Onları ivmelerinin büyüklüğüne göre büyükten küçüğe sırala."}, {"ref": "RT4.1", "ch": 4, "q": "An upward force of magnitude F gives a 2.00 kg block an upward acceleration of 3.00 m/s² (ignore air). Rank these forces by magnitude, from largest to smallest: (A) the force F, (B) the net force on the block, (C) the gravitational force on the block.", "ans": "A C B", "w": "F = m(g + a) = 25,6 N, yerçekimi mg = 19,6 N, net kuvvet ma = 6,0 N.", "tr": "Büyüklüğü F olan yukarı yönlü bir kuvvet 2,00 kg'lık bir bloğa 3,00 m/s² yukarı ivme veriyor (havayı ihmal et). Bu kuvvetleri büyüklüğe göre büyükten küçüğe sırala: (A) F kuvveti, (B) bloğa etki eden net kuvvet, (C) bloğa etki eden yerçekimi kuvveti."}, {"ref": "RT5.1", "ch": 5, "q": "A block of weight w is held at rest on a frictionless 37° incline by a horizontal cable (sin 37° = 3/5, cos 37° = 4/5). Rank by magnitude, from largest to smallest: (A) the gravitational force of the earth on the block, (B) the normal force of the incline on the block, (C) the force of the cable on the block.", "ans": "B A C", "w": "Equilibrium: T = w tan 37° = 0,75w ve n = w / cos 37° = 1,25w; yani n > w > T.", "tr": "Ağırlığı w olan bir blok, sürtünmesiz 37°'lik bir eğik düzlemde yatay bir kabloyla durgun tutuluyor (sin 37° = 3/5, cos 37° = 4/5). Büyüklüğe göre büyükten küçüğe sırala: (A) Dünya'nın bloğa uyguladığı yerçekimi kuvveti, (B) eğik düzlemin bloğa uyguladığı normal kuvvet, (C) kablonun bloğa uyguladığı kuvvet."}, {"ref": "RT6.1", "ch": 6, "q": "Rank by kinetic energy, from largest to smallest: (A) a 2.00 kg object moving at 1.00 m/s; (B) a 1.00 kg object moving at 2.00 m/s; (C) a 4.00 kg object, initially at rest, on which 8.00 J of total work was done; (D) a 4.00 kg object, initially moving at 2.00 m/s, on which −8.00 J of total work was done.", "ans": "C B A D", "w": "K: A = 1,00 J, B = 2,00 J, C = 0 + 8,00 = 8,00 J, D = 8,00 − 8,00 = 0 J.", "tr": "Kinetik enerjiye göre büyükten küçüğe sırala: (A) 1,00 m/s ile giden 2,00 kg'lık cisim; (B) 2,00 m/s ile giden 1,00 kg'lık cisim; (C) başta durgun olan ve üzerine toplam 8,00 J iş yapılan 4,00 kg'lık cisim; (D) başta 2,00 m/s ile giden ve üzerine toplam −8,00 J iş yapılan 4,00 kg'lık cisim."}, {"ref": "RT7.1", "ch": 7, "q": "A potential energy curve U(x): U decreases through point A, has a minimum at B, increases through C, reaches a maximum, then decreases through D and keeps decreasing more and more steeply through E. Rank the points by the x-component F_x of the conservative force, from most positive to most negative.", "ans": "E D A B C", "w": "F_x = −dU/dx: U'nun azaldığı yerde pozitif (A, D ve en çok, en dik olan E), B'de sıfır, U'nun arttığı yerde negatif (C).", "tr": "Bir potansiyel enerji eğrisi U(x): U, A noktasından geçerken azalıyor, B'de minimuma iniyor, C'den geçerken artıyor, bir maksimuma çıkıyor, sonra D'den geçerken azalıyor ve E'den geçerken giderek daha dik azalıyor. Noktaları korunumlu kuvvetin x bileşeni F_x'e göre en pozitiften en negatife sırala."}];

  return `<div class="trbox no-gloss" id="tr-bk-${b.id}" role="note"><span class="trlab">Türkçesi</span><p>${q}</p>${opts}</div>`;
}

function bkFmt(v){ if(v===0) return "0"; const a=Math.abs(v); if(a>=1e5||a<1e-3) return v.toExponential(2).replace("e"," × 10^"); const p=Math.max(0,2-Math.floor(Math.log10(a))); return String(+v.toFixed(p)); }
function bkOK(x,raw){ const v=parseFloat(String(raw).trim().replace(",",".")); return !isNaN(v) && (x.a===0 ? Math.abs(v)<1e-6 : Math.abs(v-x.a)<=Math.abs(x.a)*0.02); }

function bkList(){
  const f=S.bkf;
  let L = BK.filter(b=>(f.kind==="all" || (f.kind==="A" ? (b.kind==="A"||b.kind==="R") : b.kind===f.kind)) && (f.ch==="all" || b.ch===+f.ch));
  if(f.st==="todo") L=L.filter(b=>!bkStatus(b.id));
  else if(f.st==="bad") L=L.filter(b=>bkStatus(b.id)==="bad");
  else if(f.st==="star") L=L.filter(b=>b.star);
  else if(f.st==="round"){ L=L.filter(b=>(b.kind==="A"||b.kind==="R") && bkStatus(b.id)!=="ok");
    if(!BK_ROUND) { BK_ROUND = BK.map(b=>b.id); for(let k=BK_ROUND.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [BK_ROUND[k],BK_ROUND[j]]=[BK_ROUND[j],BK_ROUND[k]]; } }
    const pos=new Map(BK_ROUND.map((id,i)=>[id,i])); L=L.slice().sort((a,b)=>pos.get(a.id)-pos.get(b.id)); }

const QT_BY = Object.fromEntries(QT.map(q=>[String(q.id),q]));
const DA_BY = Object.fromEntries(DA.map(q=>[String(q.id),q]));
const ITEMS = [
  ...QT.map(q=>({set:"qt", id:String(q.id), ch:q.ch, tab:"qt", text:q.q+" "+enQ("qt",q.id,"")})),
  ...EX.map(x=>({set:"ex", id:x.id, ch:x.ch, tab:"ornek", text:x.p+" "+enQ("ex",x.id,"")})),
  ...DA.map(q=>({set:"da", id:String(q.id), ch:q.ch, tab:"deneme", text:q.q+" "+enQ("da",q.id,"")})),
  ...DB.map(p=>({set:"db", id:p.id, ch:p.ch, tab:"deneme", text:p.q+" "+enQ("db",p.id,"")})),
  ...BK.map(b=>({set:"bk", id:b.id, ch:"b"+b.ch, tab:"banka", text:bkText(b)}))
];
const DB_BY = Object.fromEntries(DB.map(p=>[p.id,p]));
function label(it){ return it.set==="bk" ? bkLabel(BK_BY[it.id]) : it.set==="db" ? DB_BY[it.id].n : PFX[it.set]+it.id; }
function srcOf(it){ return it.set==="bk" ? "Soru bankası · "+BK_KIND[BK_BY[it.id].kind] : it.set==="db" ? PART_NAME[DB_BY[it.id].part] : SRC[it.set]; }
function dbPts(p){ const v=S.db[p.id]; return [0,6,12].includes(v) ? p.pt*v/12 : null; }
function cid(it){ return "q-"+it.set+"-"+it.id; }
function status(it){
  if(it.set==="qt") return S.qtDone ? (S.qt[it.id]===QT_BY[it.id].a ? "ok":"bad") : null;
  if(it.set==="da") return S.daDone ? (S.da[it.id]===DA_BY[it.id].a ? "ok":"bad") : null;
  if(it.set==="bk") return bkStatus(it.id);
  if(it.set==="db"){ const v=S.db[it.id]; return v===12?"ok":v===6?"mid":v===0?"bad":null; }
  return S.ex[it.id]==="ok"||S.ex[it.id]==="bad" ? S.ex[it.id] : null;
}
function stText(st){ return st==="ok"?"✓ Doğru":st==="bad"?"✗ Yanlış":st==="mid"?"½ Yarım":""; }

function badge(k){
  if(!TAB_SETS[k]) return "";

  if(!TABS.some(([t])=>t===k)) k="plan";

function scratchBtn(it){ return `<button class="btn ghost" data-scratch="${it.set}:${it.id}" type="button" aria-expanded="${!!S.open["sc:"+it.set+":"+it.id]}">✏️ Karalama</button>`; }
function scratchHTML(it){

function hintParts(it, h){
  if(!h) return ["",""];

/* ---------- multiple-choice card (hızlı test, deneme A) ---------- */
function mcCard(it){
  const q = it.set==="qt" ? QT_BY[it.id] : DA_BY[it.id];
  const ans = it.set==="qt" ? S.qt : S.da, done = it.set==="qt" ? S.qtDone : S.daDone;
  const sel = ans[it.id], has = sel!==undefined && sel!==null;
  const st = status(it);
  return `<article class="q" id="${cid(it)}">
    ${headHTML(it, st, done && !has ? "Boş" : null)}
    <div class="prompt" data-trtap="${it.set}:${it.id}"><p>${enQ(it.set,it.id,q.q)}</p>${trBox(it.set,it.id)}</div>
    <div class="opts" role="radiogroup" aria-label="${label(it)} seçenekleri">${enO(it.set,it.id,q.o).map((o,i)=>{
      let c="opt"; if(done){ c+=" dis"; if(i===q.a) c+=" ok"; else if(i===sel) c+=" bad"; }
      return `<label class="${c}"><input type="radio" name="${it.set}${it.id}" data-mc="${it.set}" data-qid="${it.id}" value="${i}" ${sel===i?"checked":""} ${done?"disabled":""}><span class="L">${L[i]})</span><span>${o}</span></label>`;
    }).join("")}</div>
    <div class="actions">${trBtn(it.set,it.id)}${scratchBtn(it)}</div>
    ${scratchHTML(it)}
    ${done?`<div class="sol"><p><b>Cevap ${L[q.a]}.</b> ${q.e}</p></div>`:""}
  </article>`;
}

function ornekView(){
  const its = ITEMS.filter(i=>i.set==="ex");
  const ok = its.filter(i=>status(i)==="ok").length, bad = its.filter(i=>status(i)==="bad").length;
  const cnt = c=>its.filter(i=>i.ch===c).length;
  const filters = [["all",`Tümü (${its.length})`], ...Object.keys(CHS).filter(c=>cnt(c)).map(c=>[c,`${CHS[c]} (${cnt(c)})`]), ["bad",`✗ Yanlışlarım (${bad})`], ["todo",`⏳ Çözülmemiş (${its.length-ok-bad})`]];
  if(!filters.some(([k])=>k===S.exf)) S.exf="all";
  let list = EX;
  if(S.exf==="bad") list = EX.filter(x=>S.ex[x.id]==="bad");

function scoreHTML(){
  const a = S.daDone ? ITEMS.filter(i=>i.set==="da"&&status(i)==="ok").length : null;
  const part = k => { const ps=DB.filter(p=>p.part===k), m=ps.filter(p=>dbPts(p)!==null); return {all:ps.length, n:m.length, pts:m.reduce((s,p)=>s+dbPts(p),0)}; };
  const b = part("B"), c = part("C");
  if(a===null && !b.n && !c.n) return "";
  const full = a!==null && b.n===b.all && c.n===c.all, t = full ? a+b.pts+c.pts : null;
  let msg="";

function stats(){
  const r={}; for(const c in CHS) r[c]={ok:0,bad:0,tot:0};
  for(const it of ITEMS){ const s=status(it); r[it.ch].tot++; if(s==="ok") r[it.ch].ok++; else if(s==="bad") r[it.ch].bad++; else if(s==="mid"){ r[it.ch].ok+=.5; r[it.ch].bad+=.5; } }
  return r;
}
function fmt(x){ return Number.isInteger(x)?String(x):x.toFixed(1).replace(".",","); }
function ilerlemeView(){
  const r = stats();
  const weak = Object.keys(CHS).filter(c=>{ const s=r[c], n=s.ok+s.bad; return n && s.ok/n<0.7; }).sort((a,b)=>r[a].ok/(r[a].ok+r[a].bad)-r[b].ok/(r[b].ok+r[b].bad));
  let h = `<section class="sheet"><h2>📊 Bölüm bazlı ilerleme</h2>

    <p class="small"><b>Zayıf bölümler:</b> ${weak.length?`<span class="wklist">${weak.map(c=>`<span class="chip red">${CH[c]}</span>`).join("")}</span> En baştakinden başla.`:"Henüz yok ya da veri yetersiz. Önce hızlı testi çöz."}</p>

    h += `<tr><td class="${isWeak?"weak":""}">${CH[c]}</td><td style="color:var(--green);font-weight:700">${fmt(s.ok)}</td><td style="color:var(--red);font-weight:700">${fmt(s.bad)}</td><td>${fmt(s.tot-n)}</td>
      <td><div class="meter" role="img" aria-label="${fmt(s.ok)} doğru, ${fmt(s.bad)} yanlış, ${fmt(s.tot-n)} boş"><span class="g" style="width:${100*s.ok/s.tot}%"></span><span class="r" style="width:${100*s.bad/s.tot}%"></span></div></td>
      <td><button type="button" class="go" data-exgo="${c}">örnekler</button> · <button type="button" class="go" data-ozgo="${c}">özet</button> · <button type="button" class="go" data-fogo="${c}">formül</button></td></tr>`; }

  const bad = ITEMS.filter(i=>{ const s=status(i); return s==="bad"||s==="mid"; });
  h += `<section class="sheet"><h2>📕 Hata listesi (${bad.length} soru)</h2>`;
  h += bad.length ? `<p class="muted">Sınavdan önce bu soruları tekrar çöz. Örneklerde "Doğru yaptım" deyince listeden düşer.</p>`+bad.map(it=>{
      const s=status(it), extra = (it.set==="qt"||it.set==="da") && (it.set==="qt"?S.qt:S.da)[it.id]===undefined ? " · boş" : "";
      return `<div class="errrow"><span class="qid">${label(it)}</span><span class="chip ${s==="mid"?"amber":"red"}">${s==="mid"?"Yarım":"Yanlış"+extra}</span><span class="what">${srcOf(it)} · ${CH[it.ch]}</span><button type="button" class="btn soft" data-jump="${it.set}:${it.id}" style="padding:3px 10px;font-size:.8rem">Soruya git</button></div>`;
    }).join("")

/* ---------- scratch canvas ---------- */
function initScratchCanvases(){
  document.querySelectorAll(".scratch-canvas").forEach(canv=>{
    if(canv.dataset.bound) return; canv.dataset.bound="1";
    const ctx=canv.getContext("2d"); let drawing=false;
    const pos=e=>{ const r=canv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return [(p.clientX-r.left)*(canv.width/r.width),(p.clientY-r.top)*(canv.height/r.height)]; };
    const start=e=>{ drawing=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); };
    const move=e=>{ if(!drawing) return; const [x,y]=pos(e); ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--blue").trim()||"#3b82f6"; ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineTo(x,y); ctx.stroke(); e.preventDefault(); };
    const stop=()=>{ drawing=false; };
    canv.addEventListener("mousedown",start); canv.addEventListener("mousemove",move); window.addEventListener("mouseup",stop);
    canv.addEventListener("touchstart",start,{passive:false}); canv.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",stop);
  });
}

    toast(S.ex[id]==="ok"?"✓ Doğru olarak işaretlendi":S.ex[id]==="bad"?"✗ Hata listesine eklendi":"İşaret kaldırıldı"); const c=document.getElementById("q-ex-"+id); c&&c.querySelector(`[data-mark="${d.mark}"]`).focus(); return; }
  if(d.dbscore!==undefined){ const v=+d.dbscore; S.db[d.id] = S.db[d.id]===v ? undefined : v; save(); render(); const c=document.getElementById("q-db-"+d.id); c&&c.querySelector(`[data-dbscore="${v}"]`).focus(); return; }
  if(d.expandall==="ex"){ const any=EX.some(x=>!S.exOpen[x.id]); EX.forEach(x=>S.exOpen[x.id]=any); save(); render(); return; }
  if(d.bkpick){ const [id,i]=d.bkpick.split(":"), b=BK_BY[id]; S.bkPick[id]=+i; S.bk[id]= +i===b.m.c ? "ok":"bad"; save(); render(); const c=document.getElementById("q-bk-"+id); c&&c.querySelector(".sol")&&c.querySelector(".sol").scrollIntoView({block:"nearest"}); return; }
  if(d.bkretry){ delete S.bkPick[d.bkretry]; save(); render(); return; }
  if(d.bksol){ const id=d.bksol, k="bks:"+id; S.open[k]=!S.open[k]; if(S.open[k] && !S.bk[id] && BK_BY[id].kind==="C") S.bk[id]="seen"; save(); render(); return; }
  if(d.bkhint){ const k="bkh:"+d.bkhint; S.open[k]=!S.open[k]; save(); render(); return; }
  if(d.bkchk){ const id=d.bkchk, b=BK_BY[id], vals=S.bkIn[id]||[]; let any=false, all=true;
    b.p.parts.forEach((x,i)=>{ const v=(vals[i]||"").trim(); if(!v){ all=false; return; } any=true; if(!bkOK(x,v)) all=false; });
    if(!any){ toast("Önce cevap kutularına sayı yaz."); return; }
    S.open["bkc:"+id]=true; S.bk[id]= all ? "ok":"bad"; save(); render(); toast(all?"✓ Hepsi doğru":"✗ Yanlış olanları düzelt ya da ipucuna bak"); return; }
  if(d.bkmark){ const id=d.id; S.bk[id] = S.bk[id]===d.bkmark ? undefined : d.bkmark; save(); render(); return; }
  if(d.bkf){ const v=d.bkf.split(":"); if(v[0]==="set"){ S.bkf={kind:v[1], ch:v[2], st:v[3]}; } else { S.bkf[v[0]]=v[1]; } if(S.bkf.st==="round") BK_ROUND=null; S.bkN=10; save(); if(S.tab!=="banka") go("banka"); else render(); return; }
  if(d.bkmore){ S.bkN=(S.bkN||10)+10; save(); render(); return; }
  if(d.trq){ const art=t.closest("article"), open=!art.classList.contains("tr-open"); art.classList.toggle("tr-open",open); t.setAttribute("aria-expanded",String(open)); return; }
  switch(t.id){
    case "qtCheck": { const blank=QT.filter(q=>S.qt[q.id]===undefined).length; S.qtDone=true; if(!S.plan.p1) S.plan.p1=true; save(); render(); toast(blank?`${blank} boş soru yanlış sayıldı`:"Kontrol edildi"); return; }
    case "qtReset": if(confirm("Hızlı test cevapları silinsin mi?")){ S.qt={}; S.qtDone=false; save(); render(); toast("Hızlı test sıfırlandı"); } return;
    case "daCheck": { const blank=DA.filter(q=>S.da[q.id]===undefined).length; S.daDone=true; save(); render(); toast(blank?`${blank} boş soru yanlış sayıldı`:"Part A kontrol edildi"); return; }
    case "daReset": if(confirm("Part A cevapları silinsin mi?")){ S.da={}; S.daDone=false; save(); render(); toast("Part A sıfırlandı"); } return;
    case "tStart": if(!S.timer){ if(S.tBase==null) S.tBase=DUR; S.timer=Date.now(); save(); tick(); toast("Süre başladı"); } return;
    case "tPause": if(S.timer){ S.tBase=tLeftMs(); S.timer=null; save(); tick(); } return;
    case "tReset": S.timer=null; S.tBase=DUR; save(); tick(); return;
    case "pomoToggle": if(pomo.run){ pomo.left=pomoLeft(); pomo.run=false; t.textContent="Başlat"; } else { pomo.run=true; pomo.at=Date.now(); t.textContent="Durdur"; toast("🍅 25 dk Pomodoro başladı"); } tick(); return;
    case "pomoReset": pomo={left:25*60,run:false,at:0}; $("#pomoToggle").textContent="Başlat"; tick(); return;
    case "searchBtn": openSearch(); return;
    case "copyBtn": { const txt=summaryText(); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("İlerleme özeti kopyalandı"),()=>prompt("Kopyala:",txt)); return; }
    case "resetAll": if(confirm("Tüm ilerleme (plan, test, deneme, örnek, kart ve karalama) silinsin mi? Geri alınamaz.")){ const th=S.theme; S=JSON.parse(JSON.stringify(DEF)); S.theme=th; S.tab="ilerleme"; save(); render(); toast("Tüm ilerleme sıfırlandı"); } return;
    case "glossBtn": S.gloss = S.gloss===false; save(); render(); toast(S.gloss?"Türkçe karşılıklar açık":"Türkçe karşılıklar kapalı"); return;
    case "themeBtn": { const r=document.documentElement, cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); r.dataset.theme=cur==="dark"?"light":"dark"; S.theme=r.dataset.theme; save(); return; }
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.plan){ S.plan[t.dataset.plan]=t.checked; t.closest("li").classList.toggle("done",t.checked); save(); return; }
  if(t.dataset.mc){ (t.dataset.mc==="qt"?S.qt:S.da)[t.dataset.qid]=+t.value; save(); return; }
});
document.addEventListener("toggle",e=>{ const t=e.target; if(t.dataset && t.dataset.openkey){ S.open[t.dataset.openkey]=t.open; save(); } }, true);
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset && t.dataset.scinput!==undefined){ S.scratch[t.dataset.scinput]=t.value; save(); return; }
  if(t.dataset && t.dataset.bkin){ const [id,i]=t.dataset.bkin.split(":"); (S.bkIn[id]=S.bkIn[id]||[])[+i]=t.value; t.classList.remove("ok","bad"); save(); return; }
  if(t.dataset && t.dataset.bknote){ S.bkNote[t.dataset.bknote]=t.value; save(); return; }
  if(t.id==="searchModalInput"){ renderSearch(t.value); return; }
});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openSearch(); return; }
  const modalOpen=!$("#searchModal").hidden;
  if(modalOpen && e.key==="Escape"){ closeSearch(); return; }
  if(modalOpen && e.key==="Enter" && e.target.id==="searchModalInput"){ e.preventDefault(); const r=RESULTS[0]; if(r){ $("#searchModal").hidden=true; r.run(); } return; }
  if(e.target.dataset && e.target.dataset.fcflip && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.target.click(); return; }
  if(e.target.getAttribute && e.target.getAttribute("role")==="tab" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){
    const i=TABS.findIndex(([k])=>k===S.tab), n=(i+(e.key==="ArrowRight"?1:-1)+TABS.length)%TABS.length; go(TABS[n][0]); $("#tab-"+TABS[n][0]).focus();
  }
});
$("#searchModal").addEventListener("click",e=>{ if(e.target.id==="searchModal") closeSearch(); });
window.addEventListener("hashchange",()=>{ const k=LEGACY[location.hash.slice(1)]||location.hash.slice(1); if(TABS.some(([t])=>t===k) && k!==S.tab) go(k); });

/* ---------- boot ---------- */
if(S.theme) document.documentElement.dataset.theme=S.theme;
S.tab = LEGACY[S.tab]||S.tab;
{ const h0=LEGACY[location.hash.slice(1)]||location.hash.slice(1); if(TABS.some(([k])=>k===h0)) S.tab=h0; }
if(!TABS.some(([k])=>k===S.tab)) S.tab="plan";
countdown(); setInterval(countdown,30000);
function boot(){ render(); if(location.hash.slice(1)!==S.tab) history.replaceState(null,"","#"+S.tab); }
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
</script>
</body>
</html>
